---
- name: Configure Pangolin Zero Trust infrastructure
  hosts: pangolin

  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    - name: Load Pangolin backup healthcheck URL from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        pangolin_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_pangolin_url.value | default('') }}"
        pangolin_geoip_healthcheck_url: "{{ terraform_outputs.uptime_cron_geoip_url.value | default('') }}"
        # Jeton d'accès Pangolin de l'agent Beszel (en-têtes HUB_HEADERS).
        beszel_agent_hub_headers: "{{ terraform_outputs.beszel_agent_hub_headers.value[inventory_hostname] | default('') }}"
        # Jeton d'accès Pangolin de l'agent de journaux (en-têtes P-Access-Token-*).
        log_agent_pangolin_token_id: "{{ terraform_outputs.log_agent_access_tokens.value[inventory_hostname].id | default('') }}"
        log_agent_pangolin_token: "{{ terraform_outputs.log_agent_access_tokens.value[inventory_hostname].token | default('') }}"

  roles:
    - role: geerlingguy.docker
      become: true
      tags: setup
    - role: borgmatic
      tags: backup,setup
    - role: security
      become: true
      tags: security
    # Internet egress of the servers with no public IP (flip). After security:
    # the forwarding rule is an ufw rule.
    - role: nat_gateway
      tags: nat
    - role: pangolin
      tags: pangolin
    # Agent de supervision, vers le hub par sa ressource publique (PASS sur
    # /api/beszel/agent-connect, jeton d'accès Pangolin en en-têtes). Mode
    # compose : Pangolin n'a pas docker_service (ni dc@ ni lingering), la
    # restart policy relance l'agent au démarrage, comme sur le NAS.
    - role: beszel_agent
      tags: beszel_agent,monitoring
      vars:
        beszel_agent_mode: compose
        beszel_agent_hub_url: "https://monitoring.sylvain.cloud"
    # Agent de journaux : journal de l'hôte, conteneurs (CrowdSec compris) et
    # journal d'accès de Traefik, vers VictoriaLogs par sa ressource publique
    # (PASS sur /insert/jsonline, jeton d'accès Pangolin). Mode compose, comme
    # l'agent Beszel.
    - role: log_agent
      tags: log_agent,monitoring
      vars:
        log_agent_mode: compose
        log_agent_url: "https://logs.sylvain.cloud"
        # pangolin_dir (rôle pangolin) /config/traefik/logs, où Traefik écrit access.log.
        log_agent_traefik_log_dir: /opt/pangolin/config/traefik/logs

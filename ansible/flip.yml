---
# Serveur Hetzner "flip" (tofu/pangolin/flip.tf), dédié à Flip Planning :
# production et démo. Pas d'IP publique : Pangolin l'atteint par le newt qui
# tourne dessus (site "flip", tofu/pangolin_config/nodes.tf), et il sort sur
# Internet par Pangolin, qui fait NAT.
#
# Ordre au premier déploiement :
#   1. tofu/pangolin (serveur + route NAT), puis pangolin.yaml --tags nat,security
#      (passerelle NAT, et AllowTcpForwarding local pour le ProxyJump) ;
#   2. tofu/pangolin_config, CIBLÉ sur le site pour ne pas encore basculer les
#      targets : -target=pangolin_site.flip -target=pangolin_site_resource.flip ;
#   3. ce playbook avec --skip-tags backup, puis 00-setup.yaml --limit flip :
#      00-setup installe des paquets (il lui faut le NAT que nat_client pose ici
#      en premier) et la clé github-actions.pub, sans laquelle la CI n'entre pas ;
#   4. migration des données, apply complet de tofu/pangolin_config (bascule des
#      targets), et AUSSITÔT decommission_app de flip_planning et demo_planning
#      sur l'hôte docker (sans destroy_remote_backup). Tant que les deux
#      instances tournent sur la même base de données copiée, les deux envoient
#      les rappels de la veille aux animateurs ; et elles partagent les dépôts
#      Borg et l'URL push Uptime Kuma, qu'un seul hôte doit alimenter ;
#   5. ce playbook --tags backup : pas avant, sinon les archives de bases vides
#      de flip s'ajoutent aux dépôts de production et comptent dans la rétention.
- name: Configure the Flip Planning server
  hosts: flip
  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    # The newt credentials come from the state too, rather than from
    # secrets.sops.yaml: the site is created by tofu/pangolin_config, which
    # already holds them.
    #
    # Never set_fact a name the flip_planning role reads: a fact outranks the
    # `vars:` of a `roles:` entry, so every instance would get its value. The
    # production URL used to be set_fact'd as flip_planning_backup_healthcheck_url
    # itself, and the demo's override lost to it: the demo's backups pushed to
    # the production monitor. Each URL is now handed to its instance below.
    - name: Load healthcheck URLs and newt credentials from Terraform state outputs
      tags: always
      ansible.builtin.set_fact:
        prod_planning_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_flip_planning_url.value | default('') }}"
        demo_planning_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_demo_planning_url.value | default('') }}"
        newt_client_id: "{{ terraform_outputs.flip_newt_id.value | default('') }}"
        newt_client_secret: "{{ terraform_outputs.flip_newt_secret.value | default('') }}"

    # An empty NEWT_ID starts a newt that retries forever without saying why.
    - name: Fail clearly when the flip site has no newt credentials
      tags: newt,setup
      ansible.builtin.assert:
        that:
          - newt_client_id | length > 0
          - newt_client_secret | length > 0
        fail_msg: >-
          flip_newt_id / flip_newt_secret are missing from the pangolin_config
          state: apply tofu/pangolin_config (pangolin_site.flip) first.

  roles:
    # First: everything after it needs the Internet.
    - role: nat_client
      tags: nat,setup
    - role: geerlingguy.docker
      become: true
      tags: setup
    - role: docker_service
      tags: setup
    - role: host_tuning
      tags: tuning,setup
    - role: security
      become: true
      tags: security,setup
    - role: borgmatic
      tags: backup,setup
    - role: decommission_app
      tags: [decommission, never]
    - role: newt
      tags: newt,setup
    # Production: the festival's instance, hence the festival's visuals. Role
    # parameters rather than host_vars so that they brand this instance only;
    # paths are relative to the role's files/ directory. The Pangolin
    # healthcheck of the assets target probes the logo by name, so a rename here
    # must follow in tofu/pangolin_config/website_flip_planning.tf.
    - role: flip_planning
      tags: flip_planning,app
      vars:
        flip_planning_branding_logo: flip/flip.png
        flip_planning_branding_pdf_logo: flip/flip-logo.png
        flip_planning_branding_pdf_strip: flip/flip-strip.png
        flip_planning_branding_mascot: flip/flip-woopy.png
        flip_planning_branding_mascot_icon: flip/flip-woopy-loader.png
        flip_planning_backup_healthcheck_url: "{{ prod_planning_backup_healthcheck_url }}"
    # Demo environment: the same role, a second time, with its own compose
    # project directory, systemd unit, containers, docker network, database and
    # Borg repository. Only what cannot be shared is overridden here — the
    # mentions légales are inherited from the role defaults and from
    # secrets.sops.yaml. The image is the exception: production follows the
    # vX.Y.Z releases, the demo the latest main (see the role defaults). The
    # branding images are deliberately NOT set: the demo runs unbranded (the
    # role defaults are empty), so that a screenshot of it cannot pass for the
    # festival's planning.
    #
    # These `vars:` win over the role defaults, host_vars/flip and the
    # flip_planning_* keys of secrets.sops.yaml, but NOT over a set_fact of the
    # same name (see the pre_tasks).
    - role: flip_planning
      tags: demo_planning,app
      vars:
        flip_planning_service: demo_planning
        flip_planning_container_prefix: demo-planning
        flip_planning_domain: demo-planning.sylvain.dev
        flip_planning_image: "{{ flip_planning_image_main }}"
        flip_planning_sentry_environment: demo
        flip_planning_branding_product_name: "Flip Planning — Démo"
        # Demo traffic has no business in the production audience statistics.
        flip_planning_cloudflare_web_analytics_token: ""
        # Freezing the date is what a demo is for, and nothing real goes out
        # from here: the mail sink delivers nothing and the animateurs of this
        # instance are fictional.
        flip_planning_horloge_simulee_autorisee: true
        # Own credentials throughout: a leaked demo password must not open the
        # real planning, and the MCP tokens are bound to the Pangolin resource.
        flip_planning_db_password: "{{ demo_planning_db_password }}"
        flip_planning_pgadmin_password: "{{ demo_planning_pgadmin_password }}"
        flip_planning_admin_password: "{{ demo_planning_admin_password }}"
        flip_planning_session_encryption_key: "{{ demo_planning_session_encryption_key }}"
        flip_planning_mcp_api_key: "{{ demo_planning_mcp_api_key }}"
        flip_planning_mcp_pangolin_access_token_id: "{{ demo_planning_mcp_pangolin_access_token_id }}"
        flip_planning_mcp_pangolin_access_token: "{{ demo_planning_mcp_pangolin_access_token }}"
        flip_planning_backup_enabled: "{{ demo_planning_backup_enabled }}"
        flip_planning_backup_borgmatic_target: "{{ demo_planning_backup_borgmatic_target }}"
        flip_planning_backup_encryption_passphrase: "{{ demo_planning_backup_encryption_passphrase }}"
        flip_planning_backup_healthcheck_url: "{{ demo_planning_backup_healthcheck_url }}"
    # TEMPORARY third instance, demo-planning-kc.sylvain.dev: the pull request
    # that makes Keycloak mandatory (planning-equipes#72), on a real domain in
    # HTTPS — what passkeys need, and what the local stack cannot give — with
    # its own Keycloak under /auth and the application's themed account
    # console. Both images follow the PR's `pr-72` tag, published by the app
    # repo's image workflows while the PR carries the `publier-image` label.
    #
    # Skipped until its secrets exist (the `when`), so a full run of this
    # playbook before they are in secrets.sops.yaml changes nothing. Brought up
    # in two passes, both automatic: Keycloak and the application first,
    # break-glass door open; then, once terraform/keycloak of the app repo has
    # created the realm and its two client secrets are in sops, the next run
    # turns OIDC on by itself (flip_planning_oidc_enabled below).
    #
    # No backup and no Uptime Kuma push monitor: a test bench, torn down with
    # the remove-app skill once the PR is merged.
    - role: flip_planning
      tags: demo_planning_kc,app
      when: demo_planning_kc_db_password is defined
      vars:
        flip_planning_service: demo_planning_kc
        flip_planning_container_prefix: demo-planning-kc
        flip_planning_domain: demo-planning-kc.sylvain.dev
        flip_planning_image: "ghcr.io/sylvainmetayer/planning-equipes:pr-72"
        flip_planning_sentry_environment: demo-kc
        flip_planning_branding_product_name: "Flip Planning — Keycloak"
        flip_planning_cloudflare_web_analytics_token: ""
        flip_planning_horloge_simulee_autorisee: true
        flip_planning_keycloak_enabled: true
        flip_planning_keycloak_image: "ghcr.io/sylvainmetayer/planning-equipes-keycloak:pr-72"
        # pr-72 moves with every push to the PR: pull it at each start, the
        # dc@ unit no longer does it for every application.
        flip_planning_image_pull_policy: always
        flip_planning_keycloak_db_password: "{{ demo_planning_kc_keycloak_db_password }}"
        flip_planning_keycloak_admin_password: "{{ demo_planning_kc_keycloak_admin_password }}"
        flip_planning_oidc_enabled: "{{ (demo_planning_kc_oidc_client_secret | default('')) | length > 0 }}"
        flip_planning_oidc_client_secret: "{{ demo_planning_kc_oidc_client_secret | default('') }}"
        flip_planning_oidc_provisioning_client_secret: "{{ demo_planning_kc_oidc_provisioning_client_secret | default('') }}"
        # A test bench: the break-glass door stays open next to Keycloak, the
        # way back in when a realm change goes wrong.
        flip_planning_admin_secours_enabled: true
        flip_planning_db_password: "{{ demo_planning_kc_db_password }}"
        flip_planning_pgadmin_password: "{{ demo_planning_kc_pgadmin_password }}"
        flip_planning_admin_password: "{{ demo_planning_kc_admin_password }}"
        flip_planning_session_encryption_key: "{{ demo_planning_kc_session_encryption_key }}"
        flip_planning_mcp_api_key: "{{ demo_planning_kc_mcp_api_key }}"
        flip_planning_mcp_pangolin_access_token_id: ""
        flip_planning_mcp_pangolin_access_token: ""
        flip_planning_backup_enabled: false

[tasks.install]
description = "Install project dependencies"
run = [
    'ansible-galaxy role install -r "requirements.yml" --force',
    'ansible-galaxy collection install -r "requirements.yml" --force'
]
sources = ['requirements.yml']

[tasks.lint]
description = "Run ansible-lint"
run = "ansible-lint"

[tasks.lint-fix]
description = "Run ansible-lint with auto-fix"
run = "ansible-lint --fix"

[tasks.ssh]
description = "SSH into the managed host"
run = '''
ip=$(ansible-inventory --host docker | jq -r '.ansible_host')
ssh -i ~/.ssh/keepassxc.pub sylvain@$ip
'''
raw = true

[tasks.ssh_pi]
description = "SSH into the managed host"
run = '''
ip=$(ansible-inventory --host pi | jq -r '.ansible_host')
ssh -i ~/.ssh/keepassxc.pub sylvain@$ip
'''
raw = true

[tasks.ssh_flip]
description = "SSH into the flip server (no public IP: ProxyJump via Pangolin, see inventory/hetzner.py)"
run = '''
host=$(ansible-inventory --host flip)
ssh -i ~/.ssh/keepassxc.pub $(echo "$host" | jq -r '.ansible_ssh_common_args') sylvain@$(echo "$host" | jq -r '.ansible_host')
'''
raw = true

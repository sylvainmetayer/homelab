[tasks.install]
description = "Install project dependencies"
run = [
    'ansible-galaxy role install -r "requirements.yml" --force',
    'ansible-galaxy collection install -r "requirements.yml" --force'
]
sources = ['requirements.yml']

[tasks.lint]
description = "Run ansible-lint"
run = "ansible-lint"

[tasks.lint-fix]
description = "Run ansible-lint with auto-fix"
run = "ansible-lint --fix"

[tasks.ssh]
description = "SSH into the docker VM (Proxmox)"
run = '''
ip=$(ansible-inventory --host docker | jq -r '.ansible_host')
ssh -i ~/.ssh/keepassxc.pub sylvain@$ip
'''
raw = true

[tasks.ssh_pi]
description = "SSH into the Raspberry Pi (local network only)"
run = '''
ip=$(ansible-inventory --host pi | jq -r '.ansible_host')
ssh -i ~/.ssh/keepassxc.pub sylvain@$ip
'''
raw = true

[tasks.ssh_newt]
description = "SSH into the Newt LXC (site proxmox-lxc, local network only)"
# Clé d'hôte vérifiée contre ansible/known_hosts, comme Ansible. Hôte statique :
# seul inventory/hosts est lu, sans les tofu show de proxmox.py et hetzner.py
# (la tâche reste utilisable quand le state S3 ou Pangolin ne répond pas).
run = '''
ip=$(ansible-inventory -i inventory/hosts --host newt-lxc | jq -er '.ansible_host') || exit 1
ssh -i ~/.ssh/keepassxc.pub -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "sylvain@$ip"
'''
raw = true

[tasks.ssh_flip]
description = "SSH into the flip server (no public IP: jump via Pangolin, see inventory/hetzner.py)"
# eval : ansible_ssh_common_args porte un ProxyCommand entre guillemets, qu'un
# simple $(...) découperait aux espaces. Clés d'hôte vérifiées contre
# ansible/known_hosts, comme Ansible.
run = '''
host=$(ansible-inventory --host flip)
eval "ssh -i ~/.ssh/keepassxc.pub -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes $(echo "$host" | jq -r '.ansible_ssh_common_args') sylvain@$(echo "$host" | jq -r '.ansible_host')"
'''
raw = true

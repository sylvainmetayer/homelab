---
- name: Test
  hosts: localhost
  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

  tasks:
    - name: Extract uptime_backup_nextcloud_url from Terraform state outputs
      ansible.builtin.set_fact:
        uptime_backup_nextcloud_url: "{{ terraform_outputs.uptime_backup_nextcloud_url.value }}"

    - name: Display uptime_backup_nextcloud_url
      ansible.builtin.debug:
        msg: "{{ uptime_backup_nextcloud_url }}"

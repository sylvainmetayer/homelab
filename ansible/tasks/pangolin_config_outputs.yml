---
# Pré-tâches communes (import_tasks) à 00-setup.yaml, docker.yml, flip.yml,
# lxc.yml, nas.yml, pangolin.yaml, pi.yml, pve.yml et au playbook d'essai
# test.yaml :
#   - charge secrets/ansible.sops.yaml (sous-module secrets/, ADR 0018) dans
#     l'espace global ;
#   - lit les sorties de tofu/pangolin_config (`tofu output -json`, module
#     initialisé) et les pose dans le fact `terraform_outputs`.
#
# Chaque playbook fait ensuite son propre set_fact
# `<variable>: "{{ terraform_outputs.<sortie>.value | default('') }}"` : la
# liste des sorties lues est propre à chaque hôte, et
# tofu/pangolin_config/tests/invariants.tftest.hcl cherche ces chaînes
# `terraform_outputs.<sortie>.value` dans les playbooks eux-mêmes.
#
# Ne jamais set_fact ici un nom que lit un rôle instancié plusieurs fois
# (flip_planning) : un set_fact l'emporte sur les `vars:` d'une entrée `roles:`
# (cf. flip.yml, AGENTS.md). Le converge Molecule de flip_planning le vérifie
# sur ce fichier comme sur les pre_tasks de flip.yml.
- name: Load secrets and the pangolin_config state outputs
  tags: always
  block:
    # community.sops.load_vars range les secrets dans la couche include_vars
    # (return_method: vars-only, ansible-core 2.21+, qui échoue franchement en
    # dessous au lieu de les renvoyer comme faits) : ils l'emportent sur les
    # vars: du play et des entrées roles:, perdent face à un set_fact. Une clé
    # de secrets/ansible.sops.yaml ne doit donc jamais porter le nom d'une variable
    # qu'un playbook surcharge (cf. flip.yml, AGENTS.md).
    # Export your age key in environment
    # https://github.com/mozilla/sops/issues/933#issuecomment-1081228720
    - name: Load secrets variable into global namespace
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/ansible.sops.yaml"
        expressions: evaluate-on-load
        return_method: vars-only

    # Lecture par `tofu output -json` dans le vrai module (initialisé : le
    # backend S3 et, plus tard, le chiffrement du state sont ceux du module,
    # Ansible ne les connaît pas). La sortie a la forme de l'ancien `.outputs`
    # du state, {nom: {sensitive, type, value}}, d'où
    # `terraform_outputs.<nom>.value`.
    # Environnement, jamais un argument de ligne de commande : identifiants S3
    # du state (clés de secrets/ansible.sops.yaml, lecture seule sur ce seul
    # state) et passphrase DÉDIÉE du state (encryption.tf du module). Elle vient
    # de `tofu_state_passphrase` (secrets/ansible.sops.yaml : la clé Age de la
    # CI ne déchiffre pas le fichier racine secrets.sops.yaml), sinon de
    # TF_VAR_pangolin_config_state_passphrase que mise exporte sur un poste.
    # Le repli `unencrypted` du module fait marcher la lecture que le state soit
    # encore en clair ou déjà chiffré ; sans repli, une passphrase absente ou
    # fausse échoue.
    # no_log : `stdout` est l'ensemble des sorties, secrets compris (identifiants
    # Newt, jetons d'accès Pangolin), qu'un -v écrirait dans run.log.
    # run_once : une lecture par run, le résultat enregistré vaut pour tous les
    # hôtes de la play.
    # failed_when: false : l'échec est traité par les deux tâches suivantes, sa
    # cause n'étant pas lisible sous no_log.
    # check_mode: false : une lecture, sans effet ; en --check, command ne
    # lancerait rien et toute la suite tournerait sans terraform_outputs (URL
    # push vides, assert des identifiants Newt de flip.yml en échec).
    - name: Read the pangolin_config outputs with tofu
      delegate_to: localhost
      run_once: true
      no_log: true
      check_mode: false
      changed_when: false
      failed_when: false
      environment:
        AWS_ACCESS_KEY_ID: "{{ state_s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ state_s3_secret_key }}"
        TF_VAR_pangolin_config_state_passphrase: "{{ tofu_state_passphrase | default(lookup('ansible.builtin.env', 'TF_VAR_pangolin_config_state_passphrase'), true) }}"
        TF_INPUT: "0"
        # Le state lu est celui du workspace default, pas celui qu'un shell
        # aurait choisi (un autre workspace se lirait vide, sans erreur).
        TF_WORKSPACE: default
      ansible.builtin.command:
        argv:
          - tofu
          - -chdir={{ playbook_dir }}/../tofu/pangolin_config
          - output
          - -json
          - -no-color
      register: terraform_state_raw

    # pangolin_config_outputs_optional (00-setup.yaml seulement) : un state
    # illisible n'arrête pas la play, terraform_outputs vaut alors {} et chaque
    # sortie lue retombe sur son default('').
    # rc 0 et aucune sortie (`{}`) : state absent ou vide (clé ou workspace
    # erroné), traité comme un échec, sinon chaque rôle retomberait en silence
    # sur ses default('').
    - name: Fail when the pangolin_config outputs cannot be read
      when:
        - terraform_state_raw.rc | default(1) != 0
          or terraform_state_raw.stdout | default('') | trim in ['', '{}']
        - not (pangolin_config_outputs_optional | default(false) | bool)
      run_once: true
      ansible.builtin.fail:
        msg: >-
          Lecture des sorties de tofu/pangolin_config impossible (rc
          {{ terraform_state_raw.rc | default('?') }}). Module non initialisé
          ou provider du fork absent : lancer `mise run provider-fork` puis
          `tofu -chdir=tofu/pangolin_config init`. Sinon identifiants S3
          (state_s3_*), passphrase du state (tofu_state_passphrase ou
          TF_VAR_pangolin_config_state_passphrase, donc `mise exec --`) ou binaire
          tofu absent du PATH. rc 0 sans aucune sortie : state vide ou absent
          sur S3. Début de l'erreur de tofu :
          {{ (terraform_state_raw.stderr | default(terraform_state_raw.msg | default('')))[:400] }}

    - name: Warn that the pangolin_config state could not be read
      when: >-
        terraform_state_raw.rc | default(1) != 0
        or terraform_state_raw.stdout | default('') | trim in ['', '{}']
      run_once: true
      ansible.builtin.debug:
        msg: >-
          AVERTISSEMENT : sorties de tofu/pangolin_config illisibles (module
          non initialisé, S3 ou identifiants), terraform_outputs = {} : les
          URL qui en viennent sont vides pour ce run.

    # no_log : les sorties comprennent des secrets (identifiants Newt, jetons
    # d'accès Pangolin), qu'un -v afficherait dans run.log. Un set_fact d'un
    # playbook qui en recopie une sensible (newt_client_secret de flip.yml)
    # porte aussi no_log.
    - name: Expose the pangolin_config state outputs
      no_log: true
      ansible.builtin.set_fact:
        terraform_outputs: >-
          {{ (terraform_state_raw.stdout | from_json)
             if terraform_state_raw.rc | default(1) == 0 else {} }}

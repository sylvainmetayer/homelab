---
- name: Configure PI
  hosts: pi
  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    - name: Load healthcheck URLs from Terraform state outputs
      tags: always
      ansible.builtin.set_fact:
        immich_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_immich_url.value | default('') }}"

  roles:
    - role: geerlingguy.docker
      become: true
      tags: setup
    - role: docker_service
      tags: setup
    - role: borgmatic
      tags: backup,setup
    - role: decommission_app
      tags: [decommission, never]
    - role: newt
      tags: newt,setup
    - role: immich
      tags: app,immich

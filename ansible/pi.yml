---
- name: Configure PI
  hosts: pi
  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    - name: Load healthcheck URLs from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        immich_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_immich_url.value | default('') }}"

  roles:
    - role: geerlingguy.docker
      become: true
      tags: setup
    - role: docker_service
      tags: setup
    - role: host_tuning
      tags: tuning,setup
    - role: security
      become: true
      tags: security,setup
    - role: borgmatic
      tags: backup,setup
    - role: decommission_app
      tags: [decommission, never]
    - role: newt
      tags: newt,setup
    - role: immich
      tags: app,immich
    # Agent de supervision, vers le hub de la VM docker par le LAN.
    - role: beszel_agent
      tags: beszel_agent,monitoring
  tasks:
    # Restes d'avant Pangolin, quand nginx et Let's Encrypt servaient Immich
    # depuis le Pi : le certificat de photos.sylvain.cloud (expiré depuis
    # avril 2026, le domaine pointe sur Pangolin) échouait chaque nuit à 04:30
    # et le cron l'envoyait par mail. Gardé pour qu'une restauration du Pi ne
    # les ramène pas.
    # Un Pi reconstruit sans le paquet cron n'a pas de crontab : le module cron
    # échouerait faute de binaire, alors qu'il n'y a rien à retirer.
    - name: Look for the crontab binary
      tags: [legacy_cleanup]
      ansible.builtin.stat:
        path: /usr/bin/crontab
      register: legacy_cleanup_crontab

    - name: Remove the legacy certbot renewal cron
      tags: [legacy_cleanup]
      when: legacy_cleanup_crontab.stat.exists
      become: true
      ansible.builtin.cron:
        name: Certbot automatic renewal.
        user: root
        state: absent

    - name: Purge the legacy certbot and nginx packages
      tags: [legacy_cleanup]
      become: true
      ansible.builtin.apt:
        name:
          - certbot
          - python3-certbot
          - nginx
          - nginx-common
          - libnginx-mod-*
        state: absent
        purge: true

    - name: Remove the legacy certbot and nginx configuration
      tags: [legacy_cleanup]
      become: true
      loop:
        - /etc/letsencrypt
        - /var/lib/letsencrypt
        - /var/log/letsencrypt
        - /etc/nginx
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent

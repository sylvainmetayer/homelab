[defaults]
inventory = ./inventory
# Ansible treats every file under inventory/ as a source; without this,
# the __pycache__ Python leaves next to proxmox.py warns on every command.
inventory_ignore_patterns = __pycache__
roles_path = ./galaxy_roles:./roles
collections_path = ./collections
retry_files_enabled = False
callbacks_enabled = timer, profile_tasks
host_key_checking = True
stdout_callback = debug
nocows = 1
# Facts only under ansible_facts[...], never as top-level ansible_* vars: the
# injection is deprecated (removed in ansible-core 2.24). The SOPS secrets no
# longer depend on it (community.sops.load_vars return_method: vars-only).
inject_facts_as_vars = False

#caching config
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ./facts
fact_caching_timeout = 1800

log_path=./run.log

[ssh_connection]
# Clés d'hôte vérifiées contre ansible/known_hosts (versionné), relatif au
# dossier ansible/ d'où partent toutes les commandes (mise, CI). Les trois
# premières options sont les ssh_args par défaut d'Ansible, qu'une valeur ici
# remplace.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=600s -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
# Une seule commande SSH par tâche au lieu de trois ou quatre (envoi du
# module, chmod, exécution, nettoyage) : à travers le tunnel OLM de la CI,
# c'est l'essentiel du temps d'un déploiement. Aucun hôte n'a requiretty
# dans sudoers (vérifié le 31/10/2026) ; ControlPersist à 10 min pour que
# la connexion survive aux longues tâches locales (build MkDocs, Homepage).
pipelining = True
# if True, make ansible use scp if the connection type is ssh
# (default is sftp)
scp_if_ssh = True
scp_extra_args = "-O"

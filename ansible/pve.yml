---
# Hôte Proxmox VE (#852) : l'agent Beszel, en binaire comme sur le
# LXC newt, le test de restauration des sauvegardes vzdump, l'alerte
# hebdomadaire des mises à jour en attente (ntfy), les modules noyau de
# l'accès de secours du LXC newt et le tmpdir de /etc/vzdump.conf. Le reste
# de l'hôte appartient à
# Proxmox (paquets, sshd, pare-feu) et à tofu/proxmox : ni 00-setup, ni
# security. Lancé à la main seulement (ansible-playbook pve.yml), jamais par
# la CI : aucune clé de l'hôte dans les secrets GitHub. Connexion en root,
# sans become (inventory/hosts).
#
# L'agent voit ce que la VM docker ne voit pas : la charge de l'hyperviseur
# (VM et LXC compris) et le S.M.A.R.T. du disque qui les porte tous, un SSD
# M.2 SATA (sda, lvm-thin local-lvm). Il parle au hub par le LAN
# (192.168.1.216:8090), connexion sortante : rien à ouvrir sur l'hôte.
- name: Configure the Proxmox VE host
  hosts: pve
  pre_tasks:
    # Secrets SOPS (jeton de l'agent Beszel, clé du hub, jeton ntfy des
    # scripts) et sorties du state de tofu/pangolin_config (terraform_outputs :
    # URL push du test de restauration et du moniteur « Mises à jour
    # Proxmox »). Comme ailleurs, un state illisible (S3, clés) arrête la
    # play quel que soit le tag : l'agent Beszel, lui, parle au hub par le
    # LAN, sans jeton Pangolin (comme nas.yml).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    - name: Load healthcheck URLs from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        vzdump_restore_test_healthcheck_url: "{{ terraform_outputs.uptime_cron_vzdump_restore_test_url.value | default('') }}"
        update_notify_healthcheck_url: "{{ terraform_outputs.uptime_cron_pve_updates_url.value | default('') }}"
  roles:
    - role: beszel_agent
      tags: beszel_agent,monitoring
      vars:
        beszel_agent_mode: binary
        # Les démons de Proxmox (pveproxy, pvedaemon, pve-cluster…).
        beszel_agent_service_patterns: "pve*"
        beszel_agent_smart_devices:
          - { path: /dev/sda }
    # Deux fois par mois, la dernière sauvegarde vzdump du LXC newt restaurée
    # sur un id jetable et démarrée sans réseau, celle de la VM docker
    # vérifiée en entier (docs/runbooks/test-restauration-vm.md).
    - role: vzdump_restore_test
      tags: vzdump_restore_test,vzdump
    # Mises à jour en attente, chaque lundi, publiées sur ntfy (topic
    # scripts), sécurité d'abord, sans rien installer : Proxmox n'a pas
    # d'unattended-upgrades et ne doit pas en avoir (un paquet pve-* ou un
    # noyau se met à jour VM arrêtées, docs/runbooks/mises-a-jour-proxmox-ugos.md).
    - role: update_notify
      tags: update_notify,monitoring
      vars:
        update_notify_mode: apt
  tasks:
    # Accès de secours (rôle wireguard_rescue du LXC newt, lxc.yml) : un LXC
    # non privilégié ne charge aucun module, il utilise ceux de l'hôte.
    # WireGuard du noyau, le suivi de connexion de nftables (ct state) et son
    # NAT (masquerade) qui fait répondre le LAN à l'IP du LXC. Persistant
    # (modules-load.d) : chargés à chaque démarrage, avant le LXC.
    - name: Load the kernel modules of the rescue WireGuard of the newt LXC
      tags: wireguard
      loop:
        - wireguard
        - nft_ct
        - nft_chain_nat
        - nft_masq
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present

    # Dossier temporaire de vzdump sur la racine de l'hôte, pas à côté de
    # l'archive : sur le NFS du NAS (storage nas-backup, tofu/proxmox), le tar
    # d'un LXC non privilégié (uid 100000) ne peut pas ouvrir le dossier que
    # vzdump y crée en root. Ici plutôt que dans le job : l'API réserve tmpdir
    # à root@pam. En mode snapshot il ne reçoit que la config du guest ; seul
    # un repli en mode suspend y copierait tout le rootfs du LXC (8 Go au
    # plus), sur la racine de l'hôte.
    - name: Keep the vzdump temporary directory local
      tags: vzdump
      ansible.builtin.lineinfile:
        path: /etc/vzdump.conf
        regexp: '^#?\s*tmpdir:'
        line: "tmpdir: /var/tmp"

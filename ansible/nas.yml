---
# NAS Ugreen (UGOS Pro) : unité dc@ des applis Docker du NAS, réglages NFS et
# exports du homelab, puis vérifications. Ni 00-setup, ni security, ni
# paquets : le système appartient à UGOS. Lancé à la main seulement
# (ansible-playbook nas.yml), jamais par la CI : aucune clé du NAS dans les
# secrets GitHub. La racine est un overlay sur l'eMMC : ce qui est posé dans
# /etc survit aux redémarrages, peut-être pas à une réinitialisation d'UGOS,
# d'où des rôles qui reposent et revérifient tout à chaque passage.
- name: Configure the NAS
  hosts: nas
  gather_facts: false
  pre_tasks:
    # Secrets SOPS (jeton de l'agent Beszel, clé du hub) et sorties du state de
    # tofu/pangolin_config (terraform_outputs : identifiants Newt du site nas,
    # URL push de la sauvegarde de Jellyfin).
    # Comme ailleurs, un state illisible (S3, clés) arrête la play quel que
    # soit le tag, --tags beszel_agent compris : l'agent Beszel, lui, parle au
    # hub par le LAN, sans jeton Pangolin.
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    # Identifiants Newt du site nas, lus dans le state plutôt que copiés dans
    # secrets.sops.yaml : le site est créé par tofu/pangolin_config, qui les
    # détient déjà. no_log : newt_client_secret, qu'un -v écrirait dans run.log.
    - name: Load the newt credentials from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        newt_client_id: "{{ terraform_outputs.nas_newt_id.value | default('') }}"
        newt_client_secret: "{{ terraform_outputs.nas_newt_secret.value | default('') }}"

    # Un NEWT_ID vide lance un newt qui réessaie sans fin sans dire pourquoi.
    - name: Fail clearly when the nas site has no newt credentials
      tags: newt
      ansible.builtin.assert:
        that:
          - newt_client_id | length > 0
          - newt_client_secret | length > 0
        fail_msg: >-
          nas_newt_id / nas_newt_secret absents du state de pangolin_config :
          appliquer d'abord tofu/pangolin_config (pangolin_site.nas).
        quiet: true

    - name: Load healthcheck URLs from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        jellyfin_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_jellyfin_url.value | default('') }}"
  roles:
    # dc@ en unité système, exécutée en root (host_vars/nas).
    # always : un `--tags beszel_agent` après une réinitialisation d'UGOS
    # (/etc effacé) doit reposer l'unité avant de démarrer dc@beszel_agent.
    - role: docker_service
      tags: [setup, always]
    # borgmatic dans son conteneur, lancé chaque nuit par borgmatic.timer
    # (host_vars/nas) : clé SSH du sous-compte nas, que backup.yaml dépose.
    - role: borgmatic
      tags: backup,setup
    - role: nas
      tags: nas
    # Agent de supervision sous dc@beszel_agent en unité système (ni lingering
    # ni groupe docker sous UGOS), réglé dans host_vars/nas.
    - role: beszel_agent
      tags: beszel_agent,monitoring
    - role: decommission_app
      tags: [decommission, never]
    # Connecteur du site Pangolin nas, sous dc@newt (unité système) : il sert
    # media.sylvain.cloud aux clients Pangolin, par le réseau Docker newt qu'il
    # crée et que rejoint le Traefik du NAS (nas_proxy).
    - role: newt
      tags: newt
    # Médiathèque sous dc@jellyfin (unité système), médias du dossier partagé
    # media en lecture seule, derrière le Traefik du NAS (nas_proxy) :
    # https://media.sylvain.cloud (:8443 en LAN, avec ou sans port par le
    # client Pangolin). Ses vérifications (dossier partagé, Quick Sync) ne
    # tournent que sous ce tag : un --tags beszel_agent n'en dépend pas.
    - role: jellyfin
      tags: jellyfin,app
    # Traefik du NAS sous dc@nas_proxy (unité système) : TLS (Let's Encrypt,
    # DNS-01 OVH) de media.sylvain.cloud et nas.sylvain.cloud (interface
    # d'UGOS), en :8443 sur le LAN. Après jellyfin : il rejoint en externe le
    # réseau media que crée dc@jellyfin, et newt, créé par dc@newt. Sur un NAS
    # neuf, --tags newt,jellyfin avant un --tags nas_proxy seul, sinon
    # dc@nas_proxy réessaie toutes les 15 s.
    - role: nas_proxy
      tags: nas_proxy,app

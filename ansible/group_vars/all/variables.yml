---
ansible_ssh_private_key_file: "~/.ssh/keepassxc.pub"
ansible_user: sylvain

# Backup configuration (used by all hosts)
borgmatic_config_dir: "/etc/borgmatic.d"

# Storage Box Hetzner pour les backups (remplace S3). Dossier du compte
# principal (ansible/backup.yaml) : un sous-dossier <hôte> par hôte sauvegardé.
backup_storage_box_path: "./backup"
# Racine des dépôts Borg de l'hôte : son sous-compte (tofu/pangolin,
# storage_box_subaccounts.tf), qui ne voit que backup/<hôte> et y a ses
# dépôts à la racine. backup_storage_box_subaccount vient de host_vars/<hôte>.
backup_storage_box_url: "ssh://{{ backup_storage_box_subaccount.username }}@{{ backup_storage_box_subaccount.server }}/."
# Clé SSH de root pour son sous-compte, générée sur l'hôte (rôle borgmatic) ;
# backup.yaml en dépose la partie publique chez le sous-compte.
backup_storage_box_ssh_key_path: /root/.ssh/borgmatic_storage_box_ed25519
# Clé d'hôte ed25519 de la Storage Box, la même sous chaque nom de sous-compte.
# Empreinte publiée par Hetzner : SHA256:XqONwb1S0zuj5A1CDxpOSuD2hnAArV1A3wKY7Z3sdgM.
backup_storage_box_host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs"

docker_base_path: /opt/apps

newt_endpoint: https://pangolin.sylvain.cloud

# Graine des secrets d'appli dérivés (mots de passe de base, clés de session,
# de chiffrement, jetons : sha256(app_secrets_seed ~ étiquette), un `defaults`
# de rôle chacun). Sans la clé SOPS `app_secrets_master`, la graine est
# `backup_passphrase`, et les valeurs restent celles d'avant : la séparation
# n'est réelle qu'une fois la clé créée puis `backup_passphrase` tournée
# (ADR 0034, docs/runbooks/rotation-des-secrets.md). La clé SOPS ne porte pas le
# nom de cette variable, que check_sops_shadowing.py refuse.
app_secrets_seed: "{{ app_secrets_master | default(backup_passphrase) }}"

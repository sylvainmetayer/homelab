---
- name: Base host setup
  hosts: all,!backups
  tags: setup
  # Setup de base : un state de pangolin_config illisible (bootstrap, S3 en
  # panne) ne l'arrête pas, ssh_login_notify avertit et ne touche à rien.
  vars:
    pangolin_config_outputs_optional: true
  post_tasks:
    # Un lineinfile à `line` sur deux lignes ne retrouvait jamais sa ligne et
    # ajoutait les deux à chaque passage : bloc balisé, et nettoyage unique des
    # copies laissées hors bloc tant que le bloc n'existe pas encore.
    - name: Read .bashrc
      ansible.builtin.slurp:
        path: /home/sylvain/.bashrc
      register: setup_bashrc

    - name: Remove the fzf and starship lines left by the old lineinfile
      when: "'# BEGIN ANSIBLE MANAGED BLOCK starship' not in (setup_bashrc.content | b64decode)"
      ansible.builtin.lineinfile:
        path: /home/sylvain/.bashrc
        regexp: '^(source /usr/share/doc/fzf/examples/key-bindings\.bash|eval "\$\(starship init bash\)")$'
        state: absent

    - name: Ensure starship and fzf are initialized in .bashrc
      ansible.builtin.blockinfile:
        path: /home/sylvain/.bashrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK starship"
        block: |-
          source /usr/share/doc/fzf/examples/key-bindings.bash
          eval "$(starship init bash)"
        insertafter: EOF
        create: false


  pre_tasks:
    # Charge secrets.sops.yaml et pose `terraform_outputs` (state de
    # tofu/pangolin_config, {} s'il est illisible), pour l'URL push de
    # ssh_login_notify.
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    # Un moniteur par hôte (tofu/pangolin_config/ssh_login_monitors.tf) ;
    # tests/invariants.tftest.hcl cherche cette chaîne ici. no_log : l'URL
    # porte le jeton du moniteur push (sortie sensible), qu'un -v écrirait
    # dans run.log.
    - name: Set the SSH login push URL of this host
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        ssh_login_notify_push_url: "{{ terraform_outputs.uptime_ssh_login_urls.value[inventory_hostname] | default('') }}"

    - name: Only run "update_cache=yes" if the last one is more than 3600 seconds ago
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "Install basic packages"
      become: true
      ansible.builtin.package:
        name:
          - git
          - git-lfs
          - unzip
          - htop
          - wget
          - curl
          - tmux
          - vim
          - rsync
          - jq
          - gnupg2
          - fzf
          - apt-transport-https
          - sudo
        state: present

    - name: Set timezone to Europe/Paris
      become: true
      community.general.timezone:
        name: Europe/Paris

    - name: Create user
      become: true
      ansible.builtin.user:
        name: "sylvain"
        shell: /bin/bash
        groups: sudo
        append: true
        password: "{{ host_user_password_hash }}"

    # Sans mot de passe : Ansible et la CI l'utilisent (become). Posé jusqu'ici
    # par cloud-init, absent d'un hôte qui n'en a pas eu (le LXC newt).
    - name: Let sylvain use sudo without a password
      become: true
      ansible.builtin.copy:
        content: "sylvain ALL=(ALL) NOPASSWD:ALL\n"
        dest: /etc/sudoers.d/90-sylvain
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    # Exclusive : une clé absente de keys/ est retirée de l'hôte. Une seule
    # tâche qui reçoit toutes les clés : en boucle, chaque passage effacerait
    # les précédentes. Un keys/ vide (glob sans résultat) donnerait une clé
    # vide et, en exclusive, retirerait toutes les clés : verrouillage.
    - name: Check that keys/ holds at least one public key
      ansible.builtin.assert:
        that: query('fileglob', playbook_dir + '/../keys/*.pub') | length > 0
        fail_msg: "Aucune clé dans keys/*.pub : authorized_keys exclusif viderait l'accès SSH."
        quiet: true

    - name: Set public keys
      ansible.posix.authorized_key:
        user: sylvain
        exclusive: true
        key: "{{ query('file', *query('fileglob', playbook_dir + '/../keys/*.pub')) | join('\n') }}"

  roles:
    - role: andrewrothstein.starship
      tags: setup,starship
    # Alerte Telegram (Uptime Kuma) à chaque connexion SSH, clé comprise.
    - role: ssh_login_notify
      become: true
      tags: ssh_login_notify,security

---
- name: Base host setup
  hosts: all,!backups
  tags: setup
  vars:
    tfstate_bucket: homelab-tf-state-sylvain
    tfstate_object_key: homelab/pangolin_config.tfstate
    tfstate_s3_endpoint: https://s3.eu-west-par.io.cloud.ovh.net
  post_tasks:
    - name: Ensure starship is initialized in .bashrc
      ansible.builtin.lineinfile:
        path: /home/sylvain/.bashrc
        line: |-
          source /usr/share/doc/fzf/examples/key-bindings.bash
          eval "$(starship init bash)"
        insertafter: EOF
        state: present
        create: false


  pre_tasks:
    # WARNING : You cannot override variables with this, make sure variable is not defined before.
    # Export your age key in environment
    # https://github.com/mozilla/sops/issues/933#issuecomment-1081228720
    - name: Load secrets variable into global namespace
      tags: always
      community.sops.load_vars:
        file: "{{ playbook_dir }}/secrets.sops.yaml"
        expressions: evaluate-on-load

    - name: Read Terraform state from S3 bucket
      delegate_to: localhost
      tags: always
      amazon.aws.s3_object:
        mode: getstr
        bucket: "{{ tfstate_bucket }}"
        object: "{{ tfstate_object_key }}"
        endpoint_url: "{{ tfstate_s3_endpoint }}"
        aws_access_key: "{{ state_s3_access_key }}"
        aws_secret_key: "{{ state_s3_secret_key }}"
      register: terraform_state_raw
      failed_when: false

    - name: Load SSH login healthcheck URL from Terraform state outputs
      tags: always
      ansible.builtin.set_fact:
        ssh_login_notification_healthcheck_url: "{{ terraform_outputs.uptime_ssh_login_url.value | default('') }}"
      vars:
        terraform_outputs: "{{ (terraform_state_raw.contents | default('{}') | from_json).outputs | default({}) }}"

    - name: Only run "update_cache=yes" if the last one is more than 3600 seconds ago
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "Install basic packages"
      become: true
      ansible.builtin.package:
        name:
          - git
          - git-lfs
          - unzip
          - htop
          - wget
          - curl
          - tmux
          - vim
          - rsync
          - jq
          - gnupg2
          - fzf
          - apt-transport-https
        state: present

    - name: Set timezone to Europe/Paris
      become: true
      community.general.timezone:
        name: Europe/Paris

    - name: Create user
      become: true
      ansible.builtin.user:
        name: "sylvain"
        shell: /bin/bash
        groups: sudo
        append: true
        password: "{{ password | password_hash('sha512', password) }}"

    - name: Set public keys
      loop: "{{ lookup('fileglob', playbook_dir + '/../keys/*.pub', wantlist=True) }}"
      ansible.posix.authorized_key:
        user: sylvain
        state: present
        key: "{{ lookup('file', item) }}"

  roles:
    - role: ssh_login_notification
      become: true
      tags: setup,security
    - role: andrewrothstein.starship
      tags: setup,starship

---
newt_client_id: "{{ newt_docker_client_id }}"
newt_client_secret: "{{ newt_docker_client_secret }}"

rss_backup_enabled: true

betisier_backup_enabled: true

monica_v4_backup_enabled: true

wiki_domain: "wiki.sylvain.cloud"
wiki_backup_enabled: true

nextcloud_backup_enabled: true

meerkat_crm_backup_enabled: true

paperless_backup_enabled: true

dawarich_backup_enabled: true

trek_backup_enabled: true

karakeep_backup_enabled: true

wishlist_backup_enabled: true

# Sous-compte Storage Box de docker (sauvegardes borgmatic) : clé SOPS
# backup_storage_box_subaccounts, recopiée de l'output storage_box_subaccounts
# de tofu/pangolin.
backup_storage_box_subaccount: "{{ backup_storage_box_subaccounts.docker }}"

# --- Durcissement (rôle security, lot 5 du plan) ---
# Hôte du LAN, derrière la box : SSH n'est ouvert qu'au réseau local (ton
# poste, le LXC newt par où passe la CI). Les ports publiés par Docker
# contournent ufw (leurs règles passent avant) : les applis passent par newt, rien d'autre n'écoute sur le LAN.
security_ufw_allowed_ports:
  - { port: "22", proto: tcp, from: 192.168.1.0/24 }
# Tout le LAN ne doit jamais être banni : la CI arrive par le LXC newt, et un
# agent qui présente trop de clés bannirait ton poste.
security_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.1.0/24
security_filesystem_whitelist:
  - vfat
# Après Pangolin (04:00) et flip (04:30), loin des sauvegardes (01:00).
security_unattended_reboot_time: "05:00"

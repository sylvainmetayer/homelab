---
newt_client_id: "{{ newt_docker_client_id }}"
newt_client_secret: "{{ newt_docker_client_secret }}"
# newt : memory.peak à 201 Mio le 2026-10-29 (82 % des 256m par défaut),
# relais de toutes les applis de la VM : ~2× ce pic.
newt_mem_limit: 512m

wiki_domain: "wiki.sylvain.cloud"
# Sous-compte Storage Box de docker (sauvegardes borgmatic) : clé SOPS
# backup_storage_box_subaccounts, recopiée de l'output storage_box_subaccounts
# de tofu/pangolin.
backup_storage_box_subaccount: "{{ backup_storage_box_subaccounts.docker }}"

# --- Durcissement (rôle security, lot 5 du plan) ---
# Hôte du LAN, derrière la box : SSH n'est ouvert qu'au réseau local (ton
# poste, le LXC newt par où passe la CI). Les ports publiés par Docker
# contournent ufw (leurs règles passent avant) : les applis passent par newt ;
# sur le LAN n'écoutent aussi, exprès, le hub Beszel (192.168.1.216:8090) et
# vmauth de VictoriaLogs (192.168.1.216:9428, pour les agents), chacun gardé par
# son propre compte.
security_ufw_allowed_ports:
  - { port: "22", proto: tcp, from: 192.168.1.0/24 }
# Tout le LAN ne doit jamais être banni : la CI arrive par le LXC newt, et un
# agent qui présente trop de clés bannirait ton poste.
security_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.1.0/24
security_filesystem_whitelist:
  - vfat
# Après Pangolin (04:00) et flip (04:30), loin des sauvegardes (01:00).
security_unattended_reboot_time: "05:00"

# Rapports (unattended-upgrades en échec, logwatch, cron) par msmtp, comme
# Pangolin et flip : sans relais, logwatch tire exim4 et le courrier de root
# reste non lu dans /var/mail/root.
security_mta_enabled: true

# --- Hub Beszel (rôle beszel) ---
# Port du hub publié aussi sur le LAN, pour les agents du Pi, du NAS et du
# LXC newt. Publié par Docker, donc avant ufw : l'interface répond sans SSO à
# tout le LAN, et le compte Beszel est alors la seule barrière.
beszel_publish_addresses:
  - 127.0.0.1
  - 192.168.1.216
# Compte propriétaire des systèmes de config.yml : l'adresse que le compte admin
# porte depuis la liaison Pocket ID (lue dans la base du hub le 2026-11-11). À
# changer ici si elle change dans Pocket ID, avant le prochain redémarrage.
beszel_systems_user_email: contact@sylvainmetayer.fr
# Superuser PocketBase du widget Beszel de Homepage : créé par le rôle beszel,
# utilisé par le rôle homepage (mot de passe : clé sops
# homepage_beszel_password). Jamais une adresse qui reçoit du courrier :
# PocketBase ne l'utilise que comme identifiant.
# Exige beszel_homepage_client_ip (ci-dessous) dans les « superuser IPs » du
# hub, ajoutée le 2026-10-29 à côté de l'IP publique déjà listée : sans elle,
# PocketBase répond 403 à la connexion. Pour couper le widget : vider cette
# valeur (procédure : docs/architecture.md, « La supervision »).
beszel_homepage_email: homepage@monitoring.sylvain.cloud
# Réseau du widget, créé par dc@beszel (interne, sous-réseau fixe) et rejoint
# par Homepage : la source de ses requêtes au hub est toujours
# beszel_homepage_client_ip, la seule adresse à ajouter aux « superuser IPs ».
# Hors du pool d'adresses par défaut de Docker (172.17-31.0.0/16), qu'aucun
# réseau créé sans sous-réseau ne peut donc prendre.
beszel_homepage_network: beszel_homepage
beszel_homepage_subnet: 172.16.97.0/29
beszel_homepage_hub_ip: 172.16.97.2
beszel_homepage_client_ip: 172.16.97.3

# Compte FreshRSS du widget de Homepage (mot de passe d'API : clé sops
# homepage_freshrss_api_password ; sans elle, pas de widget et API coupée).
homepage_freshrss_username: sylvain

# --- VictoriaLogs (rôle victoria_logs) ---
# vmauth publié aussi sur le LAN, pour les agents du Pi, du NAS et du LXC
# newt. Publié par Docker, donc avant ufw : tout le LAN l'atteint, et ses
# comptes (sops) sont la seule barrière, en clair sur le LAN comme Beszel.
victoria_logs_publish_addresses:
  - 127.0.0.1
  - 192.168.1.216

# Relève e-mail de Papra (rôle papra, README « Mail intake ») : la boîte
# dédiée, adresse et mot de passe d'application dans SOPS
# (papra_intake_imap_user, papra_intake_imap_password), jamais en clair ici :
# le From se falsifie, l'adresse reste privée. Seuls ces domaines sont
# importés, le reste part dans Papra/Refusé.
papra_intake_enabled: true
# sylvainmetayer.fr : deux adresses exactes seulement (DMARC en p=none, un
# expéditeur forgé du domaine ne serait ni rejeté ni mis en spam) ;
# sylvain.dev (alias SimpleLogin) : tout le domaine, son DMARC met les forgés
# en quarantaine, hors de la boîte relevée.
papra_intake_allowed_senders:
  - contact@sylvainmetayer.fr
  - factures@sylvainmetayer.fr
  - "@sylvain.dev"

# Bêtisier (public, sans SSO) sur un réseau Docker à part, `newt-public`, que
# Newt rejoint aussi : il ne voit plus Grocy ni Homepage sur `newt`. Lu par les
# rôles newt et betisier ; jamais sur le drill (host_vars/docker ne s'y applique pas).
newt_public_network_enabled: true

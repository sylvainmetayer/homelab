---
# Pangolin Zero Trust configuration variables

pangolin_base_domain: "sylvain.cloud"

# Pangolin Dashboard URL (without https://)
pangolin_dashboard_url: "pangolin.{{ pangolin_base_domain }}"

# Pangolin API URL (without https://)
pangolin_api_url: "pangolin-api.{{ pangolin_base_domain }}"

# sylvain.dev est servi par Cloudflare Pages sur www (tofu/site) : Pages
# n'accepte pas un apex hors zone Cloudflare, l'apex pointe donc ici.
pangolin_domain_redirects:
  - name: sylvain-dev-apex
    host: sylvain.dev
    target: https://www.sylvain.dev
    # Retire l'ancien service worker (src/service-worker-retired.js du dépôt site)
    service_worker:
      path: /service-worker.js
      replacement: /service-worker-retired.js
  # Mémoire EPSI, lien publié sur le site (articles, CV) : vers le PDF de la
  # dernière version, en 302 pour suivre une nouvelle release.
  - name: memoire-epsi
    host: memoire.epsi.sylvainmetayer.fr
    target: https://github.com/sylvainmetayer/epsi-memoire/releases/download/v1.1.1/M19_SYLVAINMETAYER.pdf
    keep_path: false
    permanent: false

# Pangolin secret (should be in secrets.sops.yaml)
pangolin_secret: "{{ pangolin_server_secret }}"

security_ufw_allowed_ports:
  - { port: "22", proto: tcp }
  - { port: "80", proto: tcp }
  - { port: "443", proto: tcp }
  - { port: "51820", proto: udp }
  - { port: "21820", proto: udp }

# Pangolin sert de bastion (ProxyJump) vers les serveurs sans IP publique du
# réseau privé : voir inventory/hetzner.py et le rôle security.
security_ssh_allow_tcp_forwarding: local

# Rapports (unattended-upgrades en échec, logwatch, cron) par msmtp.
security_mta_enabled: true

# Sous-compte Storage Box de pangolin (sauvegardes borgmatic) : clé SOPS
# backup_storage_box_subaccounts, recopiée de l'output storage_box_subaccounts
# de tofu/pangolin.
backup_storage_box_subaccount: "{{ backup_storage_box_subaccounts.pangolin }}"

# Pocket ID (rôle pocket_id, ADR 0030), pilote du fournisseur d'identité. Rendu
# seulement quand la clé SOPS pocket_id_encryption_key existe : sans elle, ni
# conteneur ni routeur Traefik (rôle pangolin), rien ne change.
pocket_id_host: "id.{{ pangolin_base_domain }}"
# true tant que le premier compte administrateur n'existe pas : tout l'hôte
# n'est admis que depuis home_ip (la page /setup de Pocket ID est ouverte à
# qui arrive le premier). À passer à false, puis pangolin.yaml --tags pangolin,
# une fois le compte créé (docs/runbooks/pocket-id.md, étape 2).
pocket_id_setup_phase: true
pangolin_idp_host: "{{ pocket_id_host if (pocket_id_encryption_key | default('') | length > 0) else '' }}"
# Une liste vide ouvre l'hôte au monde : un home_ip vide n'admet que le loopback.
pangolin_idp_allowed_ips: "{{ (home_ip | default('', true) or '127.0.0.1/32') if pocket_id_setup_phase | bool else '' }}"

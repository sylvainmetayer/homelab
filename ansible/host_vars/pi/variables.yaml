---
newt_client_id: "{{ newt_pi_client_id }}"
newt_client_secret: "{{ newt_pi_client_secret }}"

immich_domain: "photos.sylvain.cloud"
immich_backup_healthcheck_url: ""

# --- host_tuning (zram + journald) ---
# zram : défauts du rôle, 2048 Mo zstd en priorité 100 (~la moitié des 3,8 Go
# du Pi 4). Le /var/swap de 4 Go (dphys-swapfile, sur le SSD USB : pas de carte
# SD) reste derrière, en débordement.
host_tuning_disk_swap_size_mb: 4096

# Le firmware du Pi 4 ajoute cgroup_disable=memory devant cmdline.txt : pas de
# contrôleur mémoire, donc ni memory.peak ni mem_limit (Docker les ignore à la
# création du conteneur, HostConfig.Memory = 0). cgroup_enable=memory, placé
# après, le réactive ; le noyau rpt 6.18 ne connaît plus cgroup_memory=1
# (absent de l'image, vérifié le 2026-10-26). Effet au reboot de 05:30 (#846).
host_tuning_kernel_cmdline_params:
  - cgroup_enable=memory

# newt : VmHWM de 290 Mio relevé le 2026-10-26 (RSS courante 20 Mio), au-dessus
# des 256m par défaut, qui s'appliqueront dès le contrôleur mémoire actif.
newt_mem_limit: 640m

starship_os_map:
  Linux: unknown-linux-musl

starship_checksums:
  v1.24.2:
    aarch64-unknown-linux-musl: sha256:56b9ff412bbf374d29b99e5ac09a849124cb37a0a13121e8470df32de53c1ea6

# Sous-compte Storage Box de pi (sauvegardes borgmatic) : clé SOPS
# backup_storage_box_subaccounts, recopiée de l'output storage_box_subaccounts
# de tofu/pangolin.
backup_storage_box_subaccount: "{{ backup_storage_box_subaccounts.pi }}"

# --- Durcissement (rôle security, lot 5 du plan) ---
# Hôte du LAN, derrière la box : SSH n'est ouvert qu'au réseau local (ton
# poste, le LXC newt par où passe la CI). Les ports publiés par Docker
# contournent ufw (leurs règles passent avant) : Immich (2283) et le timelapse
# (5000) restent joignables depuis le LAN ; Postgres (5432) et Valkey (6379)
# sont sur 127.0.0.1, sauf le temps d'un worker distant
# (immich_remote_worker_bind_address, rôle immich). De même Blocky (53/udp et 53/tcp, rôle
# blocky) : publié sur l'IP LAN du Pi seule, sans règle ufw (elle ne servirait
# à rien) ; la Bbox ne redirige aucun port vers le Pi, seuls le LAN et le
# client Pangolin (par le Newt du LXC, une IP du LAN) l'atteignent.
security_ufw_allowed_ports:
  - { port: "22", proto: tcp, from: 192.168.1.0/24 }
# Tout le LAN ne doit jamais être banni : la CI arrive par le LXC newt, et un
# agent qui présente trop de clés bannirait ton poste.
security_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.1.0/24
security_filesystem_whitelist:
  - vfat
# Après Pangolin (04:00) et flip (04:30), loin des sauvegardes (01:00).
security_unattended_reboot_time: "05:30"
# Noyau arm64 du Pi : vm.mmap_rnd_bits entre 18 et 24 (devsec veut 32, que le
# noyau refuse). Le maximum accepté, au lieu des 18 d'origine.
security_devsec_sysctl_host:
  vm.mmap_rnd_bits: 24

# Noyau rpt et firmware : paquets d'archive.raspberrypi.com, que la seule
# origine Debian-Security laisserait de côté (le reboot de 05:30 ne servirait
# alors à rien pour le noyau).
security_unattended_extra_origins:
  - "origin=Raspberry Pi Foundation,codename=${distro_codename}"

# Rapports (unattended-upgrades en échec, logwatch, cron) par msmtp, comme
# Pangolin et flip : sans relais, logwatch tire exim4 et le courrier de root
# reste non lu dans /var/mail/root.
security_mta_enabled: true

# --- Agent Beszel (rôle beszel_agent) ---
# Un seul disque, le SSD NVMe WD_BLACK SN770 derrière un pont USB Realtek
# RTL9210 (0bda:9210) : smartctl ne le lit qu'en -d sntrealtek. Immich est sur
# ce même disque (/), déjà suivi comme disque racine. Non vérifié avant le
# déploiement (pas de smartctl sur le Pi) : si le pont ne remonte rien,
# l'agent le journalise et la page S.M.A.R.T. du Pi reste vide.
beszel_agent_smart_devices:
  - { path: /dev/sda, type: sntrealtek }

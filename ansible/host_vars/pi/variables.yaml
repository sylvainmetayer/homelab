---
newt_client_id: "{{ newt_pi_client_id }}"
newt_client_secret: "{{ newt_pi_client_secret }}"

immich_backup_enabled: true
immich_domain: "photos.sylvain.cloud"
immich_backup_healthcheck_url: ""

starship_os_map:
  Linux: unknown-linux-musl

starship_checksums:
  v1.24.2:
    aarch64-unknown-linux-musl: sha256:56b9ff412bbf374d29b99e5ac09a849124cb37a0a13121e8470df32de53c1ea6

# Sous-compte Storage Box de pi (sauvegardes borgmatic) : clé SOPS
# backup_storage_box_subaccounts, recopiée de l'output storage_box_subaccounts
# de tofu/pangolin.
backup_storage_box_subaccount: "{{ backup_storage_box_subaccounts.pi }}"

# --- Durcissement (rôle security, lot 5 du plan) ---
# Hôte du LAN, derrière la box : SSH n'est ouvert qu'au réseau local (ton
# poste, le LXC newt par où passe la CI). Les ports publiés par Docker
# contournent ufw (leurs règles passent avant) : Immich (2283), Postgres
# (5432), Valkey (6379) et le timelapse (5000) restent joignables depuis le
# LAN, pour le worker distant.
security_ufw_allowed_ports:
  - { port: "22", proto: tcp, from: 192.168.1.0/24 }
# Tout le LAN ne doit jamais être banni : la CI arrive par le LXC newt, et un
# agent qui présente trop de clés bannirait ton poste.
security_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.1.0/24
security_filesystem_whitelist:
  - vfat
# Après Pangolin (04:00) et flip (04:30), loin des sauvegardes (01:00).
security_unattended_reboot_time: "05:30"
# Noyau arm64 du Pi : vm.mmap_rnd_bits entre 18 et 24 (devsec veut 32, que le
# noyau refuse). Le maximum accepté, au lieu des 18 d'origine.
security_devsec_sysctl_host:
  vm.mmap_rnd_bits: 24

# Noyau rpt et firmware : paquets d'archive.raspberrypi.com, que la seule
# origine Debian-Security laisserait de côté (le reboot de 05:30 ne servirait
# alors à rien pour le noyau).
security_unattended_extra_origins:
  - "origin=Raspberry Pi Foundation,codename=${distro_codename}"

# Rapports (unattended-upgrades en échec, logwatch, cron) par msmtp, comme
# Pangolin et flip : sans relais, logwatch tire exim4 et le courrier de root
# reste non lu dans /var/mail/root.
security_mta_enabled: true

---
# Serveur Hetzner dédié à Flip Planning (flip.yml). Les identifiants newt ne
# sont pas ici : flip.yml les lit dans le state de tofu/pangolin_config.

# Pas d'IP publique, et newt n'écoute rien : seul SSH entre, depuis le réseau
# privé (ProxyJump via Pangolin, Ansible local et CI) ou depuis le newt local
# (flip.internal, accès manuel par un client Pangolin).
security_ufw_allowed_ports:
  - { port: "22", proto: tcp }

# SSH arrive sur flip par deux chemins seulement, chacun d'une seule IP source
# partagée : le bastion (ProxyJump via Pangolin, IP privée) et le conteneur newt
# local (flip.internal, IP sur le bridge Docker `newt`). Quelques échecs
# d'authentification (agent qui présente trop de clés, CI mal configurée)
# banniraient cette IP, donc tous les accès par ce chemin, pendant 2 h. Le
# réseau privé ne contient que Pangolin et flip ; 172.16.0.0/12 est le pool
# d'adresses par défaut de Docker (bridge `newt`, sans sous-réseau fixe).
security_fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 10.0.0.0/16
  - 172.16.0.0/12

# Durcissement devsec.hardening (os + ssh, partiel, cf. rôle security), comme
# Pangolin (issue #108).
security_devsec_enabled: true
# Rapports (unattended-upgrades en échec, logwatch, cron) par msmtp.
security_mta_enabled: true

flip_planning_backup_enabled: true
flip_planning_cloudflare_web_analytics_token: "987d563a0f264bbbb484df80ab2ab0f8"

# Demo environment of Flip Planning (demo-planning.sylvain.dev). The role is
# applied a second time in flip.yml, which maps these onto its flip_planning_*
# parameters; its own Borg repository, so restoring the demo can never touch the
# production archives.
demo_planning_backup_enabled: true
demo_planning_backup_borgmatic_target: "{{ backup_storage_box_url }}/demo_planning"
demo_planning_backup_encryption_passphrase: "{{ backup_passphrase }}"
# Autorise la page Débogage à figer la date et l'heure que lisent le mode jour J
# et l'espace animateur : ces deux écrans ne parlent que de la journée en cours,
# donc hors saison c'est le seul moyen de les rejouer sur l'instance réelle.
# Accorder ne fige rien — l'horloge reste réelle tant que personne ne la fige
# depuis cette page ; pendant qu'une date est figée en revanche, les rappels de
# la veille partent sur ce jour-là. Libérer l'horloge AVANT de repasser cette
# variable à false (voir le commentaire du rôle).
flip_planning_horloge_simulee_autorisee: true

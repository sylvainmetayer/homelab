---
# UGOS : Python 3.11 de Debian 12, rien d'installé par Ansible.
ansible_python_interpreter: /usr/bin/python3

nas_nfs_exports:
  # Pilote de nas_storage (VM docker) : dossier partagé créé dans l'interface
  # lors de l'essai du 25/10 (corbeille désactivée).
  - path: /volume1/nas-test
    clients:
      - 192.168.1.216
  # Sauvegardes vzdump de l'hôte Proxmox (storage nas-backup, tofu/proxmox
  # backup.tf) : no_root_squash des options par défaut, vzdump écrit en root.
  # Dossier partagé créé dans l'interface, corbeille désactivée.
  - path: /volume1/pve-backup
    clients:
      - 192.168.1.26

# Applis Docker du NAS : dc@ en unité *système*, exécutée en root (rôle
# docker_service). sylvain n'est pas dans le groupe docker, /etc/group
# appartient à UGOS, et le homelab ne gère pas ses utilisateurs. Les rôles
# d'application lisent docker_service_scope pour le `scope:` de leurs tâches
# systemd.
docker_service_scope: system
# Dossier partagé « docker » créé par l'appli Docker d'UGOS (btrfs) ; chaque
# appli y a son dossier 0700 root. Partagé en SMB au groupe admin avec
# `skip smb perm` : un compte admin pourrait y lire ou modifier les composes
# (secrets, conteneurs lancés en root). Risque accepté (Sylvain, 26/10).
docker_base_path: /volume1/docker
# docker.service est désactivé sous UGOS : docker_serv (après le montage des
# volumes) active docker.socket, et le démon démarre à la première requête.
docker_service_system_after:
  - docker_serv.service
  - docker.service

# --- Sauvegardes (rôle borgmatic, nas.yml) ---
# Ni apt ni pipx sous UGOS : borgmatic tourne dans son image, lancée par
# borgmatic.timer (`docker compose run --rm`, tasks/container.yml du rôle).
borgmatic_install: container
# Configurations et clé SSH sur le disque du NAS, sous le dossier du
# conteneur (docker_base_path/borgmatic), pas dans /etc ni /root : la racine
# d'UGOS est un overlay sur l'eMMC.
borgmatic_config_dir: "{{ docker_base_path }}/borgmatic/borgmatic.d"
backup_storage_box_ssh_key_path: "{{ docker_base_path }}/borgmatic/ssh/borgmatic_storage_box_ed25519"
# Après celles des autres hôtes (01:00) et avant le test de restauration
# (10:00 UTC, qui refuse une archive de plus de 28 h).
borgmatic_timer_schedule: "*-*-* 02:30:00"
# Sous-compte Storage Box du NAS : clé SOPS backup_storage_box_subaccounts,
# recopiée de l'output storage_box_subaccounts de tofu/pangolin.
backup_storage_box_subaccount: "{{ backup_storage_box_subaccounts.nas }}"

# --- Agent Beszel (rôle beszel_agent, nas.yml) ---
# Sous dc@beszel_agent, unité système comme toutes les applis du NAS
# (docker_service_scope ci-dessus), dans docker_base_path.
# Les trois disques : sda et sdb (WD40EFZZ, SATA), sdc (WD30EZRX en USB, que
# `smartctl --scan` voit en -d sat : pas de type à forcer).
beszel_agent_smart_devices:
  - { path: /dev/sda }
  - { path: /dev/sdb }
  - { path: /dev/sdc }
beszel_agent_extra_filesystems:
  - { path: /volume1, name: volume1 }

# --- Copie de kDrive (rôle kdrive_sync, nas.yml) ---
# Timer coupé jusqu'au premier passage à la main (--dry-run puis copie,
# docs/runbooks/kdrive-nas.md) : ensuite, passer à true et relancer
# nas.yml --tags kdrive_sync.
kdrive_sync_timer_enabled: false

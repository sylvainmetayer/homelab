---
# UGOS : Python 3.11 de Debian 12, rien d'installé par Ansible.
ansible_python_interpreter: /usr/bin/python3

nas_nfs_exports:
  # Pilote de nas_storage (VM docker) : dossier partagé créé dans l'interface
  # lors de l'essai du 25/10 (corbeille désactivée).
  - path: /volume1/nas-test
    clients:
      - 192.168.1.216

# --- Agent Beszel (rôle beszel_agent, nas.yml) ---
# Sous dc@beszel_agent en unité système (root : ni lingering ni groupe docker
# sous UGOS), dans le dossier partagé docker d'UGOS.
beszel_agent_mode: dc_system
beszel_agent_base_path: /volume1/docker/beszel_agent
# Les trois disques : sda et sdb (WD40EFZZ, SATA), sdc (WD30EZRX en USB, que
# `smartctl --scan` voit en -d sat : pas de type à forcer).
beszel_agent_smart_devices:
  - { path: /dev/sda }
  - { path: /dev/sdb }
  - { path: /dev/sdc }
beszel_agent_extra_filesystems:
  - { path: /volume1, name: volume1 }

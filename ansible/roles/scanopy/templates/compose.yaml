---
services:
  scanopy-daemon:
    mem_limit: 512m
    image: ghcr.io/scanopy/scanopy/daemon:v0.17.15@sha256:68e3346c9724fc9a5738047318c2a7aef362d612f3c6df4e7adaf1f254ea56bc
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    volumes:
      - ./daemon-config:/root/.config/scanopy/daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro

  scanopy-postgres:
    mem_limit: 512m
    mem_reservation: 128m
    image: docker.io/postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: scanopy-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scanopy

  scanopy-server:
    mem_limit: 1g
    image: ghcr.io/scanopy/scanopy/server:v0.17.16@sha256:e346b619265ad23db116e16792bb69aaabb2191a29bf6207c18c6a36f36a800b
    container_name: scanopy-server
    restart: unless-stopped
    ports:
      - "60072:60072"
    env_file:
      - .env
    environment:
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@scanopy-postgres:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scanopy-postgres:
        condition: service_healthy
      scanopy-daemon:
        condition: service_started
    networks:
      - scanopy
      - newt

networks:
  scanopy:
  newt:
    external: true

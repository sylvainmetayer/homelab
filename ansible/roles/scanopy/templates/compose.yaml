---
services:
  scanopy-daemon:
    mem_limit: 512m
    image: ghcr.io/scanopy/scanopy/daemon:v0.18.2@sha256:06cc7f6f4b41bef89fd58b4f002eb0539d7df204adc5a3ab97898cbb1fcaf261
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    volumes:
      - ./daemon-config:/root/.config/scanopy/daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro

  scanopy-postgres:
    mem_limit: 512m
    mem_reservation: 128m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    image: docker.io/postgres:17-alpine@sha256:1bcc18d81671b02906296aad470ec9778a6b71016ce953092024b680bad007b0
    container_name: scanopy-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scanopy

  scanopy-server:
    mem_limit: 1g
    image: ghcr.io/scanopy/scanopy/server:v0.18.2@sha256:a1437d84225edb2df6a96c1221fb3f4793e41be41ef134cf00e72be5032eee57
    container_name: scanopy-server
    restart: unless-stopped
    ports:
      - "60072:60072"
    env_file:
      - .env
    environment:
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@scanopy-postgres:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scanopy-postgres:
        condition: service_healthy
      scanopy-daemon:
        condition: service_started
    networks:
      - scanopy
      - newt

networks:
  scanopy:
  newt:
    external: true

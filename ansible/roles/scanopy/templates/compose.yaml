---
services:
  scanopy-daemon:
    mem_limit: 512m
    image: ghcr.io/scanopy/scanopy/daemon:v0.17.14@sha256:ad2e7c645d93f9b7c84e1346331c678e93be31cb149ab15f01449b9f81cdafcb
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    volumes:
      - ./daemon-config:/root/.config/scanopy/daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro

  scanopy-postgres:
    mem_limit: 512m
    mem_reservation: 128m
    image: docker.io/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: scanopy-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scanopy

  scanopy-server:
    mem_limit: 1g
    image: ghcr.io/scanopy/scanopy/server:v0.17.14@sha256:5759259d825f53a05145cb08cee9a993ae0fba1f3437a17cfa3ec47aaad4ed8d
    container_name: scanopy-server
    restart: unless-stopped
    ports:
      - "60072:60072"
    env_file:
      - .env
    environment:
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@scanopy-postgres:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scanopy-postgres:
        condition: service_healthy
      scanopy-daemon:
        condition: service_started
    networks:
      - scanopy
      - newt

networks:
  scanopy:
  newt:
    external: true

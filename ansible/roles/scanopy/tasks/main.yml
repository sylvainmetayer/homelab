---
- name: Ensure scanopy app folders exist
  become: true
  loop:
    - "{{ scanopy_base_path }}"
    - "{{ scanopy_base_path }}/daemon-config"
    - "{{ scanopy_base_path }}/postgresql"
    - "{{ scanopy_base_path }}/data"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart scanopy
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ scanopy_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template environment configuration
  notify: Restart scanopy
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ scanopy_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Scanopy
  when: scanopy_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: scanopy
    borgmatic_app_title: Scanopy
    borgmatic_app_target: "{{ scanopy_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ scanopy_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ scanopy_backup_healthcheck_url }}"
    # Pas postgresql : copié à chaud, le dossier de données n'est pas
    # cohérent. Le dump de la base scanopy (seule base de l'application) le
    # remplace.
    borgmatic_app_source_directories:
      - "{{ scanopy_base_path }}/daemon-config"
      - "{{ scanopy_base_path }}/data"
      - "{{ scanopy_base_path }}/compose.yaml"
    borgmatic_app_postgresql_databases:
      - container: scanopy-postgres
        name: scanopy
        username: postgres
        password: "{{ scanopy_postgres_password }}"

- name: Make sure scanopy service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@scanopy
    scope: user
    enabled: true

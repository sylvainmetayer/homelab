---
# data/ appartient à l'uid de déploiement : le conteneur tourne sous ce compte
# (user: du compose), sans capacité.
- name: Ensure Open WebUI app folders exist
  loop:
    - "{{ openwebui_base_path }}"
    - "{{ openwebui_base_path }}/data"
    - "{{ openwebui_base_path }}/searxng"
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  diff: false
  notify: Restart openwebui
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ openwebui_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template environment configuration
  diff: false
  notify: Restart openwebui
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ openwebui_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Réglages de SearXNG, lus en lecture seule par le conteneur (sous l'uid de
# déploiement) : la clé de signature y est, d'où 0600 et diff: false.
- name: Template SearXNG settings
  when: openwebui_searxng_enabled | bool
  diff: false
  notify: Restart openwebui
  ansible.builtin.template:
    src: "templates/searxng-settings.yml.j2"
    dest: "{{ openwebui_base_path }}/searxng/settings.yml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml). La base
# data/webui.db (SQLite en WAL, créée par les migrations au premier démarrage :
# présente dans la configuration à partir du passage suivant) est copiée par le
# hook du rôle borgmatic (VACUUM INTO), sa copie vivante exclue ; jamais le
# sqlite_databases de borgmatic. cache/ (jetons tiktoken, modèles) se retélécharge.
- name: Configure borgmatic backup for Open WebUI
  when: openwebui_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: openwebui
    borgmatic_app_title: Open WebUI
    borgmatic_app_target: "{{ openwebui_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ openwebui_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ openwebui_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ openwebui_base_path }}/data"
      - "{{ openwebui_base_path }}/compose.yaml"
      - "{{ openwebui_base_path }}/.env"
    borgmatic_app_exclude_patterns:
      - "{{ openwebui_base_path }}/data/cache"
    borgmatic_app_sqlite_databases:
      - "{{ openwebui_base_path }}/data/webui.db"

- name: Make sure openwebui service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@openwebui
    scope: user
    enabled: true

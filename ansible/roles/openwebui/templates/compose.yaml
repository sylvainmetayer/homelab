---
services:
  openwebui:
    # Mesuré en local (podman, image slim, premier démarrage avec toutes les
    # migrations de la base) : memory.peak 563 Mio, 340 Mio au repos, sans
    # conversation. Une conversation n'ajoute que du JSON et des flux vers la
    # passerelle (aucun modèle local). À recaler sur le pic réel après
    # quelques jours.
    mem_limit: 1200m
    # Variante -slim : sans torch ni modèles d'embeddings, sans Ollama ni CUDA
    # (RAG local inutile ici, BYPASS_EMBEDDING_AND_RETRIEVAL du .env).
    image: ghcr.io/open-webui/open-webui:v0.13.3-slim@sha256:8faf917243afee55e042b10ddc08ed6ae6fa9c62522c7e14d81e7cf2922325ae
    container_name: openwebui
    # L'uid de l'hôte : les bind mounts lui appartiennent (tasks/main.yml). Image
    # construite pour root (UID=0) : l'appli ne peut alors pas recopier ses
    # fichiers de personnalisation de /app/backend/open_webui/static, et le
    # journal porte une dizaine de lignes « Permission denied » à chaque
    # démarrage (BRANDING.md, favicon...). Sans effet : aucune personnalisation
    # ici (vu en local, tout le reste marche : migrations, connexion,
    # modèles). Écrit sous data/ seulement.
    user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
{% if openwebui_ai_api_key | length > 0 or openwebui_mcp_victorialogs_enabled | bool %}
    environment:
{% endif %}
{% if openwebui_ai_api_key | length > 0 %}
      # Modèles déclarés à la main (connexion 0 = OPENAI_API_BASE_URL du .env) :
      # Open WebUI ne demande alors pas /v1/models, que la passerelle ne liste
      # pas forcément. Un JSON dans un .env dépend du lecteur (compose retire
      # les apostrophes, podman non) : ici, en chaîne YAML.
      OPENAI_API_CONFIGS: {{ {'0': {'enable': true, 'model_ids': openwebui_ai_models}} | to_json | to_json }}
{% endif %}
{% if openwebui_mcp_victorialogs_enabled | bool %}
      # Outil MCP des journaux, réservé aux administrateurs : sans access_grants,
      # has_connection_access refuse tout compte non admin. Ici et non dans le
      # .env, comme les modèles (un JSON dépend du lecteur de .env).
      TOOL_SERVER_CONNECTIONS: {{ [{'type': 'mcp', 'url': openwebui_mcp_victorialogs_url, 'path': '', 'auth_type': 'none', 'key': '', 'config': {'enable': true, 'access_grants': []}, 'info': {'id': 'victorialogs', 'name': 'Journaux (VictoriaLogs)', 'description': 'Interroger les journaux du homelab en LogsQL'}}] | to_json | to_json }}
{% endif %}
    volumes:
      # webui.db (SQLite, WAL), uploads/ et cache/.
      - ./data:/app/backend/data
    restart: unless-stopped
    # Celle de l'image (curl et jq y sont), avec une période de démarrage
    # large : les migrations d'une montée de version ou du premier démarrage
    # tiennent la sonde au rouge un moment.
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://127.0.0.1:8080/health | jq -ne 'input.status == true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    # newt : l'entrée (Pangolin) et la sortie vers la passerelle IA ; les réseaux
    # internes du MCP des journaux et de SearXNG pour ces deux services seuls.
    networks:
      - newt
{% if openwebui_mcp_victorialogs_enabled | bool %}
      - victoria-logs-mcp
{% endif %}
{% if openwebui_searxng_enabled | bool %}
      - searxng

  # Recherche web d'Open WebUI, sans aucune exposition : pas de port publié, pas
  # de réseau newt, aucune ressource Pangolin. Sans état (les réglages viennent
  # de searxng/settings.yml, le cache est en tmpfs) : pas de sauvegarde.
  searxng:
    # Estimation, non mesurée : Granian (WSGI) et Python, quelques requêtes par
    # jour. À recaler sur memory.peak après quelques jours.
    mem_limit: 300m
    image: {{ openwebui_searxng_image }}
    container_name: searxng
    # L'uid de l'hôte, comme Open WebUI : l'entrypoint ne change alors aucun
    # propriétaire (il ne le fait qu'en root) et n'a besoin d'aucune capacité.
    user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"
    read_only: true
    tmpfs:
      - /tmp
      # Sticky bit : le cache (créé sous l'uid de déploiement) est à ce conteneur seul.
      - /var/cache/searxng:rw,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # searxng : le lien avec Open WebUI, interne. searxng-egress : la sortie vers
    # les moteurs, pour lui seul (newt est partagé avec les apps publiées).
    networks:
      - searxng
      - searxng-egress
{% endif %}

networks:
  newt:
    external: true
{% if openwebui_mcp_victorialogs_enabled | bool %}
  # Interne, créé par le compose de victoria_logs : lui et le MCP seuls.
  victoria-logs-mcp:
    external: true
{% endif %}
{% if openwebui_searxng_enabled | bool %}
  # Interne : Open WebUI et SearXNG seuls, aucune sortie par ce réseau.
  searxng:
    internal: true
  # Sortie Internet de SearXNG (les moteurs), rien d'autre dessus.
  searxng-egress: {}
{% endif %}

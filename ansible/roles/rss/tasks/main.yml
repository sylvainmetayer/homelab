---
- name: Ensure RSS app folder exists
  loop:
    - "{{ rss_base_path }}"
    - "{{ rss_base_path }}/config"
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Drop Pangolin's identity headers before FreshRSS
  notify: Restart rss service
  ansible.builtin.copy:
    src: homelab-apache.conf
    dest: "{{ rss_base_path }}/homelab-apache.conf"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    # Lu par l'Apache du conteneur (root, autre UID) ; rien de secret.
    mode: "0644" # NOSONAR

- name: Template compose configuration
  diff: false
  notify: Restart rss service
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ rss_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Make sure rss service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@rss
    scope: user
    enabled: true

# FreshRSS se lit dans le navigateur seulement, mobile compris : pas d'API
# cliente (Google Reader, Fever), et aucun chemin ouvert autour du SSO
# (tofu/pangolin_config/website_rss.tf). Exception : le widget de Homepage,
# par newt, quand rss_api_enabled (defaults) ; la tâche ne coupe alors plus
# l'API, activée une fois dans l'interface. L'image n'a pas de variable
# d'environnement pour api_enabled et config.custom.php ne sert qu'à
# l'installation : la clé est tenue dans la configuration système, qu'un
# réglage dans l'interface d'administration réécrit (var_export). Absente,
# elle vaut false (config.default.php). FreshRSS relit ce fichier à chaque
# requête : rien à redémarrer.
- name: Stat the FreshRSS system configuration
  become: true
  ansible.builtin.stat:
    path: "{{ rss_base_path }}/freshrss_data/config.php"
  register: rss_system_config

- name: Keep the FreshRSS API disabled
  when: rss_system_config.stat.exists and not (rss_api_enabled | bool)
  become: true
  # Le fichier porte le sel et le mot de passe SMTP.
  diff: false
  ansible.builtin.replace:
    path: "{{ rss_base_path }}/freshrss_data/config.php"
    regexp: "^(\\s*'api_enabled' => )true,$"
    replace: "\\1false,"

# Pocket ID (defaults/main.yml) : Apache redémarré d'abord avec
# mod_auth_openidc (le compose vient de changer), puis FreshRSS passe en
# http_auth, qui lit REMOTE_USER posé par le module. Dans cet ordre, /i/ n'est
# jamais en http_auth sans OIDC devant. Retour au formulaire : README.md.
- name: Restart FreshRSS with OIDC before switching its authentication
  when: rss_oidc_enabled | bool
  ansible.builtin.meta: flush_handlers

- name: Switch FreshRSS to HTTP authentication behind OIDC
  when: rss_system_config.stat.exists and rss_oidc_enabled | bool
  become: true
  diff: false
  ansible.builtin.replace:
    path: "{{ rss_base_path }}/freshrss_data/config.php"
    regexp: "^(\\s*'auth_type' => )'form',$"
    replace: "\\1'http_auth',"

# Délai d'actualisation par défaut (rss_ttl_default) et bases SQLite en WAL,
# pour chaque utilisateur : README.md (« Écritures disque »). Les dossiers
# users/<utilisateur> sont à www-data, 0770.
- name: Find the FreshRSS user configurations and databases
  become: true
  ansible.builtin.find:
    paths: "{{ rss_base_path }}/freshrss_data/users"
    patterns:
      - config.php
      - db.sqlite
    recurse: true
    depth: 2
  register: rss_user_files

# La clé est dans la configuration de l'utilisateur, réécrite par FreshRSS
# (var_export) quand il enregistre un réglage : la ligne garde sa forme.
# FreshRSS la relit à chaque requête : rien à redémarrer.
- name: Set the default refresh delay of each FreshRSS user
  loop: "{{ rss_user_files.files | map(attribute='path') | select('match', '.*/config\\.php$') | list }}"
  become: true
  # Le fichier porte le hachage du mot de passe et la clé d'API Karakeep.
  diff: false
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: "^(\\s*'ttl_default' => )\\d+,$"
    replace: "\\g<1>{{ rss_ttl_default | int }},"

# Absente (createUser n'écrit que ses surcharges, et rien ne l'ajoute tant que
# Configuration > Archivage n'a pas été enregistré), la clé vaut le défaut de
# FreshRSS (1 h) et la tâche précédente ne trouve rien : elle est insérée en
# tête du tableau. Sans ligne « return array ( », rien n'est écrit.
- name: Add the default refresh delay to FreshRSS users without one
  loop: "{{ rss_user_files.files | map(attribute='path') | select('match', '.*/config\\.php$') | list }}"
  become: true
  diff: false
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: "^([ \\t]*return array \\(\\n)(?![\\s\\S]*^[ \\t]*'ttl_default' => )"
    replace: "\\g<1>  'ttl_default' => {{ rss_ttl_default | int }},\\n"

- name: Ensure sqlite3 is installed for the FreshRSS databases
  become: true
  ansible.builtin.apt:
    name: sqlite3
    state: present

# -noheader -list : un ~/.sqliterc de root (.headers on, .mode line) ferait
# rater la comparaison à « wal ». Ne fait que lire, même en --check ; pas de
# -readonly, qui ne sait pas ouvrir une base en WAL dont le -shm manque.
- name: Read the journal mode of the FreshRSS databases
  loop: "{{ rss_user_files.files | map(attribute='path') | select('match', '.*/db\\.sqlite$') | list }}"
  become: true
  check_mode: false
  ansible.builtin.command:
    argv: [sqlite3, -bail, -noheader, -list, -cmd, .timeout 60000, "{{ item }}", pragma journal_mode]
  register: rss_db_journal_mode
  changed_when: false

# Le mode WAL est écrit dans l'en-tête du fichier : il tient pour toutes les
# connexions suivantes de FreshRSS, qui ne règle aucun journal_mode. Le
# passage demande un verrou exclusif, que .timeout attend entre deux écritures
# de l'application démarrée. sqlite3 lancé par root donne les fichiers -wal et
# -shm qu'il crée au propriétaire de la base (www-data).
- name: Switch the FreshRSS databases to WAL
  loop: "{{ rss_db_journal_mode.results | rejectattr('stdout', 'equalto', 'wal') | map(attribute='item') | list }}"
  become: true
  ansible.builtin.command:
    argv: [sqlite3, -bail, -noheader, -list, -cmd, .timeout 60000, "{{ item }}", PRAGMA journal_mode=WAL]
  register: rss_db_wal
  changed_when: true
  failed_when: rss_db_wal.rc != 0 or rss_db_wal.stdout != 'wal'

# Extension « Karakeep Button » (rss_karakeep_button_* dans les defaults).
# FreshRSS lit le dossier extensions à chaque requête : rien à redémarrer.
# Elle s'active par utilisateur, dans Configuration > Extensions.
- name: Ensure the FreshRSS extensions folder exists
  become: true
  ansible.builtin.file:
    path: "{{ rss_base_path }}/freshrss_extensions"
    state: directory
    owner: root
    group: www-data
    mode: "0750"
  register: rss_extensions_dir

# Sur un premier --check, ni le dossier de l'appli ni l'archive n'existent :
# get_url refuse un dossier absent, unarchive une archive absente.
- name: Download the Karakeep Button extension
  when: not (ansible_check_mode and rss_extensions_dir is changed)
  ansible.builtin.get_url:
    url: "https://github.com/veverkap/xExtension-karakeep-button/archive/{{ rss_karakeep_button_commit }}.tar.gz"
    dest: "{{ rss_base_path }}/karakeep-button.tar.gz"
    checksum: "sha256:{{ rss_karakeep_button_sha256 }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  register: rss_karakeep_button_archive

# Le marqueur nomme le commit installé : un autre commit (ou une extraction
# interrompue) remplace le dossier en entier, pour qu'un fichier retiré en
# amont ne reste pas chargé par FreshRSS.
- name: Stat the installed Karakeep Button commit
  become: true
  ansible.builtin.stat:
    path: "{{ rss_karakeep_button_path }}/.commit-{{ rss_karakeep_button_commit }}"
  register: rss_karakeep_button_marker

- name: Remove another Karakeep Button version
  when: not rss_karakeep_button_marker.stat.exists
  become: true
  ansible.builtin.file:
    path: "{{ rss_karakeep_button_path }}"
    state: absent

# Groupe www-data : l'entrypoint de l'image refait `chown -R :www-data` (et
# g+rX, jamais g+w) sur extensions/ à chaque démarrage du conteneur ; un
# groupe root serait remis par chaque déploiement, puis repris au démarrage.
- name: Ensure the Karakeep Button folder exists
  become: true
  ansible.builtin.file:
    path: "{{ rss_karakeep_button_path }}"
    state: directory
    owner: root
    group: www-data
    mode: "0750"

# Propriété de root, lisible par tous : www-data (FreshRSS) lit le code de
# l'extension mais ne peut pas le modifier.
- name: Unpack the Karakeep Button extension
  when:
    - not rss_karakeep_button_marker.stat.exists
    - not (ansible_check_mode and (rss_extensions_dir is changed or rss_karakeep_button_archive is changed))
  become: true
  ansible.builtin.unarchive:
    src: "{{ rss_base_path }}/karakeep-button.tar.gz"
    dest: "{{ rss_karakeep_button_path }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: root
    group: www-data

- name: Mark the installed Karakeep Button commit
  when:
    - not rss_karakeep_button_marker.stat.exists
    - not (ansible_check_mode and (rss_extensions_dir is changed or rss_karakeep_button_archive is changed))
  become: true
  ansible.builtin.copy:
    dest: "{{ rss_karakeep_button_path }}/.commit-{{ rss_karakeep_button_commit }}"
    content: "{{ rss_karakeep_button_commit }}\n"
    owner: root
    group: www-data
    mode: "0640"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for RSS
  when: rss_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: rss
    borgmatic_app_title: RSS
    borgmatic_app_target: "{{ rss_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ rss_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ rss_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ rss_base_path }}/freshrss_data"
      - "{{ rss_base_path }}/freshrss_extensions"
      - "{{ rss_base_path }}/compose.yaml"
    # Cache des flux de FreshRSS, reconstruit à la prochaine actualisation.
    borgmatic_app_exclude_patterns:
      - "{{ rss_base_path }}/freshrss_data/cache"
    # FreshRSS en SQLite : une base par utilisateur.
    borgmatic_app_sqlite_databases:
      - "{{ rss_base_path }}/freshrss_data/users/*/db.sqlite"

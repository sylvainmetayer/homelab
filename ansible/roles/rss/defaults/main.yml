---
rss_base_path: "{{ docker_base_path }}/rss"

# Extension « Karakeep Button » (bouton « envoyer à Karakeep » sur chaque
# article) : code tiers (github.com/veverkap/xExtension-karakeep-button), ni
# FreshRSS ni Karakeep, exécuté dans FreshRSS avec ses droits. Pas de release
# depuis sa conversion de Readeck à Karakeep (le seul tag, 0.1, est antérieur) :
# épinglée sur un commit de main, que Renovate suit (custom manager git-refs,
# renovate.json). Une montée doit aussi changer la somme de l'archive (get_url
# refuse tout autre fichier) et passe par une lecture du diff.
# Réglage, par utilisateur (Configuration > Extensions > Karakeep Button) :
# l'appel à Karakeep part du serveur FreshRSS (curl en PHP), pas du
# navigateur. URL de l'instance http://karakeep:3000, le conteneur sur le
# réseau newt : l'URL publique passerait par le SSO de Pangolin, qu'un
# jeton Bearer ne franchit pas. La clé d'API Karakeep est rangée en clair
# dans data/users/<utilisateur>/config.php (sauvegardé par borg).
rss_karakeep_button_commit: "8ccdace7266aa94a4795a97d311a8b494d779785"
rss_karakeep_button_sha256: "2667121cb25154aa718200f12547410683061c4fde9760381acf2acc7303ee3d"
rss_karakeep_button_path: "{{ rss_base_path }}/freshrss_extensions/xExtension-KarakeepButton"

# API Google Reader / Fever de FreshRSS : coupée (tâche « Keep the FreshRSS
# API disabled »), sauf pour le widget de Homepage, quand sa clé sops
# homepage_freshrss_api_password existe. Le rôle cesse alors seulement de la
# couper : on l'active une fois dans l'interface (Administration →
# Authentification → « Autoriser l'accès par API »). Pangolin n'ouvre aucun
# chemin autour du SSO (tofu/pangolin_config/website_rss.tf) : seul ce qui
# est sur newt (Homepage) la joint sans lui.
rss_api_enabled: "{{ homepage_freshrss_api_password | default('') | length > 0 }}"

# Délai d'actualisation par défaut des flux, en secondes (ttl_default de
# data/users/<utilisateur>/config.php ; FreshRSS : 3600). Un flux à TTL propre
# (Configuration > Flux) le garde, au plus une fois par heure. Le cron de
# l'image (CRON_MIN, compose) passe toutes les heures à la même minute et
# FreshRSS saute un flux tant que maintenant <= dernière mise à jour + TTL,
# sans marge : la mise à jour précédente ayant fini quelques secondes après
# le début du passage, un TTL de 3 h tout rond relit chaque flux toutes les
# 4 h (moins de 3 h, 10500 par exemple, pour un vrai 3 h). Écritures disque :
# README.md.
rss_ttl_default: 10800

# Borgmatic backup configuration
rss_backup_enabled: true
rss_backup_borgmatic_target: "{{ backup_storage_box_url }}/rss"
rss_backup_encryption_passphrase: "{{ backup_passphrase }}"
rss_backup_healthcheck_url: ""

# Connexion par Pocket ID (tofu/pangolin_config/pocket_id.tf, client rss) :
# mod_auth_openidc de l'image (OIDC_*), et FreshRSS en auth_type http_auth
# (tasks/main.yml, CLI reconfigure). Plus de formulaire web : le
# preferred_username Pocket ID est le compte FreshRSS (identique au caractère
# près ; un inconnu du groupe rss reçoit un compte neuf,
# http_auth_auto_register). Seul /i/ passe par l'OIDC : l'API (mots de passe
# d'API, Homepage) n'est pas touchée. Rendu seulement quand l'émetteur,
# l'identifiant et le secret sont dans le state. Secours : README du rôle.
rss_oidc_client_id: "{{ terraform_outputs.pocket_id_rss_client_id.value | default('') }}"
rss_oidc_client_secret: "{{ terraform_outputs.pocket_id_rss_client_secret.value | default('') }}"
rss_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
rss_oidc_enabled: >-
  {{ rss_oidc_client_id | length > 0
     and rss_oidc_client_secret | length > 0
     and rss_oidc_issuer | length > 0 }}
# Chiffre la session de mod_auth_openidc ; dérivée, sans clé sops. La changer
# ne coupe que les sessions en cours.
rss_oidc_crypto_key: "{{ (backup_passphrase ~ '-freshrss-oidc') | hash('sha256') }}"

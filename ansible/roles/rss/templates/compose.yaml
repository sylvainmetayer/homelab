---
services:
  freshrss:
    # Mesuré collé à 512 Mio (php memory_limit=-1, actualisation toutes les 15 min).
    mem_limit: 1g
    mem_reservation: 512m
    container_name: rss
    image: freshrss/freshrss:1.30.1@sha256:48b63b9bc3d042a1301c32971b01af8841c7f059b452589c5bf77f475ba44c61
    environment:
      # Timezone configuration
      - TZ=Europe/Paris
      # Production mode
      - FRESHRSS_ENV=production
      # Automatic update cron (every 15 minutes)
      - CRON_MIN=*/15
    volumes:
      - ./freshrss_data:/var/www/FreshRSS/data
      - ./freshrss_extensions:/var/www/FreshRSS/extensions
    restart: unless-stopped
    networks:
      - newt

networks:
  newt:
    external: true

---
services:
  freshrss:
    # Mesuré collé à 512 Mio (php memory_limit=-1, actualisation toutes les 15 min).
    mem_limit: 1g
    mem_reservation: 512m
    container_name: rss
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    environment:
      # Timezone configuration
      - TZ=Europe/Paris
      # Production mode
      - FRESHRSS_ENV=production
      # Automatic update cron (every 15 minutes)
      - CRON_MIN=*/15
    volumes:
      - ./freshrss_data:/var/www/FreshRSS/data
      - ./freshrss_extensions:/var/www/FreshRSS/extensions
    restart: unless-stopped
    networks:
      - newt

networks:
  newt:
    external: true

---
services:
  freshrss:
    # Mesuré collé à 512 Mio (php memory_limit=-1, actualisation toutes les 15 min).
    mem_limit: 1g
    mem_reservation: 512m
    container_name: rss
    image: freshrss/freshrss:1.30.2@sha256:a4a4a2233c082940b3ed5a32e2bf12d6c5271062be7e34c188dec99816540fc4
    environment:
      # Timezone configuration
      - TZ=Europe/Paris
      # Production mode
      - FRESHRSS_ENV=production
      # Automatic update cron (every 15 minutes)
      - CRON_MIN=*/15
    volumes:
      - ./freshrss_data:/var/www/FreshRSS/data
      - ./freshrss_extensions:/var/www/FreshRSS/extensions
    restart: unless-stopped
    networks:
      - newt

networks:
  newt:
    external: true

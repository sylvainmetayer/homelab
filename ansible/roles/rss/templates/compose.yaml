---
services:
  freshrss:
    # Mesuré collé à 512 Mio (php memory_limit=-1, actualisation toutes les 15 min).
    mem_limit: 1g
    mem_reservation: 512m
    container_name: rss
    image: freshrss/freshrss:1.30.0@sha256:258b8edfc8a76a61f60d2d6a14d8f8d12495d78abf38646a2137612dfa264a21
    environment:
      # Timezone configuration
      - TZ=Europe/Paris
      # Production mode
      - FRESHRSS_ENV=production
      # Automatic update cron (every 15 minutes)
      - CRON_MIN=*/15
    volumes:
      - ./freshrss_data:/var/www/FreshRSS/data
      - ./freshrss_extensions:/var/www/FreshRSS/extensions
    restart: unless-stopped
    networks:
      - newt

networks:
  newt:
    external: true

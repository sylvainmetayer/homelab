---
services:
  freshrss:
    # Mesuré collé à 512 Mio (php memory_limit=-1, actualisation toutes les 15 min
    # à l'époque, toutes les heures depuis).
    mem_limit: 1g
    mem_reservation: 512m
    container_name: rss
    security_opt:
      - no-new-privileges:true
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    environment:
      # Timezone configuration
      - TZ=Europe/Paris
      # Production mode
      - FRESHRSS_ENV=production
      # Actualisation toutes les heures, à la minute 17 : un flux en erreur est
      # retenté à chaque passage quel que soit son TTL (README.md).
      - CRON_MIN=17
    volumes:
      - ./freshrss_data:/var/www/FreshRSS/data
      - ./freshrss_extensions:/var/www/FreshRSS/extensions
    restart: unless-stopped
    # Apache est le PID 1 : mort, le conteneur sort et `restart` le relance. La
    # sonde voit ce qu'il ne voit pas, un PHP cassé (extension, droits,
    # configuration). Script de l'image : cURL sur /api/, page d'information
    # sans session ni base, servie même API coupée. Chaque passage laisse une
    # ligne dans le journal d'accès (stdout), d'où 2 min en régime établi. Rien
    # n'attend ce service : rouge, la sonde n'arrête ni ne relance rien.
    healthcheck:
      test: ["CMD", "/var/www/FreshRSS/cli/health.php"]
      interval: 2m
      start_interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - newt

networks:
  newt:
    external: true

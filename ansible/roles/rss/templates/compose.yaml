---
services:
  freshrss:
    # Mesuré collé à 512 Mio (php memory_limit=-1, actualisation toutes les 15 min
    # à l'époque, toutes les heures depuis).
    mem_limit: 1g
    mem_reservation: 512m
    container_name: rss
    # Apache maître, cron et le filtre du journal d'accès restent root ; les
    # workers et l'actualisation passent à www-data, sans aucune capacité.
    # CHOWN, FOWNER, DAC_OVERRIDE : `chown -R :www-data` et `chmod -R` de data/
    # par l'entrypoint, à travers les fichiers et les dossiers 0770 de www-data
    # (pas DAC_READ_SEARCH, hors du jeu par défaut de Docker : voir
    # docs/conventions/container-hardening.md). SETUID, SETGID : workers d'Apache, `su www-data` du cron ; sans
    # SETGID, Apache garde ses workers en root sans rien dire. KILL : signaux
    # d'Apache à ses workers, sinon l'arrêt traîne jusqu'au SIGKILL. Pas de
    # NET_BIND_SERVICE : Docker ouvre le port 80 à tous sur un réseau bridge
    # (ip_unprivileged_port_start=0). Essais : README.md.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
    environment:
      # Timezone configuration
      - TZ=Europe/Paris
      # Production mode
      - FRESHRSS_ENV=production
      # Actualisation toutes les heures, à la minute 17 : un flux en erreur est
      # retenté à chaque passage quel que soit son TTL (README.md).
      - CRON_MIN=17
{% if rss_oidc_enabled | bool %}
      # Pocket ID (defaults/main.yml) : /i/ derrière mod_auth_openidc, rappel
      # /i/oidc/ ; nom d'utilisateur = preferred_username. En-têtes de Traefik
      # (Pangolin) pour bâtir le rappel en https sur le nom public.
      - OIDC_ENABLED=1
      - OIDC_PROVIDER_METADATA_URL={{ rss_oidc_issuer }}/.well-known/openid-configuration
      - OIDC_CLIENT_ID={{ rss_oidc_client_id }}
      - OIDC_CLIENT_SECRET={{ rss_oidc_client_secret }}
      - OIDC_CLIENT_CRYPTO_KEY={{ rss_oidc_crypto_key }}
      - OIDC_SCOPES=openid email profile
      - OIDC_REMOTE_USER_CLAIM=preferred_username
      - OIDC_X_FORWARDED_HEADERS=X-Forwarded-Proto X-Forwarded-Host
{% endif %}
    volumes:
      - ./freshrss_data:/var/www/FreshRSS/data
      - ./freshrss_extensions:/var/www/FreshRSS/extensions
      # En-têtes d'identité de Pangolin effacés avant PHP (files/).
      - ./homelab-apache.conf:/etc/apache2/conf-enabled/homelab.conf:ro
    restart: unless-stopped
    # Apache est le PID 1 : mort, le conteneur sort et `restart` le relance. La
    # sonde voit ce qu'il ne voit pas, un PHP cassé (extension, droits,
    # configuration). Script de l'image : cURL sur /api/, page d'information
    # sans session ni base, servie même API coupée. Chaque passage laisse une
    # ligne dans le journal d'accès (stdout), d'où 2 min en régime établi. Rien
    # n'attend ce service : rouge, la sonde n'arrête ni ne relance rien.
    healthcheck:
      test: ["CMD", "/var/www/FreshRSS/cli/health.php"]
      interval: 2m
      start_interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - newt

networks:
  newt:
    external: true

# Posé par le rôle rss (Ansible). Pangolin ajoute après son SSO des en-têtes
# d'identité (Remote-User, Remote-Email…) ; FreshRSS en http_auth lit
# REMOTE_USER (mod_auth_openidc) ET l'en-tête Remote-User d'un proxy de
# confiance, et refuse tout s'ils diffèrent (« Multiple HTTP authentication
# headers! »). Effacés dès l'entrée : seule l'identité Pocket ID compte, et
# personne ne peut s'en inventer une par en-tête.
RequestHeader unset Remote-User early
RequestHeader unset X-WebAuth-User early

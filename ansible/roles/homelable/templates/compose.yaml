---
services:
  # Service name must stay "backend": the frontend's nginx config proxies
  # /api and /ws to the hardcoded upstream "backend:8000".
  backend:
    container_name: homelable-backend
    image: ghcr.io/pouzor/homelable-backend:latest@sha256:af3014ab7bd3844b4e07fbcb8132e9a98a30d65d31480d4d328d592f0e68b6aa
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
    networks:
      - homelable
    cap_add:
      - NET_RAW

  homelable-frontend:
    container_name: homelable-frontend
    image: ghcr.io/pouzor/homelable-frontend:latest@sha256:3c2fa58a512042bd2a5e07340d6b7d7660fa00591e09e646e0302d47e7911230
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - homelable    # Réseau interne pour communication avec le backend
      - newt         # Réseau externe pour accès Pangolin/Traefik

networks:
  homelable:
  newt:
    external: true  # Réseau créé par le rôle newt

---
services:
  # Service name must stay "backend": the frontend's nginx config proxies
  # /api and /ws to the hardcoded upstream "backend:8000".
  backend:
    container_name: homelable-backend
    image: ghcr.io/pouzor/homelable-backend:latest@sha256:a2acb8496426f72b17e82ba2c585a5e920524b1329a3fadf1815aad9fba78463
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
    networks:
      - homelable
    cap_add:
      - NET_RAW

  homelable-frontend:
    container_name: homelable-frontend
    image: ghcr.io/pouzor/homelable-frontend:latest@sha256:9c8bafd821718f6a5423ba0d114594bd3cf857eecaba2ca471e705b6810f1290
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - homelable    # Réseau interne pour communication avec le backend
      - newt         # Réseau externe pour accès Pangolin/Traefik

networks:
  homelable:
  newt:
    external: true  # Réseau créé par le rôle newt

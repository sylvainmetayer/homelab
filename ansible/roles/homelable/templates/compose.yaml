---
services:
  # Service name must stay "backend": the frontend's nginx config proxies
  # /api and /ws to the hardcoded upstream "backend:8000".
  backend:
    container_name: homelable-backend
    image: ghcr.io/pouzor/homelable-backend:latest@sha256:9f9bd5b68e6eac98b6a0af1e066300f979995e17a990e135fa82c97079a4e206
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
    networks:
      - homelable
    cap_add:
      - NET_RAW

  homelable-frontend:
    container_name: homelable-frontend
    image: ghcr.io/pouzor/homelable-frontend:latest@sha256:b38c99e6923fee14dddc915b441b990acbcff87f7178393f2995fd228ffa7689
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - homelable    # Réseau interne pour communication avec le backend
      - newt         # Réseau externe pour accès Pangolin/Traefik

networks:
  homelable:
  newt:
    external: true  # Réseau créé par le rôle newt

---
services:
  # Service name must stay "backend": the frontend's nginx config proxies
  # /api and /ws to the hardcoded upstream "backend:8000".
  backend:
    container_name: homelable-backend
    image: ghcr.io/pouzor/homelable-backend:latest@sha256:7cb376575752f23ea2799fdb6868d80e28a09e52ad7553ee96e2bc3048f0c88d
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
    networks:
      - homelable
    cap_add:
      - NET_RAW

  homelable-frontend:
    container_name: homelable-frontend
    image: ghcr.io/pouzor/homelable-frontend:latest@sha256:0e306a5a138413988ca4fc87f0b219dfa9daef594b77875436c9f0f83f6d234b
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - homelable    # Réseau interne pour communication avec le backend
      - newt         # Réseau externe pour accès Pangolin/Traefik

networks:
  homelable:
  newt:
    external: true  # Réseau créé par le rôle newt

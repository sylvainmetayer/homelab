---
services:
  # Service name must stay "backend": the frontend's nginx config proxies
  # /api and /ws to the hardcoded upstream "backend:8000".
  backend:
    container_name: homelable-backend
    image: ghcr.io/pouzor/homelable-backend:latest@sha256:7431da6c2eba65751aec3032783b458efa815a7cc4751d76f479fba5159f293b
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ./data:/app/data
    networks:
      - homelable
    cap_add:
      - NET_RAW

  homelable-frontend:
    container_name: homelable-frontend
    image: ghcr.io/pouzor/homelable-frontend:latest@sha256:11c9a9b385de83fbf959cc34e4783ebe384df61b37b1bb3c60720d834ecddd70
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - homelable    # Réseau interne pour communication avec le backend
      - newt         # Réseau externe pour accès Pangolin/Traefik

networks:
  homelable:
  newt:
    external: true  # Réseau créé par le rôle newt

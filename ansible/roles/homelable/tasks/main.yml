---
- name: Ensure homelable app folders exist
  loop:
    - "{{ homelable_base_path }}"
    - "{{ homelable_base_path }}/data"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart homelable
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ homelable_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template environment configuration
  notify: Restart homelable
  ansible.builtin.template:
    src: "templates/env.docker.j2"
    dest: "{{ homelable_base_path }}/.env.docker"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration
- name: Configure borgmatic backup for homelable
  when: homelable_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for homelable
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-homelable.yaml.j2"
        dest: "{{ borgmatic_config_dir }}/homelable.yaml"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Initialize borg repository for homelable
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic
          --config {{ borgmatic_config_dir }}/homelable.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: homelable_borg_repo_create
      changed_when: "'repository already exists' not in homelable_borg_repo_create.stderr"
      failed_when: >
        homelable_borg_repo_create.rc != 0 and
        'repository already exists' not in homelable_borg_repo_create.stderr

- name: Make sure homelable service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@homelable
    scope: user
    enabled: true

---
- name: Check nextcloud secrets
  ansible.builtin.assert:
    quiet: true
    that:
      - nextcloud_db_password | length > 0
      - nextcloud_redis_password | length > 0
    fail_msg: >-
      nextcloud_db_password ou nextcloud_redis_password vide : clé absente de
      secrets/ansible.sops.yaml ?

- name: Ensure Nextcloud app folder exists
  become: true
  ansible.builtin.file:
    mode: "0700"
    path: "{{ nextcloud_base_path }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template docker-compose configuration
  diff: false
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ nextcloud_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  notify: Restart nextcloud service

# IP réelle des clients, d'où trusted_proxies = sous-réseau de newt.
#
# Chaîne : Traefik, sur Pangolin, remplace tout X-Forwarded-For reçu par l'IP
# du client (pas de forwardedHeaders.trustedIPs dans traefik_config.yml.j2) ;
# Newt relaie en TCP (L4) et ouvre la connexion vers nextcloud:80 depuis son
# conteneur. nginx voit donc l'IP de newt, avec X-Forwarded-For: <client>.
#
# - Si le default.conf de nginx (/config/nginx/site-confs, copié une fois
#   depuis l'échantillon de l'image) porte `set_real_ip_from 172.16.0.0/12;
#   real_ip_header X-Forwarded-For;` et que newt est dans 172.16.0.0/12,
#   nginx remplace déjà $remote_addr par le client : PHP reçoit
#   REMOTE_ADDR = client, hors trusted_proxies, que Nextcloud garde tel quel.
# - Sinon (default.conf plus ancien, ou newt hors de 172.16.0.0/12 quand
#   docker a épuisé ce bloc), REMOTE_ADDR = newt : il faut newt dans
#   trusted_proxies pour que Nextcloud lise X-Forwarded-For.
# Le sous-réseau de newt suffit dans les deux cas. L'adresse de nginx
# lui-même (127.0.0.1, côté FastCGI) n'apparaît jamais : REMOTE_ADDR est le
# $remote_addr de nginx, pas l'origine de la connexion FastCGI.
#
# Vérifier après un échec de connexion volontaire depuis une IP connue :
#   docker exec nextcloud occ security:bruteforce:attempts <ip publique>
# doit compter la tentative, et la même commande sur l'IP de newt
# (docker inspect newt) doit rester à 0.
#
# Lu dans docker plutôt qu'épinglé, comme flip_planning : docker choisit le
# sous-réseau à la création du réseau, et une entrée qui ne correspond à rien
# ne fait confiance à aucun en-tête, sans rien dire.
- name: Read the newt network definition for Nextcloud
  when: not nextcloud_trusted_proxies
  changed_when: false
  # Lecture seule : aussi en --check, sinon le set_fact suivant n'a rien.
  check_mode: false
  ansible.builtin.command:
    cmd: "docker network inspect {{ nextcloud_newt_network }}"
  register: nextcloud_newt_network_info

- name: Use the newt subnets as Nextcloud's trusted proxies
  when: not nextcloud_trusted_proxies
  ansible.builtin.set_fact:
    nextcloud_trusted_proxies: >-
      {{ (nextcloud_newt_network_info.stdout | from_json)[0].IPAM.Config | default([], true)
         | map(attribute='Subnet', default='') | select | list }}

# Les valeurs sont écrites telles quelles entre apostrophes dans un fichier
# PHP : n'y laisser passer que des adresses ou des CIDR.
- name: Check Nextcloud's trusted proxies
  ansible.builtin.assert:
    quiet: true
    that:
      - nextcloud_trusted_proxies | length > 0
      - nextcloud_trusted_proxies | reject('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$') | list | length == 0
    fail_msg: >-
      nextcloud_trusted_proxies vide ou invalide ({{ nextcloud_trusted_proxies }}) :
      soit le réseau {{ nextcloud_newt_network }} ne déclare aucun sous-réseau
      IPAM, soit la valeur fixée à la main n'est pas une liste d'adresses ou
      de CIDR. La renseigner (ou la corriger) dans host_vars.

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Nextcloud
  when: nextcloud_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: nextcloud
    borgmatic_app_title: Nextcloud
    borgmatic_app_target: "{{ nextcloud_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ nextcloud_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ nextcloud_backup_healthcheck_url }}"
    # Pas db_data : la base MariaDB n'héberge que la base nextcloud, que le
    # dump couvre ; sa copie à chaud n'était pas restaurable de façon sûre.
    borgmatic_app_source_directories:
      - "{{ nextcloud_base_path }}/compose.yaml"
      - "{{ nextcloud_base_path }}/config"
      - "{{ nextcloud_base_path }}/data"
      - "{{ nextcloud_base_path }}/redis"
    # Image officielle mariadb (11.x) : pas de mysqldump, seulement
    # mariadb-dump, le dump_command par défaut du rôle borgmatic.
    borgmatic_app_mysql_databases:
      - container: nextcloud_db
        name: nextcloud
        username: nextcloud
        password: "{{ nextcloud_db_password }}"
    # Les archives de ce dépôt se sont appelées 'betisier-…' (copier-coller)
    # avant d'être renommées 'nextcloud-…'. Sans match_archives, borgmatic
    # dériverait 'sh:nextcloud-*' de archive_name_format et prune / check
    # ignoreraient les anciennes archives, qui ne seraient plus jamais
    # purgées. Le dépôt ne contient que nextcloud : toutes ses archives sont
    # concernées.
    borgmatic_app_extra_options:
      match_archives: "*"

- name: Make sure nextcloud service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@nextcloud
    scope: user
    enabled: true

# Seulement une fois le conteneur démarré : son init écrit config.php après
# avoir garni le dossier config (config.sample.php, CAN_INSTALL), ce qu'il ne
# fait que si le dossier est vide. Posé avant le tout premier démarrage, ce
# fichier priverait l'installateur web de CAN_INSTALL et il refuserait de
# démarrer. D'où l'attente ci-dessous, après le démarrage du service, plutôt
# qu'un simple constat : sur un hôte neuf, sauter cette étape laisserait DAV
# et OCS, ouverts sans SSO par Pangolin, accepter le mot de passe du compte
# jusqu'au prochain passage du rôle. Le délai couvre le premier pull de
# l'image ; dépassé, le rôle échoue au lieu de passer en silence.
- name: Wait for the Nextcloud container to initialise its config
  when: not ansible_check_mode
  ansible.builtin.wait_for:
    path: "{{ nextcloud_config_dir }}/config.php"
    timeout: "{{ nextcloud_config_wait_timeout }}"
    msg: >-
      {{ nextcloud_config_dir }}/config.php toujours absent après
      {{ nextcloud_config_wait_timeout }} s : dc@nextcloud n'a pas initialisé
      son dossier config, homelab.config.php (token_auth_enforced,
      trusted_proxies) n'est pas posé. Voir docker logs nextcloud (la sortie des
      conteneurs n'est plus dans journalctl --user -u dc@nextcloud).

- name: Check that the Nextcloud container has initialised its config
  ansible.builtin.stat:
    path: "{{ nextcloud_config_dir }}/config.php"
  register: nextcloud_main_config

# Pas de redémarrage : Nextcloud relit config.php et chaque *.config.php à
# chaque requête PHP (et à chaque occ, chaque cron), après un
# opcache_invalidate sur la date du fichier. Le propriétaire est l'utilisateur
# de PUID/PGID, c'est-à-dire `abc` dans le conteneur, qui doit pouvoir le lire.
# La condition ne sert qu'en --check sur un hôte neuf.
- name: Template the homelab Nextcloud configuration
  when: nextcloud_main_config.stat.exists
  ansible.builtin.template:
    src: "templates/homelab.config.php.j2"
    dest: "{{ nextcloud_config_dir }}/homelab.config.php"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0640"

# Pocket ID par user_oidc (defaults/main.yml). L'app vient du magasin
# d'applis (dernière version compatible avec ce Nextcloud) ; occ
# user_oidc:provider est un upsert, rejoué à chaque passage. occ appelé en
# direct (php, utilisateur abc) et non par le wrapper /usr/bin/occ de
# l'image : il passe par sudo (l'environnement, donc le secret, est perdu) et
# recolle les arguments par $* (« Pocket ID » coupé aux espaces). Secret par
# l'environnement du docker exec, jamais en argument d'occ ni dans les logs.
- name: Read the Nextcloud install status
  when:
    - nextcloud_oidc_enabled | bool
    - nextcloud_main_config.stat.exists
    - not ansible_check_mode
  ansible.builtin.command: docker exec -u abc nextcloud php /app/www/public/occ status --output=json
  register: nextcloud_status
  changed_when: false
  failed_when: false

# Installé (l'installeur web a tourné) et hors maintenance, sinon rien.
- name: Decide whether user_oidc can be configured
  ansible.builtin.set_fact:
    nextcloud_oidc_ready: >-
      {{ nextcloud_oidc_enabled | bool and nextcloud_main_config.stat.exists
         and not ansible_check_mode and nextcloud_status.rc | default(1) == 0
         and (nextcloud_status.stdout | default('{}') | from_json).installed | default(false)
         and not (nextcloud_status.stdout | default('{}') | from_json).maintenance | default(true) }}

- name: Read the installed Nextcloud apps
  when: nextcloud_oidc_ready | bool
  ansible.builtin.command: docker exec -u abc nextcloud php /app/www/public/occ app:list --output=json
  register: nextcloud_apps_raw
  changed_when: false

- name: Install and enable user_oidc
  when:
    - nextcloud_oidc_ready | bool
    - "'user_oidc' not in (nextcloud_apps_raw.stdout | from_json).enabled"
  vars:
    nextcloud_user_oidc_action: "{{ 'app:enable' if 'user_oidc' in (nextcloud_apps_raw.stdout | from_json).disabled else 'app:install' }}"
  ansible.builtin.command:
    argv: [docker, exec, -u, abc, nextcloud, php, /app/www/public/occ, "{{ nextcloud_user_oidc_action }}", user_oidc]
  changed_when: true

- name: Declare the Pocket ID provider in user_oidc
  when: nextcloud_oidc_ready | bool
  no_log: true
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - abc
      - -e
      - "NC_OIDC_SECRET={{ nextcloud_oidc_client_secret }}"
      - nextcloud
      - php
      - /app/www/public/occ
      - user_oidc:provider
      - "{{ nextcloud_oidc_provider }}"
      - "--clientid={{ nextcloud_oidc_client_id }}"
      - --clientsecret-env=NC_OIDC_SECRET
      - "--discoveryuri={{ nextcloud_oidc_issuer }}/.well-known/openid-configuration"
      - --scope=openid email profile
      - --unique-uid=0
      - --mapping-uid=preferred_username
      - --group-provisioning=0
      - --check-bearer=0
  changed_when: false

# Assistant de Nextcloud par la passerelle IA de Pangolin : les applis
# seulement. URL de base et clé virtuelle nextcloud se saisissent dans
# l'administration (« Intelligence artificielle ») : integration_openai garde
# ses services en JSON chiffré, sans commande occ pour les écrire (README).
# Après la déclaration du fournisseur : un échec ici (magasin d'applis
# injoignable) ne doit pas bloquer la connexion Pocket ID. Liste vide : rien.
- name: Install and enable the Nextcloud Assistant apps
  when:
    - nextcloud_oidc_ready | bool
    - item not in (nextcloud_apps_raw.stdout | from_json).enabled
  loop: "{{ nextcloud_ai_apps }}"
  vars:
    nextcloud_ai_app_action: "{{ 'app:enable' if item in (nextcloud_apps_raw.stdout | from_json).disabled else 'app:install' }}"
  ansible.builtin.command:
    argv: [docker, exec, -u, abc, nextcloud, php, /app/www/public/occ, "{{ nextcloud_ai_app_action }}", "{{ item }}"]
  changed_when: true

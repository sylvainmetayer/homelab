---
services:
  nextcloud:
    mem_limit: 1536m
    restart: unless-stopped
    image: ghcr.io/linuxserver/nextcloud:35.0.1@sha256:e2d2b2bc261e6ac0652f544b4c3db60221f9e9f78b430dfcfea46529b7e97b5b
    container_name: nextcloud
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
      # https://github.com/linuxserver/docker-mods/tree/nextcloud-memories
      #- DOCKER_MODS=linuxserver/mods:nextcloud-memories
    volumes:
      - ./config:/config
      - ./data:/data
    # `newt` sert aussi aux abonnements de l'agenda : le calendrier de TREK est
    # lu en direct par http://trek:3000/api/feed/user/<jeton>.ics, sans passer
    # par Pangolin (SSO, filtre pays). Nextcloud refuse par défaut un webcal
    # vers une adresse privée ; le réglage, en base et donc fait une fois à la
    # main, ne lève ce verrou que pour les abonnements webcal :
    #   docker exec nextcloud occ config:app:set dav webcalAllowLocalAccess --value=yes
    networks:
      - newt
      - nextcloud
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    mem_limit: 1g
    mem_reservation: 384m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    container_name: nextcloud_db
    restart: unless-stopped
    image: mariadb:12.3.3@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
    environment:
      MYSQL_ROOT_PASSWORD: {{ nextcloud_db_password }}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: {{ nextcloud_db_password }}
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - nextcloud
    # healthcheck.sh de l'image officielle. --connect seulement :
    # --innodb_initialized exige l'utilisateur `healthcheck` que l'entrypoint
    # ne crée qu'à l'initialisation d'un datadir (ou avec
    # MARIADB_AUTO_UPGRADE) : sur une base initialisée avant lui, le test
    # resterait rouge et nextcloud ne démarrerait plus.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  cache:
    mem_limit: 256m
    restart: unless-stopped
    image: redis:8.2.10-bookworm@sha256:164c759a0c342ee69d08fc99219382b0fd682181465c0df2e0e6911f4c85d73c
    container_name: nextcloud_redis
    command: redis-server --requirepass {{ nextcloud_redis_password }}
    environment:
      - REDIS_PASSWORD={{ nextcloud_redis_password }}
    volumes:
      - ./redis:/data
    networks:
      - nextcloud
    # `$$` : le mot de passe est lu dans l'environnement du conteneur, il
    # n'apparaît pas dans la commande (docker inspect).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# `internal: true` : pas de sortie vers Internet par ce réseau. nextcloud, qui
# en a besoin (magasin d'applis, fédération, agendas webcal), la garde par
# newt ; la base et redis n'en ont pas besoin.
networks:
  nextcloud:
    internal: true
  newt:
    external: true

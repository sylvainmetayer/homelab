---
services:
  nextcloud:
    mem_limit: 1536m
    restart: unless-stopped
    image: ghcr.io/linuxserver/nextcloud:35.0.2@sha256:84205b9623211afb0d8d4493204236258606ff58e767ac017b1750e4eb715e3b
    container_name: nextcloud
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
      # https://github.com/linuxserver/docker-mods/tree/nextcloud-memories
      #- DOCKER_MODS=linuxserver/mods:nextcloud-memories
    volumes:
      - ./config:/config
      - ./data:/data
    # `newt` sert aussi aux abonnements de l'agenda : le calendrier de TREK est
    # lu en direct par http://trek:3000/api/feed/user/<jeton>.ics, sans passer
    # par Pangolin (SSO, filtre pays). Nextcloud refuse par défaut un webcal
    # vers une adresse privée ; le réglage, en base et donc fait une fois à la
    # main, ne lève ce verrou que pour les abonnements webcal :
    #   docker exec nextcloud occ config:app:set dav webcalAllowLocalAccess --value=yes
    networks:
      - newt
      - nextcloud
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  db:
    mem_limit: 1g
    # ≈ le pic mesuré avec le buffer pool de 128 Mo par défaut (384m), plus
    # les 128 Mo ajoutés ci-dessous.
    mem_reservation: 512m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    container_name: nextcloud_db
    restart: unless-stopped
    image: mariadb:12.3.3@sha256:2bdff1534a7e569fecaf4b10b66ad0d410806e382d9db29ba305448addda97c4
    # Réglages remontés par les vérifications de base de données de Nextcloud
    # (Administration > Vue d'ensemble). Options passées à mariadbd par
    # l'entrypoint de l'image.
    # - buffer pool 256 Mo (128 par défaut) : taux de succès sous 99 %, et
    #   chaque défaut de cache est une lecture sur le disque rotatif de la VM.
    # - redo log 256 Mo (96 par défaut) : moins de checkpoints. MariaDB
    #   redimensionne le fichier ib_logfile0 seul au démarrage.
    # - tables temporaires en mémoire jusqu'à 64 Mo (16 par défaut) : la moitié
    #   finissait sur disque. Celles qui ont une colonne TEXT/BLOB y vont quoi
    #   qu'il arrive (moteur MEMORY), le taux ne tombera pas à zéro.
    # - journal des requêtes lentes (> 2 s), dans le datadir sous un nom fixe :
    #   le nom par défaut dérive du hostname, donc de l'ID du conteneur, et
    #   changerait à chaque recréation. db_data n'est pas sauvegardé (dump).
    #   Noms canoniques depuis MariaDB 10.11 ; slow_query_log et
    #   long_query_time, que lit Nextcloud, en sont des alias.
    command:
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=256M
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
      - --log-slow-query=ON
      - --log-slow-query-time=2
      - --log-slow-query-file=/var/lib/mysql/slow.log
    environment:
      MYSQL_ROOT_PASSWORD: {{ nextcloud_db_password }}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: {{ nextcloud_db_password }}
    volumes:
      - ./db_data:/var/lib/mysql
    networks:
      - nextcloud
    # healthcheck.sh de l'image officielle. --connect seulement :
    # --innodb_initialized exige l'utilisateur `healthcheck` que l'entrypoint
    # ne crée qu'à l'initialisation d'un datadir (ou avec
    # MARIADB_AUTO_UPGRADE) : sur une base initialisée avant lui, le test
    # resterait rouge et nextcloud ne démarrerait plus.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  cache:
    mem_limit: 256m
    restart: unless-stopped
    image: redis:8.2.10-bookworm@sha256:47670742d7924adbcdb404d1288b6327815b23141969c0939b8e5d61f78c2634
    container_name: nextcloud_redis
    command: redis-server --requirepass {{ nextcloud_redis_password }}
    environment:
      - REDIS_PASSWORD={{ nextcloud_redis_password }}
    volumes:
      - ./redis:/data
    networks:
      - nextcloud
    # `$$` : le mot de passe est lu dans l'environnement du conteneur plutôt
    # que recopié dans le test. Il reste visible dans `docker inspect`
    # (command et environment ci-dessus) : ce n'est pas un secret caché.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# `internal: true` : pas de sortie vers Internet par ce réseau. nextcloud, qui
# en a besoin (magasin d'applis, fédération, agendas webcal), la garde par
# newt ; la base et redis n'en ont pas besoin.
networks:
  nextcloud:
    internal: true
  newt:
    external: true

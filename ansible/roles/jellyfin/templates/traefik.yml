---
# Configuration statique du Traefik de Jellyfin (dc@jellyfin, sur le NAS).
# Fournisseur fichier seul : ni labels, ni socket Docker monté.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Requêtes en erreur seulement (4xx, 5xx), sur stdout : docker logs
# jellyfin-traefik. Format common, une ligne par requête. Jellyfin passe le
# jeton d'accès en paramètre (?api_key=…, flux vidéo, images) ou en en-tête
# (Authorization, X-Emby-Token) : RequestPath porte la query string tant que
# queryParameters la garde (Traefik 3.7, pkg/middlewares/accesslog/logger.go),
# d'où les deux drop. Sans en-têtes, le Referer et le User-Agent de la ligne
# common valent "-". Seul le chemin reste : un seul appel de Jellyfin y porte
# un secret, DELETE /Auth/Keys/{clé} (révocation d'une clé d'API, par un
# administrateur), journalisé s'il échoue. Le ping du healthcheck n'est pas
# journalisé (addInternals: false par défaut). StartUTC retiré : l'heure de la
# ligne est alors l'heure locale (TZ du compose), comme celle des autres logs.
accessLog:
  format: common
  filters:
    statusCodes:
      - "400-599"
  fields:
    names:
      StartUTC: drop
    headers:
      defaultMode: drop
    queryParameters:
      defaultMode: drop

entryPoints:
  # Le 443 du conteneur : https://{{ jellyfin_domain }} sans port, par la
  # ressource privée Pangolin. Pas de port 80 : il est au nginx d'UGOS, et le
  # DNS-01 n'en a pas besoin. Le certificat suit le Host() du routeur.
  websecure:
    address: ":443"
    http:
      # Supprime les en-têtes qui en imitent un autre (X_Forwarded_For…) :
      # aucun client ne peut se faire passer pour ce que pose Traefik.
      aliasHeadersStrategy: delete
  # Même port dans le conteneur et sur le NAS (LAN), ouvert aussi dans la
  # ressource Pangolin : une appli (téléphone, TV) réglée à la maison sur
  # https://{{ jellyfin_domain }}:{{ jellyfin_https_port }} marche encore dehors.
  websecure-lan:
    address: ":{{ jellyfin_https_port }}"
    http:
      aliasHeadersStrategy: delete
  # Healthcheck du conteneur (traefik healthcheck --ping), jamais publié.
  ping:
    address: ":8082"
    http:
      aliasHeadersStrategy: delete

ping:
  entryPoint: ping

providers:
  file:
    filename: /etc/traefik/dynamic.yml

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{ jellyfin_acme_email }}"
      # Dans le dossier du projet, sur le disque du NAS (jamais sur NFS), 0600.
      storage: /letsencrypt/acme.json
      # DNS-01 par l'API OVH (identifiants OVH_* du compose) : le A de
      # {{ jellyfin_domain }} vise une IP privée, aucun HTTP-01 possible.
      # Résolveurs publics pour la vérification de propagation : pas de cache
      # de la Bbox entre l'ajout du TXT et la vérification.
      dnsChallenge:
        provider: ovh
        resolvers:
          - "1.1.1.1:53"
          - "9.9.9.9:53"

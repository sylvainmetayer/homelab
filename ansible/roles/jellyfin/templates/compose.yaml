---
services:
  jellyfin:
    # Provisoire (defaults) : à recaler à ~2x memory.peak après une semaine.
    # Pas de cpus: : un transcodage logiciel de secours ou un scan doit
    # pouvoir prendre les quatre cœurs du N100.
    mem_limit: {{ jellyfin_mem_limit }}
    image: docker.io/jellyfin/jellyfin:12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin
    # Le compte de l'hôte propriétaire des médias copiés par SMB (defaults :
    # jellyfin_user), et le groupe du périphérique de rendu pour Quick Sync.
    user: "{{ jellyfin_uid }}:{{ jellyfin_gid }}"
    group_add:
      - "{{ jellyfin_render_gid }}"
    devices:
      - {{ jellyfin_render_device }}:{{ jellyfin_render_device }}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=Europe/Paris
    volumes:
      - ./config:/config
      - ./cache:/cache
      # Jamais en écriture : Jellyfin ne range ni ne supprime rien, l'édition
      # se fait par SMB.
      - {{ jellyfin_media_path }}:/media:ro
    # Secours en HTTP simple sur le LAN, sans cast (il exige HTTPS) : l'adresse
    # à utiliser partout, cast compris, est https://media.sylvain.cloud (ou :8443),
    # par le Traefik du NAS (rôle nas_proxy, docs/media.md).
    ports:
      - "{{ jellyfin_port }}:8096"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Réseau privé du projet, partagé avec le Traefik du NAS seul ; pas
    # internal : Jellyfin y a Internet pour les métadonnées. Pas sur newt : le
    # Newt du NAS ne joint que Traefik.
    networks:
      - media

# Créé ici (jellyfin_media pour Docker), rejoint en externe par le Traefik du
# NAS (rôle nas_proxy) à IP fixe : son nom et son sous-réseau ne changent pas.
networks:
  media:
    ipam:
      config:
        - subnet: {{ jellyfin_proxy_subnet }}

---
# Jellyfin, sur le NAS (nas.yml) : un seul conteneur sous dc@jellyfin, en
# unité système (docker_service_scope: system, host_vars/nas).
jellyfin_service: jellyfin
jellyfin_base_path: "{{ docker_base_path }}/{{ jellyfin_service }}"

# Compte de l'hôte sous lequel tourne le conteneur (uid et gid primaire lus au
# déploiement) : les fichiers copiés par SMB lui appartiennent, il les lit
# quel que soit leur mode. Sur le NAS, sylvain (1000).
jellyfin_user: "{{ ansible_user }}"

# Dossier partagé UGOS des médias, créé dans l'interface (corbeille décochée),
# monté en lecture seule. Le rôle refuse de démarrer s'il manque, lui ou un
# des dossiers des bibliothèques.
jellyfin_media_path: /volume1/media
jellyfin_media_folders:
  - films
  - series
  - musique
  - livres
  - livres-audio

# Quick Sync (iGPU du N100) : le conteneur rejoint le groupe propriétaire du
# périphérique (render sur le NAS), gid lu sur le périphérique au déploiement.
jellyfin_render_device: /dev/dri/renderD128

# Publié sur le LAN, en secours seulement (Traefik du NAS en panne,
# certificat expiré) : HTTP simple, sans cast. Le cast exige HTTPS de bout en bout (Chrome
# n'offre Google Cast que sur une origine sécurisée, et le récepteur Chromecast
# de Jellyfin, page HTTPS, ne lit pas un flux HTTP). Toutes les applis, TV
# comprise, se règlent sur https://media.sylvain.cloud (ou :8443), servi par le
# Traefik du NAS (rôle nas_proxy, docs/media.md).
jellyfin_port: 8096
# Provisoire : à recaler à ~2x memory.peak après une semaine d'usage.
jellyfin_mem_limit: 3g

# Réseau privé du projet, à sous-réseau fixe (Compose le nomme jellyfin_media),
# que rejoint le Traefik du NAS (rôle nas_proxy) à IP fixe dans ce sous-réseau
# (nas_proxy_media_ip, 172.30.96.10, saisie dans les « Proxys connus » de
# Jellyfin). Créé par ce projet, externe pour nas_proxy. Hors des réseaux déjà
# pris sur le NAS (bridge 172.17, newt 172.18, virbr 192.100).
jellyfin_proxy_subnet: 172.30.96.0/24
# --- Sauvegarde (rôle borgmatic, tasks/app.yml ; borgmatic en conteneur sur
# le NAS) : configuration, base SQLite copiée à froid par « .backup », compose.
# Ni le certificat (nas_proxy, régénérable), ni le cache, ni les médias : ceux-ci
# n'ont que les instantanés d'UGOS.
jellyfin_backup_enabled: true
jellyfin_backup_borgmatic_target: "{{ backup_storage_box_url }}/jellyfin"
jellyfin_backup_encryption_passphrase: "{{ backup_passphrase }}"
# URL push du moniteur « Backup Jellyfin » (nas.yml, sortie
# uptime_backup_jellyfin_url de tofu/pangolin_config).
jellyfin_backup_healthcheck_url: ""

# --- Connexion par Pocket ID (greffon « SSO Authentication » de K0lin, fork
# maintenu de jellyfin-plugin-sso ; README du rôle). Posé seulement si les trois
# sorties de pangolin_config existent (client jellyfin de pocket_id.tf) : sans
# elles, Jellyfin reste tel quel (mots de passe locaux, Quick Connect).
jellyfin_sso_client_id: "{{ terraform_outputs.pocket_id_jellyfin_client_id.value | default('') }}"
jellyfin_sso_client_secret: "{{ terraform_outputs.pocket_id_jellyfin_client_secret.value | default('') }}"
jellyfin_sso_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
jellyfin_sso_enabled: "{{ jellyfin_sso_client_id != '' and jellyfin_sso_client_secret != '' and jellyfin_sso_issuer != '' }}"
# Télécharger et extraire le greffon : faux en Molecule (pas de réseau).
jellyfin_sso_install: true
# renovate: datasource=github-releases depName=K0lin/jellyfin-plugin-sso
jellyfin_sso_version: "5.1.1"
# sha256 de l'archive sso-authentication_<version>.zip de la release : curl -sL
# <jellyfin_sso_url> | sha256sum, à refaire à la main sur la PR de Renovate,
# sinon get_url refuse l'archive.
# targetAbi du greffon 12.0.0.0, chargé par Jellyfin 12.4 (testé le 2026-11-06).
jellyfin_sso_checksum: "sha256:db126b4763bda3a3754fa2103232fc03ef1bf929cfeda35f2e9af39c875233b1"
jellyfin_sso_url: "https://github.com/K0lin/jellyfin-plugin-sso/releases/download/v{{ jellyfin_sso_version }}/sso-authentication_{{ jellyfin_sso_version }}.zip"
# Nom du fournisseur : fait partie du rappel /sso/OID/redirect/<nom> déclaré
# dans Pocket ID (pocket_id.tf) et de l'adresse /sso/OID/start/<nom> du bouton.
jellyfin_sso_provider: pocketid
# Groupes Pocket ID lus dans le claim groups à chaque connexion : jellyfin
# (rôle Pangolin du foyer) laisse entrer, jellyfin-admin rend administrateur.
jellyfin_sso_roles: [jellyfin, jellyfin-admin]
jellyfin_sso_admin_roles: [jellyfin-admin]

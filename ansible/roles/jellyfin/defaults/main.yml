---
# Jellyfin, sur le NAS (nas.yml) : un seul conteneur sous dc@jellyfin, en
# unité système (docker_service_scope: system, host_vars/nas).
jellyfin_service: jellyfin
jellyfin_base_path: "{{ docker_base_path }}/{{ jellyfin_service }}"

# Compte de l'hôte sous lequel tourne le conteneur (uid et gid primaire lus au
# déploiement) : les fichiers copiés par SMB lui appartiennent, il les lit
# quel que soit leur mode. Sur le NAS, sylvain (1000).
jellyfin_user: "{{ ansible_user }}"

# Dossier partagé UGOS des médias, créé dans l'interface (corbeille décochée),
# monté en lecture seule. Le rôle refuse de démarrer s'il manque, lui ou un
# des dossiers des bibliothèques.
jellyfin_media_path: /volume1/media
jellyfin_media_folders:
  - films
  - series
  - musique
  - livres
  - livres-audio

# Quick Sync (iGPU du N100) : le conteneur rejoint le groupe propriétaire du
# périphérique (render sur le NAS), gid lu sur le périphérique au déploiement.
jellyfin_render_device: /dev/dri/renderD128

# Publié sur le LAN (TV, Chromecast, téléphones à la maison) : repli en HTTP
# simple, à côté de https://media.sylvain.cloud:8443.
jellyfin_port: 8096
# Provisoire : à recaler à ~2x memory.peak après une semaine d'usage.
jellyfin_mem_limit: 3g

# --- Traefik devant Jellyfin : https://media.sylvain.cloud ---
# Une seule adresse en LAN et par le client Pangolin. Le A public
# media.sylvain.cloud vise l'IP LAN du NAS (tofu/dns/media.tf), et la ressource
# privée Pangolin du même nom vise ce Traefik sur le réseau newt, en 443 et 8443
# (tofu/pangolin_config/private_resources.tf). Certificat Let's Encrypt par
# DNS-01 OVH : rien n'a besoin d'être joignable depuis Internet.
jellyfin_domain: media.sylvain.cloud
# Port de l'hôte NAS : 80 et 443 appartiennent au nginx d'UGOS (redirections
# vers son interface, 9999 et 9443). Traefik écoute sur ce port dans le
# conteneur aussi : https://media.sylvain.cloud:8443 en LAN comme par Pangolin
# (tcp_port_range "443,8443", que tofu/pangolin_config/tests vérifie contre
# cette ligne), et sans numéro de port par Pangolin (443 du conteneur).
jellyfin_https_port: 8443
jellyfin_acme_email: "{{ pangolin_le_email }}"
# Clé OVH dédiée au DNS-01, restreinte aux trois appels que fait lego (ajout du
# TXT, rafraîchissement de la zone, suppression du TXT), créée sur
# https://eu.api.ovh.com/createToken/?POST=/domain/zone/sylvain.cloud/record&POST=/domain/zone/sylvain.cloud/refresh&DELETE=/domain/zone/sylvain.cloud/record/*
# Clés SOPS préfixées nas_ovh_*, jamais le nom d'une variable du rôle.
jellyfin_ovh_endpoint: ovh-eu
jellyfin_ovh_application_key: "{{ nas_ovh_application_key }}"
jellyfin_ovh_application_secret: "{{ nas_ovh_application_secret }}"
jellyfin_ovh_consumer_key: "{{ nas_ovh_consumer_key }}"
# Réseau privé entre Traefik et Jellyfin, à sous-réseau fixe : Traefik y a une
# IP fixe, celle à saisir dans Jellyfin (Tableau de bord, Réseau, « Proxys
# connus ») pour qu'il croie ses X-Forwarded-*. Hors des réseaux déjà pris sur
# le NAS (bridge 172.17, newt 172.18, virbr 192.100).
jellyfin_proxy_subnet: 172.30.96.0/24
jellyfin_traefik_ip: 172.30.96.10
jellyfin_traefik_mem_limit: 256m

# --- Sauvegarde (rôle borgmatic, tasks/app.yml ; borgmatic en conteneur sur
# le NAS) : configuration, base SQLite copiée à froid par « .backup », Traefik
# (certificat) et compose. Ni le cache ni les médias : ceux-ci n'ont que les
# instantanés d'UGOS.
jellyfin_backup_enabled: true
jellyfin_backup_borgmatic_target: "{{ backup_storage_box_url }}/jellyfin"
jellyfin_backup_encryption_passphrase: "{{ backup_passphrase }}"
# URL push du moniteur « Backup Jellyfin » (nas.yml, sortie
# uptime_backup_jellyfin_url de tofu/pangolin_config).
jellyfin_backup_healthcheck_url: ""

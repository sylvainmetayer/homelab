---
# Avant toute écriture : le dossier partagé des médias et ses dossiers se
# créent dans l'interface d'UGOS, jamais ici. Sans eux, rien n'est déployé.
- name: Check the media folders
  become: true
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [jellyfin_media_path] + jellyfin_media_folders | map('regex_replace', '^', jellyfin_media_path ~ '/') | list }}"
  register: jellyfin_media_stat

- name: Assert the media share and its library folders exist
  vars:
    jellyfin_media_missing: "{{ jellyfin_media_stat.results | rejectattr('stat.isdir', 'defined') | map(attribute='item') | list
      + jellyfin_media_stat.results | selectattr('stat.isdir', 'defined') | rejectattr('stat.isdir') | map(attribute='item') | list }}"
  ansible.builtin.assert:
    that:
      - jellyfin_media_missing | length == 0
    fail_msg: >-
      Absents ou pas des dossiers : {{ jellyfin_media_missing | join(', ') }}.
      Créer dans UGOS (Fichiers, Dossier partagé, Créer) le dossier partagé
      « {{ jellyfin_media_path | basename }} » sur le volume 1, corbeille
      décochée, puis ses dossiers {{ jellyfin_media_folders | join(', ') }} ;
      relancer ensuite nas.yml --tags jellyfin.
    quiet: true

# become : /dev/dri peut être fermé au compte de connexion (0750 root).
- name: Check the Quick Sync render device
  become: true
  ansible.builtin.stat:
    path: "{{ jellyfin_render_device }}"
  register: jellyfin_render_stat

- name: Assert the render device exists
  ansible.builtin.assert:
    that:
      - jellyfin_render_stat.stat.ischr | default(false)
    fail_msg: "{{ jellyfin_render_device }} absent : pas d'iGPU visible pour Quick Sync."
    quiet: true

# nas.yml ne collecte pas de faits : uid et gid sont lus ici (getent échoue
# si le compte n'existe pas). Le groupe ajouté est celui qui possède le
# périphérique (stat ci-dessus), quel que soit son nom sous UGOS.
- name: Read the account Jellyfin runs as
  ansible.builtin.getent:
    database: passwd
    key: "{{ jellyfin_user }}"

- name: Remember the ids Jellyfin runs with
  ansible.builtin.set_fact:
    jellyfin_uid: "{{ ansible_facts['getent_passwd'][jellyfin_user][1] }}"
    jellyfin_gid: "{{ ansible_facts['getent_passwd'][jellyfin_user][2] }}"
    jellyfin_render_gid: "{{ jellyfin_render_stat.stat.gid }}"

# Le compte propriétaire des médias, jamais root (un -e ansible_user=root),
# ni le groupe root : un périphérique de rendu resté root:root (pas de règle
# udev) ferait ajouter le gid 0 par group_add.
- name: Refuse to run Jellyfin as root
  ansible.builtin.assert:
    that:
      - jellyfin_uid | int != 0
      - jellyfin_gid | int != 0
      - jellyfin_render_gid | int != 0
    fail_msg: >-
      Jellyfin tourne sous le compte propriétaire des médias, jamais root :
      jellyfin_user {{ jellyfin_user }} ({{ jellyfin_uid }}:{{ jellyfin_gid }}),
      groupe de {{ jellyfin_render_device }} {{ jellyfin_render_gid }}.
    quiet: true

# dc@ user : dossier de l'utilisateur de déploiement. dc@ système (NAS) :
# root (jellyfin_as_root, vars/).
- name: Ensure the Jellyfin folder exists
  become: "{{ jellyfin_as_root }}"
  ansible.builtin.file:
    path: "{{ jellyfin_base_path }}"
    state: directory
    owner: "{{ omit if jellyfin_as_root else jellyfin_uid }}"
    group: "{{ omit if jellyfin_as_root else jellyfin_gid }}"
    mode: "0700"

# Configuration, base SQLite et cache : au compte du conteneur, sur le disque
# du NAS (jamais sur NFS).
- name: Ensure the Jellyfin config and cache folders belong to its account
  become: true
  loop:
    - "{{ jellyfin_base_path }}/config"
    - "{{ jellyfin_base_path }}/cache"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jellyfin_uid }}"
    group: "{{ jellyfin_gid }}"
    mode: "0700"

# Traefik : configuration et certificat à root (root dans le conteneur, sans
# CAP_DAC_OVERRIDE), sur le disque du NAS, jamais sur NFS. Rien de secret dans
# les deux fichiers de configuration (les identifiants OVH sont dans le
# compose), mais acme.json porte la clé privée du certificat.
- name: Ensure the Traefik folders exist
  become: true
  loop:
    - "{{ jellyfin_base_path }}/traefik"
    - "{{ jellyfin_base_path }}/traefik/config"
    - "{{ jellyfin_base_path }}/traefik/acme"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Template the Traefik configuration
  become: true
  diff: false
  notify: Restart jellyfin
  loop:
    - { src: traefik.yml, dest: traefik.yml }
    - { src: traefik_dynamic.yml, dest: dynamic.yml }
  ansible.builtin.template:
    src: "templates/{{ item.src }}"
    dest: "{{ jellyfin_base_path }}/traefik/config/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"

# Traefik refuse un acme.json qui n'est pas en 0600. Créé vide une fois, puis
# laissé à Traefik : touch ne change jamais le contenu (dates préservées,
# idempotent), mais repose propriétaire et mode à chaque passage.
- name: Ensure the ACME storage exists with mode 0600
  become: true
  ansible.builtin.file:
    path: "{{ jellyfin_base_path }}/traefik/acme/acme.json"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: root
    group: root
    mode: "0600"

- name: Template the Jellyfin compose configuration
  become: "{{ jellyfin_as_root }}"
  diff: false
  notify: Restart jellyfin
  ansible.builtin.template:
    src: templates/compose.yaml
    dest: "{{ jellyfin_base_path }}/compose.yaml"
    owner: "{{ omit if jellyfin_as_root else jellyfin_uid }}"
    group: "{{ omit if jellyfin_as_root else jellyfin_gid }}"
    mode: "0600"

# Unité user, ou système sur le NAS (/etc/systemd/system/dc@.service posée par
# docker_service dans nas.yml).
- name: Make sure the Jellyfin service is running
  become: "{{ jellyfin_as_root }}"
  ansible.builtin.systemd:
    name: "dc@{{ jellyfin_service }}"
    scope: "{{ jellyfin_dc_scope }}"
    state: started
    enabled: true
    daemon_reload: true

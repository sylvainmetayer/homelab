---
- name: Ensure SearXNG app folder exists
  become: true
  loop:
    - "{{ searxng_base_path }}"
    - "{{ searxng_base_path }}/config"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Ensure SearXNG secret key is defined
  ansible.builtin.fail:
    msg: "searxng_secret_key must be set in ansible/secrets.sops.yaml before running ansible/docker.yml"
  when: searxng_secret_key | length == 0

- name: Template SearXNG settings
  become: true
  notify: Restart searxng service
  ansible.builtin.template:
    src: "templates/settings.yml.j2"
    dest: "{{ searxng_base_path }}/config/settings.yml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template SearXNG environment
  notify: Restart searxng service
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ searxng_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template compose configuration
  notify: Restart searxng service
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ searxng_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Make sure searxng service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@searxng
    scope: user
    enabled: true

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for SearXNG
  when: searxng_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: searxng
    borgmatic_app_title: SearXNG
    borgmatic_app_target: "{{ searxng_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ searxng_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ searxng_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ searxng_base_path }}/config"
      - "{{ searxng_base_path }}/compose.yaml"
      - "{{ searxng_base_path }}/.env"

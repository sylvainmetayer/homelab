---
- name: Ensure SearXNG app folder exists
  become: true
  loop:
    - "{{ searxng_base_path }}"
    - "{{ searxng_base_path }}/config"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Ensure SearXNG secret key is defined
  ansible.builtin.fail:
    msg: "searxng_secret_key must be set in ansible/secrets.sops.yaml before running ansible/docker.yml"
  when: searxng_secret_key | length == 0

- name: Template SearXNG settings
  become: true
  notify: Restart searxng service
  ansible.builtin.template:
    src: "templates/settings.yml.j2"
    dest: "{{ searxng_base_path }}/config/settings.yml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template SearXNG environment
  notify: Restart searxng service
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ searxng_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template compose configuration
  notify: Restart searxng service
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ searxng_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Make sure searxng service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@searxng
    scope: user
    enabled: true

# Borgmatic backup configuration
- name: Configure borgmatic backup for SearXNG
  when: searxng_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for SearXNG
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-searxng.yaml.j2"
        dest: "{{ borgmatic_config_dir }}/searxng.yaml"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Initialize borg repository for SearXNG
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic --verbosity 1 --config {{ borgmatic_config_dir }}/searxng.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: searxng_borg_repo_create
      # borgmatic 2.x ne recrée pas un dépôt existant : il annonce « Repository
      # already exists. Skipping creation. » au niveau INFO (d'où --verbosity 1)
      # et sort en 0 ; borg 1.x, lui, échoue sur « A repository already exists ».
      changed_when: "'already exists' not in ((searxng_borg_repo_create.stdout ~ searxng_borg_repo_create.stderr) | lower)"
      failed_when: >
        searxng_borg_repo_create.rc != 0 and
        'already exists' not in (searxng_borg_repo_create.stderr | lower)

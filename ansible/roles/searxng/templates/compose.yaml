---
services:
  searxng:
    mem_limit: 512m
    container_name: searxng
    image: searxng/searxng:2026.9.16-461f174b0@sha256:a31763b7af3caf6ae9aac1816ba774214eb550252e06a4998f276ded8d60461b
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=https://{{ searxng_domain }}/
    # SEARXNG_SECRET (server.secret_key), hors de settings.yml.
    env_file:
      - .env
    volumes:
      - ./config:/etc/searxng:rw
    networks:
      - newt

networks:
  newt:
    external: true

---
services:
  searxng:
    mem_limit: 512m
    container_name: searxng
    image: searxng/searxng:2026.10.11-ad46ebd7d@sha256:ddd642cae6eac75412938fd846ddbf440a2df029cfeae8a562b8b205f4e35e25
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=https://{{ searxng_domain }}/
    # SEARXNG_SECRET (server.secret_key), hors de settings.yml.
    env_file:
      - .env
    volumes:
      - ./config:/etc/searxng:rw
    networks:
      - newt

networks:
  newt:
    external: true

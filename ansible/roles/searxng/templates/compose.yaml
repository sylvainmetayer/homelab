---
services:
  searxng:
    mem_limit: 512m
    container_name: searxng
    image: searxng/searxng:2026.10.16-ff8f5ddcc@sha256:b4e34a39f76b1c860bbc53a0f35b10492029b2b18ef1d868df464fe43d7e0b93
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=https://{{ searxng_domain }}/
    # SEARXNG_SECRET (server.secret_key), hors de settings.yml.
    env_file:
      - .env
    volumes:
      - ./config:/etc/searxng:rw
    networks:
      - newt

networks:
  newt:
    external: true

---
services:
  searxng:
    mem_limit: 512m
    container_name: searxng
    image: searxng/searxng:2026.10.13-22c64b8d3@sha256:9b61996edcc679fb6665290f95fda15389a14eda6060e41a25c63ab2758f2436
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=https://{{ searxng_domain }}/
    # SEARXNG_SECRET (server.secret_key), hors de settings.yml.
    env_file:
      - .env
    volumes:
      - ./config:/etc/searxng:rw
    networks:
      - newt

networks:
  newt:
    external: true

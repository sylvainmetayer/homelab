---
- name: Ensure Karakeep app folders exist
  loop:
    - "{{ karakeep_base_path }}"
    - "{{ karakeep_base_path }}/data"
    - "{{ karakeep_base_path }}/meilisearch"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart karakeep
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ karakeep_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template environment configuration
  notify: Restart karakeep
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ karakeep_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration
- name: Configure borgmatic backup for Karakeep
  when: karakeep_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for Karakeep
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-karakeep.yaml.j2"
        dest: "{{ borgmatic_config_dir }}/karakeep.yaml"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Initialize borg repository for Karakeep
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic
          --config {{ borgmatic_config_dir }}/karakeep.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: karakeep_borg_repo_create
      changed_when: "'repository already exists' not in karakeep_borg_repo_create.stderr"
      failed_when: >
        karakeep_borg_repo_create.rc != 0 and
        'repository already exists' not in karakeep_borg_repo_create.stderr

- name: Make sure karakeep service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@karakeep
    scope: user
    enabled: true

---
- name: Ensure Karakeep app folders exist
  loop:
    - "{{ karakeep_base_path }}"
    - "{{ karakeep_base_path }}/data"
    - "{{ karakeep_base_path }}/meilisearch"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart karakeep
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ karakeep_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template environment configuration
  notify: Restart karakeep
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ karakeep_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Karakeep
  when: karakeep_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: karakeep
    borgmatic_app_title: Karakeep
    borgmatic_app_target: "{{ karakeep_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ karakeep_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ karakeep_backup_healthcheck_url }}"
    # ./meilisearch n'est pas sauvegardé : l'index se reconstruit depuis la
    # base (Paramètres admin > « Reindex all bookmarks »).
    borgmatic_app_source_directories:
      - "{{ karakeep_base_path }}/data"
      - "{{ karakeep_base_path }}/compose.yaml"
      - "{{ karakeep_base_path }}/.env"
    # db.db (signets, comptes) et queue.db (file de jobs) dans DATA_DIR.
    borgmatic_app_sqlite_databases:
      - "{{ karakeep_base_path }}/data/*.db"

- name: Make sure karakeep service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@karakeep
    scope: user
    enabled: true

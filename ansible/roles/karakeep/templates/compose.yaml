---
services:
  web:
    # Pas encore mesuré : Next.js + workers (crawler, recherche, assets) dans
    # le même conteneur. À recaler sur memory.peak après quelques jours.
    mem_limit: 1g
    image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
    container_name: karakeep
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://karakeep-meilisearch:7700
      BROWSER_WEB_URL: http://karakeep-chrome:9222
      DATA_DIR: /data
    depends_on:
      chrome:
        condition: service_started
      meilisearch:
        condition: service_healthy
    volumes:
      - ./data:/data
    networks:
      - karakeep
      - newt

  chrome:
    # Chromium headless du crawler : charge de fond, il cède sous contention.
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 1g
    # Upstream ne publie que release/latest pour cette image, pas de tag versionné.
    image: ghcr.io/karakeep-app/karakeep-chrome:release@sha256:4ad61127638dd27bfe685222787c5780dd1d083d23a7658c39af657775814c44
    container_name: karakeep-chrome
    restart: unless-stopped
    init: true
    command:
      - --disable-gpu
      - --disable-dev-shm-usage
      - --hide-scrollbars
      - --disable-blink-features=AutomationControlled
      - --window-size=1440,900
    networks:
      - karakeep

  meilisearch:
    mem_limit: 512m
    mem_reservation: 256m
    image: docker.io/getmeili/meilisearch:v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "{{ karakeep_meili_master_key }}"
      # Meilisearch refuse de démarrer sur une base écrite par une autre
      # version, patch compris (1.54.3 -> 1.54.4) : sans migration au
      # démarrage, chaque montée Renovate laissait la recherche en panne.
      # Les majeures restent soumises à approbation (renovate.json).
      MEILI_UPGRADE_DB: "true"
      # En INFO, Meilisearch écrit une ligne par requête HTTP, soit surtout son
      # propre healthcheck (6 Mo/jour de json-file, recopiés dans journald et
      # VictoriaLogs). Les avertissements et erreurs restent.
      MEILI_LOG_LEVEL: WARN
    volumes:
      - ./meilisearch:/meili_data
    networks:
      - karakeep
    # L'image installe curl ; /health répond sans la clé maître.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7700/health"]
      # Toutes les 30 s en régime établi, toutes les 5 s pendant le
      # start_period (start_interval) : karakeep, qui l'attend
      # (service_healthy), démarre aussi vite qu'avant.
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

# Pas `internal: true` : le crawler (chrome) et le web vont chercher les pages
# sur Internet.
networks:
  karakeep:
  newt:
    external: true

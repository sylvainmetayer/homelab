---
karakeep_base_path: "{{ docker_base_path }}/karakeep"
karakeep_domain: keep.sylvain.cloud

# Dérivés de backup_passphrase comme trek_encryption_key : pas d'entrée SOPS à
# maintenir. Changer NEXTAUTH_SECRET déconnecte les sessions ; changer
# MEILI_MASTER_KEY demande de vider ./meilisearch et de réindexer.
karakeep_nextauth_secret: "{{ (backup_passphrase ~ '-karakeep-nextauth') | hash('sha256') }}"
karakeep_meili_master_key: "{{ (backup_passphrase ~ '-karakeep-meili') | hash('sha256') }}"

# Le premier compte créé est administrateur (fait). Repasser à false le temps
# d'ouvrir un compte supplémentaire, ou le créer depuis l'admin.
karakeep_disable_signups: true

# Connexion par Pocket ID (tofu/pangolin_config/pocket_id.tf, client
# karakeep) : rendue seulement quand l'émetteur, l'identifiant et le secret
# sont dans le state. Le mot de passe reste (appli mobile et extension).
# Liaison par e-mail d'un compte existant : DISABLE_SIGNUPS empêche Karakeep de
# créer un compte au premier login, il faut donc lier. Sûr ici : seul
# l'administrateur crée les comptes Pocket ID, avec leur e-mail.
karakeep_oidc_client_id: "{{ terraform_outputs.pocket_id_karakeep_client_id.value | default('') }}"
karakeep_oidc_client_secret: "{{ terraform_outputs.pocket_id_karakeep_client_secret.value | default('') }}"
karakeep_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
karakeep_oidc_enabled: "{{ karakeep_oidc_client_id | length > 0 and karakeep_oidc_client_secret | length > 0 and karakeep_oidc_issuer | length > 0 }}"
# Inférence (tags et résumés) par la passerelle IA de Pangolin, format OpenAI
# (tofu/pangolin_config/ai_gateway.tf) ; clé virtuelle vide : inférence coupée.
karakeep_ai_api_key: "{{ (terraform_outputs.ai_gateway_keys.value | default({})).karakeep | default('') }}"
karakeep_ai_base_url: https://ia.sylvain.cloud/v1
karakeep_ai_model: claude-haiku-5-5

# Téléchargement des vidéos au crawl (yt-dlp), plafond en Mo par vidéo.
karakeep_video_download: true
karakeep_video_download_max_size_mb: 100
karakeep_ytdlp_args:
  - "--match-filter"
  - "extractor_key!=Youtube"
  # Karakeep passe `-f best[filesize<N]`, qui ne trouve rien sur X : image et
  # son y sont des flux HLS séparés, sans taille connue d'avance. Le dernier
  # `-f` l'emporte ; ffmpeg (présent dans l'image) fusionne, et la limite de
  # taille passe par --max-filesize.
  - "-f"
  - "bv*+ba/b"
  - "--max-filesize"
  - "{{ karakeep_video_download_max_size_mb }}M"

# Borgmatic backup configuration
karakeep_backup_enabled: true
karakeep_backup_borgmatic_target: "{{ backup_storage_box_url }}/karakeep"
karakeep_backup_encryption_passphrase: "{{ backup_passphrase }}"
karakeep_backup_healthcheck_url: ""

---
flip_planning_base_path: "{{ docker_base_path }}/flip_planning"
flip_planning_domain: flip-planning.sylvain.cloud

# Image published on GitHub Container Registry (private package)
# Digest pinned so Ansible redeploys deterministically; Renovate bumps it
# (see the custom manager in renovate.json)
# renovate: datasource=docker depName=ghcr.io/sylvainmetayer/flip-planning
flip_planning_image: "ghcr.io/sylvainmetayer/flip-planning:main@sha256:7172367347e0a7f7607b9561928dd997e0041512dabf4cb094fbe0c2966fe392"

# GHCR authentication (private package): needs a PAT with read:packages
flip_planning_ghcr_registry: "ghcr.io"
flip_planning_ghcr_username: "sylvainmetayer"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_ghcr_token: ""

# PostgreSQL database configuration
flip_planning_db_user: "festival"
flip_planning_db_name: "festival"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_db_password: ""

# App secrets
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_api_key: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token_id: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_admin_password: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_session_encryption_key: ""

# Reverse proxies the login lockout may believe when it reads X-Forwarded-For.
#
# Behind Pangolin the app never sees the client directly: Traefik writes the real
# address into X-Forwarded-For, newt tunnels it at L4, and the peer the app
# observes is the newt container on the shared bridge. That container address is
# handed out at attach time and moves when the stacks restart in another order —
# so what gets declared is the network's SUBNET, fixed at creation.
#
# Left empty, the subnet is read from the newt network at deploy time. Set it to
# pin a value, or to declare something else (a literal address, or a
# comma-separated mix of both).
#
# Without this, the lockout counts every visitor against newt's single address:
# safe, but five failed logins from anyone lock the form for everyone.
flip_planning_trusted_proxies: ""

# The docker network newt attaches to; the app joins it to be reachable.
flip_planning_newt_network: "newt"

# pgAdmin, exposed on the /db sub-path of flip_planning_domain
flip_planning_pgadmin_enabled: true
flip_planning_pgadmin_path: "/db"
flip_planning_pgadmin_email: "admin@sylvain.cloud"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_pgadmin_password: ""

# Borgmatic backup configuration
flip_planning_backup_enabled: true
flip_planning_backup_borgmatic_target: ""
flip_planning_backup_encryption_passphrase: ""
flip_planning_backup_healthcheck_url: ""

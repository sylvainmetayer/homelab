---
# ---------------------------------------------------------------------------
# Instance identity.
#
# This role is applied once per environment (see ansible/docker.yml): the
# production instance keeps the values below, any other instance overrides them
# as role parameters. Everything two instances cannot share while living on the
# same Docker host derives from these two variables — compose project
# directory, systemd unit, container names, docker network, borgmatic config
# file — so a third environment is a matter of overriding them again.
#
# The compose project DIRECTORY under {{ docker_base_path }}, and the systemd
# unit instance (dc@<service>). Those two are the same string by construction:
# dc@.service runs in /opt/apps/%i, so the unit named after the service finds
# the compose file this role wrote. snake_case, and it must match a handler
# name in handlers/main.yml (handler names cannot be templated, see the
# comment there).
flip_planning_service: flip_planning
# Prefix of every container name and of the private docker network, so it is
# also what the Pangolin targets resolve on the newt network — keep it in sync
# with the `ip` / `hc_hostname` of tofu/pangolin_config/website_<instance>.tf.
# kebab-case.
flip_planning_container_prefix: flip-planning
# ---------------------------------------------------------------------------

flip_planning_base_path: "{{ docker_base_path }}/{{ flip_planning_service }}"
flip_planning_domain: flip-planning.sylvain.cloud

# Image published on GitHub Container Registry, PUBLIC package: the pull needs
# no credentials, which is why this role holds no registry login.
#
# Two channels, each digest pinned so Ansible redeploys deterministically;
# Renovate bumps both (custom manager and packageRules in renovate.json):
# - release: the published X.Y.Z tags (git tags vX.Y.Z). What production runs,
#   so that a deployment has a name. Patch and minor automerge, a major waits
#   for a manual merge.
# - main: the image rebuilt on every merge upstream. What the demo runs; every
#   new digest automerges.
# Both live here rather than in docker.yml because the deploy workflow only
# maps ansible/roles/** changes to tags: a bump of either one redeploys both
# instances, and the one whose image did not move is a no-op.
# renovate: datasource=docker depName=ghcr.io/sylvainmetayer/planning-equipes
flip_planning_image_release: "ghcr.io/sylvainmetayer/planning-equipes:1.0.0@sha256:dad695f4758c51ece8e0013557f140c3bc9608a0a3a577efc426f3531e5d0f0f"
# renovate: datasource=docker depName=ghcr.io/sylvainmetayer/planning-equipes
flip_planning_image_main: "ghcr.io/sylvainmetayer/planning-equipes:main@sha256:bad6d45bd2350d532d256be15409ecf8d957c05e6863766e6e2f6ae7f63d3a09"
# The image this instance runs; the demo overrides it with the main channel.
flip_planning_image: "{{ flip_planning_image_release }}"

# PostgreSQL database configuration
flip_planning_db_user: "festival"
flip_planning_db_name: "festival"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_db_password: ""

# App secrets
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_api_key: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token_id: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_admin_password: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_session_encryption_key: ""

# Mentions légales, served publicly on /mentions-legales. Those of the
# ORGANISER (the employer of the people being scheduled and the data
# controller), not of the hoster. Left empty, the page announces itself as
# incomplete. Names and addresses of real people: kept out of this public repo.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_editeur: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_directeur_publication: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_hebergeur: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_contact: ""
# Data controller (RGPD), when it differs from the LCEN publisher above.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_responsable_traitement: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_base_legale: ""
# DISPLAYED to users and enforced by nobody: the purge is a yearly manual
# operation (docs/exploitation.md in the app repo). Only announce what is kept.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_conservation: ""

# Tags the Bugsink/Sentry issues with the environment they came from, so a
# crash on a demo is not investigated as a production incident.
flip_planning_sentry_environment: production

# Product name shown in the application UI and on the generated PDFs. Carries
# the environment for anything but production: two instances share the same
# branding assets, and this string is the only thing telling a screenshot of
# one from a screenshot of the other.
flip_planning_branding_product_name: "Flip Planning"

# Cloudflare Web Analytics beacon token. Empty = audience measurement off.
# Set ⇒ a transfer outside the EU that the mentions légales must declare.
# A public identifier by construction (it ships in every page), so it lives in
# plain text in host_vars/docker/variables.yaml rather than in sops.
flip_planning_cloudflare_web_analytics_token: ""

# Repairs the Flyway schema history at startup. Flip to true TEMPORARILY when a
# migration interrupted halfway blocks every later one, then back to false: it
# also realigns checksums, which would hide an edited migration.
flip_planning_flyway_repair_at_start: false

# Lets the Débogage page freeze the date — and, optionally, the time of day —
# that the mode jour J screen and the espace animateur read, as a server under
# `quarkus:dev` does. Off unless a host asks for it: those are the two screens
# that only describe what is still ahead TODAY, and while a date is frozen they
# describe a day that is not today — the night jobs' day-before reminders
# included, which go out to real people. Granted on the docker host, see
# host_vars/docker/variables.yaml.
#
# Granting it alone changes nothing: the clock stays real until someone freezes
# it from that page. But taking the permission away while a date is still
# frozen is the one move to avoid — the application then ignores the frozen
# value (it reads the real clock again) *and* refuses to clear the row, so the
# table keeps a date nobody can see. Unfreeze first, flip this after.
flip_planning_horloge_simulee_autorisee: false

# Reverse proxies the login lockout may believe when it reads X-Forwarded-For.
#
# Behind Pangolin the app never sees the client directly: Traefik writes the real
# address into X-Forwarded-For, newt tunnels it at L4, and the peer the app
# observes is the newt container on the shared bridge. That container address is
# handed out at attach time and moves when the stacks restart in another order —
# so what gets declared is the network's SUBNET, fixed at creation.
#
# Left empty, the subnet is read from the newt network at deploy time. Set it to
# pin a value, or to declare something else (a literal address, or a
# comma-separated mix of both).
#
# Without this, the lockout counts every visitor against newt's single address:
# safe, but five failed logins from anyone lock the form for everyone.
flip_planning_trusted_proxies: ""

# The docker network newt attaches to; the app joins it to be reachable.
flip_planning_newt_network: "newt"

# pgAdmin, exposed on the /db sub-path of flip_planning_domain
flip_planning_pgadmin_enabled: true
flip_planning_pgadmin_path: "/db"
flip_planning_pgadmin_email: "admin@sylvain.cloud"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_pgadmin_password: ""

# Borgmatic backup configuration
flip_planning_backup_enabled: true
flip_planning_backup_borgmatic_target: ""
flip_planning_backup_encryption_passphrase: ""
flip_planning_backup_healthcheck_url: ""

---
# ---------------------------------------------------------------------------
# Instance identity.
#
# This role is applied once per environment (see ansible/flip.yml): the
# production instance keeps the values below, any other instance overrides them
# as role parameters. Everything two instances cannot share while living on the
# same Docker host derives from these two variables — compose project
# directory, systemd unit, container names, docker network, borgmatic config
# file — so a third environment is a matter of overriding them again.
#
# The compose project DIRECTORY under {{ docker_base_path }}, and the systemd
# unit instance (dc@<service>). Those two are the same string by construction:
# dc@.service runs in /opt/apps/%i, so the unit named after the service finds
# the compose file this role wrote. snake_case, and it must match a handler
# name in handlers/main.yml (handler names cannot be templated, see the
# comment there).
flip_planning_service: flip_planning
# Prefix of every container name and of the private docker network, so it is
# also what the Pangolin targets resolve on the newt network — keep it in sync
# with the `ip` / `hc_hostname` of tofu/pangolin_config/website_<instance>.tf.
# kebab-case.
flip_planning_container_prefix: flip-planning
# ---------------------------------------------------------------------------

flip_planning_base_path: "{{ docker_base_path }}/{{ flip_planning_service }}"
flip_planning_domain: flip-planning.sylvain.cloud

# Image published on GitHub Container Registry, PUBLIC package: the pull needs
# no credentials, which is why this role holds no registry login.
#
# Two channels, each digest pinned so Ansible redeploys deterministically;
# Renovate bumps both (custom manager and packageRules in renovate.json):
# - release: the published X.Y.Z tags (git tags vX.Y.Z). What production runs,
#   so that a deployment has a name. Patch and minor automerge, a major waits
#   for a manual merge.
# - main: the image rebuilt on every merge upstream. What the demo runs; every
#   new digest automerges.
# Both live here rather than in flip.yml because the deploy workflow only
# maps ansible/roles/** changes to tags: a bump of either one redeploys both
# instances, and the one whose image did not move is a no-op.
# renovate: datasource=docker depName=ghcr.io/sylvainmetayer/planning-equipes
flip_planning_image_release: "ghcr.io/sylvainmetayer/planning-equipes:1.4.0"
# renovate: datasource=docker depName=ghcr.io/sylvainmetayer/planning-equipes
flip_planning_image_main: "ghcr.io/sylvainmetayer/planning-equipes:main@sha256:200a0514c3e224bc137ff1a3369b9106b7fe82cc70566a1924d88f9f1e3c5602"
# The image this instance runs; the demo overrides it with the main channel.
flip_planning_image: "{{ flip_planning_image_release }}"

# Memory of the app container, and the JVM options that size its heap from it.
# The solver's local search allocates relentlessly: with the JVM's default heap
# (25 % of the limit, 256 MiB under 1g) and its default collector it spends its
# time collecting. Three quarters of 2g for the heap and the parallel collector
# more than doubled the moves evaluated per second, and a solve peaked at about
# 1.1 GiB with ~200 MiB outside the heap — 2g is the ~2× headroom the doctrine
# asks for (AGENTS.md). Never keep 75 % under a 1g limit: too little is left
# outside the heap, and the container dies mid-solve.
#
# JDK_JAVA_OPTIONS, not JAVA_TOOL_OPTIONS: only the `java` launcher reads it,
# and it replaces the value images from the app's next release carry (same
# options, see docs/exploitation.md « La mémoire de l'application » in the app
# repo). Choosing another collector through JAVA_TOOL_OPTIONS on top of it
# makes the JVM refuse to start (« Multiple garbage collectors selected »).
flip_planning_mem_limit: 2g
flip_planning_java_options: "-XX:MaxRAMPercentage=75 -XX:+UseParallelGC"

# PostgreSQL database configuration
flip_planning_db_user: "festival"
flip_planning_db_name: "festival"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_db_password: ""

# App secrets
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_api_key: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token_id: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token: ""

# Rate ceiling on /mcp, per source address and per window. Every request is
# counted, key or no key, and past the ceiling the answer is 429 — the filter
# sits ahead of authentication, so it bounds someone trying the shared key as
# much as someone holding it.
#
# 120 a minute is the application's own default and is wide for an assistant
# driven by a human: a MCP session makes a handful of calls per question. Raise
# it for an instance driven in batches; 0 or less switches the ceiling off,
# which is only reasonable for an instance /mcp cannot be reached on from
# outside — not the case here, both are published through Pangolin.
flip_planning_mcp_max_requests: 120
flip_planning_mcp_rate_window: PT1M

# Lockout on a run of REFUSED keys, the second guard on /mcp and a different
# question from the one above: the ceiling bounds how fast a key — stolen or
# not — can be used, this bounds how cheaply one can be guessed at. 120 requests
# a minute leave thousands of tries an hour; five failures then ten minutes of
# silence make a run cost time. Neither is what makes the key hard to guess:
# that is its length, and both instances draw theirs from secrets.sops.yaml.
#
# It cannot lock out a client being set up: a request carrying no key counts for
# nothing, and one that authenticates clears the run. 0 or less switches it off.
flip_planning_mcp_max_failures: 5
flip_planning_mcp_lockout_duration: PT10M
# Sensitive: must be set in secrets.sops.yaml
flip_planning_admin_password: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_session_encryption_key: ""

# Mentions légales, served publicly on /mentions-legales. Those of the
# ORGANISER (the employer of the people being scheduled and the data
# controller), not of the hoster. Left empty, the page announces itself as
# incomplete. Names and addresses of real people: kept out of this public repo.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_editeur: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_directeur_publication: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_hebergeur: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_contact: ""
# Data controller (RGPD), when it differs from the LCEN publisher above.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_responsable_traitement: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_base_legale: ""
# DISPLAYED to users and enforced by nobody: the purge is a yearly manual
# operation (docs/exploitation.md in the app repo). Only announce what is kept.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_conservation: ""

# Tags the Bugsink/Sentry issues with the environment they came from, so a
# crash on a demo is not investigated as a production incident.
flip_planning_sentry_environment: production

# Product name shown in the application UI and on the generated PDFs. Carries
# the environment for anything but production.
flip_planning_branding_product_name: "Flip Planning"

# Branding images. The application image ships no visual of its own (the app
# repo is public and carries no customer mark), so a client's images are part
# of its deployment: each file below is copied next to the compose file,
# mounted read-only on /assets for the PDFs and served to the browser by the
# assets nginx on the same sub-path.
#
# Each value is a source file on the controller — relative to this role's
# files/ directory (files/flip/ holds the Festival Flip set), or absolute. The
# file lands at /assets/<basename>, which is the URL and the path the
# application gets. Empty means the application's own fallback: no logo, no
# bandeau, no mascot (the Konami easter egg stays off and the loader falls back
# to a Material icon). Empty by default on purpose: only the production
# instance is the festival's, and a demo that carries no client visual cannot
# be mistaken for it in a screenshot. Set as role parameters in flip.yml,
# not in host_vars, which would brand every instance on the host.
#
# Basenames must be unique across the five: they share one directory.
# BRANDING_LOGO_URL — toolbars and the login card
flip_planning_branding_logo: ""
# BRANDING_PDF_LOGO — header of the PDFs and of the HTML mails
flip_planning_branding_pdf_logo: ""
# BRANDING_PDF_STRIP — decorative bandeau on the first page of the individual planning
flip_planning_branding_pdf_strip: ""
# BRANDING_MASCOT_URL — full-size mascot behind the Konami code
flip_planning_branding_mascot: ""
# BRANDING_MASCOT_ICON_URL — the same mascot cut small, spinning during a solve
flip_planning_branding_mascot_icon: ""

# The non-empty sources above, as one list for the copy and the cleanup. A
# default rather than a set_fact so that it is evaluated against each
# instance's own parameters: a set_fact would carry the first instance's list
# into the second (see ansible/flip.yml).
flip_planning_branding_assets: >-
  {{ [flip_planning_branding_logo,
      flip_planning_branding_pdf_logo,
      flip_planning_branding_pdf_strip,
      flip_planning_branding_mascot,
      flip_planning_branding_mascot_icon] | select | list }}

# Cloudflare Web Analytics beacon token. Empty = audience measurement off.
# Set ⇒ a transfer outside the EU that the mentions légales must declare.
# A public identifier by construction (it ships in every page), so it lives in
# plain text in host_vars/flip/variables.yaml rather than in sops.
flip_planning_cloudflare_web_analytics_token: ""

# ---------------------------------------------------------------------------
# Keycloak — the identity provider of an instance, in its own stack, on the
# /auth sub-path of the instance's domain.
#
# Same domain rather than an sso.* subdomain, because Pangolin resources ARE
# subdomains: a second one would mean a second certificate, a second set of geo
# rules and a second resource to forget. The cost is that /auth has to be
# carved out of the resource's Pangolin SSO — see the rule next to the
# instance's pangolin_resource in tofu/pangolin_config.
#
# Off by default, for every instance: turning it on deploys a database and an
# identity provider. The order to bring one up is in the application repository
# (docs/keycloak.md § Mise en production): this flag, then the realm with the
# app repo's terraform/keycloak against https://<domain>/auth, then the two
# client secrets in secrets.sops.yaml, then flip_planning_oidc_enabled.
flip_planning_keycloak_enabled: false

# The application repository's Keycloak image — the official one plus the
# e-mail code authenticator and the « planning » theme (login page, account
# console, e-mails). ALWAYS the same version as flip_planning_image: the two
# are published together under the same tags, and the theme and the
# application's account links are made for each other. No default on purpose:
# an instance that turns Keycloak on names it next to its application image.
flip_planning_keycloak_image: ""

flip_planning_keycloak_db_name: "keycloak"
flip_planning_keycloak_db_user: "keycloak"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_keycloak_db_password: ""

# Bootstrap administrator of the MASTER realm — the one terraform/keycloak
# signs in with to create the planning realm, not an account of it. Keycloak
# asks for it to be replaced by a permanent account from the console.
flip_planning_keycloak_admin_user: "admin"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_keycloak_admin_password: ""

# Accent colour of the Keycloak login page and e-mails (the account console
# reads brand.css only). Empty: the product's own.
flip_planning_keycloak_brand_accent: ""

# ---------------------------------------------------------------------------
# The application's side of Keycloak.
#
# Off: the application keeps its break-glass account open — the same single
# ADMIN_PASSWORD it runs on today. From the release that makes Keycloak
# mandatory (application ADR 0069), production refuses to start with neither,
# which is why the role writes ADMIN_SECOURS_ENABLED=true whenever this is off:
# the existing instances keep working when their image moves past it.
#
# On: named accounts, a second factor imposed on administrators, the espace
# animateur opened by a Keycloak session instead of the e-mail code, and the
# break-glass door closed (flip_planning_admin_secours_enabled).
flip_planning_oidc_enabled: false

# Whether the break-glass account stays open once Keycloak is on. Closed is
# the production posture; open is the way back in when Keycloak is down.
flip_planning_admin_secours_enabled: false

# PUBLIC url of the realm — the one browsers see, and the one that signs the
# issuer of the tokens: an internal URL here and a public one in the browser
# produce tokens that are systematically rejected. Defaulted from the domain
# when Keycloak is in this stack.
flip_planning_oidc_auth_server_url: >-
  {{ 'https://' ~ flip_planning_domain ~ '/auth/realms/' ~ flip_planning_oidc_provisioning_realm
     if flip_planning_keycloak_enabled else '' }}

# Confidential client of the code flow. AT LEAST 32 CHARACTERS: it encrypts the
# PKCE verifier in the state cookie, and below that Quarkus draws a random key
# at every start. terraform/keycloak prints it (`terraform output`).
flip_planning_oidc_client_id: "planning-app"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_oidc_client_secret: ""

# Provisioning: creating an animateur's fiche creates the Keycloak account that
# opens their espace; an import creates the accounts without mailing anyone,
# and the Animateurs screen sends the invitations.
flip_planning_oidc_provisioning_enabled: true
# Root of the admin API — WITHOUT /realms/…, and inside the stack: this traffic
# never leaves the host.
flip_planning_oidc_provisioning_server_url: >-
  {{ 'http://' ~ flip_planning_container_prefix ~ '-keycloak:8080/auth'
     if flip_planning_keycloak_enabled else '' }}
flip_planning_oidc_provisioning_realm: "planning"
flip_planning_oidc_provisioning_client_id: "planning-provisioning"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_oidc_provisioning_client_secret: ""

# Repairs the Flyway schema history at startup. Flip to true TEMPORARILY when a
# migration interrupted halfway blocks every later one, then back to false: it
# also realigns checksums, which would hide an edited migration.
flip_planning_flyway_repair_at_start: false

# Lets the Débogage page freeze the date — and, optionally, the time of day —
# that the mode jour J screen and the espace animateur read, as a server under
# `quarkus:dev` does. Off unless a host asks for it: those are the two screens
# that only describe what is still ahead TODAY, and while a date is frozen they
# describe a day that is not today — the night jobs' day-before reminders
# included, which go out to real people. Granted on the flip host, see
# host_vars/flip/variables.yaml.
#
# Granting it alone changes nothing: the clock stays real until someone freezes
# it from that page. But taking the permission away while a date is still
# frozen is the one move to avoid — the application then ignores the frozen
# value (it reads the real clock again) *and* refuses to clear the row, so the
# table keeps a date nobody can see. Unfreeze first, flip this after.
flip_planning_horloge_simulee_autorisee: false

# Reverse proxies the two address-counting guards may believe when they read
# X-Forwarded-For: the login lockout, and the /mcp rate ceiling above.
#
# Behind Pangolin the app never sees the client directly: Traefik writes the real
# address into X-Forwarded-For, newt tunnels it at L4, and the peer the app
# observes is the newt container on the shared bridge. That container address is
# handed out at attach time and moves when the stacks restart in another order —
# so what gets declared is the network's SUBNET, fixed at creation.
#
# Left empty, the subnet is read from the newt network at deploy time. Set it to
# pin a value, or to declare something else (a literal address, or a
# comma-separated mix of both).
#
# Without this, both guards count every visitor against newt's single address.
# For the lockout that is safe but rude — five failed logins from anyone lock
# the form for everyone. For the /mcp ceiling it is worse, because that one
# counts each REQUEST and not each failure: an anonymous caller, needing no key
# since the filter runs before authentication, holds the legitimate MCP client
# at 429 at two requests a second. Hence the deploy-time resolution below
# rather than an empty value shipped quietly.
flip_planning_trusted_proxies: ""

# The docker network newt attaches to; the app joins it to be reachable.
flip_planning_newt_network: "newt"

# pgAdmin, exposed on the /db sub-path of flip_planning_domain
flip_planning_pgadmin_enabled: true
flip_planning_pgadmin_path: "/db"
flip_planning_pgadmin_email: "admin@sylvain.cloud"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_pgadmin_password: ""

# Borgmatic backup configuration
flip_planning_backup_enabled: true
flip_planning_backup_borgmatic_target: ""
flip_planning_backup_encryption_passphrase: ""
flip_planning_backup_healthcheck_url: ""

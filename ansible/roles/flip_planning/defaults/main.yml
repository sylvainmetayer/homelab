---
flip_planning_base_path: "{{ docker_base_path }}/flip_planning"
flip_planning_domain: flip-planning.sylvain.cloud

# Image published on GitHub Container Registry (private package)
# Digest pinned so Ansible redeploys deterministically; Renovate bumps it
# (see the custom manager in renovate.json)
# renovate: datasource=docker depName=ghcr.io/sylvainmetayer/flip-planning
flip_planning_image: "ghcr.io/sylvainmetayer/flip-planning:main@sha256:7bdd93c52deb98384c44dd892e850ed188f1444728a75f188662a2b6834a34f3"

# GHCR authentication (private package): needs a PAT with read:packages
flip_planning_ghcr_registry: "ghcr.io"
flip_planning_ghcr_username: "sylvainmetayer"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_ghcr_token: ""

# PostgreSQL database configuration
flip_planning_db_user: "festival"
flip_planning_db_name: "festival"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_db_password: ""

# App secrets
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_api_key: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token_id: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_mcp_pangolin_access_token: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_admin_password: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_session_encryption_key: ""

# Mentions légales, served publicly on /mentions-legales. Those of the
# ORGANISER (the employer of the people being scheduled and the data
# controller), not of the hoster. Left empty, the page announces itself as
# incomplete. Names and addresses of real people: kept out of this public repo.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_editeur: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_directeur_publication: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_hebergeur: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_contact: ""
# Data controller (RGPD), when it differs from the LCEN publisher above.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_responsable_traitement: ""
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_base_legale: ""
# DISPLAYED to users and enforced by nobody: the purge is a yearly manual
# operation (docs/exploitation.md in the app repo). Only announce what is kept.
# Sensitive: must be set in secrets.sops.yaml
flip_planning_legal_conservation: ""

# Cloudflare Web Analytics beacon token. Empty = audience measurement off.
# Set ⇒ a transfer outside the EU that the mentions légales must declare.
# A public identifier by construction (it ships in every page), so it lives in
# plain text in host_vars/docker/variables.yaml rather than in sops.
flip_planning_cloudflare_web_analytics_token: ""

# The identity provider itself, in this stack, on the /auth sub-path of the
# application's own domain.
#
# Same domain rather than an sso.* subdomain of its own, because Pangolin
# resources ARE subdomains: a second one would mean a second certificate, a
# second set of geo rules and a second thing to forget. The cost is that /auth
# has to be carved out of this resource's Pangolin SSO — see the PATH rules in
# tofu/pangolin_config/website_flip_planning.tf, and the reasoning there.
#
# Off by default: turning it on deploys a database and an identity provider for
# an application that does not use one yet. The order is this flag first, then
# `ansible/keycloak-planning.yml` from the application repository against the
# result, then flip_planning_oidc_enabled.
flip_planning_keycloak_enabled: false

# renovate: datasource=docker depName=quay.io/keycloak/keycloak
flip_planning_keycloak_image: "quay.io/keycloak/keycloak:26.5"

flip_planning_keycloak_db_name: "keycloak"
flip_planning_keycloak_db_user: "keycloak"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_keycloak_db_password: ""

# Bootstrap administrator of the MASTER realm — the one that creates the
# planning realm, not an account of it. Used once by the playbook, then by a
# human through the console; it is not the `admin` role of the application.
flip_planning_keycloak_admin_user: "admin"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_keycloak_admin_password: ""

# Keycloak / OIDC — off, and it stays off until an identity provider exists.
#
# Flipped on, this ONE switch replaces the three shared secrets the deployment
# still runs on: the single ADMIN_PASSWORD, the six-digit e-mail code of the
# espace animateur, and the MCP key. Named accounts, a second factor the realm
# imposes on administrators, delegated roles.
#
# There is no Keycloak in this homelab yet, so everything below is wiring, not
# a rollout: the variables exist so that turning the mode on is a value change
# rather than a template change. Before flipping it, two things have to happen
# in this order — stand up a realm, then run `ansible/keycloak-planning.yml`
# FROM THE APPLICATION REPOSITORY against it (it creates the realm, the roles,
# the clients and the second-factor flow, and prints the values to copy here).
# Read docs/keycloak.md there first.
#
# Worth knowing before deciding: this resource is already behind Pangolin SSO
# (sso = true in tofu/pangolin_config/website_flip_planning.tf). Turning OIDC
# on stacks a second sign-in on top of that one rather than replacing it.
flip_planning_oidc_enabled: false

# PUBLIC url of the realm — the one browsers will see. It is what signs the
# issuer of the tokens: an internal URL here and a public one in the browser
# produce tokens that are systematically rejected, and the failure looks like
# anything but a configuration mistake.
# Defaulted from the service above when it is in this stack: this is the one
# value that must be exactly right, and the public prefix is already known.
flip_planning_oidc_auth_server_url: >-
  {{ 'https://' ~ flip_planning_domain ~ '/auth/realms/' ~ flip_planning_oidc_provisioning_realm
     if flip_planning_keycloak_enabled else '' }}

# Confidential client of the code flow. The secret must be AT LEAST 32
# CHARACTERS: it is what encrypts the PKCE verifier in the state cookie, and
# below that Quarkus draws a random key at every startup, so a login begun on one
# instance can no longer finish on another nor survive a restart. The secrets
# Keycloak generates are exactly 32.
flip_planning_oidc_client_id: "planning-app"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_oidc_client_secret: ""

# Realm role that opens the espace animateur — and the only thing it opens.
# Deliberately NOT `user`: Keycloak hands `user` out as the ordinary "this
# person exists" role, so building a privilege on it would give every future
# account an animateur's access nobody granted.
flip_planning_oidc_animateur_role: "animateur"

# Audience `/mcp` requires on a bearer token. A token issued for any other
# client of the same realm is refused.
flip_planning_oidc_mcp_audience: "planning-mcp"

# Where Keycloak sends the browser back after a logout.
flip_planning_oidc_post_logout_path: "/login"

# Provisioning: creating an animateur record creates the account that opens
# their space; deleting the last record carrying an address DISABLES the
# account, and never destroys it. Leave false when the accounts come from a
# federated directory or from the playbook rather than from this application.
flip_planning_oidc_provisioning_enabled: false
# Root of the admin API — WITHOUT the /realms/… suffix, unlike the URL above.
flip_planning_oidc_provisioning_server_url: >-
  {{ 'http://keycloak:8080/auth' if flip_planning_keycloak_enabled else '' }}
flip_planning_oidc_provisioning_realm: "planning"
flip_planning_oidc_provisioning_client_id: "planning-provisioning"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_oidc_provisioning_client_secret: ""
# false to create accounts in bulk without sending 150 invitation mails.
flip_planning_oidc_provisioning_send_invitation: true

# Repairs the Flyway schema history at startup. Flip to true TEMPORARILY when a
# migration interrupted halfway blocks every later one, then back to false: it
# also realigns checksums, which would hide an edited migration.
flip_planning_flyway_repair_at_start: false

# Lets the Débogage page freeze the date — and, optionally, the time of day —
# that the mode jour J screen and the espace animateur read, as a server under
# `quarkus:dev` does. Off unless a host asks for it: those are the two screens
# that only describe what is still ahead TODAY, and while a date is frozen they
# describe a day that is not today — the night jobs' day-before reminders
# included, which go out to real people. Granted on the docker host, see
# host_vars/docker/variables.yaml.
#
# Granting it alone changes nothing: the clock stays real until someone freezes
# it from that page. But taking the permission away while a date is still
# frozen is the one move to avoid — the application then ignores the frozen
# value (it reads the real clock again) *and* refuses to clear the row, so the
# table keeps a date nobody can see. Unfreeze first, flip this after.
flip_planning_horloge_simulee_autorisee: false

# Reverse proxies the login lockout may believe when it reads X-Forwarded-For.
#
# Behind Pangolin the app never sees the client directly: Traefik writes the real
# address into X-Forwarded-For, newt tunnels it at L4, and the peer the app
# observes is the newt container on the shared bridge. That container address is
# handed out at attach time and moves when the stacks restart in another order —
# so what gets declared is the network's SUBNET, fixed at creation.
#
# Left empty, the subnet is read from the newt network at deploy time. Set it to
# pin a value, or to declare something else (a literal address, or a
# comma-separated mix of both).
#
# Without this, the lockout counts every visitor against newt's single address:
# safe, but five failed logins from anyone lock the form for everyone.
flip_planning_trusted_proxies: ""

# The docker network newt attaches to; the app joins it to be reachable.
flip_planning_newt_network: "newt"

# pgAdmin, exposed on the /db sub-path of flip_planning_domain
flip_planning_pgadmin_enabled: true
flip_planning_pgadmin_path: "/db"
flip_planning_pgadmin_email: "admin@sylvain.cloud"
# Sensitive: must be set in secrets.sops.yaml
flip_planning_pgadmin_password: ""

# Borgmatic backup configuration
flip_planning_backup_enabled: true
flip_planning_backup_borgmatic_target: ""
flip_planning_backup_encryption_passphrase: ""
flip_planning_backup_healthcheck_url: ""

---
services:
  app:
    mem_limit: 1g
    container_name: flip-planning
    image: {{ flip_planning_image }}
    restart: unless-stopped
    volumes:
      - ./backup:/backup
      - ./assets:/assets:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flip-planning
{% if flip_planning_keycloak_enabled %}
      # Reaches Keycloak's admin API for the account provisioning, on a
      # dedicated internal network rather than over `newt`: that one exists for
      # Pangolin's tunnel, and this traffic never leaves the host.
      - flip-planning-keycloak
{% endif %}
      - newt

  postgres:
    mem_limit: 512m
    mem_reservation: 128m
    container_name: flip-planning-db
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{ flip_planning_db_name }}
      POSTGRES_USER: {{ flip_planning_db_user }}
      POSTGRES_PASSWORD: {{ flip_planning_db_password }}
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ flip_planning_db_user }} -d {{ flip_planning_db_name }}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - flip-planning

  # Local SMTP sink for the échange notification mails (issue #165): catches
  # everything, delivers nothing. Web UI on http://localhost:8025.
  mailpit:
    mem_limit: 128m
    container_name: flip-planning-mailpit
    environment:
      MP_WEBROOT: /mail/
    networks:
      - flip-planning
      - newt
    image: axllent/mailpit

  # BRANDING_LOGO_URL / MASCOT_URL are URLs the browser fetches, not file paths:
  # the application only serves its Angular bundle (Quinoa, SPA fallback), so
  # /assets/* would come back as index.html. This nginx serves the very same
  # read-only directory the app container mounts for its PDFs, and Pangolin
  # routes /assets to it on the same resource — hence behind the same SSO.
  assets:
    mem_limit: 128m
    container_name: flip-planning-assets
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./assets:/usr/share/nginx/html/assets:ro
    networks:
      - newt

{% if flip_planning_keycloak_enabled %}

  # The identity provider, served on the /auth sub-path of the SAME domain as
  # the application (Pangolin routes it there, see website_flip_planning.tf).
  #
  # KC_HTTP_RELATIVE_PATH is what makes a sub-path work at all: without it
  # Keycloak builds every URL — issuer, authorization endpoint, JWKS, the login
  # page's own stylesheets — from the root, and the browser fetches them from a
  # path Pangolin routes to the application instead. The issuer is the one that
  # bites hardest: a token carries the issuer that signed it, and Quarkus
  # refuses a token whose issuer is not the authority it discovered, so a
  # mismatch here rejects every login with a message that names neither.
  #
  # KC_HOSTNAME therefore carries the full public prefix, not just the host.
  keycloak:
    mem_limit: 1g
    mem_reservation: 512m
    container_name: flip-planning-keycloak
    image: {{ flip_planning_keycloak_image }}
    restart: unless-stopped
    # `start`, not `start --optimized`: the stock image ships no pre-built
    # configuration, so --optimized would refuse to boot until someone built a
    # derived image with `kc.sh build --db=postgres`. The cost is a few seconds
    # of augmentation at every start, which a service that restarts rarely can pay.
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/{{ flip_planning_keycloak_db_name }}
      KC_DB_USERNAME: {{ flip_planning_keycloak_db_user }}
      KC_DB_PASSWORD: {{ flip_planning_keycloak_db_password }}
      KC_HOSTNAME: https://{{ flip_planning_domain }}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      # Traefik terminates TLS at Pangolin and newt tunnels to the origin, so
      # Keycloak itself speaks http and learns the real scheme from the headers.
      # Without xforwarded it would advertise http:// URLs in an https page and
      # the browser would refuse the redirect.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: {{ flip_planning_keycloak_admin_user }}
      KC_BOOTSTRAP_ADMIN_PASSWORD: {{ flip_planning_keycloak_admin_password }}
      TZ: Europe/Paris
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The management port, which is where 26.x moved the health endpoints.
      # No curl in the image, hence the bash redirection.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - flip-planning-keycloak
      - newt

  keycloak-db:
    mem_limit: 512m
    mem_reservation: 128m
    container_name: flip-planning-keycloak-db
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{ flip_planning_keycloak_db_name }}
      POSTGRES_USER: {{ flip_planning_keycloak_db_user }}
      POSTGRES_PASSWORD: {{ flip_planning_keycloak_db_password }}
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ flip_planning_keycloak_db_user }} -d {{ flip_planning_keycloak_db_name }}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - keycloak_data:/var/lib/postgresql
    # Its own network, never `newt`: the identity database is reachable from
    # Keycloak and from nothing else.
    networks:
      - flip-planning-keycloak
{% endif %}

{% if flip_planning_pgadmin_enabled %}

  pgadmin:
    mem_limit: 512m
    container_name: flip-planning-pgadmin
    image: dpage/pgadmin4:9@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: {{ flip_planning_pgadmin_email }}
      PGADMIN_DEFAULT_PASSWORD: {{ flip_planning_pgadmin_password }}
      # Served behind Pangolin on a sub-path, pgAdmin must know its root
      SCRIPT_NAME: {{ flip_planning_pgadmin_path }}
      TZ: Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - flip-planning
      - newt
{% endif %}

networks:
  flip-planning:
{% if flip_planning_keycloak_enabled %}
  flip-planning-keycloak:
{% endif %}
  newt:
    external: true

volumes:
  postgres_data:
{% if flip_planning_keycloak_enabled %}
  keycloak_data:
{% endif %}
{% if flip_planning_pgadmin_enabled %}
  pgadmin_data:
{% endif %}

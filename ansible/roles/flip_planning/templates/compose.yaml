---
services:
  app:
    mem_limit: {{ flip_planning_mem_limit }}
    container_name: {{ flip_planning_container_prefix }}
    # Quoted, as is the Keycloak image: Renovate strips the Jinja before
    # parsing this file, and an unquoted expression after `image:` becomes
    # `image: null`, which its docker-compose schema rejects for the WHOLE
    # file, so none of the images below were tracked. The application image
    # itself is tracked in defaults/main.yml (custom manager in renovate.json).
    image: "{{ flip_planning_image }}"
    restart: unless-stopped
    pull_policy: {{ flip_planning_image_pull_policy }}
    volumes:
      - ./backup:/backup
      - ./assets:/assets:ro
    env_file:
      - .env
    # Ready = database reachable and migrations up to date (/q/health/ready).
    # The image carries no curl, so bash writes the request on /dev/tcp. An
    # image older than the probe answers 404 there: fall back to /api/config,
    # so the release channel stays healthy until it ships the probe. A real
    # 503 (database down, migration pending or failed) stays unhealthy. `$$`
    # because compose would otherwise interpolate the shell variables.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          probe() { exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET %s HTTP/1.0\r\nHost: localhost\r\n\r\n' "$$1" >&3 &&
          head -n1 <&3; };
          status="$$(probe /q/health/ready)" || exit 1;
          case "$$status" in
          *" 200 "*) exit 0 ;;
          *" 404 "*) probe /api/config | grep -q " 200 " ;;
          *) exit 1 ;;
          esac
      interval: 30s
      timeout: 5s
      retries: 3
      # Covers the migrations of a first start or of an upgrade.
      start_period: 180s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{ flip_planning_container_prefix }}
{% if flip_planning_keycloak_enabled %}
      # Keycloak's admin API, for the account provisioning, on a dedicated
      # internal network rather than over `newt`: that one exists for
      # Pangolin's tunnel, and this traffic never leaves the host.
      - {{ flip_planning_container_prefix }}-keycloak
{% endif %}
      - newt

  postgres:
    mem_limit: 512m
    mem_reservation: 128m
    # The default (10 s) SIGKILLs the database on dc@'s `compose stop`.
    stop_grace_period: 60s
    container_name: {{ flip_planning_container_prefix }}-db
    image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{ flip_planning_db_name }}
      POSTGRES_USER: {{ flip_planning_db_user }}
      POSTGRES_PASSWORD: {{ flip_planning_db_password }}
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ flip_planning_db_user }} -d {{ flip_planning_db_name }}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - {{ flip_planning_container_prefix }}

  # Local SMTP sink for the échange notification mails (issue #165): catches
  # everything, delivers nothing. Web UI on http://localhost:8025.
  mailpit:
    mem_limit: 128m
    container_name: {{ flip_planning_container_prefix }}-mailpit
    environment:
      MP_WEBROOT: /mail/
    networks:
      - {{ flip_planning_container_prefix }}
      - newt
    image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48

  # BRANDING_LOGO_URL / MASCOT_URL are URLs the browser fetches, not file paths:
  # the application only serves its Angular bundle (Quinoa, SPA fallback), so
  # /assets/* would come back as index.html. This nginx serves the very same
  # read-only directory the app container mounts for its PDFs, and Pangolin
  # routes /assets to it on the same resource — hence behind the same SSO.
  # Always present, even for an instance that declares no branding image: the
  # Pangolin target and its healthcheck expect it.
  assets:
    mem_limit: 128m
    container_name: {{ flip_planning_container_prefix }}-assets
    image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    volumes:
      - ./assets:/usr/share/nginx/html/assets:ro
    networks:
      - newt

{% if flip_planning_keycloak_enabled %}

  # The identity provider, on the /auth sub-path of the SAME domain as the
  # application (Pangolin routes it there, see tofu/pangolin_config).
  #
  # KC_HTTP_RELATIVE_PATH is what makes a sub-path work at all: without it
  # Keycloak builds every URL — issuer, authorization endpoint, JWKS, the login
  # page's own stylesheets — from the root, and the browser fetches them where
  # Pangolin routes the application. The issuer bites hardest: Quarkus refuses
  # a token whose issuer is not the authority it discovered.
  keycloak:
    mem_limit: 1g
    mem_reservation: 512m
    container_name: {{ flip_planning_container_prefix }}-keycloak
    image: "{{ flip_planning_keycloak_image }}"
    restart: unless-stopped
    pull_policy: {{ flip_planning_image_pull_policy }}
    # `start`, not `start --optimized` as in the application's own compose
    # file: the image is pre-built for PostgreSQL, and the relative path is a
    # BUILD option — `--optimized` would refuse a value that differs from the
    # build. Plain `start` re-augments with /auth at every start (a few
    # seconds), keeping the image's extension and theme.
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://{{ flip_planning_container_prefix }}-keycloak-db:5432/{{ flip_planning_keycloak_db_name }}
      KC_DB_USERNAME: {{ flip_planning_keycloak_db_user }}
      KC_DB_PASSWORD: {{ flip_planning_keycloak_db_password }}
      KC_HTTP_RELATIVE_PATH: /auth
      # The PUBLIC url with its prefix: it signs the issuer of the tokens.
      KC_HOSTNAME: https://{{ flip_planning_domain }}/auth
      # Traefik terminates TLS at Pangolin and newt tunnels to the origin:
      # Keycloak speaks http and learns the real scheme from the headers.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: {{ flip_planning_keycloak_admin_user }}
      KC_BOOTSTRAP_ADMIN_PASSWORD: {{ flip_planning_keycloak_admin_password }}
      KEYCLOAK_BRAND_ACCENT: "{{ flip_planning_keycloak_brand_accent }}"
      TZ: Europe/Paris
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      # The management port (9000), which KC_HTTP_RELATIVE_PATH prefixes too.
      # No curl in the image, hence the bash redirection.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - {{ flip_planning_container_prefix }}-keycloak
      # Mailpit, for the invitations, codes and resets the realm sends.
      - {{ flip_planning_container_prefix }}
      - newt

  keycloak-db:
    mem_limit: 512m
    mem_reservation: 128m
    stop_grace_period: 60s
    container_name: {{ flip_planning_container_prefix }}-keycloak-db
    image: postgres:18.6@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
    restart: unless-stopped
    environment:
      POSTGRES_DB: {{ flip_planning_keycloak_db_name }}
      POSTGRES_USER: {{ flip_planning_keycloak_db_user }}
      POSTGRES_PASSWORD: {{ flip_planning_keycloak_db_password }}
      TZ: Europe/Paris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ flip_planning_keycloak_db_user }} -d {{ flip_planning_keycloak_db_name }}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - keycloak_data:/var/lib/postgresql
    # Its own network, never `newt`: the identity database is reachable from
    # Keycloak and from nothing else.
    networks:
      - {{ flip_planning_container_prefix }}-keycloak
{% endif %}

{% if flip_planning_pgadmin_enabled %}

  pgadmin:
    mem_limit: 512m
    container_name: {{ flip_planning_container_prefix }}-pgadmin
    image: dpage/pgadmin4:9@sha256:40fa840c5bb7c8463957f1255b01283732c2d8c9396a956d180f8e6c296753b3
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: {{ flip_planning_pgadmin_email }}
      PGADMIN_DEFAULT_PASSWORD: {{ flip_planning_pgadmin_password }}
      # Served behind Pangolin on a sub-path, pgAdmin must know its root
      SCRIPT_NAME: {{ flip_planning_pgadmin_path }}
      TZ: Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    networks:
      - {{ flip_planning_container_prefix }}
      - newt
{% endif %}

networks:
  {{ flip_planning_container_prefix }}:
{% if flip_planning_keycloak_enabled %}
  # No route to the Internet through it: the application and Keycloak keep
  # theirs through newt, keycloak-db (its only other member) needs none.
  {{ flip_planning_container_prefix }}-keycloak:
    internal: true
{% endif %}
  newt:
    external: true

volumes:
  postgres_data:
{% if flip_planning_keycloak_enabled %}
  keycloak_data:
{% endif %}
{% if flip_planning_pgadmin_enabled %}
  pgadmin_data:
{% endif %}

---
- name: Ensure app folders exist for {{ flip_planning_service }}
  loop:
    - "{{ flip_planning_base_path }}"
    - "{{ flip_planning_base_path }}/pgadmin"
    - "{{ flip_planning_base_path }}/assets"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

# Branding assets: the client's images declared in flip_planning_branding_*
# (see defaults/main.yml), copied next to the compose file and mounted
# read-only on /assets. An instance that declares none gets an empty directory
# and the application's own fallbacks.
- name: Fail clearly when two branding assets share a file name for {{ flip_planning_service }}
  ansible.builtin.assert:
    that:
      - flip_planning_branding_assets | map('basename') | unique | length
        == flip_planning_branding_assets | length
    fail_msg: >-
      Two flip_planning_branding_* sources share a basename and would overwrite
      each other in {{ flip_planning_base_path }}/assets:
      {{ flip_planning_branding_assets | join(', ') }}

- name: Copy branding assets for {{ flip_planning_service }}
  notify: "Restart {{ flip_planning_service }}"
  loop: "{{ flip_planning_branding_assets }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ flip_planning_base_path }}/assets/{{ item | basename }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

# The directory is served as-is by the assets nginx: a file left behind by an
# earlier set (or by an instance that has since dropped its branding) would
# stay reachable under /assets, so keep the directory to exactly what is
# declared.
- name: List the files present in the assets directory of {{ flip_planning_service }}
  ansible.builtin.find:
    paths: "{{ flip_planning_base_path }}/assets"
    file_type: file
  register: flip_planning_assets_present

- name: Remove assets no longer declared for {{ flip_planning_service }}
  notify: "Restart {{ flip_planning_service }}"
  loop: >-
    {{ flip_planning_assets_present.files | map(attribute='path')
       | difference(flip_planning_branding_assets | map('basename')
                    | map('regex_replace', '^', flip_planning_base_path ~ '/assets/')) }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent

- name: Template pgAdmin servers configuration for {{ flip_planning_service }}
  when: flip_planning_pgadmin_enabled
  notify: "Restart {{ flip_planning_service }}"
  ansible.builtin.template:
    src: "templates/servers.json.j2"
    dest: "{{ flip_planning_base_path }}/pgadmin/servers.json"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

# The value the application compares its peer against. Read from docker rather
# than pinned: the subnet is stable for the life of the network, but docker
# chooses it at creation, so hardcoding it here would be a guess that fails
# silently — an entry that matches nothing means no header is trusted, and
# nothing says so.
#
# The set_fact below outlives this role application, so a second instance in
# the same play finds the variable already set and skips the inspect. That is
# the right answer rather than a leak: every instance on this host sits behind
# the same newt container on the same bridge, hence the same subnet.
- name: Read the newt network definition
  when: not flip_planning_trusted_proxies
  changed_when: false
  ansible.builtin.command:
    cmd: "docker network inspect {{ flip_planning_newt_network }}"
  register: flip_planning_newt_network_info

- name: Fail clearly when the newt network declares no subnet
  when: not flip_planning_trusted_proxies
  ansible.builtin.assert:
    that:
      - (flip_planning_newt_network_info.stdout | from_json)[0].IPAM.Config | default([]) | length > 0
    fail_msg: >-
      The {{ flip_planning_newt_network }} network has no IPAM subnet, so there is
      nothing to declare as a trusted proxy. Set flip_planning_trusted_proxies
      explicitly, or leave it empty to keep the login lockout counting every
      visitor on one shared counter.

- name: Use the newt subnet as the trusted proxy range
  when: not flip_planning_trusted_proxies
  ansible.builtin.set_fact:
    flip_planning_trusted_proxies: >-
      {{ (flip_planning_newt_network_info.stdout | from_json)[0].IPAM.Config[0].Subnet }}

# The application and Keycloak already refuse a half-laid configuration, but
# only once restarted. Catching it here moves the failure from "the container
# restarted and never came back" to "the deploy stopped and named the missing
# value" — the same verdict, before a running service is taken down.
- name: Check the Keycloak configuration of {{ flip_planning_service }}
  when: flip_planning_keycloak_enabled or flip_planning_oidc_enabled
  ansible.builtin.assert:
    quiet: true
    that:
      - not flip_planning_keycloak_enabled
        or (flip_planning_keycloak_image | length > 0
            and flip_planning_keycloak_db_password | length > 0
            and flip_planning_keycloak_admin_password | length > 0)
      - not flip_planning_oidc_enabled
        or (flip_planning_oidc_auth_server_url | length > 0
            and flip_planning_oidc_client_secret | length >= 32)
      - not (flip_planning_oidc_enabled and flip_planning_oidc_provisioning_enabled)
        or (flip_planning_oidc_provisioning_server_url | length > 0
            and flip_planning_oidc_provisioning_client_secret | length > 0)
    fail_msg: >-
      Incomplete Keycloak configuration for {{ flip_planning_service }}.
      flip_planning_keycloak_enabled needs flip_planning_keycloak_image (the
      application repo's Keycloak image, same version as the application) and
      the two Keycloak passwords. flip_planning_oidc_enabled needs the realm's
      PUBLIC url and a client secret of at least 32 characters — shorter,
      Quarkus draws the key that encrypts the PKCE verifier at random on every
      start — and, with provisioning, its server url and service-account
      secret. The secrets belong in secrets.sops.yaml; terraform/keycloak of
      the application repo prints the two client secrets.

# Solve quota — see flip_planning_solve_rate_limit in defaults/main.yml.
- name: Configure the solve quota guard of {{ flip_planning_service }}
  when: flip_planning_solve_rate_limit | length > 0
  block:
    - name: Fail clearly when the solve quota is incomplete ({{ flip_planning_service }})
      ansible.builtin.assert:
        that:
          - flip_planning_solve_rate_limit.average | int > 0
          - flip_planning_solve_rate_limit.period | default('') | length > 0
        fail_msg: >-
          flip_planning_solve_rate_limit needs a positive `average` (solves per
          period) and a `period` Traefik reads, such as 1h.

    - name: Ensure the guard folder exists for {{ flip_planning_service }}
      ansible.builtin.file:
        path: "{{ flip_planning_base_path }}/guard"
        state: directory
        mode: "0755"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"

    - name: Template the guard routing of {{ flip_planning_service }}
      notify: "Restart {{ flip_planning_service }}"
      ansible.builtin.template:
        src: "templates/guard-dynamic.yml.j2"
        dest: "{{ flip_planning_base_path }}/guard/dynamic.yml"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0644"

- name: Template compose configuration for {{ flip_planning_service }}
  notify: "Restart {{ flip_planning_service }}"
  loop:
    - src: "templates/compose.yaml"
      dest: "compose.yaml"
    - src: "templates/env.j2"
      dest: ".env"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ flip_planning_base_path }}/{{ item.dest }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0640"

- name: Make sure the systemd unit is started for {{ flip_planning_service }}
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: "dc@{{ flip_planning_service }}"
    scope: user
    enabled: true

# Nightly reset to a reference database — see flip_planning_reset_dump in
# defaults/main.yml. Placed after the unit is started: the first restore needs
# the postgres container up.
- name: Configure the nightly reset of {{ flip_planning_service }}
  when: flip_planning_reset_dump | length > 0
  block:
    # An instance that resets every night has nothing to back up, and its
    # archives would only fill a Borg repository with the same dump.
    - name: Refuse a nightly reset on a backed-up instance ({{ flip_planning_service }})
      ansible.builtin.assert:
        that:
          - not flip_planning_backup_enabled
        fail_msg: >-
          {{ flip_planning_service }} sets flip_planning_reset_dump, which drops
          its database every night, and flip_planning_backup_enabled. Turn the
          backup off: a reset instance holds nothing worth keeping, and an
          instance whose data matters must not be reset.

    - name: Ensure the seed folder exists for {{ flip_planning_service }}
      ansible.builtin.file:
        path: "{{ flip_planning_base_path }}/seed"
        state: directory
        mode: "0750"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"

    - name: Copy the reference dump of {{ flip_planning_service }}
      notify: "Reset {{ flip_planning_service }}"
      ansible.builtin.copy:
        src: "{{ flip_planning_reset_dump }}"
        dest: "{{ flip_planning_base_path }}/seed/{{ flip_planning_reset_dump | basename }}"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0640"

    - name: Template the reset script of {{ flip_planning_service }}
      notify: "Reset {{ flip_planning_service }}"
      ansible.builtin.template:
        src: "templates/reset.sh.j2"
        dest: "{{ flip_planning_base_path }}/reset.sh"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0750"

    - name: Template the reset units of {{ flip_planning_service }}
      loop: [service, timer]
      ansible.builtin.template:
        src: "templates/reset.{{ item }}.j2"
        dest: "~/.config/systemd/user/{{ flip_planning_service }}-reset.{{ item }}"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
        mode: "0644"

    - name: Enable the nightly reset timer of {{ flip_planning_service }}
      ansible.builtin.systemd:
        name: "{{ flip_planning_service }}-reset.timer"
        scope: user
        state: started
        enabled: true
        daemon_reload: true

# Borgmatic backup configuration
- name: Configure borgmatic backup for {{ flip_planning_service }}
  when: flip_planning_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for {{ flip_planning_service }}
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-flip_planning.yaml.j2"
        dest: "{{ borgmatic_config_dir }}/{{ flip_planning_service }}.yaml"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Initialize borg repository for {{ flip_planning_service }}
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic
          --config {{ borgmatic_config_dir }}/{{ flip_planning_service }}.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: flip_planning_borg_repo_create
      changed_when: "'repository already exists' not in flip_planning_borg_repo_create.stderr"
      failed_when: >
        flip_planning_borg_repo_create.rc != 0 and
        'repository already exists' not in flip_planning_borg_repo_create.stderr

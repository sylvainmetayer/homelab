---
- name: Ensure app folders exist for {{ flip_planning_service }}
  loop:
    - "{{ flip_planning_base_path }}"
    - "{{ flip_planning_base_path }}/pgadmin"
    - "{{ flip_planning_base_path }}/assets"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

# The GHCR package is private, docker needs credentials to pull the image.
- name: Log in to GitHub Container Registry
  no_log: true
  changed_when: false
  ansible.builtin.command:
    cmd: "docker login {{ flip_planning_ghcr_registry }} --username {{ flip_planning_ghcr_username }} --password-stdin"
    stdin: "{{ flip_planning_ghcr_token }}"

# Branding assets: the application image ships no visual of its own (the app
# repo is public and carries no customer mark), so the festival's images are
# part of this deployment and are mounted read-only on /assets.
- name: Copy branding assets for {{ flip_planning_service }}
  notify: "Restart {{ flip_planning_service }}"
  loop:
    - flip.png
    - flip-logo.png
    - flip-strip.png
    - flip-woopy.png
    - flip-woopy-loader.png
  ansible.builtin.copy:
    src: "{{ role_path }}/{{ item }}"
    dest: "{{ flip_planning_base_path }}/assets/{{ item }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template pgAdmin servers configuration for {{ flip_planning_service }}
  when: flip_planning_pgadmin_enabled
  notify: "Restart {{ flip_planning_service }}"
  ansible.builtin.template:
    src: "templates/servers.json.j2"
    dest: "{{ flip_planning_base_path }}/pgadmin/servers.json"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

# The value the application compares its peer against. Read from docker rather
# than pinned: the subnet is stable for the life of the network, but docker
# chooses it at creation, so hardcoding it here would be a guess that fails
# silently — an entry that matches nothing means no header is trusted, and
# nothing says so.
#
# The set_fact below outlives this role application, so a second instance in the
# same play finds the variable already set and skips the inspect. That is the
# right answer rather than a leak: every instance on this host sits behind the
# same newt container on the same bridge, hence the same subnet.
- name: Read the newt network definition
  when: not flip_planning_trusted_proxies
  changed_when: false
  ansible.builtin.command:
    cmd: "docker network inspect {{ flip_planning_newt_network }}"
  register: flip_planning_newt_network_info

- name: Fail clearly when the newt network declares no subnet
  when: not flip_planning_trusted_proxies
  ansible.builtin.assert:
    that:
      - (flip_planning_newt_network_info.stdout | from_json)[0].IPAM.Config | default([]) | length > 0
    fail_msg: >-
      The {{ flip_planning_newt_network }} network has no IPAM subnet, so there is
      nothing to declare as a trusted proxy. Set flip_planning_trusted_proxies
      explicitly, or leave it empty to keep the login lockout counting every
      visitor on one shared counter.

- name: Use the newt subnet as the trusted proxy range
  when: not flip_planning_trusted_proxies
  ansible.builtin.set_fact:
    flip_planning_trusted_proxies: >-
      {{ (flip_planning_newt_network_info.stdout | from_json)[0].IPAM.Config[0].Subnet }}

- name: Template compose configuration for {{ flip_planning_service }}
  notify: "Restart {{ flip_planning_service }}"
  loop:
    - src: "templates/compose.yaml"
      dest: "compose.yaml"
    - src: "templates/env.j2"
      dest: ".env"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ flip_planning_base_path }}/{{ item.dest }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0640"

- name: Make sure the systemd unit is started for {{ flip_planning_service }}
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: "dc@{{ flip_planning_service }}"
    scope: user
    enabled: true

# Borgmatic backup configuration
- name: Configure borgmatic backup for {{ flip_planning_service }}
  when: flip_planning_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for {{ flip_planning_service }}
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-flip_planning.yaml.j2"
        dest: "{{ borgmatic_config_dir }}/{{ flip_planning_service }}.yaml"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Initialize borg repository for {{ flip_planning_service }}
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic
          --config {{ borgmatic_config_dir }}/{{ flip_planning_service }}.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: flip_planning_borg_repo_create
      changed_when: "'repository already exists' not in flip_planning_borg_repo_create.stderr"
      failed_when: >
        flip_planning_borg_repo_create.rc != 0 and
        'repository already exists' not in flip_planning_borg_repo_create.stderr

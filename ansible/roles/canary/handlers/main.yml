---
# Pas en --check si l'unité vient d'être posée : elle n'existe pas encore.
- name: Restart canary-watch
  when: not ansible_check_mode
  ansible.builtin.systemd:
    name: canary-watch.service
    state: restarted
    daemon_reload: true

# canary_enabled: false. Sans cela, systemd garde l'unité effacée chargée
# (not-found) jusqu'au prochain daemon-reload.
- name: Forget the removed canary-watch unit
  ansible.builtin.systemd:
    daemon_reload: true

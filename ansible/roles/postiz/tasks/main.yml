---
# Un nom mal formé (espace, retour à la ligne) écrirait une autre ligne du .env.
- name: Fail clearly on a malformed social network variable name
  ansible.builtin.assert:
    that:
      - postiz_social_env.keys() | reject('match', '^[A-Z][A-Z0-9_]*$') | list | length == 0
      # Le lecteur dotenv de compose interpole `$` et coupe sur ` #` ou une
      # apostrophe : une clé tronquée ne se verrait qu'au branchement du réseau.
      - postiz_social_env.values() | map('string') | select('search', '[\\s$#''"\\\\]') | list | length == 0
    fail_msg: >-
      postiz_social_env : noms en MAJUSCULES_ET_SOULIGNÉS, valeurs sans espace,
      $, #, apostrophe, guillemet ni barre oblique inverse.
    quiet: true

- name: Ensure Postiz app folders exist
  loop:
    - { path: "{{ postiz_base_path }}", mode: "0700" }
    - { path: "{{ postiz_base_path }}/dynamicconfig", mode: "0755" }
    # 0755 : le nginx de l'image les sert en utilisateur `www`, le backend
    # (root) y écrit.
    - { path: "{{ postiz_base_path }}/uploads", mode: "0755" }
  ansible.builtin.file:
    mode: "{{ item.mode }}"
    path: "{{ item.path }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template the Temporal dynamic configuration
  notify: "{{ postiz_restart_handlers }}"
  ansible.builtin.template:
    src: "templates/dynamicconfig.yaml"
    dest: "{{ postiz_base_path }}/dynamicconfig/postiz.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    # Lu par l'utilisateur `temporal` du conteneur ; deux réglages, aucun secret.
    mode: "0644" # NOSONAR

- name: Template compose configuration
  diff: false
  notify: "{{ postiz_restart_handlers }}"
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ postiz_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template environment configuration
  diff: false
  no_log: true
  notify: "{{ postiz_restart_handlers }}"
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ postiz_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Postiz
  when: postiz_enabled | bool and postiz_backup_enabled | bool
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: postiz
    borgmatic_app_title: Postiz
    borgmatic_app_target: "{{ postiz_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ postiz_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ postiz_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ postiz_base_path }}/uploads"
      - "{{ postiz_base_path }}/compose.yaml"
      - "{{ postiz_base_path }}/.env"
    # Celles de Temporal aussi : les publications planifiées y sont des
    # workflows en attente.
    borgmatic_app_postgresql_databases:
      - container: postiz-db
        name: "{{ postiz_db_name }}"
        username: "{{ postiz_db_user }}"
        password: "{{ postiz_db_password }}"
      - container: postiz-db
        name: temporal
        username: "{{ postiz_db_user }}"
        password: "{{ postiz_db_password }}"
      - container: postiz-db
        name: temporal_visibility
        username: "{{ postiz_db_user }}"
        password: "{{ postiz_db_password }}"

# En pause, le dump (docker exec dans postiz-db) échouerait chaque nuit.
- name: Remove the borgmatic configuration of the paused postiz
  when: not postiz_enabled | bool
  tags: backup
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ borgmatic_config_dir }}/postiz.yaml"
    - "{{ borgmatic_config_dir }}/uptime-kuma/postiz.curl"

- name: Make sure postiz service is running, or stopped when paused
  ansible.builtin.systemd:
    state: "{{ 'started' if postiz_enabled | bool else 'stopped' }}"
    daemon_reload: true
    name: dc@postiz
    scope: user
    enabled: "{{ postiz_enabled | bool }}"

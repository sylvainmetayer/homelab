---
postiz_base_path: "{{ docker_base_path }}/postiz"
postiz_domain: posts.sylvain.cloud

# false : appli en pause (docs/runbooks/app-en-pause.md), dc@postiz arrêtée et
# désactivée, configuration borgmatic retirée, plus aucun redémarrage.
postiz_enabled: true
postiz_restart_handlers: "{{ ['Restart postiz'] if postiz_enabled | bool else [] }}"

# Dérivés de app_secrets_seed comme ceux de karakeep : pas d'entrée SOPS.
# Changer JWT_SECRET déconnecte les sessions ; le mot de passe de la base n'est
# lu par PostgreSQL qu'à la création du volume.
postiz_jwt_secret: "{{ (app_secrets_seed ~ '-postiz-jwt') | hash('sha256') }}"
postiz_db_password: "{{ (app_secrets_seed ~ '-postiz-db') | hash('sha256') }}"
postiz_db_user: postiz
postiz_db_name: postiz

# Connexion par Pocket ID (tofu/pangolin_config/pocket_id.tf, client postiz) :
# rendue seulement quand l'émetteur, l'identifiant et le secret sont dans le
# state. Postiz crée le compte au premier login OIDC, même inscription fermée
# (auth.service.ts, canRegister) : le groupe Pocket ID est la barrière.
postiz_oidc_client_id: "{{ terraform_outputs.pocket_id_postiz_client_id.value | default('') }}"
postiz_oidc_client_secret: "{{ terraform_outputs.pocket_id_postiz_client_secret.value | default('') }}"
postiz_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
postiz_oidc_enabled: "{{ postiz_oidc_client_id | length > 0 and postiz_oidc_client_secret | length > 0 and postiz_oidc_issuer | length > 0 }}"

# Clés des réseaux sociaux : un dictionnaire VARIABLE: valeur, rendu tel quel
# dans le .env (X_API_KEY, FACEBOOK_APP_ID…). Les noms et l'URL de redirection
# de chaque réseau sont dans le README du rôle.
# Sensitive: must be set in secrets/ansible.sops.yaml
postiz_social_env: {}

# Borgmatic backup configuration
postiz_backup_enabled: true
postiz_backup_borgmatic_target: "{{ backup_storage_box_url }}/postiz"
postiz_backup_encryption_passphrase: "{{ backup_passphrase }}"
postiz_backup_healthcheck_url: ""

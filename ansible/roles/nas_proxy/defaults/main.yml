---
# Traefik du NAS (nas.yml), sous dc@nas_proxy en unité système
# (docker_service_scope: system, host_vars/nas) : le TLS des noms du NAS,
# https://media.sylvain.cloud (Jellyfin) et https://nas.sylvain.cloud
# (interface d'UGOS). Chaque nom a un A public vers l'IP LAN du NAS
# (tofu/dns/media.tf, nas.tf) et un certificat Let's Encrypt par DNS-01 OVH :
# rien n'a besoin d'être joignable depuis Internet.
nas_proxy_service: nas_proxy
nas_proxy_base_path: "{{ docker_base_path }}/{{ nas_proxy_service }}"
# Ce que vise la ressource privée Pangolin media.sylvain.cloud sur le réseau
# newt (tofu/pangolin_config/private_resources.tf, vérifié par ses tests).
nas_proxy_container_name: nas-proxy
# Port publié par Docker, le même dans le conteneur : https://<nom>:8443 en
# LAN comme par Pangolin (ressources media.sylvain.cloud et nas.sylvain.cloud,
# tcp_port_range, que tofu/pangolin_config/tests vérifie contre cette ligne).
# Il ne dépend que de Docker : c'est le secours quand le 443 de l'hôte est
# repris par le nginx d'UGOS.
nas_proxy_https_port: 8443
# Le 443 de l'hôte, sans port dans l'URL. Le nginx d'UGOS le tient tant que
# la redirection HTTPS de son interface est cochée (« defaultHttpsRedirectEnable »
# de /etc/nginx/config.json, simple 307 vers son 9443) : décochée, il est
# libre. Pas publié par Docker sur nas-proxy : un port déjà pris fait échouer
# la création du conteneur, et avec lui le 8443. Un second Traefik
# (nas_proxy_forward_container_name), en réseau hôte, le prend quand il est
# libre et passe chaque connexion TCP telle quelle (TLS compris) à
# nas_proxy_forward_target_port de nas-proxy, en PROXY protocol v2 pour que
# nas-proxy voie l'IP du client (ugos-lan, X-Forwarded-For de Jellyfin). Pris,
# ce Traefik sort et Docker le relance (au plus une fois par minute) : le
# 8443 n'en sait rien. Le port 80 reste au nginx d'UGOS (site Debian par
# défaut), le DNS-01 n'en a pas besoin.
nas_proxy_host_https_port: 443
nas_proxy_forward_container_name: nas-proxy-443
nas_proxy_forward_mem_limit: 64m
# Entrée de nas-proxy réservée au relais, jamais publiée : jointe par l'hôte
# à l'IP fixe de nas-proxy sur le réseau media (nas_proxy_media_ip).
nas_proxy_forward_target_port: 8444
# Seule source dont nas-proxy croit l'en-tête PROXY sur cette entrée : l'IP
# de l'hôte sur le pont du réseau media (la passerelle Docker, première IP de
# jellyfin_proxy_subnet), d'où part toute connexion de l'hôte vers
# {{ nas_proxy_media_ip }}. Un conteneur (le Newt, Jellyfin) qui joindrait ce
# port a une autre IP : son en-tête serait ignoré, sa propre IP gardée.
nas_proxy_forward_trusted_ip: 172.30.96.1
nas_proxy_acme_email: "{{ pangolin_le_email }}"
# Clé OVH dédiée au DNS-01, restreinte aux trois appels que fait lego (ajout du
# TXT, rafraîchissement de la zone, suppression du TXT), créée sur
# https://eu.api.ovh.com/createToken/?POST=/domain/zone/sylvain.cloud/record&POST=/domain/zone/sylvain.cloud/refresh&DELETE=/domain/zone/sylvain.cloud/record/*
# Clés SOPS préfixées nas_ovh_*, jamais le nom d'une variable du rôle.
nas_proxy_ovh_endpoint: ovh-eu
nas_proxy_ovh_application_key: "{{ nas_ovh_application_key }}"
nas_proxy_ovh_application_secret: "{{ nas_ovh_application_secret }}"
nas_proxy_ovh_consumer_key: "{{ nas_ovh_consumer_key }}"
nas_proxy_mem_limit: 256m

# --- Jellyfin : https://media.sylvain.cloud ---
nas_proxy_media_domain: media.sylvain.cloud
nas_proxy_media_url: http://jellyfin:8096
# Le réseau privé du projet jellyfin, qui le crée (réseau `media` de son
# compose, nommé jellyfin_media par Compose) : Traefik le rejoint en externe,
# à IP fixe dans son sous-réseau (jellyfin_proxy_subnet). Cette IP est celle
# saisie dans Jellyfin (Tableau de bord, Réseau, « Proxys connus ») pour qu'il
# croie ses X-Forwarded-* : ne pas la changer sans la changer là-bas.
nas_proxy_media_network: jellyfin_media
nas_proxy_media_ip: 172.30.96.10

# --- Interface d'UGOS : https://nas.sylvain.cloud ---
# Le nginx d'UGOS, joint depuis le conteneur par l'IP LAN de l'hôte (testé :
# 307 vers /desktop/, chemins relatifs, Host d'origine accepté). HTTP en
# clair assumé : de Traefik à l'hôte qui le fait tourner, sans traverser le
# LAN ; le 9443 d'UGOS n'a qu'un certificat autosigné.
nas_proxy_ugos_domain: nas.sylvain.cloud
nas_proxy_ugos_url: "http://{{ ansible_host }}:9999" # NOSONAR
# Sources admises sur le routeur ugos : le LAN seul, d'où arrivent les
# navigateurs de la maison et le Newt LXC (ressource privée nas, Admin seul),
# leur IP conservée par le DNAT de Docker sur le 8443 publié, et par le PROXY
# protocol du relais sur le 443 de l'hôte. Le Newt du site
# nas, lui, joint le 8443 du conteneur par le réseau newt (172.x) pour la
# ressource media.sylvain.cloud, ouverte au rôle jellyfin : sans ce filtre, un
# membre de ce rôle atteindrait l'interface d'UGOS en y envoyant
# Host: nas.sylvain.cloud.
nas_proxy_ugos_source_ranges:
  - 192.168.1.0/24

# --- Échéance des certificats (nas-proxy-cert-check.timer) ---
# Le NAS n'est joignable que du LAN et par le client Pangolin : l'Uptime Kuma
# de PikaPods ne peut pas lire ses certificats. Chaque jour, files/cert_check.py
# s'y connecte depuis le NAS, sur le port publié, avec chaque nom en SNI, et
# pousse le résultat au moniteur « Certificats NAS ». URL push : l'output
# uptime_cron_nas_cert_url de tofu/pangolin_config (nas.yml) ; vide, la
# vérification tourne sans rien pousser.
nas_proxy_cert_healthcheck_url: ""
nas_proxy_cert_check_host: 127.0.0.1
nas_proxy_cert_check_names:
  - "{{ nas_proxy_media_domain }}"
  - "{{ nas_proxy_ugos_domain }}"
# Traefik renouvelle 30 jours avant l'échéance (certificats Let's Encrypt de
# 90 jours) : sous 14 jours, le renouvellement échoue depuis plus de deux
# semaines, et il reste deux semaines pour réparer.
nas_proxy_cert_check_min_days: 14
nas_proxy_cert_check_schedule: "*-*-* 07:00:00"

# --- Migration depuis le Traefik du compose de jellyfin (27/10/2026) ---
# Son acme.json est repris tel quel (même résolveur, letsencrypt) : pas de
# nouveau certificat pour media.sylvain.cloud, ni de minute en certificat
# autosigné au basculement. Le dossier est supprimé une fois repris. À retirer
# avec les tâches de migration une fois nas.yml passé sur le NAS.
nas_proxy_legacy_path: "{{ docker_base_path }}/jellyfin/traefik"
nas_proxy_legacy_container: jellyfin-traefik

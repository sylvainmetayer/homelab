---
# Traefik du NAS (nas.yml), sous dc@nas_proxy en unité système
# (docker_service_scope: system, host_vars/nas) : le TLS des noms du NAS,
# https://media.sylvain.cloud (Jellyfin), https://nas.sylvain.cloud
# (interface d'UGOS), https://mediamanager.sylvain.cloud (MediaManager) et
# https://prowlarr.sylvain.cloud / https://qbittorrent.sylvain.cloud (ses outils,
# rôle mediamanager).
# Chaque nom a un A public vers l'IP LAN du NAS (tofu/dns/media.tf, nas.tf,
# mediamanager.tf) et un certificat Let's Encrypt par DNS-01 OVH : rien n'a
# besoin d'être joignable depuis Internet.
nas_proxy_service: nas_proxy
nas_proxy_base_path: "{{ docker_base_path }}/{{ nas_proxy_service }}"
# Ce que visent les ressources privées Pangolin media.sylvain.cloud et
# mediamanager.sylvain.cloud sur le réseau newt
# (tofu/pangolin_config/private_resources.tf, vérifié par ses tests).
nas_proxy_container_name: nas-proxy
# Port publié par Docker, le même dans le conteneur : https://<nom>:8443 en
# LAN comme par Pangolin (ressources media, nas et mediamanager.sylvain.cloud,
# tcp_port_range, que tofu/pangolin_config/tests vérifie contre cette ligne).
# Il ne dépend que de Docker : c'est le secours quand le 443 de l'hôte est
# repris par le nginx d'UGOS.
nas_proxy_https_port: 8443
# Le 443 de l'hôte, sans port dans l'URL. Le nginx d'UGOS le tient tant que
# la redirection HTTPS de son interface est cochée (« defaultHttpsRedirectEnable »
# de /etc/nginx/config.json, simple 307 vers son 9443) : décochée, il est
# libre. Pas publié par Docker sur nas-proxy : un port déjà pris fait échouer
# la création du conteneur, et avec lui le 8443. Un second Traefik
# (nas_proxy_forward_container_name), en réseau hôte, le prend quand il est
# libre et passe chaque connexion TCP telle quelle (TLS compris) à
# nas_proxy_forward_target_port de nas-proxy, en PROXY protocol v2 pour que
# nas-proxy voie l'IP du client (ugos-lan, X-Forwarded-For de Jellyfin). Pris,
# ce Traefik sort et Docker le relance (au plus une fois par minute) : le
# 8443 n'en sait rien. À l'inverse, rien ne garantit que nginx démarre avant
# Docker : si la case est recochée et que le relais tient déjà le 443 quand
# nginx (re)démarre, nginx échoue au bind et l'interface d'UGOS tombe toute
# (9999 compris, donc nas.sylvain.cloud aussi). Secours, en SSH :
# `docker stop nas-proxy-443`, redémarrer nginx, décocher la case, puis
# `docker start nas-proxy-443`. Le port 80 reste au nginx d'UGOS (site
# Debian par défaut), le DNS-01 n'en a pas besoin.
nas_proxy_host_https_port: 443
nas_proxy_forward_container_name: nas-proxy-443
# Provisoire : à recaler à ~2x memory.peak après une semaine d'usage. Un
# OOM ici redémarre le relais en boucle, comme un 443 pris par nginx.
nas_proxy_forward_mem_limit: 64m
# Entrée de nas-proxy réservée au relais, jamais publiée : jointe par l'hôte
# à l'IP fixe de nas-proxy sur le réseau media (nas_proxy_media_ip).
nas_proxy_forward_target_port: 8444
# Seule source dont nas-proxy croit l'en-tête PROXY sur cette entrée : l'IP
# de l'hôte sur le pont du réseau media (la passerelle Docker, première IP de
# jellyfin_proxy_subnet), d'où part toute connexion de l'hôte vers
# {{ nas_proxy_media_ip }}. Un conteneur (le Newt, Jellyfin) qui joindrait ce
# port a une autre IP : son en-tête serait ignoré, sa propre IP gardée.
nas_proxy_forward_trusted_ip: 172.30.96.1
nas_proxy_acme_email: "{{ pangolin_le_email }}"
# Clé OVH dédiée au DNS-01, restreinte aux trois appels que fait lego (ajout du
# TXT, rafraîchissement de la zone, suppression du TXT), créée sur
# https://eu.api.ovh.com/createToken/?POST=/domain/zone/sylvain.cloud/record&POST=/domain/zone/sylvain.cloud/refresh&DELETE=/domain/zone/sylvain.cloud/record/*
# Clés SOPS préfixées nas_ovh_*, jamais le nom d'une variable du rôle.
nas_proxy_ovh_endpoint: ovh-eu
nas_proxy_ovh_application_key: "{{ nas_ovh_application_key }}"
nas_proxy_ovh_application_secret: "{{ nas_ovh_application_secret }}"
nas_proxy_ovh_consumer_key: "{{ nas_ovh_consumer_key }}"
nas_proxy_mem_limit: 256m

# --- Jellyfin : https://media.sylvain.cloud ---
nas_proxy_media_domain: media.sylvain.cloud
nas_proxy_media_url: http://jellyfin:8096
# Le réseau privé du projet jellyfin, qui le crée (réseau `media` de son
# compose, nommé jellyfin_media par Compose) : Traefik le rejoint en externe,
# à IP fixe dans son sous-réseau (jellyfin_proxy_subnet). Cette IP est celle
# saisie dans Jellyfin (Tableau de bord, Réseau, « Proxys connus ») pour qu'il
# croie ses X-Forwarded-* : ne pas la changer sans la changer là-bas.
nas_proxy_media_network: jellyfin_media
nas_proxy_media_ip: 172.30.96.10

# --- Interface d'UGOS : https://nas.sylvain.cloud ---
# Le nginx d'UGOS, joint depuis le conteneur par l'IP LAN de l'hôte (testé :
# 307 vers /desktop/, chemins relatifs, Host d'origine accepté). HTTP en
# clair assumé : de Traefik à l'hôte qui le fait tourner, sans traverser le
# LAN ; le 9443 d'UGOS n'a qu'un certificat autosigné.
nas_proxy_ugos_domain: nas.sylvain.cloud
nas_proxy_ugos_url: "http://{{ ansible_host }}:9999" # NOSONAR
# Sources admises sur le routeur ugos : le LAN seul, d'où arrivent les
# navigateurs de la maison et le Newt LXC (ressource privée nas, Admin seul),
# leur IP conservée par le DNAT de Docker sur le 8443 publié, et par le PROXY
# protocol du relais sur le 443 de l'hôte. Le Newt du site
# nas, lui, joint le 8443 du conteneur par le réseau newt (172.x) pour les
# ressources media.sylvain.cloud (rôle jellyfin) et mediamanager.sylvain.cloud
# (rôle mediamanager) : sans ce filtre, un membre de l'un de ces rôles
# atteindrait l'interface d'UGOS en y envoyant Host: nas.sylvain.cloud.
nas_proxy_ugos_source_ranges:
  - 192.168.1.0/24

# --- MediaManager (essai) : https://mediamanager.sylvain.cloud ---
# Comme Jellyfin, sur les trois entrées, sans filtre de source : la ressource
# privée Pangolin du même nom (site nas, rôle mediamanager) passe par le Newt
# du NAS comme celle de Jellyfin. Le compte de MediaManager est la barrière
# (README).
nas_proxy_mediamanager_domain: mediamanager.sylvain.cloud
nas_proxy_mediamanager_url: http://mediamanager:8000
# Créé par dc@nas_proxy sous ce nom, interne, rejoint en externe par
# dc@mediamanager (mediamanager_network) : d'où mediamanager après nas_proxy
# dans nas.yml. Retirer l'essai ne touche pas nas_proxy.
nas_proxy_mediamanager_network: mediamanager_proxy

# --- Prowlarr et qBittorrent (rôle mediamanager) ---
# https://prowlarr.sylvain.cloud et https://qbittorrent.sylvain.cloud : comme
# mediamanager, sur les trois entrées, mais les ressources privées Pangolin
# (site nas) sont liées au seul rôle mediamanager-admin. Les deux vivent dans
# l'espace réseau de gluetun (kill switch) : Traefik joint gluetun sur
# mediamanager_proxy, par son nom de conteneur.
# Ni l'un ni l'autre ne fait d'OIDC : leur propre compte reste la barrière
# du secours, et oauth2-proxy (section suivante) la première, devant Traefik.
nas_proxy_prowlarr_domain: prowlarr.sylvain.cloud
nas_proxy_prowlarr_url: http://mediamanager-gluetun:9696
nas_proxy_qbittorrent_domain: qbittorrent.sylvain.cloud
nas_proxy_qbittorrent_url: http://mediamanager-gluetun:8080

# --- Pocket ID devant Prowlarr et qBittorrent (oauth2-proxy) ---
# forwardAuth de Traefik vers oauth2-proxy sur les deux routeurs : tout chemin
# (LAN, 443, 8443, Pangolin) exige une session Pocket ID du groupe
# mediamanager-admin. Rien n'est rendu sans les trois sorties de
# tofu/pangolin_config (client pas encore appliqué) : routeurs inchangés.
# Les comptes propres des applis restent ; si Pocket ID ou oauth2-proxy tombe,
# secours = tunnel SSH vers 127.0.0.1:9696 / 8080 (contourne Traefik, README).
nas_proxy_oidc_client_id: "{{ terraform_outputs.pocket_id_mediamanager_tools_client_id.value | default('') }}"
nas_proxy_oidc_client_secret: "{{ terraform_outputs.pocket_id_mediamanager_tools_client_secret.value | default('') }}"
nas_proxy_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
nas_proxy_oidc_enabled: >-
  {{ nas_proxy_oidc_client_id | length > 0
     and nas_proxy_oidc_client_secret | length > 0
     and nas_proxy_oidc_issuer | length > 0 }}
nas_proxy_oauth2_image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
nas_proxy_oauth2_container_name: nas-proxy-oauth2
nas_proxy_oauth2_group: mediamanager-admin
# Estimé, pas mesuré : un proxy Go sans état, ~15 à 30 Mo de RSS au repos ;
# 2x le haut de la fourchette. À recaler sur memory.peak après une semaine.
nas_proxy_oauth2_mem_limit: 64m
# Exactement 32 octets (32 caractères hexadécimaux), dérivés comme les clés des
# autres rôles ; pas de clé SOPS. Change seulement si backup_passphrase change :
# les sessions ouvertes tomberaient, sans autre dégât.
nas_proxy_oauth2_cookie_secret: "{{ ((backup_passphrase ~ '-nas-proxy-oauth2-cookie') | hash('sha256'))[:32] }}"
# Les noms protégés : un cookie propre à chacun (préfixe __Host-, sans Domain).
# Le premier label sert de nom au routeur /oauth2/.
nas_proxy_oauth2_domains:
  - "{{ nas_proxy_prowlarr_domain }}"
  - "{{ nas_proxy_qbittorrent_domain }}"

# --- Échéance des certificats (nas-proxy-cert-check.timer) ---
# Le NAS n'est joignable que du LAN et par le client Pangolin : l'Uptime Kuma
# de PikaPods ne peut pas lire ses certificats. Chaque jour, files/cert_check.py
# s'y connecte depuis le NAS, sur le port publié, avec chaque nom en SNI, et
# pousse le résultat au moniteur « Certificats NAS ». URL push : l'output
# uptime_cron_nas_cert_url de tofu/pangolin_config (nas.yml) ; vide, la
# vérification tourne sans rien pousser.
nas_proxy_cert_healthcheck_url: ""
nas_proxy_cert_check_host: 127.0.0.1
nas_proxy_cert_check_names:
  - "{{ nas_proxy_media_domain }}"
  - "{{ nas_proxy_ugos_domain }}"
  - "{{ nas_proxy_mediamanager_domain }}"
  - "{{ nas_proxy_prowlarr_domain }}"
  - "{{ nas_proxy_qbittorrent_domain }}"
# Traefik renouvelle 30 jours avant l'échéance (certificats Let's Encrypt de
# 90 jours) : sous 14 jours, le renouvellement échoue depuis plus de deux
# semaines, et il reste deux semaines pour réparer.
nas_proxy_cert_check_min_days: 14
nas_proxy_cert_check_schedule: "*-*-* 07:00:00"

# --- Santé des applis (nas-health-check.timer) ---
# Comme les certificats : l'Uptime Kuma de PikaPods ne joint pas le NAS.
# Toutes les 5 minutes, files/health_check.sh interroge chaque appli par ce
# Traefik (127.0.0.1, port publié, son nom en SNI et en Host : le chemin d'un
# navigateur de la maison, TLS compris) et pousse UN résultat au moniteur
# « Healthcheck NAS » (uptimekuma_monitor_push.health_nas de
# tofu/pangolin_config) : up si toutes répondent, sinon down avec l'erreur de
# chaque appli en échec. URL push : la sortie uptime_health_nas_url, lue par
# nas.yml dans nas_proxy_healthcheck_url ; vide, les applis sont vérifiées
# sans rien pousser. Retirer MediaManager retire son entrée ici
# (ansible/roles/mediamanager/README.md).
nas_proxy_healthcheck_url: ""
nas_proxy_health_checks:
  - name: jellyfin
    domain: "{{ nas_proxy_media_domain }}"
    path: /health
  - name: mediamanager
    domain: "{{ nas_proxy_mediamanager_domain }}"
    path: /api/v1/health
# Les configurations curl des URL push, 0600 root.
nas_proxy_health_dir: "{{ nas_proxy_base_path }}/health"
# *:0/N seulement : les tests de tofu/pangolin_config en tirent la fenêtre
# des moniteurs (deux périodes).
nas_proxy_health_check_schedule: "*:0/5"

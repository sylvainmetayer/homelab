---
# Configuration dynamique du Traefik du NAS : un routeur et un service par nom.
# Traefik ajoute lui-même X-Forwarded-For/-Proto/-Host, garde le Host
# d'origine et laisse passer les websockets.
http:
  routers:
    # Jellyfin ne croit les X-Forwarded-* que de ses « Proxys connus » (l'IP
    # fixe de Traefik sur le réseau media, {{ nas_proxy_media_ip }}, saisie
    # dans son tableau de bord).
    jellyfin:
      # Le port ({{ nas_proxy_https_port }}) ne compte pas dans Host().
      rule: "Host(`{{ nas_proxy_media_domain }}`)"
      entryPoints:
        - websecure
        - websecure-lan
        - websecure-forwarded
      service: jellyfin
      middlewares:
        - jellyfin-headers
      tls:
        certResolver: letsencrypt
{% if nas_proxy_wildcard_domain | length > 0 %}
        domains:
          - main: "{{ nas_proxy_wildcard_domain }}"
{% endif %}

    # MediaManager (essai), sur le réseau mediamanager_proxy que crée
    # dc@mediamanager. Ouvert comme Jellyfin : la ressource privée Pangolin
    # mediamanager.sylvain.cloud passe par le Newt du NAS (443, 8443).
    mediamanager:
      rule: "Host(`{{ nas_proxy_mediamanager_domain }}`)"
      entryPoints:
        - websecure
        - websecure-lan
        - websecure-forwarded
      service: mediamanager
      middlewares:
        - mediamanager-headers
      tls:
        certResolver: letsencrypt
{% if nas_proxy_wildcard_domain | length > 0 %}
        domains:
          - main: "{{ nas_proxy_wildcard_domain }}"
{% endif %}

    # Prowlarr et qBittorrent (rôle mediamanager) : leurs ports sont ceux de
    # gluetun, dont ils partagent l'espace réseau. Même ouverture que
    # mediamanager ; les ressources privées Pangolin sont liées au rôle
    # mediamanager-admin.
    prowlarr:
      rule: "Host(`{{ nas_proxy_prowlarr_domain }}`)"
      entryPoints:
        - websecure
        - websecure-lan
        - websecure-forwarded
      service: prowlarr
      middlewares:
{% if nas_proxy_oidc_enabled | bool %}
        - oauth2-auth
{% endif %}
        - mediamanager-headers
      tls:
        certResolver: letsencrypt
{% if nas_proxy_wildcard_domain | length > 0 %}
        domains:
          - main: "{{ nas_proxy_wildcard_domain }}"
{% endif %}

    qbittorrent:
      rule: "Host(`{{ nas_proxy_qbittorrent_domain }}`)"
      entryPoints:
        - websecure
        - websecure-lan
        - websecure-forwarded
      service: qbittorrent
      middlewares:
{% if nas_proxy_oidc_enabled | bool %}
        - oauth2-auth
{% endif %}
        - mediamanager-headers
      tls:
        certResolver: letsencrypt
{% if nas_proxy_wildcard_domain | length > 0 %}
        domains:
          - main: "{{ nas_proxy_wildcard_domain }}"
{% endif %}

{% if nas_proxy_oidc_enabled | bool %}
    # Pocket ID : /oauth2/ de chacun de ces deux noms va à oauth2-proxy (start,
    # callback, sign_in), avant le routeur de l'appli (priorité explicite).
{% for domain in nas_proxy_oauth2_domains %}
    {{ domain.split('.')[0] }}-oauth2:
      rule: "Host(`{{ domain }}`) && PathPrefix(`/oauth2/`)"
      priority: 1000
      entryPoints:
        - websecure
        - websecure-lan
        - websecure-forwarded
      service: oauth2-proxy
      tls:
        certResolver: letsencrypt
{% if nas_proxy_wildcard_domain | length > 0 %}
        domains:
          - main: "{{ nas_proxy_wildcard_domain }}"
{% endif %}

{% endfor %}
{% endif %}
    # Interface d'UGOS (nginx sur 9999 de l'hôte), en LAN et par la ressource
    # privée Pangolin nas.sylvain.cloud, qui vise l'IP LAN du NAS : le 8443 et
    # le 443 de l'hôte (relais, websecure-forwarded) ; le 443 du conteneur
    # n'est joint que par le Newt du site nas (media et
    # mediamanager.sylvain.cloud). Ce Newt joint pourtant aussi le 8443
    # (ressources media et mediamanager.sylvain.cloud, rôles jellyfin et
    # mediamanager) : ugos-lan n'admet que le LAN (nas_proxy_ugos_source_ranges).
    # L'interface suit l'origine de la page (redirections relatives, API sur
    # location.origin) : ni réécriture ni Host forcé.
    ugos:
      rule: "Host(`{{ nas_proxy_ugos_domain }}`)"
      entryPoints:
        - websecure-lan
        - websecure-forwarded
      service: ugos
      middlewares:
        - ugos-lan
        - ugos-headers
      tls:
        certResolver: letsencrypt
{% if nas_proxy_wildcard_domain | length > 0 %}
        domains:
          - main: "{{ nas_proxy_wildcard_domain }}"
{% endif %}

  middlewares:
    jellyfin-headers:
      headers:
        # HTTPS seul sur ce nom, à tous les ports ; sans includeSubdomains : les
        # autres *.sylvain.cloud sont servis par Pangolin.
        stsSeconds: 31536000
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: same-origin
    # Comme Jellyfin : HSTS sur ce nom seul, pas d'iframe d'une autre origine.
    mediamanager-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        customFrameOptionsValue: SAMEORIGIN
        referrerPolicy: same-origin
{% if nas_proxy_oidc_enabled | bool %}
    # forwardAuth « à upstream statique » (doc d'oauth2-proxy) : la racine
    # répond 202 si la session est valide et du groupe, sinon 302 vers Pocket ID
    # (--skip-provider-button), retour bâti sur X-Forwarded-Host/-Uri. Pas
    # d'errors middleware : un 401 de l'appli elle-même passe tel quel.
    oauth2-auth:
      forwardAuth:
        address: http://{{ nas_proxy_oauth2_container_name }}:4180/
        # Faux : Traefik recalcule X-Forwarded-Host/-Proto/-Uri/-For de la requête
        # reçue (le Host d'origine, le TLS terminé ici), au lieu de croire ceux
        # d'un client. Rien n'est en amont de ce Traefik qui les pose : Pangolin
        # ne fait que tunneler le TCP (ressources privées).
        trustForwardHeader: false
{% endif %}
    # HSTS seul : UGOS pose sa propre CSP (frame-src calé sur le Host reçu),
    # et ses fenêtres sont des iframes de même origine.
    ugos-headers:
      headers:
        stsSeconds: 31536000
    # Adresse source de la connexion (pas de X-Forwarded-For : ipStrategy
    # absente), celle de l'en-tête PROXY sur websecure-forwarded : 403 pour
    # tout ce qui ne vient pas du LAN.
    ugos-lan:
      ipAllowList:
        sourceRange: {{ nas_proxy_ugos_source_ranges | to_json }}

  services:
    jellyfin:
      loadBalancer:
        servers:
          - url: "{{ nas_proxy_media_url }}"
    ugos:
      loadBalancer:
        servers:
          - url: "{{ nas_proxy_ugos_url }}"
    mediamanager:
      loadBalancer:
        servers:
          - url: "{{ nas_proxy_mediamanager_url }}"
    prowlarr:
      loadBalancer:
        servers:
          - url: "{{ nas_proxy_prowlarr_url }}"
{% if nas_proxy_oidc_enabled | bool %}
    oauth2-proxy:
      loadBalancer:
        servers:
          - url: "http://{{ nas_proxy_oauth2_container_name }}:4180"
{% endif %}
    qbittorrent:
      loadBalancer:
        servers:
          - url: "{{ nas_proxy_qbittorrent_url }}"

# Option TLS « default » : tous les noms du NAS. Même liste que Pangolin
# (traefik_dynamic_config.yml.j2) : en TLS 1.2, ECDHE + AEAD seulement, pas de
# CBC ; TLS 1.3 n'est pas concerné par cipherSuites.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256

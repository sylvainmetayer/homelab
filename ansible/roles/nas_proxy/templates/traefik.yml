---
# Configuration statique du Traefik du NAS (dc@nas_proxy) : Jellyfin,
# l'interface d'UGOS et MediaManager. Fournisseur fichier seul : ni labels, ni socket Docker
# monté.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

# Requêtes en erreur seulement (4xx, 5xx), sur stdout : docker logs
# {{ nas_proxy_container_name }}. Format common, une ligne par requête. Jellyfin passe le
# jeton d'accès en paramètre (?api_key=…, flux vidéo, images) ou en en-tête
# (Authorization, X-Emby-Token) : RequestPath porte la query string tant que
# queryParameters la garde (Traefik 3.7, pkg/middlewares/accesslog/logger.go),
# d'où les deux drop. Sans en-têtes, le Referer et le User-Agent de la ligne
# common valent "-". Seul le chemin reste : un seul appel de Jellyfin y porte
# un secret, DELETE /Auth/Keys/{clé} (révocation d'une clé d'API, par un
# administrateur), journalisé s'il échoue. UGOS passe aussi son jeton
# en paramètre (?token=…, miniatures, téléchargements) : même drop. Le ping du healthcheck n'est pas
# journalisé (addInternals: false par défaut). StartUTC retiré : l'heure de la
# ligne est alors l'heure locale (TZ du compose), comme celle des autres logs.
accessLog:
  format: common
  filters:
    statusCodes:
      - "400-599"
  fields:
    names:
      StartUTC: drop
    headers:
      defaultMode: drop
    queryParameters:
      defaultMode: drop

entryPoints:
  # Le 443 du conteneur : https://{{ nas_proxy_media_domain }} sans port, par
  # la ressource privée Pangolin (réseau newt). Pas de port 80 : il est au
  # nginx d'UGOS, et le DNS-01 n'en a pas besoin. Le certificat suit le Host()
  # du routeur.
  websecure:
    address: ":443"
    http:
      # Supprime les en-têtes qui en imitent un autre (X_Forwarded_For…) :
      # aucun client ne peut se faire passer pour ce que pose Traefik.
      aliasHeadersStrategy: delete
  # Même port dans le conteneur et sur le NAS (LAN), ouvert aussi dans la
  # ressources Pangolin : une appli (téléphone, TV) réglée à la maison sur
  # https://<nom>:{{ nas_proxy_https_port }} marche encore dehors.
  websecure-lan:
    address: ":{{ nas_proxy_https_port }}"
    http:
      aliasHeadersStrategy: delete
  # Le 443 de l'hôte, par le relais {{ nas_proxy_forward_container_name }}
  # (forward.yml) : jamais publié, joint par l'hôte sur le réseau media.
  # L'en-tête PROXY v2 du relais donne l'IP du client (ipAllowList d'ugos-lan,
  # X-Forwarded-For vers Jellyfin) ; d'une autre source, il est ignoré.
  websecure-forwarded:
    address: ":{{ nas_proxy_forward_target_port }}"
    proxyProtocol:
      trustedIPs:
        - "{{ nas_proxy_forward_trusted_ip }}/32"
    http:
      aliasHeadersStrategy: delete
  # Healthcheck du conteneur (traefik healthcheck --ping), jamais publié.
  ping:
    address: ":8082"
    http:
      aliasHeadersStrategy: delete

ping:
  entryPoint: ping

providers:
  file:
    filename: /etc/traefik/dynamic.yml

certificatesResolvers:
  letsencrypt:
    acme:
      email: "{{ nas_proxy_acme_email }}"
      # Dans le dossier du projet, sur le disque du NAS (jamais sur NFS), 0600.
      # Repris de l'ancien Traefik du compose de jellyfin (même résolveur).
      storage: /letsencrypt/acme.json
      # DNS-01 par l'API OVH (identifiants OVH_* du compose) : les A de
      # {{ nas_proxy_media_domain }}, {{ nas_proxy_ugos_domain }} et
      # {{ nas_proxy_mediamanager_domain }} visent une IP privée, aucun HTTP-01
      # possible.
      # Résolveurs publics pour la vérification de propagation : pas de cache
      # de la Bbox entre l'ajout du TXT et la vérification.
      dnsChallenge:
        provider: ovh
        resolvers:
          - "1.1.1.1:53"
          - "9.9.9.9:53"

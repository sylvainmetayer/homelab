---
# Le NAS seul : dc@ système, exécuté en root (host_vars/nas), comme les
# fichiers de Traefik (root dans le conteneur).
- name: Refuse to run outside a system-scope dc@ host
  ansible.builtin.assert:
    that:
      - docker_service_scope | default('user') == 'system'
    fail_msg: "nas_proxy ne tourne que sur le NAS (docker_service_scope: system, host_vars/nas)."
    quiet: true

# Configuration et certificat à root (root dans le conteneur, sans
# CAP_DAC_OVERRIDE), sur le disque du NAS, jamais sur NFS. Rien de secret dans
# les deux fichiers de configuration (les identifiants OVH sont dans le
# compose), mais acme.json porte les clés privées des certificats.
- name: Ensure the nas_proxy folders exist
  become: true
  loop:
    - "{{ nas_proxy_base_path }}"
    - "{{ nas_proxy_base_path }}/config"
    - "{{ nas_proxy_base_path }}/acme"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Traefik refuse un acme.json qui n'est pas en 0600. Créé vide une fois, puis
# laissé à Traefik : touch ne change jamais le contenu (dates préservées,
# idempotent), mais repose propriétaire et mode à chaque passage.
- name: Ensure the ACME storage exists with mode 0600
  become: true
  ansible.builtin.file:
    path: "{{ nas_proxy_base_path }}/acme/acme.json"
    state: touch
    access_time: preserve
    modification_time: preserve
    owner: root
    group: root
    mode: "0600"

- name: Template the Traefik configuration
  become: true
  diff: false
  notify: Restart nas_proxy
  loop: [traefik.yml, dynamic.yml, forward.yml, forward-dynamic.yml]
  ansible.builtin.template:
    src: "templates/{{ item }}"
    dest: "{{ nas_proxy_base_path }}/config/{{ item }}"
    owner: root
    group: root
    mode: "0600"

- name: Template the nas_proxy compose configuration
  become: true
  diff: false
  notify: Restart nas_proxy
  ansible.builtin.template:
    src: templates/compose.yaml
    dest: "{{ nas_proxy_base_path }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"

# Unité système (/etc/systemd/system/dc@.service posée par docker_service
# dans nas.yml).
- name: Make sure the nas_proxy service is running
  become: "{{ docker_service_scope == 'system' }}"
  ansible.builtin.systemd:
    name: "dc@{{ nas_proxy_service }}"
    scope: "{{ docker_service_scope }}"
    state: started
    enabled: true
    daemon_reload: true

# Échéance des certificats servis, vérifiée sur le NAS chaque jour
# (defaults, « Échéance des certificats ») : l'Uptime Kuma de PikaPods ne
# joint pas le NAS.
- name: Install the certificate expiry check script
  become: true
  ansible.builtin.copy:
    src: cert_check.py
    dest: "{{ nas_proxy_base_path }}/cert_check.py"
    owner: root
    group: root
    mode: "0700"

# L'URL push porte le jeton du moniteur : 0600 et diff: false.
- name: Write the push URL of the certificate expiry monitor
  become: true
  diff: false
  ansible.builtin.copy:
    content: "NAS_PROXY_CERT_PUSH_URL={{ nas_proxy_cert_healthcheck_url }}\n"
    dest: "{{ nas_proxy_base_path }}/cert_check.env"
    owner: root
    group: root
    mode: "0600"

- name: Install the certificate expiry check service and timer
  become: true
  loop:
    - nas-proxy-cert-check.service
    - nas-proxy-cert-check.timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644" # NOSONAR

- name: Enable the daily certificate expiry check
  become: true
  ansible.builtin.systemd:
    name: nas-proxy-cert-check.timer
    state: started
    enabled: true
    daemon_reload: true

# Le 443 de l'hôte, une fois le redémarrage fait (handlers vidés ici : un
# échec ci-dessous ne doit pas laisser la nouvelle configuration non
# appliquée, le 8443 compris). Échec franc plutôt qu'un avertissement : le
# déploiement est manuel, en présence de Sylvain, et un 443 tenu par autre
# chose que le relais veut dire une URL sans port cassée à la maison
# (typiquement : une mise à jour d'UGOS a recoché sa redirection HTTPS).
# Au boot, rien à vérifier : le relais réessaie seul jusqu'à ce que le 443
# soit libre.
- name: Restart nas_proxy now if its configuration changed
  ansible.builtin.meta: flush_handlers

- name: Check that only the nas_proxy relay listens on the host port 443
  ansible.builtin.include_tasks: host_https_port.yml

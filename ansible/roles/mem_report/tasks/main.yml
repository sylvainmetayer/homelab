---
# /usr/local/libexec n'existe pas partout (absent du Pi, 28/10) : le créer
# plutôt que de supposer l'arborescence de l'hôte.
- name: Ensure the memory report script folder exists
  become: true
  ansible.builtin.file:
    path: "{{ mem_report_script | dirname }}"
    state: directory
    owner: root
    group: root
    # Dossier système standard, traversé par le compte de l'unité
    # (mem_report_user, jamais root, lit le script) ; partagé avec ntfy et
    # papra, sans secret (le jeton est dans /etc/mem-report.env, 0600).
    mode: "0755" # NOSONAR

- name: Install the memory report script
  become: true
  ansible.builtin.copy:
    src: mem_report.py
    dest: "{{ mem_report_script }}"
    owner: root
    group: root
    mode: "0644" # NOSONAR

# Le jeton ntfy : 0600 root, diff: false.
- name: Write the ntfy token of the memory report
  become: true
  diff: false
  ansible.builtin.copy:
    content: "MEM_REPORT_NTFY_TOKEN={{ mem_report_ntfy_token }}\n"
    dest: "{{ mem_report_env_file }}"
    owner: root
    group: root
    mode: "0600"

- name: Warn that the report will not be published
  when: mem_report_ntfy_token | length == 0
  ansible.builtin.debug:
    msg: >-
      ntfy_scripts_token vide : le rapport mémoire n'ira qu'au journal
      (journalctl -u mem-report), rien n'est publié sur ntfy.

- name: Install the memory report service and timer
  become: true
  loop:
    - mem-report.service
    - mem-report.timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644" # NOSONAR
  notify: Restart mem-report timer

# Le timer seul : le service, oneshot, n'est jamais lancé par Ansible.
- name: Enable the weekly memory report
  become: true
  ansible.builtin.systemd:
    name: mem-report.timer
    state: started
    enabled: true
    daemon_reload: true

---
services:
  jellystat-db:
    # Pas encore mesuré : une seule bibliothèque Jellyfin, un historique de
    # lectures qui grossit lentement. Valeurs prudentes, à recaler sur
    # memory.peak (rapport mem_report) après une semaine ; la réservation
    # protège le cache de la base (docs/conventions/resource-limits.md).
    mem_limit: 512m
    mem_reservation: 128m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: jellystat-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: {{ jellystat_db_name }}
      POSTGRES_USER: {{ jellystat_db_user }}
      POSTGRES_PASSWORD: {{ jellystat_db_password }}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ jellystat_db_user }} -d {{ jellystat_db_name }}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Postgres 18 range ses données sous /var/lib/postgresql/18/docker et
    # attend le volume un cran au-dessus.
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - jellystat

  app:
    # Essayé en local (podman, mêmes options) : ~100 Mio au repos, sans
    # Jellyfin joignable. Une synchronisation complète de la bibliothèque
    # charge plus : à remesurer, service interactif donc sans quota CPU.
    mem_limit: 512m
    image: docker.io/cyfershepard/jellystat:1.1.12@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
    container_name: jellystat
    restart: unless-stopped
    # L'image tourne en root (node:26-bookworm-slim) ; l'uid de déploiement
    # suffit (essayé en local) et possède backup-data/. Système de fichiers en
    # lecture seule : l'appli tente d'écrire dist/env.js (variables JS_*
    # pour le navigateur), échoue sans gravité (« Error writing env.js »,
    # le navigateur lit window.env avec ?.) ; npm écrit son journal et son
    # cache dans /tmp.
    user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    env_file:
      - .env
    # Sauvegardes JSON que Jellystat prend à la demande (Paramètres) ; elles
    # ne sont pas dans borg, le dump de la base suffit (rôle, tasks/main.yml).
    volumes:
      - ./backup-data:/app/backend/backup-data
    healthcheck:
      # 127.0.0.1 : localhost se résout d'abord en ::1, où l'appli n'écoute pas.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/auth/isconfigured"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      jellystat-db:
        condition: service_healthy
    networks:
      - jellystat
      - newt

volumes:
  postgres_data:

networks:
  # Interne : la base n'a pas besoin d'Internet. L'appli garde le sien par
  # newt (Jellyfin sur le LAN du NAS, MaxMind si configuré).
  jellystat:
    internal: true
  newt:
    external: true

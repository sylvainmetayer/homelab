---
services:
  bookstack:
    mem_limit: 768m
    container_name: bookstack
    security_opt:
      - no-new-privileges:true
    networks:
      - newt    # Réseau externe pour accès Pangolin/Traefik
      - wiki    # Réseau interne pour communication avec la DB
    image: lscr.io/linuxserver/bookstack:26.09.2@sha256:2ece67eeffcc8601f2c3d44c77d787ce49b1e0becfcb2c4bd8ce9b69fa8393ed
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
      - APP_URL=https://{{ wiki_domain }}
      - DB_HOST=bookstack_db
      - DB_PORT=3306
      - DB_USER=bookstack
      - DB_PASS={{ wiki_db_password }}
      - DB_DATABASE=bookstack
{% if wiki_oidc_enabled | bool %}
      # Pocket ID (defaults/main.yml) : exclusif, rappel /oidc/callback.
      - AUTH_METHOD=oidc
      - OIDC_NAME=Pocket ID
      - OIDC_DISPLAY_NAME_CLAIMS=name
      - OIDC_CLIENT_ID={{ wiki_oidc_client_id }}
      - OIDC_CLIENT_SECRET={{ wiki_oidc_client_secret }}
      - OIDC_ISSUER={{ wiki_oidc_issuer }}
      - OIDC_ISSUER_DISCOVER=true
      - OIDC_EXTERNAL_ID_CLAIM=sub
{% endif %}
    volumes:
      - ./config:/config
    restart: unless-stopped
    depends_on:
      bookstack_db:
        condition: service_healthy
    # nginx et php-fpm tournent sous s6 : si l'un boucle, le conteneur reste
    # « running » et Docker ne voit rien. Une connexion TCP à chacun, sans
    # requête : aucune ligne dans access.log (/config, donc le disque), ni PHP
    # ni base. Le fonctionnel reste aux sondes de Pangolin et d'Uptime Kuma.
    # Rien n'attend ce service : rouge, la sonde n'arrête ni ne relance rien.
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 80 && nc -z -w 3 127.0.0.1 9000"]
      interval: 60s
      start_interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s

  bookstack_db:
    mem_limit: 512m
    mem_reservation: 192m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    container_name: bookstack_db
    security_opt:
      - no-new-privileges:true
    networks:
      - wiki    # Réseau interne uniquement
    image: lscr.io/linuxserver/mariadb:11.8.9@sha256:cc9c523dead7690487d5892419b5c513c78bf398fe03b115e43a652ab75a237c
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
      - MYSQL_ROOT_PASSWORD={{ wiki_db_password }}
      - MYSQL_DATABASE=bookstack
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD={{ wiki_db_password }}
    volumes:
      - ./db_data:/config
    restart: unless-stopped
    # L'image linuxserver n'a pas le healthcheck.sh de l'image officielle.
    # `mariadb-admin ping` sort en 0 dès que le serveur répond, même par un
    # refus d'accès : pas de mot de passe dans la commande. En TCP, pour ne
    # pas dépendre du chemin du socket.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

# `internal: true` : pas de sortie vers Internet par ce réseau. bookstack la garde
# par newt ; la base n'en a pas besoin.
networks:
  wiki:      # Réseau interne (créé automatiquement)
    internal: true
  newt:
    external: true  # Réseau créé par le rôle newt

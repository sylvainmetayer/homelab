---
- name: Ensure wiki app folder exists
  loop:
    - "{{ wiki_base_path }}"
    - "{{ wiki_base_path }}/config"
    - "{{ wiki_base_path }}/db_data"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart wiki
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ wiki_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Wiki
  when: wiki_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: wiki
    borgmatic_app_title: Wiki
    borgmatic_app_target: "{{ wiki_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ wiki_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ wiki_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ wiki_base_path }}/config"
      - "{{ wiki_base_path }}/db_data"
      - "{{ wiki_base_path }}/compose.yaml"
    borgmatic_app_mysql_databases:
      - container: bookstack_db
        name: bookstack
        username: bookstack
        password: "{{ wiki_db_password }}"

- name: Make sure wiki service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@wiki
    scope: user
    enabled: true

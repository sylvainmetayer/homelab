---
services:
  app:
    # Pic mesuré à 409 Mio sous l'ancien plafond de 512m.
    mem_limit: 768m
    image: docker.io/mauriceboe/trek:5.1.1@sha256:7068cc86c0d4d5aa9b55aeffd03966f7458352bcb3e010721e3d7d6899ac60bd
    container_name: trek
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # L'image démarre en root (/usr/local/bin/trek-entrypoint, lu dans 5.1.1) :
    # CHOWN rend data/ et uploads/ à l'utilisateur node (au premier démarrage,
    # puis seulement si un fichier n'est pas à lui), SETUID et SETGID pour
    # `gosu node` qui lance ensuite Node sans capacité. Sans l'une des trois,
    # le chown ou le gosu échoue : le conteneur ne démarre pas.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Seul conteneur du projet : pas de réseau privé, newt suffit.
    networks:
      - newt

networks:
  newt:
    external: true

---
# Le conteneur tourne sans CAP_DAC_OVERRIDE (cap_drop: ALL) puis passe en node
# (uid 1000) : il ne peut lire et écrire data/ et uploads/ (0700) que si
# l'utilisateur hôte qui les possède a ce même uid.
- name: Assert the host user has the uid of the trek node user
  ansible.builtin.assert:
    that:
      - ansible_facts['user_uid'] | int == 1000
    fail_msg: >-
      trek s'exécute en node (uid 1000) sans CAP_DAC_OVERRIDE : ses dossiers
      0700 doivent appartenir à l'uid 1000, pas à {{ ansible_facts['user_uid'] }}.
    quiet: true

- name: Ensure Trek app folders exist
  loop:
    - "{{ trek_base_path }}"
    - "{{ trek_base_path }}/data"
    - "{{ trek_base_path }}/uploads"
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart trek
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ trek_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template environment configuration
  notify: Restart trek
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ trek_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Trek
  when: trek_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: trek
    borgmatic_app_title: Trek
    borgmatic_app_target: "{{ trek_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ trek_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ trek_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ trek_base_path }}/data"
      - "{{ trek_base_path }}/uploads"
      - "{{ trek_base_path }}/compose.yaml"
      - "{{ trek_base_path }}/.env"
    borgmatic_app_sqlite_databases:
      - "{{ trek_base_path }}/data/*.db"

- name: Make sure trek service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@trek
    scope: user
    enabled: true

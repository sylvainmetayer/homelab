---
# Remplissage du thin pool LVM de l'hôte Proxmox (local-lvm), données et
# métadonnées : thin-pool-check.timer lance files/thin-pool-check.sh, qui pousse
# up (résumé) ou down au moniteur « Thin pool Proxmox » d'Uptime Kuma, d'où
# Telegram et ntfy. Beszel ne voit que `/` de l'hôte, pas le thin pool, et un
# pool plein gèle la VM docker et le LXC.

# Seuil en pour cent, appliqué aux données et aux métadonnées de chaque pool.
thin_pool_check_threshold: 85

# Script et fichier d'environnement (0700 root).
thin_pool_check_dir: /usr/local/lib/thin-pool-check

# URL push du moniteur (sortie uptime_cron_pve_thin_pool_url de
# tofu/pangolin_config, lue par pve.yml) : vide, rien n'est poussé.
thin_pool_check_healthcheck_url: ""

# Toutes les 6 heures, à :15 de 03, 09, 15 et 21 h : le passage de 21:15 tombe
# pendant le vzdump de 21:00 (tofu/proxmox/backup.tf), quand le fleecing remplit
# le pool, le seul moment où il peut approcher du plein. Le moniteur tolère
# trois passages manqués (cron_thin_pool.tf).
thin_pool_check_schedule: "*-*-* 03/6:15:00"

---
# Modes conteneur : le compose ou le .env a changé. dc@ redémarre le projet
# (unité user en mode dc, système en mode dc_system) ; en mode compose, la
# tâche `docker compose up -d` recrée déjà ce qui a changé, rien à faire ici.
- name: Restart beszel_agent
  when: beszel_agent_mode in ['dc', 'dc_system']
  become: "{{ beszel_agent_mode == 'dc_system' }}"
  ansible.builtin.systemd:
    name: "dc@{{ beszel_agent_service }}"
    scope: "{{ 'system' if beszel_agent_mode == 'dc_system' else 'user' }}"
    state: restarted

- name: Restart beszel-agent
  become: true
  ansible.builtin.systemd:
    name: beszel-agent
    state: restarted
    daemon_reload: true

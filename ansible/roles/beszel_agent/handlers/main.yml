---
# Modes conteneur : le compose ou le .env a changé. dc@ redémarre le projet
# (unité user, ou système si docker_service_scope vaut system) ; en mode compose, la
# tâche `docker compose up -d` recrée déjà ce qui a changé, rien à faire ici.
- name: Restart beszel_agent
  when: beszel_agent_mode == 'dc'
  become: "{{ beszel_agent_dc_scope == 'system' }}"
  ansible.builtin.systemd:
    name: "dc@{{ beszel_agent_service }}"
    scope: "{{ beszel_agent_dc_scope }}"
    state: restarted

- name: Restart beszel-agent
  become: true
  ansible.builtin.systemd:
    name: beszel-agent
    state: restarted
    daemon_reload: true

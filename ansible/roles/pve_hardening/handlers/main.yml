---
- name: Check the sshd configuration
  ansible.builtin.command:
    argv: [/usr/sbin/sshd, -t]
  changed_when: false
  listen: pve_hardening reload sshd

# reload : les sessions ouvertes restent, seules les nouvelles connexions
# suivent la nouvelle configuration.
- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  listen: pve_hardening reload sshd

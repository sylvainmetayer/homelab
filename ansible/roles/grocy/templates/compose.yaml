---
services:
  app:
    # nginx et php-fpm (5 enfants au plus) dans un seul conteneur s6, base
    # SQLite. Pas encore mesuré : même pile que speedtest-tracker
    # (memory.peak à 285 Mio sur la VM, surtout du page cache), plafond à ~2×
    # ce pic, comme lui. À relire après une semaine.
    mem_limit: 640m
    # L'image linuxserver : son init démarre en root, rend config/ à
    # PUID/PGID et lie /app/www/data à config/data (grocy.db, config.php,
    # images), puis tourne en abc.
    image: lscr.io/linuxserver/grocy:4.7.1@sha256:6282144f9a14d4a4dca2bc96801a2e43a2ff51116f001b13e5488eacad7b80e2
    container_name: grocy
    env_file:
      - .env
    volumes:
      - ./config:/config
    restart: unless-stopped
    # /login répond sans compte et passe par PHP et la base (migrations au
    # premier appel), pas seulement par nginx ; `/` y redirige.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Seul conteneur du projet : pas de réseau privé, newt suffit (la
    # recherche Open Food Facts sort vers Internet par lui).
    networks:
      - newt

networks:
  newt:
    external: true

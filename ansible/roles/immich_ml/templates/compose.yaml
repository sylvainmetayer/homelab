services:
  immich-machine-learning:
    container_name: immich_machine_learning
{% if immich_ml_dc_scope == 'system' %}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
{% endif %}
    # Même version que immich-server du Pi (check_immich_versions.py) ; une
    # montée Renovate déploie le Pi au merge, ce NAS seulement à la main :
    # ansible-playbook nas.yml --tags immich_ml juste après (README).
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.0-openvino@sha256:4744421230e2cd9b34621dd6a03cd7c10b228d4c3756242c0b25b23b258a66b1
    mem_limit: {{ immich_ml_mem_limit }}
    # Pas de cpus: : la reconnaissance d'un gros import doit pouvoir prendre
    # les quatre cœurs du N100 (Jellyfin transcode par Quick Sync).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # hwaccel.ml.yml d'Immich, service openvino, sans /dev/bus/usb ni sa règle
    # cgroup « c 189:* » (clé Neural Compute, USB) : docker autorise déjà les
    # périphériques de devices:. Root du conteneur, plus le groupe du
    # périphérique de rendu pour l'iGPU.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "{{ immich_ml_render_gid }}"
    environment:
      - TZ=Europe/Paris
    volumes:
      # Modèles téléchargés depuis Hugging Face au premier appel : un cache,
      # rien à sauvegarder.
      - model-cache:/cache
    # API sans authentification : IP LAN du NAS seulement, lue par le serveur
    # Immich du Pi.
    ports:
      - "{{ immich_ml_bind_address }}:{{ immich_ml_port }}:3003"
    restart: unless-stopped
    healthcheck:
      disable: false

volumes:
  model-cache:

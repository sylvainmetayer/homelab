---
kitchenowl_base_path: "{{ docker_base_path }}/kitchenowl"
kitchenowl_domain: frigo.sylvain.cloud
# Signe les jetons (accès et rafraîchissement) des sessions web et mobiles :
# le changer déconnecte tout le monde.
kitchenowl_jwt_secret_key: "{{ (backup_passphrase ~ '-kitchenowl-jwt') | hash('sha256') }}"
# Durée de validité (jours) d'un jeton de rafraîchissement : la session de
# l'appli mobile tient tant qu'elle s'en sert dans ce délai.
kitchenowl_jwt_refresh_token_expires: 30

# Borgmatic backup configuration
kitchenowl_backup_enabled: true
kitchenowl_backup_borgmatic_target: "{{ backup_storage_box_url }}/kitchenowl"
kitchenowl_backup_encryption_passphrase: "{{ backup_passphrase }}"
kitchenowl_backup_healthcheck_url: ""

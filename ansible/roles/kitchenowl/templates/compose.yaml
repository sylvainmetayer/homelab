---
services:
  app:
    # uWSGI (gevent) + Flask, base SQLite, sans LLM. memory.peak collé aux
    # 512m le 2026-10-29 (1 831 récupérations au plafond, anon ~250 Mio au
    # repos) : plafond doublé, réservation au pic. À relire après une semaine.
    mem_limit: 1g
    mem_reservation: 512m
    # Image unique : l'interface web (Flutter) servie par uWSGI devant l'API.
    image: docker.io/tombursch/kitchenowl:v0.7.10@sha256:bd821a41b8cb27fd7fcf429acd1fc67e9f889485a2cd1193d68c2d804a8e1bef
    container_name: kitchenowl
    # Root sans capacité : l'entrypoint applique les migrations (flask db
    # upgrade) et uWSGI écoute sur 8080, rien qui demande un privilège. data/
    # est à root (tasks/main.yml).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    volumes:
      # database.db (SQLite) et upload/ (images).
      - ./data:/data
    restart: unless-stopped
    # /api/onboarding répond sans compte et passe par Flask, pas seulement
    # par le service des fichiers statiques de uWSGI.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/api/onboarding"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Seul conteneur du projet : pas de réseau privé, newt suffit.
    networks:
      - newt

networks:
  newt:
    external: true

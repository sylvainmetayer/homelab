---
- name: Ensure KitchenOwl app folder exists
  ansible.builtin.file:
    mode: "0700"
    path: "{{ kitchenowl_base_path }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

# L'image tourne en root sans aucune capacité (cap_drop: ALL) : sans
# CAP_DAC_OVERRIDE, root n'écrit que dans un dossier à root.
- name: Ensure KitchenOwl data folder is owned by root
  become: true
  ansible.builtin.file:
    mode: "0700"
    path: "{{ kitchenowl_base_path }}/data"
    state: directory
    owner: root
    group: root

- name: Template compose configuration
  diff: false
  notify: Restart kitchenowl
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ kitchenowl_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template environment configuration
  diff: false
  notify: Restart kitchenowl
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ kitchenowl_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml). La base
# SQLite (data/database.db, créée au premier démarrage par `flask db upgrade`)
# est copiée par « .backup » ; data/upload/ (images des recettes et des
# articles) part tel quel.
- name: Configure borgmatic backup for KitchenOwl
  when: kitchenowl_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: kitchenowl
    borgmatic_app_title: KitchenOwl
    borgmatic_app_target: "{{ kitchenowl_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ kitchenowl_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ kitchenowl_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ kitchenowl_base_path }}/data"
      - "{{ kitchenowl_base_path }}/compose.yaml"
      - "{{ kitchenowl_base_path }}/.env"
    borgmatic_app_sqlite_databases:
      - "{{ kitchenowl_base_path }}/data/*.db"

- name: Make sure kitchenowl service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@kitchenowl
    scope: user
    enabled: true

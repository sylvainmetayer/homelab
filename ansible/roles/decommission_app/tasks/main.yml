---
- name: Refuse to run without an explicit confirmation
  ansible.builtin.assert:
    that:
      - decommission_app_confirm | bool
      - decommission_app_service | length > 0
      - decommission_app_base_path | length > 0
    fail_msg: >-
      This role stops containers and deletes data. Re-run with
      -e decommission_app_confirm=true -e decommission_app_service=<service>
      -e decommission_app_base_path=<docker_base_path>/<service> to proceed.

# kdrive_sync n'a pas d'unité dc@ (un timer lance son compose à la demande) et
# sa configuration borgmatic s'appelle kdrive.yaml (borgmatic_app_name) : ce rôle
# ne la retrouverait pas, et repo-delete échouerait. Refus net plutôt qu'un
# retrait à moitié.
- name: Refuse kdrive_sync, which this role does not cover
  ansible.builtin.assert:
    that:
      - decommission_app_service not in ['kdrive_sync', 'kdrive']
    fail_msg: >-
      decommission_app ne retire pas kdrive_sync (config borgmatic kdrive.yaml,
      pas d'unité dc@) : voir le README du rôle.
    quiet: true

# Effacé en root et compose y est lancé : l'unité dc@<service> a pour dossier
# {{ docker_base_path }}/<service> (dc@.service, WorkingDirectory), un autre
# chemin n'est donc jamais celui de cette application. L'égalité écarte /, les
# chemins relatifs, les .., et le dossier d'une voisine ; le motif du service
# empêche d'y glisser un chemin ou des .. des deux côtés à la fois.
- name: Refuse a base path other than the app's own folder
  vars:
    decommission_app_own_path: "{{ docker_base_path }}/{{ decommission_app_service }}"
  ansible.builtin.assert:
    that:
      - decommission_app_service is match('^[a-z0-9][a-z0-9_-]*$')
      - decommission_app_base_path == decommission_app_own_path
    fail_msg: >-
      decommission_app_service doit suivre ^[a-z0-9][a-z0-9_-]*$ (reçu :
      {{ decommission_app_service }}) et decommission_app_base_path valoir
      {{ decommission_app_own_path }}, sans / final (reçu :
      {{ decommission_app_base_path }}).
    quiet: true

# Effacés en root : un -e mal écrit (/mnt/nas/apps sans /<service>) viderait
# le NAS de toutes les applis. Seul le dossier NAS de ce service est accepté.
- name: Refuse extra paths other than the app's own NAS folder
  vars:
    decommission_app_nas_path: "{{ nas_storage_mount_path | default('/mnt/nas/apps') }}/{{ decommission_app_service }}"
  ansible.builtin.assert:
    that:
      - item == decommission_app_nas_path
    fail_msg: >-
      decommission_app_extra_paths n'accepte que {{ decommission_app_nas_path }}
      (dossier NAS de {{ decommission_app_service }}), pas {{ item }}.
    quiet: true
  loop: "{{ decommission_app_extra_paths }}"

# Rien n'est encore arrêté ni effacé : ce que la suite va supprimer est dit ici.
- name: Announce what will be removed
  ansible.builtin.debug:
    msg: >-
      {{ decommission_app_service }} : conteneurs et volumes compose
      (+ ceux du label com.docker.compose.project si le compose manque),
      {{ decommission_app_base_path }}{{ decommission_app_extra_paths | map('regex_replace', '^', ', ') | join }}
      {{ 'supprimés' if decommission_app_remove_data | bool else 'GARDÉS (decommission_app_remove_data=false)' }},
      configuration borgmatic dans {{ borgmatic_config_dir }}
      {{ 'SUPPRIMÉE' if decommission_app_remove_borgmatic_config | bool else 'gardée' }}.
      Dépôt Borg distant :
      {{ 'DÉTRUIT (irréversible)' if decommission_app_destroy_remote_backup | bool else 'conservé' }}.
      {{ 'La configuration part sans que le dépôt soit détruit : repo-delete ne sera plus possible ensuite.'
         if (decommission_app_remove_borgmatic_config | bool and not decommission_app_destroy_remote_backup | bool) else '' }}
  register: decommission_app_plan

- name: Check whether the app folder exists
  become: true
  ansible.builtin.stat:
    path: "{{ decommission_app_base_path }}"
  register: decommission_app_base_path_stat

# Avant repo-delete : un compose invalide ferait échouer l'arrêt plus bas, le
# dépôt serait déjà détruit. Un compose absent est toléré (le balayage par label
# plus bas prend le relais), comme à l'arrêt.
- name: Check the compose file before anything is destroyed
  become: "{{ decommission_app_as_root }}"
  when: decommission_app_base_path_stat.stat.exists
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ decommission_app_base_path }}"
  register: decommission_app_compose_check
  changed_when: false
  failed_when:
    - decommission_app_compose_check.rc | default(0) != 0
    - decommission_app_compose_check.stderr | default('') is not search('no configuration file provided')

# Avant l'arrêt et le `down --volumes` : un échec laisse l'application tourner,
# volumes compris, et rien à reconstruire pour réessayer.
- name: Destroy the remote Borg repository (irreversible, no more restore points)
  become: true
  when: decommission_app_destroy_remote_backup | bool
  ansible.builtin.command:
    cmd: >-
      {{ decommission_app_borgmatic_bin }}
      --config {{ borgmatic_config_dir }}/{{ decommission_app_service }}.yaml
      repo-delete --force
  register: decommission_app_repo_delete
  changed_when: decommission_app_repo_delete.rc | default(1) == 0
  # Échec réel : la tâche échoue, rien n'a été touché. Dépôt déjà absent : ok.
  # borgmatic sort toujours en 1, seule sa sortie distingue le cas : code 13 de
  # borg (BORG_EXIT_CODES=modern, posé par borgmatic), relevé sur borgmatic 2.1
  # et 2.2, borg 1.4 en local et en SSH (serveur 1.2 et 1.4).
  # Sortie et erreur réunies : enrobage docker compose run sur le NAS.
  failed_when:
    - decommission_app_repo_delete.rc | default(1) != 0
    - >-
      (decommission_app_repo_delete.stderr | default('') ~ decommission_app_repo_delete.stdout | default(''))
      is not search('(?s)Repository \\S+ does not exist\\..*non-zero exit status 13\\.')

# Un dépôt absent passe pour « déjà détruit » : si l'URL de la configuration est
# fausse, rien n'a été supprimé, et seule cette ligne le dit.
- name: Warn that the repository was not there
  when: decommission_app_repo_delete.rc | default(0) != 0
  ansible.builtin.debug:
    msg: >-
      ATTENTION, dépôt absent, rien supprimé :
      {{ (decommission_app_repo_delete.stderr | default('') ~ decommission_app_repo_delete.stdout | default(''))
         | regex_search('Repository \\S+ does not exist\\.') }}
      Vérifier l'URL de {{ borgmatic_config_dir }}/{{ decommission_app_service }}.yaml.
  register: decommission_app_repo_absent

# Unité user, ou système sur le NAS (docker_service_scope: system) : root
# la pilote et lance son compose (sylvain n'y est pas dans le groupe docker).
- name: Stop and disable the app's systemd unit
  become: "{{ decommission_app_as_root }}"
  ansible.builtin.systemd:
    name: "dc@{{ decommission_app_service }}"
    scope: "{{ decommission_app_dc_scope }}"
    state: stopped
    enabled: false
  register: decommission_app_unit_stop
  # Un arrêt qui échoue n'efface rien ensuite, mais l'unité est déjà désactivée
  # (le module traite enabled avant state) : l'application tourne jusqu'au
  # prochain redémarrage de l'hôte. Seule une unité introuvable (pas de modèle
  # dc@ sur l'hôte) est tolérée.
  failed_when:
    - decommission_app_unit_stop.failed | default(false)
    - decommission_app_unit_stop.msg | default('') is not search('Could not find the requested service')

# Dossier absent (2e passage) : rien à arrêter. Dossier sans compose : toléré
# aussi, compose sort alors en 1 ou 14 selon sa version, seul le message est
# stable (relevé sur 2.26 et 2.40). Tout autre échec (démon injoignable, compose
# invalide) arrête le rôle, données et configuration en place.
- name: Tear down containers, networks and volumes
  become: "{{ decommission_app_as_root }}"
  when: decommission_app_base_path_stat.stat.exists
  ansible.builtin.command:
    cmd: docker compose down --volumes --remove-orphans
    chdir: "{{ decommission_app_base_path }}"
  register: decommission_app_compose_down
  changed_when: decommission_app_compose_down.rc | default(1) == 0
  failed_when:
    - decommission_app_compose_down.rc | default(1) != 0
    - decommission_app_compose_down.stderr | default('') is not search('no configuration file provided')

# Sans compose (dossier ou fichier perdu), `down` n'a rien retiré : conteneurs
# et volumes restent sous le label de projet compose, qui est le nom du dossier.
# Derrière le même interrupteur que les données : ce sont des données.
- name: Remove containers and volumes left under the compose project label
  become: "{{ decommission_app_as_root }}"
  when:
    - decommission_app_remove_data | bool
    - decommission_app_compose_down.rc | default(1) != 0
  ansible.builtin.shell:
    cmd: |
      set -eo pipefail
      docker ps -aq --filter label=com.docker.compose.project={{ decommission_app_service }} | xargs -r docker rm -f
      docker volume ls -q --filter label=com.docker.compose.project={{ decommission_app_service }} | xargs -r docker volume rm
    executable: /bin/bash
  register: decommission_app_orphans
  changed_when: decommission_app_orphans.stdout | length > 0

# La configuration et le fichier de son URL push Uptime Kuma (rôle borgmatic,
# tasks/app.yml).
- name: Remove borgmatic configuration
  become: true
  when: decommission_app_remove_borgmatic_config | bool
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ borgmatic_config_dir }}/{{ decommission_app_service }}.yaml"
    - "{{ borgmatic_config_dir }}/uptime-kuma/{{ decommission_app_service }}.curl"

# Le marqueur de repo-create (rôle borgmatic, tasks/app.yml) part aussi quand le
# dépôt distant est détruit config gardée : resté, il empêcherait de le recréer.
- name: Remove the borgmatic repository marker
  become: true
  when: decommission_app_remove_borgmatic_config | bool or decommission_app_destroy_remote_backup | bool
  ansible.builtin.file:
    path: "{{ borgmatic_config_dir }}/{{ decommission_app_service }}.repo-created"
    state: absent

- name: Remove app data directory
  become: true
  when: decommission_app_remove_data | bool
  ansible.builtin.file:
    path: "{{ decommission_app_base_path }}"
    state: absent

- name: Remove app data kept outside the base path (e.g. on the NAS)
  become: true
  when: decommission_app_remove_data | bool
  loop: "{{ decommission_app_extra_paths }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent

# Per-instance drop-ins of the shared dc@ template (e.g. the NAS wait).
- name: Remove the app's dc@ drop-ins
  become: "{{ decommission_app_as_root }}"
  ansible.builtin.file:
    path: >-
      {{ '/etc/systemd/system' if decommission_app_as_root
         else ansible_facts['env']['HOME'] ~ '/.config/systemd/user' }}/dc@{{ decommission_app_service }}.service.d
    state: absent

# Sans reload, le manager (user ou système) garde le drop-in supprimé en mémoire.
- name: Reload the systemd manager after removing the drop-ins
  become: "{{ decommission_app_as_root }}"
  ansible.builtin.systemd:
    daemon_reload: true
    scope: "{{ decommission_app_dc_scope }}"

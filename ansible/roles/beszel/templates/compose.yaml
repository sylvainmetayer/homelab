---
services:
  hub:
    # Pas encore mesuré : à fixer à ~2x memory.peak après une semaine (#79).
    mem_limit: 256m
    image: docker.io/henrygd/beszel:0.21.1@sha256:8514a69d9bbbcb74f371a3205561ee231fc0289739cea64e8131f341d695b770
    container_name: beszel
    # root du conteneur sans aucune capacité : beszel_data et ce qu'Ansible y
    # pose (config.yml, id_ed25519) appartiennent à root, rien d'autre à
    # écrire.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    volumes:
      - ./beszel_data:/beszel_data
    # Agents qui ne passent pas par Pangolin : l'hôte lui-même (127.0.0.1) et
    # le LAN. Publiés par Docker, donc avant ufw.
    ports:
{% for address in beszel_publish_addresses %}
      - "{{ address }}:{{ beszel_port }}:8090"
{% endfor %}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Seul conteneur du projet : pas de réseau privé, newt suffit.
    networks:
      - newt

networks:
  newt:
    external: true

---
# Hub Beszel (issue #79) : supervision des hôtes (CPU, RAM, disques, réseau,
# conteneurs, SMART). Interface en https://monitoring.sylvain.cloud derrière
# le SSO Pangolin (tofu/pangolin_config/website_beszel.tf), plus le compte
# Beszel.
beszel_base_path: "{{ docker_base_path }}/beszel"
beszel_domain: monitoring.sylvain.cloud
beszel_port: 8090

# Adresses de l'hôte où le port du hub est publié, pour les agents qui ne
# passent pas par Pangolin : 127.0.0.1 pour l'agent de l'hôte lui-même,
# l'adresse LAN (host_vars/docker) pour ceux du Pi, du NAS et du LXC newt.
# Docker publie ces ports avant ufw : sur le LAN, l'interface répond sans
# SSO, et le compte Beszel est alors la seule barrière.
beszel_publish_addresses:
  - 127.0.0.1

# Compte administrateur, créé au premier démarrage seulement (USER_EMAIL /
# USER_PASSWORD) : changer le mot de passe ensuite se fait dans l'interface.
# Mot de passe : clé sops beszel_admin_password.
beszel_admin_email: "{{ pangolin_le_email }}"

# Systèmes déclarés dans beszel_data/config.yml, qui fait autorité : un
# système absent de cette liste est supprimé du hub, historique compris, au
# démarrage suivant. Un par clé du dict sops beszel_agent_tokens (nom =
# inventory_hostname, valeur = jeton de l'agent).
beszel_systems: "{{ beszel_agent_tokens | dict2items | sort(attribute='key') }}"

# Alertes (tasks/alerts.yml, tag beszel_alerts). config.yml ne déclare que les
# systèmes : alertes et canaux de notification vivent dans PocketBase, par
# utilisateur. Le rôle les pose par l'API du hub, connecté au compte
# administrateur (beszel_admin_email / beszel_admin_password : ce mot de passe
# doit rester celui du compte, sinon la tâche échoue). Elles font autorité,
# comme config.yml : une alerte du compte absente d'ici est supprimée.
beszel_alerts_enabled: true
beszel_api_url: "http://127.0.0.1:{{ beszel_port }}"

# Une entrée par type d'alerte (nom = valeur du champ « name » de la
# collection alerts : Status, CPU, Memory, Disk, Temperature, Bandwidth,
# LoadAvg5…), posée sur chaque système de « systems » (par défaut, tous ceux de
# beszel_systems). value : le seuil (%, °C, MB/s) ; min : minutes (1 à 60) sur
# lesquelles la moyenne doit le dépasser, ou, pour Status, durée de la panne
# avant l'alerte (5 min : un redémarrage de mises à jour passe sans bruit).
# Disk prend la partition la plus pleine (racine et EXTRA_FILESYSTEMS).
# S.M.A.R.T. (WARNING/FAILED) n'en demande aucune : Beszel prévient d'office
# chaque utilisateur du système.
beszel_alerts_temperature_systems: [nas, pi, pve]
beszel_alerts:
  - { name: Status, value: 0, min: 5 }
  - { name: CPU, value: 90, min: 10 }
  - { name: Memory, value: 90, min: 10 }
  - { name: Disk, value: 85, min: 10 }
  - { name: Temperature, value: 80, min: 10, systems: "{{ beszel_alerts_temperature_systems }}" }

# Canaux du compte (user_settings), en URLs shoutrrr. Telegram depuis les clés
# sops beszel_telegram_bot_token et beszel_telegram_chat_id ; sans elles, les
# canaux restent tels quels (avertissement) et seules les alertes sont posées.
# L'e-mail du compte reste un canal (le SMTP Infomaniak est réglé dans
# l'interface du hub) : [] pour Telegram seul.
beszel_alerts_telegram_url: >-
  {{ ('telegram://' ~ beszel_telegram_bot_token ~ '@telegram?chats=' ~ beszel_telegram_chat_id)
  if (beszel_telegram_bot_token | default('') | length > 0
      and beszel_telegram_chat_id | default('') | string | length > 0)
  else '' }}
beszel_alerts_webhooks: >-
  {{ [beszel_alerts_telegram_url] if beszel_alerts_telegram_url | length > 0 else [] }}
beszel_alerts_emails: ["{{ beszel_admin_email }}"]

# Superuser PocketBase du widget Beszel de Homepage (tasks/homepage_superuser.yml) :
# le widget (version 2) se connecte par collections/_superusers, en dur dans
# Homepage 2.7.0 (src/widgets/beszel/widget.js, mapping authv2) : un compte
# utilisateur ne lui suffit pas. Un compte à lui, pour que son mot de passe,
# écrit dans la configuration de Homepage, ne soit pas celui de
# l'administrateur. Créé (ou son mot de passe remis) par `beszel superuser
# upsert` dans le conteneur quand son mot de passe est refusé ; adresse vide
# ou clé sops absente : rien n'est fait. Un compte créé ainsi est retiré à la
# main (interface PocketBase /_/), jamais par le rôle.
# Jamais bloquant : un échec avertit et pose beszel_homepage_account_ready à
# false, et le rôle homepage omet alors le widget pour ce run.
# Le réseau du widget (beszel_homepage_network, _subnet, _hub_ip, _client_ip)
# est dans host_vars/docker : le rôle homepage le lit aussi.
beszel_homepage_email: ""
beszel_homepage_password: "{{ homepage_beszel_password | default('') }}"
beszel_homepage_enabled: "{{ beszel_homepage_email | length > 0 and beszel_homepage_password | length > 0 }}"
beszel_superuser_command: [docker, exec, beszel, /beszel, superuser]

# Borgmatic backup configuration
beszel_backup_enabled: true
beszel_backup_borgmatic_target: "{{ backup_storage_box_url }}/beszel"
beszel_backup_encryption_passphrase: "{{ backup_passphrase }}"
beszel_backup_healthcheck_url: ""

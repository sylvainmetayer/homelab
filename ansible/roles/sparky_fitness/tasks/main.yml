---
- name: Ensure Sparky Fitness app folders exist
  loop:
    - "{{ sparky_fitness_base_path }}"
    - "{{ sparky_fitness_base_path }}/postgresql"
    - "{{ sparky_fitness_base_path }}/backup"
    - "{{ sparky_fitness_base_path }}/uploads"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart sparky_fitness
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ sparky_fitness_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template environment configuration
  notify: Restart sparky_fitness
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ sparky_fitness_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration
- name: Configure borgmatic backup for Sparky Fitness
  when: sparky_fitness_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for Sparky Fitness
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-sparky_fitness.yaml.j2"
        dest: "{{ borgmatic_config_dir }}/sparky_fitness.yaml"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Initialize borg repository for Sparky Fitness
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic
          --config {{ borgmatic_config_dir }}/sparky_fitness.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: sparky_fitness_borg_repo_create
      changed_when: "'repository already exists' not in sparky_fitness_borg_repo_create.stderr"
      failed_when: >
        sparky_fitness_borg_repo_create.rc != 0 and
        'repository already exists' not in sparky_fitness_borg_repo_create.stderr

- name: Make sure sparky_fitness service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@sparky_fitness
    scope: user
    enabled: true

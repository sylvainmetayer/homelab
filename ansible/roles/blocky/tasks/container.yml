---
- name: Ensure the Blocky folder exists
  ansible.builtin.file:
    path: "{{ blocky_base_path }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0700"

# Copie des listes téléchargées, à l'utilisateur 100 de l'image (USER 100).
- name: Ensure the Blocky list cache folder belongs to the image user
  become: true
  ansible.builtin.file:
    path: "{{ blocky_base_path }}/cache"
    state: directory
    owner: "100"
    group: "100"
    mode: "0700"

# Lisible par l'utilisateur 100 du conteneur : rien de secret dedans.
- name: Template the Blocky configuration
  notify: Restart blocky
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ blocky_config_file }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644" # NOSONAR

- name: Template the Blocky compose configuration
  diff: false
  notify: Restart blocky
  ansible.builtin.template:
    src: compose.yaml
    dest: "{{ blocky_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Make sure the Blocky service is running
  ansible.builtin.systemd:
    name: "dc@{{ blocky_service }}"
    scope: user
    state: started
    enabled: true
    daemon_reload: true

---
betisier_base_path: "{{ docker_base_path }}/betisier"
betisier_domain: betisier.sylvain.cloud
betisier_db_password: ""
# URL push du moniteur « Reset Betisier » (sortie uptime_cron_betisier_reset_url
# de tofu/pangolin_config, lue par docker.yml) : betisier-reset.service y pousse
# après un reset réussi. Vide, il ne pousse rien.
betisier_reset_healthcheck_url: ""

# Borgmatic backup configuration
betisier_backup_enabled: true
betisier_backup_borgmatic_target: "{{ backup_storage_box_url }}/betisier"
betisier_backup_encryption_passphrase: "{{ backup_passphrase }}"
betisier_backup_healthcheck_url: ""

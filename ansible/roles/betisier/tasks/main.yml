---
- name: Ensure Betisier app folder exists
  loop:
    - "{{ betisier_base_path }}"
    - "{{ betisier_base_path }}/config"
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Get SQL dump
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/sylvainmetayer/docker-betisier-tp/refs/heads/master/betisier-mysql/betisier.sql"
    dest: "{{ betisier_base_path }}/dump.sql"
    mode: "0600"

- name: Template compose configuration
  diff: false
  notify: Restart betisier
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ betisier_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Make sure betisier service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@betisier
    scope: user
    enabled: true

- name: Template betisier-reset service
  ansible.builtin.template:
    src: "templates/betisier-reset.service.j2"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/betisier-reset.service"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  # Carries the push URL of the "Reset Betisier" monitor.
  diff: false
  # No app restart: this unit does not touch the app, and a new push URL
  # would otherwise restart betisier for nothing.
  notify: Reload systemd user

- name: Template betisier-reset timer
  ansible.builtin.template:
    src: "templates/betisier-reset.timer.j2"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/betisier-reset.timer"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  notify: Reload systemd user

- name: Enable and start betisier-reset timer
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: betisier-reset.timer
    scope: user
    enabled: true

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Betisier
  when: betisier_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: betisier
    borgmatic_app_title: Betisier
    borgmatic_app_target: "{{ betisier_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ betisier_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ betisier_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ betisier_base_path }}/config"
      - "{{ betisier_base_path }}/dump.sql"
      - "{{ betisier_base_path }}/compose.yaml"
    borgmatic_app_mysql_databases:
      - container: betisier_db
        name: betisier
        username: betisier
        password: "{{ betisier_db_password }}"

# Rattrapage des volumes anonymes laissés par l'ancien reset (`down` sans
# `-v`). Ils ne portent aucun label de projet compose : on ne supprime qu'un
# volume anonyme, orphelin (dangling) et dont le contenu est celui de
# betisier_db (`databases/betisier` et `custom.cnf` de l'image linuxserver).
# Le volume de la base en cours est attaché, donc jamais dangling. Rien à
# supprimer : aucun changement. La liste est lue dans une variable : dans
# `for v in $(…)`, un échec de docker passerait sans erreur sous `set -e`.
# Un volume disparu entre la liste et l'inspect/rm (reset lancé en même temps,
# p. ex. par le premier start du timer) est ignoré au lieu d'échouer le
# déploiement.
- name: Remove the dangling anonymous volumes left by the betisier reset
  become: true
  register: betisier_orphan_volumes
  changed_when: betisier_orphan_volumes.stdout | length > 0
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      volumes=$(docker volume ls -q --filter dangling=true --filter label=com.docker.volume.anonymous)
      for v in $volumes; do
        d=$(docker volume inspect --format '{{ "{{.Mountpoint}}" }}' "$v" 2>/dev/null) || continue
        if [ -d "$d/databases/betisier" ] && [ -f "$d/custom.cnf" ]; then
          docker volume rm "$v" >/dev/null || continue
          echo "$v"
        fi
      done

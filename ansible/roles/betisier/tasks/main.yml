---
- name: Ensure Betisier app folder exists
  loop:
    - "{{ betisier_base_path }}"
    - "{{ betisier_base_path }}/config"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

# Sans checksum, get_url ne retélécharge jamais un dump.sql présent. Celui-ci
# est la version dont les comptes portent le hachage du mot de passe IUT avec
# le GRAIN_SEL du serveur. La base n'ayant pas de volume, le nouveau dump ne
# sert qu'au prochain chargement : le reset recrée les conteneurs.
- name: Get SQL dump
  notify: Reset betisier
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/sylvainmetayer/docker-betisier-tp/refs/heads/master/betisier-mysql/betisier.sql"
    dest: "{{ betisier_base_path }}/dump.sql"
    checksum: "sha256:aefcb819566cff2926cada7a80aeb625ea2718c1cd8760def36e97dad504d089"
    mode: "0644"

- name: Template compose configuration
  notify: Restart betisier
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ betisier_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Make sure betisier service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@betisier
    scope: user
    enabled: true

- name: Template betisier-reset service
  ansible.builtin.template:
    src: "templates/betisier-reset.service.j2"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/betisier-reset.service"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"
  notify:
    - Reload systemd user
    - Restart betisier

- name: Template betisier-reset timer
  ansible.builtin.template:
    src: "templates/betisier-reset.timer.j2"
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/betisier-reset.timer"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"
  notify: Reload systemd user

- name: Enable and start betisier-reset timer
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: betisier-reset.timer
    scope: user
    enabled: true

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Betisier
  when: betisier_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: betisier
    borgmatic_app_title: Betisier
    borgmatic_app_target: "{{ betisier_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ betisier_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ betisier_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ betisier_base_path }}/config"
      - "{{ betisier_base_path }}/dump.sql"
      - "{{ betisier_base_path }}/compose.yaml"
    borgmatic_app_mysql_databases:
      - container: betisier_db
        name: betisier
        username: betisier
        password: "{{ betisier_db_password }}"

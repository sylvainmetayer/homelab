---
services:
  betisier:
    # memory.peak à 25 Mio le 2026-10-29 (5 % des 512m d'alors) : 256m
    # laissent la marge d'une rafale php-fpm, la ressource est publique.
    mem_limit: 256m
    container_name: betisier
    networks:
      - newt
      - betisier
    image: ghcr.io/sylvainmetayer/betisier-tp:latest@sha256:62561012a5f372f2098bc7818df1fbc5cf5554066b0261c1a49646a88cec6801
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
    volumes:
      - ./config:/config
    restart: unless-stopped
    depends_on:
      betisier_db:
        condition: service_healthy

  betisier_db:
    mem_limit: 512m
    mem_reservation: 192m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    networks:
      - betisier
    image: lscr.io/linuxserver/mariadb:11.8.9@sha256:dfd0f601cedf95381781c1b9b27424c608a78ddd97faa484da678873240f65e6
    container_name: betisier_db
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
      - MYSQL_ROOT_PASSWORD={{ betisier_db_password }}
      - MYSQL_DATABASE=betisier
      - MYSQL_USER=betisier
      - MYSQL_PASSWORD={{ betisier_db_password }}
    volumes:
      # No DB volume, since we want to reset database on restart
      - ./dump.sql:/config/initdb.d/betisier.sql:ro
    restart: unless-stopped
    # Pas de healthcheck.sh dans l'image linuxserver (cf. rôle wiki) :
    # `mariadb-admin ping` sort en 0 dès que le serveur répond. Le dump est
    # chargé (--init-file) avant que le serveur d'initialisation n'écoute.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

# `internal: true` : pas de sortie vers Internet par ce réseau. betisier la garde
# par newt ; la base n'en a pas besoin.
networks:
  betisier:
    internal: true
  newt:
    external: true

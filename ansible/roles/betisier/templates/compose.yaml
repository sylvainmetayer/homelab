---
services:
  betisier:
    mem_limit: 512m
    container_name: betisier
    networks:
      - newt
      - betisier
    image: ghcr.io/sylvainmetayer/betisier-tp:latest@sha256:083bdcae175dbbe2d131d0b1fd60ff4d77004f124c671033db478a90e542ad00
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
    volumes:
      - ./config:/config
    restart: unless-stopped
    depends_on:
      betisier_db:
        condition: service_healthy

  betisier_db:
    mem_limit: 512m
    mem_reservation: 192m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    networks:
      - betisier
    image: lscr.io/linuxserver/mariadb:11.8.8@sha256:fb38247d1a4440239b2c62f0084c5285302715777268a92f61f77406dbc3552e
    container_name: betisier_db
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
      - MYSQL_ROOT_PASSWORD={{ betisier_db_password }}
      - MYSQL_DATABASE=betisier
      - MYSQL_USER=betisier
      - MYSQL_PASSWORD={{ betisier_db_password }}
    volumes:
      # No DB volume, since we want to reset database on restart
      - ./dump.sql:/config/initdb.d/betisier.sql:ro
    restart: unless-stopped
    # Pas de healthcheck.sh dans l'image linuxserver (cf. rôle wiki) :
    # `mariadb-admin ping` sort en 0 dès que le serveur répond. Le dump est
    # chargé (--init-file) avant que le serveur d'initialisation n'écoute.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  betisier:
  newt:
    external: true

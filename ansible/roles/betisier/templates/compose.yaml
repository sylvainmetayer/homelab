---
services:
  betisier:
    mem_limit: 512m
    container_name: betisier
    security_opt:
      - no-new-privileges:true
    networks:
      - {{ betisier_newt_network }}
      - betisier
    image: ghcr.io/sylvainmetayer/betisier-tp:latest@sha256:8732f3365c7065e9b94587b5bef7a439caa438bc3206dec71eaff97308f89ef9
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
    volumes:
      - ./config:/config
    restart: unless-stopped
    depends_on:
      betisier_db:
        condition: service_healthy
    # nginx et php-fpm sous s6 : même sonde TCP que le rôle wiki, qui dit pourquoi.
    # Rien n'attend ce service : rouge, la sonde n'arrête ni ne relance rien.
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 80 && nc -z -w 3 127.0.0.1 9000"]
      interval: 60s
      start_interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s

  betisier_db:
    # Le tmpfs de /config compte ici : ~160 Mio écrits (redo log 96, ibdata1,
    # ibtmp1, undo) + ~146 Mio d'anon (ADR 0033) = ~310 Mio de pic, ×2.
    mem_limit: 640m
    mem_reservation: 320m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    networks:
      - betisier
    image: lscr.io/linuxserver/mariadb:11.8.9@sha256:cc9c523dead7690487d5892419b5c513c78bf398fe03b115e43a652ab75a237c
    container_name: betisier_db
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID={{ ansible_facts['user_uid'] }}
      - PGID={{ ansible_facts['user_gid'] }}
      - TZ=Europe/Paris
      - MYSQL_ROOT_PASSWORD={{ betisier_db_password }}
      - MYSQL_DATABASE=betisier
      - MYSQL_USER=betisier
      - MYSQL_PASSWORD={{ betisier_db_password }}
    # Base jetable, rechargée du dump à chaque démarrage : /config (base, conf,
    # journaux) en mémoire, pas sur le SSD ni sous /var/lib/docker/volumes
    # (auditd). Sans lui l'image y créerait un volume anonyme (VOLUME /config).
    # size : 160 Mio utilisés après chargement (redo log de 96 Mio, mesuré),
    # plafond à 256 ; mode 0755 : l'image rend /config à PUID:PGID elle-même.
    tmpfs:
      - /config:rw,nosuid,nodev,noexec,mode=0755,size=256m
    volumes:
      # Monté sur le tmpfs (Docker monte /config avant /config/initdb.d). Le
      # chown final de l'image échoue sur ce fichier en lecture seule : sans suite.
      - ./dump.sql:/config/initdb.d/betisier.sql:ro
    restart: unless-stopped
    # Pas de healthcheck.sh dans l'image linuxserver (cf. rôle wiki) :
    # `mariadb-admin ping` sort en 0 dès que le serveur répond. Le dump est
    # chargé (--init-file) avant que le serveur d'initialisation n'écoute.
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

# `internal: true` : pas de sortie vers Internet par ce réseau. betisier la garde
# par newt ; la base n'en a pas besoin.
networks:
  betisier:
    internal: true
  {{ betisier_newt_network }}:
    external: true

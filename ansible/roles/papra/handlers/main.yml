---
- name: Restart papra
  ansible.builtin.systemd:
    name: dc@papra
    scope: user
    state: restarted

# Un OnCalendar modifié ne s'applique qu'au redémarrage du timer. Pas en
# --check si l'unité vient d'être posée : elle n'existe pas encore.
- name: Restart papra-intake timer
  become: true
  when: not (ansible_check_mode and papra_intake_units is changed)
  ansible.builtin.systemd:
    name: papra-intake.timer
    state: restarted
    daemon_reload: true

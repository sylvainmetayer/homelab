---
# Papra, l'appli de documents (a remplacé Paperless-ngx) : un seul
# conteneur Node, base SQLite et fichiers sous app-data/, sur le disque
# local de la VM.
papra_base_path: "{{ docker_base_path }}/papra"
papra_domain: papra.sylvain.cloud

# Inscription libre fermée. Le premier compte (admin, AUTH_FIRST_USER_AS_ADMIN)
# se crée en la rouvrant le temps d'un passage,
#   ansible-playbook docker.yml --tags papra -e papra_registration_enabled=true
# puis « S'inscrire » sur https://papra.sylvain.cloud (derrière le SSO), puis
# le même passage sans le -e, qui la referme. Chaque compte suivant se crée de
# la même façon : Papra n'a ni commande ni écran d'admin pour en créer, et
# l'inscription fermée ne fait pas d'exception pour un invité. Une invitation
# ajoute ensuite un compte existant à l'organisation (l'e-mail d'invitation
# part par le relais SMTP Infomaniak).
papra_registration_enabled: false

# Connexion par Pocket ID (tofu/pangolin_config/pocket_id.tf, client papra),
# rendue seulement quand l'émetteur, l'identifiant et le secret sont dans le
# state. Le mot de passe reste (secours, clés d'API). better-auth lie un
# compte existant par e-mail vérifié ; l'inscription fermée l'empêche d'en
# créer un au premier login.
papra_oidc_client_id: "{{ terraform_outputs.pocket_id_papra_client_id.value | default('') }}"
papra_oidc_client_secret: "{{ terraform_outputs.pocket_id_papra_client_secret.value | default('') }}"
papra_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
papra_oidc_enabled: "{{ papra_oidc_client_id | length > 0 and papra_oidc_client_secret | length > 0 and papra_oidc_issuer | length > 0 }}"
# Clé virtuelle papra de la passerelle IA de Pangolin
# (tofu/pangolin_config/ai_gateway.tf), format OpenAI. Elle ne sert qu'au
# remplissage par l'IA ci-dessous : le module IA de Papra reste coupé
# (README). Vide (pas de state, copie d'exercice) : remplissage retiré.
papra_ai_api_key: "{{ (terraform_outputs.ai_gateway_keys.value | default({})).papra | default('') }}"
papra_ai_base_url: https://ia.sylvain.cloud/v1
papra_ai_model: claude-haiku-5-5

# Langues de l'OCR (Tesseract, tesseract.js dans l'image), codes Tesseract.
papra_ocr_languages:
  - fra
  - eng

# Dossier surveillé : un fichier posé dans ingestion/<id d'organisation>/
# (org_..., lu dans l'URL de Papra) est importé puis supprimé ; un échec le
# range dans ingestion/<id>/ingestion-error/. Les fichiers hors d'un dossier
# d'organisation sont ignorés.
papra_ingestion_enabled: true

# Taille maximale d'un document envoyé, en octets (défaut de Papra : 25 Mo).
papra_max_upload_size: 26214400

# Jours de conservation d'un document supprimé dans la corbeille avant la
# purge nocturne (défaut de Papra : 30) : trois mois pour rattraper une
# suppression par erreur.
papra_deleted_documents_retention_days: 90

# Secret de session (Better Auth), au moins 32 caractères. Dérivé de
# backup_passphrase comme les clés de TREK et Homebox : pas de clé SOPS. Le
# changer déconnecte tout le monde.
papra_auth_secret: "{{ (backup_passphrase ~ '-papra-auth-secret') | hash('sha256') }}"

# Relève par e-mail (tasks/intake.yml, files/papra_intake.py) : toutes les
# 15 minutes, un script lit en IMAPS une adresse Infomaniak dédiée et dépose
# les pièces jointes des expéditeurs autorisés dans ingestion/<organisation>/.
# Aucun relais tiers. Désactivée tant que l'identifiant et le mot de passe
# d'application (clés SOPS papra_intake_imap_user et
# papra_intake_imap_password, lues telles quelles, sans variable du rôle du
# même nom) et la liste des expéditeurs ne sont pas posés : à false, le timer
# et la configuration sont retirés. Procédure : README.md du rôle.
papra_intake_enabled: false
papra_intake_imap_host: mail.infomaniak.com
papra_intake_imap_port: 993
# Dossier relevé, et ceux où partent les messages traités et refusés (créés
# au besoin ; « / » sépare les niveaux, quel que soit le séparateur du
# serveur). Rien n'est jamais supprimé de la boîte.
papra_intake_imap_folder: INBOX
papra_intake_done_folder: Papra/Importé
papra_intake_rejected_folder: Papra/Refusé
# Expéditeurs (From) acceptés : adresse exacte, ou domaine (« @exemple.fr »).
# Les autres messages vont, intacts, dans papra_intake_rejected_folder. Le
# From se falsifie : l'adresse de relève elle-même reste à garder pour soi.
papra_intake_allowed_senders: []
# Organisation Papra destinataire (org_..., lu dans l'URL de Papra).
papra_intake_organization_id: org_z9tq7wl3o5airawxel6f3e5i
# Extensions retenues (PDF, images, bureautique, texte) ; les autres pièces
# jointes sont ignorées. Taille maximale : papra_max_upload_size.
papra_intake_extensions:
  - pdf
  - png
  - jpg
  - jpeg
  - webp
  - gif
  - tif
  - tiff
  - heic
  - txt
  - md
  - csv
  - rtf
  - doc
  - docx
  - odt
  - xls
  - xlsx
  - ods
  - ppt
  - pptx
  - odp
# Import du mail lui-même, à la demande : un message autorisé dont l'objet
# commence par ce marqueur (casse ignorée, après d'éventuels « Fwd: »,
# « TR: », « RE: ») dépose aussi « <date> - <objet>.txt » (en-têtes et corps
# en texte, pour la recherche et les règles de Papra) et l'original en .eml
# (la preuve), hors de papra_intake_extensions, chacun sous
# papra_max_upload_size. Vide : jamais.
papra_intake_body_marker: "[mail]"
papra_intake_schedule: "*:0/15"
# Compte de l'unité : celui du conteneur (user: du compose), pour que Papra
# puisse lire puis supprimer les fichiers déposés.
papra_intake_service_user: "{{ ansible_user }}"

# Remplissage par l'IA (tasks/enrich.yml, files/papra_enrich.py) : Montant,
# Fin de validité et tags des documents, toutes les heures, par lots. Installé
# seulement quand la clé SOPS papra_enrich_api_key (clé d'API Papra :
# documents:read, documents:update, tags:read, custom-properties:read ; lue
# telle quelle, aucune variable du rôle ne porte son nom) et la clé de la
# passerelle sont là ; sinon retiré. Procédure : README.md du rôle.
papra_enrich_enabled: "{{ papra_enrich_api_key | default('') | length > 0 and papra_ai_api_key | length > 0 }}"
# Un document portant l'un de ces tags ne part jamais au modèle. Un tag de la
# liste introuvable dans Papra arrête tout passage avant envoi : le créer
# d'abord (et sa règle de classement).
papra_enrich_excluded_tags:
  - Sante
  - Identite
  - Banque-Finances
  - Impots
  - Travail-RH
# Marque des documents traités (tag à créer dans Papra), jamais retraités.
papra_enrich_done_tag: IA-faite
# Propriétés personnalisées remplies (nombre, date), seulement vides.
papra_enrich_amount_property: Montant
papra_enrich_expiry_property: Fin de validité
# Documents envoyés au modèle par passage (~3 650 tokens chacun, mesure du
# 2026-11-10) ; l'arriéré (~400) passe en une vingtaine d'heures.
papra_enrich_batch_size: 20
# Texte envoyé tronqué à max_chars caractères ; au-delà de skip_chars, le
# document est sauté (un manuel, pas une facture).
papra_enrich_max_chars: 12000
papra_enrich_skip_chars: 100000
papra_enrich_schedule: "*:20"
papra_enrich_organization_id: "{{ papra_intake_organization_id }}"

# Borgmatic backup configuration
papra_backup_enabled: true
papra_backup_borgmatic_target: "{{ backup_storage_box_url }}/papra"
papra_backup_encryption_passphrase: "{{ backup_passphrase }}"
papra_backup_healthcheck_url: ""

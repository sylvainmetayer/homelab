---
# Le conteneur tourne avec l'uid/gid de l'utilisateur hôte (user: du
# compose) : ses dossiers sont à lui, et un fichier qu'il pose dans ingestion/
# peut être lu puis supprimé par Papra sans sudo.
- name: Ensure Papra app folders exist
  loop:
    - "{{ papra_base_path }}"
    - "{{ papra_base_path }}/app-data"
    - "{{ papra_base_path }}/app-data/db"
    - "{{ papra_base_path }}/app-data/documents"
    - "{{ papra_base_path }}/ingestion"
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  diff: false
  notify: Restart papra
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ papra_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template environment configuration
  diff: false
  notify: Restart papra
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ papra_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml). Les bases
# SQLite (app-data/db/db.sqlite et la file des tâches tasks.sqlite, créées au
# premier démarrage : présentes dans la configuration à partir du passage
# suivant) sont copiées par le hook du rôle borgmatic ; les
# originaux (app-data/documents/<org>/<nom>, ou <org>/originals/<id> pour
# ceux d'avant le nommage par nom, templates/env.j2) partent tels quels.
# ingestion/ n'est qu'un sas, vidé à chaque import.
- name: Configure borgmatic backup for Papra
  when: papra_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: papra
    borgmatic_app_title: Papra
    borgmatic_app_target: "{{ papra_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ papra_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ papra_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ papra_base_path }}/app-data"
      - "{{ papra_base_path }}/compose.yaml"
      - "{{ papra_base_path }}/.env"
    borgmatic_app_sqlite_databases:
      - "{{ papra_base_path }}/app-data/db/*.sqlite"

- name: Make sure papra service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@papra
    scope: user
    enabled: true

# Relève par e-mail (defaults, papra_intake_*) : installée ou retirée.
- name: Configure the Papra mail intake
  ansible.builtin.import_tasks: intake.yml

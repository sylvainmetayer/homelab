---
- name: Install zram-tools
  become: true
  ansible.builtin.apt:
    name: zram-tools
    state: present

- name: Configure zram swap
  become: true
  notify: Restart zramswap
  ansible.builtin.template:
    src: zramswap.j2
    dest: /etc/default/zramswap
    owner: root
    group: root
    mode: "0640"

# Le postinst du paquet démarre le service avec sa config par défaut (50 % de
# la RAM) avant que notre template soit en place, et un simple restart ne
# retaille pas un device zram déjà initialisé. On compare donc la taille live
# à la config et on force le handler si elles divergent (device absent = 0,
# donc divergent aussi : le handler recrée le device).
- name: Read live zram device size
  ansible.builtin.command:
    cmd: cat /sys/block/zram0/disksize
  register: host_tuning_zram_live_size
  changed_when: false
  failed_when: false

- name: Flag zram swap for a resize when the live size differs from the configuration
  ansible.builtin.command:
    cmd: /bin/true
  changed_when: (host_tuning_zram_live_size.stdout | default('0') | int) != (host_tuning_zram_size_mb | int) * 1048576
  notify: Restart zramswap

# Le handler doit passer *avant* le `state: started` ci-dessous : sur un device
# cassé, `systemctl start zramswap` échoue et ferait planter le rôle.
- name: Apply zram changes now
  ansible.builtin.meta: flush_handlers

- name: Enable zram swap service
  become: true
  ansible.builtin.systemd:
    name: zramswap
    enabled: true
    state: started

- name: Configure the disk overflow swap
  when: host_tuning_disk_swap_size_mb | int > 0
  become: true
  block:
    - name: Install dphys-swapfile
      ansible.builtin.apt:
        name: dphys-swapfile
        state: present

    # CONF_MAXSWAP plafonne CONF_SWAPSIZE : les deux suivent la variable.
    - name: Set the disk swap size
      notify: Restart dphys-swapfile
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: "^#?\\s*{{ item }}="
        line: "{{ item }}={{ host_tuning_disk_swap_size_mb | int }}"
      loop:
        - CONF_SWAPSIZE
        - CONF_MAXSWAP

    # started, jamais restarted : un restart ferait un swapoff du fichier. Une
    # taille changée passe par le handler, en fin de play (le postinst a déjà
    # démarré le service à sa taille par défaut sur une installation neuve).
    - name: Enable the disk swap service
      ansible.builtin.systemd:
        name: dphys-swapfile
        enabled: true
        state: started

# Pi : le firmware y ajoute cgroup_disable=memory devant cmdline.txt ;
# cgroup_enable=memory, placé après, le réactive (#846).
- name: Configure the kernel command line
  when: host_tuning_kernel_cmdline_params | length > 0
  become: true
  block:
    - name: Read the kernel command line file
      ansible.builtin.slurp:
        src: "{{ host_tuning_kernel_cmdline_path }}"
      register: host_tuning_cmdline_file

    # Le firmware ne lit que la première ligne : une seconde ligne (ou un
    # fichier vide) veut dire qu'on ne sait pas ce qu'on édite.
    - name: Assert the kernel command line is a single line
      ansible.builtin.assert:
        that:
          - (host_tuning_cmdline_file.content | b64decode | trim) | length > 0
          - "'\n' not in (host_tuning_cmdline_file.content | b64decode | trim)"
        fail_msg: "{{ host_tuning_kernel_cmdline_path }} n'est pas une ligne unique : rien n'est modifié"

    # Ajout en fin de ligne, seulement si le paramètre n'y est pas déjà (mot
    # entier) ; le saut de ligne final éventuel disparaît, comme le laisse
    # Raspberry Pi OS.
    - name: Append the missing kernel parameters
      notify: Flag a reboot for the kernel command line
      ansible.builtin.replace:
        path: "{{ host_tuning_kernel_cmdline_path }}"
        regexp: '\A(?!.*(?<!\S){{ item | regex_escape }}(?!\S))(.*?)\s*\Z'
        replace: '\1 {{ item }}'
      loop: "{{ host_tuning_kernel_cmdline_params }}"

- name: Ensure journald drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Keep journald on disk, capped
  become: true
  notify:
    - Restart journald
    - Flush journald to disk
  ansible.builtin.template:
    src: journald-size.conf.j2
    dest: /etc/systemd/journald.conf.d/50-size.conf
    owner: root
    group: root
    mode: "0640"

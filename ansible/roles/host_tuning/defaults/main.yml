---
# Swap compressé en RAM (zram). Filet de sécurité contre l'overcommit : la
# somme des pics mémoire des conteneurs approche la RAM de la VM, et sans swap
# un débordement fait tuer un conteneur au hasard par l'OOM killer de l'hôte.
# zram évite d'écrire sur le disque (rotatif) de la VM.
host_tuning_zram_size_mb: 2048
host_tuning_zram_algo: zstd
host_tuning_zram_priority: 100

# Swap disque de débordement (dphys-swapfile, /var/swap), derrière zram : sa
# priorité par défaut (négative) le fait servir seulement une fois zram plein.
# 0 = le rôle n'y touche pas. Changer la taille recrée le fichier (handler :
# swapoff, setup, swapon) ; à taille inchangée, rien n'est redémarré.
host_tuning_disk_swap_size_mb: 0

# `docker compose up` attaché envoie tous les logs de conteneur dans journald,
# qui grossit sans limite (3,6 Go constatés).
host_tuning_journald_system_max_use: 500M

# Paramètres ajoutés à la ligne de commande du noyau d'un Raspberry Pi
# (host_tuning_kernel_cmdline_path : une seule ligne, que le firmware ajoute
# après ses propres paramètres). Vide = le rôle n'y touche pas (tous les hôtes
# sauf le Pi). Un paramètre absent est ajouté en fin de ligne, le reste n'est
# pas modifié. Effet au prochain démarrage seulement : tant que /proc/cmdline
# ne les a pas tous, le rôle pose /var/run/reboot-required, que
# unattended-upgrades honore (rôle security, Automatic-Reboot à
# security_unattended_reboot_time). Le rôle ne redémarre jamais l'hôte
# lui-même.
host_tuning_kernel_cmdline_params: []
host_tuning_kernel_cmdline_path: /boot/firmware/cmdline.txt

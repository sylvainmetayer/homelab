---
# Swap compressé en RAM (zram). Filet de sécurité contre l'overcommit : la
# somme des pics mémoire des conteneurs approche la RAM de la VM, et sans swap
# un débordement fait tuer un conteneur au hasard par l'OOM killer de l'hôte.
# zram évite d'écrire sur le disque (rotatif) de la VM.
host_tuning_zram_size_mb: 2048
host_tuning_zram_algo: zstd
host_tuning_zram_priority: 100

# `docker compose up` attaché envoie tous les logs de conteneur dans journald,
# qui grossit sans limite (3,6 Go constatés).
host_tuning_journald_system_max_use: 500M

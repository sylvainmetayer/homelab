---
# `zramswap stop` fait `modprobe -r zram`, qui échoue ("module in use") juste
# après le swapoff, et le `start` qui suit ne peut plus écrire disksize sur un
# device encore initialisé : la taille ne change jamais. On vide donc le device
# via sysfs (pas `zramctl --reset`, qui supprime carrément /dev/zram0 sur les
# util-linux récents, et `zramswap start` ne le recrée pas tant que le module
# est chargé : d'où la branche de secours qui décharge le module).
- name: Restart zramswap
  become: true
  ansible.builtin.shell: |
    set -e
    systemctl stop zramswap || true
    if [ -b /dev/zram0 ]; then
      swapoff /dev/zram0 2>/dev/null || true
      echo 1 > /sys/block/zram0/reset
    else
      modprobe -r zram || true
    fi
    systemctl start zramswap
  changed_when: true

# Restart = swapoff, puis setup (recrée /var/swap à la nouvelle taille) et
# swapon. Seulement quand la taille configurée change.
- name: Restart dphys-swapfile
  become: true
  ansible.builtin.systemd:
    name: dphys-swapfile
    state: restarted

- name: Restart journald
  become: true
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

# Après un passage de volatile à persistent, journald reste dans /run jusqu'au
# prochain démarrage (systemd-journal-flush) : le flush l'envoie sur disque
# tout de suite. Sans effet quand il y écrivait déjà.
- name: Flush journald to disk
  become: true
  ansible.builtin.command: journalctl --flush
  changed_when: true

# Le fichier que posent les paquets du noyau : unattended-upgrades le cherche à
# chaque passage, même sans paquet à installer, et lance alors `shutdown -r
# <Automatic-Reboot-Time>`. /run est un tmpfs : le redémarrage l'efface.
- name: Flag a reboot for the kernel command line
  become: true
  ansible.builtin.copy:
    dest: /var/run/reboot-required
    content: "*** System restart required ***\n"
    owner: root
    group: root
    mode: "0644"

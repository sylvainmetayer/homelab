---
promptoramix_base_path: "{{ docker_base_path }}/promptoramix"

# Secret HMAC partagé avec la plateforme Linkx : l'application rejette toute
# requête dont la signature ne correspond pas. C'est sa seule protection, la
# ressource Pangolin étant ouverte à tous (tofu/pangolin_config/website_promptoramix.tf).
# Sensitive: must be set in secrets/ansible.sops.yaml
promptoramix_linkx_secret: ""

# Fils de recherche par requête. Deux requêtes au plus en parallèle sur les
# 2 vCPU de flip (cx23) : un fil chacune.
promptoramix_linkx_threads: 1
# Marge retirée du délai de 6 s de la plateforme avant de répondre : la sonde
# mesure 100 à 200 ms d'aller-retour, et le serveur garde un filet à la moitié
# de la marge. 800 ms laissent 5,2 s de réflexion (réponse vue à ~5,4 s).
promptoramix_linkx_margin_ms: 800

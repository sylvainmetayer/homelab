---
homebox_base_path: "{{ docker_base_path }}/homebox"
homebox_domain: homebox.sylvain.cloud
# Utilisateur de l'image -rootless (nonroot, Dockerfile.rootless) : l'image
# ne lit ni PUID ni PGID, data/ lui appartient (tasks/main.yml).
homebox_uid: 65532
homebox_gid: 65532

# Inscription libre fermée. Homebox n'a pas de commande pour créer un compte
# (la seule est `reset-password`) et son inscription ne fait aucune exception
# pour le premier compte : on la rouvre le temps de le créer,
#   ansible-playbook docker.yml --tags homebox -e homebox_allow_registration=true
# puis « Register » sur https://homebox.sylvain.cloud (derrière le SSO), puis
# le même passage sans le -e, qui la referme. Les comptes suivants passent par
# une invitation du groupe, acceptée même inscription fermée.
homebox_allow_registration: false

# Taille maximale (Mo) d'une pièce jointe (photo, facture, notice).
homebox_max_upload_size: 25
# Temps maximal pour lire une requête entière, son corps compris (durée Go) :
# celui d'un envoi de homebox_max_upload_size sur une connexion lente
# (templates/env.j2).
homebox_read_timeout: 5m

# Clé HMAC des empreintes de clés d'API (au moins 32 octets, sinon Homebox
# refuse de démarrer). La changer invalide toutes les clés d'API émises.
homebox_api_key_pepper: "{{ (backup_passphrase ~ '-homebox-api-key-pepper') | hash('sha256') }}"

# Connexion OIDC par Pocket ID (pilote, ADR 0030, docs/runbooks/pocket-id.md).
# Le client est déclaré par tofu/pangolin_config/pocket_id.tf ; ses sorties
# arrivent par terraform_outputs (pré-tâches communes des playbooks). Rendue
# seulement quand elles existent (après l'apply) : sans elles, rien ne change. Le login local RESTE ouvert
# (homebox_oidc_allow_local_login) : le secours si l'IdP tombe. Retour arrière :
# retirer les clés (ou enabled à false), redéployer.
homebox_oidc_client_id: "{{ terraform_outputs.pocket_id_homebox_client_id.value | default('') }}"
homebox_oidc_client_secret: "{{ terraform_outputs.pocket_id_homebox_client_secret.value | default('') }}"
homebox_oidc_enabled: "{{ homebox_oidc_client_id | length > 0 and homebox_oidc_client_secret | length > 0 }}"
homebox_oidc_issuer_url: https://id.sylvain.cloud
homebox_oidc_allow_local_login: true

# Borgmatic backup configuration
homebox_backup_enabled: true
homebox_backup_borgmatic_target: "{{ backup_storage_box_url }}/homebox"
homebox_backup_encryption_passphrase: "{{ backup_passphrase }}"
homebox_backup_healthcheck_url: ""

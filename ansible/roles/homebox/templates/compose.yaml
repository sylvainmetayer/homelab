---
services:
  app:
    # Pas encore mesuré : un binaire Go (API et interface Nuxt embarquée),
    # base SQLite, miniatures générées à l'envoi d'une image. À recaler sur
    # memory.peak après quelques jours.
    mem_limit: 512m
    # Variante -rootless : l'image normale tourne en root, la -hardened
    # (distroless) n'a pas le wget du healthcheck.
    image: ghcr.io/sysadminsmedia/homebox:0.27.1-rootless@sha256:6bb4472e91d3084d292ce654772e26df765d01aa0d38aa7077a7bb07b7d44ac7
    container_name: homebox
    # Utilisateur 65532 sans capacité : il écoute sur 7745 et n'écrit que dans
    # /data, qui est à lui (tasks/main.yml).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # docker diff du 10/11/2026 : rien hors de /data, sauf un
    # ~/.cache/goimports vide dont l'absence ne gêne pas. Une pièce jointe
    # passe par la mémoire (seuil = homebox_max_upload_size) puis s'écrit
    # dans /data (no_tmp_dir, lu dans le code de la 0.27.1) ; /tmp ne sert
    # qu'à l'import d'une archive au-delà de 64 Mo (max_parse_memory) : Go
    # l'y écrirait entière, et le tmpfs de 64 Mo la refuserait.
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    env_file:
      - .env
    volumes:
      # homebox.db (SQLite), pièces jointes et miniatures.
      - ./data:/data
    restart: unless-stopped
    # La route de santé du HEALTHCHECK de l'image, qui répond sans compte.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7745/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Seul conteneur du projet : pas de réseau privé, newt suffit.
    networks:
      - newt

networks:
  newt:
    external: true

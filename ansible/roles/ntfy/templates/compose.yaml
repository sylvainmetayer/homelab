---
services:
  app:
    mem_limit: {{ ntfy_mem_limit }}
    image: docker.io/binwiederhier/ntfy:v2.37.1@sha256:a1dde1f3210b68ac0c29e53298c96a988d06c320d1201d72f3e8e224d1a546f3
    container_name: ntfy
    command: ["serve"]
    # Sous l'utilisateur de déploiement, sans capacité : il écoute sur
    # {{ ntfy_port }} (pas 80) et n'écrit que dans /var/lib/ntfy, qui est à lui.
    user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Recommandé par la documentation avec un healthcheck : récupère les wget
    # orphelins.
    init: true
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config/server.yml:/etc/ntfy/server.yml:ro
      # user.db et cache.db (SQLite), sur le disque local de la VM.
      - ./data:/var/lib/ntfy
    restart: unless-stopped
    # /v1/health répond sans compte, même en deny-all.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:{{ ntfy_port }}/v1/health | grep -Eq '\"healthy\" *: *true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Seul conteneur du projet : pas de réseau privé, newt suffit (il sort
    # aussi par là vers ntfy.sh, upstream-base-url).
    networks:
      - newt

networks:
  newt:
    external: true

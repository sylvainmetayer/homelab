---
ntfy_base_path: "{{ docker_base_path }}/ntfy"
ntfy_domain: ntfy.sylvain.cloud
# Port d'écoute dans le conteneur : la cible Pangolin (website_ntfy.tf).
ntfy_port: 8080

# Durée de vie des messages dans cache.db : ce que les applis rattrapent
# (since=, poll=1) après une coupure ou à la réception d'un poll_request.
# Le cache n'est pas sauvegardé (tasks/main.yml).
ntfy_cache_duration: 12h

# Relais vers ntfy.sh pour les notifications instantanées d'Android (FCM) et
# d'iOS (APNs) : ntfy.sh ne reçoit qu'un poll_request (identifiant du
# message, topic haché), le téléphone vient lire le message ici.
ntfy_upstream_base_url: https://ntfy.sh

# Comptes, droits et jetons : server.yml (auth-users, auth-access,
# auth-tokens), recréés à chaque démarrage ; détail dans README.md (« Droits »).
# Sylvain : sylvain:*:ro plus rw sur les topics de ntfy_publishers ; ne pas
# retirer le joker en lecture. Mot de passe : clé SOPS ntfy_sylvain_password,
# hash ntfy_sylvain_password_hash.
ntfy_admin_user: sylvain

# Un compte par producteur, en écriture seule sur son topic, avec un seul
# jeton d'accès (tk_ + 29 caractères). Son mot de passe ne sert pas : le hash
# ntfy_publisher_password_hash est celui d'un mot de passe tiré au hasard et
# jeté. Un jeton vide (sortie de state absente avant le premier apply de
# pangolin_config) retire le producteur, avec un avertissement.
#
# Les topics sont aussi ceux que tofu/pangolin_config ouvre sans SSO pour la
# publication (local.ntfy_publish_topics, website_ntfy.tf) : le test
# ntfy_topics_match_the_role de tofu/pangolin_config les compare à cette liste.
#
# Retirer un topic : fichiers à toucher et apply ciblé dans README.md
# (« Retirer un topic »).
ntfy_publishers:
  # Notification « ntfy » d'Uptime Kuma (website_ntfy.tf). Jeton : clé
  # ntfy_uptime_kuma_token de secrets/secrets.sops.yaml, que docker.yml lit
  # dans le state de pangolin_config (sortie ntfy_uptime_kuma_token).
  - name: uptime-kuma
    topic: uptime-kuma
    token: "{{ ntfy_uptime_kuma_token | default('') }}"
  # Scripts et tâches planifiées des hôtes (curl -H "Authorization: Bearer
  # …", rôle mem_report).
  - name: scripts
    topic: scripts
    token: "{{ ntfy_scripts_token | default('') }}"
  # Workflows GitHub Actions (renovate-digest.yaml, trivy.yaml) : leur propre
  # jeton, posé en secret d'environnement par tofu/github
  # (environnement ntfy-github d'environments.tf), pas celui des hôtes.
  - name: github
    topic: github
    token: "{{ ntfy_github_token | default('') }}"

# --- Alerte « aucun abonné » (ntfy-subscribers-check.timer) ------------------
# Détail dans README.md (« Alerte : aucun abonné »). Toutes les
# ntfy_subscribers_check_schedule, relit ntfy_subscribers_check_window_minutes
# de « Server stats » dans docker logs ntfy : up si au moins un abonné, down
# sinon, au moniteur « ntfy : abonnés » (cron_ntfy_subscribers.tf).
#
# URL push : sortie uptime_cron_ntfy_subscribers_url de pangolin_config, lue
# par docker.yml ; vide, la vérification tourne sans rien pousser.
ntfy_subscribers_check_push_url: ""
# Le test monitors_are_filed_and_alert de tofu/pangolin_config lit ce « *:0/N »
# : l'intervalle du moniteur vaut trois périodes.
ntfy_subscribers_check_schedule: "*:0/10"
# 8 h : un téléphone hors ligne une nuit n'alerte pas ; 8 h sans aucun abonné
# est un vrai souci. Les relevés sont au niveau INFO (log-level de server.yml).
ntfy_subscribers_check_window_minutes: 480
# Le compte du script (groupe docker en plus, pour docker logs), jamais root.
ntfy_subscribers_check_user: "{{ ansible_user }}"

# Pas encore mesuré : un binaire Go, deux bases SQLite, quelques connexions
# ouvertes (téléphone). À recaler sur memory.peak après quelques jours.
ntfy_mem_limit: 128m

# Borgmatic backup configuration
ntfy_backup_enabled: true
ntfy_backup_borgmatic_target: "{{ backup_storage_box_url }}/ntfy"
ntfy_backup_encryption_passphrase: "{{ backup_passphrase }}"
ntfy_backup_healthcheck_url: ""

# {{ ansible_managed }}
# Site MkDocs statique. Pangolin termine le TLS et passe le SSO avant d'arriver
# ici, par le réseau newt.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    # releases/current, lien vers la dernière version déposée par le rôle.
    root /srv/docs/current;
    index index.html;

    # /runbooks/crowdsec -> /runbooks/crowdsec/ en redirection relative :
    # absolue, elle pointerait sur http://<conteneur>:8080.
    absolute_redirect off;

    # Recherche (search_index.json) et pages pèsent : compressés pour le
    # téléphone.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

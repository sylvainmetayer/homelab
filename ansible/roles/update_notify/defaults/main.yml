---
# Mises à jour en attente sur un hôte que ni la CI ni unattended-upgrades ne
# mettent à jour : l'hôte Proxmox VE (pve.yml) et le NAS sous UGOS (nas.yml).
# Chaque semaine, update-notify.timer lance files/update_notify.py, qui liste
# sans rien installer et publie sur ntfy ; la procédure pour appliquer est
# docs/runbooks/mises-a-jour-proxmox-ugos.md.
#
# apt  : apt-get update puis simulation de dist-upgrade, sécurité d'abord,
#        priorité haute dès qu'une mise à jour de sécurité attend (Proxmox).
# ugos : UGOS ne publie aucune source lisible sans session de son interface
#        (ni flux de versions, ni API sans compte) : rappel mensuel avec la
#        version installée, et message de priorité haute quand elle a changé
#        (rejouer nas.yml). Le NAS.
update_notify_mode: apt

# Nom de l'hôte dans les titres des messages.
update_notify_host_label: "{{ inventory_hostname }}"

# Script et fichier d'environnement (0700 root). nas.yml les place sous
# docker_base_path, comme les autres fichiers du homelab sur le NAS.
update_notify_dir: /usr/local/lib/update-notify

# Topic scripts de ntfy (rôle ntfy, ntfy_publishers) : son jeton n'écrit que
# là. Publication JSON sur la racine (/), ouverte sans SSO comme /scripts
# (tofu/pangolin_config/website_ntfy.tf).
update_notify_ntfy_url: https://ntfy.sylvain.cloud
update_notify_ntfy_topic: scripts
update_notify_ntfy_token: "{{ ntfy_scripts_token | default('') }}"

# URL push du moniteur Uptime Kuma de l'hôte (sorties uptime_cron_*_updates_url
# de tofu/pangolin_config, lues par le playbook) : vide, rien n'est poussé.
update_notify_healthcheck_url: ""

# Une fois par semaine, le lundi matin : loin du pve-daily-update de Proxmox
# (nuit) qui verrouille aussi les listes d'apt. Le moniteur tolère un passage
# manqué (hôte éteint), pas deux (tofu/pangolin_config/cron_updates.tf).
update_notify_schedule: "Mon *-*-* 08:00:00"

---
# Somme des délais des étapes (defaults/main.yml), plus 30 min de marge pour
# les lectures de l'API et le nettoyage, et les étapes sans délai propre ici
# (démarrage, arrêt et destruction du LXC).
vzdump_restore_test_timeout_start_sec: >-
  {{ (vzdump_restore_test_lxc_restore_timeout | int)
     + (vzdump_restore_test_lxc_boot_timeout | int)
     + (vzdump_restore_test_vm_verify_timeout | int)
     + 1800 }}

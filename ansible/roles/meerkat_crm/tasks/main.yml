---
- name: Ensure Meerkat CRM app folder exists
  loop:
    - "{{ meerkat_crm_base_path }}"
    - "{{ meerkat_crm_base_path }}/data"
    - "{{ meerkat_crm_base_path }}/photos"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart meerkat_crm
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ meerkat_crm_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Template environment configuration
  notify: Restart meerkat_crm
  ansible.builtin.template:
    src: "templates/env.docker.j2"
    dest: "{{ meerkat_crm_base_path }}/.env.docker"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Meerkat CRM
  when: meerkat_crm_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: meerkat_crm
    borgmatic_app_title: Meerkat CRM
    borgmatic_app_target: "{{ meerkat_crm_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ meerkat_crm_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ meerkat_crm_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ meerkat_crm_base_path }}/data"
      - "{{ meerkat_crm_base_path }}/photos"
      - "{{ meerkat_crm_base_path }}/compose.yaml"
      - "{{ meerkat_crm_base_path }}/.env.docker"
    # SQLITE_DB_PATH de l'image : /app/data/meerkat.db.
    borgmatic_app_sqlite_databases:
      - "{{ meerkat_crm_base_path }}/data/*.db"

- name: Make sure meerkat_crm service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@meerkat_crm
    scope: user
    enabled: true

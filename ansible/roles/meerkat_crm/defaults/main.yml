---
meerkat_crm_base_path: "{{ docker_base_path }}/meerkat_crm"
meerkat_crm_domain: crm.sylvain.cloud
meerkat_crm_jwt_secret: ""
meerkat_crm_healthcheck_url: ""

# Borgmatic backup configuration
meerkat_crm_backup_enabled: true
meerkat_crm_backup_borgmatic_target: "{{ backup_storage_box_url }}/meerkat_crm"
meerkat_crm_backup_encryption_passphrase: "{{ backup_passphrase }}"
meerkat_crm_backup_healthcheck_url: ""

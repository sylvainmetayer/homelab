---
# Pocket ID, fournisseur d'identité OIDC (passkeys) sur la VM Pangolin, en
# pilote (docs/adr/0030-pocket-id-pilote.md). Rôle appliqué par pangolin.yaml
# APRÈS le rôle pangolin : son conteneur rejoint le réseau « pangolin » créé par
# la pile, où le Traefik de Pangolin l'atteint (routeur du rôle pangolin,
# pangolin_idp_host). Jamais une ressource Pangolin : derrière le mur SSO qu'il
# sert, personne ne pourrait se connecter.
pocket_id_base_path: /opt/pocket-id

# Nom d'hôte public (host_vars/pangolin : id.sylvain.cloud) : APP_URL, que les
# passkeys lient à ce domaine. Le changer rend les passkeys inutilisables.
pocket_id_host: ""

# Utilisateur du conteneur : sans privilège dès la première instruction
# (l'entrypoint de l'image n'a alors plus rien à faire, PUID/PGID ignorés) ;
# data/ lui appartient (tasks/main.yml).
pocket_id_uid: 65532
pocket_id_gid: 65532

# Bases GeoLite2 tenues à jour par le rôle pangolin (pangolin_geoip_dir,
# geoipupdate.service) : Pocket ID y lit GeoLite2-City, en lecture seule, pour
# les lieux approximatifs du journal d'audit. Sans le fichier, il n'affiche
# aucun lieu (avertissement au démarrage), sans autre effet.
pocket_id_geoip_dir: /opt/geoip

# Clé SOPS pocket_id_encryption_key (ansible.sops.yaml), générée par
# `openssl rand -base64 32`. Chiffre au repos les clés de signature des jetons.
# Sans elle, ou vide, le rôle ne rend rien (ni conteneur ni routeur) et le dit.
# La perdre, c'est perdre les clés de l'IdP : elle est aussi dans la sauvegarde
# (.env), donc la restauration d'une archive suffit.
pocket_id_enc_key: "{{ pocket_id_encryption_key | default('') }}"
pocket_id_enabled: "{{ pocket_id_enc_key | length > 0 }}"

# Clé SOPS pocket_id_static_api_key (ansible.sops.yaml, la même dans
# secrets.sops.yaml pour tofu/pangolin_config) : clé d'API administrateur
# fixe (STATIC_API_KEY), par laquelle Tofu déclare les clients OIDC et les
# groupes. Vide : pas de STATIC_API_KEY, Tofu ne peut plus rien gérer.
pocket_id_api_key: "{{ pocket_id_static_api_key | default('') }}"

# Réseaux de confiance pour X-Forwarded-For (TRUST_PROXY) : le Traefik de
# Pangolin, sur le réseau bridge « pangolin » (une plage 172.x choisie par
# Docker). Il retire tout X-Forwarded-* reçu du client avant d'écrire le sien.
pocket_id_trust_proxy: 172.16.0.0/12

# false : écrit les fichiers sans lancer `docker compose up` (Molecule : pas
# d'image tirée).
pocket_id_compose_up: true

# Borgmatic backup configuration (SQLite par le gabarit partagé)
pocket_id_backup_enabled: true
pocket_id_backup_borgmatic_target: "{{ backup_storage_box_url }}/pocket_id"
pocket_id_backup_encryption_passphrase: "{{ backup_passphrase }}"
pocket_id_backup_healthcheck_url: ""

# Configuration applicative (« Application Configuration ») tenue par l'env :
# UI_CONFIG_DISABLED=true, la page passe en lecture seule et tout réglage non
# déclaré ici revient au défaut de Pocket ID. Noms lus dans le code de la
# v2.19.1 (appconfig/model.go), la doc des variables est en retard : à revoir
# à chaque montée de version.
pocket_id_app_name: homelab de Sylvain
pocket_id_accent_color: oklch(0.6 0.2 240)
# Inscription par lien seulement (Administration > Users > Create Signup
# Token, groupes choisis par lien) : rien d'ouvert sans lien.
pocket_id_allow_user_signups: withToken
# Groupes donnés à tout nouveau compte créé sans groupe choisi (lien
# d'inscription sans groupe, ou création par l'admin sans groupe) : les
# applis ouvertes à tous, BentoPDF, Enclosed et PairDrop (leur groupe = leur
# rôle Pangolin). Identifiants lus dans le state (sortie
# pocket_id_default_group_ids, local.pocket_id_default_groups de
# pocket_id.tf) ; absents, aucun groupe par défaut.
pocket_id_signup_default_group_ids: "{{ terraform_outputs.pocket_id_default_group_ids.value | default([]) }}"
# Chacun ne modifie plus son propre profil (e-mail, nom d'utilisateur) : seul
# l'admin le fait. Ouvert (défaut de Pocket ID), un membre du foyer mettrait
# l'e-mail d'un autre et se connecterait à son compte dans les applis qui
# lient par e-mail sans regarder email_verified (Immich, Karakeep,
# MediaManager). La locale reste modifiable.
pocket_id_allow_own_account_edit: false
# Même boîte Infomaniak que msmtp (rôle security) et les autres applis.
pocket_id_smtp_host: mail.infomaniak.com
pocket_id_smtp_port: 587
pocket_id_smtp_tls: starttls
pocket_id_smtp_user: "{{ pangolin_smtp_user | default('') }}"
pocket_id_smtp_password: "{{ pangolin_smtp_pass | default('') }}"
# disabled, always, ipAndUserAgent ou browserRecognition (nouveau navigateur).
pocket_id_login_notification_mode: browserRecognition
# disabled, optional ou required ; required bloque un compte non vérifié.
pocket_id_email_verification: optional

---
# VictoriaLogs : journaux centralisés de tous les hôtes (journald, conteneurs
# Docker, journal d'accès de Traefik et CrowdSec sur Pangolin), 30 jours.
# Interface (vmui) en https://logs.sylvain.cloud derrière le SSO Pangolin
# (tofu/pangolin_config/website_victoria_logs.tf), puis le mot de passe de vmauth.
#
# Deux conteneurs :
#   - victoria-logs       le stockage, sur un réseau privé interne seulement ;
#   - victoria-logs-auth  vmauth devant lui, seul à le joindre : sur newt
#                         (Pangolin) et publié sur la VM (agents du LAN). Il
#                         exige un compte pour tout sauf /health : celui de
#                         l'interface (lecture et écriture) ou celui d'un
#                         agent, qui ne peut qu'écrire (/insert/jsonline).
# VictoriaLogs n'a aucune authentification propre au-delà d'un compte unique
# (-httpAuth.*) : sans vmauth, n'importe quel conteneur de newt, ou du LAN par
# le port publié, lirait tous les journaux.
victoria_logs_base_path: "{{ docker_base_path }}/victoria_logs"
victoria_logs_port: 9428

# Rétention : 30 jours, et un plafond disque strict au cas où un hôte se
# mettrait à bavarder (une boucle d'erreurs) : au-delà, VictoriaLogs supprime
# les partitions journalières les plus anciennes avant les 30 jours. 5 Gio sur
# les 190 Go de la VM ; volume attendu bien en dessous (docs/architecture.md,
# « Les journaux »).
victoria_logs_retention_period: 30d
victoria_logs_max_disk_space_usage: 5GiB

# Adresses de la VM où vmauth est publié : 127.0.0.1 pour l'agent de la VM
# elle-même, l'adresse LAN (host_vars/docker) pour ceux du Pi, du NAS et du
# LXC newt. Publiées par Docker, donc avant ufw : tout le LAN atteint vmauth,
# qui refuse quiconque n'a pas de compte.
victoria_logs_publish_addresses:
  - 127.0.0.1

# Compte Basic de l'interface (lecture, requêtes LogsQL, vmui) tant que le
# SSO n'est pas posé (victoria_logs_oidc_enabled faux). Avec le SSO, le
# navigateur passe par Pocket ID (décision de Sylvain, 2026-11-06 : pas
# d'interface en Basic) et ce compte ne garde que les chemins des scripts
# (victoria_logs_script_paths : ci_key_audit, rôle du même nom, qui l'utilise
# par 127.0.0.1). Mot de passe : clé sops victoria_logs_ui_password, qui
# dérive aussi victoria_logs_internal_auth_key.
victoria_logs_ui_user: sylvain
victoria_logs_script_paths:
  - /select/logsql/query

# SSO de vmauth (v1.153+) par Pocket ID, client victoria-logs
# (tofu/pangolin_config/pocket_id.tf) : posé seulement quand l'émetteur,
# l'identifiant et le secret sont dans le state. Un navigateur sans compte
# (GET) part sur Pocket ID ; l'ID token, gardé en cookie, doit venir de
# l'émetteur, viser ce client et porter le groupe victoria-logs. Les agents et
# Homepage gardent leurs comptes Basic. vmauth joint lui-même l'émetteur
# (découverte, JWKS rafraîchies toutes les 5 min).
victoria_logs_oidc_client_id: "{{ terraform_outputs.pocket_id_victoria_logs_client_id.value | default('') }}"
victoria_logs_oidc_client_secret: "{{ terraform_outputs.pocket_id_victoria_logs_client_secret.value | default('') }}"
victoria_logs_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
victoria_logs_oidc_enabled: >-
  {{ victoria_logs_oidc_client_id | length > 0
     and victoria_logs_oidc_client_secret | length > 0
     and victoria_logs_oidc_issuer | length > 0 }}
victoria_logs_oidc_host: logs.sylvain.cloud
victoria_logs_oidc_group: victoria-logs
victoria_logs_oidc_session: 12h
# Signe le cookie CSRF du SSO ; dérivé comme les autres secrets d'appli, sans
# clé sops. Le changer n'invalide que les connexions en cours.
victoria_logs_oidc_cookie_secret: "{{ (backup_passphrase ~ '-vmauth-sso-cookie') | hash('sha256') }}"

# Un compte d'écriture par agent (nom = inventory_hostname) : clé sops
# victoria_logs_agent_passwords (dict hôte => mot de passe), lue aussi par le
# rôle log_agent. Un agent ne peut appeler que les chemins
# ci-dessous (regex de vmauth, ancrée sur le chemin entier) : ni lecture, ni
# suppression.
victoria_logs_agents: "{{ victoria_logs_agent_passwords | default({}) | dict2items | sort(attribute='key') }}"
victoria_logs_agent_paths:
  - /insert/jsonline

# Compte des cartes CrowdSec et Blocky de Homepage (rôle homepage),
# facultatif : clé sops homepage_victoria_logs_password (32 caractères au
# moins), absente ou vide, pas de compte. Il ne peut appeler que
# /select/logsql/stats_query (des comptes, pas de lignes à lire en bloc), et
# vmauth ajoute à chaque requête extra_stream_filters, que le client ne peut
# ni retirer, ni remplacer, ni élargir (son propre extra_stream_filters est
# ignoré, un « or » dans la requête reste dans ces flux ; vérifié sur vmauth
# 1.155 et VictoriaLogs 1.53) : le flux du conteneur crowdsec de Pangolin et
# ceux de blocky-check.service sur les deux hôtes Blocky (lignes
# event=blocky_stats de blocky_stats.py et résultat de la vérification),
# rien d'autre. Au pire, qui lit la configuration de Homepage lit les
# journaux de CrowdSec (IP et scénarios des attaquants) et ceux de la
# vérification de Blocky (des comptes, « up: OK »). Même nom que
# homepage_victoria_logs_user (rôle homepage).
victoria_logs_homepage_user: homepage
victoria_logs_homepage_password: "{{ homepage_victoria_logs_password | default('') }}"
victoria_logs_homepage_paths:
  - /select/logsql/stats_query
# Un flux par ligne (champs de flux de log_agent : host, source, unit,
# container), réunis par « or » dans un seul filtre de flux.
victoria_logs_homepage_streams:
  - 'host="pangolin",container="crowdsec"'
  - 'host="pi",unit="blocky-check.service"'
  - 'host="newt-lxc",unit="blocky-check.service"'
victoria_logs_homepage_stream_filter: "{{ '{' ~ (victoria_logs_homepage_streams | join(' or ')) ~ '}' }}"

# Serveur MCP de VictoriaLogs (conteneur mcp-victorialogs) pour Open WebUI :
# Sylvain interroge les journaux en langage naturel. Compte de vmauth à jeton
# Bearer, limité à la lecture LogsQL ; jeton dérivé de backup_passphrase (comme
# les autres secrets d'appli, pas de clé sops). Open WebUI n'en a pas besoin :
# il ne parle qu'au MCP, sans authentification (réseau interne partagé). Le
# réseau victoria-logs-mcp est créé ici : ce rôle passe avant openwebui dans
# docker.yml, qui le déclare external.
victoria_logs_mcp_enabled: true
victoria_logs_mcp_token: "{{ (backup_passphrase ~ '-victoria-logs-mcp') | hash('sha256') }}"
victoria_logs_mcp_paths:
  - /select/logsql/.*

# Routes internes de vmauth (/metrics, /flags, /debug/pprof/*, /-/reload) :
# la bibliothèque HTTP de VictoriaMetrics les sert sans compte tant que
# -metricsAuthKey, -flagsAuthKey, -pprofAuthKey et -reloadAuthKey sont vides
# (profils CPU à la demande, noms des comptes dans /metrics), à tout le LAN
# par le port publié. Personne ne s'en sert : la clé, dérivée du mot de passe
# de l'interface sans le révéler, ne fait que les fermer.
victoria_logs_internal_auth_key: "{{ (victoria_logs_ui_password ~ ':vmauth-internal') | hash('sha256') }}"

# Pas de sauvegarde : des journaux se reproduisent (chaque hôte garde son
# journald), et leur perte ne coûte que l'historique. La configuration est
# dans git, les mots de passe dans sops.

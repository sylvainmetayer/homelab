---
# SSH par clé seulement sur le NAS, sans toucher au reste de sshd. Une erreur
# ferme la porte d'un hôte sans console facile : rien n'est écrit sans une clé
# autorisée pour l'utilisateur d'Ansible, et tout est défait si la vérification
# finale échoue.
- name: Find the home of the Ansible user
  ansible.builtin.getent:
    database: passwd
    key: "{{ nas_ssh_user }}"
  register: nas_ssh_passwd

# Une clé réelle (pas un commentaire) : sans elle, couper les mots de passe
# fermerait le NAS à Ansible et à Sylvain. Le fichier par défaut seulement : un
# AuthorizedKeysFile différent fait échouer ce contrôle, sans rien changer.
- name: Count the authorized keys of the Ansible user
  become: true
  ansible.builtin.command:
    argv:
      - grep
      - -cE
      - "^[[:space:]]*([^#]*[ ,])?(ssh-(ed25519|rsa)|ecdsa-sha2-|sk-ssh-|sk-ecdsa-)"
      - "{{ nas_ssh_passwd.ansible_facts.getent_passwd[nas_ssh_user][4] }}/.ssh/authorized_keys"
  register: nas_ssh_keys
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert the Ansible user has an authorized key
  ansible.builtin.assert:
    that:
      - nas_ssh_keys.rc == 0
      - nas_ssh_keys.stdout | int > 0
    fail_msg: >-
      {{ nas_ssh_passwd.ansible_facts.getent_passwd[nas_ssh_user][4] }}/.ssh/authorized_keys
      absent ou sans clé : rien n'a été changé, les mots de passe restent
      acceptés.
    quiet: true

- name: Stat the key-only drop-in
  become: true
  ansible.builtin.stat:
    path: "{{ nas_ssh_dropin }}"
  register: nas_ssh_before

- name: Keep the drop-in as it is now
  when: nas_ssh_before.stat.exists
  become: true
  ansible.builtin.slurp:
    src: "{{ nas_ssh_dropin }}"
  register: nas_ssh_previous

- name: Apply the key-only drop-in, or undo it
  become: true
  block:
    - name: Write the key-only sshd drop-in
      ansible.builtin.template:
        src: sshd-key-only.conf.j2
        dest: "{{ nas_ssh_dropin }}"
        owner: root
        group: root
        # Comme le sshd_config de Debian : rien de secret, lisible par tous.
        mode: "0644" # NOSONAR
        validate: /usr/sbin/sshd -t -f %s
      register: nas_ssh_written

    # La configuration entière (Include compris), avant tout rechargement.
    - name: Validate the whole sshd configuration
      when: not ansible_check_mode
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    # reload : les sessions ouvertes restent. Toujours, même sans changement :
    # un run précédent a pu s'arrêter entre l'écriture et le rechargement.
    - name: Reload sshd
      when: not ansible_check_mode
      ansible.builtin.systemd_service:
        name: "{{ nas_ssh_service }}"
        state: reloaded
      changed_when: nas_ssh_written.changed

    # sshd -T lit les fichiers, pas le démon : il prouve que le fichier gagne
    # (Include présent, première valeur lue). Le démon est sondé plus bas.
    - name: Read the effective sshd configuration
      when: not ansible_check_mode
      ansible.builtin.command: /usr/sbin/sshd -T
      register: nas_ssh_effective
      changed_when: false

    - name: Assert the configuration says no to passwords
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in nas_ssh_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in nas_ssh_effective.stdout_lines"
          - "'pubkeyauthentication yes' in nas_ssh_effective.stdout_lines"
        fail_msg: >-
          sshd -T ne dit pas « no » : {{ nas_ssh_dropin }} n'est pas lu (pas
          d'Include de sshd_config.d dans /etc/ssh/sshd_config) ou une ligne
          plus haut l'emporte.
        quiet: true

    # Le démon vivant : sans méthode par mot de passe, ssh sans clé dit
    # « (publickey) » seul. Sur 127.0.0.1, depuis le NAS (client ssh d'UGOS).
    - name: Try a password login against the running sshd
      when: not ansible_check_mode
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - -o
          - PubkeyAuthentication=no
          - -o
          - StrictHostKeyChecking=no
          - -o
          - UserKnownHostsFile=/dev/null
          - -p
          - "{{ ansible_port | default(22) }}"
          - "{{ nas_ssh_user }}@127.0.0.1"
          - "true"
      environment:
        LC_ALL: C
      register: nas_ssh_probe
      changed_when: false
      failed_when: false

    - name: Assert the running sshd offers publickey only
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - nas_ssh_probe.rc == 255
          - "'Permission denied (publickey).' in nas_ssh_probe.stderr"
        fail_msg: "sshd offre encore autre chose que la clé : {{ nas_ssh_probe.stderr }}"
        quiet: true

    # Une connexion neuve (pas la session en cache) doit encore passer.
    - name: Open a new Ansible connection
      when: not ansible_check_mode
      ansible.builtin.meta: reset_connection

    - name: Check the new connection
      when: not ansible_check_mode
      ansible.builtin.ping:
  rescue:
    - name: Put the previous drop-in back
      when: nas_ssh_before.stat.exists
      ansible.builtin.copy:
        content: "{{ nas_ssh_previous.content | b64decode }}"
        dest: "{{ nas_ssh_dropin }}"
        owner: root
        group: root
        mode: "0644" # NOSONAR

    - name: Remove the drop-in that did not exist before
      when: not nas_ssh_before.stat.exists
      ansible.builtin.file:
        path: "{{ nas_ssh_dropin }}"
        state: absent

    - name: Reload sshd on the previous configuration
      ansible.builtin.systemd_service:
        name: "{{ nas_ssh_service }}"
        state: reloaded

    - name: Fail after undoing the key-only drop-in
      ansible.builtin.fail:
        msg: >-
          SSH par clé seulement annulé, sshd rechargé sur l'état d'avant.
          Tâche en échec : {{ ansible_failed_task.name | default('?') }}
          ({{ ansible_failed_result.msg | default('') }}).

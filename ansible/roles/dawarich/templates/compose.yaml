---
services:
  dawarich-redis:
    mem_limit: 256m
    # L'entrypoint de l'image charge d'office RediSearch, RedisJSON,
    # RedisTimeSeries et RedisBloom, que Dawarich n'utilise pas : RSS au repos
    # ~23 Mio contre ~9 en 7.4 (mesuré le 2026-11-04, à vide). 7.4 et 8.2
    # écrivent le RDB 12 : un retour en 7.4 relit le dump, tant qu'aucune clé
    # de module n'y entre.
    image: redis:8.2-alpine@sha256:489a769e0a54dc245896132a15c72d2bc7296719954da99398f43a3877e5f8eb
    container_name: dawarich-redis
    security_opt:
      - no-new-privileges:true
    # Un instantané par heure au plus, au lieu de toutes les 5 min : le
    # dump.rdb fait ~5,6 Mio et la file Sidekiq change en continu, soit 788
    # réécritures et 4,3 Gio écrits en 68 h (io.stat du conteneur,
    # 2026-11-01), ~60 Mio/h sur le SSD SATA de l'hôte. L'arrêt propre
    # (`compose stop` de dc@) enregistre toujours la base ; seul un crash
    # perd jusqu'à une heure de file : les jobs cron de Dawarich reviennent
    # seuls, pas un import ou un export mis en file ni les relances
    # planifiées (à relancer depuis l'interface). Le healthcheck (`incr
    # ping`) et les battements de Sidekiq modifient la base en continu :
    # l'instantané tombe donc bien toutes les heures, même au repos.
    command: >
      redis-server
      --save 3600 1
      --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - ./redis:/data
    networks:
      - dawarich

  dawarich-db:
    # Mesuré collé à 1 Gio, puis à 2 Gio le 2026-10-29 (base de 5 Gio,
    # anon ~210 Mio, le reste du page cache : 255 000 récupérations au
    # plafond, ~91 Gio lus en 9 h). Pic réel inconnu (censuré par le
    # plafond) : à relire après une semaine.
    mem_limit: 3g
    mem_reservation: 2g
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
    container_name: dawarich-db
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    shm_size: 1G
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Variable is required and must be set}
      POSTGRES_USER: ${DATABASE_USERNAME:?Variable is required and must be set}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Variable is required and must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    networks:
      - dawarich

  dawarich-app:
    # Depuis 1.17.0, les jobs Sidekiq tournent dans ce conteneur
    # (SIDEKIQ_EMBEDDED, .env) : plus de conteneur dawarich-sidekiq. Pas de
    # quota CPU (service interactif), 60 s pour rendre les jobs en cours à
    # Redis au `compose stop` de dc@.
    mem_limit: 2g
    stop_grace_period: 60s
    image: freikin/dawarich:1.21.0@sha256:aae6cabd95c1dd5e5d4e2c920692a1b11524feec143d295a9bcc914df7ffdcdf
    container_name: dawarich-app
    # L'entrypoint démarre en root, donne tmp et db à PUID:PGID puis passe à ce
    # compte (gosu) : le processus de l'appli n'a plus aucune capacité. CHOWN :
    # le `chown -R`. DAC_OVERRIDE : ce chown traverse tmp/imports/watched, 0700
    # de l'utilisateur de déploiement, et un échec arrête l'entrypoint (set -e) ;
    # pas DAC_READ_SEARCH, hors du jeu par défaut de Docker
    # (docs/conventions/container-hardening.md). SETUID, SETGID : gosu.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    restart: unless-stopped
    stdin_open: true
    tty: true
    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]
    env_file:
      - .env
    environment:
      PUID: "{{ ansible_facts['user_uid'] }}"
      PGID: "{{ ansible_facts['user_gid'] }}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s
    depends_on:
      dawarich-db:
        condition: service_healthy
      dawarich-redis:
        condition: service_healthy
    volumes:
      - ./public:/var/app/public
      - ./watched:/var/app/tmp/imports/watched
      - ./storage:/var/app/storage
    networks:
      - dawarich
      - newt

networks:
  # Interne : la base et redis n'ont pas besoin d'Internet, l'appli garde le
  # sien par newt (géocodage, SMTP).
  dawarich:
    internal: true
  newt:
    external: true

---
dawarich_base_path: "{{ docker_base_path }}/dawarich"
dawarich_domain: tracks.sylvain.cloud

dawarich_db_name: dawarich
dawarich_db_user: dawarich
dawarich_db_password: "{{ (app_secrets_seed ~ '-dawarich-db') | hash('sha256') }}"

dawarich_secret_key_base: "{{ (app_secrets_seed ~ '-dawarich-secret-key-base') | hash('sha256') }}"
dawarich_jwt_secret_key: "{{ (app_secrets_seed ~ '-dawarich-jwt-secret') | hash('sha256') }}"
dawarich_auth_jwt_secret_key: "{{ (app_secrets_seed ~ '-dawarich-auth-jwt-secret') | hash('sha256') }}"

dawarich_timezone: Europe/Paris

# Connexion OIDC par Pocket ID (tofu/pangolin_config/pocket_id.tf, ADR 0030),
# le foyer (groupe dawarich). Client lu dans les sorties du state : rendu
# seulement après l'apply. Mot de passe gardé ; OIDC_AUTO_REGISTER=false : le
# SSO ne crée aucun compte, il relie l'existant après un défi.
dawarich_oidc_client_id: "{{ terraform_outputs.pocket_id_dawarich_client_id.value | default('') }}"
dawarich_oidc_client_secret: "{{ terraform_outputs.pocket_id_dawarich_client_secret.value | default('') }}"
dawarich_oidc_enabled: "{{ dawarich_oidc_client_id | length > 0 and dawarich_oidc_client_secret | length > 0 and dawarich_oidc_issuer | length > 0 }}"
dawarich_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"

# Borgmatic backup configuration
dawarich_backup_enabled: true
dawarich_backup_borgmatic_target: "{{ backup_storage_box_url }}/dawarich"
dawarich_backup_encryption_passphrase: "{{ backup_passphrase }}"
dawarich_backup_healthcheck_url: ""

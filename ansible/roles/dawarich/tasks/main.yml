---
- name: Ensure Dawarich app folders exist
  become: true
  loop:
    - "{{ dawarich_base_path }}"
    - "{{ dawarich_base_path }}/public"
    - "{{ dawarich_base_path }}/watched"
    - "{{ dawarich_base_path }}/storage"
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

# Données PostgreSQL : à postgres (uid/gid 70 de l'image alpine) en 0700, ce
# que l'entrypoint repose de toute façon à chaque démarrage. Sans owner, un
# dossier encore à l'utilisateur hôte (ancien chown d'Ansible) passerait en 0700
# sous le postgres en marche, qui ne pourrait plus le traverser.
- name: Ensure Dawarich PostgreSQL folder is owned by the postgres uid
  become: true
  ansible.builtin.file:
    mode: "0700"
    path: "{{ dawarich_base_path }}/postgresql"
    state: directory
    owner: "70"
    group: "70"

- name: Ensure Dawarich redis folder exists with redis image uid/gid
  become: true
  ansible.builtin.file:
    mode: "0700"
    path: "{{ dawarich_base_path }}/redis"
    state: directory
    owner: "999"
    group: "999"

- name: Template compose configuration
  diff: false
  notify: Restart dawarich
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ dawarich_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Template environment configuration
  diff: false
  notify: Restart dawarich
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ dawarich_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Dawarich
  when: dawarich_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: dawarich
    borgmatic_app_title: Dawarich
    borgmatic_app_target: "{{ dawarich_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ dawarich_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ dawarich_backup_healthcheck_url }}"
    # Pas postgresql : la base de Dawarich (seule base du serveur) est
    # dumpée ; copié à chaud, son dossier de données n'est pas cohérent.
    borgmatic_app_source_directories:
      - "{{ dawarich_base_path }}/redis"
      - "{{ dawarich_base_path }}/public"
      - "{{ dawarich_base_path }}/watched"
      - "{{ dawarich_base_path }}/storage"
      - "{{ dawarich_base_path }}/compose.yaml"
      - "{{ dawarich_base_path }}/.env"
    borgmatic_app_postgresql_databases:
      - container: dawarich-db
        name: "{{ dawarich_db_name }}"
        username: "{{ dawarich_db_user }}"
        password: "{{ dawarich_db_password }}"

- name: Make sure dawarich service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@dawarich
    scope: user
    enabled: true

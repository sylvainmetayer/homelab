---
services:
  probe:
    # Pas encore mesuré. L'exemple amont plafonne à 64m ; on garde 128m, à
    # recaler sur memory.peak (rapport mem_report) après quelques semaines.
    mem_limit: 128m
    image: docker.io/jamesits/ripe-atlas:5130-probe@sha256:841459abe5aac56833e94832b2460423b5b9532b6420df73bfec54dd3303643b
    container_name: {{ ripe_atlas_container_name }}
    # Pas de no-new-privileges : le logiciel amont s'appuie sur des exécutables
    # setuid / capacités de fichier (README.md). Exception listée dans
    # docs/conventions/container-hardening.md et check_container_hardening.py.
    cap_drop:
      - ALL
    # Liste de l'exemple amont (contrib/docker-compose).
    cap_add:
      - NET_RAW
      # tini
      - KILL
      # setpriv
      - SETUID
      - SETGID
      # l'entrypoint corrige les droits des dossiers
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    volumes:
      # La seule donnée : la clé SSH (probe_key, probe_key.pub), qui fait
      # l'identité de la sonde chez RIPE.
      - "{{ ripe_atlas_base_path }}/etc:/etc/ripe-atlas"
    tmpfs:
      # État d'exécution et file des résultats : les perdre remet la sonde à
      # zéro, sans conséquence. En mémoire, pour ne pas écrire sur le SSD.
      - /run/ripe-atlas:size=16m
      - /var/spool/ripe-atlas:size=32m
    # Réseau pont par défaut de Docker, rien de publié : telnetd (2023) et
    # httppost (8080) restent dans le conteneur. Sortant seulement.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m

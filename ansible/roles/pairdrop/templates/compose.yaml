---
services:
  app:
    # Pas encore mesuré : un serveur Node (Express + ws) qui ne garde que la
    # liste des pairs connectés en mémoire. Valeur prudente, à recaler sur
    # memory.peak (rapport mem_report) après quelques semaines.
    mem_limit: 128m
    image: ghcr.io/schlagmichdoch/pairdrop:v1.11.2@sha256:c4b30977264a76e335740089e693a52a0d0d616330dec7f93c7b96beef7b4a02
    container_name: {{ pairdrop_container_name }}
    # L'image démarre en root par `npm start` ; `user:` + l'appel direct de
    # node (HOME/npm inutiles) la font tourner sans privilège, système de
    # fichiers en lecture seule (essayé en local : démarre, répond 200).
    user: "{{ ansible_facts['user_uid'] }}:{{ ansible_facts['user_gid'] }}"
    entrypoint: ["node", "server/index.js"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    environment:
      PORT: "{{ pairdrop_port }}"
      # Désactivés (valeurs par défaut, écrites pour mémoire) : le repli
      # WebSocket ferait passer les fichiers par le serveur, et RTC_CONFIG
      # vide laisse le STUN public de Google, sans TURN (README.md).
      WS_FALLBACK: "false"
      RATE_LIMIT: "false"
      DEBUG_MODE: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:{{ pairdrop_port }}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Seul conteneur du projet, sans état : pas de réseau privé, newt suffit.
    networks:
      - newt

networks:
  newt:
    external: true

---
# Pas de sauvegarde borgmatic, exprès : sans état, aucun volume (README.md).
- name: Ensure PairDrop app folder exists
  ansible.builtin.file:
    path: "{{ pairdrop_base_path }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0700"

- name: Template compose configuration
  diff: false
  notify: Restart pairdrop
  ansible.builtin.template:
    src: compose.yaml
    dest: "{{ pairdrop_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

- name: Make sure pairdrop service is running
  ansible.builtin.systemd:
    name: dc@pairdrop
    scope: user
    state: started
    enabled: true
    daemon_reload: true

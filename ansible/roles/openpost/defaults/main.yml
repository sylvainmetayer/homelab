---
openpost_base_path: "{{ docker_base_path }}/openpost"
openpost_domain: posts.sylvain.cloud

# false : appli en pause (docs/runbooks/app-en-pause.md), dc@openpost arrêtée
# et désactivée, configuration borgmatic retirée, plus aucun redémarrage.
openpost_enabled: true
openpost_restart_handlers: "{{ ['Restart openpost'] if openpost_enabled | bool else [] }}"

# Dérivés de app_secrets_seed comme ceux de karakeep : pas d'entrée SOPS. Au
# format de `openssl rand -base64 32` (la doc amont) : 32 octets en base64.
# Changer le premier déconnecte les sessions ; changer le second rend
# illisibles les identifiants des réseaux enregistrés dans la base.
openpost_jwt_secret: "{{ ((app_secrets_seed ~ '-openpost-jwt') | hash('sha256'))[:32] | b64encode }}"
openpost_encryption_key: "{{ ((app_secrets_seed ~ '-openpost-enc') | hash('sha256'))[:32] | b64encode }}"

# Connexion par Pocket ID (tofu/pangolin_config/pocket_id.tf, client openpost) :
# le fournisseur OIDC « d'instance » d'OpenPost (OPENPOST_OIDC_*), celui qui
# met un bouton sur la page de login. Rendu seulement quand l'émetteur,
# l'identifiant et le secret sont dans le state. Un login Pocket ID sans
# identité liée crée un compte (JIT) : le groupe Pocket ID est la barrière.
openpost_oidc_client_id: "{{ terraform_outputs.pocket_id_openpost_client_id.value | default('') }}"
openpost_oidc_client_secret: "{{ terraform_outputs.pocket_id_openpost_client_secret.value | default('') }}"
openpost_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"
openpost_oidc_enabled: "{{ openpost_oidc_client_id | length > 0 and openpost_oidc_client_secret | length > 0 and openpost_oidc_issuer | length > 0 }}"

# Banques d'images : clés SOPS facultatives openpost_unsplash_access_key et
# openpost_pixabay_api_key (jamais de défaut ici : une clé SOPS ne porte pas le
# nom d'une variable du rôle). Une seule suffit à allumer la recherche.
openpost_stock_media_enabled: >-
  {{ (openpost_unsplash_access_key | default('') | length > 0)
     or (openpost_pixabay_api_key | default('') | length > 0) }}

# Le premier compte créé est administrateur de l'instance. Laissée ouverte :
# true ferme aussi la création de compte par un premier login Pocket ID
# (insertJITUser), et derrière le mur Pangolin seul le groupe `openpost`
# atteint la page d'inscription.
openpost_disable_registrations: false

# Réseaux d'où Traefik (par Newt) joint le conteneur : le pool d'adresses par
# défaut de Docker, dont le bridge `newt`. Sans lui, OpenPost ignore
# X-Forwarded-Proto et croit servir en http.
openpost_trusted_proxy_cidrs: 172.16.0.0/12

# Borgmatic backup configuration
openpost_backup_enabled: true
openpost_backup_borgmatic_target: "{{ backup_storage_box_url }}/openpost"
openpost_backup_encryption_passphrase: "{{ backup_passphrase }}"
openpost_backup_healthcheck_url: ""

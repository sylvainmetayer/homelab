---
- name: Ensure Paperless-ngx app folders exist
  loop:
    - "{{ paperless_base_path }}"
    - "{{ paperless_base_path }}/data"
    - "{{ paperless_base_path }}/media"
    - "{{ paperless_base_path }}/export"
    - "{{ paperless_base_path }}/consume"
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  diff: false
  notify: Restart paperless
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ paperless_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# En pause (paperless_enabled: false) : unité arrêtée et désactivée, compose et
# données gardés, pour que la reprise soit un simple retour à true.
- name: Make sure paperless service is {{ 'running' if paperless_enabled else 'stopped' }}
  ansible.builtin.systemd:
    state: "{{ 'started' if paperless_enabled else 'stopped' }}"
    daemon_reload: true
    name: dc@paperless
    scope: user
    enabled: "{{ paperless_enabled }}"

# Sans application, le dump PostgreSQL (docker exec dans paperless_db) échoue
# chaque nuit : la configuration part, le dépôt distant et ses archives
# restent. Sans configuration, borgmatic ne touche plus au dépôt : ni create,
# ni prune, ni check.
- name: Remove the borgmatic configuration of the paused Paperless-ngx
  when: not paperless_enabled
  tags: backup
  become: true
  ansible.builtin.file:
    path: "{{ borgmatic_config_dir }}/paperless.yaml"
    state: absent

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Paperless-ngx
  when: paperless_enabled and paperless_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    # paperless et non paperless_ngx : nom de la configuration et du dépôt
    # depuis le début.
    borgmatic_app_name: paperless
    borgmatic_app_title: Paperless-ngx
    borgmatic_app_target: "{{ paperless_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ paperless_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ paperless_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ paperless_base_path }}/compose.yaml"
      - "{{ paperless_base_path }}/data"
      - "{{ paperless_base_path }}/media"
      - "{{ paperless_base_path }}/export"
      - "{{ paperless_base_path }}/consume"
    borgmatic_app_postgresql_databases:
      - container: paperless_db
        name: "{{ paperless_db_name }}"
        username: "{{ paperless_db_user }}"
        password: "{{ paperless_db_password }}"

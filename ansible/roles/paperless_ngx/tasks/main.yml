---
- name: Ensure Paperless-ngx app folders exist
  loop:
    - "{{ paperless_base_path }}"
    - "{{ paperless_base_path }}/data"
    - "{{ paperless_base_path }}/media"
    - "{{ paperless_base_path }}/export"
    - "{{ paperless_base_path }}/consume"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart paperless
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ paperless_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

- name: Make sure paperless service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@paperless
    scope: user
    enabled: true

# Borgmatic backup configuration
- name: Configure borgmatic backup for Paperless-ngx
  when: paperless_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for Paperless-ngx
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-paperless.yaml.j2"
        dest: "{{ borgmatic_config_dir }}/paperless.yaml"
        owner: "root"
        group: "root"
        mode: "0600"

    - name: Initialize borg repository for Paperless-ngx
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic --config {{ borgmatic_config_dir }}/paperless.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: paperless_ngx_borg_repo_create
      changed_when: "'repository already exists' not in paperless_ngx_borg_repo_create.stderr"
      failed_when: >
        paperless_ngx_borg_repo_create.rc != 0 and
        'repository already exists' not in paperless_ngx_borg_repo_create.stderr

# POSTGRES_PASSWORD only applies to an empty data directory: converge it on
# paperless_db_password, or a rotation silently breaks the app and the
# borgmatic pg_dump. #96
- name: Keep the postgres password in sync with paperless_db_password
  ansible.builtin.import_role:
    name: postgres_auth_sync
  vars:
    postgres_auth_sync_container: paperless_db
    postgres_auth_sync_user: "{{ paperless_db_user }}"
    postgres_auth_sync_database: "{{ paperless_db_name }}"
    postgres_auth_sync_password: "{{ paperless_db_password }}"
    postgres_auth_sync_notify: Restart paperless

---
paperless_base_path: "{{ docker_base_path }}/paperless"
paperless_domain: papiers.sylvain.cloud

# false : application en pause (docs/runbooks/app-en-pause.md). dc@paperless
# arrêtée et désactivée, sauvegarde borgmatic retirée ; compose, données et
# dépôt borg gardés. Aller avec `enabled = false` dans
# tofu/pangolin_config/website_paperless.tf et `"paused": true` dans
# .github/restore-test/apps.json.
paperless_enabled: true

# Sensitive: must be set in secrets.sops.yaml
paperless_secret_key: ""
# Sensitive: must be set in secrets.sops.yaml
paperless_admin_user: ""
# Sensitive: must be set in secrets.sops.yaml
paperless_admin_password: ""
# Sensitive: must be set in secrets.sops.yaml
paperless_admin_email: ""

paperless_db_user: "paperless"
paperless_db_name: "paperless"
# Sensitive: must be set in secrets.sops.yaml
paperless_db_password: ""

paperless_ocr_language: "fra+eng"

# Borgmatic backup configuration
paperless_backup_enabled: true
paperless_backup_borgmatic_target: "{{ backup_storage_box_url }}/paperless"
paperless_backup_encryption_passphrase: "{{ backup_passphrase }}"
paperless_backup_healthcheck_url: ""

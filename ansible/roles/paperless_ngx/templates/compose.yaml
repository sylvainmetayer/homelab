---
services:
  broker:
    mem_limit: 256m
    container_name: paperless_redis
    image: docker.io/library/redis:8@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    restart: unless-stopped
    volumes:
      - ./redis:/data
    networks:
      - paperless
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    mem_limit: 512m
    mem_reservation: 128m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    container_name: paperless_db
    image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: {{ paperless_db_name }}
      POSTGRES_USER: {{ paperless_db_user }}
      POSTGRES_PASSWORD: {{ paperless_db_password }}
    networks:
      - paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ paperless_db_user }} -d {{ paperless_db_name }}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webserver:
    # Le consumer (OCR) tourne dans ce conteneur : c'est un batch, cf. doctrine
    # dans AGENTS.md. Pic mesuré à 1,25 Gio.
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 2g
    container_name: paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3@sha256:dba0242c1df1843643df4eb50ce5639f3a7900f414879088fd5bed8eaf2d456d
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PUID: {{ ansible_facts['user_uid'] }}
      PGID: {{ ansible_facts['user_gid'] }}
      TZ: Europe/Paris
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: {{ paperless_db_name }}
      PAPERLESS_DBUSER: {{ paperless_db_user }}
      PAPERLESS_DBPASS: {{ paperless_db_password }}
      PAPERLESS_SECRET_KEY: {{ paperless_secret_key }}
      PAPERLESS_URL: https://{{ paperless_domain }}
      PAPERLESS_ADMIN_USER: {{ paperless_admin_user }}
      PAPERLESS_ADMIN_PASSWORD: {{ paperless_admin_password }}
      PAPERLESS_ADMIN_MAIL: {{ paperless_admin_email }}
      PAPERLESS_OCR_LANGUAGE: {{ paperless_ocr_language }}
      PAPERLESS_TIME_ZONE: Europe/Paris
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    networks:
      - paperless
      - newt

  gotenberg:
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 512m
    container_name: paperless_gotenberg
    image: docker.io/gotenberg/gotenberg:8.38@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - paperless

  tika:
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 768m
    container_name: paperless_tika
    image: docker.io/apache/tika:4.1.0@sha256:06bcdbd09aca073293e5a171ad161418cc93c91d58d9e4e205064eade84889d4
    restart: unless-stopped
    networks:
      - paperless

# `internal: true` : pas de sortie vers Internet par ce réseau. Le webserver
# la garde par newt ; la base et redis n'en ont pas besoin, et tika /
# gotenberg, qui ouvrent des documents reçus, n'ont pas à en avoir.
networks:
  paperless:
    internal: true
  newt:
    external: true

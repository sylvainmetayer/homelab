---
services:
  broker:
    mem_limit: 256m
    container_name: paperless_redis
    image: docker.io/library/redis:8@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    restart: unless-stopped
    volumes:
      - ./redis:/data
    networks:
      - paperless
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db:
    mem_limit: 512m
    mem_reservation: 128m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    container_name: paperless_db
    image: docker.io/library/postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: {{ paperless_db_name }}
      POSTGRES_USER: {{ paperless_db_user }}
      POSTGRES_PASSWORD: {{ paperless_db_password }}
    networks:
      - paperless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ paperless_db_user }} -d {{ paperless_db_name }}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webserver:
    # Le consumer (OCR) tourne dans ce conteneur : c'est un batch, cf. doctrine
    # dans AGENTS.md. Pic mesuré à 1,25 Gio.
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 2g
    container_name: paperless
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PUID: {{ ansible_facts['user_uid'] }}
      PGID: {{ ansible_facts['user_gid'] }}
      TZ: Europe/Paris
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: {{ paperless_db_name }}
      PAPERLESS_DBUSER: {{ paperless_db_user }}
      PAPERLESS_DBPASS: {{ paperless_db_password }}
      PAPERLESS_SECRET_KEY: {{ paperless_secret_key }}
      PAPERLESS_URL: https://{{ paperless_domain }}
      PAPERLESS_ADMIN_USER: {{ paperless_admin_user }}
      PAPERLESS_ADMIN_PASSWORD: {{ paperless_admin_password }}
      PAPERLESS_ADMIN_MAIL: {{ paperless_admin_email }}
      PAPERLESS_OCR_LANGUAGE: {{ paperless_ocr_language }}
      PAPERLESS_TIME_ZONE: Europe/Paris
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    networks:
      - paperless
      - newt

  gotenberg:
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 512m
    container_name: paperless_gotenberg
    image: docker.io/gotenberg/gotenberg:8.39@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    networks:
      - paperless

  tika:
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 768m
    container_name: paperless_tika
    image: docker.io/apache/tika:4.1.0@sha256:fe2c6e3fca77b986ff3368107a20fa5060a3eefd03d14c12b45c0334626335d2
    restart: unless-stopped
    networks:
      - paperless

# `internal: true` : pas de sortie vers Internet par ce réseau. Le webserver
# la garde par newt ; la base et redis n'en ont pas besoin, et tika /
# gotenberg, qui ouvrent des documents reçus, n'ont pas à en avoir.
networks:
  paperless:
    internal: true
  newt:
    external: true

---
homepage_base_path: "{{ docker_base_path }}/homepage"
homepage_domain: home.sylvain.cloud
homepage_title: Homelab

# Liens des applications publiques : l'output homepage_links de
# tofu/pangolin_config (un par entrée de local.websites), passé par
# docker.yml. Clé => {name, href, group, description, icon, internal_url,
# site_monitor}. internal_url (http://<conteneur>:<port>, la cible de
# Pangolin) et site_monitor (plus le chemin de sa sonde) ne sont remplis que
# pour les applications de la VM docker, que Homepage joint par leur nom sur
# newt ; vides pour le Pi et flip.
homepage_websites: {}

# Adresses LAN des applications hors de la VM docker que Homepage interroge :
# ports publiés par Docker (avant ufw), joignables depuis la VM docker.
homepage_immich_url: "http://192.168.1.96:2283" # NOSONAR (LAN, port publié du Pi, sans TLS)
homepage_jellyfin_url: "http://192.168.1.137:8096" # NOSONAR (LAN, port publié du NAS, sans TLS)
# Proxmox : par l'IP, Homepage ne vérifie pas le certificat
# (pve.sylvain.cloud ne se résout que sur le LAN, comme cette IP).
homepage_proxmox_url: https://192.168.1.26:8006
homepage_proxmox_node: proxmox # var.proxmox_node de tofu/proxmox (terraform.tfvars)
# API d'intégration de Pangolin (sans /v1, que le widget ajoute). Derrière
# l'allowlist Traefik int-api-allowlist (clé sops pangolin_api_allowed_ips) :
# l'IP publique de la maison doit y être.
homepage_pangolin_api_url: https://pangolin-api.sylvain.cloud

# Liens qui ne sont pas une ressource publique de Pangolin, donc absents de
# homepage_websites. Mêmes champs, plus key (celle de homepage_link_widgets_extra)
# et site_monitor, facultatifs.
homepage_extra_links:
  - key: jellyfin
    name: Jellyfin
    href: https://media.sylvain.cloud:8443
    group: Photos et médias
    description: Films, séries, musique, livres. LAN ou client Pangolin
    icon: jellyfin
    site_monitor: "{{ homepage_jellyfin_url }}/health"
  - key: pangolin
    name: Pangolin
    href: https://pangolin.sylvain.cloud
    group: Administration
    description: Tableau de bord du reverse proxy
    icon: mdi-shield-key-outline
  - key: proxmox
    name: Proxmox
    href: https://pve.sylvain.cloud:8006
    group: Administration
    description: Hyperviseur, depuis le LAN
    icon: proxmox
    site_monitor: "{{ homepage_proxmox_url }}"

# Pastille d'état (siteMonitor) des liens dont l'output ne donne pas
# l'adresse : l'Immich du Pi, publié sur le LAN. Ni immich_swipe ni
# immich_selfie_timelapse (ports non publiés) ni les applications de flip
# (réseau privé de Hetzner, que la VM docker ne joint pas) : pas de pastille.
homepage_link_site_monitors:
  immich: "{{ homepage_immich_url }}/api/server/ping"

# Ordre des groupes sur la page. Chaque groupe de homepage_links doit y être :
# tofu/pangolin_config/tests/invariants.tftest.hcl
# (homepage_links_cover_every_public_app) lit cette liste.
homepage_groups:
  - Documents
  - Lecture
  - Photos et médias
  - Vie perso
  - Contacts
  - Flip Planning
  - Administration
  - Supervision
  - Hôtes
  - Divers

# --- Widgets (services.yaml) ---
# Homepage les interroge côté serveur : identifiants et URL restent dans
# config/ (0600), le navigateur ne reçoit que les compteurs.
#
# Beszel, sur le lien de clé beszel de homepage_websites : nombre de systèmes
# et combien sont en ligne. Le widget (version 2, Beszel >= 0.9) se connecte
# en superuser PocketBase (collections/_superusers), pas en simple
# utilisateur : un compte à lui, beszel_homepage_email (host_vars/docker), que
# le rôle beszel crée avec la clé sops homepage_beszel_password. Sans cette
# clé, pas de widget. Ni par Pangolin ni par newt : par le réseau du widget
# (beszel_homepage_network, host_vars/docker), créé par dc@beszel, où
# Homepage a une IP fixe, beszel_homepage_client_ip. PocketBase refuse (403)
# un superuser venu d'une adresse absente des « superuser IPs » du hub : c'est
# celle-là qu'on y ajoute (docs/architecture.md, « La supervision »). L'URL
# vise l'IP du hub sur ce réseau, pas son nom, que le DNS de Docker pourrait
# résoudre en son IP sur newt (l'IP source serait alors celle de newt).
# Le rôle beszel pose beszel_homepage_account_ready à false quand il n'a pas
# pu déclarer le compte : widget omis pour ce run (absent, par exemple en
# --tags homepage seul : le compte est supposé déjà là).
# Risque accepté (Sylvain, 2026-10-28) : ce superuser lit et écrit tout le
# hub, donc qui lit la configuration de Homepage (VM docker, 0600) a la main
# sur Beszel.
homepage_beszel_email: "{{ beszel_homepage_email | default('') }}"
homepage_beszel_widget_password: "{{ homepage_beszel_password | default('') }}"
homepage_beszel_enabled: >-
  {{ homepage_beszel_email | length > 0 and homepage_beszel_widget_password | length > 0
     and (beszel_homepage_account_ready | default(true) | bool) }}
homepage_beszel_url: "http://{{ beszel_homepage_hub_ip }}:8090" # NOSONAR (réseau interne beszel_homepage, sans TLS côté hub)

# Widget posé sur un lien de homepage_websites, par clé de lien : le gabarit
# services.yaml.j2 ne connaît aucune application. Une entrée absente, pas de
# widget.
homepage_link_widgets: >-
  {{ {'beszel': {'type': 'beszel', 'url': homepage_beszel_url, 'username': homepage_beszel_email,
                 'password': homepage_beszel_widget_password, 'version': 2, 'fields': ['systems', 'up']}}
     if homepage_beszel_enabled | bool else {} }}

# Uptime Kuma (PikaPods) : un widget par page de statut publiée (sondes en
# ligne, en panne, disponibilité, incident), seule lecture qu'Uptime Kuma
# offre sans compte. sylvain-dev seulement : pas de page publique des
# sauvegardes (décision de Sylvain, leurs noms et leur état restent privés).
# URL : output homepage_uptimekuma_url de tofu/pangolin_config
# (status_page_site.tf), lu par docker.yml ; vide, pas de widget. Chaque slug
# est celui d'une uptimekuma_status_page de tofu/pangolin_config (test
# homepage_status_pages_match_the_role). Pas de href : l'URL d'Uptime Kuma
# vient d'une clé sops, elle n'est pas écrite dans la page.
homepage_uptimekuma_url: ""
homepage_uptimekuma_status_pages:
  - name: sylvain.dev
    slug: sylvain-dev
    group: Administration
    description: Disponibilité du site personnel (Uptime Kuma)
    icon: uptime-kuma

# --- Supervision (groupe homepage_supervision_group) ---
# Trois cartes de lecture seule, chacune rendue seulement avec sa clé sops.
homepage_supervision_group: Supervision

# Uptime Kuma sans page de statut : les sondes en panne et l'état de chaque
# sauvegarde (moniteurs push « Backup <app> », dossier Backup de
# tofu/pangolin_config). Une page de statut est publique par nature, et les
# sauvegardes n'en ont pas, par décision ; Uptime Kuma n'a ni compte en
# lecture seule ni API REST (socket.io, compte administrateur). Reste
# /metrics (Prometheus), derrière une clé d'API qui n'ouvre que cette route :
# clé sops homepage_uptimekuma_api_key. Homepage ne lit pas ce format : le
# conteneur kuma-summary du même projet (files/kuma_summary.py) interroge
# /metrics au plus une fois par homepage_kuma_summary_cache_seconds (Uptime
# Kuma limite les clés à 60 requêtes par minute), n'en garde que l'état et le
# nom des sondes et les sert en JSON (/down.json, /backups.json) sur le réseau
# privé du projet ; la clé n'est que dans compose.yaml (0600).
# /metrics ne donne pas l'heure du dernier envoi : une sauvegarde est « OK »
# tant qu'elle a poussé dans sa fenêtre (25 h, backup_push_interval),
# « En retard » sinon. Sans la clé ou sans l'URL (output
# homepage_uptimekuma_url), ni cartes ni conteneur.
homepage_uptimekuma_widget_key: "{{ homepage_uptimekuma_api_key | default('') }}"
homepage_kuma_summary_enabled: >-
  {{ homepage_uptimekuma_url | length > 0 and homepage_uptimekuma_widget_key | length > 0 }}
homepage_kuma_summary_port: 8080
homepage_kuma_summary_cache_seconds: 60
homepage_kuma_summary_url: "http://kuma-summary:{{ homepage_kuma_summary_port }}" # NOSONAR (réseau privé du projet)
homepage_kuma_cards:
  - name: Sondes en panne
    group: "{{ homepage_supervision_group }}"
    description: Uptime Kuma, hors sondes en pause et dossiers
    icon: uptime-kuma
    widget:
      type: customapi
      url: "{{ homepage_kuma_summary_url }}/down.json"
      refreshInterval: 60000
      display: dynamic-list
      mappings:
        items: items
        name: name
        label: status
  - name: Sauvegardes
    group: "{{ homepage_supervision_group }}"
    description: Borgmatic, envoi à Uptime Kuma dans les 25 h (en retard d'abord)
    icon: mdi-backup-restore
    widget:
      type: customapi
      url: "{{ homepage_kuma_summary_url }}/backups.json"
      refreshInterval: 60000
      display: dynamic-list
      mappings:
        items: items
        name: name
        label: status
  - name: Maintenance
    group: "{{ homepage_supervision_group }}"
    description: Contrôles périodiques (apt, Storage Box, restaurations, secrets), en défaut d'abord
    icon: mdi-wrench-clock
    widget:
      type: customapi
      url: "{{ homepage_kuma_summary_url }}/maintenance.json"
      refreshInterval: 60000
      display: dynamic-list
      mappings:
        items: items
        name: name
        label: status

# Sondes de la carte Maintenance, par leur nom exact dans Uptime Kuma
# (tofu/pangolin_config) : une sonde renommée, supprimée ou en pause s'y
# affiche « Absente ». Toutes des sondes push, donc « OK » veut dire que le
# contrôle a tourné et passé dans sa fenêtre, pas qu'il n'y a rien à faire :
# - Mises à jour <hôte> (cron_updates.tf, rôle update_notify) : le
#   vérificateur apt du lundi a tourné ; la liste des paquets en attente part
#   sur ntfy (topic scripts) et dans le message du battement, que /metrics
#   ne donne pas : pas de nombre par hôte ici ;
# - Storage Box (storage_box_quota_monitor.tf) : occupation sous 80 % ;
# - Restore test (restore_test_monitor.tf) et Test restauration vzdump
#   (cron_vzdump_restore_test.tf) : derniers tests de restauration ;
# - Rotation des secrets (secrets_rotation_monitor.tf) : aucun secret dû sous
#   30 jours et dernier test de la clé age secours de moins de 100 jours.
homepage_kuma_maintenance_monitors:
  - Mises à jour Proxmox
  - Mises à jour VM docker
  - Mises à jour Raspberry Pi
  - Mises à jour flip
  - Mises à jour Pangolin
  - Storage Box
  - Restore test
  - Test restauration vzdump
  - Rotation des secrets

# CrowdSec (Pangolin) d'après ses journaux, pas par sa LAPI : la LAPI est sur
# Pangolin, que la VM docker ne joint que par Internet (il faudrait l'y
# publier), et le widget crowdsec de Homepage se connecte en machine
# (watcher), un compte qui peut écrire des alertes et supprimer des
# décisions. Le Vector de Pangolin envoie déjà les lignes de CrowdSec à
# VictoriaLogs, sur cette VM, champs crowdsec (alert, decision), decision et
# client_ip compris (rôle log_agent). Homepage interroge vmauth sur newt avec
# un compte à lui (victoria_logs_homepage_user, rôle victoria_logs) qui ne
# peut que compter dans le flux du conteneur crowdsec de Pangolin : clé sops
# homepage_victoria_logs_password. Deux nombres : les alertes des dernières
# 24 h et les IP bannies depuis 4 h (durée d'un ban du profil par défaut de
# CrowdSec : les bans en cours) ; ni la liste communautaire (CAPI) ni les
# AppSec en alerte seule qui ne bannissent pas. Le filtre container:=crowdsec :
# le compte lit aussi les flux de blocky-check (carte Blocky).
homepage_victoria_logs_user: homepage
homepage_victoria_logs_widget_password: "{{ homepage_victoria_logs_password | default('') }}"
homepage_victoria_logs_url: "http://victoria-logs-auth:8427" # NOSONAR (réseau newt, sans TLS)
homepage_crowdsec_query: >-
  _time:24h container:=crowdsec
  | stats count() if (crowdsec:=alert) as alerts,
  count_uniq(client_ip) if (_time:4h crowdsec:=decision decision:=ban) as bans
homepage_crowdsec_card:
  name: CrowdSec
  group: "{{ homepage_supervision_group }}"
  description: Pangolin, d'après ses journaux (VictoriaLogs)
  icon: crowdsec
  href: "{{ homepage_websites.victoria_logs.href | default('') }}"
  widget:
    type: customapi
    # Requête entièrement encodée : Homepage remplace tout {…} de l'URL.
    url: "{{ homepage_victoria_logs_url }}/select/logsql/stats_query?query={{ homepage_crowdsec_query | urlencode }}"
    username: "{{ homepage_victoria_logs_user }}"
    password: "{{ homepage_victoria_logs_widget_password }}"
    refreshInterval: 300000
    # Une valeur par stats, dans l'ordre de la requête.
    mappings:
      - field: data.result.0.value.1
        label: Alertes (24 h)
        format: number
      - field: data.result.1.value.1
        label: IP bannies (4 h)
        format: number

# Blocky (Pi et LXC newt) d'après ses journaux, pas par son port HTTP : il
# sert les métriques avec une API sans authentification
# (/api/blocking/disable), qui ne quitte jamais 127.0.0.1 (rôle blocky). La
# vérification locale de chaque hôte (blocky-check.service) écrit toutes les
# 5 minutes une ligne « event=blocky_stats queries=… blocked=… », les
# requêtes et blocages depuis la ligne précédente (blocky_stats.py, qui
# compte un redémarrage de Blocky depuis zéro) ; leur somme sur 24 h est le
# total de la journée, sans différence de compteurs à faire ici. Même compte
# vmauth que CrowdSec, dont le filtre de flux imposé admet aussi
# blocky-check.service sur ces deux hôtes (rôle victoria_logs). Quatre
# nombres, une paire par hôte : « NaN » quand un hôte n'a écrit aucune ligne
# en 24 h (Blocky arrêté, vérification ou agent de journaux en panne).
# La vérification elle-même y est comptée : 2 requêtes et 1 blocage par
# passage, environ 576 et 288 par jour et par hôte (blocky_response_total
# n'a pas de label client pour les exclure).
homepage_blocky_query: >-
  _time:24h unit:="blocky-check.service" "event=blocky_stats"
  | unpack_logfmt fields (queries, blocked)
  | stats sum(queries) if (host:=pi) as pi_queries,
  sum(blocked) if (host:=pi) as pi_blocked,
  sum(queries) if (host:="newt-lxc") as lxc_queries,
  sum(blocked) if (host:="newt-lxc") as lxc_blocked
homepage_blocky_card:
  name: Blocky
  group: "{{ homepage_supervision_group }}"
  description: Filtrage DNS du LAN sur 24 h, d'après blocky-check (VictoriaLogs)
  icon: blocky
  href: "{{ homepage_websites.victoria_logs.href | default('') }}"
  widget:
    type: customapi
    # Requête entièrement encodée : Homepage remplace tout {…} de l'URL.
    url: "{{ homepage_victoria_logs_url }}/select/logsql/stats_query?query={{ homepage_blocky_query | urlencode }}"
    username: "{{ homepage_victoria_logs_user }}"
    password: "{{ homepage_victoria_logs_widget_password }}"
    refreshInterval: 300000
    # Une valeur par stats, dans l'ordre de la requête.
    mappings:
      - field: data.result.0.value.1
        label: Requêtes Pi
        format: number
      - field: data.result.1.value.1
        label: Bloquées Pi
        format: number
      - field: data.result.2.value.1
        label: Requêtes LXC
        format: number
      - field: data.result.3.value.1
        label: Bloquées LXC
        format: number

# Beszel, une carte par hôte (groupe homepage_hosts_group) : état, CPU,
# mémoire et disque d'un système du hub (mode systemId du widget, qui accepte
# le nom du système). Les systèmes sont les clés du dict sops
# beszel_agent_tokens, celles que le rôle beszel écrit dans le config.yml du
# hub (name = clé) : seuls les noms en sont lus, jamais les jetons. Même
# superuser, même réseau que le widget du lien Beszel : rien sans lui.
homepage_hosts_group: Hôtes
homepage_beszel_systems: "{{ beszel_agent_tokens | default({}) | list | sort }}"
homepage_beszel_host_fields: [status, cpu, memory, disk]
# Disque en rouge à partir de 80 % (highlight de Homepage, sur le champ
# disk de chaque carte d'hôte). Pour le NAS, ce disque est /volume1 : l'agent
# tourne en conteneur, et la racine qu'il mesure est celle de Docker,
# /volume1/@docker (relevé du 2026-11-01 : 24 % pour / dans le conteneur
# comme pour /volume1 sur l'hôte). Aucune connexion de plus au hub.
homepage_beszel_host_highlight:
  disk:
    numeric:
      - level: danger
        when: gte
        value: 80
# Description et icône de chaque carte d'hôte ; un système absent d'ici a
# une carte sans description.
homepage_hosts:
  docker:
    description: VM docker de Proxmox, les applications
    icon: docker
  flip:
    description: Hetzner, Flip Planning et Promptoramix (sans IP publique)
    icon: mdi-server-network
  nas:
    description: NAS Ugreen, Jellyfin et les sauvegardes vzdump
    icon: mdi-nas
  newt-lxc:
    description: LXC de Proxmox, Newt du site proxmox-lxc et Blocky
    icon: mdi-tunnel-outline
  pangolin:
    description: Hetzner, reverse proxy Pangolin
    icon: pangolin
  pi:
    description: Raspberry Pi, Immich et Blocky
    icon: raspberry-pi
  pve:
    description: Hôte Proxmox VE
    icon: proxmox

# Proxmox : le widget du lien proxmox (VM et LXC démarrés, CPU et mémoire du
# nœud) et, sur les cartes d'hôte de homepage_proxmox_guests, le CPU et la
# mémoire de l'invité (proxmox.yaml). Jeton d'API à séparation de privilèges,
# rôle PVEAuditor sur / (lecture seule), créé à la main : clés sops
# homepage_proxmox_token_id (« user@realm!id ») et
# homepage_proxmox_token_secret. L'une vide, ni widget ni statistiques.
homepage_proxmox_widget_token_id: "{{ homepage_proxmox_token_id | default('') }}"
homepage_proxmox_widget_token_secret: "{{ homepage_proxmox_token_secret | default('') }}"
homepage_proxmox_enabled: >-
  {{ homepage_proxmox_widget_token_id | length > 0 and homepage_proxmox_widget_token_secret | length > 0 }}
# vmid du job vzdump de tofu/proxmox (backup.tf) : la VM docker a reçu le 100
# à sa création (var.docker_vm.vm_id n'est lu par aucune ressource).
homepage_proxmox_guests:
  docker:
    vmid: 100
    type: qemu
  newt-lxc:
    vmid: 200
    type: lxc

# Widgets en lecture seule posés sur un lien, par clé (de homepage_websites
# ou de homepage_extra_links), en plus de homepage_link_widgets : enabled
# faux ou url vide (output homepage_links pas encore appliqué), pas de
# widget. Chaque clé sops vide par défaut : la page se déploie sans elles.
#
# - speedtest_tracker : dernier test (version 2 du widget, Speedtest Tracker
#   >= 1.2.1), jeton d'API à la seule capacité results:read
#   (homepage_speedtest_tracker_token).
# - immich : utilisateurs, photos, vidéos, stockage (version 2, Immich
#   >= 1.118 ; /api/server/statistics exige un compte admin), clé d'API d'un
#   admin à la seule permission server.statistics (homepage_immich_api_key).
# - pangolin : sites et ressources de l'organisation (output
#   homepage_pangolin_org), clé d'API d'organisation limitée à List Sites et
#   List Resources (homepage_pangolin_api_key).
# - proxmox : voir plus haut.
#
# Risque accepté (Sylvain, 2026-10-29) pour les trois suivants : aucune de
# ces applications n'offre de jeton en lecture seule, donc qui lit la
# configuration de Homepage (VM docker, 0600) peut y écrire.
# - jellyfin : médiathèque et lectures en cours (version 2, Jellyfin >= 10.12,
#   ici 12.x), clé d'API d'administration (homepage_jellyfin_api_key), sans
#   les boutons pause/lecture (enableMediaControl: false).
# - homebox : compte dédié, invité dans le groupe de Sylvain
#   (homepage_homebox_username, host_vars/docker, et homepage_homebox_password).
# - karakeep : clé d'API de l'utilisateur dont on veut les compteurs
#   (homepage_karakeep_api_key) : elle a tous ses droits.
homepage_speedtest_widget_token: "{{ homepage_speedtest_tracker_token | default('') }}"
homepage_immich_widget_key: "{{ homepage_immich_api_key | default('') }}"
homepage_pangolin_widget_key: "{{ homepage_pangolin_api_key | default('') }}"
homepage_pangolin_org: ""
homepage_jellyfin_widget_key: "{{ homepage_jellyfin_api_key | default('') }}"
homepage_homebox_username: ""
homepage_homebox_widget_password: "{{ homepage_homebox_password | default('') }}"
homepage_karakeep_widget_key: "{{ homepage_karakeep_api_key | default('') }}"

# --- apps-summary (files/apps_summary.py) ---
# Ce que les widgets natifs de Homepage ne lisent pas (pas de widget Grocy ;
# Papra et Dawarich demandent une date calculée, « depuis 7 jours », « ce
# mois-ci », que l'URL d'un customapi ne sait pas écrire ; le flux TBM est un
# SIRI imbriqué) : un conteneur du projet, même modèle que kuma-summary, les
# interroge et sert un JSON plat par source sur newt
# (http://homepage-apps-summary:8080/<source>.json). Il est sur newt parce
# qu'il joint Grocy, Papra et Dawarich par leur nom, comme Pangolin ; tout
# conteneur de newt peut lire ses compteurs (aucun secret, aucun nom de
# document). Clés seulement dans compose.yaml (0600). Une source sans clé
# n'est pas servie ; sans aucune source, pas de conteneur.
homepage_apps_summary_port: 8080
homepage_apps_summary_cache_seconds: 300
homepage_apps_summary_url: "http://homepage-apps-summary:{{ homepage_apps_summary_port }}" # NOSONAR (réseau newt, sans TLS)

# Grocy (sur son lien) : produits à consommer bientôt, dates dépassées,
# manquants, tâches en retard. Clé d'API d'un utilisateur Grocy dédié,
# sans aucune permission (la lecture n'en demande pas) :
# clé sops homepage_grocy_api_key.
homepage_grocy_widget_key: "{{ homepage_grocy_api_key | default('') }}"
homepage_grocy_due_soon_days: 5

# Papra (sur son lien) : documents, ajoutés depuis 7 jours, sans étiquette,
# sur toutes les organisations du compte. Clé d'API aux seules permissions
# organizations:read et documents:read : clé sops homepage_papra_api_key.
homepage_papra_widget_key: "{{ homepage_papra_api_key | default('') }}"

# Dawarich (sur son lien) : km du mois, km et pays de l'année. Clé d'API du
# compte (Dawarich n'en a qu'une, qui peut aussi écrire des points : risque
# accepté comme Karakeep) : clé sops homepage_dawarich_api_key. Rails
# n'accepte que le Host public (APPLICATION_HOSTS) : la requête vise le
# conteneur sous ce Host, celui du lien.
homepage_dawarich_widget_key: "{{ homepage_dawarich_api_key | default('') }}"
homepage_dawarich_host: "{{ homepage_websites.dawarich.href | default('') | urlsplit('hostname') }}"

# TBM : prochains passages de la ligne 31 à l'arrêt CREPS (Talence), dans les
# deux sens, par le flux SIRI-lite ouvert de Bordeaux Métropole (Mecatran,
# stop-monitoring), sans compte : la clé d'accès est publique, la même pour
# tous, donnée par le portail open data (« Flux temps réel TBM »).
# Identifiants relevés le 2026-11-01 (stoppoints-discovery.json) : l'arrêt
# CREPS a deux quais, BP:451 (sens 1, vers Gare Saint-Jean, Cenon,
# Ambarès) puis BP:562 (sens 0, vers Gradignan Beausoleil).
# homepage_tbm_enabled: false retire la carte.
homepage_tbm_enabled: true
homepage_tbm_url: https://bdx.mecatran.com/utw/ws/siri/2.0/bordeaux/stop-monitoring.json
homepage_tbm_account_key: opendata-bordeaux-metropole-flux-gtfs-rt
homepage_tbm_line: "bordeaux:Line:31:LOC"
homepage_tbm_stops:
  - "bordeaux:StopPoint:BP:451:LOC"
  - "bordeaux:StopPoint:BP:562:LOC"
homepage_tbm_departures: 3
homepage_tbm_card:
  name: Bus 31 à CREPS
  group: Vie perso
  description: Vers Gare Saint-Jean / Cenon puis vers Gradignan (TBM, temps réel)
  icon: mdi-bus-clock
  widget:
    type: customapi
    url: "{{ homepage_apps_summary_url }}/tbm.json"
    refreshInterval: 60000
    display: dynamic-list
    mappings:
      items: items
      name: name
      label: status

# Coûts (groupe Administration) : total du mois dernier et du mois en cours
# à date, sources à compléter, date du relevé, depuis le costs.json qu'écrit
# chaque jour le rôle cost_report (même hôte). apps-summary monte ce dossier
# en lecture seule et ne fait aucun appel : les clés Hetzner et OVH restent
# à cost_report. Vide (défaut) : pas de carte ; docker.yml le donne. Tout
# conteneur de newt peut lire ces totaux (des montants, aucun secret).
homepage_costs_dir: ""
homepage_costs_mount: /data/costs
homepage_costs_card:
  name: Coûts
  group: Administration
  description: Hetzner, OVH et abonnements (rapport mensuel sur ntfy)
  icon: mdi-cash-multiple
  widget:
    type: customapi
    url: "{{ homepage_apps_summary_url }}/costs.json"
    refreshInterval: 3600000
    mappings:
      - field: previous_total
        label: Mois dernier
      - field: current_total
        label: Ce mois-ci
      - field: missing
        label: À compléter
        format: number
      - field: updated
        label: Relevé

# Sources servies par apps-summary : nom => variables d'environnement.
homepage_apps_summary_sources: >-
  {%- set out = {} -%}
  {%- if homepage_grocy_widget_key | length > 0 and homepage_websites.grocy.internal_url | default('') | length > 0 -%}
  {%-   set _ = out.update({'grocy': {'GROCY_URL': homepage_websites.grocy.internal_url, 'GROCY_API_KEY': homepage_grocy_widget_key,
                                      'GROCY_DUE_SOON_DAYS': homepage_grocy_due_soon_days | string}}) -%}
  {%- endif -%}
  {%- if homepage_papra_widget_key | length > 0 and homepage_websites.papra.internal_url | default('') | length > 0 -%}
  {%-   set _ = out.update({'papra': {'PAPRA_URL': homepage_websites.papra.internal_url, 'PAPRA_API_KEY': homepage_papra_widget_key}}) -%}
  {%- endif -%}
  {%- if homepage_dawarich_widget_key | length > 0 and homepage_websites.dawarich.internal_url | default('') | length > 0 -%}
  {%-   set _ = out.update({'dawarich': {'DAWARICH_URL': homepage_websites.dawarich.internal_url, 'DAWARICH_HOST': homepage_dawarich_host,
                                         'DAWARICH_API_KEY': homepage_dawarich_widget_key}}) -%}
  {%- endif -%}
  {%- if homepage_tbm_enabled | bool and homepage_tbm_stops | length > 0 -%}
  {%-   set _ = out.update({'tbm': {'TBM_URL': homepage_tbm_url, 'TBM_ACCOUNT_KEY': homepage_tbm_account_key, 'TBM_LINE': homepage_tbm_line,
                                    'TBM_STOPS': homepage_tbm_stops | join(','), 'TBM_DEPARTURES': homepage_tbm_departures | string}}) -%}
  {%- endif -%}
  {%- if homepage_costs_dir | length > 0 -%}
  {%-   set _ = out.update({'costs': {'COSTS_FILE': homepage_costs_mount ~ '/costs.json'}}) -%}
  {%- endif -%}
  {{ out }}

# FreshRSS (sur le lien rss) : widget natif freshrss (non lus, abonnements),
# par l'API Google Reader de FreshRSS, avec le mot de passe d'API du compte
# (Profil → Mot de passe de l'API, distinct du mot de passe de connexion) :
# clé sops homepage_freshrss_api_password, et son nom d'utilisateur,
# homepage_freshrss_username (host_vars/docker). L'API est coupée par le rôle
# rss, sauf quand cette clé existe (rss_api_enabled) ; Pangolin n'ouvre
# toujours aucun chemin autour du SSO : seul ce qui est sur newt la joint
# sans lui. Le mot de passe d'API ouvre aussi l'écriture (marquer lu,
# s'abonner) : risque accepté, comme Karakeep.
homepage_freshrss_username: ""
homepage_freshrss_widget_password: "{{ homepage_freshrss_api_password | default('') }}"

homepage_link_widgets_extra:
  speedtest_tracker:
    enabled: "{{ homepage_speedtest_widget_token | length > 0 }}"
    widget:
      type: speedtest
      url: "{{ homepage_websites.speedtest_tracker.internal_url | default('') }}"
      version: 2
      key: "{{ homepage_speedtest_widget_token }}"
  immich:
    enabled: "{{ homepage_immich_widget_key | length > 0 }}"
    widget:
      type: immich
      url: "{{ homepage_immich_url }}"
      version: 2
      key: "{{ homepage_immich_widget_key }}"
  pangolin:
    enabled: "{{ homepage_pangolin_widget_key | length > 0 and homepage_pangolin_org | length > 0 }}"
    widget:
      type: pangolin
      url: "{{ homepage_pangolin_api_url }}"
      key: "{{ homepage_pangolin_widget_key }}"
      org: "{{ homepage_pangolin_org }}"
      fields: [sites, resources, targets]
  proxmox:
    enabled: "{{ homepage_proxmox_enabled }}"
    widget:
      type: proxmox
      url: "{{ homepage_proxmox_url }}"
      username: "{{ homepage_proxmox_widget_token_id }}"
      password: "{{ homepage_proxmox_widget_token_secret }}"
      node: "{{ homepage_proxmox_node }}"
  jellyfin:
    enabled: "{{ homepage_jellyfin_widget_key | length > 0 }}"
    widget:
      type: jellyfin
      url: "{{ homepage_jellyfin_url }}"
      version: 2
      key: "{{ homepage_jellyfin_widget_key }}"
      enableBlocks: true
      enableNowPlaying: true
      enableMediaControl: false
  homebox:
    enabled: "{{ homepage_homebox_username | length > 0 and homepage_homebox_widget_password | length > 0 }}"
    widget:
      type: homebox
      url: "{{ homepage_websites.homebox.internal_url | default('') }}"
      username: "{{ homepage_homebox_username }}"
      password: "{{ homepage_homebox_widget_password }}"
      fields: [items, locations, totalValue]
  karakeep:
    enabled: "{{ homepage_karakeep_widget_key | length > 0 }}"
    widget:
      type: karakeep
      url: "{{ homepage_websites.karakeep.internal_url | default('') }}"
      key: "{{ homepage_karakeep_widget_key }}"
      fields: [bookmarks, favorites, lists, tags]
  rss:
    enabled: "{{ homepage_freshrss_username | length > 0 and homepage_freshrss_widget_password | length > 0 }}"
    widget:
      type: freshrss
      url: "{{ homepage_websites.rss.internal_url | default('') }}"
      username: "{{ homepage_freshrss_username }}"
      password: "{{ homepage_freshrss_widget_password }}"
  grocy:
    enabled: "{{ 'grocy' in homepage_apps_summary_sources }}"
    widget:
      type: customapi
      url: "{{ homepage_apps_summary_url }}/grocy.json"
      refreshInterval: 300000
      mappings:
        - field: due_soon
          label: À consommer
          format: number
        - field: overdue
          label: Dates passées
          format: number
        - field: missing
          label: Manquants
          format: number
        - field: chores_overdue
          label: Tâches en retard
          format: number
  papra:
    enabled: "{{ 'papra' in homepage_apps_summary_sources }}"
    widget:
      type: customapi
      url: "{{ homepage_apps_summary_url }}/papra.json"
      refreshInterval: 300000
      mappings:
        - field: documents
          label: Documents
          format: number
        - field: recent
          label: Ajoutés (7 j)
          format: number
        - field: untagged
          label: Sans étiquette
          format: number
  dawarich:
    enabled: "{{ 'dawarich' in homepage_apps_summary_sources }}"
    widget:
      type: customapi
      url: "{{ homepage_apps_summary_url }}/dawarich.json"
      refreshInterval: 600000
      mappings:
        - field: month_km
          label: Ce mois-ci
          format: number
          suffix: km
        - field: year_km
          label: Cette année
          format: number
          suffix: km
        - field: year_countries
          label: Pays (année)
          format: number

# Agenda : une carte (groupe Vie perso) qui lit des agendas Nextcloud partagés
# par lien public en lecture seule, au format iCal. Chaque URL porte le jeton
# de son partage : clés sops homepage_calendar_ics_url (Perso) et
# homepage_calendar_top_nous_ics_url (Top nous, partagé à deux). Une clé
# absente ou vide retire son agenda ; aucune = pas de carte.
#
# Homepage ne lit pas ces URL : le widget affiche chaque tâche (VTODO) comme
# un événement daté de l'instant présent, et Top nous en a des dizaines. Le
# conteneur ical-filter du même projet (files/ical_filter.py) récupère chaque
# agenda, en retire tâches et journaux (VTODO, VJOURNAL), le garde
# homepage_ical_filter_cache_seconds et le sert en
# http://ical-filter:<port>/<slug>.ics sur le réseau privé du projet. Les URL
# de partage ne sont que dans compose.yaml (0600), jamais dans services.yaml.
homepage_calendars:
  - name: Perso
    slug: perso
    url: "{{ homepage_calendar_ics_url | default('') }}"
    color: blue
  - name: Top nous
    slug: top-nous
    url: "{{ homepage_calendar_top_nous_ics_url | default('') }}"
    color: pink
homepage_calendars_enabled: "{{ homepage_calendars | selectattr('url') | list }}"
homepage_ical_filter_port: 8080
homepage_ical_filter_cache_seconds: 300
homepage_calendar_integrations: >-
  {%- set out = [] -%}
  {%- for calendar in homepage_calendars_enabled -%}
  {%-   set _ = out.append({'type': 'ical', 'name': calendar.name, 'color': calendar.color,
                            'url': 'http://ical-filter:' ~ homepage_ical_filter_port ~ '/' ~ calendar.slug ~ '.ics'}) -%}
  {%- endfor -%}
  {{ out }}
homepage_calendar_card:
  name: Agenda
  group: Vie perso
  description: "{{ homepage_calendar_integrations | map(attribute='name') | join(' et ') }} (Nextcloud)"
  icon: mdi-calendar-month-outline
  widget:
    type: calendar
    view: agenda
    maxEvents: 8
    showTime: true
    previousDays: 0
    timezone: Europe/Paris
    integrations: "{{ homepage_calendar_integrations }}"

# --- Widgets d'en-tête (widgets.yaml) : sans compte ni clé ---
# Open-Meteo est interrogé côté serveur (api.open-meteo.com) ; la recherche
# ouvre DuckDuckGo, sans suggestions (qui passeraient par le serveur).
homepage_info_widgets:
  - search:
      provider: duckduckgo
      target: _blank
  - datetime:
      locale: fr
      text_size: xl
      format:
        dateStyle: full
        timeStyle: short
        hourCycle: h23
  - openmeteo:
      label: Talence
      latitude: 44.81
      longitude: -0.59
      timezone: Europe/Paris
      units: metric
      cache: 15

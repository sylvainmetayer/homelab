---
services:
  app:
    # Pas encore mesuré : un serveur Next.js qui sert des liens et leurs
    # widgets (Beszel, Uptime Kuma, Proxmox, applications, pastilles d'état),
    # interrogés côté serveur à l'affichage. À recaler sur memory.peak après
    # quelques jours (rapport mem_report du lundi).
    mem_limit: 256m
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    # L'entrypoint démarre en root, vérifie les propriétaires puis passe à
    # PUID:PGID (su-exec) : CHOWN, SETUID et SETGID suffisent.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    environment:
      PUID: "{{ ansible_facts['user_uid'] }}"
      PGID: "{{ ansible_facts['user_gid'] }}"
      # Le Host de chaque requête doit y figurer, sinon 400 : le domaine public
      # (Traefik garde le Host d'origine) et celui de la sonde de Pangolin, qui
      # vise le conteneur par son nom sur newt (hc_hostname, website_homepage.tf).
      # localhost:3000, celui du healthcheck ci-dessous, est toujours admis.
      HOMEPAGE_ALLOWED_HOSTS: "{{ homepage_domain }},homepage:3000,homepage"
      # Pas de journal dans config/, monté en lecture seule.
      LOG_TARGETS: stdout
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "-Y", "off", "http://127.0.0.1:3000/api/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # newt (Pangolin, les applications des widgets, vmauth de VictoriaLogs,
    # apps-summary) ;
    # ical et kuma, les réseaux privés du projet, pour joindre ical-filter et
    # kuma-summary.
{% if homepage_beszel_enabled | bool %}
    # Plus le réseau du widget Beszel (créé par dc@beszel), à une IP fixe :
    # celle que les « superuser IPs » du hub admettent.
{% endif %}
    networks:
      newt: {}
{% if homepage_calendars_enabled | length > 0 %}
      ical: {}
{% endif %}
{% if homepage_kuma_summary_enabled | bool %}
      kuma: {}
{% endif %}
{% if homepage_beszel_enabled | bool %}
      beszel:
        ipv4_address: {{ beszel_homepage_client_ip }}
{% endif %}
{% if homepage_calendars_enabled | length > 0 %}

  # Agendas de la carte Agenda, sans leurs tâches ni journaux (VTODO,
  # VJOURNAL, que le widget daterait de l'instant présent) : récupère chaque
  # URL de partage, filtre, garde la copie homepage_ical_filter_cache_seconds.
  # Sur le seul réseau privé du projet (pas newt : Pangolin n'a pas à le
  # joindre), sans port publié. Bibliothèque standard de Python seulement.
  ical-filter:
    # Pas encore mesuré : deux agendas en mémoire. À recaler sur memory.peak
    # après quelques jours (rapport mem_report du lundi).
    mem_limit: 64m
    image: python:3.15.2-alpine3.24@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
    container_name: homepage-ical-filter
    command: ["python", "/app/ical_filter.py"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      ICAL_FILTER_PORT: "{{ homepage_ical_filter_port }}"
      ICAL_FILTER_CACHE_SECONDS: "{{ homepage_ical_filter_cache_seconds }}"
{% for calendar in homepage_calendars_enabled %}
      ICAL_FEED_{{ calendar.slug | upper | replace('-', '_') }}: {{ calendar.url | replace('$', '$$') | to_json }}
{% endfor %}
    volumes:
      - ./ical_filter.py:/app/ical_filter.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ homepage_ical_filter_port }}/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ical
{% endif %}
{% if homepage_kuma_summary_enabled | bool %}

  # Cartes Sondes en panne et Sauvegardes : lit /metrics d'Uptime Kuma avec la
  # clé d'API (ici seulement), n'en garde que le nom et l'état des sondes et
  # les sert en JSON. Même confinement qu'ical-filter : réseau privé du
  # projet (sortie vers Uptime Kuma), sans port publié.
  kuma-summary:
    # Pas encore mesuré : une liste de sondes en mémoire. À recaler sur
    # memory.peak après quelques jours (rapport mem_report du lundi).
    mem_limit: 64m
    image: python:3.15.2-alpine3.24@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
    container_name: homepage-kuma-summary
    command: ["python", "/app/kuma_summary.py"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      KUMA_SUMMARY_PORT: "{{ homepage_kuma_summary_port }}"
      KUMA_SUMMARY_CACHE_SECONDS: "{{ homepage_kuma_summary_cache_seconds }}"
      KUMA_METRICS_URL: {{ (homepage_uptimekuma_url | regex_replace('/+$', '') ~ '/metrics') | replace('$', '$$') | to_json }}
      KUMA_API_KEY: {{ homepage_uptimekuma_widget_key | replace('$', '$$') | to_json }}
      KUMA_MAINTENANCE_MONITORS: {{ homepage_kuma_maintenance_monitors | to_json(ensure_ascii=False) | replace('$', '$$') | to_json(ensure_ascii=False) }}
    volumes:
      - ./kuma_summary.py:/app/kuma_summary.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ homepage_kuma_summary_port }}/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kuma
{% endif %}
{% if homepage_apps_summary_sources | length > 0 %}

  # Cartes Grocy, Papra, Dawarich et bus TBM : interroge chaque source dont
  # la clé existe (ici seulement) et sert un JSON plat par source. Sur newt,
  # pour joindre Grocy, Papra et Dawarich par leur nom (et sortir vers le
  # flux TBM) ; sans port publié. Même confinement que kuma-summary.
  apps-summary:
    # Pas encore mesuré : quelques réponses JSON en mémoire. À recaler sur
    # memory.peak après quelques jours (rapport mem_report du lundi).
    mem_limit: 64m
    image: python:3.15.2-alpine3.24@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
    container_name: homepage-apps-summary
    command: ["python", "/app/apps_summary.py"]
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # Heure de Paris sans tzdata (absent de l'image alpine) : règle POSIX.
      # Celle de Grocy (TZ=Europe/Paris), qui date ses échéances en local.
      TZ: "CET-1CEST,M3.5.0,M10.5.0/3"
      APPS_SUMMARY_PORT: "{{ homepage_apps_summary_port }}"
      APPS_SUMMARY_CACHE_SECONDS: "{{ homepage_apps_summary_cache_seconds }}"
{% for source in homepage_apps_summary_sources.values() %}
{%   for name, value in source.items() %}
      {{ name }}: {{ value | string | replace('$', '$$') | to_json }}
{%   endfor %}
{% endfor %}
    volumes:
      - ./apps_summary.py:/app/apps_summary.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:{{ homepage_apps_summary_port }}/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - newt
{% endif %}

networks:
  newt:
    external: true
{% if homepage_calendars_enabled | length > 0 %}
  ical: {}
{% endif %}
{% if homepage_kuma_summary_enabled | bool %}
  kuma: {}
{% endif %}
{% if homepage_beszel_enabled | bool %}
  beszel:
    name: {{ beszel_homepage_network }}
    external: true
{% endif %}

---
healthlog_base_path: "{{ docker_base_path }}/healthlog"
healthlog_domain: sante.sylvain.cloud

healthlog_db_name: healthlog
healthlog_db_user: healthlog

# Secrets dérivés de app_secrets_seed, comme ceux de Dawarich et TREK : pas
# de clé SOPS, un sel distinct par secret.
healthlog_db_password: "{{ (app_secrets_seed ~ '-healthlog-db') | hash('sha256') }}"

# Clé AES-256-GCM des colonnes chiffrées (jetons Withings, identifiants des
# intégrations, coffre de documents) : 64 caractères hexadécimaux, ce que
# donne un sha256. La perdre ou la changer rend ces colonnes illisibles :
# avant de tourner la graine app_secrets_seed, figer l'ancienne valeur (README du rôle,
# « Clé de chiffrement »).
healthlog_encryption_key: "{{ (app_secrets_seed ~ '-healthlog-encryption') | hash('sha256') }}"

# Clé HMAC des jetons d'API de HealthLog (hlk_…) : la changer invalide tous
# les jetons émis.
healthlog_api_token_hmac_key: "{{ (app_secrets_seed ~ '-healthlog-api-token-hmac') | hash('sha256') }}"

# Segment secret de l'URL du webhook Withings
# (/api/withings/webhook/<secret>), seul contrôle de ce chemin ouvert sans
# SSO (README, « Accès ») : 64 caractères hexadécimaux. Le changer :
# Déconnecter Withings avant le déploiement, Connecter après (README, « Clé
# de chiffrement ») ; sinon l'abonnement à l'ancienne URL reste chez Withings.
healthlog_withings_webhook_secret: "{{ (app_secrets_seed ~ '-healthlog-withings-webhook') | hash('sha256') }}"

# Connexion OIDC par Pocket ID (tofu/pangolin_config/pocket_id.tf, ADR 0030),
# Sylvain seul (groupe healthlog). Client lu dans les sorties du state : rendu
# seulement après l'apply. Login par mot de passe et passkey gardé
# (OIDC_ONLY=false). Inscription fermée (README, étape 4) : le SSO ne crée
# aucun compte, il ne relie que le compte existant.
healthlog_oidc_client_id: "{{ terraform_outputs.pocket_id_healthlog_client_id.value | default('') }}"
healthlog_oidc_client_secret: "{{ terraform_outputs.pocket_id_healthlog_client_secret.value | default('') }}"
healthlog_oidc_enabled: "{{ healthlog_oidc_client_id | length > 0 and healthlog_oidc_client_secret | length > 0 and healthlog_oidc_issuer | length > 0 }}"
healthlog_oidc_issuer: "{{ terraform_outputs.pocket_id_issuer.value | default('') }}"

# Borgmatic backup configuration
healthlog_backup_enabled: true
healthlog_backup_borgmatic_target: "{{ backup_storage_box_url }}/healthlog"
healthlog_backup_encryption_passphrase: "{{ backup_passphrase }}"
healthlog_backup_healthcheck_url: ""

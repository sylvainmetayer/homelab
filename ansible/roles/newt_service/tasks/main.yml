---
- name: Refuse to start newt without its site credentials
  ansible.builtin.assert:
    that:
      - newt_service_id | length > 0
      - newt_service_secret | length > 0
    fail_msg: >-
      newt_service_id / newt_service_secret vides : lxc.yml les lit dans les
      outputs proxmox_lxc_newt_* de tofu/pangolin_config (tofu apply fait ?).
    quiet: true

- name: Download the newt binary
  become: true
  vars:
    newt_service_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
  notify: Restart newt
  ansible.builtin.get_url:
    url: "https://github.com/fosrl/newt/releases/download/{{ newt_service_version }}/newt_linux_{{ newt_service_arch }}"
    dest: "{{ newt_service_binary }}"
    checksum: "sha256:{{ newt_service_sha256[newt_service_arch] }}"
    owner: root
    group: root
    # Lisible et exécutable par tous : le service tourne sous un utilisateur
    # dynamique (DynamicUser), qui n'est ni root ni membre de son groupe.
    mode: "0755" # NOSONAR

- name: Create the newt configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ newt_service_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the newt site credentials
  become: true
  diff: false
  notify: Restart newt
  ansible.builtin.template:
    src: env.j2
    dest: "{{ newt_service_config_dir }}/env"
    owner: root
    group: root
    mode: "0600"

- name: Install the newt service
  become: true
  notify: Restart newt
  ansible.builtin.template:
    src: newt.service.j2
    dest: /etc/systemd/system/newt.service
    owner: root
    group: root
    mode: "0644"

- name: Start and enable newt
  become: true
  ansible.builtin.systemd:
    name: newt
    state: started
    enabled: true
    daemon_reload: true

---
# borgmatic en conteneur (tasks/container.yml) : jamais démarré par dc@, mais
# par `docker compose run --rm` (borgmatic.service, et le repo-create de
# tasks/app.yml), à travers {{ borgmatic_container_wrapper }}.
services:
  borgmatic:
    # Même version de borgmatic que sur les autres hôtes (borgmatic_version),
    # borg 1.4 dans l'image comme le borg des hôtes (la Storage Box n'a qu'un
    # serveur borg 1.x). Renovate fait monter les deux ensemble (groupe
    # borgmatic).
    image: ghcr.io/borgmatic-collective/borgmatic:2.2.0@sha256:14b70ae1354f9c1fbd5b790c372b948bc25cb00d45d0e6803916bb83cff6fe3c
    # borgmatic directement, sans l'init s6 ni le cron de l'image : le
    # timer systemd de l'hôte décide de l'heure.
    entrypoint: ["borgmatic"]
    hostname: {{ inventory_hostname }}
    # Pont Docker par défaut : ni réseau de projet à créer, ni port publié.
    # Sortie vers la Storage Box et Uptime Kuma seulement.
    network_mode: bridge
    # Verrous de borg (dépôt et cache), identifiés par hôte et PID. Dans un
    # conteneur jetable, l'id d'hôte suit l'adresse MAC du conteneur et le
    # PID son espace de noms : un verrou laissé par un run tué (OOM, coupure)
    # pourrait n'être jamais reconnu périmé, ou celui d'un run en cours être
    # pris pour périmé. Id d'hôte fixe et PID de l'hôte : le même jugement
    # que borg installé sur l'hôte.
    pid: host
    environment:
      TZ: Europe/Paris
      BORG_HOST_ID: "{{ inventory_hostname }}@borgmatic-container"
    # Job par lots : seul, il laisse deux des quatre cœurs du NAS aux autres
    # (deux jobs en même temps peuvent les prendre tous), et il perd face à eux
    # sous contention (docs/conventions/resource-limits.md).
    mem_limit: {{ borgmatic_container_mem_limit }}
    cpus: 2.00
    cpu_shares: 512
    # Root dans le conteneur, qui lit les dossiers 0700 d'autres comptes
    # (config de Jellyfin en 1000:10, bases de MediaManager) : DAC_OVERRIDE
    # seul, de l'ensemble par défaut de Docker (jamais DAC_READ_SEARCH, hors
    # de cet ensemble). Sans lui : « Permission denied » sur ces dossiers.
    # Rien n'est changé de propriétaire, rien n'est écrit chez un autre compte.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    volumes:
      # Sources, configurations et clé SSH, aux chemins de l'hôte.
{% for path in borgmatic_container_source_paths %}
      - "{{ path }}:{{ path }}"
{% endfor %}
      # Configurations au chemin où borgmatic les cherche sans --config
      # (borgmatic.service).
      - "{{ borgmatic_config_dir }}:/etc/borgmatic.d:ro"
      # Copies cohérentes des bases SQLite (hooks before/after) : même
      # chemin que sur les autres hôtes, que lit le test de restauration.
      - "{{ borgmatic_sqlite_staging_dir }}:{{ borgmatic_sqlite_staging_dir }}"
      # known_hosts de la Storage Box, lu par le ssh de borg.
      - "{{ borgmatic_container_path }}/ssh:/root/.ssh"
      # Volumes que déclare l'image, persistants ici : cache des segments de
      # borg (sinon reconstruit à chaque run), sa sécurité (nonces, dépôts
      # connus) et l'état des vérifications de borgmatic (checks: frequency).
      - "{{ borgmatic_container_path }}/borg-cache:/root/.cache/borg"
      - "{{ borgmatic_container_path }}/borg-config:/root/.config/borg"
      - "{{ borgmatic_container_path }}/state:/root/.local/state/borgmatic"

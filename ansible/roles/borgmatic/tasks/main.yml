---
# borgmatic_install (defaults) : sur l'hôte (pipx, borg de GitHub, clients de
# dump par apt), ou dans un conteneur sur un hôte qui n'a ni apt ni pipx (le
# NAS sous UGOS, host_vars/nas). Les configurations des applications
# (tasks/app.yml) sortent du même gabarit dans les deux cas.
- name: Install borgmatic on the host
  when: borgmatic_install == 'host'
  ansible.builtin.import_tasks: host.yml

- name: Run borgmatic in a container
  when: borgmatic_install == 'container'
  ansible.builtin.import_tasks: container.yml

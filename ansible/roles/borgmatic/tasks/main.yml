---
- name: Install dependencies for pipx
  become: true
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
      - pipx
    state: present
    update_cache: true

- name: Ensure pipx path for root
  become: true
  ansible.builtin.command: pipx ensurepath
  register: borgmatic_pipx_ensurepath
  changed_when: "'already in PATH' not in borgmatic_pipx_ensurepath.stdout"

- name: Ensure /root/.local/bin is in PATH for root
  become: true
  ansible.builtin.lineinfile:
    path: "/root/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '^export PATH="\$HOME/\.local/bin:\$PATH"'
    state: present
    create: true
    mode: "0644"

- name: Install borgmatic via pipx for root
  become: true
  community.general.pipx:
    name: "borgmatic"
    state: present

- name: Ensure /root/.local/bin directory exists
  become: true
  ansible.builtin.file:
    path: "/root/.local/bin"
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"

- name: Set download url for borg
  ansible.builtin.set_fact:
    borgmatic_borg_architecture: >
      {% if ansible_facts['architecture'] == 'aarch64' %}
      arm64
      {% else %}
      {{ ansible_facts['architecture'] }}
      {% endif %}


# With hetzner storage box, we need to use the 1.x version
# ssh STORAGE_BOX borg --version
# borg 1.2.9
- name: Download borgbackup binary from GitHub releases for root
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/borgbackup/borg/releases/download/{{ borgmatic_borg_version }}/borg-linux-glibc235-{{
      borgmatic_borg_architecture | trim | replace('\n', '') }}-gh
    dest: "/root/.local/bin/borg"
    mode: "0755"
    owner: "root"
    group: "root"

- name: Ensure borgmatic config directory exists
  become: true
  ansible.builtin.file:
    path: "{{ borgmatic_config_dir }}"
    state: directory
    mode: "0755"
    owner: "root"
    group: "root"

- name: Create borgmatic systemd service
  when: borgmatic_enable_timer
  become: true
  ansible.builtin.template:
    src: borgmatic.service.j2
    dest: /etc/systemd/system/borgmatic.service
    mode: "0644"
    owner: root
    group: root
  notify: Reload systemd daemon

- name: Create borgmatic systemd timer
  when: borgmatic_enable_timer
  become: true
  ansible.builtin.template:
    src: borgmatic.timer.j2
    dest: /etc/systemd/system/borgmatic.timer
    mode: "0644"
    owner: root
    group: root
  notify: Reload systemd daemon

- name: Enable and start borgmatic timer
  when: borgmatic_enable_timer
  become: true
  ansible.builtin.systemd:
    name: borgmatic.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Install rclone
  become: true
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true

- name: Ensure rclone config directory exists for root
  become: true
  ansible.builtin.file:
    path: "{{ borgmatic_rclone_config_dir }}"
    state: directory
    mode: "0700"
    owner: "root"
    group: "root"

- name: Ensure rclone configuration file for root is absent
  become: true
  ansible.builtin.file:
    state: absent
    path: "{{ borgmatic_rclone_config_dir }}/rclone.conf"

- name: Ensure mysqldump and pg_dump are installed
  become: true
  ansible.builtin.apt:
    name:
      - mariadb-client
      - postgresql-client
    state: present
    update_cache: true

- name: Create SSH key from secrets to access backup storage box
  become: true
  ansible.builtin.copy:
    dest: "/root/.ssh/backup_storage_box_key"
    content: "{{ backup_storage_box_ssh_key }}"
    mode: "0600"
    owner: "root"
    group: "root"

- name: Create SSH config to access backup storage box
  become: true
  ansible.builtin.copy:
    dest: "/root/.ssh/config"
    content: |
      Host backup_storage_box
        HostName {{ backup_storage_box_hostname }}
        User {{ backup_storage_box_username }}
        IdentityFile /root/.ssh/backup_storage_box_key
        Port 23
    mode: "0600"
    owner: "root"
    group: "root"

- name: Configure the borgmatic restore test
  when: borgmatic_restore_test_enabled
  become: true
  block:
    - name: Install the restore test script
      ansible.builtin.copy:
        src: borgmatic-restore-test.py
        dest: /usr/local/bin/borgmatic-restore-test
        # Only the root-run unit executes it.
        mode: "0750"
        owner: root
        group: root

    # A missing key (host renamed in the inventory, or not yet in
    # restore_test_hosts of tofu/pangolin_config) still runs the test, but
    # pushes nowhere: say so instead of letting the monitor time out.
    - name: Warn when the restore test has no push URL
      ansible.builtin.debug:
        msg: >-
          WARNING: no restore test push URL for {{ inventory_hostname }}. Is it
          in restore_test_hosts (tofu/pangolin_config/restore_tests.tf), and
          was tofu applied? The result will only reach the journal.
      when: borgmatic_restore_test_healthcheck_url | length == 0

    # The script's only input (it takes no argument and reads no environment
    # variable). Root-only: the push token is a credential.
    - name: Write the restore test settings
      ansible.builtin.copy:
        dest: /etc/borgmatic-restore-test.json
        content: "{{ borgmatic_restore_test_settings | to_nice_json }}\n"
        mode: "0600"
        owner: root
        group: root
      # The content holds the push token: keep it out of --diff and -vvv.
      diff: false
      no_log: true
      vars:
        borgmatic_restore_test_settings:
          config_dir: "{{ borgmatic_config_dir }}"
          max_age_hours: "{{ borgmatic_restore_test_max_age_hours | int }}"
          sample_files: "{{ borgmatic_restore_test_sample_files | int }}"
          sample_max_bytes: "{{ borgmatic_restore_test_sample_max_bytes | int }}"
          push_url: "{{ borgmatic_restore_test_healthcheck_url }}"

    - name: Create the restore test systemd units
      ansible.builtin.template:
        src: "borgmatic-restore-test.{{ item }}.j2"
        dest: "/etc/systemd/system/borgmatic-restore-test.{{ item }}"
        # Only systemd (root) reads the units: no need for world-readable.
        mode: "0640"
        owner: root
        group: root
      loop:
        - service
        - timer
      register: borgmatic_restore_test_units

    # `started` would leave an already active timer on its previous OnCalendar.
    - name: Enable and (re)start the restore test timer
      ansible.builtin.systemd:
        name: borgmatic-restore-test.timer
        enabled: true
        state: "{{ 'restarted' if borgmatic_restore_test_units is changed else 'started' }}"
        daemon_reload: "{{ borgmatic_restore_test_units is changed }}"

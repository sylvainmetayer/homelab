---
# Borgmatic configuration directory
borgmatic_config_dir: "/etc/borgmatic.d"

# Borg version to download from GitHub releases, and the sha256 of each
# binary (listed on the release page): get_url refuses any other file. A
# version bump (Renovate) must update both checksums.
# renovate: datasource=github-releases depName=borgbackup/borg
borgmatic_borg_version: "1.4.5"
borgmatic_borg_sha256:
  x86_64: 1410e28609be3080d0e3ab27a78f5c586a29fd0c75c2aa6415fcde1293bcd923
  arm64: aae37546320810969d2f3cb41a23ec6b86f7fa1c5f868e18f10285978bc977e7

# borgmatic version installed by pipx : la même que celle du scénario Molecule
# (molecule/_shared/Dockerfile), Renovate fait monter les deux ensemble.
# renovate: datasource=pypi depName=borgmatic
borgmatic_version: "2.2.0"

# Borg repository encryption mode (for repo-create)
# Common values: repokey-blake2, repokey-chacha20-poly1305, none
borgmatic_encryption_mode: repokey-blake2

# Timer schedule (systemd OnCalendar format)
# Default: daily at 3 AM
borgmatic_timer_schedule: "*-*-* 01:00:00"

# host : borgmatic installé sur l'hôte (pipx, tasks/host.yml). container :
# image officielle lancée par `docker compose run` (tasks/container.yml), pour
# un hôte sans apt ni pipx (le NAS sous UGOS, host_vars/nas).
borgmatic_install: host

# borgmatic lui-même (installé par pipx pour root), ou l'enrobage qui le lance
# dans son conteneur. Les scénarios Molecule y posent un bouchon
# (molecule/_shared/prepare.yml).
borgmatic_bin: "{{ borgmatic_container_wrapper if borgmatic_install == 'container' else '/root/.local/bin/borgmatic' }}"
# borg tel que le voit borgmatic (local_path des configurations) : celui de
# GitHub sur l'hôte, celui de l'image dans le conteneur.
borgmatic_borg_bin: "{{ '/usr/local/bin/borg' if borgmatic_install == 'container' else '/root/.local/bin/borg' }}"
# Arguments de borgmatic dans borgmatic.service. Sur l'hôte, les messages
# vont au journal par syslog ; dans le conteneur, qui n'a pas de /dev/log, par
# la sortie de `docker compose run`, que le journal recueille.
borgmatic_service_args: "{{ '--verbosity 1' if borgmatic_install == 'container' else '--verbosity -1 --syslog-verbosity 1' }}"
# Unités après lesquelles la sauvegarde démarre, en plus du réseau : le démon
# Docker sous UGOS (docker_service_system_after, host_vars/nas), sans le
# tirer par Wants=.
borgmatic_service_after: "{{ (docker_service_system_after | default([])) if borgmatic_install == 'container' else [] }}"

# --- borgmatic en conteneur (borgmatic_install: container) ------------------
# Tout ce que lit une configuration (elle-même, la clé SSH, les sources,
# le staging SQLite) est monté au même chemin dans le conteneur : les chemins
# du gabarit app.yaml.j2 valent des deux côtés. Dossier à root, 0700, sur le
# disque de l'hôte (survit à une réinitialisation d'UGOS, comme les applis).
borgmatic_container_path: "{{ docker_base_path }}/borgmatic"
# `docker compose run --rm` de l'image : appelé par borgmatic.service et par
# le repo-create de tasks/app.yml (borgmatic_bin).
borgmatic_container_wrapper: "{{ borgmatic_container_path }}/borgmatic"
# Sources montées en lecture-écriture : sqlite3 « .backup » d'une base en
# mode WAL écrit son -shm. docker_base_path entier : les applications de
# l'hôte y ont chacune leur dossier.
borgmatic_container_source_paths:
  - "{{ docker_base_path }}"
# Provisoire : à recaler à ~2x memory.peak après quelques sauvegardes.
borgmatic_container_mem_limit: 1g

# Exclusions communes à toutes les applications. borgmatic les passe à borg
# en style « fm: », ancrées au début du chemin archivé (sans le / initial) :
# « * » y traverse les /, donc '*.log' vise tout fichier .log, mais un motif
# relatif comme 'cache/*' ne correspond à rien. Une exclusion propre à une
# application s'écrit en chemin absolu (borgmatic_app_exclude_patterns).
borgmatic_exclude_patterns:
  - "*.log"
  - "*.tmp"

# --- Sauvegarde d'une application (tasks/app.yml) ---------------------------
# Chaque rôle d'application appelle :
#   - name: Configure borgmatic backup for <App>
#     when: <service>_backup_enabled
#     tags: backup
#     ansible.builtin.include_role:
#       name: borgmatic
#       tasks_from: app.yml
#       apply:
#         tags: backup
#     vars:
#       borgmatic_app_name: <service>
#       borgmatic_app_source_directories: [...]
#       ...
# borgmatic_app_name et borgmatic_app_source_directories sont obligatoires ;
# le reste a les valeurs ci-dessous.
#
# borgmatic_app_name : fichier {{ borgmatic_config_dir }}/<name>.yaml (celui
# que lisent decommission_app et les scénarios Molecule) et, par défaut,
# dossier du dépôt dans celui de l'hôte sur la Storage Box (backup/<hôte>/<name>,
# créé par borg lui-même au repo-create).

# Nom affiché dans les messages des hooks et les noms de tâches.
borgmatic_app_title: "{{ borgmatic_app_name }}"
# Préfixe des archives : '<prefix>-{now:%Y-%m-%dT%H:%M:%S}'. Le changer sort
# les archives existantes de la rétention (prune ne voit que ce préfixe).
borgmatic_app_archive_prefix: "{{ borgmatic_app_name | replace('_', '-') }}"
# Label du dépôt (logs, --repository).
borgmatic_app_label: "{{ borgmatic_app_archive_prefix }}-backup"
borgmatic_app_target: "{{ backup_storage_box_url }}/{{ borgmatic_app_name }}"
borgmatic_app_passphrase: "{{ backup_passphrase }}"
borgmatic_app_encryption_mode: "{{ borgmatic_encryption_mode }}"
# URL push Uptime Kuma ; vide : pas de push. Poussée par uptime-push depuis les
# hooks de la configuration (app.yaml.j2), pas par le hook uptime_kuma de
# borgmatic, qui écrit l'URL et son jeton au journal à chaque run.
borgmatic_app_healthcheck_url: ""
# Fichier de configuration curl (« url = … », 0600 root) qui porte l'URL
# push : hors de la ligne de commande, que ps, systemctl et le journal
# (_CMDLINE) montreraient. Sous borgmatic_config_dir, monté au même chemin
# dans le conteneur borgmatic du NAS ; un sous-dossier, que borgmatic ne lit
# pas (il ne prend que les *.yaml du dossier, sans descendre).
borgmatic_app_push_config: "{{ borgmatic_push_config_dir }}/{{ borgmatic_app_name }}.curl"
# Exclusions en plus de borgmatic_exclude_patterns, en chemins absolus.
borgmatic_app_exclude_patterns: []
# Bases dumpées par le client du conteneur de la base (docker exec) : client
# et serveur toujours de même version. Chaque entrée : container, name,
# username, password et port (5432 / 3306 par défaut). Le dossier de données
# de la base n'a alors rien à faire dans les sources : copié à chaud, il
# n'est pas cohérent.
borgmatic_app_postgresql_databases: []
# Entrées MySQL/MariaDB : dump_command en plus (mariadb-dump par défaut). L'image
# officielle mariadb n'a plus que mariadb-dump depuis la 11.0 (les liens
# mysql* sont dans mariadb-client-compat, qu'elle n'installe pas) ; celle de
# linuxserver a les deux, mais son mysqldump avertit « Deprecated program
# name » à chaque dump. Toutes les bases du dépôt sont en MariaDB : une vraie
# base MySQL passerait dump_command: mysqldump. Le client passe par
# borgmatic_docker_dump_bin (voir plus bas) : borgmatic 2.1 lui impose un
# --result-file de l'hôte.
borgmatic_app_mysql_databases: []
# Globs (chemins absolus sur l'hôte) des bases SQLite de l'application,
# résolus au déploiement. Chaque fichier trouvé qui est bien une base SQLite
# est copié à chaud, avant borg, par sqlite3 (« VACUUM INTO » en WAL,
# « .backup » sinon : cf. le hook de templates/app.yaml.j2) dans
# borgmatic_sqlite_staging_dir/<application>/,
# que borg archive ; la copie vivante (base, -wal, -shm, -journal) est
# exclue. Pas le hook sqlite_databases de borgmatic : son « .dump » en flux
# garde un verrou de lecture tant que borg n'a pas fini de lire le tube,
# soit tout l'envoi vers la Storage Box, et une base en mode journal (pas
# WAL) ne peut plus écrire pendant ce temps (Pangolin entier figé le
# 07/10/2026). La copie ne tient le verrou que le temps de la copie
# locale. Une base écrite en continu doit passer en WAL : « .backup »
# recommence à chaque écriture d'un autre processus. Une base supprimée
# après coup (son dossier avec elle) fait échouer le backup jusqu'au
# déploiement suivant, qui la retire.
borgmatic_app_sqlite_databases: []
# Commandes en plus des messages de début et de fin (hooks before/after
# action, create seulement).
borgmatic_app_before_commands: []
borgmatic_app_after_commands: []
# Options borgmatic de premier niveau en plus (ex. match_archives).
borgmatic_app_extra_options: {}

# Copies cohérentes des bases SQLite, une sous-arborescence par application
# (root, 0700), archivées puis vidées après chaque sauvegarde réussie.
# Restauration, application arrêtée : extraire la copie de l'archive
# (borgmatic extract --archive <archive> --path <dossier>/<application>),
# la remettre à la place de la base en supprimant ses -wal et -shm (un WAL
# resté là serait rejoué sur la copie), puis lui rendre son propriétaire
# (stat -c %u:%g sur l'ancienne avant, chown après).
borgmatic_sqlite_staging_dir: /var/lib/borgmatic-sqlite

# Fichiers des URL push Uptime Kuma (borgmatic_app_push_config), root, 0700.
borgmatic_push_config_dir: "{{ borgmatic_config_dir }}/uptime-kuma"
# Actions qui poussent au moniteur : celles pour lesquelles le hook
# uptime_kuma de borgmatic poussait (ni repo-create, ni list, ni extract).
borgmatic_push_actions:
  - create
  - prune
  - compact
  - check

# Enrobage du client de dump MySQL/MariaDB (files/borgmatic-docker-dump).
borgmatic_docker_dump_bin: /usr/local/bin/borgmatic-docker-dump

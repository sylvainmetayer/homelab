#
# WARNING: To install Immich, follow our guide: https://docs.immich.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.
name: immich
services:
  immich-server:
    security_opt:
      - no-new-privileges:true
    container_name: immich_server
    # mem_limit ≈ 2× le pic mesuré (memory.peak du cgroup, docs/conventions/
    # resource-limits.md) : 1,4 Gio pour le serveur, 1,1 Gio pour Postgres
    # (surtout du cache de pages), 130 Mio pour Valkey, 311 Mio pour le
    # timelapse, 15 Mio pour swipe (pi, 31/10/2026, 26 h après le démarrage).
    mem_limit: 3g
    image: ghcr.io/immich-app/immich-server:v3.4.0@sha256:7b7b575029168bfb9eb901d868ce7dbfda0d7818e78aaace29b7b8a08cd4e7d5
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    # Le healthcheck de database sonde toutes les 5 s pendant son start_period
    # (start_interval) : l'attendre ne retarde immich que d'autant.
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - newt
      - immich
      - db
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    security_opt:
      - no-new-privileges:true
    container_name: immich_machine_learning
    # Pic mesuré 1,4 Gio, mais sur 26 h seulement : un gros import charge en
    # même temps les modèles CLIP, visages et OCR, d'où une marge au-delà du
    # 2× (2,9 Gio). Au-dessus de la RAM du Pi, ce plafond ne fait que borner
    # une fuite avant qu'elle ne vide le swap.
    mem_limit: 4g
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.0@sha256:f4e7275c9fbd956ed7bccc738ac57890bcbd9f9c17844d2ea0b137e38a083454
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    networks:
      - immich
    restart: always
    healthcheck:
      disable: false

  redis:
    security_opt:
      - no-new-privileges:true
    container_name: immich_redis
    mem_limit: 256m
    mem_reservation: 128m
    image: docker.io/valkey/valkey:9@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    # Mot de passe du .env (REDIS_PASSWORD, que lit aussi immich-server).
    # Interpolé par compose dans la commande : valkey réécrit le titre de son
    # processus, `ps` sur le Pi ne le montre pas.
    command: valkey-server --requirepass "${REDIS_PASSWORD}"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # interval / start_period : sans eux, la première sonde attend le défaut
    # de 30 s, et immich-server, qui attend redis en service_healthy, autant.
    # PONG exigé : sans mot de passe, redis-cli affiche NOAUTH et peut sortir
    # en 0. Il lit le mot de passe dans REDISCLI_AUTH, pas sur sa ligne de
    # commande.
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
{% if immich_remote_worker | bool %}
    # Publié seulement pour le worker distant du poste (compose/immich), qui
    # l'atteint par le LAN le temps d'un rattrapage, son IP seule
    # (DOCKER-USER : tasks/remote_worker.yml). Docker ne publie pas de port
    # d'un conteneur qui n'est que sur un réseau interne : d'où `immich`, le
    # temps du rattrapage.
    ports:
      - "{{ immich_db_bind_address }}:6379:6379"
{% endif %}
    networks:
      - db
{% if immich_remote_worker | bool %}
      - immich
{% endif %}

  database:
    security_opt:
      - no-new-privileges:true
    container_name: immich_postgres
    mem_limit: 2560m
    mem_reservation: 1152m
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      #DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    # Le HEALTHCHECK que l'image d'Immich embarque est invisible dans le modèle
    # compose (et donc pour la vérification Molecule partagée) : il est recopié
    # ici, cadence comprise. Pas un simple pg_isready : la base est créée avec
    # --data-checksums, et ce test passe au rouge dès que PostgreSQL relève une
    # page corrompue (checksum_failures). Variables de l'environnement du
    # conteneur (`$$`), pas du .env de l'hôte.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1;
          chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}"
          --tuples-only --no-align
          --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')";
          [ "$$chksum" = '0' ] || { echo "checksum failure count is $$chksum"; exit 1; }
      interval: 5m
      start_interval: 5s
      start_period: 5m
    # Le défaut (10 s) tue la base d'un SIGKILL au `compose stop` de dc@.
    stop_grace_period: 60s
    # Même règle que Valkey (immich_remote_worker) ; borgmatic
    # passe par docker exec, pas par ce port.
{% if immich_remote_worker | bool %}
    ports:
      - "{{ immich_db_bind_address }}:5432:5432"
{% endif %}
    restart: always
    networks:
      - db
{% if immich_remote_worker | bool %}
      - immich
{% endif %}

  # Avec immich_swipe_api_key, son nginx passe /api/ à immich-server et pose
  # la clé côté serveur : pas de CORS ni d'écran de connexion (README du
  # rôle). Sans, l'image telle quelle : URL et clé saisies dans le navigateur.
  # nginx maître en root, workers en nginx (101). CHOWN : les dossiers de
  # /var/cache/nginx donnés à nginx au démarrage ; SETUID, SETGID : les
  # workers ; DAC_OVERRIDE : lire immich-swipe.conf, 0600 au compte de
  # déploiement. Essayé en local le 10/11 (podman, utilisateur distinct de
  # root), chaque capacité retirée tour à tour : nginx refuse de démarrer ou
  # garde ses workers en root.
  immich-swipe:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    image: ghcr.io/sylvainmetayer/immich-swipe:sha-a9644ff@sha256:f7546236c6350c401ffd0172f5fdd5808f9cae4c5f2eaa5a7cfa5c010f6abaf3
    container_name: immich-swipe
    mem_limit: 64m
{% if immich_swipe_preconfigured | bool %}
    volumes:
      - ./immich-swipe.conf:/etc/nginx/conf.d/default.conf:ro
{% endif %}
    restart: unless-stopped
    # La page servie par nginx (curl est dans l'image). Chaque passage laisse
    # une ligne dans le journal d'accès, d'où 2 min en régime établi.
    healthcheck:
      test: ["CMD", "curl", "--fail", "-s", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 2m
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - newt
      - immich

{% if immich_kiosk_enabled | bool %}
  # Cadre photo plein écran (damongolding/immich-kiosk), lu avec une clé
  # d'API Immich en lecture seule. Pas de port publié : sa seule entrée est la
  # route Pangolin derrière le SSO (rôle immich-kiosk, sans membre). Rendu
  # seulement si immich_kiosk_api_key existe ; la clé retirée, le compose
  # change et le redémarrage de dc@immich (up --remove-orphans) le supprime.
  immich-kiosk:
    image: ghcr.io/damongolding/immich-kiosk:0.47.1@sha256:0e7e61f2b251582b61daf88778e21eb1a68d9b7fe671837e7086ad6d58a3fd31
    container_name: immich-kiosk
    # Pas encore mesuré sur le Pi : un binaire Go qui garde un cache d'images
    # en mémoire. Valeur prudente, à recaler sur memory.peak (mem_report).
    mem_limit: 256m
    # Image distroless en utilisateur nonroot (USER de l'image) ; essayée en
    # local en lecture seule, sans capacité, avec no-new-privileges.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # L'API d'Immich par le réseau immich ; les liens et QR codes visent
      # l'Immich public.
      KIOSK_IMMICH_URL: http://immich-server:2283
      KIOSK_IMMICH_EXTERNAL_URL: https://{{ immich_domain }}
      KIOSK_IMMICH_API_KEY: "{{ immich_kiosk_api_key }}"
      KIOSK_BEHIND_PROXY: "true"
      # /config rendrait la configuration, clé d'API comprise.
      KIOSK_DISABLE_CONFIG_ENDPOINT: "true"
      TZ: Europe/Paris
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/kiosk", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - newt
      - immich

{% endif %}
{% if immich_power_tools_enabled | bool %}
  # Immich Power Tools (immich-power-tools/immich-power-tools) : gestion en
  # masse des personnes, lieux, dates et albums, chacun avec son propre compte
  # Immich (OAuth par Immich, sans clé d'API). Derrière le SSO (rôle
  # immich-power-tools, le foyer). Il lit aussi la base d'Immich en direct,
  # chaque requête filtrée sur l'utilisateur connecté (README du rôle).
  immich-power-tools:
    image: ghcr.io/immich-power-tools/immich-power-tools:0.25.0@sha256:85af8a9f116cfb626dcda491a49616baf90108fe428a885df5ab68bd7cddb291
    container_name: immich-power-tools
    # ~93 Mio au repos, mesurés en local (Next.js, sans Immich). Pas encore
    # mesuré sur le Pi ni sous charge (analyses, recherche) : valeur
    # prudente, à recaler sur memory.peak (mem_report).
    mem_limit: 512m
    # Utilisateur nextjs (uid 1001, USER de l'image), système de fichiers en
    # lecture seule, sans capacité : essayé en local (podman). /app/data est
    # le SQLite de l'appli (workflows, imports), en tmpfs : rien à garder, et
    # pas de base sur le disque du Pi (ni dans les sauvegardes, README du
    # rôle).
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
      - /app/data:mode=1777,size=64m
    environment:
      # L'API d'Immich par le réseau immich ; les liens visent l'Immich public.
      IMMICH_URL: http://immich-server:2283
      EXTERNAL_IMMICH_URL: https://{{ immich_domain }}
      # Pas d'IMMICH_API_KEY : avec elle, tout visiteur sans cookie agissait
      # comme son propriétaire. Connexion par Immich (OAuth, Pocket ID) :
      # Power Tools demande l'autorisation à l'Immich public
      # (EXTERNAL_IMMICH_URL, joint depuis le Pi par l'IP de la maison), le
      # rappel est déclaré sur le client immich de Pocket ID. Chacun agit
      # avec son propre jeton Immich.
      OAUTH_ENABLED: "true"
      OAUTH_BUTTON_TEXT: "Se connecter avec Pocket ID"
      POWER_TOOLS_ENDPOINT_URL: https://{{ immich_power_tools_domain }}
      SECURE_COOKIE: "true"
      # La base d'Immich, par le réseau immich, avec un rôle en lecture seule
      # (tasks/main.yml : l'appli ne fait que lire, README du rôle). Pas de
      # JWT_SECRET: sans lui les liens de partage publics de l'appli restent
      # désactivés.
      DB_HOST: immich_postgres
      DB_PORT: "5432"
      DB_USERNAME: "{{ immich_power_tools_db_username }}"
      DB_PASSWORD: "{{ immich_power_tools_db_password }}"
      DB_DATABASE_NAME: "{{ immich_db_name }}"
{% if immich_power_tools_ai_api_key | length > 0 %}
      # Recherche « Find » : passerelle IA de Pangolin, format OpenAI, une clé
      # virtuelle et un budget à Power Tools (README du rôle).
      AI_BASE_URL: {{ immich_power_tools_ai_base_url }}
      AI_API_KEY: "{{ immich_power_tools_ai_api_key }}"
      AI_MODEL: {{ immich_power_tools_ai_model }}
{% endif %}
    restart: unless-stopped
    healthcheck:
      # curl est dans l'image ; 127.0.0.1 comme son propre HEALTHCHECK.
      test: ["CMD", "curl", "--fail", "-s", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - newt
      - immich
      - db

{% endif %}
  immich-selfie-timelapse:
    security_opt:
      - no-new-privileges:true
    image: arnaudcayrol/immich-selfie-timelapse:2.3@sha256:c73a7343bbe5c865affb2cbc23aef34449b773a75987f40598c75b0c5e6677a3
    container_name: immich-selfie-timelapse
    mem_limit: 768m
    #user: 1000:1000
    # Sans login et avec la clé d'API Immich : aucun port publié, son seul
    # accès est la route Pangolin derrière le SSO (Newt du Pi, par le réseau
    # newt ; tofu/pangolin_config/website_immich_selfie_timelapse.tf).
    environment:
      - IMMICH_API_KEY={{ immich_timelapse_api_key }}
      - IMMICH_BASE_URL=https://{{ immich_domain }}
    volumes:
      - ./timelapse_config:/app/config
      - ./timelapse_output:/app/output
    restart: unless-stopped
    # Binaire Rust, 5000 : `/` répond 200 dès que le serveur écoute (essayé en
    # local sur 2.3, le modèle de visages est chargé en ~4 s). Aucune route
    # de santé propre : toutes répondent 200, la sonde ne dit que « le serveur
    # HTTP écoute ». curl est dans l'image.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5000/"]
      interval: 60s
      start_interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - newt
      - immich

volumes:
  model-cache:

# `db` est `internal: true` : Postgres et Valkey (root, sans cap_drop) n'ont pas
# de sortie vers Internet et ne partagent pas leur réseau avec timelapse ni le
# machine learning. `immich`, avec sortie, garde le serveur (OAuth, géocodage),
# le machine learning (téléchargement des modèles), Power Tools et timelapse.
networks:
  immich:
  db:
    internal: true
  newt:
    external: true

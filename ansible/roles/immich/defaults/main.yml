---
# Default variables for immich role
immich_base_path: "{{ docker_base_path }}/immich"
immich_domain: ""
immich_pin: ""
immich_db_password: ""

# Backup (borgmatic)
immich_backup_enabled: true
immich_backup_borgmatic_target: "{{ backup_storage_box_url }}/immich"
# Ancien nom de la passphrase, encore lu s'il est défini (host_vars).
immich_backup_encryption_passphrase: "{{ immich_backup_borgmatic_password | default(backup_passphrase) }}"
immich_backup_healthcheck_url: ""

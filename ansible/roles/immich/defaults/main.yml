---
# Default variables for immich role
immich_base_path: "{{ docker_base_path }}/immich"
immich_domain: ""
# Dérivée, ne pas la définir : vrai quand la clé SOPS immich_swipe_api_key
# existe ; Immich Swipe est alors préconfiguré (README du rôle).
immich_swipe_preconfigured: "{{ immich_swipe_api_key | default('') | length > 0 }}"
# Dérivée, ne pas la définir : vrai quand la clé SOPS immich_kiosk_api_key
# existe ; le conteneur immich-kiosk n'est rendu que dans ce cas (README du
# rôle). Clé en lecture seule, distincte de celle de Swipe.
immich_kiosk_enabled: "{{ immich_kiosk_api_key | default('') | length > 0 }}"
# Immich Power Tools, sans clé d'API depuis le 2026-11-06 : chacun s'y connecte
# avec son propre compte Immich (bouton OAuth, donc Pocket ID) et n'agit
# qu'avec ses droits (README du rôle).
immich_power_tools_enabled: true
# Nom public de Power Tools : le rappel OAuth (client immich de Pocket ID,
# tofu/pangolin_config/pocket_id.tf) et la route Pangolin portent le même.
immich_power_tools_domain: power-tools.sylvain.cloud
# Recherche « Find » de Power Tools (analyse de la requête), par la passerelle
# IA de Pangolin au format OpenAI. Clé virtuelle lue dans le state de
# tofu/pangolin_config par pi.yml ; vide, Power Tools tourne sans IA.
immich_power_tools_ai_api_key: ""
immich_power_tools_ai_base_url: https://ia.sylvain.cloud/v1
immich_power_tools_ai_model: claude-haiku-5-5
# Rotation : docs/runbooks/mot-de-passe-base.md (Postgres ignore POSTGRES_PASSWORD une fois initialisé).
immich_db_password: ""
# Compte et base d'Immich (.env, dump borgmatic, rôle de Power Tools).
immich_db_username: postgres
immich_db_name: immich
# Rôle PostgreSQL de Power Tools : SELECT seulement, transactions en lecture
# seule (tasks/main.yml). Mot de passe dérivé de celui de la base, comme
# Valkey : pas de clé SOPS de plus, la tâche le repose à chaque déploiement.
immich_power_tools_db_username: power_tools
immich_power_tools_db_password: "{{ (immich_db_password ~ ':immich-power-tools') | hash('sha256') }}"
# Mot de passe de Valkey (requirepass), dérivé du mot de passe de la base :
# pas de clé SOPS de plus. Hex SHA-256, sans caractère à échapper dans le .env
# ni dans la commande du conteneur. Change avec immich_db_password (sa rotation
# redémarre la pile, qui relit les deux).
immich_redis_password: "{{ (immich_db_password ~ ':immich-valkey') | hash('sha256') }}"
# Postgres (5432) et Valkey (6379) sont publiés sur la boucle locale : rien
# hors du Pi ne les lit d'ordinaire (borgmatic passe par docker exec). Le
# worker distant du poste (compose/immich/README.md) les veut sur le LAN :
# -e immich_remote_worker=true -e immich_remote_worker_ip=<IP du poste> le
# temps du rattrapage, puis un run sans pour les refermer. Un booléen plutôt
# qu'une adresse d'écoute : une IP mal tapée empêcherait la base de démarrer,
# et Immich avec.
immich_remote_worker: false
# IP LAN du poste qui fait tourner le worker distant : la seule source que la
# chaîne DOCKER-USER laisse passer vers 5432 et 6379 tant que
# immich_remote_worker est vrai (les ports publiés par Docker contournent ufw).
immich_remote_worker_ip: ""
# Dérivée, ne pas la définir : l'IP LAN du Pi (comme blocky_lan_ip) ou 127.0.0.1.
immich_db_bind_address: "{{ ansible_facts['default_ipv4']['address'] if immich_remote_worker | bool else '127.0.0.1' }}"

# Backup (borgmatic)
immich_backup_enabled: true
immich_backup_borgmatic_target: "{{ backup_storage_box_url }}/immich"
# Ancien nom de la passphrase, encore lu s'il est défini (host_vars).
immich_backup_encryption_passphrase: "{{ immich_backup_borgmatic_password | default(backup_passphrase) }}"
immich_backup_healthcheck_url: ""

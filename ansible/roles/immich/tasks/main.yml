---
- name: Ensure immich app folders exist
  loop:
    - "{{ immich_base_path }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0755"

- name: Ensure immich app folders exist
  become: true
  loop:
    - "{{ immich_base_path }}/library"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"

- name: Template compose configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ immich_base_path }}/{{ item.dest }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  loop:
    - src: "compose.yaml"
      dest: "compose.yaml"
    - src: "env.j2"
      dest: ".env"
  notify: Restart immich service

- name: Ensure immich service is running (user systemd)
  ansible.builtin.systemd:
    name: dc@immich
    scope: user
    state: started
    enabled: true
    daemon_reload: true

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for immich
  when: immich_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: immich
    borgmatic_app_target: "{{ immich_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ immich_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ immich_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ immich_base_path }}/library"
      - "{{ immich_base_path }}/compose.yaml"
      - "{{ immich_base_path }}/.env"
      - "{{ immich_base_path }}/timelapse_output"
      - "{{ immich_base_path }}/timelapse_config"
    borgmatic_app_postgresql_databases:
      - container: immich_postgres
        name: immich
        username: postgres
        password: "{{ immich_db_password }}"

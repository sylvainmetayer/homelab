---
- name: Ensure immich app folders exist
  loop:
    - "{{ immich_base_path }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0700"

- name: Ensure immich app folders exist
  become: true
  loop:
    - "{{ immich_base_path }}/library"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0700"

# Avant le compose : la règle est en place avant que les ports s'ouvrent.
- name: Restrict the LAN ports to the remote worker
  when: immich_remote_worker | bool
  ansible.builtin.import_tasks: remote_worker.yml

- name: Template compose configuration
  diff: false
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ immich_base_path }}/{{ item.dest }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  loop:
    - src: "compose.yaml"
      dest: "compose.yaml"
    - src: "env.j2"
      dest: ".env"
  notify: Restart immich service

# Porte la clé d'API d'Immich Swipe ; monté seulement si elle est définie
# (compose.yaml).
- name: Template the Immich Swipe nginx configuration
  when: immich_swipe_preconfigured | bool
  diff: false
  ansible.builtin.template:
    src: immich-swipe.conf.j2
    dest: "{{ immich_base_path }}/immich-swipe.conf"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"
  notify: Restart immich service

# Clé retirée : le compose ne monte plus le fichier, qui la porterait encore.
- name: Remove the Immich Swipe nginx configuration without its key
  when: not immich_swipe_preconfigured | bool
  ansible.builtin.file:
    path: "{{ immich_base_path }}/immich-swipe.conf"
    state: absent

- name: Ensure immich service is running (user systemd)
  ansible.builtin.systemd:
    name: dc@immich
    scope: user
    state: started
    enabled: true
    daemon_reload: true

# Rôle PostgreSQL de Power Tools, avant le redémarrage du handler qui lui
# donne ce compte. Conteneur absent (Molecule) : rien ; présent mais pas
# healthy au bout de 5 min : échec, plutôt qu'un Power Tools sans base.
- name: Wait for the Immich database
  when: immich_power_tools_enabled | bool
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{' }}.State.Health.Status{{ '}}' }}", immich_postgres]
  register: immich_db_health
  until: immich_db_health.rc != 0 or immich_db_health.stdout == 'healthy'
  retries: 30
  delay: 10
  changed_when: false
  failed_when: immich_db_health.rc == 0 and immich_db_health.stdout != 'healthy'
  check_mode: false

# SQL par stdin : le mot de passe n'est ni dans la commande ni dans le
# journal. Les privilèges par défaut couvrent les tables que les migrations
# d'Immich créeront ; le GRANT, celles d'aujourd'hui.
- name: Give Power Tools a read-only PostgreSQL role
  when:
    - immich_power_tools_enabled | bool
    - immich_db_health.rc == 0
  no_log: true
  ansible.builtin.command:
    argv: [docker, exec, -i, immich_postgres, psql, -X, -q, -v, ON_ERROR_STOP=1, -U, "{{ immich_db_username }}", -d, "{{ immich_db_name }}"]
    stdin: |
      DO $$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ immich_power_tools_db_username }}') THEN
          CREATE ROLE {{ immich_power_tools_db_username }};
          RAISE NOTICE 'role created';
        END IF;
      END
      $$;
      ALTER ROLE {{ immich_power_tools_db_username }} WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '{{ immich_power_tools_db_password }}';
      ALTER ROLE {{ immich_power_tools_db_username }} SET default_transaction_read_only = on;
      GRANT SELECT ON ALL TABLES IN SCHEMA public TO {{ immich_power_tools_db_username }};
      ALTER DEFAULT PRIVILEGES FOR ROLE {{ immich_db_username }} IN SCHEMA public GRANT SELECT ON TABLES TO {{ immich_power_tools_db_username }};
  register: immich_power_tools_db_role
  changed_when: "'role created' in immich_power_tools_db_role.stderr"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for immich
  when: immich_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: immich
    borgmatic_app_target: "{{ immich_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ immich_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ immich_backup_healthcheck_url }}"
    borgmatic_app_source_directories:
      - "{{ immich_base_path }}/library"
      - "{{ immich_base_path }}/compose.yaml"
      - "{{ immich_base_path }}/.env"
      - "{{ immich_base_path }}/timelapse_output"
      - "{{ immich_base_path }}/timelapse_config"
    borgmatic_app_postgresql_databases:
      - container: immich_postgres
        name: "{{ immich_db_name }}"
        username: "{{ immich_db_username }}"
        password: "{{ immich_db_password }}"

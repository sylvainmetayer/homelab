---
- name: Ensure immich app folders exist
  loop:
    - "{{ immich_base_path }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0755"

- name: Ensure immich app folders exist
  become: true
  loop:
    - "{{ immich_base_path }}/library"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"

- name: Template compose configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ immich_base_path }}/{{ item.dest }}"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0640"
  loop:
    - src: "compose.yaml"
      dest: "compose.yaml"
    - src: "env.j2"
      dest: ".env"
  notify: Restart immich service

- name: Ensure immich service is running (user systemd)
  ansible.builtin.systemd:
    name: dc@immich
    scope: user
    state: started
    enabled: true
    daemon_reload: true

# POSTGRES_PASSWORD only initialises an empty data directory: changing
# immich_db_password afterwards leaves postgres on the old password, and the
# first thing to break is the borgmatic pg_dump, which authenticates over TCP
# with the new one - the app keeps running until its next restart. So the
# password is converged here instead: check it the way pg_dump uses it, and
# set it through the container's local socket (trust auth) when it no longer
# opens the database. Rotating it is then: change it in secrets.sops.yaml and
# run the playbook. See issue #96.
- name: Keep the postgres password in sync with immich_db_password
  when: not ansible_check_mode
  block:
    - name: Wait for the immich database to accept connections
      ansible.builtin.command: docker exec immich_postgres pg_isready -U postgres -d immich
      register: immich_db_ready
      until: immich_db_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false

    - name: Check that immich_db_password opens the database over TCP
      ansible.builtin.command: docker exec --env PGPASSWORD immich_postgres psql -h 127.0.0.1 -U postgres -d immich -tAc "SELECT 1"
      environment:
        PGPASSWORD: "{{ immich_db_password }}"
      register: immich_db_password_check
      changed_when: false
      failed_when:
        - immich_db_password_check.rc != 0
        - "'password authentication failed' not in immich_db_password_check.stderr"

    # The password reaches psql as a variable (`:'pw'` quotes it), never on a
    # command line where `ps` or the Ansible log would show it.
    - name: Set the postgres password to immich_db_password
      when: immich_db_password_check.rc != 0
      ansible.builtin.command:
        cmd: >-
          docker exec -i --env IMMICH_DB_PASSWORD immich_postgres
          sh -c 'psql -U postgres -d immich -v ON_ERROR_STOP=1 -v pw="$IMMICH_DB_PASSWORD"'
        stdin: "ALTER ROLE postgres WITH PASSWORD :'pw';"
      environment:
        IMMICH_DB_PASSWORD: "{{ immich_db_password }}"
      changed_when: true
      no_log: true
      notify: Restart immich service

- name: Configure borgmatic backup for immich
  when: immich_backup_enabled
  tags: backup
  block:
    - name: Create borgmatic configuration for immich
      become: true
      ansible.builtin.template:
        src: "templates/borgmatic-immich.yaml.j2"
        dest: "{{ borgmatic_config_dir | default('/etc/borgmatic.d') }}/immich.yaml"
        owner: root
        group: root
        mode: "0600"

    - name: Initialize borg repository for immich
      become: true
      ansible.builtin.command:
        cmd: >-
          /root/.local/bin/borgmatic --config {{ borgmatic_config_dir | default('/etc/borgmatic.d') }}/immich.yaml
          repo-create --encryption {{ borgmatic_encryption_mode | default('repokey-blake2') }}
      register: immich_borg_repo_create
      changed_when: "'repository already exists' not in immich_borg_repo_create.stderr"
      failed_when: immich_borg_repo_create.rc != 0 and 'repository already exists' not in immich_borg_repo_create.stderr

---
services:
  app:
    # Image de démo du site de Neonova (dépôt privé sylvainmetayer/neonova-services,
    # package public), publiée par sa CI à chaque push sur main. Renovate épingle
    # et met à jour le digest : dc@ ne retélécharge jamais un tag déjà présent.
    image: ghcr.io/sylvainmetayer/neonova-services:main@sha256:b7a7444fbbbaa0931cb3114d4171765d2b630b246221d77d1409c73b1e8d8dee
    container_name: neonova
    # nginx sur des fichiers statiques, à deux processus environ.
    mem_limit: 64m
    # nginx-unprivileged n'écrit que son pid et ses fichiers temporaires dans /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Seul conteneur du projet : pas de réseau privé, newt suffit.
    networks:
      - newt

networks:
  newt:
    external: true

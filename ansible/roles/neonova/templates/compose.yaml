---
services:
  app:
    # Image de démo du site de Neonova (dépôt privé sylvainmetayer/neonova-services,
    # package public). Elle suit le tag main, sans digest, exprès : le workflow
    # de ce dépôt lance le déploiement à la fin de chaque build, et le rôle
    # redémarre dc@, qui retélécharge l'image grâce à pull_policy: always.
    image: ghcr.io/sylvainmetayer/neonova-services:main
    pull_policy: always
    container_name: neonova
    # nginx sur des fichiers statiques, à deux processus environ.
    mem_limit: 64m
    # nginx-unprivileged n'écrit que son pid et ses fichiers temporaires dans /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # Seul conteneur du projet : pas de réseau privé, newt suffit.
    networks:
      - newt

networks:
  newt:
    external: true

---
# Site statique sans donnée : aucune sauvegarde, tout est dans l'image.
- name: Ensure Neonova folder exists
  ansible.builtin.file:
    mode: "0700"
    path: "{{ neonova_base_path }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  diff: false
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ neonova_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Redémarré à chaque passage : c'est ce qui prend la nouvelle image du tag main
# (pull_policy: always). changed_when false : ce n'est pas une dérive à signaler.
- name: Restart neonova to follow the main tag
  changed_when: false
  ansible.builtin.systemd:
    state: restarted
    daemon_reload: true
    name: dc@neonova
    scope: user
    enabled: true

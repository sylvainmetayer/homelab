---
- name: Ensure Monica v4 app folder exists
  loop:
    - path: "{{ monica_v4_base_path }}"
      user: "{{ ansible_facts['user_id'] }}"
      group: "{{ ansible_facts['user_gid'] }}"
    - path: "{{ monica_v4_base_path }}/data"
      user: "www-data"
      group: "www-data"
    - path: "{{ monica_v4_base_path }}/db_data"
      user: "{{ ansible_facts['user_id'] }}"
      group: "{{ ansible_facts['user_gid'] }}"
  become: true
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.group }}"

- name: Template compose configuration
  notify: Restart monica_v4
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ monica_v4_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Monica v4
  when: monica_v4_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: monica_v4
    borgmatic_app_title: Monica v4
    borgmatic_app_label: monica-backup
    borgmatic_app_target: "{{ monica_v4_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ monica_v4_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ monica_v4_backup_healthcheck_url }}"
    # Pas db_data : la base MariaDB n'héberge que la base monica, que le dump
    # couvre ; copié à chaud, son dossier n'est pas cohérent.
    borgmatic_app_source_directories:
      - "{{ monica_v4_base_path }}/data"
      - "{{ monica_v4_base_path }}/compose.yaml"
      - "{{ monica_v4_base_path }}/.env"
    borgmatic_app_mysql_databases:
      - container: monica_v4_db
        name: monica
        username: monica
        password: "{{ monica_v4_db_password }}"

- name: Make sure monica_v4 service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@monica_v4
    scope: user
    enabled: true

- name: Configure monica_v4 cron
  ansible.builtin.import_tasks: cron.yaml

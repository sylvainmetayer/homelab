---
- name: Ensure Monica v4 app folder exists
  loop:
    - path: "{{ monica_v4_base_path }}"
      user: "{{ ansible_facts['user_id'] }}"
      group: "{{ ansible_facts['user_gid'] }}"
    - path: "{{ monica_v4_base_path }}/data"
      user: "www-data"
      group: "www-data"
    - path: "{{ monica_v4_base_path }}/db_data"
      user: "{{ ansible_facts['user_id'] }}"
      group: "{{ ansible_facts['user_gid'] }}"
  become: true
  ansible.builtin.file:
    mode: "0700"
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.user }}"
    group: "{{ item.group }}"

- name: Template compose configuration
  diff: false
  notify: Restart monica_v4
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ monica_v4_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Sans APP_KEY, Laravel ne déchiffre plus rien de ce qu'il a chiffré en base :
# refuser d'écrire un .env sans les clés SOPS plutôt que d'écraser le bon.
- name: Check Monica v4 secrets
  ansible.builtin.assert:
    quiet: true
    that:
      - monica_v4_app_key | length > 0
      - monica_v4_hash_salt | length > 0
      - monica_v4_db_password | length > 0
    fail_msg: >-
      monica_v4_app_key, monica_v4_hash_salt ou monica_v4_db_password vide :
      clé absente de ansible/secrets.sops.yaml ?

# Lu dans docker plutôt qu'épinglé, comme nextcloud et flip_planning : docker
# choisit le sous-réseau à la création du réseau.
- name: Read the newt network definition for Monica v4
  when: not monica_v4_trusted_proxies
  changed_when: false
  # Lecture seule : aussi en --check, sinon le set_fact suivant n'a rien.
  check_mode: false
  ansible.builtin.command:
    cmd: "docker network inspect {{ monica_v4_newt_network }}"
  register: monica_v4_newt_network_info

- name: Use the newt subnets as Monica v4's trusted proxies
  when: not monica_v4_trusted_proxies
  ansible.builtin.set_fact:
    monica_v4_trusted_proxies: >-
      {{ (monica_v4_newt_network_info.stdout | from_json)[0].IPAM.Config | default([], true)
         | map(attribute='Subnet', default='') | select | list }}

- name: Check Monica v4's trusted proxies
  ansible.builtin.assert:
    quiet: true
    that:
      - monica_v4_trusted_proxies | length > 0
      - monica_v4_trusted_proxies | reject('match', '^[0-9A-Fa-f:.]+(/[0-9]{1,3})?$') | list | length == 0
    fail_msg: >-
      monica_v4_trusted_proxies vide ou invalide ({{ monica_v4_trusted_proxies }}) :
      le réseau {{ monica_v4_newt_network }} ne déclare aucun sous-réseau IPAM,
      ou la valeur fixée à la main n'est pas une liste d'adresses ou de CIDR.

- name: Template Monica v4 environment
  diff: false
  notify: Restart monica_v4
  ansible.builtin.template:
    src: "templates/env.j2"
    dest: "{{ monica_v4_base_path }}/.env"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0600"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Monica v4
  when: monica_v4_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: monica_v4
    borgmatic_app_title: Monica v4
    borgmatic_app_label: monica-backup
    borgmatic_app_target: "{{ monica_v4_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ monica_v4_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ monica_v4_backup_healthcheck_url }}"
    # Pas db_data : la base MariaDB n'héberge que la base monica, que le dump
    # couvre ; copié à chaud, son dossier n'est pas cohérent.
    borgmatic_app_source_directories:
      - "{{ monica_v4_base_path }}/data"
      - "{{ monica_v4_base_path }}/compose.yaml"
      - "{{ monica_v4_base_path }}/.env"
    borgmatic_app_mysql_databases:
      - container: monica_v4_db
        name: monica
        username: monica
        password: "{{ monica_v4_db_password }}"

- name: Make sure monica_v4 service is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: dc@monica_v4
    scope: user
    enabled: true

- name: Configure monica_v4 cron
  ansible.builtin.import_tasks: cron.yaml

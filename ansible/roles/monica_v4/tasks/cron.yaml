---
# URL push du moniteur (jeton) : lue par curl (-K), jamais sur sa ligne de
# commande. Relue à chaque passage : rien à redémarrer.
- name: Write the push URL of the monica_v4 cron
  diff: false
  no_log: true
  ansible.builtin.copy:
    content: "url = {{ monica_v4_cron_healthcheck_url | to_json }}\n"
    dest: "{{ monica_v4_cron_push_config }}"
    group: "{{ ansible_facts['user_gid'] }}"
    owner: "{{ ansible_facts['user_uid'] }}"
    mode: "0600"

- name: Copy monica_v4 cron service
  notify: Restart monica_v4 cron
  diff: false
  ansible.builtin.template:
    src: ./templates/monica_v4.cron.service.j2
    dest: ~/.config/systemd/user/monica_v4_cron.service
    group: "{{ ansible_facts['user_gid'] }}"
    owner: "{{ ansible_facts['user_uid'] }}"
    mode: "0600"

- name: Copy monica_v4 cron timer
  notify: Restart monica_v4 cron
  ansible.builtin.template:
    src: ./templates/monica_v4.cron.timer.j2
    dest: ~/.config/systemd/user/monica_v4_cron.timer
    group: "{{ ansible_facts['user_gid'] }}"
    owner: "{{ ansible_facts['user_uid'] }}"
    mode: "0600"

- name: Make sure monica_v4 cron timer is running
  ansible.builtin.systemd:
    state: started
    daemon_reload: true
    name: monica_v4_cron.timer
    scope: user
    enabled: true

---
# Avant les paquets : logwatch dépend d'un MTA, et sans msmtp-mta déjà en place
# apt lui donne exim4 (un démon SMTP local).
- name: Configure the mail relay
  ansible.builtin.import_tasks: mta.yml
  when: security_mta_enabled | bool

- name: Install security packages
  ansible.builtin.apt:
    name:
      - fail2ban
      - ufw
      - unattended-upgrades
      - apt-listchanges
      - auditd
      - logwatch
      # Image Packer de Pangolin (cloud-init rejoué au déploiement).
      - cloud-init
    state: present

# Rapports quotidiens pleins de faux positifs sur un hôte Docker.
- name: Remove rkhunter
  ansible.builtin.apt:
    name: rkhunter
    state: absent
    purge: true

- name: Harden the system and sshd with devsec.hardening
  ansible.builtin.import_tasks: devsec.yml
  when: security_devsec_enabled | bool

- name: Harden sshd without devsec.hardening
  ansible.builtin.import_tasks: legacy.yml
  when: not (security_devsec_enabled | bool)

# Avec ou sans devsec. Écrit sans être chargé : systemd-sysctl l'applique au
# prochain boot. Voulu : disable_ipv6 à chaud retirerait l'IPv6 du bridge
# Docker de Pangolin déjà monté, et le scénario Molecule protège ainsi les
# sysctls globaux du noyau du runner CI (molecule/security/prepare.yml). Sous
# devsec, réduit à disable_ipv6 : aucune clé commune avec 90-dev-sec.conf, qu'il
# ne peut donc pas masquer (fs.suid_dumpable vient de devsec, fs.file-max n'est
# plus fixé). Pour l'appliquer tout de suite : `sudo sysctl --system`.
- name: Configure the boot-time sysctl file
  ansible.builtin.template:
    src: sysctl_hardening.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    # Lu par systemd-sysctl (root) seulement.
    mode: "0600"

- name: Configure fail2ban
  notify: Restart fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"

- name: Configure unattended-upgrades
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow required ports in UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ security_ufw_allowed_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Enable security services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - fail2ban
    - auditd
    - ufw

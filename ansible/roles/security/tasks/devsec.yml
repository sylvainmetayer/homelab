---
# devsec.hardening, partiel : chaque écart à ses défauts est un réglage qui
# casserait Docker, le NAT de Pangolin, le bastion ProxyJump, gerbil ou les
# sauvegardes. Le détail est dans l'issue #108.
#
# Gardé tel quel, et à savoir : os_hardening ajoute sur Debian
# kernel.unprivileged_userns_clone=0 et kernel.unprivileged_bpf_disabled=1
# (vars/Debian.yml de devsec). Docker (root) n'en a pas besoin ; un conteneur
# qui créerait ses propres user namespaces sans privilège (Chromium
# sandboxé, outillage rootless) ne le pourrait plus.

# os_hardening recharge son sysctl dès qu'il l'écrit : une valeur fausse ici
# coupe le réseau des conteneurs (et, sur Pangolin, la sortie de flip) avant
# même la fin du play.
- name: Refuse a sysctl overwrite that would cut Docker or the NAT
  vars:
    security_devsec_sysctl: "{{ security_devsec_sysctl_overwrite | combine(security_devsec_sysctl_host) }}"
  ansible.builtin.assert:
    that:
      - security_devsec_sysctl['net.ipv4.ip_forward'] | int == 1
      - security_devsec_sysctl['net.ipv4.conf.all.rp_filter'] | int != 1
      - security_devsec_sysctl['net.ipv4.conf.default.rp_filter'] | int != 1
      # Réseau compose `pangolin` en enable_ipv6 : 0 couperait son forward IPv6.
      - security_devsec_sysctl['net.ipv6.conf.all.forwarding'] | int == 1
      - security_devsec_sysctl['net.ipv6.conf.default.forwarding'] | int == 1
    fail_msg: >-
      security_devsec_sysctl_overwrite doit garder net.ipv4.ip_forward et le
      forwarding IPv6 à 1 (Docker, NAT) et rp_filter lâche (2) ou désactivé (0) :
      {{ security_devsec_sysctl }}
    quiet: true

- name: Apply devsec os_hardening
  when: security_os_hardening_enabled | bool
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening
    # Un include ne transmet pas les tags du rôle à ses tâches : sans `always`,
    # `--tags security` sauterait tout devsec. L'include lui-même porte les
    # tags de l'entrée `security` du playbook, il n'est donc pas lancé par
    # `--tags <autre rôle>`.
    apply:
      tags: [always]
  vars:
    security_devsec_sysctl: "{{ security_devsec_sysctl_overwrite | combine(security_devsec_sysctl_host) }}"
    sysctl_overwrite: "{{ security_devsec_sysctl }}"
    os_filesystem_whitelist: "{{ security_filesystem_whitelist }}"
    # keep_logs ne supprime jamais rien : les journaux d'audit rempliraient le
    # disque de Docker, puis auditd suspendrait le système (disk_full_action).
    os_auditd_max_log_file_action: ROTATE
    # sudo est en NOPASSWD (cloud-init) : le mot de passe de sylvain ne sert
    # qu'à la console Hetzner, inutile de le faire expirer tous les 60 jours.
    os_user_pw_ageing: false
    # 027 rendrait illisibles pour les conteneurs non root les fichiers que des
    # tâches créent sans `mode:` explicite.
    os_env_umask: "022"
    # hidepid=2 sans gid gêne polkit/logind ; le reste de minimize_access
    # (permissions, /dev/shm noexec…) est gardé.
    hidepid_option: "0"
    # IPv6 est désactivé (sysctl ci-dessus).
    ufw_enable_ipv6: false

# Vide, devsec n'écrirait aucun HostKey (sshd reprendrait ses clés par défaut)
# et la tâche plus bas supprimerait toutes les clés d'hôte : sshd ne
# redémarrerait plus.
- name: Refuse an sshd without any host key
  ansible.builtin.assert:
    that:
      - security_ssh_host_keys | length > 0
      - security_ssh_host_keys is not string
    fail_msg: "security_ssh_host_keys doit lister au moins une clé d'hôte : {{ security_ssh_host_keys }}"
    quiet: true

- name: Apply devsec ssh_hardening
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
    # `always` : cf. os_hardening ci-dessus.
    apply:
      tags: [always]
  vars:
    network_ipv6_enable: false
    # Sinon /etc/ssh/ssh_config est réécrit : c'est le client SSH de borgmatic
    # vers la Storage Box (port 23).
    ssh_client_hardening: false
    ssh_allow_users: "{{ security_ssh_allow_users }}"
    ssh_max_auth_retries: "{{ security_ssh_max_auth_tries }}"
    ssh_allow_tcp_forwarding: "{{ security_ssh_allow_tcp_forwarding }}"
    ssh_allow_agent_forwarding: "{{ security_ssh_allow_agent_forwarding }}"
    # Fournis, ces cinq-là remplacent les listes que devsec choisirait selon
    # la version d'OpenSSH (vars/main.yml de devsec). ssh_host_key_files fourni
    # saute aussi sa tâche de clés d'hôte, qui aurait régénéré la clé RSA.
    ssh_kex: "{{ security_ssh_kex }}"
    ssh_ciphers: "{{ security_ssh_ciphers }}"
    ssh_macs: "{{ security_ssh_macs }}"
    ssh_host_key_files: "{{ security_ssh_host_keys }}"
    ssh_host_key_algorithms: "{{ security_ssh_key_algorithms }}"
    # Sans variable devsec : écrits en tête de son sshd_config (la première
    # valeur l'emporte), pas dans un drop-in.
    sshd_custom_options:
      - PubkeyAcceptedAlgorithms {{ security_ssh_key_algorithms | join(',') }}
      - CASignatureAlgorithms {{ security_ssh_ca_signature_algorithms | join(',') }}
      - RequiredRSASize {{ security_ssh_required_rsa_size }}

# Ce que la tâche de clés d'hôte de devsec, sautée ci-dessus, faisait aussi :
# root:root 0600 sur chaque clé privée offerte.
- name: Restrict the SSH host private keys
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ security_ssh_host_keys }}"

# Après le sshd_config de devsec, qui ne les cite plus : le sshd en cours les a
# en mémoire jusqu'à son redémarrage (handler de devsec). Une clé supprimée
# change ce que voit un client qui l'avait épinglée, d'où la liste des clients
# dans docs/runbooks/ssh-refuse-apres-durcissement.md.
- name: Find the SSH host keys sshd no longer offers
  ansible.builtin.find:
    paths: /etc/ssh
    patterns:
      - ssh_host_*_key
      - ssh_host_*_key.pub
  register: security_ssh_host_key_files

- name: Remove the SSH host keys sshd no longer offers
  vars:
    security_ssh_kept_host_key_files: >-
      {{ security_ssh_host_keys + security_ssh_host_keys | map('regex_replace', '$', '.pub') | list }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ security_ssh_host_key_files.files | map(attribute='path')
       | reject('in', security_ssh_kept_host_key_files) | sort }}

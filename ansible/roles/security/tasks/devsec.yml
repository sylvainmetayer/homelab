---
# devsec.hardening, partiel : chaque écart à ses défauts est un réglage qui
# casserait Docker, le NAT de Pangolin, le bastion ProxyJump, gerbil ou les
# sauvegardes. Le détail est dans l'issue #108.
#
# Gardé tel quel, et à savoir : os_hardening ajoute sur Debian
# kernel.unprivileged_userns_clone=0 et kernel.unprivileged_bpf_disabled=1
# (vars/Debian.yml de devsec). Docker (root) n'en a pas besoin ; un conteneur
# qui créerait ses propres user namespaces sans privilège (Chromium
# sandboxé, outillage rootless) ne le pourrait plus.
#
# Pas de retour arrière automatique : repasser security_devsec_enabled à false
# réécrit le drop-in maison, mais le sshd_config de devsec (sans Include de
# sshd_config.d) et /etc/sysctl.d/90-dev-sec.conf restent. Les remettre à la
# main (sshd_config du paquet : /usr/share/openssh/sshd_config).

# os_hardening recharge son sysctl dès qu'il l'écrit : une valeur fausse ici
# coupe le réseau des conteneurs (et, sur Pangolin, la sortie de flip) avant
# même la fin du play.
- name: Refuse a sysctl overwrite that would cut Docker or the NAT
  ansible.builtin.assert:
    that:
      - security_devsec_sysctl_overwrite['net.ipv4.ip_forward'] | int == 1
      - security_devsec_sysctl_overwrite['net.ipv4.conf.all.rp_filter'] | int != 1
      - security_devsec_sysctl_overwrite['net.ipv4.conf.default.rp_filter'] | int != 1
      # Réseau compose `pangolin` en enable_ipv6 : 0 couperait son forward IPv6.
      - security_devsec_sysctl_overwrite['net.ipv6.conf.all.forwarding'] | int == 1
      - security_devsec_sysctl_overwrite['net.ipv6.conf.default.forwarding'] | int == 1
    fail_msg: >-
      security_devsec_sysctl_overwrite doit garder net.ipv4.ip_forward et le
      forwarding IPv6 à 1 (Docker, NAT) et rp_filter lâche (2) ou désactivé (0) :
      {{ security_devsec_sysctl_overwrite }}
    quiet: true

- name: Apply devsec os_hardening
  ansible.builtin.include_role:
    name: devsec.hardening.os_hardening
    # Un include ne transmet pas les tags du rôle à ses tâches : sans `always`,
    # `--tags security` sauterait tout devsec. L'include lui-même porte les
    # tags de l'entrée `security` du playbook, il n'est donc pas lancé par
    # `--tags <autre rôle>`.
    apply:
      tags: [always]
  vars:
    sysctl_overwrite: "{{ security_devsec_sysctl_overwrite }}"
    # keep_logs ne supprime jamais rien : les journaux d'audit rempliraient le
    # disque de Docker, puis auditd suspendrait le système (disk_full_action).
    os_auditd_max_log_file_action: ROTATE
    # sudo est en NOPASSWD (cloud-init) : le mot de passe de sylvain ne sert
    # qu'à la console Hetzner, inutile de le faire expirer tous les 60 jours.
    os_user_pw_ageing: false
    # 027 rendrait illisibles pour les conteneurs non root les fichiers que des
    # tâches créent sans `mode:` explicite.
    os_env_umask: "022"
    # hidepid=2 sans gid gêne polkit/logind ; le reste de minimize_access
    # (permissions, /dev/shm noexec…) est gardé.
    hidepid_option: "0"
    # IPv6 est désactivé (sysctl ci-dessus).
    ufw_enable_ipv6: false

- name: Apply devsec ssh_hardening
  ansible.builtin.include_role:
    name: devsec.hardening.ssh_hardening
    # `always` : cf. os_hardening ci-dessus.
    apply:
      tags: [always]
  vars:
    network_ipv6_enable: false
    # Sinon /etc/ssh/ssh_config est réécrit : c'est le client SSH de borgmatic
    # vers la Storage Box (port 23).
    ssh_client_hardening: false
    ssh_allow_users: "{{ security_ssh_allow_users }}"
    ssh_max_auth_retries: "{{ security_ssh_max_auth_tries }}"
    ssh_allow_tcp_forwarding: "{{ security_ssh_allow_tcp_forwarding }}"
    ssh_allow_agent_forwarding: "{{ security_ssh_allow_agent_forwarding }}"
    # Défaut devsec 4096 : sa tâche de clés d'hôte régénère la clé RSA de 3072
    # bits (défaut Debian/cloud-init), d'où un « REMOTE HOST IDENTIFICATION
    # HAS CHANGED » pour tout client qui l'a enregistrée.
    ssh_host_rsa_key_size: 3072

# devsec réécrit tout sshd_config, sans Include de sshd_config.d : le drop-in
# maison serait ignoré, autant qu'il ne laisse pas croire le contraire.
- name: Remove the in-house sshd drop-in
  notify: Reload sshd
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-custom.conf
    state: absent

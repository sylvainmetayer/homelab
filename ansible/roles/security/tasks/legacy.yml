---
# Hôtes sans devsec.hardening (security_devsec_enabled: false). Le fichier
# sysctl de boot (99-hardening.conf) est commun, dans tasks/main.yml.

- name: Configure SSH hardening
  notify: Reload sshd
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-custom.conf
    # Lu par sshd (root) seulement.
    mode: "0600"

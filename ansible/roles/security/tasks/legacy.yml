---
# Hôtes sans devsec.hardening (security_devsec_enabled: false).

- name: Configure SSH hardening
  notify: Reload sshd
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-custom.conf
    # Lu par sshd (root) seulement.
    mode: "0600"

# Écrit sans être chargé : systemd-sysctl l'applique au prochain boot. Voulu :
# les valeurs ne pressent pas, et le scénario Molecule protège ainsi les
# sysctls globaux du noyau du runner CI (molecule/security/prepare.yml).
# Pour l'appliquer tout de suite : `sudo sysctl --system`.
- name: Configure sysctl hardening
  ansible.builtin.template:
    src: sysctl_hardening.conf.j2
    dest: /etc/sysctl.d/99-hardening.conf
    # Lu par systemd-sysctl (root) seulement.
    mode: "0600"

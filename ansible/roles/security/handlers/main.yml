---
# Sans lui, jail.local n'était relu qu'au prochain démarrage de fail2ban.
- name: Restart fail2ban
  become: true
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

# Relit les générateurs : systemd-ssh-generator masqué n'est plus lancé.
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

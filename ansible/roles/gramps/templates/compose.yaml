---
services:
  grampsweb:
    mem_limit: 1g
    image: ghcr.io/gramps-project/grampsweb:26.8.1@sha256:496a97ad6a937fe73b8fed6dbf7e5a2967ab60363c240735eb3b043ca6ba715c
    container_name: grampsweb
    restart: unless-stopped
    environment:
      GRAMPSWEB_TREE: "{{ gramps_tree_name }}"
      # L'image lance 8 workers gunicorn par défaut, ~170 Mio chacun : ça
      # dépasse le mem_limit et part en boucle OOM. 2 suffisent pour un usage
      # familial.
      GUNICORN_NUM_WORKERS: "2"
      GRAMPSWEB_CELERY_CONFIG__broker_url: redis://grampsweb_redis:6379/0
      GRAMPSWEB_CELERY_CONFIG__result_backend: redis://grampsweb_redis:6379/0
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      - grampsweb_redis
    volumes:
      - ./users:/app/users
      - ./indexdir:/app/indexdir
      - ./thumbnail_cache:/app/thumbnail_cache
      - ./cache:/app/cache
      - ./secret:/app/secret
      - ./grampsdb:/root/.gramps/grampsdb
      - ./media:/app/media
      - ./tmp:/tmp
    networks:
      - gramps
      - newt

  grampsweb_celery:
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 768m
    image: ghcr.io/gramps-project/grampsweb:26.8.1@sha256:496a97ad6a937fe73b8fed6dbf7e5a2967ab60363c240735eb3b043ca6ba715c
    container_name: grampsweb_celery
    restart: unless-stopped
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2
    environment:
      GRAMPSWEB_TREE: "{{ gramps_tree_name }}"
      GRAMPSWEB_CELERY_CONFIG__broker_url: redis://grampsweb_redis:6379/0
      GRAMPSWEB_CELERY_CONFIG__result_backend: redis://grampsweb_redis:6379/0
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      - grampsweb
      - grampsweb_redis
    volumes:
      - ./users:/app/users
      - ./indexdir:/app/indexdir
      - ./thumbnail_cache:/app/thumbnail_cache
      - ./cache:/app/cache
      - ./secret:/app/secret
      - ./grampsdb:/root/.gramps/grampsdb
      - ./media:/app/media
      - ./tmp:/tmp
    networks:
      - gramps

  grampsweb_redis:
    mem_limit: 256m
    image: docker.io/valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    container_name: grampsweb_redis
    restart: unless-stopped
    volumes:
      - ./redis:/data
    networks:
      - gramps

networks:
  gramps: {}
  newt:
    external: true

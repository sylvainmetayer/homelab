---
services:
  grampsweb:
    mem_limit: 1g
    image: ghcr.io/gramps-project/grampsweb:26.9.1@sha256:ac4db1ba963f5d2604e6b9a34be50c5a2c37271699f5a6df93c9492ecc8870e5
    container_name: grampsweb
    restart: unless-stopped
    environment:
      GRAMPSWEB_TREE: "{{ gramps_tree_name }}"
      # L'image lance 8 workers gunicorn par défaut, ~170 Mio chacun : ça
      # dépasse le mem_limit et part en boucle OOM. 2 suffisent pour un usage
      # familial.
      GUNICORN_NUM_WORKERS: "2"
      GRAMPSWEB_CELERY_CONFIG__broker_url: redis://grampsweb_redis:6379/0
      GRAMPSWEB_CELERY_CONFIG__result_backend: redis://grampsweb_redis:6379/0
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      grampsweb_redis:
        condition: service_healthy
    volumes:
      - ./users:/app/users
      - ./indexdir:/app/indexdir
      - ./thumbnail_cache:/app/thumbnail_cache
      - ./cache:/app/cache
      - ./secret:/app/secret
      - ./grampsdb:/root/.gramps/grampsdb
      - ./media:/app/media
      - ./tmp:/tmp
    networks:
      - gramps
      - newt

  grampsweb_celery:
    cpus: 2.00
    cpu_shares: 512
    mem_limit: 768m
    image: ghcr.io/gramps-project/grampsweb:26.9.1@sha256:ac4db1ba963f5d2604e6b9a34be50c5a2c37271699f5a6df93c9492ecc8870e5
    container_name: grampsweb_celery
    restart: unless-stopped
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2
    environment:
      GRAMPSWEB_TREE: "{{ gramps_tree_name }}"
      GRAMPSWEB_CELERY_CONFIG__broker_url: redis://grampsweb_redis:6379/0
      GRAMPSWEB_CELERY_CONFIG__result_backend: redis://grampsweb_redis:6379/0
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://grampsweb_redis:6379/1
    depends_on:
      grampsweb:
        condition: service_started
      grampsweb_redis:
        condition: service_healthy
    volumes:
      - ./users:/app/users
      - ./indexdir:/app/indexdir
      - ./thumbnail_cache:/app/thumbnail_cache
      - ./cache:/app/cache
      - ./secret:/app/secret
      - ./grampsdb:/root/.gramps/grampsdb
      - ./media:/app/media
      - ./tmp:/tmp
    networks:
      - gramps

  grampsweb_redis:
    mem_limit: 256m
    image: docker.io/valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    container_name: grampsweb_redis
    restart: unless-stopped
    volumes:
      - ./redis:/data
    networks:
      - gramps
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  gramps: {}
  newt:
    external: true

---
- name: Ensure Gramps app folders exist
  loop:
    - "{{ gramps_base_path }}"
    - "{{ gramps_base_path }}/users"
    - "{{ gramps_base_path }}/indexdir"
    - "{{ gramps_base_path }}/thumbnail_cache"
    - "{{ gramps_base_path }}/cache"
    - "{{ gramps_base_path }}/secret"
    - "{{ gramps_base_path }}/grampsdb"
    - "{{ gramps_base_path }}/media"
    - "{{ gramps_base_path }}/tmp"
  ansible.builtin.file:
    mode: "0755"
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"

# Valkey drops to its own unprivileged uid inside the container and writes its
# dump to /data, so this bind mount has to stay owned by that uid rather than
# by the host user like the folders above. Needs become: chowning to a uid we
# do not own is not permitted otherwise.
- name: Ensure Gramps redis folder is owned by the valkey uid
  become: true
  ansible.builtin.file:
    mode: "0755"
    path: "{{ gramps_base_path }}/redis"
    state: directory
    owner: "{{ gramps_redis_uid }}"
    group: "{{ ansible_facts['user_gid'] }}"

- name: Template compose configuration
  notify: Restart gramps
  ansible.builtin.template:
    src: "templates/compose.yaml"
    dest: "{{ gramps_base_path }}/compose.yaml"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0644"

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Gramps
  when: gramps_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: gramps
    borgmatic_app_title: Gramps
    borgmatic_app_target: "{{ gramps_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ gramps_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ gramps_backup_healthcheck_url }}"
    # indexdir (index de recherche), thumbnail_cache et cache se reconstruisent
    # (réindexation depuis l'admin, vignettes et cache à la demande) : pas
    # sauvegardés.
    borgmatic_app_source_directories:
      - "{{ gramps_base_path }}/users"
      - "{{ gramps_base_path }}/secret"
      - "{{ gramps_base_path }}/grampsdb"
      - "{{ gramps_base_path }}/media"
      - "{{ gramps_base_path }}/compose.yaml"
    # Un arbre par dossier de grampsdb (nom aléatoire, d'où le glob), plus la
    # base des comptes.
    borgmatic_app_sqlite_databases:
      - "{{ gramps_base_path }}/grampsdb/*/sqlite.db"
      - "{{ gramps_base_path }}/users/*.sqlite"

- name: Make sure gramps service is {{ 'running' if gramps_enabled else 'stopped' }}
  ansible.builtin.systemd:
    state: "{{ 'started' if gramps_enabled else 'stopped' }}"
    daemon_reload: true
    name: dc@gramps
    scope: user
    enabled: "{{ gramps_enabled }}"

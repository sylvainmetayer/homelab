name: pangolin
services:
  pangolin:
    image: docker.io/fosrl/pangolin:ee-1.25.3@sha256:f2c0fc54e1b59efcd23b8685e8df84350f363e14ebe1c13ce88a681f181ca49e
    container_name: pangolin
    restart: unless-stopped
    environment:
      # Base en WAL (et synchronous = NORMAL, posé avec) : les journaux de
      # requêtes l'écrivent en continu, et en mode journal la copie nocturne
      # (« .backup », hook SQLite du gabarit borgmatic) recommençait à chaque
      # écriture jusqu'à « database is locked » (28/10/2026). En WAL, elle
      # passe par « VACUUM INTO », sans bloquer ni être bloquée par Pangolin.
      ENABLE_SQLITE_WAL_MODE: "true"
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:1.5.2@sha256:1f6e64eaba7997282c7067ba19922fc7e46b5f73e1a27add3dd66a591d50512f
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
    ports:
      - 51820:51820/udp
      - 21820:21820/udp
      - 443:443
      - 80:80

  traefik:
    image: docker.io/traefik:v3.7.16@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/letsencrypt:/letsencrypt
      - ./config/traefik/logs:/var/log/traefik
{% if pangolin_crowdsec_enabled %}

  # Agent + LAPI + AppSec (docs/runbooks/crowdsec.md). Traefik n'en dépend
  # pas (pas de depends_on) : le bouncer laisse passer tant que CrowdSec est
  # injoignable, un CrowdSec en panne ne coupe pas Pangolin. Aucun port publié :
  # LAPI (8080) et AppSec (7422) ne servent que Traefik, sur le réseau pangolin.
  crowdsec:
    image: {{ pangolin_crowdsec_image }}
    container_name: crowdsec
    restart: unless-stopped
    # L'image n'enregistre BOUNCER_KEY_traefik que si aucun bouncer « traefik »
    # n'existe : après un changement de la clé SOPS, la LAPI garderait
    # l'ancienne, AppSec répondrait 401 et le plugin, qui bloque sur toute
    # réponse inattendue, refuserait toutes les requêtes (403). Le bouncer est
    # donc supprimé avant chaque démarrage, et l'image le recrée avec la clé
    # courante. Avec lui, les « traefik@<IP> » que la LAPI crée d'elle-même
    # quand la même clé arrive d'une autre IP (gerbil recréé) : ils gardent
    # l'empreinte de l'ancienne clé, qui resterait valide après une rotation.
    # Premier démarrage : pas encore de configuration, cscli échoue sans
    # conséquence. $$ : échappement de l'interpolation de compose. grep -o
    # plutôt qu'une ligne entière : JSON indenté ou compact, champ « name »
    # n'importe où dans l'objet (une version de cscli qui change la mise en
    # forme ne doit pas arrêter la suppression sans bruit).
    entrypoint:
      - /bin/bash
      - -c
      - >-
        for b in $$(cscli bouncers list -o json 2>/dev/null
        | grep -o '"name": *"traefik\(@[^"]*\)\{0,1\}"'
        | sed 's/.*"\(traefik[^"]*\)"$$/\1/');
        do cscli bouncers delete "$$b" >/dev/null 2>&1; done;
        exec /bin/bash /docker_start.sh
    environment:
      COLLECTIONS: "{{ pangolin_crowdsec_collections | join(' ') }}"
      PARSERS: "{{ pangolin_crowdsec_parsers | join(' ') }}"
      BOUNCER_KEY_traefik: "{{ pangolin_crowdsec_bouncer_key }}"
      # Ni ENROLL_KEY ni ENROLL_INSTANCE_NAME : pas d'inscription à la console.
      # La liste de blocage communautaire (CAPI) reste active, par défaut.
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: {{ pangolin_crowdsec_mem_limit }}
    volumes:
      - {{ pangolin_crowdsec_dir }}/config:/etc/crowdsec
      - {{ pangolin_crowdsec_dir }}/data:/var/lib/crowdsec/data
      # Fichiers du rôle, en lecture seule par-dessus /etc/crowdsec.
{% for file in pangolin_crowdsec_local_files %}
      - {{ pangolin_crowdsec_dir }}/local/{{ file.src }}:/etc/crowdsec/{{ file.dest }}:ro
{% endfor %}
      - ./config/traefik/logs:/var/log/traefik:ro
{% endif %}

networks:
  default:
    driver: bridge
    name: pangolin
    # Hôte sans IPv6 (ipv6_enabled = false dans tofu/pangolin) : avec ufw en
    # IPV6=no, un `ufw reload` vide la table filter d'ip6tables et efface les
    # chaînes IPv6 de Docker. Le changer exige un `docker compose down`.
    enable_ipv6: false

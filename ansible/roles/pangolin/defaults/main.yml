---
pangolin_dir: /opt/pangolin

# Pangolin configuration variables
# These should be overridden in host_vars/pangolin/variables.yaml or via secrets
pangolin_dashboard_url: ""
pangolin_api_url: ""
pangolin_base_domain: ""
pangolin_log_level: "info"
pangolin_secret: ""

# Let's Encrypt email
pangolin_le_email: ""

# Les redirections de domaine sont faites par Pangolin (pangolin_redirect,
# tofu/pangolin_config/redirects.tf). Une redirection ne sert aucun fichier :
# reste ici le service worker de retrait d'un domaine redirigé, qu'un
# navigateur refuse de mettre à jour derrière une redirection (l'ancien
# resterait actif et servirait son cache). Routeur Host + Path en priorité
# 3000, au-dessus de la bande des redirections de Pangolin (1001 à 2000).
#   - name: identifiant du routeur, du middleware et du service
#     host: domaine redirigé (par Pangolin)
#     path: chemin du worker installé par l'ancien site
#     target: origine qui sert le worker de retrait, sans slash final
#     replacement: chemin, sur target, du worker qui se désinstalle
#     remove_after: date (AAAA-MM-JJ) après laquelle retirer l'entrée
pangolin_service_worker_retirements: []

# Fournisseur d'identité public (rôle pocket_id, ADR 0030) : un routeur Traefik
# direct vers son conteneur, JAMAIS une ressource Pangolin (derrière le mur SSO
# qu'il sert, personne ne pourrait se connecter) : donc ni Badger, ni filtre
# FR/DE. Vide : aucun routeur, le reste du fichier ne change pas (host_vars/
# pangolin le remplit seulement quand la clé SOPS pocket_id_encryption_key existe).
pangolin_idp_host: ""
pangolin_idp_upstream: "http://pocket-id:1411"
# Plages (séparées par des virgules) seules admises sur tout le routeur ; vide :
# le monde entier. Réglée sur home_ip tant que le premier compte administrateur
# n'existe pas (pocket_id_setup_phase, host_vars/pangolin) : /setup de Pocket ID
# est ouverte à qui arrive le premier.
pangolin_idp_allowed_ips: ""
# Débit par IP source (rateLimit de Traefik) : le login est un passkey, rien
# à deviner. Une page de Pocket ID v2 charge d'un coup une centaine de fichiers
# (_app/immutable) : 60 de rafale renvoyaient des 429 au navigateur, page
# blanche (05/11/2026).
pangolin_idp_rate_average: 50
pangolin_idp_rate_burst: 300

# SMTP configuration
pangolin_smtp_user: ""
pangolin_smtp_pass: ""

# Backup healthcheck URL loaded from Terraform state outputs.
pangolin_backup_healthcheck_url: ""

# Mise à jour hebdomadaire de GeoLite2 (géofiltre) : image officielle de
# MaxMind, compte gratuit (pangolin_maxmind_account_id et
# pangolin_maxmind_license_key dans secrets/ansible.sops.yaml). L'URL push vient de
# l'output uptime_cron_geoip_url de tofu/pangolin_config (pangolin.yaml).
pangolin_geoipupdate_image: "ghcr.io/maxmind/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d"
pangolin_geoipupdate_config_dir: /etc/geoipupdate
# Bases GeoLite2 partagées, lues en lecture seule : Country par Pangolin
# (géofiltre), City par Pocket ID (lieux du journal d'audit, rôle pocket_id).
pangolin_geoip_dir: /opt/geoip
pangolin_geoip_healthcheck_url: ""

# Copies de la base que Pangolin fait avant chaque migration
# (config/db/backups) : purgées au-delà de ce nombre de jours (tmpfiles.d).
pangolin_db_copies_retention_days: 30

# Backup (borgmatic)
pangolin_backup_enabled: true
pangolin_backup_borgmatic_target: "{{ backup_storage_box_url }}/pangolin"
pangolin_backup_encryption_passphrase: "{{ backup_passphrase }}"

# CrowdSec (docs/runbooks/crowdsec.md) : agent + LAPI dans la pile, qui lit le
# journal d'accès de Traefik, et bouncer en plugin Traefik sur l'entrypoint
# websecure (toutes les routes HTTPS, ni le port 80 ni le défi ACME).
# Retour arrière : false puis `ansible-playbook pangolin.yaml --tags pangolin`
# (middleware et plugin retirés, conteneur supprimé, données gardées sous
# pangolin_crowdsec_dir). La clé du bouncer est la clé SOPS
# pangolin_crowdsec_bouncer_key de secrets/ansible.sops.yaml.
pangolin_crowdsec_enabled: true
# WAF (AppSec) en détection seule : règles chargées hors bande, jamais de 403
# (templates/crowdsec/appsec-config.yaml.j2). false : le bouncer n'interroge
# plus AppSec, le reste de CrowdSec ne change pas.
pangolin_crowdsec_appsec_enabled: true
pangolin_crowdsec_image: "docker.io/crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4"
# Hors de {{ pangolin_dir }}/config, donc hors de la sauvegarde borgmatic :
# la base locale (alertes, décisions) et les éléments du hub se recréent au
# démarrage (CAPI, cscli hub), la configuration vient de ce rôle.
pangolin_crowdsec_dir: "{{ pangolin_dir }}/crowdsec"
pangolin_crowdsec_collections:
  - crowdsecurity/traefik
  - crowdsecurity/http-cve
  - crowdsecurity/base-http-scenarios
  - crowdsecurity/appsec-virtual-patching
  - crowdsecurity/appsec-generic-rules
# whitelists : plages privées (flip par le NAT, conteneurs Docker de l'hôte).
# nextcloud-whitelist : les 404 normaux du client WebDAV, des aperçus…
pangolin_crowdsec_parsers:
  - crowdsecurity/whitelists
  - crowdsecurity/nextcloud-whitelist
# Jamais détectées ni bloquées, en plus de home_ip (secrets/ansible.sops.yaml), de
# l'IP publique de Pangolin et des plages privées : IP ou CIDR.
pangolin_crowdsec_whitelist_extra: []
# Plafond à ~2x le pic attendu (150-250 MiB avec la liste communautaire et
# AppSec). Pas de cpus: (doctrine des limites, AGENTS.md).
pangolin_crowdsec_mem_limit: 512m
# Octets du corps transmis à AppSec. Le plugin les garde en mémoire (deux
# copies) avant de relayer la requête : 1 Mio suffit aux règles (formulaires,
# JSON), là où les 10 Mio par défaut pèseraient sur chaque envoi de fichier.
pangolin_crowdsec_appsec_body_limit: 1048576
# Journal d'accès de Traefik (JSON, lu par CrowdSec) : rotation quotidienne
# par logrotate, Traefik rouvre le fichier sur SIGUSR1.
pangolin_traefik_access_log_rotate_days: 7

# Résumé hebdomadaire de CrowdSec sur ntfy (crowdsec-summary.timer,
# files/crowdsec-summary.py, docs/runbooks/crowdsec.md) : alertes des 7
# derniers jours par scénario et par pays, décisions actives, AppSec en
# détection seule. Priorité basse, haute sur une correspondance AppSec ou un
# cscli en échec. Jeton du producteur scripts de ntfy (clé SOPS ntfy_scripts_token,
# écriture seule sur son topic) ; vide, le résumé est retiré avec un
# avertissement.
pangolin_crowdsec_summary_enabled: "{{ pangolin_crowdsec_enabled }}"
pangolin_crowdsec_summary_ntfy_url: https://ntfy.sylvain.cloud/
pangolin_crowdsec_summary_ntfy_topic: scripts
pangolin_crowdsec_summary_ntfy_token: "{{ ntfy_scripts_token | default('') }}"
pangolin_crowdsec_summary_config_dir: /etc/crowdsec-summary
pangolin_crowdsec_summary_on_calendar: "Mon *-*-* 07:30:00"

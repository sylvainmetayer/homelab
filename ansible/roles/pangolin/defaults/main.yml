---
pangolin_dir: /opt/pangolin

# Deploy Pangolin configuration files (Traefik, config.yml)
# Set to false when building Packer image (config will be deployed via cloud-init)
# Set to true when running playbook to update existing server
pangolin_deploy_config: true

# Pangolin configuration variables
# These should be overridden in host_vars/pangolin/variables.yaml or via secrets
pangolin_dashboard_url: ""
pangolin_api_url: ""
pangolin_base_domain: ""
pangolin_log_level: "info"
pangolin_secret: ""

# Let's Encrypt email
pangolin_le_email: ""

# Domaines entièrement redirigés par Traefik (301, chemin conservé par défaut), hors des
# ressources Pangolin : routeurs du fichier dynamique. Le domaine doit pointer
# vers Pangolin pour obtenir son certificat (défi HTTP).
#   - name: identifiant des routeurs/middleware (lettres, chiffres, tirets)
#     host: domaine redirigé
#     target: origine cible, sans slash final (URL complète si keep_path: false)
#     keep_path: false           # optionnel : redirige tout vers target tel quel
#     permanent: false           # optionnel : 302 au lieu de 301, cible appelée à changer
#     service_worker:            # optionnel, si l'ancien site en installait un
#       path: chemin du worker sur l'ancien site, servi sans redirection
#       replacement: chemin, sur target, d'un worker qui se désinstalle
pangolin_domain_redirects: []

# SMTP configuration
pangolin_smtp_user: ""
pangolin_smtp_pass: ""

# Backup healthcheck URL loaded from Terraform state outputs.
pangolin_backup_healthcheck_url: ""

# Backup (borgmatic)
pangolin_backup_enabled: true
pangolin_backup_borgmatic_target: ""
pangolin_backup_encryption_passphrase: ""

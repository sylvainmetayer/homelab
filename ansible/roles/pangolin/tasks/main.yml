---
- name: Create Pangolin directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  loop:
    - "{{ pangolin_dir }}"
    - "{{ pangolin_dir }}/config"
    - "{{ pangolin_dir }}/config/traefik"
    - "{{ pangolin_dir }}/config/traefik/logs"
    - "{{ pangolin_dir }}/config/letsencrypt"

# Gerbil chargeait wireguard lui-même, avec SYS_MODULE (charger n'importe quel
# module du noyau) : l'hôte le charge à sa place, au démarrage et tout de suite.
# Pas de modprobe dans un conteneur (Molecule) : il n'a pas les modules du noyau.
- name: Load the wireguard module at boot
  become: true
  ansible.builtin.copy:
    content: "wireguard\n"
    dest: /etc/modules-load.d/wireguard.conf
    mode: "0600"
    owner: root
    group: root

- name: Load the wireguard module now
  become: true
  community.general.modprobe:
    name: wireguard
    state: present
  when: ansible_facts['virtualization_type'] not in ['docker', 'podman', 'container']

- name: Create the geoipupdate configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ pangolin_geoipupdate_config_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Write the MaxMind account and license key
  become: true
  diff: false
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ pangolin_geoipupdate_config_dir }}/{{ item.name }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - { name: env, content: "{{ lookup('ansible.builtin.template', 'geoipupdate.env.j2') }}" }
    - { name: license_key, content: "{{ pangolin_maxmind_license_key }}\n" }
  loop_control:
    label: "{{ item.name }}"

# L'URL push porte le jeton du moniteur : 0600 et diff: false.
- name: Install the geoipupdate service and timer
  become: true
  diff: false
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0600"
    owner: root
    group: root
  loop:
    - geoipupdate.service
    - geoipupdate.timer

- name: Enable the weekly GeoLite2 update
  become: true
  ansible.builtin.systemd:
    name: geoipupdate.timer
    state: started
    enabled: true
    daemon_reload: true

# Premier déploiement : la base doit exister avant que Pangolin démarre.
- name: Check whether the GeoLite2 database exists
  become: true
  ansible.builtin.stat:
    path: "{{ pangolin_dir }}/config/GeoLite2-Country.mmdb"
  register: pangolin_geoip_database

- name: Download GeoLite2-Country once if it is missing
  become: true
  when: not pangolin_geoip_database.stat.exists
  ansible.builtin.systemd:
    name: geoipupdate.service
    state: started

# Journal d'accès de Traefik (traefik_config.yml), lu par CrowdSec.
- name: Install logrotate
  become: true
  ansible.builtin.apt:
    name: logrotate
    state: present

# 0600 : logrotate tourne en root, personne d'autre n'a à lire ce fichier.
- name: Rotate the Traefik access log
  become: true
  diff: false
  ansible.builtin.template:
    src: logrotate-traefik-access.j2
    dest: /etc/logrotate.d/traefik-access
    mode: "0600"
    owner: root
    group: root

# Données gardées quand pangolin_crowdsec_enabled passe à false : seul le
# conteneur disparaît (compose.yaml).
- name: Create the CrowdSec directories
  when: pangolin_crowdsec_enabled
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: root
    group: root
  loop:
    - "{{ pangolin_crowdsec_dir }}"
    - "{{ pangolin_crowdsec_dir }}/config"
    - "{{ pangolin_crowdsec_dir }}/data"
    - "{{ pangolin_crowdsec_dir }}/local"

# La liste blanche porte home_ip (secrets.sops.yaml) : diff: false.
- name: Create the CrowdSec acquisition, whitelist and AppSec files
  when: pangolin_crowdsec_enabled
  become: true
  diff: false
  notify: Restart CrowdSec
  ansible.builtin.template:
    src: "crowdsec/{{ item.src }}.j2"
    dest: "{{ pangolin_crowdsec_dir }}/local/{{ item.src }}"
    mode: "0600"
    owner: root
    group: root
  loop: "{{ pangolin_crowdsec_local_files }}"
  loop_control:
    label: "{{ item.src }}"

# Résumé quotidien sur ntfy (defaults/main.yml). Le jeton est dans un
# fichier d'environnement 0600 lu par l'unité : diff: false, jamais sur une
# ligne de commande.
- name: Warn that the CrowdSec summary has no ntfy token
  when: pangolin_crowdsec_summary_enabled | bool and not pangolin_crowdsec_summary_active | bool
  ansible.builtin.debug:
    msg: "ntfy_scripts_token vide : pas de résumé CrowdSec quotidien sur ntfy."

- name: Install the CrowdSec summary
  when: pangolin_crowdsec_summary_active | bool
  become: true
  block:
    - name: Create the CrowdSec summary configuration directory
      ansible.builtin.file:
        path: "{{ pangolin_crowdsec_summary_config_dir }}"
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Write the ntfy credentials of the CrowdSec summary
      diff: false
      no_log: true
      ansible.builtin.template:
        src: crowdsec-summary.env.j2
        dest: "{{ pangolin_crowdsec_summary_config_dir }}/env"
        mode: "0600"
        owner: root
        group: root

    - name: Install the CrowdSec summary script
      ansible.builtin.copy:
        src: crowdsec-summary.py
        dest: /usr/local/bin/crowdsec-summary
        mode: "0755"
        owner: root
        group: root

    - name: Install the CrowdSec summary service and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
        owner: root
        group: root
      loop:
        - crowdsec-summary.service
        - crowdsec-summary.timer

    - name: Enable the daily CrowdSec summary
      ansible.builtin.systemd:
        name: crowdsec-summary.timer
        state: started
        enabled: true
        daemon_reload: true

- name: Check whether a CrowdSec summary timer is installed
  when: not pangolin_crowdsec_summary_active | bool
  ansible.builtin.stat:
    path: /etc/systemd/system/crowdsec-summary.timer
  register: pangolin_crowdsec_summary_timer

# Les fichiers sont supprimés même sans timer (installation interrompue avant
# lui) : l'env porte le jeton ntfy.
- name: Remove the CrowdSec summary
  when: not pangolin_crowdsec_summary_active | bool
  become: true
  block:
    - name: Stop the daily CrowdSec summary
      when: pangolin_crowdsec_summary_timer.stat.exists
      ansible.builtin.systemd:
        name: crowdsec-summary.timer
        state: stopped
        enabled: false

    - name: Delete the CrowdSec summary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/crowdsec-summary.timer
        - /etc/systemd/system/crowdsec-summary.service
        - /usr/local/bin/crowdsec-summary
        - "{{ pangolin_crowdsec_summary_config_dir }}"

    - name: Forget the CrowdSec summary units
      when: pangolin_crowdsec_summary_timer.stat.exists
      ansible.builtin.systemd:
        daemon_reload: true

# Porte la clé du bouncer CrowdSec : diff: false. Relue par Traefik dès
# qu'elle change (fournisseur file), sans redémarrage.
- name: Create Traefik dynamic configuration
  become: true
  diff: false
  ansible.builtin.template:
    src: traefik_dynamic_config.yml.j2
    dest: "{{ pangolin_dir }}/config/traefik/dynamic_config.yml"
    mode: "0600"
    owner: root
    group: root

- name: Create Traefik configuration
  become: true
  notify: Restart Pangolin service
  ansible.builtin.template:
    src: traefik_config.yml.j2
    dest: "{{ pangolin_dir }}/config/traefik/traefik_config.yml"
    mode: "0600"
    owner: root
    group: root

- name: Create Pangolin configuration
  diff: false
  become: true
  notify: Restart Pangolin service
  ansible.builtin.template:
    src: pangolin_config.yml.j2
    dest: "{{ pangolin_dir }}/config/config.yml"
    mode: "0600"
    owner: root
    group: root

- name: Create compose.yml
  diff: false
  notify: Restart Pangolin service
  become: true
  ansible.builtin.template:
    src: compose.yaml
    dest: "{{ pangolin_dir }}/compose.yaml"
    mode: "0600"
    owner: root
    group: root

- name: Create Pangolin systemd service
  become: true
  ansible.builtin.template:
    src: pangolin.service.j2
    dest: /etc/systemd/system/pangolin.service
    mode: "0640"
    owner: root
    group: root

- name: Enable Pangolin service
  become: true
  ansible.builtin.systemd:
    name: pangolin
    enabled: true
    state: started
    daemon_reload: true

# Traefik relit dynamic_config.yml dès son écriture, la pile ne redémarre
# qu'au handler : après une rotation de pangolin_crowdsec_bouncer_key, le
# plugin présente la nouvelle clé à une LAPI qui a encore l'ancienne, AppSec
# répond 401 et toutes les routes HTTPS sont en 403. Redémarrer ici, pas en
# fin de play : la fenêtre se limite aux tâches ci-dessus, et un échec plus
# loin (borgmatic, beszel_agent) ne laisse pas la pile sur l'ancienne clé
# (sans force_handlers, les handlers notifiés ne tourneraient jamais).
- name: Restart the Pangolin stack now on a configuration change
  ansible.builtin.meta: flush_handlers

# Borgmatic backup configuration (rôle borgmatic, tasks/app.yml)
- name: Configure borgmatic backup for Pangolin
  when: pangolin_backup_enabled
  tags: backup
  ansible.builtin.include_role:
    name: borgmatic
    tasks_from: app.yml
    apply:
      tags: backup
  vars:
    borgmatic_app_name: pangolin
    borgmatic_app_title: Pangolin
    borgmatic_app_target: "{{ pangolin_backup_borgmatic_target }}"
    borgmatic_app_passphrase: "{{ pangolin_backup_encryption_passphrase }}"
    borgmatic_app_healthcheck_url: "{{ pangolin_backup_healthcheck_url }}"
    # CrowdSec ({{ pangolin_crowdsec_dir }}) n'est pas dans les sources : sa
    # base locale (alertes, décisions locales) est jetable, la liste
    # communautaire revient de la CAPI et le hub se réinstalle au démarrage.
    borgmatic_app_source_directories:
      - "{{ pangolin_dir }}/compose.yaml"
      - "{{ pangolin_dir }}/config"
    # Journal d'accès de Traefik et ses rotations (access.log.1, .gz) : déjà
    # lu par CrowdSec, inutile à une restauration.
    borgmatic_app_exclude_patterns:
      - "{{ pangolin_dir }}/config/traefik/logs"
    # Base SQLite de Pangolin (ressources, utilisateurs, SSO) :
    # /app/config/db/db.sqlite dans le conteneur.
    borgmatic_app_sqlite_databases:
      - "{{ pangolin_dir }}/config/db/db.sqlite"

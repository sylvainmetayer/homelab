---
# Prépare chez la Storage Box le dossier de chaque hôte sauvegardé et y
# autorise la clé de root de cet hôte (générée par le rôle borgmatic) : le
# sous-compte de l'hôte, dont c'est le dossier racine, lit ce
# .ssh/authorized_keys. À lancer après le rôle borgmatic des hôtes (clés
# créées) et avant leur première sauvegarde.
#
# Il dépose aussi dans backup/.ssh/authorized_keys la clé du sous-compte en
# lecture seule du test de restauration (tofu/pangolin/storage_box.tf,
# .github/restore-test/README.md), dont backup/ est le dossier racine : sa
# clé publique est lue avec `tofu output` dans tofu/pangolin (même
# environnement mise que l'inventaire hetzner.py).
#
# Ordre, pour un hôte neuf :
#   1. <playbook de l'hôte> --tags setup : le rôle borgmatic génère la clé,
#      sans les rôles d'application. Un passage complet (ou --tags backup)
#      échouerait ici : le repo-create de chaque application parle déjà au
#      sous-compte, qui ne connaît pas encore la clé.
#   2. ce playbook ;
#   3. le playbook complet de l'hôte (repo-create, configurations borgmatic).
- name: Read the Storage Box key of each backed-up host
  hosts: docker,pi,pangolin,flip,nas
  gather_facts: false
  tasks:
    - name: Read the public key generated by the borgmatic role
      become: true
      ansible.builtin.slurp:
        src: "{{ backup_storage_box_ssh_key_path }}.pub"
      register: backup_host_public_key

- name: Authorize each host on its Storage Box subaccount
  hosts: backups
  gather_facts: false
  tasks:
    # Un hôte injoignable à la première play n'a pas de clé lue : le dire
    # plutôt qu'une variable indéfinie au milieu des boucles.
    - name: Check that the key of every backed-up host was read
      delegate_to: localhost
      ansible.builtin.assert:
        that: hostvars[item].backup_host_public_key.content is defined
        fail_msg: "Clé de {{ item }} non lue (hôte injoignable ou rôle borgmatic pas encore joué) : rien n'est envoyé."
        quiet: true
      loop: "{{ backup_storage_box_hosts }}"

    # Shell restreint de la Storage Box : raw et ses commandes seulement.
    - name: Create the folder of each host
      ansible.builtin.raw: >-
        mkdir -p /home/{{ backup_storage_box_path }}/{{ item }}/.ssh
      changed_when: false
      loop: "{{ backup_storage_box_hosts }}"

    - name: Create a local staging directory for the public keys
      delegate_to: localhost
      ansible.builtin.tempfile:
        state: directory
        suffix: .backup_keys
      register: backup_keys_dir

    - name: Write the public key of each host to the staging directory
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ hostvars[item].backup_host_public_key.content | b64decode }}"
        dest: "{{ backup_keys_dir.path }}/{{ item }}.pub"
        mode: "0600"
      loop: "{{ backup_storage_box_hosts }}"

    # Le shell restreint n'a pas de redirection : la clé passe par scp, avec
    # la clé personnelle du compte principal (agent SSH).
    - name: Upload the authorized_keys of each subaccount
      delegate_to: localhost
      ansible.builtin.command:
        argv:
          - scp
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - "UserKnownHostsFile={{ playbook_dir }}/known_hosts"
          - -P
          - "{{ ansible_port }}"
          - "{{ backup_keys_dir.path }}/{{ item }}.pub"
          - "{{ ansible_user }}@{{ ansible_host }}:{{ backup_storage_box_path }}/{{ item }}/.ssh/authorized_keys"
      changed_when: true
      loop: "{{ backup_storage_box_hosts }}"

    - name: Read the public key of the restore-test subaccount
      delegate_to: localhost
      ansible.builtin.command:
        argv: [tofu, output, -raw, storage_box_restore_test_ssh_public_key]
        chdir: "{{ playbook_dir }}/../tofu/pangolin"
      register: backup_restore_test_public_key
      changed_when: false

    - name: Write the public key of the restore-test subaccount to the staging directory
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ backup_restore_test_public_key.stdout | trim }}\n"
        dest: "{{ backup_keys_dir.path }}/restore-test.pub"
        mode: "0600"

    - name: Create the folder of the restore-test subaccount keys
      ansible.builtin.raw: >-
        mkdir -p /home/{{ backup_storage_box_path }}/.ssh
      changed_when: false

    - name: Upload the authorized_keys of the restore-test subaccount
      delegate_to: localhost
      ansible.builtin.command:
        argv:
          - scp
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - "UserKnownHostsFile={{ playbook_dir }}/known_hosts"
          - -P
          - "{{ ansible_port }}"
          - "{{ backup_keys_dir.path }}/restore-test.pub"
          - "{{ ansible_user }}@{{ ansible_host }}:{{ backup_storage_box_path }}/.ssh/authorized_keys"
      changed_when: true

    - name: Remove the local staging directory
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ backup_keys_dir.path }}"
        state: absent

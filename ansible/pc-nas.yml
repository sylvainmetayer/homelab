---
# Monte un dossier partagé du NAS en SMB sur ce poste, le temps d'un test :
# rien dans /etc/fstab, rien ne survit à un reboot. Le mot de passe passe à
# mount.cifs par un fichier credentials= en 0600, propriété de root, sous /run
# (tmpfs), écrit par un module command en pipelining (le mot de passe ne
# touche jamais le disque, pas même ~/.ansible/tmp), supprimé juste après le
# montage, même en cas d'échec (pas sur un Ctrl-C : il reste alors dans /run,
# root seul, jusqu'au reboot). Ni variable PASSWD (Ansible préfixe l'environnement à la ligne de
# commande, lisible dans `ps` et journalisée dans run.log en -vvv), ni
# PASSWD_FILE=/dev/stdin (le NAS refusait la session : STATUS_LOGON_FAILURE
# avec un mot de passe que smbclient acceptait).
#
#   ansible-playbook pc-nas.yml -K --tags mount [-e pc_nas_share=media]
#   ansible-playbook pc-nas.yml -K --tags umount [-e pc_nas_share=media]
#
# Sans --tags, rien ne se passe (tags never). Client Pangolin connecté, l'IP
# du NAS (inventory/hosts) passe par la ressource privée nas.sylvain.cloud
# (route /32), qui laisse passer TCP 445 : même commande, à la maison comme
# dehors. Prérequis : cifs-utils, et un compte UGOS ayant le
# droit d'écriture sur le dossier partagé.
- name: Mount or unmount a NAS SMB share on this workstation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Arguments des modules (le mot de passe compris) passés par un pipe à
    # Python, jamais écrits dans un AnsiballZ_*.py de ~/.ansible/tmp.
    ansible_pipelining: true
    pc_nas_host: "{{ hostvars['nas'].ansible_host }}"
    pc_nas_share: media
    pc_nas_user: sylvain
    pc_nas_mount_path: "/mnt/nas/{{ pc_nas_share }}"
    pc_nas_mount_options:
      - "uid={{ lookup('ansible.builtin.pipe', 'id -u') }}"
      - "gid={{ lookup('ansible.builtin.pipe', 'id -g') }}"
      - file_mode=0644
      - dir_mode=0755
      - vers=3.1.1
      - noperm
  tasks:
    - name: Check whether the share is mounted
      tags: [mount, umount, never]
      ansible.builtin.command: mountpoint -q {{ pc_nas_mount_path | quote }}
      register: pc_nas_mounted
      changed_when: false
      failed_when: pc_nas_mounted.rc not in [0, 1, 32]

    - name: Mount the share
      tags: [mount, never]
      when: pc_nas_mounted.rc != 0
      block:
        - name: Ask for the SMB password
          ansible.builtin.pause:
            prompt: "Mot de passe SMB de {{ pc_nas_user }} sur {{ pc_nas_host }}"
            echo: false
          register: pc_nas_password
          no_log: true

        - name: Create the mount point
          become: true
          ansible.builtin.file:
            path: "{{ pc_nas_mount_path }}"
            state: directory
            mode: "0755"

        # Fichiers au nom de l'utilisateur local ; sur le NAS, ils sont créés
        # au nom du compte SMB (uid 1000), que Jellyfin lit.
        - name: Mount the share without touching fstab
          become: true
          # tempfile ne tourne pas en --check : pas de chemin à écrire.
          when: not ansible_check_mode
          block:
            - name: Create a private credentials file in /run
              ansible.builtin.tempfile:
                path: /run
                prefix: pc-nas-
                suffix: .cred
              register: pc_nas_credentials

            # Pas de copy content= : il dépose le contenu dans des fichiers
            # de ~/.ansible/tmp (sur disque) avant de le déplacer. Le module
            # command, en pipelining, reçoit le mot de passe par un pipe.
            # tempfile a créé le fichier en 0600 ; cat le tronque sans
            # changer son mode.
            - name: Write the SMB credentials
              ansible.builtin.command:
                argv: [sh, -c, 'cat > "$1"', sh, "{{ pc_nas_credentials.path }}"]
                stdin: |-
                  username={{ pc_nas_user }}
                  password={{ pc_nas_password.user_input }}
              no_log: true
              changed_when: true

            - name: Run mount.cifs with the credentials file
              ansible.builtin.command:
                argv:
                  - mount
                  - -t
                  - cifs
                  - "//{{ pc_nas_host }}/{{ pc_nas_share }}"
                  - "{{ pc_nas_mount_path }}"
                  - -o
                  - "{{ (pc_nas_mount_options + ['credentials=' ~ pc_nas_credentials.path]) | join(',') }}"
              register: pc_nas_mount
              changed_when: true
          always:
            - name: Remove the credentials file
              when: pc_nas_credentials.path is defined
              ansible.builtin.file:
                path: "{{ pc_nas_credentials.path }}"
                state: absent

    - name: Unmount the share
      tags: [umount, never]
      when: pc_nas_mounted.rc == 0
      become: true
      ansible.builtin.command:
        argv: [umount, "{{ pc_nas_mount_path }}"]
      changed_when: true

---
- name: Configure Proxmox VMs
  hosts: docker
  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    - name: Load healthcheck URLs from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        nextcloud_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_nextcloud_url.value | default('') }}"
        wiki_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_wiki_url.value | default('') }}"
        rss_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_rss_url.value | default('') }}"
        monica_v4_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_monica_url.value | default('') }}"
        monica_v4_cron_healthcheck_url: "{{ terraform_outputs.uptime_cron_monica_url.value | default('') }}"
        betisier_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_betisier_url.value | default('') }}"
        meerkat_crm_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_meerkat_crm_url.value | default('') }}"
        dawarich_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_dawarich_url.value | default('') }}"
        trek_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_trek_url.value | default('') }}"
        kitchenowl_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_kitchenowl_url.value | default('') }}"
        karakeep_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_karakeep_url.value | default('') }}"
        paperless_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_paperless_url.value | default('') }}"
        wishlist_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_wishlist_url.value | default('') }}"
        nginx_demo_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_nginx_demo_url.value | default('') }}"
        beszel_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_beszel_url.value | default('') }}"

    # Les liens de Homepage : un par entrée de local.websites
    # (tofu/pangolin_config, website_homepage.tf).
    - name: Load the Homepage links from Terraform state outputs
      tags: always
      ansible.builtin.set_fact:
        homepage_websites: "{{ terraform_outputs.homepage_links.value | default({}) }}"

  roles:
    - role: geerlingguy.docker
      become: true
      tags: setup
    - role: docker_service
      tags: setup
    - role: host_tuning
      tags: tuning,setup
    - role: security
      become: true
      tags: security,setup
    - role: borgmatic
      tags: backup,setup
    - role: decommission_app
      tags: [decommission, never]
    - role: newt
      tags: newt,setup
    - role: rss
      tags: rss,app
    - role: betisier
      tags: betisier,app
    - role: monica_v4
      tags: monica,app
    - role: wiki
      tags: wiki,app
    - role: nextcloud
      tags: nextcloud,app
    - role: meerkat_crm
      tags: meerkat_crm,app
    - role: paperless_ngx
      tags: paperless,app
    - role: dawarich
      tags: dawarich,app
    - role: trek
      tags: trek,app
    - role: karakeep
      tags: karakeep,app
    - role: stirling_pdf
      tags: stirling_pdf,app
    - role: wishlist
      tags: wishlist,app
    - role: kitchenowl
      tags: kitchenowl,app
    - role: nginx_demo
      tags: nginx_demo,app
    # Hub de supervision, puis l'agent de cet hôte, qui lui parle par
    # 127.0.0.1 (le hub publie aussi son port sur le LAN pour les agents du
    # Pi, du NAS et du LXC newt).
    - role: beszel
      tags: beszel,app
    - role: beszel_agent
      tags: beszel_agent,monitoring
      vars:
        beszel_agent_hub_url: "http://127.0.0.1:8090"
    - role: homepage
      tags: homepage,app

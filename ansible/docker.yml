---
- name: Configure Proxmox VMs
  hosts: docker
  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    - name: Load healthcheck URLs from Terraform state outputs
      tags: always
      ansible.builtin.set_fact:
        nextcloud_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_nextcloud_url.value | default('') }}"
        wiki_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_wiki_url.value | default('') }}"
        rss_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_rss_url.value | default('') }}"
        monica_v4_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_monica_url.value | default('') }}"
        monica_v4_cron_healthcheck_url: "{{ terraform_outputs.uptime_cron_monica_url.value | default('') }}"
        betisier_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_betisier_url.value | default('') }}"
        meerkat_crm_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_meerkat_crm_url.value | default('') }}"
        gramps_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_gramps_url.value | default('') }}"
        dawarich_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_dawarich_url.value | default('') }}"
        scanopy_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_scanopy_url.value | default('') }}"
        trek_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_trek_url.value | default('') }}"
        karakeep_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_karakeep_url.value | default('') }}"
        searxng_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_searxng_url.value | default('') }}"
        paperless_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_paperless_url.value | default('') }}"
        nginx_demo_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_nginx_demo_url.value | default('') }}"

  roles:
    - role: geerlingguy.docker
      become: true
      tags: setup
    - role: docker_service
      tags: setup
    - role: host_tuning
      tags: tuning,setup
    - role: borgmatic
      tags: backup,setup
    - role: decommission_app
      tags: [decommission, never]
    - role: newt
      tags: newt,setup
    - role: echo
      tags: echo,app
    - role: rss
      tags: rss,app
    - role: searxng
      tags: searxng,app,search
    - role: betisier
      tags: betisier,app
    - role: monica_v4
      tags: monica,app
    - role: wiki
      tags: wiki,app
    - role: nextcloud
      tags: nextcloud,app
    - role: meerkat_crm
      tags: meerkat_crm,app
    - role: paperless_ngx
      tags: paperless,app
    - role: gramps
      tags: gramps,app
    - role: dawarich
      tags: dawarich,app
    - role: scanopy
      tags: scanopy,app
    - role: trek
      tags: trek,app
    - role: karakeep
      tags: karakeep,app
    - role: nginx_demo
      tags: nginx_demo,app

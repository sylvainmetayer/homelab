---
- name: Configure Proxmox VMs
  hosts: docker
  pre_tasks:
    # Secrets SOPS et sorties du state de tofu/pangolin_config (terraform_outputs).
    - name: Load secrets and the pangolin_config state outputs
      ansible.builtin.import_tasks: tasks/pangolin_config_outputs.yml

    - name: Load healthcheck URLs from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        nextcloud_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_nextcloud_url.value | default('') }}"
        wiki_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_wiki_url.value | default('') }}"
        rss_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_rss_url.value | default('') }}"
        monica_v4_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_monica_url.value | default('') }}"
        monica_v4_cron_healthcheck_url: "{{ terraform_outputs.uptime_cron_monica_url.value | default('') }}"
        betisier_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_betisier_url.value | default('') }}"
        betisier_reset_healthcheck_url: "{{ terraform_outputs.uptime_cron_betisier_reset_url.value | default('') }}"
        meerkat_crm_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_meerkat_crm_url.value | default('') }}"
        dawarich_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_dawarich_url.value | default('') }}"
        trek_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_trek_url.value | default('') }}"
        kitchenowl_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_kitchenowl_url.value | default('') }}"
        homebox_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_homebox_url.value | default('') }}"
        speedtest_tracker_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_speedtest_tracker_url.value | default('') }}"
        ntfy_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_ntfy_url.value | default('') }}"
        karakeep_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_karakeep_url.value | default('') }}"
        paperless_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_paperless_url.value | default('') }}"
        wishlist_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_wishlist_url.value | default('') }}"
        nginx_demo_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_nginx_demo_url.value | default('') }}"
        beszel_backup_healthcheck_url: "{{ terraform_outputs.uptime_backup_beszel_url.value | default('') }}"

    # Jeton du producteur uptime-kuma de ntfy : clé ntfy_uptime_kuma_token du
    # secrets.sops.yaml racine, que tofu/pangolin_config donne à sa
    # notification Uptime Kuma et rend en sortie. Vide avant le premier apply :
    # le rôle ntfy retire alors ce producteur (avertissement).
    - name: Load the ntfy Uptime Kuma token from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        ntfy_uptime_kuma_token: "{{ terraform_outputs.ntfy_uptime_kuma_token.value | default('') }}"

    # Les liens de Homepage : un par entrée de local.websites
    # (tofu/pangolin_config, website_homepage.tf).
    - name: Load the Homepage links from Terraform state outputs
      tags: always
      ansible.builtin.set_fact:
        homepage_websites: "{{ terraform_outputs.homepage_links.value | default({}) }}"

    # L'instance qu'interroge le widget Uptime Kuma de Homepage
    # (status_page_site.tf). Vide avant l'apply : pas de widget.
    - name: Load the Uptime Kuma URL of the Homepage widget from Terraform state outputs
      tags: always
      no_log: true
      ansible.builtin.set_fact:
        homepage_uptimekuma_url: "{{ terraform_outputs.homepage_uptimekuma_url.value | default('') }}"

    # L'organisation que liste le widget Pangolin de Homepage
    # (website_homepage.tf). Vide avant l'apply : pas de widget.
    - name: Load the Pangolin organisation of the Homepage widget from Terraform state outputs
      tags: always
      ansible.builtin.set_fact:
        homepage_pangolin_org: "{{ terraform_outputs.homepage_pangolin_org.value | default('') }}"

  roles:
    - role: geerlingguy.docker
      become: true
      tags: setup
    - role: docker_service
      tags: setup
    - role: host_tuning
      tags: tuning,setup
    - role: security
      become: true
      tags: security,setup
    - role: borgmatic
      tags: backup,setup
    - role: decommission_app
      tags: [decommission, never]
    - role: newt
      tags: newt,setup
    - role: rss
      tags: rss,app
    - role: betisier
      tags: betisier,app
    - role: monica_v4
      tags: monica,app
    - role: wiki
      tags: wiki,app
    - role: nextcloud
      tags: nextcloud,app
    - role: meerkat_crm
      tags: meerkat_crm,app
    - role: paperless_ngx
      tags: paperless,app
    - role: dawarich
      tags: dawarich,app
    - role: trek
      tags: trek,app
    - role: karakeep
      tags: karakeep,app
    - role: stirling_pdf
      tags: stirling_pdf,app
    - role: wishlist
      tags: wishlist,app
    - role: kitchenowl
      tags: kitchenowl,app
    - role: homebox
      tags: homebox,app
    - role: speedtest_tracker
      tags: speedtest_tracker,app
    - role: ntfy
      tags: ntfy,app
    - role: nginx_demo
      tags: nginx_demo,app
    # Hub de supervision, puis l'agent de cet hôte, qui lui parle par
    # 127.0.0.1 (le hub publie aussi son port sur le LAN pour les agents du
    # Pi, du NAS et du LXC newt).
    - role: beszel
      tags: beszel,app
    - role: beszel_agent
      tags: beszel_agent,monitoring
      vars:
        beszel_agent_hub_url: "http://127.0.0.1:8090"
    # Rapport mémoire des conteneurs, chaque lundi sur ntfy (topic scripts).
    - role: mem_report
      tags: mem_report,monitoring
    # Journaux centralisés (VictoriaLogs derrière vmauth). Pas de sauvegarde :
    # des journaux se reproduisent, chaque hôte garde son journald.
    - role: victoria_logs
      tags: victoria_logs,app
    # L'agent de journaux de cet hôte, vers vmauth par 127.0.0.1.
    - role: log_agent
      tags: log_agent,monitoring
      vars:
        log_agent_url: "http://127.0.0.1:9428"
    - role: homepage
      tags: homepage,app

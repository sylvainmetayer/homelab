---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  vars:
    immich_path: "{{ docker_base_path }}/immich"
  tasks:
    - name: Verify the immich deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: immich
        verify_app_borgmatic_config: "{{ borgmatic_config_dir }}/immich.yaml"
        verify_app_borgmatic_push_url: https://uptime.example.invalid/api/push/molecule-immich

    - name: Verify the supporting services of immich
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: immich
        verify_compose_databases:
          - database
        verify_compose_healthchecks:
          - redis
        verify_compose_healthy_dependencies:
          - { service: immich-server, dependency: redis }
          - { service: immich-server, dependency: database }

    - name: Stat the immich files
      ansible.builtin.stat:
        path: "{{ immich_path }}/{{ item }}"
      loop:
        - compose.yaml
        - .env
        - library
      register: immich_stats

    # compose et .env portent le mot de passe de la base et la clé d'API du
    # timelapse : pas lisibles par les autres. library appartient à root, comme
    # les fichiers qu'immich_server y écrit.
    - name: Assert the immich files have the expected owners and modes
      ansible.builtin.assert:
        that:
          - immich_stats.results[0].stat.mode == '0600'
          - immich_stats.results[1].stat.mode == '0600'
          - immich_stats.results[1].stat.pw_name == ansible_facts['user_id']
          - immich_stats.results[2].stat.isdir
          - immich_stats.results[2].stat.pw_name == 'root'
        fail_msg: "{{ immich_stats.results | map(attribute='stat') | map(attribute='mode', default='absent') | list | string }}"

    - name: Read the immich files
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ immich_path }}/.env"
        - "{{ immich_path }}/compose.yaml"
        - "{{ borgmatic_config_dir }}/immich.yaml"
      register: immich_files

    - name: Parse the immich files
      ansible.builtin.set_fact:
        immich_env: >-
          {{ dict((immich_files.results[0].content | b64decode).splitlines()
             | select('match', '^[A-Z_]+=') | map('split', '=', 1)) }}
        immich_compose: "{{ immich_files.results[1].content | b64decode | from_yaml }}"
        immich_borgmatic: "{{ immich_files.results[2].content | b64decode | from_yaml }}"

    - name: Assert every immich service has a memory cap
      ansible.builtin.assert:
        that:
          - immich_compose.services.values() | rejectattr('mem_limit', 'defined') | list | length == 0
          - immich_compose.services.database.mem_reservation is defined

    # Le dump borgmatic doit viser la base du compose avec les identifiants du .env.
    - name: Assert borgmatic dumps the immich database
      ansible.builtin.assert:
        that:
          - immich_db.container == immich_compose.services.database.container_name
          - immich_db.name == immich_env.DB_DATABASE_NAME
          - immich_db.username == immich_env.DB_USERNAME
          - immich_db.password == immich_env.DB_PASSWORD
          - (immich_path ~ '/library') in immich_borgmatic.source_directories
      vars:
        immich_db: "{{ immich_borgmatic.postgresql_databases[0] }}"

    - name: Assert the database and redis stay off the newt network
      ansible.builtin.assert:
        that:
          - immich_compose.networks.newt.external
          - "'newt' in immich_compose.services['immich-server'].networks"
          - "'newt' not in immich_compose.services.database.networks"
          - "'newt' not in immich_compose.services.redis.networks"
          - "'newt' not in immich_compose.services['immich-machine-learning'].networks"

    # Hors worker distant, ni Valkey ni Postgres ne sont publiés sur le LAN.
    - name: Assert the database and redis ports stay on the loopback
      ansible.builtin.assert:
        that:
          - immich_compose.services.database.ports == ['127.0.0.1:5432:5432']
          - immich_compose.services.redis.ports == ['127.0.0.1:6379:6379']

    # Valkey exige le mot de passe du .env, que lit immich-server ; dérivé,
    # jamais vide ni égal à celui de la base.
    - name: Assert Valkey requires the password immich-server reads
      ansible.builtin.assert:
        that:
          - immich_env.REDIS_PASSWORD | length == 64
          - immich_env.REDIS_PASSWORD != immich_env.DB_PASSWORD
          - immich_compose.services.redis.command == 'valkey-server --requirepass "${REDIS_PASSWORD}"'
          - immich_compose.services.redis.environment.REDISCLI_AUTH == '${REDIS_PASSWORD}'

    # Interpolé par compose depuis le .env : la commande rendue porte bien le
    # mot de passe que lit immich-server.
    - name: Render the immich compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: "{{ immich_path }}"
      register: immich_compose_rendered
      changed_when: false
      no_log: true

    - name: Assert the rendered Valkey command carries the .env password
      no_log: true
      ansible.builtin.assert:
        that:
          - redis.command == ['valkey-server', '--requirepass', immich_env.REDIS_PASSWORD]
          - redis.environment.REDISCLI_AUTH == immich_env.REDIS_PASSWORD
      vars:
        redis: "{{ (immich_compose_rendered.stdout | from_json).services.redis }}"

    # Sans login, avec la clé d'API Immich : joint par Pangolin seul (newt,
    # derrière le SSO), jamais publié sur le LAN.
    - name: Assert the timelapse publishes no port and sits on newt
      ansible.builtin.assert:
        that:
          - "'ports' not in immich_compose.services['immich-selfie-timelapse']"
          - "'newt' in immich_compose.services['immich-selfie-timelapse'].networks"

    # Avec la clé (fake_secrets) : le nginx d'Immich Swipe passe /api/ à
    # immich-server en posant la clé côté serveur, et préconfigure l'appli
    # (README du rôle). Fichier 0600 : il porte la clé.
    - name: Stat the Immich Swipe nginx configuration
      ansible.builtin.stat:
        path: "{{ immich_path }}/immich-swipe.conf"
      register: immich_swipe_conf_stat

    - name: Read the Immich Swipe nginx configuration
      ansible.builtin.slurp:
        src: "{{ immich_path }}/immich-swipe.conf"
      register: immich_swipe_conf
      no_log: true

    - name: Assert Immich Swipe proxies the API with the server-side key
      no_log: true
      ansible.builtin.assert:
        that:
          - immich_swipe_conf_stat.stat.mode == '0600'
          - immich_swipe_conf_stat.stat.pw_name == ansible_facts['user_id']
          - "'./immich-swipe.conf:/etc/nginx/conf.d/default.conf:ro' in immich_compose.services['immich-swipe'].volumes"
          - "'immich' in immich_compose.services['immich-swipe'].networks"
          - "'set $immich http://immich-server:2283;' in conf" # NOSONAR
          - "'proxy_set_header x-api-key \"molecule-immich-swipe-api-key\";' in conf"
          - "\"localStorage.setItem('immich-swipe-config'\" in conf"
          - "'ports' not in immich_compose.services['immich-swipe']"
      vars:
        conf: "{{ immich_swipe_conf.content | b64decode }}"

    # Mode aléatoire : GET /api/assets/random (retiré d'Immich v3) réécrit en
    # POST /api/search/random {"size": N, ...} avec le filtre de l'ancien
    # endpoint, N tiré de `count` par une map qui n'y laisse passer qu'un nombre.
    - name: Assert Immich Swipe rewrites the random mode to Immich v3's search
      no_log: true
      ansible.builtin.assert:
        that:
          - "'map $immich_swipe_count $immich_swipe_random_size {' in conf"
          - >-
            '"~^([1-9][0-9]?|100)$"   $immich_swipe_count;' in conf
          - "'\"~^[1-9][0-9]{2,}$\"      100;' in conf"
          - "'set $immich_swipe_count $arg_count;' in random_location"
          - "'rewrite ^ /api/search/random? break;' in random_location"
          - "'proxy_method POST;' in random_location"
          - "'proxy_set_header Content-Type application/json;' in random_location"
          - >-
            "proxy_set_body '{\"size\":$immich_swipe_random_size,\"withExif\":true,\"filter\":{\"visibility\":{\"in\":[\"archive\",\"timeline\"]},\"trashedAt\":{\"eq\":null}}}';" in random_location
          - "'proxy_set_header x-api-key \"molecule-immich-swipe-api-key\";' in random_location"
          - "'proxy_set_header Cookie \"\";' in random_location"
          - "'proxy_set_header Authorization \"\";' in random_location"
      vars:
        conf: "{{ immich_swipe_conf.content | b64decode }}"
        # Du `location =` du mode aléatoire au `location ^~ /api/` qui le suit.
        random_location: "{{ conf.split('location = /api/assets/random {')[1].split('location ^~ /api/')[0] }}"

---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# La base de pmxcfs, comme sur l'hôte : en WAL, ce qui envoie la sauvegarde
# sur « VACUUM INTO » et non sur « .backup » (borgmatic, app.yaml.j2).
- name: Prepare pve_config_backup
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure the pve-cluster folder exists
      become: true
      ansible.builtin.file:
        path: /var/lib/pve-cluster
        state: directory
        mode: "0700"

    - name: Create a pmxcfs SQLite database in WAL mode
      become: true
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          c = sqlite3.connect('/var/lib/pve-cluster/config.db');
          c.execute('pragma journal_mode=wal');
          c.execute('CREATE TABLE tree (inode INTEGER PRIMARY KEY)')"
        creates: /var/lib/pve-cluster/config.db

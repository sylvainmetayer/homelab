---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  vars:
    # Le sous-compte de pve vient de host_vars/pve (clé SOPS
    # backup_storage_box_subaccounts.pve, absente des fausses valeurs : une clé
    # de plus ferait rejouer tous les scénarios).
    backup_storage_box_subaccount:
      username: u000000-sub6
      server: u000000-sub6.your-storagebox.example.invalid
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: pve_config_backup

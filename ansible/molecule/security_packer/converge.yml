---
# Comme packer/pangolin/ansible/site.yml : rôle appliqué avec become, sans
# secrets (l'image n'en a pas), avec les variables security_* du play. Pas de
# group_vars/all : Packer lance site.yml hors de ansible/, il ne les lit pas.
- name: Converge
  hosts: all
  pre_tasks:
    - name: Load the Packer variables
      ansible.builtin.import_tasks: tasks/load_packer_vars.yml
  roles:
    - role: security
      become: true

---
# Docker, bouchon dc@ (unité user) : prepare commun. Le bouchon de l'unité
# système et les fichiers d'UGOS : ci-dessous.
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

- name: Prepare
  hosts: all
  become: true
  tasks:
    # UGOS fournit ssh-keygen (OpenSSH 9.2 de Debian 12) : le mode conteneur
    # de borgmatic s'en sert pour la clé de root, sans rien installer.
    - name: Provide ssh-keygen as UGOS does
      ansible.builtin.apt:
        name: openssh-client
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Le nfs.json d'un UGOS 1.20 neuf, protocole volontairement différent
    # pour que le converge le corrige.
    - name: Write a UGOS-like NFS settings file
      ansible.builtin.copy:
        dest: /etc/nfs.json
        content: |
          {"enableNfsServer":true,"maximumNFSProtocol":"NFSv4","applyDefaultUNIXPerm":true,"customerPort":false,"statdPort":0,"nlockMgrPort":0,"nFSvDomain":"","defaultReadPacketSize":8,"defaultWritePacketSize":8,"logs":true}
        owner: root
        group: root
        mode: "0600"

    # Le dossier exporté, et docker_base_path : le dossier partagé que crée
    # l'appli Docker d'UGOS.
    - name: Create the shared folders of host_vars/nas
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /volume1/nas-test
        - /volume1/pve-backup
        - /volume1/docker

    # Le dossier partagé des médias de Jellyfin et ses bibliothèques
    # (defaults du rôle jellyfin), créés dans l'interface sur le NAS.
    - name: Create the media share and its library folders
      ansible.builtin.file:
        path: "/volume1/media{{ item }}"
        state: directory
        owner: sylvain
        mode: "0700"
      loop: ["", /films, /series, /musique, /livres, /livres-audio]

    # La base SQLite de Jellyfin, comme après son premier démarrage : le rôle
    # borgmatic (tasks/app.yml) doit la trouver, la copier par « .backup » et
    # exclure sa copie vivante. Dossiers aux propriétaires et modes que leur
    # donne le rôle jellyfin.
    - name: Create the Jellyfin data folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        mode: "0700"
      loop:
        - { path: /volume1/docker/jellyfin, owner: root }
        - { path: /volume1/docker/jellyfin/config, owner: sylvain }
        - { path: /volume1/docker/jellyfin/config/data, owner: sylvain }

    - name: Create a Jellyfin SQLite database
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          sqlite3.connect('/volume1/docker/jellyfin/config/data/jellyfin.db').execute('CREATE TABLE BaseItems (Id TEXT PRIMARY KEY)')"
        creates: /volume1/docker/jellyfin/config/data/jellyfin.db

    - name: Give the Jellyfin database to its account
      ansible.builtin.file:
        path: /volume1/docker/jellyfin/config/data/jellyfin.db
        owner: sylvain
        mode: "0600"

    # Le périphérique de rendu de l'iGPU (Quick Sync), absent d'un runner :
    # même numéro que sur le NAS (226:128), au groupe render.
    # Absent de l'image (pas d'udev) ; groupe système comme sous UGOS.
    - name: Create the render group
      ansible.builtin.group:
        name: render
        system: true

    - name: Create the render device directory
      ansible.builtin.file:
        path: /dev/dri
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Create a render device node
      ansible.builtin.command: mknod -m 0660 /dev/dri/renderD128 c 226 128
      args:
        creates: /dev/dri/renderD128

    - name: Give the render device to the render group
      ansible.builtin.file:
        path: /dev/dri/renderD128
        owner: root
        group: render
        mode: "0660"

    - name: Ensure the system dc@ drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/dc@.service.d
        state: directory
        owner: root
        group: root
        mode: "0700"

    # Même bouchon que celui de l'unité user (_shared/prepare.yml) : le compose
    # est validé, aucune image tirée ni conteneur lancé.
    - name: Neutralise docker compose pull/up in system dc@ units
      ansible.builtin.copy:
        dest: /etc/systemd/system/dc@.service.d/molecule.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          [Service]
          Restart=no
          ExecStartPre=
          ExecStartPre=/usr/bin/docker compose config --quiet
          ExecStart=
          ExecStart=/bin/sleep infinity
          ExecStop=

---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Le nfs.json d'un UGOS 1.20 neuf, protocole volontairement différent
    # pour que le converge le corrige.
    - name: Write a UGOS-like NFS settings file
      ansible.builtin.copy:
        dest: /etc/nfs.json
        content: |
          {"enableNfsServer":true,"maximumNFSProtocol":"NFSv4","applyDefaultUNIXPerm":true,"customerPort":false,"statdPort":0,"nlockMgrPort":0,"nFSvDomain":"","defaultReadPacketSize":8,"defaultWritePacketSize":8,"logs":true}
        owner: root
        group: root
        mode: "0600"

    # Le dossier exporté, et docker_base_path : le dossier partagé que crée
    # l'appli Docker d'UGOS.
    - name: Create the shared folders of host_vars/nas
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /volume1/nas-test
        - /volume1/docker

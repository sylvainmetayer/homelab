---
- name: Converge
  hosts: all
  gather_facts: false
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/nas/variables.yaml
  vars:
    # Pas de nfsd dans un conteneur (cf. defaults du rôle).
    nas_manage_services: false
    # Le bouchon de _shared/prepare.yml au lieu de l'enrobage du conteneur
    # borgmatic, qui tirerait l'image (repo-create de tasks/app.yml).
    # borgmatic.service, lui, garde l'enrobage (vérifié par verify.yml).
    borgmatic_bin: /root/.local/bin/borgmatic
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # nas.yml les lit dans le state de pangolin_config (nas_newt_*) ; ici,
    # des identifiants factices de fake_secrets.yml.
    - name: Set the newt credentials as nas.yml does
      no_log: true
      ansible.builtin.set_fact:
        newt_client_id: "{{ newt_docker_client_id }}"
        newt_client_secret: "{{ newt_docker_client_secret }}"
  # Comme nas.yml.
  roles:
    # dc@ en unité système (host_vars/nas).
    - role: docker_service
    # borgmatic en conteneur (host_vars/nas).
    - role: borgmatic
    - role: nas
    # Sous le nom d'inventaire du NAS (sa clé dans beszel_agent_tokens).
    - role: beszel_agent
      vars:
        beszel_agent_name: nas
    # Sous le nom d'inventaire du NAS (sa clé dans victoria_logs_agent_passwords).
    - role: log_agent
      vars:
        log_agent_name: nas
    - role: newt
    - role: jellyfin
    - role: nas_proxy

---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../../host_vars/nas/variables.yaml
  vars:
    nas_verify_unit_path: /etc/systemd/system/dc@.service
  tasks:
    - name: Read the NFS settings
      ansible.builtin.slurp:
        src: /etc/nfs.json
      register: nas_verify_config

    - name: Read the homelab exports
      ansible.builtin.slurp:
        src: /etc/exports.d/homelab.exports
      register: nas_verify_exports

    # Les autres clés d'UGOS sont gardées telles quelles.
    - name: Assert the protocol is NFSv3 and the export is sync, to the VM only
      vars:
        nas_verify_json: "{{ nas_verify_config.content | b64decode | from_json }}"
        nas_verify_lines: "{{ nas_verify_exports.content | b64decode | split('\n') | reject('match', '^(#|$)') | list }}"
      ansible.builtin.assert:
        that:
          - nas_verify_json.maximumNFSProtocol == 'NFSv3'
          - nas_verify_json.enableNfsServer
          - nas_verify_json.defaultReadPacketSize == 8
          - nas_verify_lines == ['/volume1/nas-test 192.168.1.216(rw,sync,no_wdelay,no_subtree_check,insecure_locks,no_root_squash,sec=sys)']
        fail_msg: "nas.json ou exports inattendus : {{ nas_verify_json }} / {{ nas_verify_lines }}"

    # dc@ : unité système du NAS (docker_service_scope: system).
    - name: Stat the system dc@ unit and the user one
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ nas_verify_unit_path }}"
        - /home/sylvain/.config/systemd/user/dc@.service
      register: nas_verify_units

    - name: Assert dc@ is a root-owned system unit, and no user unit was written
      ansible.builtin.assert:
        that:
          - nas_verify_units.results[0].stat.exists
          - nas_verify_units.results[0].stat.pw_name == 'root'
          - nas_verify_units.results[0].stat.gr_name == 'root'
          - nas_verify_units.results[0].stat.mode == '0644'
          - not nas_verify_units.results[1].stat.exists
        fail_msg: "{{ nas_verify_units.results | map(attribute='item') | list }} : propriétaire, mode ou existence inattendus"

    - name: Read the system dc@ unit
      ansible.builtin.slurp:
        src: "{{ nas_verify_unit_path }}"
      register: nas_verify_unit_raw

    # Même comportement que l'unité user (scénario docker_service), plus ce
    # qui est propre à l'unité système.
    - name: Assert the system dc@ unit behaves like the user one
      vars:
        nas_verify_unit_lines: "{{ (nas_verify_unit_raw.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - ('WorkingDirectory=' ~ docker_base_path ~ '/%i') in nas_verify_unit_lines
          - nas_verify_unit_lines | select('match', '^ExecStartPre=/usr/bin/timeout 120 .*docker info') | list | length == 1
          - nas_verify_unit_lines | select('match', 'ExecStartPre=.*compose pull') | list == ['ExecStartPre=/usr/bin/docker compose pull --policy missing']
          - "'ExecStart=/usr/bin/docker compose up --remove-orphans' in nas_verify_unit_lines"
          - "'ExecStop=/usr/bin/docker compose stop' in nas_verify_unit_lines"
          - "'Restart=always' in nas_verify_unit_lines"
          - "'RestartSec=15s' in nas_verify_unit_lines"
          - "'StartLimitIntervalSec=0' in nas_verify_unit_lines"
          - nas_verify_unit_lines | select('match', '^StartLimitBurst=') | list | length == 0
          - nas_verify_unit_lines | select('match', '^Restart(Steps|MaxDelaySec)=') | list | length == 0
          - "'TimeoutStartSec=300' in nas_verify_unit_lines"
          # Ordre seul : tirer docker.service le démarrerait avant qu'UGOS ait
          # monté /volume1 (data-root).
          - "'After=docker_serv.service docker.service' in nas_verify_unit_lines"
          - nas_verify_unit_lines | select('match', '^(Wants|Requires|BindsTo|Requisite)=') | list | length == 0
          - nas_verify_unit_lines | select('match', '^User=') | list | length == 0
          - "'WantedBy=multi-user.target' in nas_verify_unit_lines"
        fail_msg: "{{ nas_verify_unit_path }} inattendu"

    - name: Verify an instance of the dc@ unit
      ansible.builtin.command: systemd-analyze verify dc@molecule.service
      register: nas_verify_analyze
      changed_when: false
      failed_when: >-
        nas_verify_analyze.rc != 0
        or (nas_verify_analyze.stderr_lines | select('search', 'dc@') | list | length > 0)

    # Le manager système a chargé ce fichier (le handler Daemon reload est
    # passé), avec les mêmes délais que l'unité user.
    - name: Read an instance of dc@
      ansible.builtin.systemd:
        name: dc@molecule
      register: nas_verify_instance

    - name: Assert the system manager loaded the dc@ unit template
      ansible.builtin.assert:
        that:
          - nas_verify_instance.status.LoadState == 'loaded'
          - nas_verify_instance.status.FragmentPath == nas_verify_unit_path
          - nas_verify_instance.status.NeedDaemonReload == 'no'
          - nas_verify_instance.status.WorkingDirectory == docker_base_path ~ '/molecule'
          - nas_verify_instance.status.StartLimitIntervalUSec == '0'
          - nas_verify_instance.status.RestartUSec == '15s'
          - nas_verify_instance.status.TimeoutStartUSec == '5min'
          - nas_verify_instance.status.JobRunningTimeoutUSec == '10min'
          - nas_verify_instance.status.TimeoutStopUSec == '2min'
        fail_msg: >-
          dc@molecule : {{ nas_verify_instance.status.LoadState }}
          depuis {{ nas_verify_instance.status.FragmentPath | default('?') }}

    # Agent Beszel : dc@beszel_agent en unité système, fichiers de root sous
    # docker_base_path (beszel_agent dérive tout de docker_service_scope).
    - name: Stat the Beszel agent files
      ansible.builtin.stat:
        path: "{{ docker_base_path }}/beszel_agent/{{ item }}"
      loop: ["", compose.yaml, .env]
      register: nas_verify_beszel_files

    - name: Assert the Beszel agent files belong to root, closed to others
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == ('0700' if item.stat.isdir else '0600')
        fail_msg: "{{ item.item }} : {{ item.stat.pw_name | default('absent') }} {{ item.stat.mode | default('') }}"
        quiet: true
      loop: "{{ nas_verify_beszel_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the Beszel agent unit
      ansible.builtin.systemd:
        name: dc@beszel_agent
      register: nas_verify_beszel_unit

    - name: Assert the Beszel agent runs under the system dc@ unit
      ansible.builtin.assert:
        that:
          - nas_verify_beszel_unit.status.ActiveState == 'active'
          - nas_verify_beszel_unit.status.UnitFileState == 'enabled'
          - nas_verify_beszel_unit.status.FragmentPath == nas_verify_unit_path
          - nas_verify_beszel_unit.status.WorkingDirectory == docker_base_path ~ '/beszel_agent'
        fail_msg: >-
          dc@beszel_agent : {{ nas_verify_beszel_unit.status.ActiveState }},
          {{ nas_verify_beszel_unit.status.UnitFileState }}

    - name: Render the Beszel agent compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: "{{ docker_base_path }}/beszel_agent"
      register: nas_verify_beszel_compose
      changed_when: false

    # Les trois disques du NAS et /volume1 (host_vars/nas).
    - name: Assert the agent sees the NAS disks and volume
      vars:
        nas_verify_agent: "{{ (nas_verify_beszel_compose.stdout | from_json).services.agent }}"
      ansible.builtin.assert:
        that:
          - nas_verify_agent.devices | map(attribute='source') | list == ['/dev/sda', '/dev/sdb', '/dev/sdc']
          - nas_verify_agent.volumes | selectattr('source', 'equalto', '/volume1') | map(attribute='target') | list == ['/extra-filesystems/volume1']
        fail_msg: "Agent du NAS inattendu : {{ nas_verify_agent }}"

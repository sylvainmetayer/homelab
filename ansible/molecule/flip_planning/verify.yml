---
# Deux instances du même rôle sur un même hôte : chacune doit être complète
# (verify_instance.yml) et ne rien partager avec l'autre (fin de ce fichier).
- name: Verify
  hosts: all
  # Les defaults du rôle d'abord (images des deux canaux) : les fichiers
  # suivants l'emportent, comme les secrets et host_vars sur le rôle.
  vars_files:
    - ../../roles/flip_planning/defaults/main.yml
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
    - ../../host_vars/flip/variables.yaml
  vars:
    flip_planning_instances:
      - service: flip_planning
        prefix: flip-planning
        domain: flip-planning.sylvain.cloud
        image: "{{ flip_planning_image_release }}"
        sentry_environment: production
        db_password: "{{ flip_planning_db_password }}"
        admin_password: "{{ flip_planning_admin_password }}"
        mcp_api_key: "{{ flip_planning_mcp_api_key }}"
        repository: "{{ flip_planning_backup_borgmatic_target }}"
        healthcheck_url: "https://uptime.example.invalid/api/push/prod_planning_backup"
        analytics_token: "{{ flip_planning_cloudflare_web_analytics_token }}"
        assets: [flip-logo.png, flip-strip.png, flip-woopy-loader.png, flip-woopy.png, flip.png]
        logo_url: /assets/flip.png
      - service: demo_planning
        prefix: demo-planning
        domain: demo-planning.sylvain.dev
        image: "{{ flip_planning_image_main }}"
        sentry_environment: demo
        db_password: "{{ demo_planning_db_password }}"
        admin_password: "{{ demo_planning_admin_password }}"
        mcp_api_key: "{{ demo_planning_mcp_api_key }}"
        repository: "{{ demo_planning_backup_borgmatic_target }}"
        healthcheck_url: "https://uptime.example.invalid/api/push/demo_planning_backup"
        analytics_token: ""
        assets: []
        logo_url: ""
  tasks:
    - name: Read the newt network definition
      ansible.builtin.command: docker network inspect newt
      register: flip_planning_newt_network
      changed_when: false

    - name: Extract the newt subnet
      ansible.builtin.set_fact:
        flip_planning_newt_subnet: "{{ (flip_planning_newt_network.stdout | from_json)[0].IPAM.Config[0].Subnet }}"

    - name: Verify each Flip Planning instance
      ansible.builtin.include_tasks: tasks/verify_instance.yml
      loop: "{{ flip_planning_instances }}"
      loop_control:
        loop_var: flip_instance
        label: "{{ flip_instance.service }}"

    # Rempli par verify_instance.yml, une entrée par instance.
    - name: Assert the two instances share no container name
      ansible.builtin.assert:
        that:
          - flip_planning_containers['flip_planning'] | intersect(flip_planning_containers['demo_planning']) | length == 0
        fail_msg: >-
          Conteneurs en commun entre production et démo :
          {{ flip_planning_containers['flip_planning'] | intersect(flip_planning_containers['demo_planning']) }}

    - name: Assert the two instances have distinct private networks and Borg repositories
      ansible.builtin.assert:
        that:
          - flip_planning_private_networks['flip_planning'] != flip_planning_private_networks['demo_planning']
          - flip_planning_repositories['flip_planning'] != flip_planning_repositories['demo_planning']
        fail_msg: "Réseau privé ou dépôt Borg partagé : {{ flip_planning_private_networks }} / {{ flip_planning_repositories }}"

    # Régression documentée (flip.yml, AGENTS.md) : un set_fact de
    # flip_planning_backup_healthcheck_url l'emportait sur les paramètres de
    # rôle, et les sauvegardes de la démo poussaient sur le moniteur de prod.
    - name: Assert the demo backups do not push to the production monitor
      ansible.builtin.assert:
        that:
          - flip_planning_push_urls['demo_planning'] != flip_planning_push_urls['flip_planning']
        fail_msg: "La démo pousse sur le moniteur Uptime Kuma de la production : {{ flip_planning_push_urls['demo_planning'] }}"

    # Troisième instance de flip.yml (banc Keycloak temporaire) : déployée et
    # démarrée comme les autres, sans rien partager avec elles. Ses contrôles
    # de contenu restent ceux de verify_instance.yml pour les deux premières.
    - name: Verify the Keycloak test bench deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: demo_planning_kc

    - name: Read the effective compose model of demo_planning_kc
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/demo_planning_kc
      register: flip_planning_kc_compose_raw
      changed_when: false

    - name: Assert the Keycloak test bench shares nothing with the two other instances
      vars:
        flip_planning_kc_compose: "{{ flip_planning_kc_compose_raw.stdout | from_json }}"
        flip_planning_kc_containers: >-
          {{ flip_planning_kc_compose.services | dict2items | map(attribute='value.container_name') | list }}
      ansible.builtin.assert:
        that:
          - flip_planning_kc_containers | intersect(flip_planning_containers['flip_planning']) | length == 0
          - flip_planning_kc_containers | intersect(flip_planning_containers['demo_planning']) | length == 0
          - flip_planning_kc_containers | select('match', '^demo-planning-kc') | list | length == flip_planning_kc_containers | length
          - flip_planning_kc_compose.networks['demo-planning-kc'].name not in (flip_planning_private_networks.values() | list)
        fail_msg: "Conteneurs ou réseau partagés par demo_planning_kc : {{ flip_planning_kc_containers }}"

    # Seule instance sur un tag mobile (pr-72) : dc@ ne tire que les images
    # absentes, c'est `pull_policy: always` qui lui fait reprendre le dernier
    # push à chaque démarrage. flip.yml lu tel quel : converge.yml n'en est
    # qu'une copie, qui ne verrait pas l'override disparaître du playbook.
    - name: Assert the Keycloak test bench follows its moving tag
      vars:
        flip_planning_kc_compose: "{{ flip_planning_kc_compose_raw.stdout | from_json }}"
        flip_planning_kc_playbook_vars: >-
          {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../flip.yml') | from_yaml)
             | map(attribute='roles', default=[]) | flatten | selectattr('vars', 'defined') | map(attribute='vars')
             | selectattr('flip_planning_service', 'defined')
             | selectattr('flip_planning_service', 'equalto', 'demo_planning_kc') | list }}
      ansible.builtin.assert:
        that:
          - flip_planning_kc_compose.services.app.pull_policy == 'always'
          - flip_planning_kc_compose.services.keycloak.pull_policy == 'always'
          - flip_planning_kc_playbook_vars | length == 1
          - flip_planning_kc_playbook_vars[0].flip_planning_image_pull_policy | default('') == 'always'
        fail_msg: >-
          pull_policy du banc Keycloak :
          {{ flip_planning_kc_compose.services | dict2items | map(attribute='value.pull_policy', default='-') | list }}

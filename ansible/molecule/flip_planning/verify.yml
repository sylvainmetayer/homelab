---
# Deux instances du même rôle sur un même hôte : chacune doit être complète
# (verify_instance.yml) et ne rien partager avec l'autre (fin de ce fichier).
- name: Verify
  hosts: all
  # Les defaults du rôle d'abord (images des deux canaux) : les fichiers
  # suivants l'emportent, comme les secrets et host_vars sur le rôle.
  vars_files:
    - ../../roles/flip_planning/defaults/main.yml
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
    - ../../host_vars/flip/variables.yaml
  vars:
    flip_planning_instances:
      - service: flip_planning
        prefix: flip-planning
        domain: flip-planning.sylvain.cloud
        image: "{{ flip_planning_image_release }}"
        sentry_environment: production
        db_password: "{{ prod_planning_db_password }}"
        admin_password: "{{ prod_planning_admin_password }}"
        mcp_api_key: "{{ prod_planning_mcp_api_key }}"
        mcp_pangolin_access_token_id: "{{ prod_planning_mcp_pangolin_access_token_id }}"
        mcp_pangolin_access_token: "{{ prod_planning_mcp_pangolin_access_token }}"
        repository: "{{ flip_planning_backup_borgmatic_target }}"
        healthcheck_url: "https://uptime.example.invalid/api/push/prod_planning_backup"
        analytics_token: "{{ flip_planning_cloudflare_web_analytics_token }}"
        assets: [flip-logo.png, flip-strip.png, flip-woopy-loader.png, flip-woopy.png, flip.png]
        logo_url: /assets/flip.png
      - service: demo_planning
        prefix: demo-planning
        domain: demo-planning.sylvain.dev
        image: "{{ flip_planning_image_main }}"
        sentry_environment: demo
        db_password: "{{ demo_planning_db_password }}"
        admin_password: "{{ demo_planning_admin_password }}"
        mcp_api_key: "{{ demo_planning_mcp_api_key }}"
        # Pas de jeton MCP Pangolin pour la démo (#763) : seule la prod en a un.
        mcp_pangolin_access_token_id: ""
        mcp_pangolin_access_token: ""
        repository: "{{ demo_planning_backup_borgmatic_target }}"
        healthcheck_url: "https://uptime.example.invalid/api/push/demo_planning_backup"
        analytics_token: ""
        assets: []
        logo_url: ""
  tasks:
    - name: Read the newt network definition
      ansible.builtin.command: docker network inspect newt
      register: flip_planning_newt_network
      changed_when: false

    - name: Extract the newt subnet
      ansible.builtin.set_fact:
        flip_planning_newt_subnet: "{{ (flip_planning_newt_network.stdout | from_json)[0].IPAM.Config[0].Subnet }}"

    - name: Verify each Flip Planning instance
      ansible.builtin.include_tasks: tasks/verify_instance.yml
      loop: "{{ flip_planning_instances }}"
      loop_control:
        loop_var: flip_instance
        label: "{{ flip_instance.service }}"

    # Rempli par verify_instance.yml, une entrée par instance.
    - name: Assert the two instances share no container name
      ansible.builtin.assert:
        that:
          - flip_planning_containers['flip_planning'] | intersect(flip_planning_containers['demo_planning']) | length == 0
        fail_msg: >-
          Conteneurs en commun entre production et démo :
          {{ flip_planning_containers['flip_planning'] | intersect(flip_planning_containers['demo_planning']) }}

    - name: Assert the two instances have distinct private networks and Borg repositories
      ansible.builtin.assert:
        that:
          - flip_planning_private_networks['flip_planning'] != flip_planning_private_networks['demo_planning']
          - flip_planning_repositories['flip_planning'] != flip_planning_repositories['demo_planning']
        fail_msg: "Réseau privé ou dépôt Borg partagé : {{ flip_planning_private_networks }} / {{ flip_planning_repositories }}"

    # Régression documentée (flip.yml, AGENTS.md) : un set_fact de
    # flip_planning_backup_healthcheck_url l'emportait sur les paramètres de
    # rôle, et les sauvegardes de la démo poussaient sur le moniteur de prod.
    - name: Assert the demo backups do not push to the production monitor
      ansible.builtin.assert:
        that:
          - flip_planning_push_urls['demo_planning'] != flip_planning_push_urls['flip_planning']
        fail_msg: "La démo pousse sur le moniteur Uptime Kuma de la production : {{ flip_planning_push_urls['demo_planning'] }}"

    # Troisième instance de flip.yml (banc Keycloak temporaire) : déployée et
    # démarrée comme les autres, sans rien partager avec elles. Ses contrôles
    # de contenu restent ceux de verify_instance.yml pour les deux premières.
    - name: Verify the Keycloak test bench deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: demo_planning_kc

    - name: Verify the supporting services of demo_planning_kc
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: demo_planning_kc
        verify_compose_databases:
          - postgres
          - keycloak-db
        verify_compose_healthy_dependencies:
          - { service: app, dependency: postgres }
          - { service: keycloak, dependency: keycloak-db }
        verify_compose_internal_networks:
          - demo-planning-kc
          - demo-planning-kc-keycloak

    - name: Read the effective compose model of demo_planning_kc
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/demo_planning_kc
      register: flip_planning_kc_compose_raw
      changed_when: false

    - name: Assert the Keycloak test bench shares nothing with the two other instances
      vars:
        flip_planning_kc_compose: "{{ flip_planning_kc_compose_raw.stdout | from_json }}"
        flip_planning_kc_containers: >-
          {{ flip_planning_kc_compose.services | dict2items | map(attribute='value.container_name') | list }}
      ansible.builtin.assert:
        that:
          - flip_planning_kc_containers | intersect(flip_planning_containers['flip_planning']) | length == 0
          - flip_planning_kc_containers | intersect(flip_planning_containers['demo_planning']) | length == 0
          - flip_planning_kc_containers | select('match', '^demo-planning-kc') | list | length == flip_planning_kc_containers | length
          - flip_planning_kc_compose.networks['demo-planning-kc'].name not in (flip_planning_private_networks.values() | list)
        fail_msg: "Conteneurs ou réseau partagés par demo_planning_kc : {{ flip_planning_kc_containers }}"

    # Hors de verify_instance.yml, le banc Keycloak : sans jeton MCP Pangolin
    # lui non plus (#763), seule la prod en a un.
    - name: Read the environment file of demo_planning_kc
      ansible.builtin.slurp:
        src: /opt/apps/demo_planning_kc/.env
      register: flip_planning_kc_env_raw

    - name: Assert the Keycloak test bench carries no Pangolin MCP access token
      vars:
        env_content: "{{ flip_planning_kc_env_raw.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - ("\nPLANNING_MCP_PANGOLIN_ACCESS_TOKEN_ID=\n") in env_content
          - ("\nPLANNING_MCP_PANGOLIN_ACCESS_TOKEN=\n") in env_content
        fail_msg: "demo_planning_kc a un jeton MCP Pangolin : seule la production en a un (#763)"

    # Seule instance sur un tag mobile (pr-72) : dc@ ne tire que les images
    # absentes, c'est `pull_policy: always` qui lui fait reprendre le dernier
    # push à chaque démarrage. flip.yml lu tel quel : converge.yml n'en est
    # qu'une copie, qui ne verrait pas l'override disparaître du playbook.
    - name: Assert the Keycloak test bench follows its moving tag
      vars:
        flip_planning_kc_compose: "{{ flip_planning_kc_compose_raw.stdout | from_json }}"
        flip_planning_kc_playbook_vars: >-
          {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../flip.yml') | from_yaml)
             | map(attribute='roles', default=[]) | flatten | selectattr('vars', 'defined') | map(attribute='vars')
             | selectattr('flip_planning_service', 'defined')
             | selectattr('flip_planning_service', 'equalto', 'demo_planning_kc') | list }}
      ansible.builtin.assert:
        that:
          - flip_planning_kc_compose.services.app.pull_policy == 'always'
          - flip_planning_kc_compose.services.keycloak.pull_policy == 'always'
          - flip_planning_kc_playbook_vars | length == 1
          - flip_planning_kc_playbook_vars[0].flip_planning_image_pull_policy | default('') == 'always'
        fail_msg: >-
          pull_policy du banc Keycloak :
          {{ flip_planning_kc_compose.services | dict2items | map(attribute='value.pull_policy', default='-') | list }}

    # Quatrième instance de flip.yml : la vitrine publique, sans SSO, remise à
    # zéro chaque nuit. Ce qui la distingue des autres est ce qui la protège :
    # pas de pgAdmin, webhooks coupés, plafonds et quota du solveur, poids CPU
    # bas, pas de sauvegarde ; et le reset (script, dump, timer) est en place.
    - name: Verify the public showcase deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: exemple_planning
        verify_app_borgmatic_config: ""

    - name: Read the effective compose model of exemple_planning
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/exemple_planning
      register: flip_planning_showcase_compose_raw
      changed_when: false

    - name: Read the .env files of the showcase and of production
      ansible.builtin.slurp:
        src: "/opt/apps/{{ item }}/.env"
      loop: [exemple_planning, flip_planning]
      register: flip_planning_env_files
      no_log: true

    - name: Stat the reset files of exemple_planning
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/apps/exemple_planning/reset.sh
        - /opt/apps/exemple_planning/seed/exemple-planning.dump
        - /opt/apps/flip_planning/reset.sh
        - /etc/borgmatic.d/exemple_planning.yaml
        - /home/sylvain/.config/systemd/user/flip_planning-reset.timer
        - /home/sylvain/.config/systemd/user/demo_planning-reset.timer
        - /home/sylvain/.config/systemd/user/demo_planning_kc-reset.timer
      register: flip_planning_reset_files
      become: true

    - name: Read the reset unit of exemple_planning
      ansible.builtin.slurp:
        src: /home/sylvain/.config/systemd/user/exemple_planning-reset.service
      register: flip_planning_reset_unit

    - name: Check the syntax of the showcase reset script
      ansible.builtin.command: bash -n /opt/apps/exemple_planning/reset.sh
      changed_when: false

    - name: Read the reset timer of exemple_planning
      ansible.builtin.systemd:
        name: exemple_planning-reset.timer
        scope: user
      register: flip_planning_reset_timer

    - name: Assert the showcase is locked down and reset, production untouched
      vars:
        showcase_compose: "{{ flip_planning_showcase_compose_raw.stdout | from_json }}"
        showcase_env: "{{ (flip_planning_env_files.results[0].content | b64decode).splitlines() }}"
        prod_env: "{{ (flip_planning_env_files.results[1].content | b64decode).splitlines() }}"
        reset_unit: "{{ (flip_planning_reset_unit.content | b64decode).splitlines() }}"
        showcase_containers: "{{ showcase_compose.services | dict2items | map(attribute='value.container_name') | list }}"
      ansible.builtin.assert:
        that:
          - "'pgadmin' not in showcase_compose.services"
          - showcase_compose.services.app.cpu_shares == 256
          - "'WEBHOOKS_ENABLED=false' in showcase_env"
          - "'SOLVER_MAX_SOLVES_PER_HOUR=12' in showcase_env"
          - "'SOLVER_MAX_QUEUED_JOBS=2' in showcase_env"
          - "'SOLVER_SECONDS_LIMIT_MAX=60' in showcase_env"
          - "'LEGAL_DEMO_INSTANCE=true' in showcase_env"
          - "'BRANDING_ORGANISATION=Association fictive' in showcase_env"
          - showcase_env | select('match', '^BRANDING_(ACCENT_COLOR|PDF_)') | list | length == 0
          - "'WEBHOOKS_ENABLED=true' in prod_env"
          - prod_env | select('match', '^SOLVER_MAX_') | list | length == 0
          - "'LEGAL_DEMO_INSTANCE=false' in prod_env"
          - flip_planning_reset_files.results[0].stat.exists
          - flip_planning_reset_files.results[0].stat.mode == '0700'
          - flip_planning_reset_files.results[1].stat.exists
          - flip_planning_reset_files.results[1].stat.mode == '0600'
          - not flip_planning_reset_files.results[2].stat.exists
          - flip_planning_reset_files.results[3:] | selectattr('stat.exists') | list | length == 0
          - "'Requires=dc@exemple_planning.service' in reset_unit"
          - "'After=dc@exemple_planning.service' in reset_unit"
          - "'Restart=on-failure' in reset_unit"
          - reset_unit | select('match', '^TimeoutStartSec=') | list | length == 1
          - flip_planning_reset_timer.status.UnitFileState == 'enabled'
          - flip_planning_reset_timer.status.ActiveState == 'active'
          - "'03:30:00 Europe/Paris' in flip_planning_reset_timer.status.TimersCalendar"
          - showcase_containers | select('match', '^exemple-planning') | list | length == showcase_containers | length
          - showcase_containers | intersect(flip_planning_containers['flip_planning'] + flip_planning_containers['demo_planning']) | length == 0
        fail_msg: >-
          Vitrine : compose, .env, reset ou timer inattendus
          (timer : {{ flip_planning_reset_timer.status.TimersCalendar | default('absent') }}).

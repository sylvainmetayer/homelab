---
# Deux instances du même rôle sur un même hôte : chacune doit être complète
# (verify_instance.yml) et ne rien partager avec l'autre ; puis le Keycloak de
# la production (fin de ce fichier).
- name: Verify
  hosts: all
  # Les defaults du rôle d'abord (images des deux canaux) : les fichiers
  # suivants l'emportent, comme les secrets et host_vars sur le rôle.
  vars_files:
    - ../../roles/flip_planning/defaults/main.yml
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
    - ../../host_vars/flip/variables.yaml
  vars:
    flip_planning_instances:
      - service: flip_planning
        prefix: flip-planning
        domain: flip-planning.sylvain.cloud
        image: "{{ flip_planning_image_release }}"
        sentry_environment: production
        db_password: "{{ prod_planning_db_password }}"
        admin_password: "{{ prod_planning_admin_password }}"
        mcp_api_key: "{{ prod_planning_mcp_api_key }}"
        # Plus de jeton MCP Pangolin, ni en prod (#525) ni en démo (#763).
        mcp_pangolin_access_token_id: ""
        mcp_pangolin_access_token: ""
        repository: "{{ flip_planning_backup_borgmatic_target }}"
        healthcheck_url: "https://uptime.example.invalid/api/push/prod_planning_backup"
        analytics_token: "{{ flip_planning_cloudflare_web_analytics_token }}"
        assets: [flip-logo.png, flip-strip.png, flip-woopy-loader.png, flip-woopy.png, flip.png]
        logo_url: /assets/flip.png
        keycloak: true
      - service: demo_planning
        prefix: demo-planning
        domain: demo-planning.sylvain.dev
        image: "{{ flip_planning_image_main }}"
        sentry_environment: demo
        db_password: "{{ demo_planning_db_password }}"
        admin_password: "{{ demo_planning_admin_password }}"
        mcp_api_key: "{{ demo_planning_mcp_api_key }}"
        # Pas de jeton MCP Pangolin pour la démo (#763), ni pour la prod (#525).
        mcp_pangolin_access_token_id: ""
        mcp_pangolin_access_token: ""
        repository: "{{ demo_planning_backup_borgmatic_target }}"
        healthcheck_url: "https://uptime.example.invalid/api/push/demo_planning_backup"
        analytics_token: ""
        assets: []
        logo_url: ""
        keycloak: false
  tasks:
    - name: Read the newt network definition
      ansible.builtin.command: docker network inspect newt
      register: flip_planning_newt_network
      changed_when: false

    - name: Extract the newt subnet
      ansible.builtin.set_fact:
        flip_planning_newt_subnet: "{{ (flip_planning_newt_network.stdout | from_json)[0].IPAM.Config[0].Subnet }}"

    - name: Read the newt-public network definition
      ansible.builtin.command: docker network inspect newt-public
      register: flip_planning_newt_public_network
      changed_when: false

    - name: Extract the newt-public subnet
      ansible.builtin.set_fact:
        flip_planning_newt_public_subnet: "{{ (flip_planning_newt_public_network.stdout | from_json)[0].IPAM.Config[0].Subnet }}"

    - name: Verify each Flip Planning instance
      ansible.builtin.include_tasks: tasks/verify_instance.yml
      loop: "{{ flip_planning_instances }}"
      loop_control:
        loop_var: flip_instance
        label: "{{ flip_instance.service }}"

    # Rempli par verify_instance.yml, une entrée par instance.
    - name: Assert the two instances share no container name
      ansible.builtin.assert:
        that:
          - flip_planning_containers['flip_planning'] | intersect(flip_planning_containers['demo_planning']) | length == 0
        fail_msg: >-
          Conteneurs en commun entre production et démo :
          {{ flip_planning_containers['flip_planning'] | intersect(flip_planning_containers['demo_planning']) }}

    - name: Assert the two instances have distinct private networks and Borg repositories
      ansible.builtin.assert:
        that:
          - flip_planning_private_networks['flip_planning'] != flip_planning_private_networks['demo_planning']
          - flip_planning_repositories['flip_planning'] != flip_planning_repositories['demo_planning']
        fail_msg: "Réseau privé ou dépôt Borg partagé : {{ flip_planning_private_networks }} / {{ flip_planning_repositories }}"

    # Régression documentée (flip.yml, AGENTS.md) : un set_fact de
    # flip_planning_backup_healthcheck_url l'emportait sur les paramètres de
    # rôle, et les sauvegardes de la démo poussaient sur le moniteur de prod.
    - name: Assert the demo backups do not push to the production monitor
      ansible.builtin.assert:
        that:
          - flip_planning_push_urls['demo_planning'] != flip_planning_push_urls['flip_planning']
        fail_msg: "La démo pousse sur le moniteur Uptime Kuma de la production : {{ flip_planning_push_urls['demo_planning'] }}"

    # Keycloak de la production (docs/oidc.md de l'application, OIDC éteint) :
    # image officielle épinglée, deux conteneurs, un réseau interne à part que
    # l'application ne rejoint pas (elle joint le realm par l'URL publique), et
    # rien de tout cela dans la démo.
    - name: Read the effective compose models of production and demo
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: "/opt/apps/{{ item }}"
      loop: [flip_planning, demo_planning]
      register: flip_planning_compose_files
      changed_when: false

    - name: Read the environment files of production and demo
      ansible.builtin.slurp:
        src: "/opt/apps/{{ item }}/.env"
      loop: [flip_planning, demo_planning]
      register: flip_planning_env_files
      no_log: true

    - name: Assert the production Keycloak is in place and isolated
      vars:
        prod_compose: "{{ flip_planning_compose_files.results[0].stdout | from_json }}"
        prod_env_text: "{{ '\n' ~ (flip_planning_env_files.results[0].content | b64decode) }}"
        demo_compose: "{{ flip_planning_compose_files.results[1].stdout | from_json }}"
        demo_env_text: "{{ '\n' ~ (flip_planning_env_files.results[1].content | b64decode) }}"
      ansible.builtin.assert:
        that:
          - prod_compose.services.keycloak.container_name == 'flip-planning-keycloak'
          - prod_compose.services['keycloak-db'].container_name == 'flip-planning-keycloak-db'
          - prod_compose.services.keycloak.image is match('^quay\.io/keycloak/keycloak:[0-9.]+@sha256:[0-9a-f]{64}$')
          # Son propre réseau interne ; Keycloak sort par newt, sa base nulle part ailleurs.
          - prod_compose.networks['flip-planning-keycloak'].internal
          - prod_compose.networks['flip-planning-keycloak'].name not in flip_planning_private_networks.values() | list
          - prod_compose.services['keycloak-db'].networks.keys() | list == ['flip-planning-keycloak']
          - prod_compose.services.keycloak.networks.keys() | sort | list == ['flip-planning-keycloak', 'newt']
          - "'flip-planning-keycloak' not in prod_compose.services.app.networks"
          - "'flip-planning' not in prod_compose.services.keycloak.networks"
          - prod_compose.services | length == 7
          - prod_compose.services.pgadmin.environment.PGADMIN_LISTEN_PORT == '80'
          # Mots de passe de Keycloak : dans le compose de la prod, nulle part dans celui de la démo.
          - prod_planning_keycloak_db_password in flip_planning_compose_files.results[0].stdout
          - prod_planning_keycloak_admin_password in flip_planning_compose_files.results[0].stdout
          - prod_planning_keycloak_db_password not in flip_planning_compose_files.results[1].stdout
          - prod_planning_keycloak_admin_password not in flip_planning_compose_files.results[1].stdout
          - "'keycloak' not in demo_compose.services"
          - "'keycloak-db' not in demo_compose.services"
          # OIDC éteint : rien d'autre qu'OIDC_ENABLED, et le secret client reste dehors.
          - ("\nOIDC_ENABLED=false\n") in prod_env_text
          - prod_env_text is not search('\n(OIDC_(AUTH_SERVER_URL|CLIENT_ID|CLIENT_SECRET|MCP_AUDIENCE)|ADMIN_(LOCAL_)?SECOURS)')
          - prod_planning_oidc_client_secret not in prod_env_text
          - ("\nOIDC_ENABLED=false\n") in demo_env_text
        fail_msg: >-
          Keycloak de la production inattendu : services
          {{ (flip_planning_compose_files.results[0].stdout | from_json).services.keys() | list }}

---
# Reproduit flip.yml pour Flip Planning : le rôle appliqué trois fois sur le
# même hôte (production, démo, banc Keycloak), avec les paramètres de rôle du
# playbook. Les entrées sont recopiées, mais la première tâche compare la copie
# à flip.yml : une instance ajoutée, retirée ou modifiée là-bas fait échouer le
# scénario au lieu de laisser tester un instantané périmé. Le banc Keycloak y
# est en pause (flip_planning_enabled: false) : l'idempotence porte sur cet
# état, side_effect.yml le reprend puis le remet en pause.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/flip/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    - name: Assert this converge applies flip_planning exactly as flip.yml does
      ansible.builtin.assert:
        that:
          - converge_flip_instances == playbook_flip_instances
          # Régression documentée (flip.yml, AGENTS.md) : un set_fact d'une
          # variable du rôle l'emporte sur les `vars:` de chaque instance.
          - playbook_flip_facts | select('match', '^flip_planning_') | list | length == 0
        fail_msg: >-
          ansible/flip.yml et ce converge divergent : recopier ici ses entrées
          `- role: flip_planning` (sans les tags), ou retirer le set_fact d'une
          variable flip_planning_* de ses pre_tasks ({{ playbook_flip_facts }}).
      vars:
        # Texte brut des deux fichiers : les gabarits ne sont pas évalués, ce
        # sont bien les paramètres écrits qui sont comparés.
        playbook_flip_play: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../flip.yml') | from_yaml)[0] }}"
        converge_flip_play: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/converge.yml') | from_yaml)[0] }}"
        playbook_flip_instances: >-
          {{ playbook_flip_play.roles | selectattr('role', 'equalto', 'flip_planning')
             | map('ansible.utils.remove_keys', target=['tags']) | list }}
        converge_flip_instances: >-
          {{ converge_flip_play.roles | selectattr('role', 'equalto', 'flip_planning')
             | map('ansible.utils.remove_keys', target=['tags']) | list }}
        # Les pre_tasks de flip.yml et le fichier commun qu'elles importent
        # (secrets et state de tofu/pangolin_config), bloc déplié.
        playbook_shared_tasks: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../tasks/pangolin_config_outputs.yml') | from_yaml }}"
        playbook_flip_pre_tasks: >-
          {{ playbook_flip_play.pre_tasks + playbook_shared_tasks
             + (playbook_shared_tasks | map(attribute='block', default=[]) | flatten(levels=1)) }}
        playbook_flip_facts: >-
          {{ playbook_flip_pre_tasks | map('dict2items') | flatten(levels=1)
             | selectattr('key', 'equalto', 'ansible.builtin.set_fact')
             | map(attribute='value') | map('list') | flatten }}

    # community.sops.load_vars (ansible-core 2.21+) range les secrets dans la
    # couche include_vars, au-dessus des `vars:` du play et des entrées roles: :
    # une clé de secrets/ansible.sops.yaml nommée comme une variable qu'une instance
    # surcharge l'emporterait sur la surcharge, et la démo recevrait le secret
    # de la production. Les noms des clés SOPS sont en clair : on lit les deux
    # fichiers, le vrai (secrets/ansible.sops.yaml, sous-module du dépôt privé
    # homelab-secrets : présent sur un poste, absent de la CI de Tests, qui ne
    # le clone pas) et celui des faux secrets. Le workflow Lint
    # (.github/scripts/check_sops_shadowing.py) fait la même vérification sur
    # tous les playbooks, tasks/ et rôles, sur le vrai fichier ; celle-ci garde
    # flip.yml couvert quand on ne lance que ce scénario.
    - name: Assert no SOPS key is overridden by flip.yml
      ansible.builtin.assert:
        that:
          - flip_overridden_secrets | length == 0
        fail_msg: >-
          Ces clés de secrets/ansible.sops.yaml sont aussi posées par les `vars:` de
          flip.yml, qui perdraient face à elles : {{ flip_overridden_secrets }}.
          Les renommer dans sops (prod_planning_*, demo_planning_*) et les passer
          à l'instance par ses `vars:`.
      vars:
        flip_real_sops: "{{ playbook_dir ~ '/../../../secrets/ansible.sops.yaml' }}"
        flip_sops_keys: >-
          {{ (((lookup('ansible.builtin.file', flip_real_sops) | from_yaml).keys()
               | list | difference(['sops'])) if flip_real_sops is file else [])
             + (lookup('ansible.builtin.file', playbook_dir ~ '/../_shared/vars/fake_secrets.yml') | from_yaml).keys() | list }}
        flip_play: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../flip.yml') | from_yaml)[0] }}"
        flip_overridden_vars: >-
          {{ ((flip_play.vars | default({})).keys() | list)
             + (flip_play.roles | selectattr('vars', 'defined') | map(attribute='vars')
                | map('list') | flatten) }}
        flip_overridden_secrets: "{{ flip_sops_keys | intersect(flip_overridden_vars) | unique | sort }}"

    # flip.yml les lit dans le state de tofu/pangolin_config et les pose par
    # set_fact : même précédence ici, sous les mêmes noms. Jamais
    # flip_planning_backup_healthcheck_url lui-même (cf. flip.yml).
    - name: Load fake healthcheck URLs in place of the Terraform state outputs
      ansible.builtin.set_fact:
        prod_planning_backup_healthcheck_url: "https://uptime.example.invalid/api/push/prod_planning_backup"
        demo_planning_backup_healthcheck_url: "https://uptime.example.invalid/api/push/demo_planning_backup"
  roles:
    - role: docker_service
    - role: flip_planning
      vars:
        flip_planning_branding_logo: flip/flip.png
        flip_planning_branding_pdf_logo: flip/flip-logo.png
        flip_planning_branding_pdf_strip: flip/flip-strip.png
        flip_planning_branding_mascot: flip/flip-woopy.png
        flip_planning_branding_mascot_icon: flip/flip-woopy-loader.png
        flip_planning_db_password: "{{ prod_planning_db_password }}"
        flip_planning_pgadmin_password: "{{ prod_planning_pgadmin_password }}"
        flip_planning_admin_password: "{{ prod_planning_admin_password }}"
        flip_planning_session_encryption_key: "{{ prod_planning_session_encryption_key }}"
        flip_planning_mcp_api_key: "{{ prod_planning_mcp_api_key }}"
        flip_planning_backup_healthcheck_url: "{{ prod_planning_backup_healthcheck_url }}"
    - role: flip_planning
      vars:
        flip_planning_service: demo_planning
        flip_planning_container_prefix: demo-planning
        flip_planning_domain: demo-planning.sylvain.dev
        flip_planning_image: "{{ flip_planning_image_main }}"
        flip_planning_sentry_environment: demo
        flip_planning_branding_product_name: "Flip Planning — Démo"
        flip_planning_cloudflare_web_analytics_token: ""
        flip_planning_horloge_simulee_autorisee: true
        flip_planning_db_password: "{{ demo_planning_db_password }}"
        flip_planning_pgadmin_password: "{{ demo_planning_pgadmin_password }}"
        flip_planning_admin_password: "{{ demo_planning_admin_password }}"
        flip_planning_session_encryption_key: "{{ demo_planning_session_encryption_key }}"
        flip_planning_mcp_api_key: "{{ demo_planning_mcp_api_key }}"
        flip_planning_backup_enabled: "{{ demo_planning_backup_enabled }}"
        flip_planning_backup_borgmatic_target: "{{ demo_planning_backup_borgmatic_target }}"
        flip_planning_backup_encryption_passphrase: "{{ demo_planning_backup_encryption_passphrase }}"
        flip_planning_backup_healthcheck_url: "{{ demo_planning_backup_healthcheck_url }}"
    - role: flip_planning
      when: demo_planning_kc_db_password is defined
      vars:
        flip_planning_enabled: false
        flip_planning_service: demo_planning_kc
        flip_planning_container_prefix: demo-planning-kc
        flip_planning_domain: demo-planning-kc.sylvain.dev
        flip_planning_image: "ghcr.io/sylvainmetayer/planning-equipes:pr-72"
        flip_planning_sentry_environment: demo-kc
        flip_planning_branding_product_name: "Flip Planning — Keycloak"
        flip_planning_cloudflare_web_analytics_token: ""
        flip_planning_horloge_simulee_autorisee: true
        flip_planning_keycloak_enabled: true
        flip_planning_keycloak_image: "ghcr.io/sylvainmetayer/planning-equipes-keycloak:pr-72"
        flip_planning_image_pull_policy: always
        flip_planning_keycloak_db_password: "{{ demo_planning_kc_keycloak_db_password }}"
        flip_planning_keycloak_admin_password: "{{ demo_planning_kc_keycloak_admin_password }}"
        flip_planning_oidc_enabled: "{{ (demo_planning_kc_oidc_client_secret | default('')) | length > 0 }}"
        flip_planning_oidc_client_secret: "{{ demo_planning_kc_oidc_client_secret | default('') }}"
        flip_planning_oidc_provisioning_client_secret: "{{ demo_planning_kc_oidc_provisioning_client_secret | default('') }}"
        flip_planning_admin_secours_enabled: true
        flip_planning_db_password: "{{ demo_planning_kc_db_password }}"
        flip_planning_pgadmin_password: "{{ demo_planning_kc_pgadmin_password }}"
        flip_planning_admin_password: "{{ demo_planning_kc_admin_password }}"
        flip_planning_session_encryption_key: "{{ demo_planning_kc_session_encryption_key }}"
        flip_planning_mcp_api_key: "{{ demo_planning_kc_mcp_api_key }}"
        flip_planning_backup_enabled: false

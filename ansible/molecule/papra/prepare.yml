---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# La base SQLite déjà là, comme sur l'hôte après le premier démarrage de
# Papra (migrations) : le rôle borgmatic (tasks/app.yml) doit la trouver, la
# copier par « .backup » et exclure sa copie vivante.
- name: Prepare papra
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Ensure the papra database folder exists
      loop:
        - /opt/apps
        - /opt/apps/papra
        - /opt/apps/papra/app-data
        - /opt/apps/papra/app-data/db
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: sylvain
        group: sylvain
        # Le rôle (et docker_service pour /opt/apps) remet son propre mode
        # au premier converge ; l'idempotence porte sur le second.
        mode: "0700"

    - name: Create a papra SQLite database
      become: true
      become_user: sylvain
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          sqlite3.connect('/opt/apps/papra/app-data/db/db.sqlite').execute('CREATE TABLE documents (id TEXT PRIMARY KEY)')"
        creates: /opt/apps/papra/app-data/db/db.sqlite

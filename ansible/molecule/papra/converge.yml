---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  vars:
    # Sorties fictives du state pangolin_config : la connexion Pocket ID rendue.
    terraform_outputs:
      pocket_id_issuer:
        value: https://idp.example.invalid
      pocket_id_papra_client_id:
        value: molecule-pocket-id-papra-client-id
      pocket_id_papra_client_secret:
        value: molecule-pocket-id-papra-client-secret
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: docker_service
    # Relève par e-mail active (désactivée par défaut) : unités, script et
    # configuration posés, timer démarré. verify.yml lance le script hors
    # réseau, sur des .eml (files/).
    - role: papra
      vars:
        papra_intake_enabled: true
        # Si le timer se déclenche pendant le test : pas de connexion réelle.
        papra_intake_imap_host: imap.example.invalid
        papra_intake_allowed_senders:
          - "@example.org"

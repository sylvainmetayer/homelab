---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../_shared/vars/fake_secrets.yml
  tasks:
    - name: Verify the papra deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: papra
        verify_app_borgmatic_config: /etc/borgmatic.d/papra.yaml

    - name: Verify the papra healthcheck
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: papra
        verify_compose_healthchecks:
          - app

    - name: Render the papra compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/papra
      register: papra_compose_raw
      changed_when: false

    - name: Assert papra drops every capability
      vars:
        papra_compose: "{{ papra_compose_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - papra_compose.services.app.cap_drop == ['ALL']
          - papra_compose.services.app.cap_add is not defined

    - name: Stat the papra bind mounts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/apps/papra/app-data
        - /opt/apps/papra/ingestion
      register: papra_dirs

    # Le conteneur tourne avec l'uid/gid de l'hôte, sans capacité : ses deux
    # bind mounts doivent être à cet utilisateur, sans quoi Papra ne peut ni
    # écrire sa base ni supprimer un fichier importé.
    - name: Assert papra runs as the owner of its bind mounts
      vars:
        papra_compose: "{{ papra_compose_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - papra_compose.services.app.user == (item.stat.uid | string) ~ ':' ~ (item.stat.gid | string)
          - item.stat.mode == '0700'
        fail_msg: "{{ item.item }} : propriétaire {{ item.stat.uid }}:{{ item.stat.gid }}, conteneur {{ papra_compose.services.app.user }}"
      loop: "{{ papra_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the papra borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/borgmatic.d/papra.yaml
      register: papra_borgmatic_raw

    # prepare.yml a posé db.sqlite : copiée par « .backup » dans le dossier de
    # staging archivé, sa copie vivante hors de l'archive. Jamais
    # sqlite_databases : son « .dump » en flux bloque les écritures tout le
    # temps de l'envoi.
    - name: Assert the papra SQLite database is copied by .backup, not dumped or copied live
      vars:
        papra_borgmatic: "{{ papra_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - papra_borgmatic.sqlite_databases is not defined
          - "'/var/lib/borgmatic-sqlite/papra' in papra_borgmatic.source_directories"
          - >-
            papra_borgmatic.commands[0].run
            | select('search', 'sqlite3 -bail .*/opt/apps/papra/app-data/db/db\\.sqlite ')
            | select('search', '\\.backup /var/lib/borgmatic-sqlite/papra/opt_apps_papra_app-data_db_db\\.sqlite')
            | list | length == 1
          - "'/opt/apps/papra/app-data/db/db.sqlite' in papra_borgmatic.exclude_patterns"
          - "'/opt/apps/papra/app-data/db/db.sqlite-wal' in papra_borgmatic.exclude_patterns"
          - "'/opt/apps/papra/app-data' in papra_borgmatic.source_directories"
        fail_msg: "Configuration borgmatic de papra inattendue : {{ papra_borgmatic }}"

    - name: Stat the papra environment file
      ansible.builtin.stat:
        path: /opt/apps/papra/.env
      register: papra_env

    # Il porte le secret de session : jamais lisible par d'autres.
    - name: Assert the papra environment file is private
      ansible.builtin.assert:
        that:
          - papra_env.stat.exists
          - papra_env.stat.mode == '0600'

    - name: Read the papra environment file
      ansible.builtin.slurp:
        src: /opt/apps/papra/.env
      register: papra_env_content

    # Inscription fermée par défaut (papra_registration_enabled), corbeille
    # gardée 90 jours, et un secret de session d'au moins 32 caractères, sans
    # quoi Papra refuse de démarrer.
    - name: Assert papra registration is closed, trash retention and auth secret
      vars:
        papra_env_lines: "{{ (papra_env_content.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - "'AUTH_IS_REGISTRATION_ENABLED=false' in papra_env_lines"
          - "'DOCUMENTS_DELETED_DOCUMENTS_RETENTION_DAYS=90' in papra_env_lines"
          - papra_env_lines | select('match', '^AUTH_SECRET=[0-9a-f]{64}$') | list | length == 1

    # File des tâches dans une base du volume, à côté de db.sqlite (glob de
    # la sauvegarde) : en mémoire, un redémarrage la perdrait.
    - name: Assert papra persists its task queue on the volume
      vars:
        papra_env_lines: "{{ (papra_env_content.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - "'TASKS_PERSISTENCE_DRIVER=libsql' in papra_env_lines"
          - "'TASKS_PERSISTENCE_DRIVERS_LIBSQL_URL=file:/app/app-data/db/tasks.sqlite' in papra_env_lines"

    # Molecule ne démarre pas Papra : une valeur que son schéma refuse
    # (EMAILS_DRIVER hors de logger/resend/smtp, motif de stockage mal
    # échappé) ne se verrait qu'au déploiement, conteneur en boucle.
    - name: Assert papra sends e-mails over SMTP and names its files with the literal pattern
      vars:
        papra_env_lines: "{{ (papra_env_content.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - "'EMAILS_DRIVER=smtp' in papra_env_lines"
          - "'SMTP_PASSWORD=' ~ pangolin_smtp_pass in papra_env_lines"
          - "'EMAILS_FROM_ADDRESS=Papra <' ~ pangolin_smtp_user ~ '>' in papra_env_lines"
          - "'DOCUMENT_STORAGE_USE_LEGACY_STORAGE_KEY_DEFINITION_SYSTEM=false' in papra_env_lines"
          - papra_env_lines | select('match', '^DOCUMENT_STORAGE_KEY_PATTERN=\\{\\{organization\\.id\\}\\}/\\{\\{document\\.name\\}\\}$') | list | length == 1

    # --- Relève par e-mail (papra-intake.timer, activée par converge.yml) ---
    - name: Stat the papra intake files
      become: true
      loop:
        - /usr/local/libexec/papra_intake.py
        - /etc/papra-intake.json
        - /etc/systemd/system/papra-intake.service
        - /etc/systemd/system/papra-intake.timer
      ansible.builtin.stat:
        path: "{{ item }}"
      register: papra_intake_files

    # Le script et les unités à root, lisibles ; la configuration (mot de
    # passe d'application) en 0600 au seul compte de l'unité.
    - name: Assert the papra intake files have the expected owners and modes
      loop: "{{ papra_intake_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == ('sylvain' if item.item.endswith('.json') else 'root')
          - item.stat.mode == ('0600' if item.item.endswith('.json') else '0644')
        fail_msg: "{{ item.item }} : {{ item.stat.pw_name | default('absent') }} {{ item.stat.mode | default('') }}"
        quiet: true

    - name: Read the papra intake configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/papra-intake.json
      register: papra_intake_config_raw

    - name: Assert the papra intake configuration carries the SOPS credentials
      vars:
        papra_intake_config: "{{ papra_intake_config_raw.content | b64decode | from_json }}"
      no_log: true
      ansible.builtin.assert:
        that:
          - papra_intake_config.user == papra_intake_imap_user
          - papra_intake_config.password == papra_intake_imap_password
          - papra_intake_config.port | int == 993
          - papra_intake_config.allowed_senders == ['@example.org']
          - papra_intake_config.dest_dir == '/opt/apps/papra/ingestion/org_z9tq7wl3o5airawxel6f3e5i'
          - papra_intake_config.tmp_dir == '/opt/apps/papra/intake-tmp'
          - papra_intake_config.max_bytes | int == 26214400

    - name: Verify the papra intake units
      become: true
      ansible.builtin.command: systemd-analyze verify papra-intake.service papra-intake.timer
      register: papra_intake_analyze
      changed_when: false
      failed_when: >-
        papra_intake_analyze.rc != 0
        or (papra_intake_analyze.stderr_lines | select('search', 'papra-intake') | list | length > 0)

    - name: Read the papra intake timer
      ansible.builtin.systemd:
        name: papra-intake.timer
      register: papra_intake_timer

    - name: Read the papra intake service
      ansible.builtin.systemd:
        name: papra-intake.service
      register: papra_intake_unit

    # Toutes les 15 minutes, sous sylvain (l'uid du conteneur), la
    # configuration jamais sur la ligne de commande.
    - name: Assert the papra intake runs every 15 minutes, unprivileged
      ansible.builtin.assert:
        that:
          - papra_intake_timer.status.UnitFileState == 'enabled'
          - papra_intake_timer.status.ActiveState == 'active'
          - papra_intake_timer.status.TimersCalendar is search('OnCalendar=\*-\*-\* \*:00/15:00')
          - papra_intake_unit.status.Type == 'oneshot'
          - papra_intake_unit.status.User == 'sylvain'
          - papra_intake_unit.status.ProtectSystem == 'strict'
          - papra_intake_unit.status.NoNewPrivileges == 'yes'
          - papra_intake_unit.status.ExecStart is search('/usr/local/libexec/papra_intake.py --config /etc/papra-intake.json ')

    - name: Stat the papra intake folders
      loop:
        - /opt/apps/papra/ingestion/org_z9tq7wl3o5airawxel6f3e5i
        - /opt/apps/papra/intake-tmp
      ansible.builtin.stat:
        path: "{{ item }}"
      register: papra_intake_dirs

    - name: Assert the papra intake folders belong to the container user
      loop: "{{ papra_intake_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.pw_name == 'sylvain'
          - item.stat.mode == '0700'

    # Le traitement d'un message, hors réseau : le script déployé, sa
    # configuration déployée, des .eml fixes (files/). Un expéditeur autorisé
    # (@example.org) avec deux PDF du même nom (dont un « ../../etc/… »), un
    # .exe et un logo en ligne ; un expéditeur inconnu.
    - name: Copy the papra intake fixtures
      become: true
      loop:
        - intake-allowed.eml
        - intake-refused.eml
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/tmp/{{ item }}"
        owner: sylvain
        group: sylvain
        mode: "0600"

    - name: Run the papra intake on the fixtures
      become: true
      become_user: sylvain
      loop:
        - intake-allowed.eml
        - intake-refused.eml
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - /usr/local/libexec/papra_intake.py
          - --config
          - /etc/papra-intake.json
          - --eml
          - "/tmp/{{ item }}"
      register: papra_intake_runs
      changed_when: true

    - name: List the papra ingestion folder
      ansible.builtin.find:
        paths: /opt/apps/papra/ingestion/org_z9tq7wl3o5airawxel6f3e5i
        hidden: true
      register: papra_intake_written

    # Les deux PDF sous un nom sûr, le second suffixé ; ni .exe ni logo ;
    # rien hors du dossier de l'organisation ; le sas vidé ; des fichiers
    # 0600 au compte du conteneur, que Papra lira puis supprimera.
    - name: Assert the papra intake drops only the allowed attachments, safely named
      vars:
        papra_intake_allowed: "{{ papra_intake_runs.results[0].stdout | from_json }}"
        papra_intake_refused: "{{ papra_intake_runs.results[1].stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - papra_intake_allowed.allowed
          - papra_intake_allowed.written == ['Facture été 2026.pdf', 'Facture été 2026-1.pdf']
          - papra_intake_allowed.skipped == 1
          - not papra_intake_refused.allowed
          - papra_intake_refused.domain == 'elsewhere.example'
          - papra_intake_refused.written == []
          - papra_intake_written.files | map(attribute='path') | map('basename') | sort == ['Facture été 2026-1.pdf', 'Facture été 2026.pdf']
          - papra_intake_written.files | map(attribute='pw_name') | unique == ['sylvain']
          - papra_intake_written.files | map(attribute='mode') | unique == ['0600']
        fail_msg: "{{ papra_intake_runs.results | map(attribute='stdout') | list }} / {{ papra_intake_written.files | map(attribute='path') | list }}"

    - name: Find leftovers in the papra intake staging folder
      ansible.builtin.find:
        paths: /opt/apps/papra/intake-tmp
        hidden: true
      register: papra_intake_leftovers

    - name: Assert the papra intake staging folder is empty
      ansible.builtin.assert:
        that:
          - papra_intake_leftovers.matched == 0

    - name: Remove the papra intake test files
      become: true
      loop: "{{ papra_intake_written.files | map(attribute='path') | list }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent

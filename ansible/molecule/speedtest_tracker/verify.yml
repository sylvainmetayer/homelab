---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    - name: Verify the speedtest_tracker deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: speedtest_tracker
        verify_app_borgmatic_config: /etc/borgmatic.d/speedtest_tracker.yaml

    - name: Verify the speedtest_tracker healthcheck
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: speedtest_tracker
        verify_compose_healthchecks:
          - app

    - name: Render the speedtest_tracker compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/speedtest_tracker
      register: speedtest_tracker_compose_raw
      changed_when: false

    # Un seul conteneur : rien à isoler sur un réseau privé, newt suffit. Son
    # nom est la cible de Pangolin (website_speedtest_tracker.tf).
    - name: Assert speedtest_tracker only joins newt and publishes no port
      vars:
        speedtest_tracker_compose: "{{ speedtest_tracker_compose_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - speedtest_tracker_compose.services.app.container_name == 'speedtest-tracker'
          - speedtest_tracker_compose.services.app.networks.keys() | list == ['newt']
          - speedtest_tracker_compose.networks.keys() | list == ['newt']
          - speedtest_tracker_compose.services.app.ports is not defined
        fail_msg: "Service speedtest_tracker inattendu : {{ speedtest_tracker_compose.services.app }}"

    - name: Read the speedtest_tracker borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/borgmatic.d/speedtest_tracker.yaml
      register: speedtest_tracker_borgmatic_raw

    # prepare.yml a posé database.sqlite : copiée par « .backup » dans le
    # dossier de staging archivé, sa copie vivante hors de l'archive. Jamais
    # sqlite_databases : son « .dump » en flux bloque les écritures tout le
    # temps de l'envoi.
    - name: Assert the speedtest_tracker SQLite database is copied by .backup, not dumped or copied live
      vars:
        speedtest_tracker_borgmatic: "{{ speedtest_tracker_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - speedtest_tracker_borgmatic.sqlite_databases is not defined
          - "'/var/lib/borgmatic-sqlite/speedtest_tracker' in speedtest_tracker_borgmatic.source_directories"
          - >-
            speedtest_tracker_borgmatic.commands[0].run
            | select('search', '^sqlite3 -bail .*/opt/apps/speedtest_tracker/config/database\\.sqlite ')
            | select('search', '\\.backup /var/lib/borgmatic-sqlite/speedtest_tracker/opt_apps_speedtest_tracker_config_database\\.sqlite')
            | list | length == 1
          - "'/opt/apps/speedtest_tracker/config/database.sqlite' in speedtest_tracker_borgmatic.exclude_patterns"
          - "'/opt/apps/speedtest_tracker/config/database.sqlite-wal' in speedtest_tracker_borgmatic.exclude_patterns"
          - "'/opt/apps/speedtest_tracker/config/log' in speedtest_tracker_borgmatic.exclude_patterns"
          - "'/opt/apps/speedtest_tracker/config' in speedtest_tracker_borgmatic.source_directories"
        fail_msg: "Configuration borgmatic de speedtest_tracker inattendue : {{ speedtest_tracker_borgmatic }}"

    - name: Stat the speedtest_tracker environment file
      ansible.builtin.stat:
        path: /opt/apps/speedtest_tracker/.env
      register: speedtest_tracker_env

    # Il porte APP_KEY et le mot de passe administrateur : jamais lisible par
    # d'autres.
    - name: Assert the speedtest_tracker environment file is private
      ansible.builtin.assert:
        that:
          - speedtest_tracker_env.stat.exists
          - speedtest_tracker_env.stat.mode == '0600'

    - name: Read the speedtest_tracker environment file
      ansible.builtin.slurp:
        src: /opt/apps/speedtest_tracker/.env
      register: speedtest_tracker_env_content

    - name: Assert the speedtest_tracker dashboard is closed to anonymous users
      vars:
        speedtest_tracker_env_lines: "{{ (speedtest_tracker_env_content.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - "'PUBLIC_DASHBOARD=false' in speedtest_tracker_env_lines"

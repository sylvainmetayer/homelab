---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # docker.yml lit cette URL dans les outputs du state pangolin_config.
    - name: Load healthcheck URLs from (fake) Terraform state outputs
      ansible.builtin.set_fact:
        dawarich_backup_healthcheck_url: https://uptime.example.invalid/api/push/molecule-dawarich
        terraform_outputs:
          pocket_id_dawarich_client_id:
            value: molecule-pocket-id-dawarich-client-id
          pocket_id_dawarich_client_secret:
            value: molecule-pocket-id-dawarich-client-secret
  roles:
    - role: docker_service
    - role: dawarich

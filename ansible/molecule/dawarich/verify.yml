---
- name: Verify
  hosts: all
  vars_files:
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
  vars:
    dawarich_path: "{{ docker_base_path }}/dawarich"
  tasks:
    - name: Verify the dawarich deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: dawarich
        verify_app_borgmatic_config: "{{ borgmatic_config_dir }}/dawarich.yaml"

    - name: Stat the dawarich environment file
      ansible.builtin.stat:
        path: "{{ dawarich_path }}/.env"
      register: dawarich_env_stat

    # Il porte les mots de passe de la base, du SMTP et les secrets Rails.
    - name: Assert the dawarich environment file is private
      ansible.builtin.assert:
        that:
          - dawarich_env_stat.stat.exists
          - dawarich_env_stat.stat.mode == '0600'
          - dawarich_env_stat.stat.pw_name == ansible_facts['user_id']

    - name: Read the dawarich files
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ dawarich_path }}/.env"
        - "{{ dawarich_path }}/compose.yaml"
        - "{{ borgmatic_config_dir }}/dawarich.yaml"
      register: dawarich_files

    - name: Parse the dawarich files
      ansible.builtin.set_fact:
        dawarich_env: >-
          {{ dict((dawarich_files.results[0].content | b64decode).splitlines()
             | select('match', '^[A-Z_]+=') | map('split', '=', 1)) }}
        dawarich_compose: "{{ dawarich_files.results[1].content | b64decode | from_yaml }}"
        dawarich_borgmatic: "{{ dawarich_files.results[2].content | b64decode | from_yaml }}"

    # Secrets tous dérivés de la variable backup_passphrase, jamais vides et tous distincts.
    - name: Assert the dawarich secrets are derived and distinct
      ansible.builtin.assert:
        that:
          - dawarich_secrets | select('match', '^[0-9a-f]{64}$') | list | length == 4
          - dawarich_secrets | unique | length == 4
        fail_msg: Secrets dawarich vides, mal dérivés ou identiques
      vars:
        dawarich_secrets:
          - "{{ dawarich_env.DATABASE_PASSWORD }}"
          - "{{ dawarich_env.JWT_SECRET_KEY }}"
          - "{{ dawarich_env.AUTH_JWT_SECRET_KEY }}"
          - "{{ dawarich_env.SECRET_KEY_BASE }}"

    - name: Assert the dawarich environment comes from the role and the secrets
      ansible.builtin.assert:
        that:
          - dawarich_env.APPLICATION_HOSTS == 'tracks.sylvain.cloud'
          - dawarich_env.DATABASE_HOST == dawarich_compose.services['dawarich-db'].container_name
          - dawarich_env.PHOTON_API_KEY == dawarich_chibigeo_api_key
          - dawarich_env.SMTP_USERNAME == pangolin_smtp_user
          - dawarich_env.SMTP_PASSWORD == pangolin_smtp_pass

    # Le dump borgmatic doit viser la base du compose avec les identifiants du .env.
    - name: Assert borgmatic dumps the dawarich database
      ansible.builtin.assert:
        that:
          - dawarich_db.container == dawarich_compose.services['dawarich-db'].container_name
          - dawarich_db.name == dawarich_env.DATABASE_NAME
          - dawarich_db.username == dawarich_env.DATABASE_USERNAME
          - dawarich_db.password == dawarich_env.DATABASE_PASSWORD
          - dawarich_borgmatic.uptime_kuma.push_url == 'https://uptime.example.invalid/api/push/molecule-dawarich'
          - dawarich_borgmatic.repositories[0].path is search('/dawarich$')
          - dawarich_borgmatic.encryption_passphrase == backup_passphrase
          - dawarich_borgmatic.archive_name_format is match('dawarich-')
      vars:
        dawarich_db: "{{ dawarich_borgmatic.postgresql_databases[0] }}"

    - name: Assert only the web container joins the newt network
      ansible.builtin.assert:
        that:
          - dawarich_compose.networks.newt.external
          - dawarich_newt_services == ['dawarich-app']
        fail_msg: "Services sur newt : {{ dawarich_newt_services }}"
      vars:
        dawarich_newt_services: >-
          {{ dawarich_compose.services | dict2items
             | selectattr('value.networks', 'defined')
             | selectattr('value.networks', 'contains', 'newt')
             | map(attribute='key') | list }}

    # Doctrine (AGENTS.md) : mem_limit partout, mem_reservation sur la base,
    # quota CPU sur sidekiq seulement.
    - name: Assert the dawarich resource limits follow the doctrine
      ansible.builtin.assert:
        that:
          - dawarich_compose.services | dict2items | rejectattr('value.mem_limit', 'defined') | list | length == 0
          - dawarich_compose.services['dawarich-db'].mem_reservation is defined
          - dawarich_compose.services['dawarich-db'].cpus is not defined
          - dawarich_compose.services['dawarich-redis'].cpus is not defined
          - dawarich_compose.services['dawarich-app'].cpus is not defined
          - dawarich_compose.services['dawarich-sidekiq'].cpus is defined
        fail_msg: Limites de ressources de dawarich hors doctrine (cf. AGENTS.md)

    - name: Stat the dawarich redis folder
      ansible.builtin.stat:
        path: "{{ dawarich_path }}/redis"
      register: dawarich_redis_dir

    - name: Assert the dawarich redis folder belongs to the redis image uid
      ansible.builtin.assert:
        that:
          - dawarich_redis_dir.stat.isdir
          - dawarich_redis_dir.stat.uid == 999
          - dawarich_redis_dir.stat.gid == 999

    - name: Stat the dawarich backup sources
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ dawarich_borgmatic.source_directories }}"
      register: dawarich_sources

    - name: Assert every dawarich backup source exists
      ansible.builtin.assert:
        that:
          - dawarich_sources.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: "Sources absentes : {{ dawarich_sources.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

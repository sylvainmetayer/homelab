---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    ssh_login_notify_test_log: /var/lib/molecule-push/requests.jsonl
    ssh_login_notify_test_ntfy_log: /var/lib/molecule-push/ntfy.jsonl
    ssh_login_notify_test_ssh: >-
      ssh -o BatchMode=yes -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml
  tasks:
    # --- les listes du dépôt, comparées aux clés de keys/ : la CI et Ansible
    # connues partout sauf sur newt-lxc, dont la liste est vide ---

    - name: Compute the fingerprints of the repository keys
      ansible.builtin.command:
        cmd: ssh-keygen -l -E sha256 -f -
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../../keys/' ~ item ~ '.pub') }}"
      register: ssh_login_notify_test_repo_fps
      changed_when: false
      loop:
        - github-actions
        - perso

    - name: Assert the known lists of the repository
      vars:
        ci_fp: "{{ ssh_login_notify_test_repo_fps.results[0].stdout.split()[1] }}"
        ansible_fp: "{{ ssh_login_notify_test_repo_fps.results[1].stdout.split()[1] }}"
        role_defaults: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../roles/ssh_login_notify/defaults/main.yml') | from_yaml }}"
        newt_lxc: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../host_vars/newt-lxc/variables.yaml') | from_yaml }}"
      ansible.builtin.assert:
        that:
          - role_defaults.ssh_login_notify_known_fingerprints == [ci_fp, ansible_fp]
          - newt_lxc.ssh_login_notify_known_fingerprints == []

    # --- ce qui est posé ---

    - name: Read the sshd PAM stack
      become: true
      ansible.builtin.slurp:
        src: /etc/pam.d/sshd
      register: ssh_login_notify_pam

    # `optional` : un hook en échec ne refuse jamais la session. Un
    # `required` ici fermerait la porte au premier curl manquant.
    - name: Assert the hook is an optional session module, once
      vars:
        pam_hook_lines: >-
          {{ (ssh_login_notify_pam.content | b64decode).splitlines()
             | select('search', 'ssh-login-notify') | list }}
      ansible.builtin.assert:
        that:
          - pam_hook_lines == ['session optional pam_exec.so quiet /usr/local/sbin/ssh-login-notify']
        fail_msg: "{{ pam_hook_lines }}"

    - name: Read the hook files
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ssh_login_notify_files
      loop:
        - /etc/ssh-login-notify.conf
        - /usr/local/sbin/ssh-login-notify

    # La configuration porte le jeton du moniteur push.
    - name: Assert the hook files belong to root, private
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == ('0600' if item.item.endswith('.conf') else '0700')
        fail_msg: "{{ item.item }} : {{ item.stat.pw_name | default('absent') }} {{ item.stat.mode | default('') }}"
      loop: "{{ ssh_login_notify_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- une connexion par clé notifie, avec le nom et l'empreinte de la clé ---

    - name: Compute the fingerprint of the test key
      ansible.builtin.command: ssh-keygen -l -f /home/sylvain/.ssh/molecule-login.pub
      register: ssh_login_notify_test_fp
      changed_when: false

    - name: Reset the push and ntfy logs
      ansible.builtin.import_tasks: tasks/reset_logs.yml

    - name: Log in over SSH with the notifying key
      ansible.builtin.command: >-
        {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-login sylvain@127.0.0.1 true
      changed_when: false

    - name: Wait for the push
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false
      until: ssh_login_notify_pushes.stdout_lines | length >= 1
      retries: 15
      delay: 1

    # SSH_AUTH_INFO_0 atteint bien pam_exec : sans lui, ni nom ni empreinte.
    - name: Assert the push names the user, the source and the key
      vars:
        push: "{{ ssh_login_notify_pushes.stdout_lines[0] | from_json }}"
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pushes.stdout_lines | length == 1
          - push.path == '/api/push/molecule-ssh-login'
          - push.status == 'up'
          - push.msg is search('^sylvain@\\S+ depuis 127\\.0\\.0\\.1, clé molecule-login \\(ssh-ed25519 ')
          - (ssh_login_notify_test_fp.stdout.split()[1]) in push.msg
        fail_msg: "{{ ssh_login_notify_pushes.stdout_lines }}"

    # Une connexion sans session interactive (ssh -N, comme un ProxyJump par
    # le bastion) ouvre aussi une session PAM, donc notifie.
    - name: Open a connection without a shell
      ansible.builtin.shell: >-
        timeout 3 {{ ssh_login_notify_test_ssh }} -N
        -i /home/sylvain/.ssh/molecule-login sylvain@127.0.0.1 || test $? -eq 124
      changed_when: false

    - name: Wait for the second push
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false
      until: ssh_login_notify_pushes.stdout_lines | length >= 2
      retries: 15
      delay: 1

    # --- une empreinte de ssh_login_notify_known_fingerprints : trace sur ntfy
    # et journal, sans push ; une autre clé au même commentaire : push, sans
    # trace ---

    - name: Compute the fingerprints of the known and impostor keys
      ansible.builtin.command: ssh-keygen -l -E sha256 -f /home/sylvain/.ssh/{{ item }}.pub
      register: ssh_login_notify_test_fps
      changed_when: false
      loop:
        - molecule-known
        - molecule-impostor

    - name: Assert nothing went to ntfy so far
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_ntfy_log }}
      register: ssh_login_notify_ntfy
      changed_when: false
      failed_when: ssh_login_notify_ntfy.stdout | length > 0

    - name: Log in over SSH with the known key
      ansible.builtin.command: >-
        {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-known sylvain@127.0.0.1 true
      changed_when: false

    - name: Wait for the ntfy trace
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_ntfy_log }}
      register: ssh_login_notify_ntfy
      changed_when: false
      until: ssh_login_notify_ntfy.stdout_lines | length >= 1
      retries: 15
      delay: 1

    - name: Leave time for a push that must not come
      ansible.builtin.pause:
        seconds: 3

    - name: Read the pushes and the journal after the known key
      become: true
      ansible.builtin.command: "{{ item }}"
      register: ssh_login_notify_known_reads
      changed_when: false
      loop:
        - cat {{ ssh_login_notify_test_log }}
        - journalctl -t ssh-login-notify -o cat --no-pager

    - name: Assert the known key left a low priority trace, a journal line and no push
      vars:
        known_fp: "{{ ssh_login_notify_test_fps.results[0].stdout.split()[1] }}"
        trace: "{{ ssh_login_notify_ntfy.stdout_lines[0] | from_json }}"
      ansible.builtin.assert:
        that:
          - ssh_login_notify_ntfy.stdout_lines | length == 1
          - trace.path == '/scripts'
          - trace.priority == 'low'
          - trace.authorization == 'Bearer ' ~ ntfy_scripts_token
          - trace.title is search('^SSH \\S+$')
          - trace.body is search('^sylvain@\\S+ depuis 127\\.0\\.0\\.1, clé molecule-known \\(ssh-ed25519 ')
          - known_fp in trace.body
          - ssh_login_notify_known_reads.results[0].stdout_lines | length == 2
          - known_fp not in ssh_login_notify_known_reads.results[0].stdout
          - >-
            'clé connue : sylvain@' in ssh_login_notify_known_reads.results[1].stdout
          - known_fp in ssh_login_notify_known_reads.results[1].stdout
        fail_msg: "{{ ssh_login_notify_ntfy.stdout_lines }} / {{ ssh_login_notify_known_reads.results | map(attribute='stdout_lines') | list }}"

    # Même commentaire « molecule-known » dans authorized_keys, autre clé :
    # renommer sa clé ne fait pas taire l'alerte.
    - name: Log in over SSH with the key that borrows the known comment
      ansible.builtin.command: >-
        {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-impostor sylvain@127.0.0.1 true
      changed_when: false

    - name: Wait for the push of the impostor key
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false
      until: ssh_login_notify_pushes.stdout_lines | length >= 3
      retries: 15
      delay: 1

    - name: Read the ntfy log after the impostor key
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_ntfy_log }}
      register: ssh_login_notify_ntfy
      changed_when: false

    - name: Assert the impostor key pushed and left no trace
      vars:
        impostor_fp: "{{ ssh_login_notify_test_fps.results[1].stdout.split()[1] }}"
        push: "{{ ssh_login_notify_pushes.stdout_lines[2] | from_json }}"
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pushes.stdout_lines | length == 3
          - push.msg is search('clé molecule-known \\(ssh-ed25519 ')
          - impostor_fp in push.msg
          - ssh_login_notify_ntfy.stdout_lines | length == 1
          - impostor_fp not in ssh_login_notify_ntfy.stdout
        fail_msg: "{{ ssh_login_notify_pushes.stdout_lines }} / {{ ssh_login_notify_ntfy.stdout_lines }}"

    # --- le trou DOWN→DOWN : un moniteur déjà DOWN ne renotifie pas, et seul un
    # push le fait passer DOWN. Une clé connue ne poussant pas, la clé inconnue
    # qui la suit de quelques secondes est le premier push de la fenêtre ---

    - name: Reset the push and ntfy logs before the window test
      ansible.builtin.import_tasks: tasks/reset_logs.yml

    - name: Log in with the known key, then with an unknown one right after
      ansible.builtin.command: >-
        {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/{{ item }} sylvain@127.0.0.1 true
      changed_when: false
      loop:
        - molecule-known
        - molecule-known
        - molecule-login

    - name: Wait for the trace of the known key and the push of the unknown one
      become: true
      ansible.builtin.shell: cat {{ ssh_login_notify_test_ntfy_log }}; cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_window
      changed_when: false
      until: ssh_login_notify_window.stdout_lines | length >= 3
      retries: 15
      delay: 1

    - name: Leave time for a push that must not come
      ansible.builtin.pause:
        seconds: 3

    - name: Read the pushes of the window
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false

    - name: Assert the unknown key is the only push of the window
      vars:
        push: "{{ ssh_login_notify_pushes.stdout_lines[0] | from_json }}"
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pushes.stdout_lines | length == 1
          - push.msg is search('clé molecule-login \\(ssh-ed25519 ')
        fail_msg: "{{ ssh_login_notify_pushes.stdout_lines }}"

    # --- une connexion multiplexée n'ouvre qu'une session PAM, quel que soit le
    # nombre de commandes : un seul push ---

    - name: Reset the push and ntfy logs before the multiplexed connection
      ansible.builtin.import_tasks: tasks/reset_logs.yml

    # Le maître par -fN, flux fermés : un maître qui hérite de stderr ferait
    # attendre la tâche jusqu'à sa fin.
    - name: Run three commands through one ControlMaster connection
      ansible.builtin.shell: |
        set -e
        mux="-o ControlPath=/tmp/molecule-ssh-mux -i /home/sylvain/.ssh/molecule-login"
        {{ ssh_login_notify_test_ssh }} $mux -o ControlMaster=yes -fN sylvain@127.0.0.1 </dev/null >/dev/null 2>&1
        for command in 1 2 3; do
          {{ ssh_login_notify_test_ssh }} $mux -o ControlMaster=no sylvain@127.0.0.1 "true $command"
        done
        {{ ssh_login_notify_test_ssh }} $mux -O check sylvain@127.0.0.1
        {{ ssh_login_notify_test_ssh }} $mux -O exit sylvain@127.0.0.1
      changed_when: false

    - name: Wait for the push of the multiplexed connection
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false
      until: ssh_login_notify_pushes.stdout_lines | length >= 1
      retries: 15
      delay: 1

    - name: Leave time for a push that must not come
      ansible.builtin.pause:
        seconds: 3

    - name: Read the pushes of the multiplexed connection
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false

    - name: Assert one connection made one push
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pushes.stdout_lines | length == 1
        fail_msg: "{{ ssh_login_notify_pushes.stdout_lines }}"

    # --- le doute sonne : autre méthode, rien de lisible, empreinte illisible,
    # clé connue avec un second facteur. Le hook appelé comme par pam_exec, sshd
    # ne laissant pas fabriquer ces sessions ici ---

    - name: Read the known public key
      ansible.builtin.command: cat /home/sylvain/.ssh/molecule-known.pub
      register: ssh_login_notify_test_known_pub
      changed_when: false

    - name: Reset the push and ntfy logs before the doubtful sessions
      ansible.builtin.import_tasks: tasks/reset_logs.yml

    - name: Call the hook with doubtful authentication info
      become: true
      ansible.builtin.command: /usr/local/sbin/ssh-login-notify
      environment:
        PAM_TYPE: open_session
        PAM_USER: sylvain
        PAM_RHOST: "{{ item.rhost }}"
        SSH_AUTH_INFO_0: "{{ item.info }}"
      changed_when: false
      loop:
        - {rhost: 192.0.2.1, info: "password\n"}
        - {rhost: 192.0.2.2, info: ""}
        - {rhost: 192.0.2.3, info: "publickey ssh-ed25519 pas-une-cle\n"}
        - {rhost: 192.0.2.4, info: "publickey {{ ssh_login_notify_test_known_pub.stdout }}\nkeyboard-interactive\n"}
      loop_control:
        label: "{{ item.rhost }}"

    - name: Wait for the four pushes
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false
      until: ssh_login_notify_pushes.stdout_lines | length >= 4
      retries: 15
      delay: 1

    - name: Read the ntfy log after the doubtful sessions
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_ntfy_log }}
      register: ssh_login_notify_ntfy
      changed_when: false

    - name: Assert every doubtful session pushed and left no trace
      vars:
        pushes: "{{ ssh_login_notify_pushes.stdout }}"
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pushes.stdout_lines | length == 4
          - >-
            pushes is search('192\\.0\\.2\\.1, sans clé publique \\(méthode : password\\)')
          - >-
            pushes is search('192\\.0\\.2\\.2, sans clé publique \\(méthode : inconnue\\)')
          - pushes is search('192\\.0\\.2\\.3, clé inconnue \\(ssh-ed25519 \\?\\)')
          - pushes is search('192\\.0\\.2\\.4, clé ')
          - ssh_login_notify_ntfy.stdout | length == 0
        fail_msg: "{{ ssh_login_notify_pushes.stdout_lines }} / {{ ssh_login_notify_ntfy.stdout_lines }}"

    # --- la liste de newt-lxc, vide, déployée par le rôle : la clé connue ailleurs
    # redevient inconnue ---

    - name: Run the empty list case
      become: true
      block:
        - name: Keep the hook configuration
          ansible.builtin.command: cp -p /etc/ssh-login-notify.conf /etc/ssh-login-notify.conf.orig
          changed_when: true

        - name: Deploy the role with the known list of newt-lxc
          ansible.builtin.include_role:
            name: ssh_login_notify
            apply:
              become: true
          vars:
            ssh_login_notify_push_url: http://127.0.0.1:18080/api/push/molecule-ssh-login
            ssh_login_notify_ntfy_url: http://127.0.0.1:18082
            ssh_login_notify_known_fingerprints: >-
              {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../host_vars/newt-lxc/variables.yaml')
                  | from_yaml).ssh_login_notify_known_fingerprints }}

        - name: Read the hook configuration of the empty list
          ansible.builtin.command: grep -c "^KNOWN_FINGERPRINTS=''$" /etc/ssh-login-notify.conf
          changed_when: false

        - name: Reset the push and ntfy logs before the empty list case
          ansible.builtin.import_tasks: tasks/reset_logs.yml

        - name: Log in with the known key and an empty list
          become: false
          ansible.builtin.command: >-
            {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-known sylvain@127.0.0.1 true
          changed_when: false

        - name: Wait for the push of the empty list case
          ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
          register: ssh_login_notify_pushes
          changed_when: false
          until: ssh_login_notify_pushes.stdout_lines | length >= 1
          retries: 15
          delay: 1

        - name: Read the ntfy log after the empty list case
          ansible.builtin.command: cat {{ ssh_login_notify_test_ntfy_log }}
          register: ssh_login_notify_ntfy
          changed_when: false

        - name: Assert an empty list pushes and leaves no trace
          ansible.builtin.assert:
            that:
              - ssh_login_notify_pushes.stdout is search('clé molecule-known')
              - ssh_login_notify_ntfy.stdout | length == 0
            fail_msg: "{{ ssh_login_notify_pushes.stdout_lines }} / {{ ssh_login_notify_ntfy.stdout_lines }}"

      always:
        - name: Restore the hook configuration
          ansible.builtin.command: mv /etc/ssh-login-notify.conf.orig /etc/ssh-login-notify.conf
          args:
            removes: /etc/ssh-login-notify.conf.orig

    # --- ntfy en panne ou sans jeton : le login passe en moins de 5 s, l'échec au
    # journal, et toujours pas de push pour une clé connue ---

    - name: Reset the push and ntfy logs before the ntfy failures
      ansible.builtin.import_tasks: tasks/reset_logs.yml

    - name: Run the ntfy failure cases
      become: true
      block:
        - name: Keep the hook configuration
          ansible.builtin.command: cp -p /etc/ssh-login-notify.conf /etc/ssh-login-notify.conf.orig
          changed_when: true

        - name: Log in with each ntfy failure
          ansible.builtin.include_tasks: tasks/ntfy_failure.yml
          loop:
            - {name: refuses, url: "http://127.0.0.1:18082", topic: refused}
            - {name: closed port, url: "http://127.0.0.1:9", topic: scripts}
            - {name: never answers, url: "http://127.0.0.1:18081", topic: scripts}
            # Le dernier : l'assertion finale relit son journal.
            - {name: no token, url: "http://127.0.0.1:18082", topic: scripts, token: ""}
          loop_control:
            loop_var: ntfy_failure
            label: "{{ ntfy_failure.name }}"

      always:
        - name: Restore the hook configuration
          ansible.builtin.command: mv /etc/ssh-login-notify.conf.orig /etc/ssh-login-notify.conf
          args:
            removes: /etc/ssh-login-notify.conf.orig

    - name: Read the pushes after the ntfy failures
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes
      changed_when: false

    - name: Read the ntfy log after the ntfy failures
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_ntfy_log }}
      register: ssh_login_notify_ntfy
      changed_when: false

    # Une seule requête reçue, celle du topic refusé : sans jeton, pas de curl.
    - name: Assert a known key does not fall back to a push, and sends nothing without a token
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pushes.stdout | length == 0
          - ssh_login_notify_ntfy.stdout_lines | length == 1
          - ssh_login_notify_journal_after.stdout is search('échec de la trace ntfy, pas de jeton')
        fail_msg: "{{ ssh_login_notify_pushes.stdout_lines }} / {{ ssh_login_notify_ntfy.stdout_lines }}"

    # --- anti-lockout : rien côté notification ne bloque ni ne retarde ---

    - name: Run the anti-lockout cases
      become: true
      block:
        # Clé sans commentaire dans authorized_keys : le hook cherche aussi
        # dans authorized_keys2, ici un tube nommé que personne n'écrit. Lu
        # pendant que pam_exec attend, il bloquerait le login indéfiniment.
        - name: Strip the comment of the notifying key
          ansible.builtin.replace:
            path: /home/sylvain/.ssh/authorized_keys
            regexp: " molecule-login$"
            replace: ""

        - name: Put a named pipe at authorized_keys2
          ansible.builtin.command: mkfifo -m 0600 /home/sylvain/.ssh/authorized_keys2
          args:
            creates: /home/sylvain/.ssh/authorized_keys2

        - name: Log in with a commentless key and a named pipe at authorized_keys2
          become: false
          ansible.builtin.shell: |
            set -e
            start=$(date +%s%N)
            timeout 20 {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-login sylvain@127.0.0.1 true
            echo $(( ($(date +%s%N) - start) / 1000000 ))
          register: ssh_login_notify_fifo_ms
          changed_when: false

        # Uptime Kuma qui accepte la connexion et ne répond jamais : curl
        # attend 21 s au pire (uptime-push), le login non.
        - name: Point the hook at a server that never answers
          ansible.builtin.replace:
            path: /etc/ssh-login-notify.conf
            regexp: "127\\.0\\.0\\.1:18080"
            replace: "127.0.0.1:18081"

        - name: Log in while Uptime Kuma hangs
          become: false
          ansible.builtin.shell: |
            set -e
            start=$(date +%s%N)
            {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-login sylvain@127.0.0.1 true
            echo $(( ($(date +%s%N) - start) / 1000000 ))
          register: ssh_login_notify_hang_ms
          changed_when: false

        # Uptime Kuma injoignable (connexion refusée).
        - name: Point the hook at a closed port
          ansible.builtin.replace:
            path: /etc/ssh-login-notify.conf
            regexp: "127\\.0\\.0\\.1:18081"
            replace: "127.0.0.1:9"

        - name: Log in while Uptime Kuma is down
          become: false
          ansible.builtin.command: >-
            {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-login sylvain@127.0.0.1 true
          changed_when: false

        # Script disparu : pam_exec échoue, `optional` laisse passer.
        - name: Remove the hook script
          ansible.builtin.command: mv /usr/local/sbin/ssh-login-notify /usr/local/sbin/ssh-login-notify.away
          changed_when: true

        - name: Log in while the hook script is missing
          become: false
          ansible.builtin.command: >-
            {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-login sylvain@127.0.0.1 true
          changed_when: false

      always:
        - name: Remove the named pipe
          ansible.builtin.file:
            path: /home/sylvain/.ssh/authorized_keys2
            state: absent

        - name: Restore the comment of the notifying key
          ansible.builtin.replace:
            path: /home/sylvain/.ssh/authorized_keys
            regexp: "^(ssh-ed25519 \\S+)$"
            replace: "\\1 molecule-login"

        - name: Restore the hook script
          ansible.builtin.command: mv /usr/local/sbin/ssh-login-notify.away /usr/local/sbin/ssh-login-notify
          args:
            removes: /usr/local/sbin/ssh-login-notify.away

        - name: Restore the push URL
          ansible.builtin.replace:
            path: /etc/ssh-login-notify.conf
            regexp: "127\\.0\\.0\\.1:(18081|9)/"
            replace: "127.0.0.1:18080/"

    - name: Assert an unreadable authorized_keys2 does not delay the login
      ansible.builtin.assert:
        that:
          - ssh_login_notify_fifo_ms.stdout | int < 5000
        fail_msg: "Login en {{ ssh_login_notify_fifo_ms.stdout }} ms avec un tube nommé en authorized_keys2."

    - name: Assert a hanging Uptime Kuma does not delay the login
      ansible.builtin.assert:
        that:
          - ssh_login_notify_hang_ms.stdout | int < 5000
        fail_msg: "Login en {{ ssh_login_notify_hang_ms.stdout }} ms avec un Uptime Kuma muet."

    # --- ssh_login_notify_enabled: false retire tout, idempotent ---

    - name: Disable the hook
      ansible.builtin.include_role:
        name: ssh_login_notify
        apply:
          become: true
      vars:
        ssh_login_notify_enabled: false

    - name: Read the sshd PAM stack after the uninstall
      become: true
      ansible.builtin.stat:
        path: /etc/pam.d/sshd
        get_checksum: true
      register: ssh_login_notify_pam_after

    - name: Read the hook files after the uninstall
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ssh_login_notify_files_after
      loop:
        - /etc/ssh-login-notify.conf
        - /usr/local/sbin/ssh-login-notify

    - name: Read the sshd PAM stack content after the uninstall
      become: true
      ansible.builtin.slurp:
        src: /etc/pam.d/sshd
      register: ssh_login_notify_pam_content

    - name: Assert the hook is gone
      ansible.builtin.assert:
        that:
          - (ssh_login_notify_pam_content.content | b64decode) is not search('ssh-login-notify')
          - ssh_login_notify_files_after.results | selectattr('stat.exists') | list | length == 0
        fail_msg: "{{ ssh_login_notify_pam_content.content | b64decode }}"

    # Seconde désinstallation : rien à retirer, /etc/pam.d/sshd intouché.
    - name: Disable the hook again
      ansible.builtin.include_role:
        name: ssh_login_notify
        apply:
          become: true
      vars:
        ssh_login_notify_enabled: false

    - name: Read the sshd PAM stack after the second uninstall
      become: true
      ansible.builtin.stat:
        path: /etc/pam.d/sshd
        get_checksum: true
      register: ssh_login_notify_pam_again

    - name: Assert the second uninstall changed nothing
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pam_again.stat.checksum == ssh_login_notify_pam_after.stat.checksum
          - ssh_login_notify_pam_again.stat.mtime == ssh_login_notify_pam_after.stat.mtime

    # Après la désinstallation, sshd accepte toujours la connexion (pile PAM
    # intacte) et plus rien ne notifie.
    - name: Count the pushes before a login without the hook
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes_before
      changed_when: false

    - name: Log in over SSH without the hook
      ansible.builtin.command: >-
        {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-login sylvain@127.0.0.1 true
      changed_when: false

    - name: Leave time for a push that must not come
      ansible.builtin.pause:
        seconds: 3

    - name: Count the pushes after a login without the hook
      become: true
      ansible.builtin.command: cat {{ ssh_login_notify_test_log }}
      register: ssh_login_notify_pushes_after
      changed_when: false

    - name: Assert a login without the hook does not notify
      ansible.builtin.assert:
        that:
          - ssh_login_notify_pushes_after.stdout_lines | length == ssh_login_notify_pushes_before.stdout_lines | length

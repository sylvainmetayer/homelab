---
# Un cas de panne de ntfy (ntfy_failure : name, url, topic), sous le become du
# block appelant. Une ligne d'échec de plus au journal, et un login rapide.
- name: "Point the trace at the failing ntfy, {{ ntfy_failure.name }}"
  ansible.builtin.replace:
    path: /etc/ssh-login-notify.conf
    regexp: "^{{ item.key }}=.*$"
    replace: "{{ item.key }}={{ item.value }}"
  loop:
    - {key: NTFY_URL, value: "{{ ntfy_failure.url }}"}
    - {key: NTFY_TOPIC, value: "{{ ntfy_failure.topic }}"}
  loop_control:
    label: "{{ item.key }}"

- name: Read the journal before the login
  ansible.builtin.command: journalctl -t ssh-login-notify -o cat --no-pager
  register: ssh_login_notify_journal_before
  changed_when: false

- name: "Log in while ntfy fails, {{ ntfy_failure.name }}"
  become: false
  ansible.builtin.shell: |
    set -e
    start=$(date +%s%N)
    {{ ssh_login_notify_test_ssh }} -i /home/sylvain/.ssh/molecule-known sylvain@127.0.0.1 true
    echo $(( ($(date +%s%N) - start) / 1000000 ))
  register: ssh_login_notify_failure_ms
  changed_when: false

- name: "Assert the failing ntfy does not delay the login, {{ ntfy_failure.name }}"
  ansible.builtin.assert:
    that:
      - ssh_login_notify_failure_ms.stdout | int < 5000
    fail_msg: "Login en {{ ssh_login_notify_failure_ms.stdout }} ms, ntfy {{ ntfy_failure.name }}."

# Le ntfy muet garde curl en vie : le jeton ne se lit pas dans ps.
- name: Read the curl command lines while ntfy never answers
  when: ntfy_failure.url is search(':18081')
  ansible.builtin.command: ps -eo comm=,args=
  register: ssh_login_notify_ps
  changed_when: false
  until: ssh_login_notify_ps.stdout_lines | select('match', 'curl ') | list | length > 0
  retries: 5
  delay: 1

- name: Assert the token is not on the curl command line
  when: ntfy_failure.url is search(':18081')
  ansible.builtin.assert:
    that:
      - ntfy_scripts_token not in ssh_login_notify_ps.stdout
      - "'Bearer' not in ssh_login_notify_ps.stdout"
    fail_msg: curl montre son jeton dans ps.

# 22 s au pire : deux essais de 10 s, le ntfy muet.
- name: "Wait for the failure in the journal, {{ ntfy_failure.name }}"
  ansible.builtin.command: journalctl -t ssh-login-notify -o cat --no-pager
  register: ssh_login_notify_journal_after
  changed_when: false
  until: >-
    (ssh_login_notify_journal_after.stdout_lines | select('search', 'échec de la trace ntfy') | list | length)
    == (ssh_login_notify_journal_before.stdout_lines | select('search', 'échec de la trace ntfy') | list | length) + 1
  retries: 30
  delay: 1

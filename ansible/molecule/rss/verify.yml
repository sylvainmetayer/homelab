---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    - name: Verify the rss deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: rss
        verify_app_borgmatic_config: /etc/borgmatic.d/rss.yaml
        verify_app_borgmatic_push_url: https://uptime.example.invalid/api/push/tofu-rss-backup

    - name: Verify the rss healthcheck
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: rss
        verify_compose_healthchecks:
          - freshrss

    - name: Read the rss compose file
      ansible.builtin.slurp:
        src: /opt/apps/rss/compose.yaml
      register: rss_compose_raw

    # Molecule ne démarre pas les images : seul le compose peut être vérifié.
    - name: Assert the rss container stays hardened
      vars:
        rss_service: "{{ (rss_compose_raw.content | b64decode | from_yaml).services.freshrss }}"
      ansible.builtin.assert:
        that:
          - "'no-new-privileges:true' in rss_service.security_opt"
          - rss_service.cap_drop == ['ALL']
          - rss_service.cap_add | sort == ['CHOWN', 'DAC_READ_SEARCH', 'FOWNER', 'KILL', 'SETGID', 'SETUID']
        fail_msg: rss n'est plus durci (no-new-privileges, cap_drop, cap_add d'Apache et de l'entrypoint).

    - name: Stat the rss borgmatic configuration
      become: true
      ansible.builtin.stat:
        path: /etc/borgmatic.d/rss.yaml
      register: rss_borgmatic_stat

    # Elle contient la passphrase du dépôt borg.
    - name: Assert the rss borgmatic configuration is private
      ansible.builtin.assert:
        that:
          - rss_borgmatic_stat.stat.mode == '0600'
          - rss_borgmatic_stat.stat.pw_name == 'root'
        fail_msg: "/etc/borgmatic.d/rss.yaml doit être 0600 root (passphrase borg)"

    - name: Read the rss borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/borgmatic.d/rss.yaml
      register: rss_borgmatic_raw

    - name: Assert the rss backup covers its data and pushes to Uptime Kuma
      vars:
        rss_borgmatic: "{{ rss_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - "'/opt/apps/rss/freshrss_data' in rss_borgmatic.source_directories"
          # Exclusion absolue : un motif relatif ('cache/*') ne correspond à rien.
          - "'/opt/apps/rss/freshrss_data/cache' in rss_borgmatic.exclude_patterns"
        fail_msg: "Configuration borgmatic de rss inattendue : {{ rss_borgmatic }}"

    - name: Stat the repo-create marker of the borgmatic stub for rss
      become: true
      ansible.builtin.stat:
        path: "{{ molecule_borgmatic_state_dir }}/_etc_borgmatic.d_rss.yaml"
      register: rss_repo_marker

    - name: Assert the rss borg repository was initialised
      ansible.builtin.assert:
        that:
          - rss_repo_marker.stat.exists
        fail_msg: "Le rôle n'a pas lancé borgmatic repo-create pour rss"

    - name: Read the rss compose file
      ansible.builtin.slurp:
        src: /opt/apps/rss/compose.yaml
      register: rss_compose_raw

    - name: Assert the rss container is on newt under its Pangolin target name and stays hardened
      vars:
        rss_compose: "{{ rss_compose_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - rss_compose.services.freshrss.container_name == 'rss'
          - "'no-new-privileges:true' in rss_compose.services.freshrss.security_opt"
          - "'newt' in rss_compose.services.freshrss.networks"
        fail_msg: "Compose de rss inattendu : {{ rss_compose.services.freshrss }}"

    - name: Read the FreshRSS system configuration
      become: true
      ansible.builtin.slurp:
        src: /opt/apps/rss/freshrss_data/config.php
      register: rss_system_config_raw

    # Lu dans le navigateur seulement : l'API Google Reader / Fever est coupée.
    - name: Assert the FreshRSS API is disabled
      vars:
        rss_system_config: "{{ rss_system_config_raw.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "\"'api_enabled' => false,\" in rss_system_config"
          - "\"'api_enabled' => true\" not in rss_system_config"
        fail_msg: "api_enabled n'est pas à false dans data/config.php"

    - name: Read the Karakeep Button metadata
      become: true
      ansible.builtin.slurp:
        src: /opt/apps/rss/freshrss_extensions/xExtension-KarakeepButton/metadata.json
      register: rss_karakeep_button_metadata_raw

    - name: Stat the Karakeep Button entry point
      become: true
      ansible.builtin.stat:
        path: /opt/apps/rss/freshrss_extensions/xExtension-KarakeepButton/extension.php
      register: rss_karakeep_button_entry

    # FreshRSS (www-data) lit le code de l'extension sans pouvoir le modifier.
    - name: Assert the Karakeep Button extension is installed, owned by root
      vars:
        rss_karakeep_button_metadata: "{{ rss_karakeep_button_metadata_raw.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - rss_karakeep_button_metadata.name == 'Karakeep Button'
          - rss_karakeep_button_metadata.entrypoint == 'KarakeepButton'
          - rss_karakeep_button_entry.stat.exists
          - rss_karakeep_button_entry.stat.pw_name == 'root'
          - rss_karakeep_button_entry.stat.roth
          - not rss_karakeep_button_entry.stat.woth
        fail_msg: "Extension Karakeep Button absente ou mal installée : {{ rss_karakeep_button_metadata }}"

    - name: Read the FreshRSS user configurations
      become: true
      loop: [sylvain, invite]
      ansible.builtin.slurp:
        src: "/opt/apps/rss/freshrss_data/users/{{ item }}/config.php"
      register: rss_user_config_raw

    # rss_ttl_default : 3 h, remplacé (sylvain) ou inséré (invite). Le TTL des
    # listes OPML dynamiques reste le sien.
    - name: Assert the default refresh delay is three hours
      loop: "{{ rss_user_config_raw.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        rss_user_config: "{{ item.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "\"'ttl_default' => 10800,\" in rss_user_config"
          - "\"'dynamic_opml_ttl_default' => 43200,\" in rss_user_config"
        fail_msg: "ttl_default n'est pas à 10800 dans users/{{ item.item }}/config.php : {{ rss_user_config }}"

    - name: Read the journal mode of the FreshRSS database
      become: true
      ansible.builtin.command:
        argv: [sqlite3, -noheader, -list, /opt/apps/rss/freshrss_data/users/sylvain/db.sqlite, pragma journal_mode]
      register: rss_db_journal_mode
      changed_when: false

    - name: Stat the FreshRSS database
      become: true
      ansible.builtin.stat:
        path: /opt/apps/rss/freshrss_data/users/sylvain/db.sqlite
      register: rss_db_stat

    # Le passage en WAL ne change pas le propriétaire : FreshRSS (www-data)
    # écrit toujours sa base.
    - name: Assert the FreshRSS database runs in WAL, still owned by www-data
      ansible.builtin.assert:
        that:
          - rss_db_journal_mode.stdout == 'wal'
          - rss_db_stat.stat.pw_name == 'www-data'
        fail_msg: "Base FreshRSS : journal {{ rss_db_journal_mode.stdout }}, propriétaire {{ rss_db_stat.stat.pw_name }}"

    # Un flux en erreur est retenté à chaque passage du cron, TTL ou pas.
    - name: Assert the FreshRSS cron runs hourly
      vars:
        rss_compose: "{{ rss_compose_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - "'CRON_MIN=17' in rss_compose.services.freshrss.environment"
        fail_msg: "CRON_MIN inattendu : {{ rss_compose.services.freshrss.environment }}"

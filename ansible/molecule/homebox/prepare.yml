---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# La base SQLite déjà là, comme sur l'hôte après le premier démarrage de
# Homebox (migrations goose) : le rôle borgmatic (tasks/app.yml) doit la
# trouver, la copier par « .backup » et exclure sa copie vivante.
- name: Prepare homebox
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Ensure the homebox data folder exists
      loop:
        - { path: /opt/apps, owner: sylvain }
        - { path: /opt/apps/homebox, owner: sylvain }
        # L'utilisateur de l'image -rootless, sans compte dans le conteneur.
        - { path: /opt/apps/homebox/data, owner: "65532" }
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        # Le rôle (et docker_service pour /opt/apps) remet son propre mode
        # au premier converge ; l'idempotence porte sur le second.
        mode: "0700"

    - name: Create a homebox SQLite database
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          sqlite3.connect('/opt/apps/homebox/data/homebox.db').execute('CREATE TABLE users (id TEXT PRIMARY KEY)')"
        creates: /opt/apps/homebox/data/homebox.db

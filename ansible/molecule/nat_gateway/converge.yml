---
# Comme pangolin.yaml : security (become) puis nat_gateway. Les rôles
# geerlingguy.docker (Docker est dans l'image), borgmatic et pangolin ont leurs
# propres scénarios.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pangolin/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: security
      become: true
    - role: nat_gateway

---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# La base SQLite que l'entrypoint de l'image crée au premier démarrage
# (data/prod.db) : le rôle borgmatic (tasks/app.yml) doit la trouver, la
# copier par « .backup » et exclure sa copie vivante.
- name: Prepare wishlist
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure the wishlist data folder exists
      become: true
      loop:
        - /opt/apps
        - /opt/apps/wishlist
        - /opt/apps/wishlist/data
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: sylvain
        group: sylvain
        # Le rôle (et docker_service pour /opt/apps) remet son propre mode
        # au premier converge ; l'idempotence porte sur le second.
        mode: "0700"

    - name: Create a wishlist SQLite database
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          sqlite3.connect('/opt/apps/wishlist/data/prod.db').execute('CREATE TABLE list (id TEXT PRIMARY KEY)')"
        creates: /opt/apps/wishlist/data/prod.db

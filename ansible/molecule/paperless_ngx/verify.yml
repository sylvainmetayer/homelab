---
# Après side_effect.yml, qui a repris paperless (paperless_enabled: true) :
# l'état d'une app en marche. La pause est vérifiée dans side_effect.yml.
- name: Verify
  hosts: all
  vars_files:
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
  vars:
    paperless_path: "{{ docker_base_path }}/paperless"
  tasks:
    - name: Verify the paperless deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: paperless
        verify_app_borgmatic_config: "{{ borgmatic_config_dir }}/paperless.yaml"
        verify_app_borgmatic_push_url: https://uptime.example.invalid/api/push/tofu-paperless-backup

    - name: Verify the supporting services of paperless
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: paperless
        verify_compose_databases:
          - db
        verify_compose_healthchecks:
          - broker
        verify_compose_healthy_dependencies:
          - { service: webserver, dependency: db }
          - { service: webserver, dependency: broker }
        verify_compose_internal_networks:
          - paperless

    - name: Read the paperless compose file
      ansible.builtin.slurp:
        src: "{{ paperless_path }}/compose.yaml"
      register: paperless_compose_raw

    - name: Read the paperless borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: "{{ borgmatic_config_dir }}/paperless.yaml"
      register: paperless_borgmatic_raw

    - name: Stat the paperless borgmatic configuration
      become: true
      ansible.builtin.stat:
        path: "{{ borgmatic_config_dir }}/paperless.yaml"
      register: paperless_borgmatic_stat

    - name: Parse the paperless configurations
      ansible.builtin.set_fact:
        paperless_compose: "{{ paperless_compose_raw.content | b64decode | from_yaml }}"
        paperless_borgmatic: "{{ paperless_borgmatic_raw.content | b64decode | from_yaml }}"

    # Seul le serveur web est joignable par Pangolin ; la base, redis, tika et
    # gotenberg restent sur le réseau interne (cf. AGENTS.md).
    - name: Assert only the webserver joins the newt network
      ansible.builtin.assert:
        that:
          - paperless_compose.networks.newt.external
          - paperless_newt_services == ['webserver']
        fail_msg: "Services sur newt : {{ paperless_newt_services }}"
      vars:
        paperless_newt_services: >-
          {{ paperless_compose.services | dict2items
             | selectattr('value.networks', 'defined')
             | selectattr('value.networks', 'contains', 'newt')
             | map(attribute='key') | list }}

    - name: Assert the webserver gets its identity from the host
      ansible.builtin.assert:
        that:
          - paperless_compose.services.webserver.environment.PUID | string == ansible_facts['user_uid'] | string

    - name: Assert the paperless borgmatic configuration is private
      ansible.builtin.assert:
        that:
          - paperless_borgmatic_stat.stat.pw_name == 'root'
          - paperless_borgmatic_stat.stat.mode == '0600'

    # Le dump doit viser le conteneur de la base du compose, avec ses identifiants.
    - name: Assert borgmatic dumps the paperless database container
      ansible.builtin.assert:
        that:
          - paperless_borgmatic.postgresql_databases[0].container == paperless_compose.services.db.container_name
          - paperless_borgmatic.postgresql_databases[0].password == paperless_db_password
        fail_msg: "Configuration borgmatic de paperless incohérente : {{ paperless_borgmatic.postgresql_databases | map(attribute='container') | list }}"

    - name: Stat the paperless backup sources
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ paperless_borgmatic.source_directories }}"
      register: paperless_sources

    - name: Assert every paperless backup source exists
      ansible.builtin.assert:
        that:
          - paperless_sources.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: "Sources absentes : {{ paperless_sources.results | rejectattr('stat.exists') | map(attribute='item') | list }}"

---
# Configuration commune : .config/molecule/config.yml (racine du dépôt).
# La copie jetable de la VM docker : le rôle refuse de tourner hors du groupe
# `drill` avec drill_mode (cf. converge.yml). Prepare propre : /root/.ssh, que
# le rôle borgmatic crée sur un vrai hôte.
scenario:
  name: docker_drill
ansible:
  playbooks:
    prepare: prepare.yml

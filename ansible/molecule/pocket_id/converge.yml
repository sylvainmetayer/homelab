---
# Le rôle pocket_id de pangolin.yaml, avec les variables de l'hôte pangolin.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pangolin/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # pangolin.yaml le lit dans le state de tofu/pangolin_config (set_fact).
    - name: Load a fake healthcheck URL in place of the Terraform state output
      ansible.builtin.set_fact:
        pocket_id_backup_healthcheck_url: "https://uptime.example.invalid/api/push/pocket_id_backup"
        # Sortie fictive du state : les groupes par défaut des nouveaux comptes.
        terraform_outputs:
          pocket_id_default_group_ids:
            value: [molecule-group-bentopdf, molecule-group-enclosed, molecule-group-pairdrop]

  roles:
    # Pas de `docker compose up` : ni image tirée, ni réseau « pangolin ».
    - role: pocket_id
      vars:
        pocket_id_compose_up: false

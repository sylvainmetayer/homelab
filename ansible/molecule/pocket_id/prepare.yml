---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# La base SQLite que Pocket ID crée au premier démarrage (data/pocket-id.db) :
# le rôle borgmatic (tasks/app.yml) doit la trouver, la copier par « .backup »
# ou « VACUUM INTO » et exclure sa copie vivante.
- name: Prepare pocket_id
  hosts: all
  gather_facts: false
  tasks:
    - name: Ensure the Pocket ID data folder exists
      become: true
      loop:
        - /opt/pocket-id
        - /opt/pocket-id/data
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        # Le rôle remet son propre propriétaire au premier converge ;
        # l'idempotence porte sur le second.
        mode: "0700"

    - name: Create a Pocket ID SQLite database
      become: true
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          sqlite3.connect('/opt/pocket-id/data/pocket-id.db').execute(
          'CREATE TABLE users (id TEXT PRIMARY KEY, username TEXT)')"
        creates: /opt/pocket-id/data/pocket-id.db

# Formats exigés par ntfy (jeton tk_ + 29 caractères, hash bcrypt de coût 10) :
# le rôle les vérifie, et le verify du scénario ntfy démarre le vrai binaire
# dessus. ntfy_sylvain_password, lu par personne (c'est celui de l'appli),
# n'y est pas. Les hashes sont dérivés, pas écrits en dur : un littéral au
# format bcrypt fait échouer SonarCloud (secrets:S8215).
ntfy_publisher_password_hash: "{{ '$2y$10$' ~ ('molecule-ntfy-publisher' | hash('sha512'))[:53] }}"
ntfy_canary_token: "tk_moleculentfycanarytoken000000"
ntfy_scripts_token: "tk_moleculentfyscriptstoken00000"
ntfy_github_token: "tk_moleculentfygithubtoken000000"
ntfy_sylvain_password_hash: "{{ '$2y$10$' ~ ('molecule-ntfy-sylvain' | hash('sha512'))[:53] }}"

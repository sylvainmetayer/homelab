# Fausses valeurs pour chaque clé de secrets/ansible.sops.yaml, chargées par les
# converge.yml à la place du fichier chiffré (pas de clé Age en CI de test).
# Elles ne protègent rien : seules leur présence et leur forme comptent.
# Une clé ajoutée à secrets/ansible.sops.yaml et lue par un rôle doit l'être ici aussi
# (`host_user_password_hash`, le hash du mot de passe du compte lu par 00-setup.yaml seulement, n'y est pas).


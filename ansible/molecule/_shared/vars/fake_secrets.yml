backup_storage_box_subaccounts:
  docker: { username: "u000000-sub1", server: "u000000-sub1.your-storagebox.example.invalid" }
  pi: { username: "u000000-sub2", server: "u000000-sub2.your-storagebox.example.invalid" }
  pangolin: { username: "u000000-sub3", server: "u000000-sub3.your-storagebox.example.invalid" }
  flip: { username: "u000000-sub4", server: "u000000-sub4.your-storagebox.example.invalid" }

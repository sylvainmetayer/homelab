---
# Fausses valeurs de secrets.sops.yaml, chargées comme les playbooks chargent
# le vrai fichier : community.sops.load_vars (return_method: vars-only,
# ansible-core 2.21+) les enregistre dans la couche include_vars, au-dessus des
# vars: du play et des `vars:` des entrées roles:, sous les set_fact. Un
# vars_files les mettrait sous ces vars: et masquerait une clé de
# secrets.sops.yaml qui porterait le nom d'une variable surchargée par une
# instance (la prod prenait alors le pas sur la démo de Flip Planning).
- name: Load the fake secrets in the include_vars layer
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../_shared/vars/fake_secrets.yml"

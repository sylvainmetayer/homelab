---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    # Site statique : aucune configuration borgmatic, exprès.
    - name: Verify the neonova deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: neonova
        verify_app_borgmatic_config: ""

    - name: Verify the neonova healthcheck
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: neonova
        verify_compose_healthchecks:
          - app
          - aide

    # Paquet GHCR privé : l'identifiant ne sert qu'à dc@neonova.
    - name: Stat the registry config of neonova
      ansible.builtin.stat:
        path: "{{ docker_base_path }}/neonova/.docker/config.json"
      register: neonova_verify_registry

    - name: Read the environment of dc@neonova
      ansible.builtin.systemd:
        name: dc@neonova
        scope: user
      register: neonova_verify_unit

    - name: Assert dc@neonova reads its own GHCR credentials
      ansible.builtin.assert:
        that:
          - neonova_verify_registry.stat.mode == '0600'
          - neonova_verify_unit.status.Environment == 'DOCKER_CONFIG=' ~ docker_base_path ~ '/neonova/.docker'

---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    # Site statique : aucune configuration borgmatic, exprès.
    - name: Verify the neonova deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: neonova
        verify_app_borgmatic_config: ""

    - name: Verify the neonova healthcheck
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: neonova
        verify_compose_healthchecks:
          - app

---
# Comme dans flip.yml : rôle appliqué avec become au niveau du playbook.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/flip/variables.yaml
    # En dernier : le relais msmtp vise le récepteur du prepare.
    - ../security/vars/smtp_sink.yml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # Ce qui distingue flip de Pangolin (scénario security) : pas de bastion,
    # et le bastion lui-même jamais banni par fail2ban.
    - name: Assert flip differs from the bastion
      ansible.builtin.assert:
        that:
          - security_ssh_allow_tcp_forwarding == 'no'
          - "'10.0.0.0/16' in security_fail2ban_ignoreip"
        fail_msg: >-
          host_vars/flip ne diffère plus de Pangolin sur ces points : ce
          scénario ne teste plus rien de plus que security.
  roles:
    - role: security
      become: true

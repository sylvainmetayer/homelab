---
# Reproduit l'entrée openpost de flip.yml (aucun paramètre de rôle).
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/flip/variables.yaml
  vars:
    # Sorties de tofu/pangolin_config (pocket_id.tf) : le client OIDC d'OpenPost.
    terraform_outputs:
      pocket_id_issuer:
        value: https://idp.example.invalid
      pocket_id_openpost_client_id:
        value: molecule-pocket-id-openpost-client-id
      pocket_id_openpost_client_secret:
        value: molecule-pocket-id-openpost-client-secret
    # Clés SOPS facultatives des banques d'images : une seule posée, l'autre
    # reste vide dans le .env.
    openpost_unsplash_access_key: molecule-unsplash
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # flip.yml lit cette URL dans les outputs du state pangolin_config.
    - name: Load healthcheck URLs as flip.yml does from the Terraform state
      ansible.builtin.set_fact:
        openpost_backup_healthcheck_url: https://uptime.example.invalid/api/push/tofu-openpost-backup
  roles:
    - role: docker_service
    - role: openpost

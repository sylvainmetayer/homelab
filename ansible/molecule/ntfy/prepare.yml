---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# user.db déjà là, comme sur l'hôte après le premier démarrage de ntfy (le
# scénario ne démarre aucun conteneur, ntfy_compose_up: false) : le rôle l'attend avant
# borgmatic, qui doit la trouver et la copier par « .backup ».
- name: Prepare ntfy
  hosts: all
  gather_facts: false
  tasks:
    # /opt/ntfy n'existe pas encore : root le crée, au nom de sylvain, comme
    # le rôle au converge.
    - name: Ensure the ntfy data folder exists
      become: true
      loop:
        - /opt/ntfy
        - /opt/ntfy/data
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: sylvain
        group: sylvain
        # Le rôle remet son propre mode au premier converge ; l'idempotence
        # porte sur le second.
        mode: "0700"

    # Sous sylvain, l'utilisateur du conteneur sur l'hôte.
    - name: Create the ntfy SQLite databases
      loop:
        - user.db
        - cache.db
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          sqlite3.connect('/opt/ntfy/data/{{ item }}').execute('CREATE TABLE schemaVersion (id INT PRIMARY KEY)')"
        creates: "/opt/ntfy/data/{{ item }}"

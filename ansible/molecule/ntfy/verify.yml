---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  vars:
    # Sous le home, pas /tmp : le binaire doit pouvoir s'y exécuter.
    ntfy_verify_dir: "{{ ansible_facts['user_dir'] }}/ntfy-molecule"
    ntfy_verify_url: http://127.0.0.1:18080
    # Le même que converge.yml.
    ntfy_verify_uptime_kuma_token: "tk_{{ ('molecule-ntfy-uptime-kuma' | hash('sha1'))[:29] }}"
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  tasks:
    - name: Verify the ntfy deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: ntfy
        verify_app_borgmatic_config: /etc/borgmatic.d/ntfy.yaml

    - name: Verify the ntfy healthcheck
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: ntfy
        verify_compose_healthchecks:
          - app

    - name: Render the ntfy compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/ntfy
      register: ntfy_compose_raw
      changed_when: false

    # Un seul conteneur, sous l'utilisateur de déploiement et sans capacité,
    # sur newt seulement. Son nom est la cible de Pangolin (website_ntfy.tf).
    - name: Assert ntfy only joins newt and runs unprivileged
      vars:
        ntfy_compose: "{{ ntfy_compose_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - ntfy_compose.services.app.container_name == 'ntfy'
          - ntfy_compose.services.app.user == ansible_facts['user_uid'] ~ ':' ~ ansible_facts['user_gid']
          - ntfy_compose.services.app.networks.keys() | list == ['newt']
          - ntfy_compose.networks.keys() | list == ['newt']
          - ntfy_compose.services.app.cap_drop == ['ALL']
          - ntfy_compose.services.app.cap_add is not defined
          - ntfy_compose.services.app.ports is not defined
          - ntfy_compose.services.app.volumes | selectattr('target', 'equalto', '/etc/ntfy/server.yml') | map(attribute='read_only') | list == [true]
        fail_msg: "Service ntfy inattendu : {{ ntfy_compose.services.app }}"

    - name: Stat the ntfy server configuration
      ansible.builtin.stat:
        path: /opt/apps/ntfy/config/server.yml
      register: ntfy_server_yml

    # Hashes et jetons en clair : jamais lisible par d'autres.
    - name: Assert the ntfy server configuration is private
      ansible.builtin.assert:
        that:
          - ntfy_server_yml.stat.exists
          - ntfy_server_yml.stat.mode == '0600'
          - ntfy_server_yml.stat.pw_name == ansible_facts['user_id']

    - name: Read the ntfy server configuration
      ansible.builtin.slurp:
        src: /opt/apps/ntfy/config/server.yml
      register: ntfy_server_raw

    # Rien sans compte, pas d'inscription. Les jetons sont éprouvés plus bas
    # par le vrai ntfy ; pas le hachage de chaque compte ni à QUI va chaque
    # droit (`ntfy access` n'est lu que par motifs de lignes).
    - name: Assert the ntfy server configuration denies anonymous access and binds each grant to its account
      no_log: true
      vars:
        ntfy_server: "{{ ntfy_server_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - ntfy_server['auth-default-access'] == 'deny-all'
          - ntfy_server['enable-signup'] == false
          - ntfy_server['enable-login'] == true
          - ntfy_server['require-login'] == true
          - ntfy_server['attachment-cache-dir'] is not defined
          - ntfy_server['auth-users'] | sort == ([
              'sylvain:' ~ ntfy_sylvain_password_hash ~ ':user',
              'uptime-kuma:' ~ ntfy_publisher_password_hash ~ ':user',
              'scripts:' ~ ntfy_publisher_password_hash ~ ':user',
              'github:' ~ ntfy_publisher_password_hash ~ ':user',
              'canary:' ~ ntfy_publisher_password_hash ~ ':user',
            ] | sort)
          - ntfy_server['auth-access'] | sort == ([
              'sylvain:*:ro',
              'sylvain:uptime-kuma:rw', 'sylvain:scripts:rw', 'sylvain:github:rw',
              'sylvain:canary:rw',
              'uptime-kuma:uptime-kuma:wo', 'scripts:scripts:wo', 'github:github:wo',
              'canary:canary:wo',
            ] | sort)
        fail_msg: Configuration ntfy inattendue (contenu masqué, il porte les jetons).

    - name: Read the ntfy borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/borgmatic.d/ntfy.yaml
      register: ntfy_borgmatic_raw

    # prepare.yml a posé user.db : copiée par « .backup », sa copie vivante
    # hors de l'archive. Ni data/ (cache.db : des messages de 12 h au plus)
    # ni sqlite_databases de borgmatic.
    - name: Assert the ntfy user database is copied by .backup and the cache is left out
      vars:
        ntfy_borgmatic: "{{ ntfy_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - ntfy_borgmatic.sqlite_databases is not defined
          - "'/var/lib/borgmatic-sqlite/ntfy' in ntfy_borgmatic.source_directories"
          - >-
            ntfy_borgmatic.commands[0].run
            | select('search', 'sqlite3 -bail .*/opt/apps/ntfy/data/user\\.db ')
            | select('search', '\\.backup /var/lib/borgmatic-sqlite/ntfy/opt_apps_ntfy_data_user\\.db')
            | list | length == 1
          - ntfy_borgmatic.commands[0].run | select('search', 'cache\\.db') | list | length == 0
          - "'/opt/apps/ntfy/data' not in ntfy_borgmatic.source_directories"
          - "'/opt/apps/ntfy/config' in ntfy_borgmatic.source_directories"
        fail_msg: "Configuration borgmatic de ntfy inattendue : {{ ntfy_borgmatic }}"

    # Le vrai ntfy, à la version de l'image, sur la configuration rendue :
    # elle doit passer sa validation au démarrage (formats des comptes, des
    # droits et des jetons), et les droits doivent tenir. Seuls l'écoute, les
    # bases et le relais ntfy.sh sont remplacés en ligne de commande (les
    # options passées l'emportent sur server.yml).
    - name: Run the real ntfy on the rendered configuration
      vars:
        ntfy_compose: "{{ ntfy_compose_raw.stdout | from_json }}"
        # docker.io/binwiederhier/ntfy:v<version>@sha256:…
        ntfy_verify_version: "{{ ntfy_compose.services.app.image.split('@')[0].split(':v')[-1] }}"
        ntfy_verify_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
        ntfy_verify_release: "https://github.com/binwiederhier/ntfy/releases/download/v{{ ntfy_verify_version }}"
        ntfy_verify_bin: "{{ ntfy_verify_dir }}/ntfy_{{ ntfy_verify_version }}_linux_{{ ntfy_verify_arch }}/ntfy"
      block:
        - name: Create the ntfy verify folder
          ansible.builtin.file:
            path: "{{ ntfy_verify_dir }}/db"
            state: directory
            mode: "0700"

        - name: Download the ntfy release of the image
          ansible.builtin.get_url:
            url: "{{ ntfy_verify_release }}/ntfy_{{ ntfy_verify_version }}_linux_{{ ntfy_verify_arch }}.tar.gz"
            checksum: "sha256:{{ ntfy_verify_release }}/checksums.txt"
            dest: "{{ ntfy_verify_dir }}/ntfy.tar.gz"
            mode: "0600"

        - name: Extract the ntfy binary
          ansible.builtin.unarchive:
            src: "{{ ntfy_verify_dir }}/ntfy.tar.gz"
            dest: "{{ ntfy_verify_dir }}"
            remote_src: true

        - name: Start ntfy on the rendered configuration
          ansible.builtin.command:
            argv:
              - systemd-run
              - --user
              - --unit=ntfy-molecule
              - --collect
              - "{{ ntfy_verify_bin }}"
              - serve
              - --config=/opt/apps/ntfy/config/server.yml
              - --listen-http=127.0.0.1:18080
              - --auth-file={{ ntfy_verify_dir }}/db/user.db
              - --cache-file={{ ntfy_verify_dir }}/db/cache.db
              - --upstream-base-url=
          changed_when: true

        - name: Wait for ntfy to answer its health route
          ansible.builtin.uri:
            url: "{{ ntfy_verify_url }}/v1/health"
            return_content: true
          register: ntfy_verify_health
          until: ntfy_verify_health.status == 200
          retries: 20
          delay: 1

        - name: Assert ntfy reports healthy
          ansible.builtin.assert:
            that:
              - ntfy_verify_health.json.healthy == true

        # Chaque producteur publie sur son topic avec son jeton, en POST sur
        # /<topic> (curl des scripts et des workflows) ; Uptime Kuma, lui,
        # en JSON sur la racine.
        - name: Publish to each topic with its own token
          no_log: true
          loop:
            - { topic: uptime-kuma, token: "{{ ntfy_verify_uptime_kuma_token }}" }
            - { topic: scripts, token: "{{ ntfy_scripts_token }}" }
            - { topic: github, token: "{{ ntfy_github_token }}" }
            - { topic: canary, token: "{{ ntfy_canary_token }}" }
          ansible.builtin.uri:
            url: "{{ ntfy_verify_url }}/{{ item.topic }}"
            method: POST
            body: molecule
            headers:
              Authorization: "Bearer {{ item.token }}"
            status_code: 200

        - name: Publish as JSON on the root, as Uptime Kuma does
          no_log: true
          ansible.builtin.uri:
            url: "{{ ntfy_verify_url }}/"
            method: POST
            body_format: json
            body: { topic: uptime-kuma, message: molecule }
            headers:
              Authorization: "Bearer {{ ntfy_verify_uptime_kuma_token }}"
            status_code: 200

        # Refusés : un autre topic que le sien, la lecture (écriture seule), et
        # tout sans compte (deny-all).
        - name: Refuse what a producer token may not do
          no_log: true
          loop:
            - { url: /github, method: POST, token: "{{ ntfy_verify_uptime_kuma_token }}" }
            - { url: /uptime-kuma, method: POST, token: "{{ ntfy_scripts_token }}" }
            - { url: "/uptime-kuma/json?poll=1", method: GET, token: "{{ ntfy_verify_uptime_kuma_token }}" }
            - { url: /uptime-kuma/auth, method: GET, token: "{{ ntfy_verify_uptime_kuma_token }}" }
          ansible.builtin.uri:
            url: "{{ ntfy_verify_url }}{{ item.url }}"
            method: "{{ item.method }}"
            body: "{{ 'molecule' if item.method == 'POST' else omit }}"
            headers:
              Authorization: "Bearer {{ item.token }}"
            status_code: [401, 403]

        - name: Refuse anonymous publishing and reading
          loop:
            - { url: /uptime-kuma, method: POST }
            - { url: "/scripts/json?poll=1", method: GET }
            - { url: /github/ws, method: GET }
          ansible.builtin.uri:
            url: "{{ ntfy_verify_url }}{{ item.url }}"
            method: "{{ item.method }}"
            body: "{{ 'molecule' if item.method == 'POST' else omit }}"
            status_code: [401, 403]

        # L'interface web sous /app (derrière le SSO de Pangolin) ; « / »,
        # ouvert sans SSO pour Uptime Kuma, ne la sert pas.
        - name: Serve the web app under /app only
          loop:
            - { url: /app, status: 200 }
            - { url: /, status: 404 }
          ansible.builtin.uri:
            url: "{{ ntfy_verify_url }}{{ item.url }}"
            status_code: "{{ item.status }}"

        - name: List the ntfy accounts and grants
          ansible.builtin.command:
            argv:
              - "{{ ntfy_verify_bin }}"
              - access
              - --config=/opt/apps/ntfy/config/server.yml
              - --auth-file={{ ntfy_verify_dir }}/db/user.db
          register: ntfy_verify_access
          changed_when: false

        # Comptes et droits provisionnés depuis server.yml, rien d'autre.
        - name: Assert the provisioned accounts and grants
          vars:
            ntfy_verify_lines: "{{ ntfy_verify_access.stdout_lines | map('trim') | list }}"
          ansible.builtin.assert:
            that:
              - ntfy_verify_lines | select('match', '^user sylvain [(]role:[ ]user,') | list | length == 1
              - ntfy_verify_lines | select('match', '^user (uptime-kuma|scripts|github|canary) [(]role:[ ]user,') | list | length == 4
              - ntfy_verify_lines | select('match', '^user [^*]') | list | length == 5
              # sylvain : lecture sur le joker (« topic * », cmd/access.go),
              # lecture-écriture sur les quatre topics, rien d'autre en
              # écriture (ni rôle admin « all topics », ni joker en rw).
              - ntfy_verify_lines | select('match', '^- read-only access to topic [*]( |$)') | list | length == 1
              - ntfy_verify_lines | select('match', '^- read-write access to ') | list | length == 4
              - ntfy_verify_lines | select('match', '^- read-write access to topic (uptime-kuma|scripts|github|canary)\\b') | list | length == 4
              - ntfy_verify_lines | select('match', '^- write-only access to topic (uptime-kuma|scripts|github|canary)\\b') | list | length == 4
              - ntfy_verify_lines | select('match', '^- no access to any [(]other[)] topics') | list | length == 1
            fail_msg: "{{ ntfy_verify_access.stdout }}"
      always:
        - name: Read the journal of the verify ntfy
          ansible.builtin.command: journalctl --user -u ntfy-molecule --no-pager -n 40
          register: ntfy_verify_journal
          changed_when: false
          failed_when: false

        - name: Show the journal of the verify ntfy
          ansible.builtin.debug:
            var: ntfy_verify_journal.stdout_lines

        - name: Stop the verify ntfy
          ansible.builtin.systemd:
            name: ntfy-molecule
            scope: user
            state: stopped
          failed_when: false

    # --- Alerte « aucun abonné » (ntfy-subscribers-check.timer) ---------------
    - name: Stat the ntfy subscribers check files
      become: true
      loop:
        - /usr/local/libexec/ntfy-subscribers-check.sh
        - /etc/ntfy-subscribers-check.env
      ansible.builtin.stat:
        path: "{{ item }}"
      register: ntfy_check_files

    # Le script lisible par le compte de l'unité, l'URL push (jeton du
    # moniteur) en 0600 root seulement.
    - name: Assert the ntfy subscribers check files are root-owned
      loop: "{{ ntfy_check_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == ('0600' if item.item.endswith('.env') else '0644')
        fail_msg: "{{ item.item }} : {{ item.stat.pw_name | default('absent') }} {{ item.stat.mode | default('') }}"
        quiet: true

    - name: Read the push URL file of the ntfy subscribers check
      become: true
      ansible.builtin.slurp:
        src: /etc/ntfy-subscribers-check.env
      register: ntfy_check_env

    - name: Assert the push URL file holds the URL given by docker.yml
      ansible.builtin.assert:
        that:
          - (ntfy_check_env.content | b64decode) == 'NTFY_SUBSCRIBERS_CHECK_PUSH_URL=http://127.0.0.1:18082/api/push/molecule-ntfy-subscribers\n'
        fail_msg: "{{ ntfy_check_env.content | b64decode }}"

    - name: Verify the ntfy subscribers check units
      become: true
      ansible.builtin.command: systemd-analyze verify ntfy-subscribers-check.service ntfy-subscribers-check.timer
      register: ntfy_check_analyze
      changed_when: false
      failed_when: >-
        ntfy_check_analyze.rc != 0
        or (ntfy_check_analyze.stderr_lines | select('search', 'ntfy-subscribers-check') | list | length > 0)

    - name: Read the ntfy subscribers check timer
      ansible.builtin.systemd:
        name: ntfy-subscribers-check.timer
      register: ntfy_check_timer

    - name: Read the ntfy subscribers check service
      ansible.builtin.systemd:
        name: ntfy-subscribers-check.service
      register: ntfy_check_unit

    # Sous sylvain (jamais root) avec le groupe docker, l'URL push par le
    # fichier d'environnement seul.
    - name: Assert the subscribers check runs unprivileged
      ansible.builtin.assert:
        that:
          - ntfy_check_timer.status.UnitFileState == 'enabled'
          - ntfy_check_timer.status.ActiveState == 'active'
          - ntfy_check_unit.status.User == 'sylvain'
          - ntfy_check_unit.status.SupplementaryGroups == 'docker'
          - ntfy_check_unit.status.ProtectSystem == 'strict'
          - ntfy_check_unit.status.NoNewPrivileges == 'yes'
          - ntfy_check_unit.status.EnvironmentFiles is search('/etc/ntfy-subscribers-check.env')
          - ntfy_check_unit.status.ExecStart is search('/usr/local/libexec/ntfy-subscribers-check.sh ntfy 480 ')
          - "'/api/push/' not in ntfy_check_unit.status.ExecStart"
        fail_msg: "{{ ntfy_check_unit.status.ExecStart }}"

    # Le vrai script, poussé à un faux Uptime Kuma (http.server rend 200 sur le
    # chemin du moniteur et journalise chaque requête, query string comprise) :
    # par l'unité d'abord (pas de conteneur ntfy dans le scénario : docker
    # logs échoue, down), puis à la main sur des relevés « Server stats »
    # d'un faux docker (un abonné : up ; zéro partout : down).
    - name: Check the subscribers check pushes
      become: true
      vars:
        ntfy_check_dir: /root/molecule-ntfy-check
        ntfy_check_push: http://127.0.0.1:18082/api/push/molecule-ntfy-subscribers # NOSONAR
      block:
        - name: Create the fake Uptime Kuma push path
          ansible.builtin.file:
            path: "{{ ntfy_check_dir }}/api/push"
            state: directory
            mode: "0700"

        - name: Create the fake Uptime Kuma push file and the fake docker
          loop:
            - dest: api/push/molecule-ntfy-subscribers
              mode: "0600"
              content: "{\"ok\":true}\n"
            # Relevés au format de ntfy 2.34 (log/event.go : champs triés),
            # dans le fichier que nomme FAKE_DOCKER_LOGS ; ntfy écrit sur stderr.
            - dest: fake-docker.sh
              mode: "0700"
              content: |
                #!/bin/sh
                [ "$1" = logs ] || exit 1
                cat "$FAKE_DOCKER_LOGS" >&2
            - dest: one-subscriber.log
              mode: "0600"
              content: |
                2026/10/29 18:22:00 INFO Server stats (messages_published=12, subscribers=1, tag=manager, topics_active=3, users=4)
                2026/10/29 18:25:00 INFO Server stats (messages_published=12, subscribers=0, tag=manager, topics_active=1, users=4)
            - dest: no-subscriber.log
              mode: "0600"
              content: |
                2026/10/29 18:25:00 INFO Server stats (messages_published=12, subscribers=0, tag=manager, topics_active=1, users=4)
                2026/10/29 18:26:00 INFO Server stats (messages_published=12, subscribers=0, tag=manager, topics_active=1, users=4)
          ansible.builtin.copy:
            dest: "{{ ntfy_check_dir }}/{{ item.dest }}"
            content: "{{ item.content }}"
            mode: "{{ item.mode }}"

        # Le timer ne doit pas pousser pendant le test : les lignes lues
        # ensuite sont celles des vérifications lancées ici.
        - name: Pause the subscribers check timer during the push test
          ansible.builtin.systemd:
            name: ntfy-subscribers-check.timer
            state: stopped

        - name: Start the fake Uptime Kuma
          ansible.builtin.command:
            argv:
              - systemd-run
              - --unit=molecule-ntfy-push
              - --collect
              - python3
              - -I
              - -m
              - http.server
              - "18082"
              - --bind
              - 127.0.0.1
              - --directory
              - "{{ ntfy_check_dir }}"
          changed_when: true

        - name: Wait for the fake Uptime Kuma to listen
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 18082
            timeout: 30

        # systemctl plutôt que le module : son code de retour est ce qui est
        # vérifié (down : l'unité échoue).
        - name: Run the subscribers check unit
          ansible.builtin.command: systemctl start ntfy-subscribers-check.service # noqa: command-instead-of-module
          register: ntfy_check_unit_run
          changed_when: true
          failed_when: ntfy_check_unit_run.rc == 0

        - name: Run the check on fake stats lines
          loop:
            - { log: one-subscriber.log, rc: 0 }
            - { log: no-subscriber.log, rc: 1 }
          ansible.builtin.command:
            argv: [/bin/sh, /usr/local/libexec/ntfy-subscribers-check.sh, ntfy, "20"]
          environment:
            NTFY_SUBSCRIBERS_CHECK_DOCKER: "{{ ntfy_check_dir }}/fake-docker.sh"
            NTFY_SUBSCRIBERS_CHECK_PUSH_URL: "{{ ntfy_check_push }}"
            FAKE_DOCKER_LOGS: "{{ ntfy_check_dir }}/{{ item.log }}"
          register: ntfy_check_runs
          changed_when: true
          failed_when: ntfy_check_runs.rc != item.rc

        - name: Read what the fake Uptime Kuma received
          ansible.builtin.command: journalctl --unit molecule-ntfy-push -I --output cat --no-pager --grep "GET /api/push/molecule-ntfy-subscribers"
          register: ntfy_check_pushes
          changed_when: false
          until: ntfy_check_pushes.stdout_lines | length == 3
          retries: 10
          delay: 1

        - name: Assert the check pushed down, up, then down with the reason
          vars:
            ntfy_check_lines: "{{ ntfy_check_pushes.stdout_lines | map('urldecode') | list }}"
          ansible.builtin.assert:
            that:
              - "'status=down&' in ntfy_check_lines[0]"
              - "'docker logs ntfy' in ntfy_check_lines[0]"
              - "'status=up&' in ntfy_check_lines[1]"
              - "'1 abonné' in ntfy_check_lines[1]"
              - "'status=down&' in ntfy_check_lines[2]"
              - "'aucun abonné sur 20 min' in ntfy_check_lines[2]"
            fail_msg: "{{ ntfy_check_lines | join(' | ') }}"
      always:
        - name: Stop the fake Uptime Kuma
          ansible.builtin.systemd:
            name: molecule-ntfy-push.service
            state: stopped
          failed_when: false

        - name: Resume the subscribers check timer
          ansible.builtin.systemd:
            name: ntfy-subscribers-check.timer
            state: started

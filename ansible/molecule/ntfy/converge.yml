---
# Le rôle ntfy de pangolin.yaml, avec les variables de l'hôte pangolin.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pangolin/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # pangolin.yaml le lit dans le state de pangolin_config (sortie
    # ntfy_uptime_kuma_token), pas dans SOPS : un faux jeton au bon format,
    # dérivé plutôt qu'écrit en dur.
    - name: Load the ntfy Uptime Kuma token as pangolin.yaml does
      no_log: true
      ansible.builtin.set_fact:
        ntfy_uptime_kuma_token: "tk_{{ ('molecule-ntfy-uptime-kuma' | hash('sha1'))[:29] }}"

    # pangolin.yaml lit l'URL push de l'alerte « aucun abonné » dans le state de
    # pangolin_config : ici le faux Uptime Kuma du verify.
    - name: Load the subscribers check push URL as pangolin.yaml does
      no_log: true
      ansible.builtin.set_fact:
        ntfy_subscribers_check_push_url: http://127.0.0.1:18082/api/push/molecule-ntfy-subscribers # NOSONAR

  roles:
    # Pas de `docker compose up` : ni image tirée, ni réseau « pangolin ».
    - role: ntfy
      vars:
        ntfy_compose_up: false

---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    # Sans état : aucune configuration borgmatic, exprès.
    - name: Verify the pairdrop deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: pairdrop
        verify_app_borgmatic_config: ""

    - name: Verify the pairdrop compose services
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: pairdrop
        verify_compose_healthchecks:
          - app

    - name: Stat the pairdrop borgmatic configuration
      become: true
      ansible.builtin.stat:
        path: "{{ borgmatic_config_dir }}/pairdrop.yaml"
      register: pairdrop_borgmatic

    - name: Assert pairdrop is not backed up
      ansible.builtin.assert:
        that:
          - not pairdrop_borgmatic.stat.exists

    # Le modèle compose est celui que verify_compose_services.yml vient de rendre.
    - name: Assert pairdrop is hardened, unprivileged and holds no volume
      vars:
        pairdrop_compose: "{{ verify_compose_raw.stdout | from_json }}"
        pairdrop_app: "{{ pairdrop_compose.services.app }}"
      ansible.builtin.assert:
        that:
          - pairdrop_app.networks.keys() | list == ['newt']
          - pairdrop_app.read_only
          - pairdrop_app.user == ansible_facts['user_uid'] ~ ':' ~ ansible_facts['user_gid']
          - pairdrop_app.cap_drop == ['ALL']
          - pairdrop_app.security_opt == ['no-new-privileges:true']
          - pairdrop_app.mem_limit is defined
          - "'volumes' not in pairdrop_app"
          - "'ports' not in pairdrop_app"
          - pairdrop_app.environment.WS_FALLBACK == 'false'
          - "'RTC_CONFIG' not in pairdrop_app.environment"
          - pairdrop_app.environment.IPV6_LOCALIZE == '4'
        fail_msg: "Compose de PairDrop inattendu : {{ pairdrop_app }}"

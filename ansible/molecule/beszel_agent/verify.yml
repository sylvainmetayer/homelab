---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../_shared/vars/fake_secrets.yml
  tasks:
    - name: Verify the beszel_agent deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: beszel_agent
        verify_app_borgmatic_config: ""

    - name: Render the beszel_agent compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/beszel_agent
      register: beszel_agent_compose_raw
      changed_when: false

    - name: Read the docker group
      ansible.builtin.getent:
        database: group
        key: docker

    # L'agent ne voit jamais le socket Docker : seul le proxy le monte, sans
    # réseau, et l'agent lit le socket unix du proxy par le groupe docker.
    - name: Assert only the socket proxy sees the Docker socket
      vars:
        beszel_agent_compose: "{{ beszel_agent_compose_raw.stdout | from_json }}"
        docker_gid: "{{ ansible_facts['getent_group']['docker'][1] }}"
        agent: "{{ beszel_agent_compose.services.agent }}"
        proxy: "{{ beszel_agent_compose.services['socket-proxy'] }}"
      ansible.builtin.assert:
        that:
          - agent.volumes | selectattr('source', 'equalto', '/var/run/docker.sock') | list | length == 0
          - agent.volumes | selectattr('target', 'equalto', '/run/socket-proxy') | map(attribute='read_only') | list == [true]
          - agent.network_mode == 'host'
          - agent.read_only
          - agent.cap_drop == ['ALL']
          - agent.cap_add == ['SYS_RAWIO']
          - agent.devices | map(attribute='source') | list == ['/dev/sda']
          - agent.group_add == [docker_gid]
          - agent.image is search('beszel-agent:[^@]+-alpine@sha256:')
          - agent.cpus is not defined
          - agent.mem_limit is defined
          - proxy.volumes | selectattr('source', 'equalto', '/var/run/docker.sock') | list | length == 1
          - proxy.network_mode == 'none'
          - proxy.user == '65534:' ~ docker_gid
          - proxy.read_only
          - proxy.cap_drop == ['ALL']
          - proxy.mem_limit is defined
          - proxy.command | select('match', '^-allow(GET|HEAD)=') | list | length == 2
          - proxy.command | select('match', '^-allow(POST|PUT|DELETE|PATCH)') | list | length == 0
          - "'containers/[a-zA-Z0-9_.-]+/stats' in (proxy.command | join(' '))"
          - "'logs' not in (proxy.command | join(' '))"
          - "'exec' not in (proxy.command | join(' '))"
          - "'images' not in (proxy.command | join(' '))"
        fail_msg: "Compose de l'agent inattendu : {{ beszel_agent_compose.services }}"

    - name: Stat the agent folders
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/apps/beszel_agent/data
        - /opt/apps/beszel_agent/socket
        - /opt/apps/beszel_agent/.env
      register: beszel_agent_dirs

    - name: Assert the agent folders belong to root and to the proxy
      vars:
        docker_gid: "{{ ansible_facts['getent_group']['docker'][1] }}"
      ansible.builtin.assert:
        that:
          - beszel_agent_dirs.results[0].stat.uid == 0
          - beszel_agent_dirs.results[0].stat.mode == '0700'
          - beszel_agent_dirs.results[1].stat.uid == 65534
          - beszel_agent_dirs.results[1].stat.gid == docker_gid | int
          - beszel_agent_dirs.results[1].stat.mode == '0750'
          - beszel_agent_dirs.results[2].stat.mode == '0600'

    - name: Read the agent environment
      ansible.builtin.slurp:
        src: /opt/apps/beszel_agent/.env
      register: beszel_agent_env_raw

    # Le Pi parle au hub par le LAN, sans en-têtes Pangolin, avec SON jeton.
    - name: Assert the agent environment
      vars:
        beszel_agent_env: "{{ beszel_agent_env_raw.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - ('KEY=' ~ beszel_hub_public_key) in beszel_agent_env
          - ('TOKEN=' ~ beszel_agent_tokens.pi) in beszel_agent_env
          - "'HUB_URL=http://192.168.1.216:8090' in beszel_agent_env" # NOSONAR
          - "'HUB_HEADERS' not in beszel_agent_env"
          - "'DISABLE_SSH=true' in beszel_agent_env"
          - "'DOCKER_HOST=unix:///run/socket-proxy/docker.sock' in beszel_agent_env"
          - "'SMART_DEVICES=/dev/sda:sntrealtek\n' in beszel_agent_env"
        fail_msg: "{{ beszel_agent_env }}"

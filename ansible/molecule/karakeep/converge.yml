---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  vars:
    # Sorties de tofu/pangolin_config (pocket_id.tf) : le client OIDC de Karakeep.
    terraform_outputs:
      pocket_id_issuer:
        value: https://idp.example.invalid
      pocket_id_karakeep_client_id:
        value: molecule-pocket-id-karakeep-client-id
      pocket_id_karakeep_client_secret:
        value: molecule-pocket-id-karakeep-client-secret
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # docker.yml lit cette URL dans les outputs du state pangolin_config :
    # un set_fact (absente de secrets/ansible.sops.yaml, donc de fake_secrets.yml).
    - name: Load healthcheck URLs as docker.yml does from the Terraform state
      ansible.builtin.set_fact:
        karakeep_backup_healthcheck_url: https://uptime.example.invalid/api/push/tofu-karakeep-backup
  roles:
    - role: docker_service
    - role: karakeep

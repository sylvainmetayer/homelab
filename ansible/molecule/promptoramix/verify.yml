---
- name: Verify
  hosts: all
  vars_files:
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
  tasks:
    # Pas de configuration borgmatic : le journal des coups est le seul volume, non sauvegardé.
    - name: Verify the promptoramix deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: promptoramix

    - name: Render the promptoramix compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/promptoramix
      register: promptoramix_compose_raw
      changed_when: false
      # Le modèle rendu inclut le .env, donc le secret.
      no_log: true

    # Pangolin résout la cible par nom de conteneur sur le réseau newt
    # (tofu/pangolin_config/website_promptoramix.tf, ip = "promptoramix").
    # Un seul conteneur : pas de réseau privé.
    - name: Assert promptoramix is reachable by Pangolin on the newt network only
      vars:
        promptoramix_compose: "{{ promptoramix_compose_raw.stdout | from_json }}"
      no_log: true
      ansible.builtin.assert:
        that:
          - promptoramix_compose.services.app.container_name == 'promptoramix'
          - promptoramix_compose.services.app.networks.keys() | list == ['newt']
          - promptoramix_compose.networks.newt.external
        fail_msg: "promptoramix doit s'appeler 'promptoramix' et n'être que sur le réseau externe newt : {{ promptoramix_compose.services.app }}"

    # Exposé à tout Internet sans SSO (signature HMAC seule) : racine en
    # lecture seule, aucune capacité.
    - name: Assert promptoramix is hardened
      vars:
        promptoramix_app: "{{ (promptoramix_compose_raw.stdout | from_json).services.app }}"
      no_log: true
      ansible.builtin.assert:
        that:
          - promptoramix_app.read_only
          - promptoramix_app.cap_drop == ['ALL']
          - "'no-new-privileges:true' in promptoramix_app.security_opt"
        fail_msg: promptoramix n'est plus durci (read_only, cap_drop, no-new-privileges).

    - name: Stat the promptoramix journal folder
      ansible.builtin.stat:
        path: /opt/apps/promptoramix/journal
      register: promptoramix_journal

    # Écrit par le conteneur (`nobody`), lisible par lui seul.
    - name: Assert the promptoramix journal folder belongs to the container user
      ansible.builtin.assert:
        that:
          - promptoramix_journal.stat.isdir
          - promptoramix_journal.stat.uid == 65534
          - promptoramix_journal.stat.mode == '0700'

    - name: Stat the promptoramix environment file
      ansible.builtin.stat:
        path: /opt/apps/promptoramix/.env
      register: promptoramix_env

    # Il porte le secret HMAC : jamais lisible par d'autres.
    - name: Assert the promptoramix environment file is private
      ansible.builtin.assert:
        that:
          - promptoramix_env.stat.exists
          - promptoramix_env.stat.mode == '0600'

    # Le modèle rendu par compose : le secret du .env atteint le conteneur.
    - name: Assert the promptoramix container receives the HMAC secret
      vars:
        promptoramix_environment: "{{ (promptoramix_compose_raw.stdout | from_json).services.app.environment }}"
      no_log: true
      ansible.builtin.assert:
        that:
          - promptoramix_environment.LINKX_SECRET == promptoramix_linkx_secret

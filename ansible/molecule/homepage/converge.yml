---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
    - vars/links.yml
  pre_tasks:
    # Toutes les clés homepage_* de fake_secrets.yml : chaque widget à clé
    # est rendu (verify.yml rend aussi la configuration sans elles).
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    - name: Set the Homepage links as docker.yml does
      ansible.builtin.set_fact:
        homepage_websites: "{{ homepage_molecule_links }}"

    # Ce que docker.yml lit dans l'output homepage_uptimekuma_url.
    - name: Set the Uptime Kuma URL as docker.yml does
      ansible.builtin.set_fact:
        homepage_uptimekuma_url: https://uptime.example.invalid

    # Ce que docker.yml lit dans l'output homepage_pangolin_org.
    - name: Set the Pangolin organisation as docker.yml does
      ansible.builtin.set_fact:
        homepage_pangolin_org: homelab

  roles:
    - role: docker_service
    - role: homepage
      vars:
        # Le widget Beszel couvert même si host_vars/docker le coupe un jour.
        homepage_beszel_email: homepage@monitoring.sylvain.cloud
        # Ce que host_vars/docker pose pour le widget FreshRSS.
        homepage_freshrss_username: molecule

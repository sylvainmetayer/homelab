---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../_shared/vars/fake_secrets.yml
  tasks:
    # Sans état : aucune configuration borgmatic.
    - name: Verify the homepage deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: homepage
        verify_app_borgmatic_config: ""

    - name: Stat the homepage borgmatic configuration
      become: true
      ansible.builtin.stat:
        path: /etc/borgmatic.d/homepage.yaml
      register: homepage_borgmatic

    - name: Assert homepage is not backed up
      ansible.builtin.assert:
        that:
          - not homepage_borgmatic.stat.exists

    - name: Render the homepage compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/homepage
      register: homepage_compose_raw
      changed_when: false

    # Liens seulement : ni socket Docker ni autre montage que la configuration,
    # en lecture seule ; le réseau newt, plus celui du widget Beszel (externe,
    # créé par dc@beszel) à l'IP fixe que les « superuser IPs » du hub admettent.
    - name: Assert homepage only mounts its read-only configuration and joins newt
      vars:
        homepage_compose: "{{ homepage_compose_raw.stdout | from_json }}"
        homepage_service: "{{ homepage_compose.services.app }}"
      ansible.builtin.assert:
        that:
          - homepage_service.volumes | length == 1
          - homepage_service.volumes[0].target == '/app/config'
          - homepage_service.volumes[0].read_only | default(false)
          - homepage_service.networks.keys() | list | sort == ['beszel', 'ical', 'newt']
          - homepage_service.networks.beszel.ipv4_address == '172.16.97.3'
          - homepage_compose.networks.keys() | list | sort == ['beszel', 'ical', 'newt']
          - not (homepage_compose.networks.ical.external | default(false))
          - homepage_compose.networks.beszel.name == 'beszel_homepage'
          - homepage_compose.networks.beszel.external
          - homepage_service.environment.HOMEPAGE_ALLOWED_HOSTS.split(',') == ['home.sylvain.cloud', 'homepage:3000', 'homepage']
        fail_msg: "Service homepage inattendu : {{ homepage_service }}"

    # ical-filter : sur le seul réseau privé du projet (ni newt ni port
    # publié), sans privilège, système de fichiers en lecture seule, son
    # script pour seul montage ; une URL de partage par agenda, dans son
    # environnement et nulle part ailleurs.
    - name: Assert ical-filter is confined to the project network
      vars:
        homepage_compose: "{{ homepage_compose_raw.stdout | from_json }}"
        homepage_filter: "{{ homepage_compose.services['ical-filter'] }}"
      ansible.builtin.assert:
        that:
          - homepage_compose.services.keys() | list | sort == ['app', 'ical-filter']
          - homepage_filter.networks.keys() | list == ['ical']
          - homepage_filter.ports | default([]) == []
          - homepage_filter.read_only
          - homepage_filter.user == '65534:65534'
          - homepage_filter.cap_drop == ['ALL']
          - homepage_filter.cap_add | default([]) == []
          - homepage_filter.security_opt == ['no-new-privileges:true']
          - homepage_filter.mem_limit | int == 64 * 1024 * 1024
          - homepage_filter.cpus is not defined
          - homepage_filter.healthcheck.test is defined
          - homepage_filter.volumes | length == 1
          - homepage_filter.volumes[0].target == '/app/ical_filter.py'
          - homepage_filter.volumes[0].read_only | default(false)
          - homepage_filter.environment.ICAL_FEED_PERSO == homepage_calendar_ics_url
          - homepage_filter.environment.ICAL_FEED_TOP_NOUS == homepage_calendar_top_nous_ics_url
          - homepage_compose.services.app.environment.keys() | select('match', 'ICAL_') | list == []
        fail_msg: "Service ical-filter inattendu : {{ homepage_filter }}"

    - name: Stat the calendar filter script
      ansible.builtin.stat:
        path: /opt/apps/homepage/ical_filter.py
      register: homepage_filter_script

    # Lu par nobody dans le conteneur.
    - name: Assert the calendar filter script is world-readable
      ansible.builtin.assert:
        that:
          - homepage_filter_script.stat.exists
          - homepage_filter_script.stat.mode == '0644'

    - name: Create a scratch directory for the calendar filter tests
      ansible.builtin.tempfile:
        state: directory
        suffix: ical
      register: homepage_filter_test_dir

    - name: Copy the calendar filter and its tests
      loop:
        - src: "{{ playbook_dir }}/../../roles/homepage/files/ical_filter.py"
          dest: ical_filter.py
        - src: "{{ playbook_dir }}/files/test_ical_filter.py"
          dest: test_ical_filter.py
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ homepage_filter_test_dir.path }}/{{ item.dest }}"
        mode: "0644"

    # Molecule ne lance aucun conteneur (_shared/prepare.yml) : le script est
    # testé avec le python3 de l'hôte de test. Filtre (VTODO, VJOURNAL,
    # lignes repliées, CRLF), cache et serveur HTTP (/healthz, 404, 502).
    - name: Run the calendar filter tests
      ansible.builtin.command: python3 -I -m unittest discover -s . -p 'test_*.py'
      args:
        chdir: "{{ homepage_filter_test_dir.path }}"
      changed_when: false

    - name: Remove the calendar filter tests
      ansible.builtin.file:
        path: "{{ homepage_filter_test_dir.path }}"
        state: absent

    # Homepage recopie son squelette pour tout fichier absent et s'arrête
    # s'il ne peut pas l'écrire (config/ en lecture seule).
    - name: Stat the homepage configuration files
      ansible.builtin.stat:
        path: "/opt/apps/homepage/config/{{ item }}"
      loop:
        - settings.yaml
        - services.yaml
        - bookmarks.yaml
        - widgets.yaml
        - docker.yaml
        - kubernetes.yaml
        - proxmox.yaml
        - custom.css
        - custom.js
      register: homepage_config_files

    - name: Assert every homepage configuration file is present
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "{{ item.item }} absent : Homepage tenterait de l'écrire dans config/, monté en lecture seule"
      loop: "{{ homepage_config_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the homepage services
      ansible.builtin.import_tasks: tasks/read_services.yml
      vars:
        homepage_services_path: /opt/apps/homepage/config/services.yaml

    # Groupes dans l'ordre de homepage_groups, le groupe inconnu en dernier ;
    # cartes triées par nom dans un groupe ; Jellyfin et Proxmox
    # (homepage_extra_links) en plus de l'output ; pas d'icône vide.
    - name: Assert the homepage services list every link in its group
      ansible.builtin.assert:
        that:
          - homepage_group_names == ['Documents', 'Lecture', 'Photos et médias', 'Vie perso', 'Administration', 'Hôtes', 'Groupe hors liste']
          - homepage_card_names['Documents'] == ['BookStack', 'Paperless-ngx']
          - homepage_card_names['Photos et médias'] == ['Immich', 'Jellyfin']
          - homepage_card_names['Vie perso'] == ['Agenda', 'Homebox']
          - homepage_card_names['Administration'] == ['Beszel', 'Pangolin', 'Proxmox', 'Speedtest Tracker', 'sylvain.dev']
          - homepage_cards['Documents']['BookStack'].href == 'https://wiki.sylvain.cloud'
          - homepage_cards['Documents']['BookStack'].icon == 'bookstack'
          - homepage_cards['Documents']['BookStack'].widget is not defined
          - homepage_cards['Documents']['Paperless-ngx'].icon is not defined
          - homepage_cards['Photos et médias']['Jellyfin'].href == 'https://media.sylvain.cloud:8443'
          - homepage_cards['Groupe hors liste']['Betisier'].description == 'Bêtisier, application de TP'
        fail_msg: "services.yaml inattendu : {{ homepage_cards }}"

    # Pastille d'état : la cible de Pangolin et sa sonde (output), l'adresse
    # LAN du rôle pour l'Immich du Pi, Jellyfin et Proxmox ; aucune sans
    # adresse (Paperless ici, flip et immich_swipe en vrai).
    - name: Assert the site monitors
      ansible.builtin.assert:
        that:
          - homepage_cards['Documents']['BookStack'].siteMonitor == 'http://bookstack:80/login' # NOSONAR
          - homepage_cards['Documents']['Paperless-ngx'].siteMonitor is not defined
          - homepage_cards['Photos et médias']['Immich'].siteMonitor == 'http://192.168.1.96:2283/api/server/ping' # NOSONAR
          - homepage_cards['Photos et médias']['Jellyfin'].siteMonitor == 'http://192.168.1.137:8096/health' # NOSONAR
          - homepage_cards['Administration']['Proxmox'].siteMonitor == 'https://192.168.1.26:8006'
          - homepage_cards['Administration']['Pangolin'].siteMonitor is not defined
          - homepage_cards['Administration']['sylvain.dev'].siteMonitor is not defined
        fail_msg: "Pastilles inattendues : {{ homepage_cards }}"

    # Agenda : une intégration iCal par clé non vide, dans l'ordre de
    # homepage_calendars ; ici les deux clés de fake_secrets.yml. Homepage lit
    # chaque agenda filtré chez ical-filter : aucune URL de partage dans
    # services.yaml.
    - name: Assert the calendar card lists both calendars
      vars:
        homepage_agenda: "{{ homepage_cards['Vie perso']['Agenda'] }}"
      ansible.builtin.assert:
        that:
          - homepage_agenda.description == 'Perso et Top nous (Nextcloud)'
          - homepage_agenda.widget.type == 'calendar'
          - homepage_agenda.widget.integrations | map(attribute='name') | list == ['Perso', 'Top nous']
          - homepage_agenda.widget.integrations | map(attribute='type') | unique | list == ['ical']
          - homepage_agenda.widget.integrations | map(attribute='url') | list
            == ['http://ical-filter:8080/perso.ics', 'http://ical-filter:8080/top-nous.ics'] # NOSONAR (réseau privé du projet)
          - homepage_agenda.widget.integrations | map(attribute='color') | list == ['blue', 'pink']
          - homepage_calendar_ics_url not in (homepage_services_raw.content | b64decode)
          - homepage_calendar_top_nous_ics_url not in (homepage_services_raw.content | b64decode)
          - "'public-calendars' not in (homepage_services_raw.content | b64decode)"
        fail_msg: "Agenda inattendu : {{ homepage_agenda }}"

    # Widgets : Beszel sur son lien (superuser du rôle beszel, par l'IP du hub
    # sur le réseau du widget, pas par son nom sur newt),
    # une carte pour la page de statut sylvain-dev d'Uptime Kuma, sans href
    # (l'URL d'Uptime Kuma reste dans la configuration). Aucune carte des
    # sauvegardes : pas de page publique pour elles.
    - name: Assert the Beszel and Uptime Kuma widgets
      vars:
        homepage_admin: "{{ homepage_cards['Administration'] }}"
        homepage_kuma_widget: "{{ homepage_admin['sylvain.dev'].widget }}"
      ansible.builtin.assert:
        that:
          - homepage_admin['Beszel'].href == 'https://monitoring.sylvain.cloud'
          - homepage_admin['Beszel'].widget.type == 'beszel'
          - homepage_admin['Beszel'].widget.version == 2
          - homepage_admin['Beszel'].widget.url == 'http://172.16.97.2:8090' # NOSONAR
          - homepage_admin['Beszel'].widget.username == 'homepage@monitoring.sylvain.cloud'
          - homepage_admin['Beszel'].widget.password == homepage_beszel_password
          - homepage_admin['Beszel'].widget.fields == ['systems', 'up']
          - homepage_kuma_widget.type == 'uptimekuma'
          - homepage_kuma_widget.url == 'https://uptime.example.invalid'
          - homepage_kuma_widget.slug == 'sylvain-dev'
          - homepage_kuma_widget.keys() | list | sort == ['slug', 'type', 'url']
          - homepage_admin['sylvain.dev'].href is not defined
        fail_msg: "Widgets inattendus : {{ homepage_admin }}"

    # Une carte Beszel par système du hub (clés de beszel_agent_tokens), sur
    # SON système, par l'IP fixe du hub comme le widget Beszel (24fab015).
    - name: Assert one Beszel card per host
      vars:
        homepage_hosts_cards: "{{ homepage_cards['Hôtes'] }}"
      ansible.builtin.assert:
        that:
          - homepage_card_names['Hôtes'] == beszel_agent_tokens.keys() | list | sort
          - homepage_hosts_cards.values() | map(attribute='widget.type') | unique | list == ['beszel']
          - homepage_hosts_cards.values() | map(attribute='widget.systemId') | list == homepage_hosts_cards.keys() | list
          - homepage_hosts_cards.values() | map(attribute='widget.url') | unique | list == [homepage_cards['Administration']['Beszel'].widget.url]
        fail_msg: "Cartes d'hôte inattendues : {{ homepage_cards['Hôtes'] }}"

# Même gabarit sans aucune clé sops ni output d'Uptime Kuma ou de Pangolin :
# la page se déploie avant que Sylvain ait créé les jetons. Ni widget, ni
# carte d'hôte, ni agenda, ni proxmox.yaml ; les pastilles restent (aucune
# clé). Rendu hors de /opt/apps : le déploiement convergé n'est pas touché.
- name: Verify the configuration without any credential
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../roles/homepage/defaults/main.yml
    - vars/links.yml
  tasks:
    - name: Set the Homepage links as docker.yml does
      ansible.builtin.set_fact:
        homepage_websites: "{{ homepage_molecule_links }}"

    - name: Create a scratch directory for the credential-less configuration
      ansible.builtin.tempfile:
        state: directory
        suffix: homepage
      register: homepage_empty_dir

    - name: Render the configuration without credentials
      diff: false
      loop:
        - config/services.yaml.j2
        - config/widgets.yaml.j2
        - config/proxmox.yaml.j2
        - compose.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/homepage/templates/{{ item }}"
        dest: "{{ homepage_empty_dir.path }}/{{ item | basename | regex_replace('\\.j2$', '') }}"
        mode: "0600"

    - name: Read the credential-less services
      ansible.builtin.import_tasks: tasks/read_services.yml
      vars:
        homepage_services_path: "{{ homepage_empty_dir.path }}/services.yaml"

    - name: Read the credential-less proxmox configuration
      ansible.builtin.slurp:
        src: "{{ homepage_empty_dir.path }}/proxmox.yaml"
      register: homepage_empty_proxmox_raw

    - name: Read the credential-less compose
      ansible.builtin.slurp:
        src: "{{ homepage_empty_dir.path }}/compose.yaml"
      register: homepage_empty_compose_raw

    - name: Read the credential-less header widgets
      ansible.builtin.slurp:
        src: "{{ homepage_empty_dir.path }}/widgets.yaml"
      register: homepage_empty_widgets_raw

    - name: Assert no widget needing a credential is rendered
      vars:
        homepage_all_cards: "{{ homepage_cards.values() | map('dict2items') | flatten | map(attribute='value') | list }}"
      ansible.builtin.assert:
        that:
          - "'Hôtes' not in homepage_group_names"
          - homepage_card_names['Vie perso'] == ['Homebox']
          - homepage_card_names['Administration'] == ['Beszel', 'Pangolin', 'Proxmox', 'Speedtest Tracker']
          - homepage_all_cards | selectattr('widget', 'defined') | list == []
          - homepage_all_cards | selectattr('proxmoxVMID', 'defined') | list == []
          - homepage_cards['Documents']['BookStack'].siteMonitor == 'http://bookstack:80/login' # NOSONAR
          - homepage_cards['Photos et médias']['Immich'].siteMonitor == 'http://192.168.1.96:2283/api/server/ping' # NOSONAR
          - (homepage_empty_proxmox_raw.content | b64decode | from_yaml) is none
          - (homepage_empty_widgets_raw.content | b64decode | from_yaml) | length == 3
          # Sans agenda, ni ical-filter ni son réseau.
          - (homepage_empty_compose_raw.content | b64decode | from_yaml).services.keys() | list == ['app']
          - (homepage_empty_compose_raw.content | b64decode | from_yaml).networks.keys() | list == ['newt']
        fail_msg: "Configuration sans clé inattendue : {{ homepage_cards }}"

    # Une seule clé (Top nous) : la carte reste, avec ce seul agenda.
    - name: Render the services with only the Top nous calendar
      diff: false
      vars:
        homepage_calendar_top_nous_ics_url: "https://cloud.example.invalid/remote.php/dav/public-calendars/molecule-one-calendar?export"
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/homepage/templates/config/services.yaml.j2"
        dest: "{{ homepage_empty_dir.path }}/services-one-calendar.yaml"
        mode: "0600"

    - name: Read the one-calendar services
      ansible.builtin.import_tasks: tasks/read_services.yml
      vars:
        homepage_services_path: "{{ homepage_empty_dir.path }}/services-one-calendar.yaml"

    - name: Assert the calendar card lists only the Top nous calendar
      vars:
        homepage_agenda: "{{ homepage_cards['Vie perso']['Agenda'] }}"
      ansible.builtin.assert:
        that:
          - homepage_card_names['Vie perso'] == ['Agenda', 'Homebox']
          - homepage_agenda.description == 'Top nous (Nextcloud)'
          - homepage_agenda.widget.integrations | map(attribute='name') | list == ['Top nous']
          - homepage_agenda.widget.integrations | map(attribute='url') | list == ['http://ical-filter:8080/top-nous.ics'] # NOSONAR
        fail_msg: "Agenda à une clé inattendu : {{ homepage_cards['Vie perso'] }}"

    - name: Remove the scratch directory
      ansible.builtin.file:
        path: "{{ homepage_empty_dir.path }}"
        state: absent

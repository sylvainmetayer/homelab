---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  vars:
    nginx_demo_verify_data: /mnt/nas/apps/nginx_demo
  tasks:
    # dc@nginx_demo actif prouve aussi que son ExecStartPre (nas-storage-wait)
    # a trouvé le NAS.
    - name: Verify the nginx_demo deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: nginx_demo
        verify_app_borgmatic_config: /etc/borgmatic.d/nginx_demo.yaml

    - name: Stat the nginx_demo data on the NAS
      become: true
      ansible.builtin.stat:
        path: "{{ nginx_demo_verify_data }}/{{ item }}"
      loop:
        - "."
        - html
        - html/index.html
        - postgresql
        - db_password
      register: nginx_demo_data

    # Chaque dossier appartient à qui l'utilise dans le conteneur, rien n'est
    # ouvert à "others" : postgres alpine (70), groupe nginx alpine (101).
    - name: Assert the NAS data ownership and modes
      vars:
        nginx_demo_root: "{{ nginx_demo_data.results[0].stat }}"
        nginx_demo_html: "{{ nginx_demo_data.results[1].stat }}"
        nginx_demo_index: "{{ nginx_demo_data.results[2].stat }}"
        nginx_demo_pgdata: "{{ nginx_demo_data.results[3].stat }}"
        nginx_demo_password: "{{ nginx_demo_data.results[4].stat }}"
      ansible.builtin.assert:
        that:
          - nginx_demo_root.isdir and nginx_demo_root.mode == '0750'
          - nginx_demo_root.pw_name == ansible_facts['user_id']
          - nginx_demo_html.isdir and nginx_demo_html.mode == '0750' and nginx_demo_html.gid == 101
          - nginx_demo_index.exists and nginx_demo_index.mode == '0640' and nginx_demo_index.gid == 101
          - nginx_demo_pgdata.isdir and nginx_demo_pgdata.mode == '0700'
          - nginx_demo_pgdata.uid == 70 and nginx_demo_pgdata.gid == 70
          - nginx_demo_password.exists and nginx_demo_password.mode == '0600'
          - nginx_demo_password.pw_name == 'root' and nginx_demo_password.size > 0

    - name: Read the database password drawn on the NAS
      become: true
      ansible.builtin.slurp:
        src: "{{ nginx_demo_verify_data }}/db_password"
      register: nginx_demo_password_file

    - name: Read the environment file, the compose file and the borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /opt/apps/nginx_demo/.env
        - /opt/apps/nginx_demo/compose.yaml
        - /etc/borgmatic.d/nginx_demo.yaml
      register: nginx_demo_files

    - name: Assert the password, the slice and the backup wiring
      vars:
        nginx_demo_password: "{{ nginx_demo_password_file.content | b64decode | trim }}"
        nginx_demo_env: "{{ nginx_demo_files.results[0].content | b64decode }}"
        nginx_demo_compose: "{{ nginx_demo_files.results[1].content | b64decode }}"
        nginx_demo_borgmatic: "{{ nginx_demo_files.results[2].content | b64decode }}"
      ansible.builtin.assert:
        that:
          # Le mot de passe vient du fichier tiré sur le NAS, pas d'un secret partagé.
          - nginx_demo_password | length == 48
          - "('NGINX_DEMO_DB_PASSWORD=' ~ nginx_demo_password) in nginx_demo_env"
          - "('password: ' ~ nginx_demo_password) in nginx_demo_borgmatic"
          # Les deux conteneurs dans la slice ordonnée après le montage du NAS.
          - "nginx_demo_compose.count('cgroup_parent: nas-storage.slice') == 2"
          - "'/mnt/nas/apps/nginx_demo/postgresql:/var/lib/postgresql' in nginx_demo_compose"
          # Un NAS absent fait échouer ce backup au lieu de bloquer les autres.
          - "'/usr/local/bin/nas-storage-wait 30' in nginx_demo_borgmatic"
          - "'source_directories_must_exist: true' in nginx_demo_borgmatic"
          - "'- /mnt/nas/apps/nginx_demo/html' in nginx_demo_borgmatic"
          # Le data directory passe par pg_dump, jamais par copie de fichiers.
          - "'- /mnt/nas/apps/nginx_demo/postgresql' not in nginx_demo_borgmatic"

    - name: Read the dc@nginx_demo drop-in
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dc@nginx_demo.service.d/nas-storage.conf"
      register: nginx_demo_dropin

    - name: Assert dc@nginx_demo waits for the NAS before starting
      ansible.builtin.assert:
        that:
          - "'ExecStartPre=/usr/local/bin/nas-storage-wait 200' in (nginx_demo_dropin.content | b64decode)"

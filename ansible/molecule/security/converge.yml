---
# Comme dans pangolin.yaml (le plus complet : ports UDP, bastion SSH, devsec) :
# rôle appliqué avec become au niveau du playbook. Le scénario security_flip
# fait de même avec les variables de flip.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pangolin/variables.yaml
    # En dernier : le relais msmtp vise le récepteur du prepare.
    - vars/smtp_sink.yml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # Le ProxyJump vers flip doit survivre au sshd_config de devsec.
    - name: Assert Pangolin is a bastion
      ansible.builtin.assert:
        that:
          - security_ssh_allow_tcp_forwarding == 'local'
  roles:
    - role: security
      become: true

---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  pre_tasks:
    # victoria_logs_ui_password et ntfy_scripts_token.
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml
  roles:
    # Tout vers files/fake_api.py. Ni premier lancement ni horaire proche : le
    # verify lance l'unité lui-même.
    - role: log_alerts
      vars:
        log_alerts_push_url: http://127.0.0.1:18084/api/push/molecule-log-alerts # NOSONAR
        log_alerts_vl_url: http://127.0.0.1:18084 # NOSONAR
        log_alerts_ntfy_url: http://127.0.0.1:18084 # NOSONAR
        log_alerts_first_run_delay: 1d
        log_alerts_schedule: "2099-01-01"

---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    # Sans état : aucune configuration borgmatic, exprès.
    - name: Verify the globalping_probe deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: globalping_probe
        verify_app_borgmatic_config: ""

    - name: Verify the globalping_probe compose services
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: globalping_probe

    # Le modèle compose est celui que verify_compose_services.yml vient de rendre.
    - name: Assert the probe is hardened, on the host network and holds no volume
      vars:
        gp_probe: "{{ (verify_compose_raw.stdout | from_json).services.probe }}"
      ansible.builtin.assert:
        that:
          - gp_probe.network_mode == 'host'
          - gp_probe.read_only
          - gp_probe.cap_drop == ['ALL']
          - gp_probe.cap_add == ['NET_RAW']
          - gp_probe.security_opt == ['no-new-privileges:true']
          - gp_probe.mem_limit is defined
          - "'volumes' not in gp_probe"
          - "'GP_ADOPTION_TOKEN' not in (gp_probe.environment | default({}))"
        fail_msg: "Compose de globalping_probe inattendu : {{ gp_probe }}"

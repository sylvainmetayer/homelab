---
- name: Verify
  hosts: all
  vars_files:
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
  tasks:
    - name: Verify the nextcloud deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: nextcloud
        verify_app_borgmatic_config: /etc/borgmatic.d/nextcloud.yaml

    # Il contiendra les fichiers des utilisateurs : fermé aux autres comptes.
    - name: Stat the nextcloud app folder
      ansible.builtin.stat:
        path: /opt/apps/nextcloud
      register: nextcloud_dir

    - name: Assert the nextcloud app folder is private
      ansible.builtin.assert:
        that:
          - nextcloud_dir.stat.mode == '0700'
          - nextcloud_dir.stat.pw_name == ansible_facts['user_id']
        fail_msg: "/opt/apps/nextcloud doit être 0700 à {{ ansible_facts['user_id'] }}"

    - name: Read the nextcloud compose file
      ansible.builtin.slurp:
        src: /opt/apps/nextcloud/compose.yaml
      register: nextcloud_compose_raw

    # Base et redis restent sur le réseau interne ; redis exige le mot de passe
    # des secrets.
    - name: Assert only Nextcloud is on newt and redis requires its password
      vars:
        nextcloud_compose: "{{ nextcloud_compose_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - "'newt' in nextcloud_compose.services.nextcloud.networks"
          - "'newt' not in nextcloud_compose.services.db.networks"
          - "'newt' not in nextcloud_compose.services.cache.networks"
          - nextcloud_compose.services.db.environment.MYSQL_PASSWORD == nextcloud_db_password
          - nextcloud_compose.services.cache.command == 'redis-server --requirepass ' ~ nextcloud_redis_password
        fail_msg: "Compose de nextcloud inattendu : {{ nextcloud_compose.services }}"

    # Configuration posée à côté de config.php : mots de passe d'application
    # seulement, IP réelle des clients derrière newt, liens en https.
    - name: Stat the homelab Nextcloud configuration
      ansible.builtin.stat:
        path: /opt/apps/nextcloud/config/www/nextcloud/config/homelab.config.php
      register: nextcloud_homelab_config_stat

    - name: Assert the homelab Nextcloud configuration is readable by the container only
      ansible.builtin.assert:
        that:
          - nextcloud_homelab_config_stat.stat.exists
          - nextcloud_homelab_config_stat.stat.mode == '0640'
          - nextcloud_homelab_config_stat.stat.pw_name == ansible_facts['user_id']
        fail_msg: "homelab.config.php absent, ou pas 0640 à {{ ansible_facts['user_id'] }}"

    - name: Read the homelab Nextcloud configuration
      ansible.builtin.slurp:
        src: /opt/apps/nextcloud/config/www/nextcloud/config/homelab.config.php
      register: nextcloud_homelab_config_raw

    - name: Read the newt network definition
      ansible.builtin.command: docker network inspect newt
      register: nextcloud_newt_network
      changed_when: false

    # Nextcloud refuse un fichier dont quelque chose précède `<?php`
    # (« Config file has leading content »).
    - name: Assert the homelab Nextcloud configuration sets the hardening keys
      vars:
        nextcloud_homelab_config: "{{ nextcloud_homelab_config_raw.content | b64decode }}"
        nextcloud_newt_subnet: "{{ (nextcloud_newt_network.stdout | from_json)[0].IPAM.Config[0].Subnet }}"
      ansible.builtin.assert:
        that:
          - nextcloud_homelab_config is match('<\?php\n')
          - "\"'token_auth_enforced' => true,\" in nextcloud_homelab_config"
          - "\"0 => '\" ~ nextcloud_newt_subnet ~ \"',\" in nextcloud_homelab_config"
          - "\"0 => 'HTTP_X_FORWARDED_FOR',\" in nextcloud_homelab_config"
          - "\"'overwriteprotocol' => 'https',\" in nextcloud_homelab_config"
        fail_msg: "homelab.config.php inattendu (sous-réseau newt : {{ nextcloud_newt_subnet }}) : {{ nextcloud_homelab_config }}"

    # Le stand-in de config.php du prepare n'est pas réécrit par le rôle.
    - name: Read the stand-in config.php
      ansible.builtin.slurp:
        src: /opt/apps/nextcloud/config/www/nextcloud/config/config.php
      register: nextcloud_main_config_raw

    - name: Assert the role leaves config.php to Nextcloud
      ansible.builtin.assert:
        that:
          - "'token_auth_enforced' not in (nextcloud_main_config_raw.content | b64decode)"
        fail_msg: "Le rôle ne doit pas écrire dans config.php, que Nextcloud réécrit."

    - name: Stat the nextcloud borgmatic configuration
      become: true
      ansible.builtin.stat:
        path: /etc/borgmatic.d/nextcloud.yaml
      register: nextcloud_borgmatic_stat

    - name: Assert the nextcloud borgmatic configuration is private
      ansible.builtin.assert:
        that:
          - nextcloud_borgmatic_stat.stat.mode == '0600'
          - nextcloud_borgmatic_stat.stat.pw_name == 'root'
        fail_msg: "/etc/borgmatic.d/nextcloud.yaml doit être 0600 root (mots de passe)"

    - name: Read the nextcloud borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/borgmatic.d/nextcloud.yaml
      register: nextcloud_borgmatic_raw

    # Archives nommées d'après le service ; match_archives couvre aussi les
    # anciennes 'betisier-…' de ce dépôt (cf. roles/nextcloud/tasks/main.yml).
    - name: Assert the nextcloud backup covers data and database and pushes to Uptime Kuma
      vars:
        nextcloud_borgmatic: "{{ nextcloud_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - nextcloud_borgmatic.repositories[0].path == 'ssh://u000000@u000000.your-storagebox.example.invalid/./backup/nextcloud'
          - nextcloud_borgmatic.encryption_passphrase == 'molecule-backup-passphrase'
          - "'/opt/apps/nextcloud/data' in nextcloud_borgmatic.source_directories"
          # Le dump couvre la base : pas de copie à chaud de son dossier.
          - "'/opt/apps/nextcloud/db_data' not in nextcloud_borgmatic.source_directories"
          - nextcloud_borgmatic.archive_name_format is match('nextcloud-')
          - nextcloud_borgmatic.match_archives == '*'
          - nextcloud_borgmatic.mysql_databases[0].container == 'nextcloud_db'
          - nextcloud_borgmatic.mysql_databases[0].password == nextcloud_db_password
          # mariadb:lts n'a pas de mysqldump.
          - nextcloud_borgmatic.mysql_databases[0].mysql_dump_command == 'docker exec --env MYSQL_PWD nextcloud_db mariadb-dump'
          - nextcloud_borgmatic.uptime_kuma.push_url == 'https://uptime.example.invalid/api/push/tofu-nextcloud-backup'
        fail_msg: "Configuration borgmatic de nextcloud inattendue : {{ nextcloud_borgmatic }}"

    - name: Stat the repo-create marker of the borgmatic stub for nextcloud
      become: true
      ansible.builtin.stat:
        path: "{{ molecule_borgmatic_state_dir }}/_etc_borgmatic.d_nextcloud.yaml"
      register: nextcloud_repo_marker

    - name: Assert the nextcloud borg repository was initialised
      ansible.builtin.assert:
        that:
          - nextcloud_repo_marker.stat.exists
        fail_msg: "Le rôle n'a pas lancé borgmatic repo-create pour nextcloud"

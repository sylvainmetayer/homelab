---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: docker_service
    - role: beszel
      vars:
        # Aucun conteneur : le mock de prepare.yml, pas `docker exec beszel`.
        beszel_superuser_command: [/usr/local/bin/beszel-superuser-mock]
        # Vide dans host_vars/docker tant que l'IP de Homepage n'est pas dans
        # les « superuser IPs » du hub : le scénario garde le chemin couvert.
        beszel_homepage_email: homepage@monitoring.sylvain.cloud

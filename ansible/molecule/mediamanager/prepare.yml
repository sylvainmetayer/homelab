---
- name: NAS prepare
  ansible.builtin.import_playbook: ../nas/prepare.yml

# La base de Prowlarr, comme après son premier démarrage : le rôle borgmatic
# (tasks/app.yml) doit la trouver, la copier et exclure sa copie vivante.
# Dossiers aux propriétaires et modes que leur donne le rôle mediamanager.
- name: MediaManager prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create the Prowlarr folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        mode: "0700"
      loop:
        - { path: /volume1/docker/mediamanager, owner: root }
        - { path: /volume1/docker/mediamanager/prowlarr, owner: sylvain }

    - name: Create the Prowlarr database
      ansible.builtin.command:
        cmd: >-
          python3 -c "import os, sqlite3; os.umask(0o077);
          sqlite3.connect('/volume1/docker/mediamanager/prowlarr/prowlarr.db').execute('CREATE TABLE Indexers (Id INTEGER PRIMARY KEY)')"
        creates: /volume1/docker/mediamanager/prowlarr/prowlarr.db

    - name: Give the Prowlarr database to its account
      ansible.builtin.file:
        path: /volume1/docker/mediamanager/prowlarr/prowlarr.db
        owner: sylvain
        mode: "0600"

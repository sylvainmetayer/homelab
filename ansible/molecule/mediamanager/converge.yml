---
# MediaManager ne tourne que sur le NAS (nas.yml) : ses host_vars, dc@
# système. Sans clé WireGuard (fake_secrets.yml n'en a pas, comme
# secrets/ansible.sops.yaml avant que Sylvain la pose) : ni gluetun, ni
# qBittorrent, ni Prowlarr. verify.yml rend aussi la variante avec VPN.
- name: Converge
  hosts: all
  gather_facts: false
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/nas/variables.yaml
  vars:
    # Le bouchon de _shared/prepare.yml au lieu de l'enrobage du conteneur
    # borgmatic, qui tirerait l'image (repo-create de tasks/app.yml).
    borgmatic_bin: /root/.local/bin/borgmatic
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml
  roles:
    - role: docker_service
    # borgmatic en conteneur (host_vars/nas) : dossier des configurations,
    # clé SSH, unités.
    - role: borgmatic
    - role: mediamanager

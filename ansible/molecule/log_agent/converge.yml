---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pi/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: docker_service
    # Comme pi.yml, sous le nom d'inventaire du Pi.
    - role: log_agent
      vars:
        log_agent_name: pi

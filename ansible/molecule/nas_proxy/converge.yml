---
# Comme nas.yml : jellyfin (qui crée le réseau media) avant nas_proxy. La
# converge du scénario jellyfin telle quelle (docker_service, borgmatic pour
# sa sauvegarde, jellyfin) : ses prérequis ne sont écrits qu'une fois.
- name: Converge jellyfin
  ansible.builtin.import_playbook: ../jellyfin/converge.yml

- name: Converge
  hosts: all
  gather_facts: false
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/nas/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml
  vars:
    # Sorties fictives du state pangolin_config : le client Pocket ID de
    # Prowlarr et qBittorrent, donc oauth2-proxy et ses middlewares rendus.
    terraform_outputs:
      pocket_id_issuer:
        value: https://idp.example.invalid
      pocket_id_mediamanager_tools_client_id:
        value: molecule-pocket-id-tools-client-id
      pocket_id_mediamanager_tools_client_secret:
        value: molecule-pocket-id-tools-client-secret
  roles:
    # nas.yml lit l'URL push dans le state de pangolin_config : ici un
    # serveur HTTP local du verify, qui journalise ce qu'il reçoit.
    - role: nas_proxy
      vars:
        # Adresse de documentation : ansible_host n'est pas une IP ici.
        nas_proxy_bind_address: 192.0.2.10
        nas_proxy_cert_healthcheck_url: http://127.0.0.1:18080/api/push/molecule-cert # NOSONAR
        nas_proxy_healthcheck_url: http://127.0.0.1:18080/api/push/molecule-nas # NOSONAR

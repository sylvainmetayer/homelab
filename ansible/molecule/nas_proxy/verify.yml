---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/nas/variables.yaml
  vars:
    nas_proxy_verify_path: "{{ docker_base_path }}/nas_proxy"
    nas_proxy_verify_tls_dir: /root/molecule-tls
  pre_tasks:
    # Identifiants OVH et e-mail ACME comparés aux fausses valeurs.
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml
  tasks:
    # Compose à root en 0600, valide, sous dc@nas_proxy en unité système.
    - name: Verify the nas_proxy deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: nas_proxy

    - name: Render the compose models of nas_proxy and jellyfin
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: "{{ docker_base_path }}/{{ item }}"
      loop: [nas_proxy, jellyfin]
      register: nas_proxy_verify_compose
      changed_when: false

    # 8443 du conteneur publié en 8443, le 443 de l'hôte jamais publié par
    # Docker (tenu par le relais, ci-dessous), configuration en fichiers, aucun socket Docker, identifiants
    # OVH du DNS-01 tirés des clés SOPS nas_ovh_*. Le réseau media est celui
    # de jellyfin (jellyfin_media pour Docker), où Traefik garde l'IP fixe des
    # « Proxys connus » de Jellyfin.
    - name: Assert Traefik runs hardened, without the Docker socket
      vars:
        nas_proxy_verify_model: "{{ nas_proxy_verify_compose.results[0].stdout | from_json }}"
        nas_proxy_verify_jellyfin: "{{ nas_proxy_verify_compose.results[1].stdout | from_json }}"
        nas_proxy_verify_traefik: "{{ nas_proxy_verify_model.services.traefik }}"
      ansible.builtin.assert:
        that:
          - nas_proxy_verify_model.services.keys() | sort == ['forward', 'traefik']
          - nas_proxy_verify_traefik.container_name == 'nas-proxy'
          - nas_proxy_verify_traefik.ports | map(attribute='published') | map('string') | list == ['8443']
          - nas_proxy_verify_traefik.ports | map(attribute='target') | list == [8443]
          - nas_proxy_verify_traefik.volumes | selectattr('source', 'search', 'docker\.sock') | list | length == 0
          - nas_proxy_verify_traefik.volumes | map(attribute='source') | list
            == [nas_proxy_verify_path ~ '/config', nas_proxy_verify_path ~ '/acme']
          - nas_proxy_verify_traefik.labels is not defined
          - nas_proxy_verify_traefik.cap_drop == ['ALL']
          - nas_proxy_verify_traefik.cap_add == ['NET_BIND_SERVICE']
          - nas_proxy_verify_traefik.read_only
          - nas_proxy_verify_traefik.security_opt == ['no-new-privileges:true']
          - nas_proxy_verify_traefik.environment.OVH_APPLICATION_KEY == nas_ovh_application_key
          - nas_proxy_verify_traefik.environment.OVH_APPLICATION_SECRET == nas_ovh_application_secret
          - nas_proxy_verify_traefik.environment.OVH_CONSUMER_KEY == nas_ovh_consumer_key
          - nas_proxy_verify_traefik.networks.keys() | sort == ['media', 'newt']
          - nas_proxy_verify_traefik.networks.media.ipv4_address == '172.30.96.10'
          - nas_proxy_verify_model.networks.newt.external
          - nas_proxy_verify_model.networks.media.external
          - nas_proxy_verify_model.networks.media.name == 'jellyfin_media'
          # Créé par le projet jellyfin, dont Compose préfixe le nom.
          - nas_proxy_verify_jellyfin.name ~ '_media' == nas_proxy_verify_model.networks.media.name
          - not (nas_proxy_verify_jellyfin.networks.media.external | default(false))
          - nas_proxy_verify_jellyfin.networks.media.ipam.config | map(attribute='subnet') | list == ['172.30.96.0/24']
          - not (nas_proxy_verify_jellyfin.networks.media.internal | default(false))
        fail_msg: "Service traefik inattendu : {{ nas_proxy_verify_traefik }}"

    # Relais du 443 de l'hôte : réseau hôte sans port publié (un 443 déjà pris
    # par le nginx d'UGOS ne fait pas échouer `up`, ni tomber nas-proxy), même
    # image que nas-proxy, durci pareil, sans secret ni certificat.
    - name: Assert the host port 443 relay runs in the host network, hardened and secretless
      vars:
        nas_proxy_verify_model: "{{ nas_proxy_verify_compose.results[0].stdout | from_json }}"
        nas_proxy_verify_forward: "{{ nas_proxy_verify_model.services.forward }}"
      ansible.builtin.assert:
        that:
          - nas_proxy_verify_forward.image == nas_proxy_verify_model.services.traefik.image
          - nas_proxy_verify_forward.container_name == 'nas-proxy-443'
          - nas_proxy_verify_forward.network_mode == 'host'
          - nas_proxy_verify_forward.ports is not defined
          - nas_proxy_verify_forward.networks is not defined
          - nas_proxy_verify_forward.volumes | map(attribute='source') | list == [nas_proxy_verify_path ~ '/config']
          - nas_proxy_verify_forward.volumes | map(attribute='read_only') | list == [true]
          - nas_proxy_verify_forward.cap_drop == ['ALL']
          - nas_proxy_verify_forward.cap_add == ['NET_BIND_SERVICE']
          - nas_proxy_verify_forward.read_only
          - nas_proxy_verify_forward.security_opt == ['no-new-privileges:true']
        fail_msg: "Service forward inattendu : {{ nas_proxy_verify_forward }}"

    - name: Stat the nas_proxy files
      ansible.builtin.stat:
        path: "{{ nas_proxy_verify_path }}/{{ item }}"
      loop:
        - config
        - acme
        - config/traefik.yml
        - config/dynamic.yml
        - config/forward.yml
        - config/forward-dynamic.yml
        - acme/acme.json
      register: nas_proxy_verify_files

    # Tout à root (root dans le conteneur) et fermé : acme.json porte les clés
    # privées des certificats, et Traefik refuse un acme.json qui n'est pas 0600.
    - name: Assert the Traefik files are root-owned and closed
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == ('0700' if item.stat.isdir else '0600')
        fail_msg: "{{ item.item }} : {{ item.stat.pw_name | default('absent') }} {{ item.stat.mode | default('') }}"
        quiet: true
      loop: "{{ nas_proxy_verify_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Migration : l'acme.json de l'ancien Traefik (prepare) repris tel quel,
    # son dossier supprimé.
    - name: Read the taken over ACME storage
      ansible.builtin.slurp:
        path: "{{ nas_proxy_verify_path }}/acme/acme.json"
      register: nas_proxy_verify_acme

    - name: Stat the folder of the old jellyfin Traefik
      ansible.builtin.stat:
        path: "{{ docker_base_path }}/jellyfin/traefik"
      register: nas_proxy_verify_legacy

    - name: Assert the certificates of the old Traefik were taken over
      ansible.builtin.assert:
        that:
          - (nas_proxy_verify_acme.content | b64decode | from_json).letsencrypt.Certificates[0].domain.main == 'media.sylvain.cloud'
          - not nas_proxy_verify_legacy.stat.exists

    - name: Read the Traefik configuration
      ansible.builtin.slurp:
        path: "{{ nas_proxy_verify_path }}/config/{{ item }}"
      loop: [traefik.yml, dynamic.yml, forward.yml, forward-dynamic.yml]
      register: nas_proxy_verify_config

    # Fournisseur fichier seul, DNS-01 OVH, un routeur media.sylvain.cloud vers
    # Jellyfin par le réseau privé, un routeur nas.sylvain.cloud vers le nginx
    # d'UGOS par l'IP LAN de l'hôte, en :8443 et par le relais du 443 de l'hôte.
    - name: Assert Traefik uses files and the OVH DNS-01 challenge
      vars:
        nas_proxy_verify_static: "{{ nas_proxy_verify_config.results[0].content | b64decode | from_yaml }}"
        nas_proxy_verify_dynamic: "{{ nas_proxy_verify_config.results[1].content | b64decode | from_yaml }}"
        nas_proxy_verify_routers: "{{ nas_proxy_verify_dynamic.http.routers }}"
        nas_proxy_verify_services: "{{ nas_proxy_verify_dynamic.http.services }}"
      ansible.builtin.assert:
        that:
          - nas_proxy_verify_static.providers.keys() | list == ['file']
          - nas_proxy_verify_static.entryPoints.websecure.address == ':443'
          - nas_proxy_verify_static.entryPoints['websecure-lan'].address == ':8443'
          - nas_proxy_verify_static.entryPoints.keys() | sort == ['ping', 'websecure', 'websecure-forwarded', 'websecure-lan']
          # L'entrée du relais : en-tête PROXY cru de l'hôte seul (passerelle
          # du réseau media de jellyfin, 172.30.96.0/24).
          - nas_proxy_verify_static.entryPoints['websecure-forwarded'].address == ':8444'
          - nas_proxy_verify_static.entryPoints['websecure-forwarded'].proxyProtocol.trustedIPs == ['172.30.96.1/32']
          - not (nas_proxy_verify_static.entryPoints['websecure-forwarded'].proxyProtocol.insecure | default(false))
          - nas_proxy_verify_static.certificatesResolvers.keys() | list == ['letsencrypt']
          - nas_proxy_verify_static.certificatesResolvers.letsencrypt.acme.dnsChallenge.provider == 'ovh'
          - nas_proxy_verify_static.certificatesResolvers.letsencrypt.acme.storage == '/letsencrypt/acme.json'
          - nas_proxy_verify_static.certificatesResolvers.letsencrypt.acme.email == pangolin_le_email
          - nas_proxy_verify_routers.keys() | sort == ['jellyfin', 'ugos']
          - nas_proxy_verify_routers.values() | map(attribute='tls.certResolver') | unique | list == ['letsencrypt']
          - nas_proxy_verify_routers.jellyfin.rule == 'Host(`media.sylvain.cloud`)'
          - nas_proxy_verify_routers.jellyfin.entryPoints | sort == ['websecure', 'websecure-forwarded', 'websecure-lan']
          - nas_proxy_verify_services.jellyfin.loadBalancer.servers | map(attribute='url') | list == ['http://jellyfin:8096']
          - nas_proxy_verify_routers.ugos.rule == 'Host(`nas.sylvain.cloud`)'
          - nas_proxy_verify_routers.ugos.entryPoints | sort == ['websecure-forwarded', 'websecure-lan']
          # Le Newt du site nas joint aussi le 8443 (ressource media, rôle
          # jellyfin) : l'interface d'UGOS n'admet que le LAN.
          - nas_proxy_verify_routers.ugos.middlewares[0] == 'ugos-lan'
          - nas_proxy_verify_dynamic.http.middlewares['ugos-lan'].ipAllowList.sourceRange == ['192.168.1.0/24']
          - nas_proxy_verify_services.ugos.loadBalancer.servers | map(attribute='url') | list == ['http://' ~ ansible_host ~ ':9999']
          # Log d'accès des erreurs seules, sur stdout, sans en-têtes ni
          # paramètres de requête (api_key de Jellyfin, token d'UGOS).
          - nas_proxy_verify_static.accessLog.filePath is not defined
          - nas_proxy_verify_static.accessLog.filters.statusCodes == ['400-599']
          - nas_proxy_verify_static.accessLog.fields.headers.defaultMode == 'drop'
          - nas_proxy_verify_static.accessLog.fields.headers.names is not defined
          - nas_proxy_verify_static.accessLog.fields.queryParameters.defaultMode == 'drop'
          - not (nas_proxy_verify_static.accessLog.addInternals | default(false))
        fail_msg: "Configuration Traefik inattendue"

    # --- Échéance des certificats (nas-proxy-cert-check.timer) ---
    - name: Stat the certificate expiry check files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ nas_proxy_verify_path }}/cert_check.py"
        - "{{ nas_proxy_verify_path }}/cert_check.env"
      register: nas_proxy_verify_check_files

    # Le fichier d'environnement porte l'URL push (jeton du moniteur).
    - name: Assert the check script and its push URL are root-only
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == ('0700' if item.item.endswith('.py') else '0600')
        fail_msg: "{{ item.item }} : {{ item.stat.pw_name | default('absent') }} {{ item.stat.mode | default('') }}"
        quiet: true
      loop: "{{ nas_proxy_verify_check_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify the certificate expiry check units
      ansible.builtin.command: systemd-analyze verify nas-proxy-cert-check.service nas-proxy-cert-check.timer
      register: nas_proxy_verify_check_analyze
      changed_when: false
      failed_when: >-
        nas_proxy_verify_check_analyze.rc != 0
        or (nas_proxy_verify_check_analyze.stderr_lines | select('search', 'nas-proxy-cert-check') | list | length > 0)

    - name: Read the certificate expiry check timer
      ansible.builtin.systemd:
        name: nas-proxy-cert-check.timer
      register: nas_proxy_verify_timer

    - name: Read the certificate expiry check service
      ansible.builtin.systemd:
        name: nas-proxy-cert-check.service
      register: nas_proxy_verify_check_unit

    # Les deux noms du NAS sur le port publié, le seuil des defaults, l'URL
    # par le fichier d'environnement seul (jamais sur la ligne de commande).
    - name: Assert the check runs daily against both names of the NAS
      vars:
        nas_proxy_verify_exec: "{{ nas_proxy_verify_check_unit.status.ExecStart }}"
      ansible.builtin.assert:
        that:
          - nas_proxy_verify_timer.status.UnitFileState == 'enabled'
          - nas_proxy_verify_timer.status.ActiveState == 'active'
          - "'--port 8443 ' in nas_proxy_verify_exec"
          - "'--min-days 14 ' in nas_proxy_verify_exec"
          - "'media.sylvain.cloud nas.sylvain.cloud' in nas_proxy_verify_exec"
          - "'molecule-cert' not in nas_proxy_verify_exec"
          - nas_proxy_verify_check_unit.status.EnvironmentFiles is search(nas_proxy_verify_path ~ '/cert_check.env')
          - nas_proxy_verify_check_unit.status.NoNewPrivileges == 'yes'
          - nas_proxy_verify_check_unit.status.ProtectSystem == 'strict'
        fail_msg: "{{ nas_proxy_verify_exec }}"

    # Une AC de test dans le magasin du système, que lit le script comme il lit
    # celui d'UGOS sur le NAS.
    - name: Create the test TLS folder
      ansible.builtin.file:
        path: "{{ nas_proxy_verify_tls_dir }}"
        state: directory
        mode: "0700"

    - name: Create the test certificate authority
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - ec
          - -pkeyopt
          - ec_paramgen_curve:P-256
          - -nodes
          - -keyout
          - "{{ nas_proxy_verify_tls_dir }}/ca.key"
          - -out
          - "{{ nas_proxy_verify_tls_dir }}/ca.pem"
          - -days
          - "365"
          - -subj
          - /CN=molecule-ca
          - -addext
          - basicConstraints=critical,CA:TRUE
          - -addext
          - keyUsage=critical,keyCertSign,cRLSign
        creates: "{{ nas_proxy_verify_tls_dir }}/ca.pem"

    - name: Trust the test certificate authority system-wide
      ansible.builtin.copy:
        src: "{{ nas_proxy_verify_tls_dir }}/ca.pem"
        dest: /usr/local/share/ca-certificates/molecule-ca.crt
        remote_src: true
        mode: "0644" # NOSONAR

    - name: Update the system certificate store
      ansible.builtin.command: update-ca-certificates
      changed_when: true

    # Faux Uptime Kuma : http.server rend 200 sur le chemin du moniteur et
    # journalise chaque requête, query string comprise.
    - name: Create the fake Uptime Kuma push folder
      ansible.builtin.file:
        path: "{{ nas_proxy_verify_tls_dir }}/push/api/push"
        state: directory
        mode: "0700"

    - name: Create the fake Uptime Kuma push path
      ansible.builtin.copy:
        dest: "{{ nas_proxy_verify_tls_dir }}/push/api/push/molecule-cert"
        content: "{\"ok\":true}\n"
        mode: "0600"

    - name: Start the fake Uptime Kuma
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit=molecule-push
          - --collect
          - python3
          - -I
          - -m
          - http.server
          - "18080"
          - --bind
          - 127.0.0.1
          - --directory
          - "{{ nas_proxy_verify_tls_dir }}/push"
      changed_when: true

    - name: Wait for the fake Uptime Kuma to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 18080
        timeout: 30

    # Un certificat frais : up, avec les jours restants de chaque nom ; puis
    # un certificat à 5 jours, sous le seuil : l'unité échoue et pousse down.
    - name: Check a fresh certificate
      ansible.builtin.include_tasks: tasks/cert_check_case.yml
      vars:
        cert_check_case_days: 60
        cert_check_case_status: up
        cert_check_case_index: 1

    - name: Check a certificate close to expiry
      ansible.builtin.include_tasks: tasks/cert_check_case.yml
      vars:
        cert_check_case_days: 5
        cert_check_case_status: down
        cert_check_case_index: 2

    - name: Stop the fake Uptime Kuma
      ansible.builtin.systemd:
        name: molecule-push.service
        state: stopped

    # Le relais : le 443 de l'hôte en TCP brut, tout vers l'entrée
    # websecure-forwarded de nas-proxy (IP fixe sur le réseau media), en
    # PROXY protocol v2.
    - name: Assert the relay forwards the host port 443 to nas-proxy with the PROXY protocol
      vars:
        nas_proxy_verify_fwd_static: "{{ nas_proxy_verify_config.results[2].content | b64decode | from_yaml }}"
        nas_proxy_verify_fwd_dynamic: "{{ nas_proxy_verify_config.results[3].content | b64decode | from_yaml }}"
        nas_proxy_verify_fwd_service: "{{ nas_proxy_verify_fwd_dynamic.tcp.services['nas-proxy'].loadBalancer }}"
      ansible.builtin.assert:
        that:
          - nas_proxy_verify_fwd_static.entryPoints.keys() | list == ['https']
          - nas_proxy_verify_fwd_static.entryPoints.https.address == ':443'
          - nas_proxy_verify_fwd_static.providers.file.filename == '/etc/traefik/forward-dynamic.yml'
          - nas_proxy_verify_fwd_static.certificatesResolvers is not defined
          - nas_proxy_verify_fwd_dynamic.http is not defined
          - nas_proxy_verify_fwd_dynamic.tcp.routers['nas-proxy'].rule == 'HostSNI(`*`)'
          - nas_proxy_verify_fwd_dynamic.tcp.routers['nas-proxy'].tls is not defined
          - nas_proxy_verify_fwd_service.servers | map(attribute='address') | list == ['172.30.96.10:8444']
          - nas_proxy_verify_fwd_dynamic.tcp.serversTransports[nas_proxy_verify_fwd_service.serversTransport].proxyProtocol.version == 2
        fail_msg: "Configuration du relais inattendue"

    # La vérification du 443 de l'hôte (tasks/host_https_port.yml) : passée à
    # la converge (rien n'y écoute, dc@ ne lance aucun conteneur ici), elle
    # doit échouer quand autre chose le tient, comme le nginx d'UGOS.
    - name: Hold the host port 443 with something else than the relay
      ansible.builtin.command:
        argv: [python3, -m, http.server, "443", --bind, 127.0.0.1]
      async: 120
      poll: 0
      changed_when: false

    - name: Wait for the port 443 listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        timeout: 30

    - name: Run the host port 443 check against that listener
      block:
        - name: Run the host port 443 check of nas_proxy
          ansible.builtin.include_role:
            name: nas_proxy
            tasks_from: host_https_port.yml

        - name: Fail, the check let a foreign listener on 443 through
          ansible.builtin.fail:
            msg: "host_https_port.yml n'a pas vu le serveur python sur le 443"
      rescue:
        - name: Assert the check failed on the foreign listener
          ansible.builtin.assert:
            that:
              - ansible_failed_task.name is search('Assert nothing but the relay')
              - ansible_failed_result.msg is search('python3')
      always:
        - name: Stop the port 443 listener
          ansible.builtin.command:
            argv: [pkill, -f, "http.server 443"]
          changed_when: false

---
- name: NAS prepare
  ansible.builtin.import_playbook: ../nas/prepare.yml

# Ce que laissait l'ancien Traefik du compose de jellyfin : son acme.json,
# que nas_proxy reprend, puis le dossier qu'il supprime.
- name: Leave the ACME storage of the old jellyfin Traefik
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Create the folders of the old jellyfin Traefik
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - /volume1/docker/jellyfin
        - /volume1/docker/jellyfin/traefik
        - /volume1/docker/jellyfin/traefik/acme

    - name: Write the ACME storage of the old jellyfin Traefik
      ansible.builtin.copy:
        dest: /volume1/docker/jellyfin/traefik/acme/acme.json
        content: '{"letsencrypt": {"Account": null, "Certificates": [{"domain": {"main": "media.sylvain.cloud"}}]}}'
        owner: root
        group: root
        mode: "0600"

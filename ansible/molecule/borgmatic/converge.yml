---
# Comme dans flip.yml (et docker.yml, pangolin.yaml, pi.yml) : le rôle sans
# become au niveau du playbook, chaque tâche le demande elle-même.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/flip/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: borgmatic

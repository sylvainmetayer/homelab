---
- name: Verify
  hosts: all
  vars_files:
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
    - ../../roles/borgmatic/defaults/main.yml
  tasks:
    # --- binaires ---

    - name: Run borgmatic installed by pipx
      become: true
      ansible.builtin.command: /root/.local/bin/borgmatic --version
      register: borgmatic_version
      changed_when: false

    - name: Stat the borg binary
      become: true
      ansible.builtin.stat:
        path: /root/.local/bin/borg
      register: borgmatic_borg

    - name: Assert the borg binary is root's and executable
      ansible.builtin.assert:
        that:
          - borgmatic_borg.stat.exists
          - borgmatic_borg.stat.mode == '0700'
          - borgmatic_borg.stat.pw_name == 'root'

    # Binaire PyInstaller « onefile » : il s'extrait dans TMPDIR avant de
    # s'exécuter, et le /tmp du conteneur est un tmpfs noexec (Docker).
    - name: Run the borg binary
      become: true
      ansible.builtin.command: /root/.local/bin/borg --version
      environment:
        TMPDIR: /var/tmp
      register: borgmatic_borg_version_output
      changed_when: false

    # La Storage Box Hetzner ne parle que borg 1.x : la version téléchargée
    # doit être celle des defaults, pour l'architecture de l'hôte.
    - name: Assert borg is the pinned 1.x release
      ansible.builtin.assert:
        that:
          - borgmatic_borg_version_output.stdout == 'borg ' ~ borgmatic_borg_version
          - borgmatic_borg_version is match('1\\.')
        fail_msg: "borg --version : {{ borgmatic_borg_version_output.stdout }} (attendu {{ borgmatic_borg_version }})"

    - name: Assert the database dump clients are installed
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      register: borgmatic_dump_clients
      failed_when: not borgmatic_dump_clients.stat.exists
      loop:
        - /usr/bin/pg_dump
        - /usr/bin/mariadb-dump
        - /usr/bin/sqlite3

    # borgmatic 2.1 passe --result-file au client MySQL/MariaDB ; l'enrobage
    # le retire et écrit la sortie du client du conteneur dans ce fichier.
    - name: Stat the MySQL/MariaDB dump wrapper and the SQLite staging directory
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      register: borgmatic_dump_helpers
      loop:
        - /usr/local/bin/borgmatic-docker-dump
        - /var/lib/borgmatic-sqlite

    - name: Assert the wrapper and the staging directory are private to root
      ansible.builtin.assert:
        that:
          - borgmatic_dump_helpers.results[0].stat.exists
          - borgmatic_dump_helpers.results[0].stat.executable
          - borgmatic_dump_helpers.results[0].stat.mode == '0700'
          - borgmatic_dump_helpers.results[1].stat.isdir
          - borgmatic_dump_helpers.results[1].stat.mode == '0700'
          - borgmatic_dump_helpers.results[1].stat.pw_name == 'root'

    # Le --result-file est retiré des arguments transmis au conteneur, et la
    # sortie du client arrive dans ce fichier, côté hôte.
    - name: Run the dump wrapper against a stand-in docker
      become: true
      ansible.builtin.shell:
        cmd: |
          set -eu
          # Pas sous /tmp, monté noexec dans le conteneur de test : le shell
          # y ignorerait le faux docker et lancerait le vrai.
          d=$(mktemp -d -p /root)
          # Le faux docker affiche ses arguments, puis ce que le client lirait
          # sur son entrée standard, puis ce qu'il voit de MYSQL_PWD.
          printf '#!/bin/sh\necho "$@"\n[ -t 0 ] || cat\necho "env=${MYSQL_PWD:-}"\n' > "$d/docker"
          chmod 0700 "$d/docker"
          MYSQL_PWD='dump"pass\word #1' PATH="$d:$PATH" /usr/local/bin/borgmatic-docker-dump db_container mariadb-dump --databases app --result-file "$d/out"
          cat "$d/out"
          echo ---
          PATH="$d:$PATH" /usr/local/bin/borgmatic-docker-dump db_container mariadb-dump --databases app </dev/null
          rm -rf "$d"
      register: borgmatic_wrapper_run
      changed_when: false

    # Le mot de passe passe par un fichier d'options sur l'entrée standard,
    # jamais par MYSQL_PWD : le client MariaDB n'y voit pas de mot de passe,
    # avertit « insecure passwordless login » et ne vérifie plus le certificat
    # TLS du serveur. « \ » et « " » échappés, la valeur entre guillemets.
    - name: Assert the wrapper runs the client in the container and writes its output on the host
      ansible.builtin.assert:
        that:
          - borgmatic_wrapper_run.stdout_lines == expected
        fail_msg: "Sortie de l'enrobage : {{ borgmatic_wrapper_run.stdout_lines }}"
      vars:
        expected:
          - exec -i db_container mariadb-dump --defaults-extra-file=/dev/stdin --databases app
          - "[client]"
          - 'password="dump\"pass\\word #1"'
          - env=
          - "---"
          - exec db_container mariadb-dump --databases app
          - env=

    # --- copie des bases SQLite (hook before de app.yaml.j2) ---

    # Le gabarit des applications, rendu pour une base en journal (copiée par
    # « .backup ») et une base en WAL (par « VACUUM INTO »), puis son hook
    # exécuté pour de bon avec le sqlite3 que le rôle installe.
    - name: Create a rollback-journal and a WAL SQLite database
      become: true
      ansible.builtin.shell:
        cmd: |
          set -eu
          install -d -m 0700 /root/sqlite-hook-test {{ borgmatic_sqlite_staging_dir }}/sqlite_hook_test
          cd /root/sqlite-hook-test
          rm -f journal.db wal.db
          sqlite3 journal.db "CREATE TABLE t (v TEXT); INSERT INTO t VALUES ('journal');"
          sqlite3 wal.db "PRAGMA journal_mode = WAL; CREATE TABLE t (v TEXT); INSERT INTO t VALUES ('wal');" >/dev/null
      changed_when: false

    - name: Render the application template for the two databases
      become: true
      diff: false
      ansible.builtin.template:
        src: ../../roles/borgmatic/templates/app.yaml.j2
        dest: /root/sqlite-hook-test/app.yaml
        owner: root
        group: root
        mode: "0600"
      vars:
        borgmatic_app_name: sqlite_hook_test
        borgmatic_app_source_directories: []
        borgmatic_app_target: ssh://test@localhost/./sqlite_hook_test
        borgmatic_app_passphrase: "{{ backup_passphrase }}"
        borgmatic_app_sqlite_paths:
          - /root/sqlite-hook-test/journal.db
          - /root/sqlite-hook-test/wal.db

    - name: Read the rendered application template
      become: true
      ansible.builtin.slurp:
        src: /root/sqlite-hook-test/app.yaml
      register: borgmatic_sqlite_hook_raw

    - name: Parse the rendered application template
      ansible.builtin.set_fact:
        borgmatic_sqlite_hook: "{{ borgmatic_sqlite_hook_raw.content | b64decode | from_yaml }}"

    - name: Run the before hook of the rendered template
      become: true
      ansible.builtin.shell:
        cmd: |
          set -eu
          {{ borgmatic_sqlite_hook.commands[0].run | join(' ; ') }}
          cd {{ borgmatic_sqlite_staging_dir }}/sqlite_hook_test
          for db in root_sqlite-hook-test_journal.db root_sqlite-hook-test_wal.db; do
            printf '%s %s %s %s\n' "$db" "$(sqlite3 "$db" 'PRAGMA integrity_check;')" \
              "$(sqlite3 "$db" 'SELECT v FROM t;')" "$(sqlite3 "$db" 'PRAGMA journal_mode;')"
          done
          find . -mindepth 1 -delete
      register: borgmatic_sqlite_hook_run
      changed_when: false

    # « .backup » d'une base en WAL donnerait une copie en WAL : la copie en
    # journal de wal.db prouve qu'elle est passée par « VACUUM INTO ».
    - name: Assert both databases are copied whole, each by its own method
      ansible.builtin.assert:
        that:
          - borgmatic_sqlite_hook_run.stdout_lines[-2:] == [
              'root_sqlite-hook-test_journal.db ok journal delete',
              'root_sqlite-hook-test_wal.db ok wal delete']
          - borgmatic_sqlite_hook.commands[0].run
            | select('search', "VACUUM INTO .*/var/lib/borgmatic-sqlite/sqlite_hook_test/root_sqlite-hook-test_wal\\.db")
            | select('search', '\\.backup /var/lib/borgmatic-sqlite/sqlite_hook_test/root_sqlite-hook-test_wal\\.db')
            | list | length == 1
        fail_msg: "Hook SQLite : {{ borgmatic_sqlite_hook_run.stdout_lines }}"

    # --- unités systemd ---

    - name: Read the state of the borgmatic timer
      ansible.builtin.systemd:
        name: borgmatic.timer
      register: borgmatic_timer

    - name: Assert the borgmatic timer is enabled and running
      ansible.builtin.assert:
        that:
          - borgmatic_timer.status.UnitFileState == 'enabled'
          - borgmatic_timer.status.ActiveState == 'active'
        fail_msg: "borgmatic.timer : {{ borgmatic_timer.status.UnitFileState }} / {{ borgmatic_timer.status.ActiveState }}"

    - name: Read the borgmatic units
      become: true
      ansible.builtin.slurp:
        src: "/etc/systemd/system/{{ item }}"
      register: borgmatic_units
      loop:
        - borgmatic.service
        - borgmatic.timer

    - name: Assert the units run the pipx borgmatic as root
      ansible.builtin.assert:
        that:
          - "'\nExecStart=/root/.local/bin/borgmatic ' in (borgmatic_units.results[0].content | b64decode)"
          - "'\nUser=root\n' in (borgmatic_units.results[0].content | b64decode)"

    # Sans secret, lisibles par tous : fermées à "others", systemd journalise
    # « marked world-inaccessible » à chaque daemon-reload.
    - name: Stat the borgmatic units
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}"
      register: borgmatic_unit_stats
      loop:
        - borgmatic.service
        - borgmatic.timer

    - name: Assert the borgmatic units are world-readable
      ansible.builtin.assert:
        that:
          - item.stat.mode == '0644'
        fail_msg: "{{ item.item }} : {{ item.stat.mode }}"
      loop: "{{ borgmatic_unit_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- accès à la Storage Box ---

    - name: Stat the Storage Box SSH files
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      register: borgmatic_ssh_files
      loop:
        - "{{ backup_storage_box_ssh_key_path }}"
        - /root/.ssh/config

    - name: Assert the Storage Box SSH files are private to root
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
          - item.stat.pw_name == 'root'
        fail_msg: "{{ item.item }} : {{ item.stat.mode | default('absent') }}"
      loop: "{{ borgmatic_ssh_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the Storage Box SSH files
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: borgmatic_ssh_content
      loop:
        - "{{ backup_storage_box_ssh_key_path }}.pub"
        - /root/.ssh/config
        - /root/.ssh/known_hosts

    # Clé propre à l'hôte, générée sur place ; config et known_hosts visent le
    # sous-compte de l'hôte (host_vars/flip), plus le compte principal.
    - name: Assert the SSH key, config and known host target the subaccount
      vars:
        borgmatic_ssh_config: "{{ borgmatic_ssh_content.results[1].content | b64decode }}"
        borgmatic_known_hosts: "{{ borgmatic_ssh_content.results[2].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - (borgmatic_ssh_content.results[0].content | b64decode) is match('ssh-ed25519 \\S+ borgmatic@')
          - ('HostName ' ~ backup_storage_box_subaccounts.flip.server) in borgmatic_ssh_config
          - ('User ' ~ backup_storage_box_subaccounts.flip.username) in borgmatic_ssh_config
          - "'Port 23' in borgmatic_ssh_config"
          - ('IdentityFile ' ~ backup_storage_box_ssh_key_path) in borgmatic_ssh_config
          - ('[' ~ backup_storage_box_subaccounts.flip.server ~ ']:23 ' ~ backup_storage_box_host_key) in borgmatic_known_hosts

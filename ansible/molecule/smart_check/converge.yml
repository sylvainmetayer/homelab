---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    # En root sans become, comme sur l'hôte : ces variables de play
    # l'emportent sur l'ansible_user de l'inventaire Molecule.
    - ../../host_vars/pve/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # pve.yml la lit dans le state de pangolin_config : ici le faux Uptime
    # Kuma du verify.
    - name: Set the push URL as pve.yml does
      no_log: true
      ansible.builtin.set_fact:
        smart_check_healthcheck_url: http://127.0.0.1:18081/api/push/molecule-smart # NOSONAR

    # Hors de /root et de /home : l'unité a ProtectHome=yes.
    - name: Create the folder of the fake smartctl
      ansible.builtin.file:
        path: /opt/molecule-smart-check/bin
        state: directory
        mode: "0755"

    - name: Install the fake smartctl
      ansible.builtin.copy:
        src: files/smartctl
        dest: /opt/molecule-smart-check/bin/smartctl
        mode: "0755"

  roles:
    # Comme pve.yml et pi.yml (un SSD SATA, un NVMe derrière un pont), ntfy
    # remplacé par le faux du verify, smartctl par le faux.
    - role: smart_check
      vars:
        smart_check_host_label: pve
        smart_check_ntfy_url: http://127.0.0.1:18081 # NOSONAR
        smart_check_install_smartmontools: false
        smart_check_smartctl: /opt/molecule-smart-check/bin/smartctl
        smart_check_devices:
          - { path: /dev/sda }
          - { path: /dev/nvme0, type: sntrealtek }

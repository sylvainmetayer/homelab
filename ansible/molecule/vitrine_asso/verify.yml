---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    # Site statique : aucune configuration borgmatic, exprès.
    - name: Verify the vitrine_asso deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: vitrine_asso
        verify_app_borgmatic_config: ""

    - name: Verify the vitrine_asso healthcheck
      ansible.builtin.include_tasks: ../_shared/tasks/verify_compose_services.yml
      vars:
        verify_compose_service: vitrine_asso
        verify_compose_healthchecks:
          - app

    # Paquet GHCR privé : l'identifiant ne sert qu'à dc@vitrine_asso.
    - name: Stat the registry config of vitrine_asso
      ansible.builtin.stat:
        path: "{{ docker_base_path }}/vitrine_asso/.docker/config.json"
      register: vitrine_asso_verify_registry

    - name: Read the environment of dc@vitrine_asso
      ansible.builtin.systemd:
        name: dc@vitrine_asso
        scope: user
      register: vitrine_asso_verify_unit

    - name: Assert dc@vitrine_asso reads its own GHCR credentials
      ansible.builtin.assert:
        that:
          - vitrine_asso_verify_registry.stat.mode == '0600'
          - vitrine_asso_verify_unit.status.Environment == 'DOCKER_CONFIG=' ~ docker_base_path ~ '/vitrine_asso/.docker'

---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  pre_tasks:
    # victoria_logs_ui_password et ntfy_scripts_token.
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml
  roles:
    # Tout vers files/fake_api.py. Ni premier lancement ni horaire proche : le
    # verify lance l'unité lui-même, sans course avec le timer. Pas d'attente
    # entre deux essais.
    - role: ci_key_audit
      vars:
        ci_key_audit_push_url: http://127.0.0.1:18083/api/push/molecule-ci-key-audit # NOSONAR
        ci_key_audit_vl_url: http://127.0.0.1:18083 # NOSONAR
        ci_key_audit_github_api: http://127.0.0.1:18083 # NOSONAR
        ci_key_audit_ntfy_url: http://127.0.0.1:18083 # NOSONAR
        ci_key_audit_first_run_delay: 1d
        ci_key_audit_schedule: "2099-01-01"
        ci_key_audit_retry_delays: [0]

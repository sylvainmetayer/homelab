---
- name: Verify
  hosts: all
  vars_files:
    - ../../roles/pangolin/defaults/main.yml
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pangolin/variables.yaml
  tasks:
    # --- la pile ---

    - name: Read the state of pangolin.service
      ansible.builtin.systemd:
        name: pangolin
      register: pangolin_unit

    # Démarrée = son ExecStartPre (docker compose config, cf. prepare.yml) a
    # validé le compose templaté.
    - name: Assert pangolin.service is enabled and started
      ansible.builtin.assert:
        that:
          - pangolin_unit.status.UnitFileState == 'enabled'
          - pangolin_unit.status.ActiveState == 'active'
        fail_msg: "pangolin : {{ pangolin_unit.status.UnitFileState }} / {{ pangolin_unit.status.ActiveState }}"

    - name: Stat the compose file of Pangolin
      become: true
      ansible.builtin.stat:
        path: "{{ pangolin_dir }}/compose.yaml"
      register: pangolin_compose_stat

    # Même règle que les applications dc@ : 0600, ici à root qui lance la pile.
    - name: Assert the compose file of Pangolin is private
      ansible.builtin.assert:
        that:
          - pangolin_compose_stat.stat.exists
          - pangolin_compose_stat.stat.pw_name == 'root'
          - pangolin_compose_stat.stat.mode == '0600'
        fail_msg: "{{ pangolin_dir }}/compose.yaml : {{ pangolin_compose_stat.stat.mode | default('absent') }}"

    - name: Render the compose model of Pangolin
      become: true
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: "{{ pangolin_dir }}"
      register: pangolin_compose_raw
      changed_when: false

    - name: Assert Traefik shares Gerbil's network namespace
      vars:
        pangolin_compose: "{{ pangolin_compose_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - pangolin_compose.name == 'pangolin'
          - pangolin_compose.services.keys() | sort == ['gerbil', 'pangolin', 'traefik']
          - pangolin_compose.services.traefik.network_mode == 'service:gerbil'

    # Contenu du fichier lui-même : le drop-in de prepare.yml remplace
    # ExecStart*, ExecStop, ExecReload et Restart à l'exécution.
    - name: Read the pangolin.service unit file
      become: true
      ansible.builtin.slurp:
        src: /etc/systemd/system/pangolin.service
      register: pangolin_unit_raw

    - name: Assert pangolin.service survives a registry outage and transient failures
      vars:
        pangolin_unit_lines: "{{ (pangolin_unit_raw.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - pangolin_unit_lines | select('match', 'ExecStartPre=.*compose pull') | list | length == 0
          - "'ExecStart=/usr/bin/docker compose up -d --pull missing --remove-orphans' in pangolin_unit_lines"
          - "'Restart=on-failure' in pangolin_unit_lines"
          - "'StartLimitIntervalSec=0' in pangolin_unit_lines"
          - "'Wants=docker.service' in pangolin_unit_lines"
          - "'Requires=docker.service' not in pangolin_unit_lines"
          - "'ExecStop=/usr/bin/docker compose down' in pangolin_unit_lines"
          - ('WorkingDirectory=' ~ pangolin_dir) in pangolin_unit_lines
        fail_msg: /etc/systemd/system/pangolin.service inattendu

    # --- configuration Pangolin (porte le secret serveur) ---

    - name: Stat the Pangolin configuration
      become: true
      ansible.builtin.stat:
        path: "{{ pangolin_dir }}/config/config.yml"
      register: pangolin_config_stat

    - name: Assert the Pangolin configuration is private to root
      ansible.builtin.assert:
        that:
          - pangolin_config_stat.stat.exists
          - pangolin_config_stat.stat.mode == '0600'
          - pangolin_config_stat.stat.pw_name == 'root'

    - name: Read the Pangolin configuration
      become: true
      ansible.builtin.slurp:
        src: "{{ pangolin_dir }}/config/config.yml"
      register: pangolin_config_raw

    - name: Assert the Pangolin configuration comes from host_vars and secrets
      vars:
        pangolin_config: "{{ pangolin_config_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - pangolin_config.server.secret == pangolin_server_secret
          - pangolin_config.app.dashboard_url == 'https://' ~ pangolin_dashboard_url
          - pangolin_config.domains.domain1.base_domain == pangolin_base_domain
          - pangolin_config.email.smtp_user == pangolin_smtp_user
          - pangolin_config.email.smtp_pass == pangolin_smtp_pass
          - pangolin_config.server.maxmind_db_path == './config/GeoLite2-Country.mmdb'
          - pangolin_config.flags.disable_signup_without_invite
          - pangolin_config.server.dashboard_session_length_hours == 336
          - pangolin_config.server.resource_session_length_hours == 336

    # --- WireGuard : chargé par l'hôte, plus par gerbil ---

    - name: Read the wireguard boot configuration and the compose file
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: pangolin_wireguard
      loop:
        - /etc/modules-load.d/wireguard.conf
        - "{{ pangolin_dir }}/compose.yaml"

    - name: Assert the host loads wireguard and gerbil cannot load modules
      vars:
        gerbil: "{{ (pangolin_wireguard.results[1].content | b64decode | from_yaml).services.gerbil }}"
      ansible.builtin.assert:
        that:
          - (pangolin_wireguard.results[0].content | b64decode) == 'wireguard\n'
          - gerbil.cap_add == ['NET_ADMIN']

    # --- GeoLite2 : mise à jour hebdomadaire par geoipupdate ---

    - name: Read the state of geoipupdate.timer
      become: true
      ansible.builtin.systemd:
        name: geoipupdate.timer
      register: pangolin_geoip_timer

    - name: Read the geoipupdate unit and its credentials
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: pangolin_geoip_files
      loop:
        - /etc/systemd/system/geoipupdate.service
        - /etc/geoipupdate/env
        - /etc/geoipupdate/license_key

    - name: Stat the MaxMind license key
      become: true
      ansible.builtin.stat:
        path: /etc/geoipupdate/license_key
      register: pangolin_geoip_license

    - name: Assert GeoLite2 is kept up to date by the pinned geoipupdate
      vars:
        geoip_unit: "{{ pangolin_geoip_files.results[0].content | b64decode }}"
        geoip_env: "{{ pangolin_geoip_files.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - pangolin_geoip_timer.status.ActiveState == 'active'
          - pangolin_geoip_timer.status.UnitFileState == 'enabled'
          - geoip_unit is search('ghcr\\.io/maxmind/geoipupdate:v[0-9.]+@sha256:[a-f0-9]{64}')
          - "'https://uptime.example.invalid/api/push/pangolin_geoip' in geoip_unit"
          - "'docker restart pangolin' in geoip_unit"
          - ('GEOIPUPDATE_ACCOUNT_ID=' ~ pangolin_maxmind_account_id) in geoip_env
          - "'GEOIPUPDATE_EDITION_IDS=GeoLite2-Country' in geoip_env"
          - (pangolin_geoip_files.results[2].content | b64decode | trim) == pangolin_maxmind_license_key
          - pangolin_geoip_license.stat.mode == '0600'

    # --- Traefik ---

    - name: Read the Traefik configurations
      become: true
      ansible.builtin.slurp:
        src: "{{ pangolin_dir }}/config/traefik/{{ item }}"
      register: pangolin_traefik
      loop:
        - traefik_config.yml
        - dynamic_config.yml

    - name: Assert Traefik routes the dashboard and the integration API
      vars:
        traefik_config: "{{ pangolin_traefik.results[0].content | b64decode | from_yaml }}"
        dynamic_config: "{{ pangolin_traefik.results[1].content | b64decode | from_yaml }}"
        memoire_epsi_pdf: https://github.com/sylvainmetayer/epsi-memoire/releases/download/v1.1.1/M19_SYLVAINMETAYER.pdf
      ansible.builtin.assert:
        that:
          - traefik_config.certificatesResolvers.letsencrypt.acme.email == pangolin_le_email
          # Ni API ni dashboard Traefik (api.insecure les servait sur :8080).
          - "'api' not in traefik_config"
          # Plus aucune cible HTTPS (Proxmox est privé) : certificats des cibles vérifiés.
          - "'serversTransport' not in traefik_config"
          - dynamic_config.http.routers['next-router'].rule is search('Host\(`' ~ (pangolin_dashboard_url | regex_escape) ~ '`\)')
          - dynamic_config.http.routers['int-api-router'].rule == 'Host(`' ~ pangolin_api_url ~ '`)'
          # API d'intégration réservée aux IP autorisées.
          - dynamic_config.http.routers['int-api-router'].middlewares == ['int-api-allowlist']
          - dynamic_config.http.middlewares['int-api-allowlist'].ipAllowList.sourceRange == pangolin_api_allowed_ips.split(',')
          # Redirection vers un fichier : chemin ignoré, 302 (host_vars, keep_path / permanent)
          - dynamic_config.http.middlewares['redirect-memoire-epsi'].redirectRegex.replacement == memoire_epsi_pdf
          - not dynamic_config.http.middlewares['redirect-memoire-epsi'].redirectRegex.permanent
          - dynamic_config.http.middlewares['redirect-sylvain-dev-apex'].redirectRegex.replacement == 'https://www.sylvain.dev${1}'
          - dynamic_config.http.middlewares['redirect-sylvain-dev-apex'].redirectRegex.permanent
          - dynamic_config.http.routers['redirect-memoire-epsi'].rule == 'Host(`memoire.epsi.sylvainmetayer.fr`)'

    # --- borgmatic ---

    - name: Verify the borgmatic configuration of Pangolin
      become: true
      ansible.builtin.command: "{{ molecule_borgmatic_bin }} config validate --config {{ borgmatic_config_dir }}/pangolin.yaml"
      changed_when: false

    - name: Stat the borgmatic configuration of Pangolin
      become: true
      ansible.builtin.stat:
        path: "{{ borgmatic_config_dir }}/pangolin.yaml"
      register: pangolin_borgmatic_stat

    - name: Read the borgmatic configuration of Pangolin
      become: true
      ansible.builtin.slurp:
        src: "{{ borgmatic_config_dir }}/pangolin.yaml"
      register: pangolin_borgmatic_raw

    - name: Assert the borgmatic configuration targets the Pangolin repository
      vars:
        borgmatic_config: "{{ pangolin_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - pangolin_borgmatic_stat.stat.mode == '0600'
          - pangolin_borgmatic_stat.stat.pw_name == 'root'
          - borgmatic_config.repositories[0].path == pangolin_backup_borgmatic_target
          - borgmatic_config.source_directories == [pangolin_dir ~ '/compose.yaml', pangolin_dir ~ '/config']
          - borgmatic_config.uptime_kuma.push_url == 'https://uptime.example.invalid/api/push/pangolin_backup'

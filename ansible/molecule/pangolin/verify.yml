---
- name: Verify
  hosts: all
  vars_files:
    - ../../roles/pangolin/defaults/main.yml
    - ../../roles/pangolin/vars/main.yml
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pangolin/variables.yaml
  tasks:
    # --- la pile ---

    - name: Read the state of pangolin.service
      ansible.builtin.systemd:
        name: pangolin
      register: pangolin_unit

    - name: Stat the unit of Pangolin
      ansible.builtin.stat:
        path: /etc/systemd/system/pangolin.service
      register: pangolin_unit_file

    # Démarrée = son ExecStartPre (docker compose config, cf. prepare.yml) a
    # validé le compose templaté.
    - name: Assert pangolin.service is enabled and started
      ansible.builtin.assert:
        that:
          - pangolin_unit.status.UnitFileState == 'enabled'
          - pangolin_unit.status.ActiveState == 'active'
          - pangolin_unit_file.stat.mode == '0644'
        fail_msg: "pangolin : {{ pangolin_unit.status.UnitFileState }} / {{ pangolin_unit.status.ActiveState }}"

    - name: Stat the compose file of Pangolin
      become: true
      ansible.builtin.stat:
        path: "{{ pangolin_dir }}/compose.yaml"
      register: pangolin_compose_stat

    # Même règle que les applications dc@ : 0600, ici à root qui lance la pile.
    - name: Assert the compose file of Pangolin is private
      ansible.builtin.assert:
        that:
          - pangolin_compose_stat.stat.exists
          - pangolin_compose_stat.stat.pw_name == 'root'
          - pangolin_compose_stat.stat.mode == '0600'
        fail_msg: "{{ pangolin_dir }}/compose.yaml : {{ pangolin_compose_stat.stat.mode | default('absent') }}"

    - name: Render the compose model of Pangolin
      become: true
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: "{{ pangolin_dir }}"
      register: pangolin_compose_raw
      changed_when: false

    - name: Assert Traefik shares Gerbil's network namespace
      vars:
        pangolin_compose: "{{ pangolin_compose_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - pangolin_compose.name == 'pangolin'
          - pangolin_compose.services.keys() | sort == ['crowdsec', 'gerbil', 'pangolin', 'traefik']
          - pangolin_compose.services.traefik.network_mode == 'service:gerbil'
          # Un CrowdSec en panne ne doit pas empêcher Traefik de démarrer.
          - "'crowdsec' not in (pangolin_compose.services.traefik.depends_on | default({}))"
          # Plafond mémoire sur chaque service (docs/conventions/resource-limits.md).
          - pangolin_compose.services.values() | rejectattr('mem_limit', 'defined') | list | length == 0

    # Contenu du fichier lui-même : le drop-in de prepare.yml remplace
    # ExecStart*, ExecStop, ExecReload et Restart à l'exécution.
    - name: Read the pangolin.service unit file
      become: true
      ansible.builtin.slurp:
        src: /etc/systemd/system/pangolin.service
      register: pangolin_unit_raw

    - name: Assert pangolin.service survives a registry outage and transient failures
      vars:
        pangolin_unit_lines: "{{ (pangolin_unit_raw.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - pangolin_unit_lines | select('match', 'ExecStartPre=.*compose pull') | list | length == 0
          - "'ExecStart=/usr/bin/docker compose up -d --pull missing --remove-orphans' in pangolin_unit_lines"
          - "'Restart=on-failure' in pangolin_unit_lines"
          - "'StartLimitIntervalSec=0' in pangolin_unit_lines"
          - "'Wants=docker.service' in pangolin_unit_lines"
          - "'Requires=docker.service' not in pangolin_unit_lines"
          - "'ExecStop=/usr/bin/docker compose down' in pangolin_unit_lines"
          - ('WorkingDirectory=' ~ pangolin_dir) in pangolin_unit_lines
        fail_msg: /etc/systemd/system/pangolin.service inattendu

    # --- configuration Pangolin (porte le secret serveur) ---

    - name: Stat the Pangolin configuration
      become: true
      ansible.builtin.stat:
        path: "{{ pangolin_dir }}/config/config.yml"
      register: pangolin_config_stat

    - name: Assert the Pangolin configuration is private to root
      ansible.builtin.assert:
        that:
          - pangolin_config_stat.stat.exists
          - pangolin_config_stat.stat.mode == '0600'
          - pangolin_config_stat.stat.pw_name == 'root'

    - name: Read the Pangolin configuration
      become: true
      ansible.builtin.slurp:
        src: "{{ pangolin_dir }}/config/config.yml"
      register: pangolin_config_raw

    - name: Assert the Pangolin configuration comes from host_vars and secrets
      vars:
        pangolin_config: "{{ pangolin_config_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - pangolin_config.server.secret == pangolin_server_secret
          - pangolin_config.app.dashboard_url == 'https://' ~ pangolin_dashboard_url
          - pangolin_config.domains.domain1.base_domain == pangolin_base_domain
          - pangolin_config.email.smtp_user == pangolin_smtp_user
          - pangolin_config.email.smtp_pass == pangolin_smtp_pass
          - pangolin_config.server.maxmind_db_path == './config/GeoLite2-Country.mmdb'
          - pangolin_config.flags.disable_signup_without_invite
          - pangolin_config.server.dashboard_session_length_hours == 336
          - pangolin_config.server.resource_session_length_hours == 336

    # --- WireGuard : chargé par l'hôte, plus par gerbil ---

    - name: Read the wireguard boot configuration and the compose file
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: pangolin_wireguard
      loop:
        - /etc/modules-load.d/wireguard.conf
        - "{{ pangolin_dir }}/compose.yaml"

    - name: Assert the host loads wireguard and gerbil cannot load modules
      vars:
        gerbil: "{{ (pangolin_wireguard.results[1].content | b64decode | from_yaml).services.gerbil }}"
      ansible.builtin.assert:
        that:
          - (pangolin_wireguard.results[0].content | b64decode) == 'wireguard\n'
          - gerbil.cap_add == ['NET_ADMIN']

    # --- GeoLite2 : mise à jour hebdomadaire par geoipupdate ---

    - name: Read the state of geoipupdate.timer
      become: true
      ansible.builtin.systemd:
        name: geoipupdate.timer
      register: pangolin_geoip_timer

    - name: Read the geoipupdate unit and its credentials
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: pangolin_geoip_files
      loop:
        - /etc/systemd/system/geoipupdate.service
        - /etc/geoipupdate/env
        - /etc/geoipupdate/license_key
        - /etc/geoipupdate/push.curl

    - name: Stat the MaxMind license key, the push URL file and the units
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      register: pangolin_geoip_stats
      loop:
        - /etc/geoipupdate/license_key
        - /etc/geoipupdate/push.curl
        - /etc/systemd/system/geoipupdate.service
        - /etc/systemd/system/geoipupdate.timer

    - name: Assert GeoLite2 is kept up to date by the pinned geoipupdate
      vars:
        geoip_unit: "{{ pangolin_geoip_files.results[0].content | b64decode }}"
        geoip_env: "{{ pangolin_geoip_files.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - pangolin_geoip_timer.status.ActiveState == 'active'
          - pangolin_geoip_timer.status.UnitFileState == 'enabled'
          - geoip_unit is search('ghcr\\.io/maxmind/geoipupdate:v[0-9.]+@sha256:[a-f0-9]{64}')
          # URL push dans un fichier curl, jamais sur la ligne de commande.
          - "'ExecStartPost=/usr/local/bin/uptime-push --strict --agent geoipupdate /etc/geoipupdate/push.curl up' in geoip_unit"
          - "'/api/push/' not in geoip_unit"
          - (pangolin_geoip_files.results[3].content | b64decode) == 'url = "https://uptime.example.invalid/api/push/pangolin_geoip"\n'
          - "'docker restart pangolin' in geoip_unit"
          - ('GEOIPUPDATE_ACCOUNT_ID=' ~ pangolin_maxmind_account_id) in geoip_env
          - "'GEOIPUPDATE_EDITION_IDS=GeoLite2-Country' in geoip_env"
          - (pangolin_geoip_files.results[2].content | b64decode | trim) == pangolin_maxmind_license_key
          - pangolin_geoip_stats.results[0].stat.mode == '0600'
          - pangolin_geoip_stats.results[1].stat.mode == '0600'
          - pangolin_geoip_stats.results[2].stat.mode == '0644'
          - pangolin_geoip_stats.results[3].stat.mode == '0644'

    # --- résumé CrowdSec hebdomadaire sur ntfy ---

    - name: Read the state of crowdsec-summary.timer
      become: true
      ansible.builtin.systemd:
        name: crowdsec-summary.timer
      register: pangolin_summary_timer

    - name: Stat the CrowdSec summary files
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      register: pangolin_summary_stats
      loop:
        - /etc/crowdsec-summary/env
        - /usr/local/bin/crowdsec-summary
        - /var/lib/crowdsec-summary

    - name: Read the CrowdSec summary unit, timer and credentials
      become: true
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: pangolin_summary_files
      loop:
        - /etc/systemd/system/crowdsec-summary.service
        - /etc/systemd/system/crowdsec-summary.timer
        - /etc/crowdsec-summary/env

    - name: Check the CrowdSec summary units
      become: true
      ansible.builtin.command: >-
        systemd-analyze verify
        /etc/systemd/system/crowdsec-summary.service
        /etc/systemd/system/crowdsec-summary.timer
      changed_when: false

    - name: Assert the summary runs each Monday, stateless, its token in a private file only
      vars:
        summary_unit: "{{ pangolin_summary_files.results[0].content | b64decode }}"
        summary_timer: "{{ pangolin_summary_files.results[1].content | b64decode }}"
        summary_env: "{{ (pangolin_summary_files.results[2].content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - pangolin_summary_timer.status.ActiveState == 'active'
          - pangolin_summary_timer.status.UnitFileState == 'enabled'
          - "'OnCalendar=Mon *-*-* 07:30:00' in summary_timer"
          - "'EnvironmentFile=/etc/crowdsec-summary/env' in summary_unit"
          - "'ExecStart=/usr/bin/python3 -I /usr/local/bin/crowdsec-summary' in summary_unit"
          - "'StateDirectory' not in summary_unit"
          - ntfy_scripts_token not in summary_unit
          - summary_env | sort == ['NTFY_TOKEN=' ~ ntfy_scripts_token, 'NTFY_TOPIC=scripts', 'NTFY_URL=https://ntfy.sylvain.cloud/']
          - pangolin_summary_stats.results[0].stat.mode == '0600'
          - pangolin_summary_stats.results[0].stat.pw_name == 'root'
          - pangolin_summary_stats.results[1].stat.mode == '0755'
          - not pangolin_summary_stats.results[2].stat.exists

    - name: Create a scratch directory for the summary runs
      become: true
      ansible.builtin.tempfile:
        state: directory
        suffix: crowdsec-summary
      register: pangolin_summary_tmp

    - name: Install the fake cscli and the fake ntfy runner
      become: true
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ pangolin_summary_tmp.path }}/{{ item }}"
        mode: "0700"
      loop:
        - fake-cscli
        - fake-ntfy-run

    # Correspondances AppSec : priorité haute.
    # Les assistants passent par python3 : rien ne s'exécute depuis /tmp.
    - name: Publish a summary to the fake ntfy
      become: true
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -I
          - "{{ pangolin_summary_tmp.path }}/fake-ntfy-run"
          - /etc/crowdsec-summary/env
          - "/usr/bin/python3 {{ pangolin_summary_tmp.path }}/fake-cscli"
      register: pangolin_summary_run
      changed_when: false

    - name: Assert the summary is sent with the token, high priority on AppSec hits
      vars:
        run: "{{ pangolin_summary_run.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - run.rc == 0
          - run.path == '/'
          - run.authorization == 'Bearer ' ~ ntfy_scripts_token
          - run.body.topic == 'scripts'
          - run.stdout | trim == run.body.title
          - run.body.priority == 4
          - "run.body.title == 'CrowdSec 7 j : 13 alertes, 3 décisions actives, AppSec 2'"
          - "'crowdsecurity/http-probing 12' in run.body.message"
          - "'Pays : US 12, FR 1' in run.body.message"
          - "'Décisions actives : 3' in run.body.message"
        fail_msg: "rc {{ run.rc }}, corps reçu : {{ run.body | default('aucun') }}"

    - name: Dry-run the summary without AppSec hits
      become: true
      ansible.builtin.command: /usr/bin/python3 -I /usr/local/bin/crowdsec-summary --dry-run
      environment:
        CROWDSEC_SUMMARY_CSCLI: "/usr/bin/python3 {{ pangolin_summary_tmp.path }}/fake-cscli"
        NTFY_TOPIC: scripts
        FAKE_CSCLI_NO_APPSEC: "1"
      register: pangolin_summary_quiet
      changed_when: false

    - name: Dry-run the summary with cscli down
      become: true
      ansible.builtin.command: /usr/bin/python3 -I /usr/local/bin/crowdsec-summary --dry-run
      environment:
        CROWDSEC_SUMMARY_CSCLI: "/usr/bin/python3 {{ pangolin_summary_tmp.path }}/fake-cscli"
        NTFY_TOPIC: scripts
        FAKE_CSCLI_FAIL: "1"
      register: pangolin_summary_down
      changed_when: false
      failed_when: pangolin_summary_down.rc != 1

    # Une réponse d'une autre forme qu'une liste : l'échec est publié, pas
    # une trace Python.
    - name: Dry-run the summary with an unexpected cscli answer
      become: true
      ansible.builtin.command: /usr/bin/python3 -I /usr/local/bin/crowdsec-summary --dry-run
      environment:
        CROWDSEC_SUMMARY_CSCLI: "/usr/bin/python3 {{ pangolin_summary_tmp.path }}/fake-cscli"
        NTFY_TOPIC: scripts
        FAKE_CSCLI_BAD: "1"
      register: pangolin_summary_bad
      changed_when: false
      failed_when: pangolin_summary_bad.rc != 1

    - name: Assert a quiet week is low priority, a dead or garbled cscli high
      vars:
        quiet: "{{ pangolin_summary_quiet.stdout | from_json }}"
        down: "{{ pangolin_summary_down.stdout | from_json }}"
        bad: "{{ pangolin_summary_bad.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - quiet.priority == 2
          - "'AppSec' not in quiet.message"
          - down.priority == 4
          - "down.title == 'CrowdSec : résumé impossible'"
          - "'No such container' in down.message"
          - bad.priority == 4
          - "bad.title == 'CrowdSec : résumé impossible'"

    - name: Remove the scratch directory
      become: true
      ansible.builtin.file:
        path: "{{ pangolin_summary_tmp.path }}"
        state: absent

    # --- Traefik ---

    - name: Read the Traefik configurations
      become: true
      ansible.builtin.slurp:
        src: "{{ pangolin_dir }}/config/traefik/{{ item }}"
      register: pangolin_traefik
      loop:
        - traefik_config.yml
        - dynamic_config.yml

    - name: Assert Traefik routes the dashboard and the integration API
      vars:
        traefik_config: "{{ pangolin_traefik.results[0].content | b64decode | from_yaml }}"
        dynamic_config: "{{ pangolin_traefik.results[1].content | b64decode | from_yaml }}"
        memoire_epsi_pdf: https://github.com/sylvainmetayer/epsi-memoire/releases/download/v1.1.1/M19_SYLVAINMETAYER.pdf
      ansible.builtin.assert:
        that:
          - traefik_config.certificatesResolvers.letsencrypt.acme.email == pangolin_le_email
          # Ni API ni dashboard Traefik (api.insecure les servait sur :8080).
          - "'api' not in traefik_config"
          # Plus aucune cible HTTPS (Proxmox est privé) : certificats des cibles vérifiés.
          - "'serversTransport' not in traefik_config"
          - dynamic_config.http.routers['next-router'].rule is search('Host\(`' ~ (pangolin_dashboard_url | regex_escape) ~ '`\)')
          - dynamic_config.http.routers['int-api-router'].rule == 'Host(`' ~ pangolin_api_url ~ '`)'
          # API d'intégration réservée aux IP autorisées.
          - dynamic_config.http.routers['int-api-router'].middlewares == ['int-api-allowlist']
          - dynamic_config.http.middlewares['int-api-allowlist'].ipAllowList.sourceRange == pangolin_api_allowed_ips.split(',')
          # Redirection vers un fichier : chemin ignoré, 302 (host_vars, keep_path / permanent)
          - dynamic_config.http.middlewares['redirect-memoire-epsi'].redirectRegex.replacement == memoire_epsi_pdf
          - not dynamic_config.http.middlewares['redirect-memoire-epsi'].redirectRegex.permanent
          - dynamic_config.http.middlewares['redirect-sylvain-dev-apex'].redirectRegex.replacement == 'https://www.sylvain.dev${1}'
          - dynamic_config.http.middlewares['redirect-sylvain-dev-apex'].redirectRegex.permanent
          - dynamic_config.http.routers['redirect-memoire-epsi'].rule == 'Host(`memoire.epsi.sylvainmetayer.fr`)'

    # --- CrowdSec (agent + LAPI + AppSec, bouncer en plugin Traefik) ---

    - name: Assert the CrowdSec container is pinned, capped and unexposed
      vars:
        pangolin_compose: "{{ pangolin_compose_raw.stdout | from_json }}"
        crowdsec: "{{ pangolin_compose.services.crowdsec }}"
        crowdsec_mounts: "{{ crowdsec.volumes | map(attribute='target') | list }}"
      ansible.builtin.assert:
        that:
          - crowdsec.image is search('^docker\\.io/crowdsecurity/crowdsec:v[0-9.]+@sha256:[a-f0-9]{64}$')
          - crowdsec.ports | default([]) | length == 0
          - crowdsec.mem_limit | int == 536870912
          - "'cpus' not in crowdsec"
          - crowdsec.healthcheck.test == ['CMD', 'cscli', 'lapi', 'status']
          - crowdsec.environment.BOUNCER_KEY_traefik == pangolin_crowdsec_bouncer_key
          - crowdsec.environment.COLLECTIONS.split() | sort == pangolin_crowdsec_collections | sort
          - "'crowdsecurity/sshd' not in crowdsec.environment.COLLECTIONS"
          - "'ENROLL_KEY' not in crowdsec.environment"
          # Bouncer recréé à chaque démarrage avec la clé courante.
          # « traefik » et les « traefik@<IP> » créés par la LAPI, qui
          # garderaient l'ancienne clé valide après une rotation.
          # (compose config peut rendre $$ tel quel ou en $.)
          - "'cscli bouncers list -o json' in crowdsec.entrypoint[-1]"
          - crowdsec.entrypoint[-1] is search('traefik.\\(@')
          - crowdsec.entrypoint[-1] is search('cscli bouncers delete "\\$\\$?b"')
          - crowdsec.entrypoint[-1] is search('exec /bin/bash /docker_start.sh$')
          - "'/var/log/traefik' in crowdsec_mounts"
          - "'/etc/crowdsec/acquis.yaml' in crowdsec_mounts"
          - "'/etc/crowdsec/parsers/s02-enrich/homelab-whitelist.yaml' in crowdsec_mounts"
          - "'/etc/crowdsec/appsec-configs/homelab-alert-only.yaml' in crowdsec_mounts"
          - "'/etc/crowdsec/scenarios/homelab-appsec-alert-only.yaml' in crowdsec_mounts"
          - crowdsec.volumes | selectattr('target', 'equalto', '/var/log/traefik') | map(attribute='read_only') | first

    - name: Stat the CrowdSec files of the role
      become: true
      ansible.builtin.stat:
        path: "{{ pangolin_crowdsec_dir }}/local/{{ item.src }}"
      register: pangolin_crowdsec_stat
      loop: "{{ pangolin_crowdsec_local_files }}"
      loop_control:
        label: "{{ item.src }}"

    - name: Assert the CrowdSec files of the role are private to root
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
          - item.stat.pw_name == 'root'
        fail_msg: "{{ item.item.src }} : {{ item.stat.mode | default('absent') }}"
      loop: "{{ pangolin_crowdsec_stat.results }}"
      loop_control:
        label: "{{ item.item.src }}"

    - name: Read the CrowdSec acquisition, whitelist and AppSec files
      become: true
      ansible.builtin.slurp:
        src: "{{ pangolin_crowdsec_dir }}/local/{{ item }}"
      register: pangolin_crowdsec_files
      loop:
        - acquis.yaml
        - homelab-whitelist.yaml
        - appsec-config.yaml
        - appsec-alert-scenario.yaml

    - name: Assert CrowdSec reads Traefik, whitelists home and never blocks through AppSec
      vars:
        acquis: "{{ pangolin_crowdsec_files.results[0].content | b64decode | ansible.builtin.from_yaml_all | list }}"
        whitelist: "{{ pangolin_crowdsec_files.results[1].content | b64decode | from_yaml }}"
        appsec_config: "{{ pangolin_crowdsec_files.results[2].content | b64decode | from_yaml }}"
        appsec_scenario: "{{ pangolin_crowdsec_files.results[3].content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - acquis[0].filenames == ['/var/log/traefik/access.log']
          - acquis[0].labels.type == 'traefik'
          - acquis[1].source == 'appsec'
          - acquis[1].appsec_config == appsec_config.name
          - (home_ip ~ '/32') in whitelist.whitelist.cidr
          - "'10.0.0.0/8' in whitelist.whitelist.cidr"
          - "'172.16.0.0/12' in whitelist.whitelist.cidr"
          # Détection seule : aucune règle en bande, donc jamais de 403 ni
          # d'événement appsec-block (scénario crowdsecurity/appsec-vpatch).
          - appsec_config.inband_rules | default([]) | length == 0
          - "'crowdsecurity/vpatch-*' in appsec_config.outofband_rules"
          - "'crowdsecurity/generic-*' in appsec_config.outofband_rules"
          - appsec_scenario.name == 'homelab/appsec-alert-only'
          - not appsec_scenario.labels.remediation

    - name: Assert the Traefik bouncer is on websecure only, in stream mode, failing open
      vars:
        traefik_config: "{{ pangolin_traefik.results[0].content | b64decode | from_yaml }}"
        dynamic_config: "{{ pangolin_traefik.results[1].content | b64decode | from_yaml }}"
        bouncer: "{{ dynamic_config.http.middlewares.crowdsec.plugin.crowdsec }}"
      ansible.builtin.assert:
        that:
          - traefik_config.experimental.plugins.crowdsec.moduleName == 'github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin'
          - traefik_config.experimental.plugins.crowdsec.version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
          - traefik_config.entryPoints.websecure.http.middlewares == ['crowdsec@file']
          # Défi ACME et redirections HTTP sans bouncer.
          - "'http' not in traefik_config.entryPoints.web"
          # IP du client = celle de la connexion, X-Forwarded-For jamais cru.
          - "'forwardedHeaders' not in traefik_config.entryPoints.websecure"
          - "'forwardedHeadersTrustedIPs' not in bouncer"
          - "'forwardedHeadersTrustedIps' not in bouncer"
          - traefik_config.accessLog.filePath == '/var/log/traefik/access.log'
          - traefik_config.accessLog.format == 'json'
          - traefik_config.accessLog.fields.headers.defaultMode == 'drop'
          - "traefik_config.accessLog.fields.headers.names == {'User-Agent': 'keep'}"
          - bouncer.crowdsecMode == 'stream'
          - bouncer.crowdsecLapiKey == pangolin_crowdsec_bouncer_key
          - bouncer.updateMaxFailure == -1
          - not bouncer.streamStartupBlock
          - bouncer.crowdsecAppsecEnabled
          - not bouncer.crowdsecAppsecFailureBlock
          - not bouncer.crowdsecAppsecUnreachableBlock
          - not bouncer.crowdsecAppsecUnreadableBodyBlock
          - (home_ip ~ '/32') in bouncer.clientTrustedIPs

    - name: Stat the Traefik dynamic configuration
      become: true
      ansible.builtin.stat:
        path: "{{ pangolin_dir }}/config/traefik/dynamic_config.yml"
      register: pangolin_dynamic_stat

    # Elle porte la clé du bouncer.
    - name: Assert the Traefik dynamic configuration is private to root
      ansible.builtin.assert:
        that:
          - pangolin_dynamic_stat.stat.mode == '0600'
          - pangolin_dynamic_stat.stat.pw_name == 'root'

    - name: Check the logrotate configuration of the Traefik access log
      become: true
      ansible.builtin.command: logrotate --debug /etc/logrotate.d/traefik-access
      changed_when: false

    - name: Read the logrotate configuration of the Traefik access log
      become: true
      ansible.builtin.slurp:
        src: /etc/logrotate.d/traefik-access
      register: pangolin_logrotate_raw

    - name: Assert the access log is rotated daily and Traefik signalled
      vars:
        logrotate_conf: "{{ pangolin_logrotate_raw.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - logrotate_conf is search(pangolin_dir ~ '/config/traefik/logs/access.log \\{')
          - logrotate_conf is search('\\bdaily\\b')
          - logrotate_conf is search('docker kill --signal=USR1 traefik')
          # La directive, pas le commentaire qui explique son absence.
          - logrotate_conf is not search('(?m)^\\s*copytruncate')

    # --- borgmatic ---

    - name: Verify the borgmatic configuration of Pangolin
      become: true
      ansible.builtin.command: "{{ molecule_borgmatic_bin }} config validate --config {{ borgmatic_config_dir }}/pangolin.yaml"
      changed_when: false

    - name: Stat the borgmatic configuration of Pangolin
      become: true
      ansible.builtin.stat:
        path: "{{ borgmatic_config_dir }}/pangolin.yaml"
      register: pangolin_borgmatic_stat

    - name: Read the borgmatic configuration of Pangolin
      become: true
      ansible.builtin.slurp:
        src: "{{ borgmatic_config_dir }}/pangolin.yaml"
      register: pangolin_borgmatic_raw

    - name: Assert the borgmatic configuration targets the Pangolin repository
      vars:
        borgmatic_config: "{{ pangolin_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - pangolin_borgmatic_stat.stat.mode == '0600'
          - pangolin_borgmatic_stat.stat.pw_name == 'root'
          - borgmatic_config.repositories[0].path == pangolin_backup_borgmatic_target
          - borgmatic_config.source_directories == [pangolin_dir ~ '/compose.yaml', pangolin_dir ~ '/config']
          # Journal d'accès exclu ; CrowdSec (hors de config/) jamais sauvegardé.
          - (pangolin_dir ~ '/config/traefik/logs') in borgmatic_config.exclude_patterns

    - name: Verify the Uptime Kuma push of the Pangolin backup
      ansible.builtin.include_tasks: ../_shared/tasks/verify_borgmatic_push.yml
      vars:
        verify_borgmatic_push_config: "{{ borgmatic_config_dir }}/pangolin.yaml"
        verify_borgmatic_push_url: https://uptime.example.invalid/api/push/pangolin_backup

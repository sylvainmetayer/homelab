---
- name: Verify
  hosts: all
  vars_files:
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
  tasks:
    - name: Verify the newt deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: newt

    - name: Stat the newt compose file
      ansible.builtin.stat:
        path: "{{ docker_base_path }}/newt/compose.yaml"
      register: newt_compose_stat

    # Il porte NEWT_SECRET : personne d'autre que l'utilisateur ne le lit.
    - name: Assert the newt compose file is private
      ansible.builtin.assert:
        that:
          - newt_compose_stat.stat.mode == '0600'
          - newt_compose_stat.stat.pw_name == ansible_facts['user_id']
        fail_msg: "{{ docker_base_path }}/newt/compose.yaml doit être 0600 à {{ ansible_facts['user_id'] }}"

    - name: Read the newt compose file
      ansible.builtin.slurp:
        src: "{{ docker_base_path }}/newt/compose.yaml"
      register: newt_compose_raw

    - name: Parse the newt compose file
      ansible.builtin.set_fact:
        newt_compose: "{{ newt_compose_raw.content | b64decode | from_yaml }}"
        newt_env: "{{ (newt_compose_raw.content | b64decode | from_yaml).services.newt.environment }}"

    # Identifiants du site docker (host_vars/docker), pas ceux du Pi.
    - name: Assert newt connects to Pangolin as the docker site
      ansible.builtin.assert:
        that:
          - ('PANGOLIN_ENDPOINT=' ~ newt_endpoint) in newt_env
          - ('NEWT_ID=' ~ newt_docker_client_id) in newt_env
          - ('NEWT_SECRET=' ~ newt_docker_client_secret) in newt_env
        fail_msg: "Environnement de newt inattendu : {{ newt_env | map('regex_replace', '^(NEWT_SECRET)=.*', '\\1=***') | list }}"

    # Les applications rejoignent `newt` en réseau externe : c'est ce compose
    # qui le déclare sous ce nom exact. Newt ne voit le démon Docker qu'à
    # travers le proxy du socket (#853).
    - name: Assert newt owns the shared newt network and reads Docker through the proxy only
      vars:
        newt_proxy: "{{ newt_compose.services['socket-proxy'] }}"
      ansible.builtin.assert:
        that:
          - newt_compose.networks.newt.name == 'newt'
          - not (newt_compose.networks.newt.external | default(false))
          - "'newt' in newt_compose.services.newt.networks"
          - newt_compose.services.newt.volumes == ['./socket:/run/socket-proxy:ro']
          - newt_compose.services.newt.hostname == 'newt'
          - "'DOCKER_SOCKET=unix:///run/socket-proxy/docker.sock' in newt_env"
          - "'DOCKER_ENFORCE_NETWORK_VALIDATION=true' in newt_env"
          # Défaut du rôle (host_vars/docker ne le surcharge pas ; le Pi, si).
          - newt_compose.services.newt.mem_limit == '256m'
          # Seul le proxy monte le socket du démon, sans réseau ni capacité.
          - "'/var/run/docker.sock:/var/run/docker.sock:ro' in newt_proxy.volumes"
          - newt_proxy.network_mode == 'none'
          - newt_proxy.read_only
          - newt_proxy.cap_drop == ['ALL']
          - newt_proxy.user is match('^65534:[0-9]+$')
          - (newt_proxy.user.split(':')[1] | int) in newt_compose.services.newt.group_add | map('int')
          - newt_proxy.mem_limit is defined
          # GET et HEAD seulement, et pas d'inspect des autres conteneurs.
          - newt_proxy.command | select('match', '-allow(?!GET=|HEAD=)') | list == []
          - "'-allowGET=/(v[0-9.]+/)?(_ping|containers/json|containers/newt/json|events)' in newt_proxy.command"
          - "'-allowHEAD=/(v[0-9.]+/)?_ping' in newt_proxy.command"

    - name: Stat the socket proxy folder
      become: true
      ansible.builtin.stat:
        path: "{{ docker_base_path }}/newt/socket"
      register: newt_socket_dir

    - name: Assert the socket proxy folder is closed to others
      ansible.builtin.assert:
        that:
          - newt_socket_dir.stat.isdir
          - newt_socket_dir.stat.mode == '0750'
          - newt_socket_dir.stat.uid == 65534
          - newt_socket_dir.stat.gr_name == 'docker'

---
# newt tourne sur docker (docker.yml), pi (pi.yml) et flip (flip.yml) ; on
# teste l'hôte docker et ses identifiants (host_vars/docker).
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: docker_service
    - role: newt

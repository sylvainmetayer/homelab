---
# Aucun playbook n'applique ce rôle aujourd'hui. Ses tâches ne demandent pas
# become elles-mêmes (paquet, /etc/pam.d/sudo, /etc/sudoers) : il s'applique
# donc avec become au niveau du playbook, comme security.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: sudo_with_ssh_agent
      become: true

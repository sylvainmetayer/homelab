---
# Comme `ansible-playbook docker.yml --tags decommission -e ...` (cf. le skill
# remove-app) : avec ce tag, seul decommission_app tourne (docker_service et
# les applications sont tagués setup/app), et les -e deviennent ici des vars
# du rôle. decommission_app_destroy_remote_backup reste au défaut (false).
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: decommission_app
      vars:
        decommission_app_confirm: true
        decommission_app_service: rss
        decommission_app_base_path: "{{ docker_base_path }}/rss"

---
# Ce que le converge ne peut porter (il doit rester idempotent) : garde-fous et
# issues de repo-delete. decommission_app_borgmatic_bin vise le vrai borgmatic
# de l'image, pas le bouchon, avec le vrai borg du rôle borgmatic.
- name: Exercise the guards of decommission_app
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  vars:
    molecule_borg_bin: /root/.local/bin/borg
    molecule_repo_dir: /var/lib/molecule-decommission-repos
    # Pas de « ../ » écrit en clair : select_tests.py y lirait un chemin vers un
    # autre scénario, ici wiki.
    molecule_up: ".."
  environment:
    # Binaire borg PyInstaller « onefile » : il s'extrait dans TMPDIR, et le
    # /tmp du conteneur est un tmpfs noexec.
    TMPDIR: /var/tmp
  tasks:
    # --- Chemins refusés : wiki, voisine déployée, doit sortir intacte --------
    - name: Read dc@wiki before the refused runs
      ansible.builtin.systemd:
        name: dc@wiki
        scope: user
      register: wiki_unit_before

    - name: Run the role on refused paths
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      loop:
        - {service: wiki, base_path: /, fails_on: Refuse}
        - {service: wiki, base_path: /etc, fails_on: Refuse}
        - {service: wiki, base_path: /home, fails_on: Refuse}
        - {service: wiki, base_path: /opt, fails_on: Refuse}
        - {service: wiki, base_path: /opt/apps, fails_on: Refuse}
        - {service: wiki, base_path: "", fails_on: Refuse}
        - {service: wiki, base_path: wiki, fails_on: Refuse}
        - {service: wiki, base_path: opt/apps/wiki, fails_on: Refuse}
        - {service: wiki, base_path: "{{ molecule_up }}/wiki", fails_on: Refuse}
        - {service: wiki, base_path: "/opt/apps/{{ molecule_up }}/apps/wiki", fails_on: Refuse}
        - {service: wiki, base_path: "/opt/apps/wiki/{{ molecule_up }}", fails_on: Refuse}
        - {service: wiki, base_path: /opt/apps/wiki/data, fails_on: Refuse}
        - {service: wiki, base_path: /opt/apps/rss, fails_on: Refuse}
        - {service: wiki, base_path: /opt/apps-other/wiki, fails_on: Refuse}
        - {service: wiki, base_path: /mnt/nas/apps/wiki, fails_on: Refuse}
        - {service: wiki, base_path: /volume1/docker/wiki, fails_on: Refuse}
        # Le même écart des deux côtés : l'égalité seule le laisserait passer.
        - {service: "{{ molecule_up }}", base_path: "/opt/apps/{{ molecule_up }}", fails_on: Refuse}
        - {service: "{{ molecule_up }}/wiki", base_path: "/opt/apps/{{ molecule_up }}/wiki", fails_on: Refuse}
        - {service: "wiki/{{ molecule_up }}/{{ molecule_up }}", base_path: "/opt/apps/wiki/{{ molecule_up }}/{{ molecule_up }}", fails_on: Refuse}
        - {service: wiki, base_path: /opt/apps/wiki, extra_paths: [/mnt/nas/apps], fails_on: Refuse}
      loop_control:
        loop_var: decommission_case

    - name: Read dc@wiki after the refused runs
      ansible.builtin.systemd:
        name: dc@wiki
        scope: user
      register: wiki_unit_after

    # Démarrée et jamais arrêtée : même instant d'activation qu'avant.
    - name: Assert nothing stopped dc@wiki
      ansible.builtin.assert:
        that:
          - wiki_unit_after.status.ActiveState == 'active'
          - wiki_unit_after.status.UnitFileState == 'enabled'
          - wiki_unit_after.status.ActiveEnterTimestampMonotonic == wiki_unit_before.status.ActiveEnterTimestampMonotonic

    - name: Stat wiki and a system file, which must still exist
      become: true
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_base_path }}/wiki/compose.yaml"
        - "{{ borgmatic_config_dir }}/wiki.yaml"
        - /etc/hostname
      register: wiki_paths
      failed_when: not wiki_paths.stat.exists

    # --- Interrupteurs passés en chaîne, comme par -e key=value ---------------
    - name: Create the uptime-kuma folder and the NAS folder
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ borgmatic_config_dir }}/uptime-kuma"
        - /mnt/nas/apps/strings_app

    - name: Create the app removed by the string switches
      ansible.builtin.include_tasks: tasks/fixture.yml
      vars:
        fixture_service: strings_app

    - name: Run the role with the string false
      ansible.builtin.include_role:
        name: decommission_app
      vars:
        decommission_app_confirm: "true"
        decommission_app_service: strings_app
        decommission_app_base_path: "{{ docker_base_path }}/strings_app"
        decommission_app_extra_paths:
          - /mnt/nas/apps/strings_app
        decommission_app_destroy_remote_backup: "false"
        decommission_app_remove_borgmatic_config: "false"
        decommission_app_remove_data: "false"

    - name: Assert the string false kept everything
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: strings_app
        fixture_extra_paths: [/mnt/nas/apps/strings_app]
        fixture_present: true

    # Le bouchon de borgmatic sort en 0 : seul ce saut distingue « false » lu vrai.
    - name: Assert the string false did not reach repo-delete
      ansible.builtin.assert:
        that:
          - decommission_app_repo_delete is skipped

    - name: Run the role with the string true
      ansible.builtin.include_role:
        name: decommission_app
      vars:
        decommission_app_confirm: "true"
        decommission_app_service: strings_app
        decommission_app_base_path: "{{ docker_base_path }}/strings_app"
        decommission_app_extra_paths:
          - /mnt/nas/apps/strings_app
        decommission_app_destroy_remote_backup: "false"
        decommission_app_remove_borgmatic_config: "true"
        decommission_app_remove_data: "true"

    - name: Assert the string true removed everything
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: strings_app
        fixture_extra_paths: [/mnt/nas/apps/strings_app]
        fixture_present: false

    # --- Arrêt : un échec réel garde tout, seul l'absent est toléré ------------
    - name: Create the app whose compose file is invalid
      ansible.builtin.include_tasks: tasks/fixture.yml
      vars:
        fixture_service: broken_compose_app

    - name: Make its compose file invalid
      become: true
      ansible.builtin.copy:
        dest: "{{ docker_base_path }}/broken_compose_app/compose.yaml"
        owner: sylvain
        mode: "0600"
        content: |
          services: [

    - name: Run the role on the invalid compose file
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        decommission_case:
          service: broken_compose_app
          base_path: "{{ docker_base_path }}/broken_compose_app"
          fails_on: Tear down

    - name: Assert the failed compose kept the config and the data
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: broken_compose_app
        fixture_present: true

    - name: Create the app whose unit refuses to stop
      ansible.builtin.include_tasks: tasks/fixture.yml
      vars:
        fixture_service: stuck_unit_app

    - name: Create the drop-in folder of its unit
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dc@stuck_unit_app.service.d"
        state: directory
        mode: "0700"

    # systemctl stop échoue alors pour de bon (« Operation refused »).
    - name: Make its unit refuse a manual stop
      ansible.builtin.copy:
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dc@stuck_unit_app.service.d/molecule-refuse-stop.conf"
        mode: "0600"
        content: |
          [Unit]
          RefuseManualStop=yes

    - name: Start the unit that refuses to stop
      ansible.builtin.systemd:
        name: dc@stuck_unit_app
        scope: user
        state: started
        daemon_reload: true

    - name: Run the role on the unit that refuses to stop
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        decommission_case:
          service: stuck_unit_app
          base_path: "{{ docker_base_path }}/stuck_unit_app"
          fails_on: Stop and disable

    - name: Assert the failed stop kept the config and the data
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: stuck_unit_app
        fixture_present: true

    - name: Read the unit that refused to stop
      ansible.builtin.systemd:
        name: dc@stuck_unit_app
        scope: user
      register: stuck_unit

    - name: Assert the unit that refused to stop still runs
      ansible.builtin.assert:
        that:
          - stuck_unit.status.ActiveState == 'active'

    - name: Create the app with no compose file
      ansible.builtin.include_tasks: tasks/fixture.yml
      vars:
        fixture_service: no_compose_app

    - name: Remove its compose file
      become: true
      ansible.builtin.file:
        path: "{{ docker_base_path }}/no_compose_app/compose.yaml"
        state: absent

    - name: Run the role on the folder with no compose file
      ansible.builtin.include_role:
        name: decommission_app
      vars:
        decommission_app_confirm: true
        decommission_app_service: no_compose_app
        decommission_app_base_path: "{{ docker_base_path }}/no_compose_app"

    - name: Assert the missing compose file was met and tolerated
      ansible.builtin.assert:
        that:
          - decommission_app_compose_down.rc != 0
          - decommission_app_compose_down is not failed

    - name: Assert the run with no compose file finished the removal
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: no_compose_app
        fixture_present: false

    # Le scope système, celui du NAS : aucun modèle dc@ n'y est installé ici,
    # l'unité est donc vraiment introuvable.
    - name: Create the app with no unit
      ansible.builtin.include_tasks: tasks/fixture.yml
      vars:
        fixture_service: no_unit_app

    # Pas une variable du rôle : le scope de l'hôte, qu'il lit (vars/main.yml).
    - name: Run the role on the app with no unit  # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: decommission_app
      vars:
        docker_service_scope: system
        decommission_app_confirm: true
        decommission_app_service: no_unit_app
        decommission_app_base_path: "{{ docker_base_path }}/no_unit_app"

    - name: Assert the missing unit was met and tolerated
      ansible.builtin.assert:
        that:
          - decommission_app_unit_stop.msg is search('Could not find the requested service')
          - decommission_app_unit_stop is not failed

    - name: Assert the run with no unit finished the removal
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: no_unit_app
        fixture_present: false

    # --- repo-delete : vrais borgmatic et borg, dépôts locaux jetables --------
    - name: Read the pinned borg version
      ansible.builtin.include_vars:
        file: ../../roles/borgmatic/defaults/main.yml
        name: molecule_borgmatic_defaults

    - name: Download the borg binary the hosts run
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/borgbackup/borg/releases/download/{{ molecule_borgmatic_defaults.borgmatic_borg_version }}/borg-linux-glibc235-x86_64-gh"
        dest: "{{ molecule_borg_bin }}"
        checksum: "sha256:{{ molecule_borgmatic_defaults.borgmatic_borg_sha256.x86_64 }}"
        mode: "0700"

    # Un dossier qui n'est pas un dépôt : borg sort en 15, borgmatic en 1.
    - name: Make a target that is not a repository
      become: true
      ansible.builtin.file:
        path: "{{ molecule_repo_dir }}/retry_app/not-a-repository"
        state: directory
        mode: "0700"

    - name: Create the app whose repository cannot be deleted
      ansible.builtin.include_tasks: tasks/fixture.yml
      vars:
        fixture_service: retry_app

    - name: Start the app whose repository cannot be deleted
      ansible.builtin.systemd:
        name: dc@retry_app
        scope: user
        state: started

    - name: Run the role on the repository that cannot be deleted
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        decommission_case: &retry_case
          service: retry_app
          base_path: "{{ docker_base_path }}/retry_app"
          destroy: true
          fails_on: Destroy

    - name: Assert the failed repo-delete kept the config and the data
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: retry_app
        fixture_present: true

    - name: Read dc@retry_app after the failed repo-delete
      ansible.builtin.systemd:
        name: dc@retry_app
        scope: user
      register: retry_unit

    - name: Assert the failed repo-delete left the app running
      ansible.builtin.assert:
        that:
          - retry_unit.status.ActiveState == 'active'

    - name: Remove the target, leaving an absent repository
      become: true
      ansible.builtin.file:
        path: "{{ molecule_repo_dir }}/retry_app"
        state: absent

    # Le nouvel essai que la configuration conservée permet.
    - name: Run the role again on the absent repository
      ansible.builtin.include_role:
        name: decommission_app
      vars:
        decommission_app_confirm: true
        decommission_app_service: retry_app
        decommission_app_base_path: "{{ docker_base_path }}/retry_app"
        decommission_app_destroy_remote_backup: true
        decommission_app_borgmatic_bin: "{{ molecule_borgmatic_bin }}"

    - name: Assert the absent repository was tolerated, not reported as deleted
      ansible.builtin.assert:
        that:
          - decommission_app_repo_delete.rc == 1
          - decommission_app_repo_delete is not changed
          - decommission_app_repo_delete is not failed

    - name: Assert the run on the absent repository finished the removal
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: retry_app
        fixture_present: false

    # Plus de configuration : l'état du dépôt est inconnu, ce n'est pas « absent ».
    - name: Run the role once more, without a configuration
      ansible.builtin.include_tasks: tasks/expect_failure.yml
      vars:
        decommission_case: *retry_case

    - name: Create the app whose repository gets deleted
      ansible.builtin.include_tasks: tasks/fixture.yml
      vars:
        fixture_service: deleted_app

    - name: Create its real repository
      become: true
      ansible.builtin.command:
        cmd: "{{ molecule_borg_bin }} init --encryption none {{ molecule_repo_dir }}/deleted_app"
        creates: "{{ molecule_repo_dir }}/deleted_app/config"

    - name: Run the role on the existing repository
      ansible.builtin.include_role:
        name: decommission_app
      vars:
        decommission_app_confirm: true
        decommission_app_service: deleted_app
        decommission_app_base_path: "{{ docker_base_path }}/deleted_app"
        decommission_app_destroy_remote_backup: true
        decommission_app_borgmatic_bin: "{{ molecule_borgmatic_bin }}"

    - name: Stat the deleted repository
      become: true
      ansible.builtin.stat:
        path: "{{ molecule_repo_dir }}/deleted_app"
      register: deleted_repo

    - name: Assert the repository is deleted and reported so
      ansible.builtin.assert:
        that:
          - decommission_app_repo_delete is changed
          - not deleted_repo.stat.exists

    - name: Assert the successful repo-delete removed the config and the data
      ansible.builtin.include_tasks: tasks/stat_fixture.yml
      vars:
        fixture_service: deleted_app
        fixture_present: false

---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# État d'un hôte docker avant `--tags decommission` : rss (compose,
# .env, données, configuration borgmatic et dépôt) est l'application à
# retirer, wiki une voisine qui ne doit pas être touchée.
- name: Deploy the apps
  hosts: all
  vars_files:
    - ../_shared/vars/fake_secrets.yml
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  roles:
    - role: docker_service
    - role: wiki
    # Avec un moniteur push : le fichier de son URL doit partir aussi.
    - role: rss
      vars:
        rss_backup_healthcheck_url: https://uptime.example.invalid/api/push/tofu-rss-backup

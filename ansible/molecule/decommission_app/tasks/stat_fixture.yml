---
- name: Stat what the role removes for {{ fixture_service }}
  become: true
  vars:
    fixture_own_paths:
      - "{{ docker_base_path }}/{{ fixture_service }}"
      - "{{ borgmatic_config_dir }}/{{ fixture_service }}.yaml"
      - "{{ borgmatic_config_dir }}/{{ fixture_service }}.repo-created"
      - "{{ borgmatic_config_dir }}/uptime-kuma/{{ fixture_service }}.curl"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ fixture_own_paths + fixture_extra_paths | default([]) }}"
  register: fixture_paths

- name: Assert the presence of the app folder and borgmatic files of {{ fixture_service }}
  ansible.builtin.assert:
    that:
      - fixture_paths.results | map(attribute='stat.exists') | unique == [fixture_present]
    fail_msg: "{{ fixture_paths.results | map(attribute='item') | zip(fixture_paths.results | map(attribute='stat.exists')) | list | string }}"
    quiet: true

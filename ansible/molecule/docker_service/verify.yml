---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  vars:
    docker_service_unit_path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/dc@.service"
  tasks:
    - name: Stat the dc@ unit template and the apps folder
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ docker_service_unit_path }}"
        - "{{ docker_base_path }}"
        - "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
      register: docker_service_stats

    - name: Stat the stale user-scope multi-user.target links
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/multi-user.target.wants"
      register: docker_service_stale_wants

    # prepare.yml en a laissé un, comme sur un hôte déployé avant la correction.
    - name: Assert the stale multi-user.target links were removed
      ansible.builtin.assert:
        that:
          - not docker_service_stale_wants.stat.exists
        fail_msg: multi-user.target.wants subsiste dans ~/.config/systemd/user

    - name: Assert the unit template, apps folder and linger file are in place
      ansible.builtin.assert:
        that:
          - docker_service_stats.results[0].stat.exists
          - docker_service_stats.results[0].stat.pw_name == ansible_facts['user_id']
          - docker_service_stats.results[0].stat.mode == '0644'
          - docker_service_stats.results[1].stat.isdir
          - docker_service_stats.results[1].stat.pw_name == ansible_facts['user_id']
          - docker_service_stats.results[1].stat.mode == '0755'
          - docker_service_stats.results[2].stat.exists
        fail_msg: "{{ docker_service_stats.results | map(attribute='item') | list }} : propriétaire, mode ou existence inattendus"

    # Contenu du fichier lui-même : le drop-in Molecule (_shared/prepare.yml)
    # remplace ExecStart* à l'exécution, pas dans ce fichier.
    - name: Read the dc@ unit template
      ansible.builtin.slurp:
        src: "{{ docker_service_unit_path }}"
      register: docker_service_unit_raw

    # Les rôles d'application posent leur compose sous docker_base_path/<service> :
    # WorkingDirectory doit pointer au même endroit.
    - name: Assert the dc@ unit runs docker compose in the app folder
      ansible.builtin.assert:
        that:
          - ('WorkingDirectory=' ~ docker_base_path ~ '/%i') in docker_service_unit_lines
          # Pas de pull complet au démarrage : un registre en panne n'empêche
          # pas de relancer une appli dont les images sont déjà là. Les images
          # absentes, elles, sont tirées avant `up`, pour qu'un échec fasse
          # échouer le job de démarrage (handler Ansible compris).
          - docker_service_unit_lines | select('match', 'ExecStartPre=.*compose pull') | list == ['ExecStartPre=/usr/bin/docker compose pull --policy missing']
          - "'ExecStart=/usr/bin/docker compose up --remove-orphans' in docker_service_unit_lines"
          - docker_service_unit_lines | select('match', '^ExecStartPre=/usr/bin/timeout 120 .*docker info') | list | length == 1
          - "'ExecStop=/usr/bin/docker compose stop' in docker_service_unit_lines"
          - "'Restart=always' in docker_service_unit_lines"
          # Jamais d'abandon définitif (plus de StartLimitBurst).
          - "'StartLimitIntervalSec=0' in docker_service_unit_lines"
          - docker_service_unit_lines | select('match', '^StartLimitBurst=') | list | length == 0
          # Pas de backoff : son compteur ne retombe jamais à zéro de lui-même,
          # il finissait par retarder de 10 min un simple redémarrage de Docker.
          - "'RestartSec=15s' in docker_service_unit_lines"
          - docker_service_unit_lines | select('match', '^Restart(Steps|MaxDelaySec)=') | list | length == 0
          # Unité user : default.target, pas multi-user.target (absente du
          # manager user), sinon rien ne démarre au boot.
          - "'WantedBy=default.target' in docker_service_unit_lines"
        fail_msg: "{{ docker_service_unit_path }} inattendu"
      vars:
        docker_service_unit_lines: "{{ (docker_service_unit_raw.content | b64decode).splitlines() }}"

    # Une instance quelconque : le manager user a bien chargé ce fichier (le
    # handler Daemon reload est passé).
    - name: Read an instance of dc@
      ansible.builtin.systemd:
        name: dc@molecule
        scope: user
      register: docker_service_instance

    - name: Assert the user manager loaded the dc@ unit template
      ansible.builtin.assert:
        that:
          - docker_service_instance.status.LoadState == 'loaded'
          - docker_service_instance.status.FragmentPath == docker_service_unit_path
          - docker_service_instance.status.NeedDaemonReload == 'no'
          - docker_service_instance.status.WorkingDirectory == docker_base_path ~ '/molecule'
          - docker_service_instance.status.StartLimitIntervalUSec == '0'
          - docker_service_instance.status.RestartUSec == '15s'
          - docker_service_instance.status.JobRunningTimeoutUSec == '10min'
          - docker_service_instance.status.TimeoutStopUSec == '2min'
        fail_msg: >-
          dc@molecule : {{ docker_service_instance.status.LoadState }}
          depuis {{ docker_service_instance.status.FragmentPath | default('?') }}

    - name: Read the user manager of sylvain
      ansible.builtin.systemd:
        name: "user@{{ ansible_facts['user_uid'] }}.service"
      register: docker_service_manager

    - name: Read the PID of the stale user manager recorded by prepare
      become: true
      ansible.builtin.slurp:
        src: /var/lib/molecule-stale-user-manager.pid
      register: docker_service_stale_pid

    - name: Read the docker group
      ansible.builtin.getent:
        database: group
        key: docker

    - name: Read the groups of the user manager
      ansible.builtin.slurp:
        src: "/proc/{{ docker_service_manager.status.MainPID }}/status"
      register: docker_service_manager_proc

    # prepare.yml a laissé un manager démarré sans le groupe docker : le rôle
    # devait le redémarrer pour qu'il (et ses unités dc@) l'obtienne.
    - name: Assert the user manager was restarted into the docker group
      ansible.builtin.assert:
        that:
          - docker_service_manager.status.ActiveState == 'active'
          - docker_service_manager.status.MainPID != (docker_service_stale_pid.content | b64decode | trim)
          - ansible_facts['getent_group']['docker'][1] in docker_service_manager_groups
        fail_msg: >-
          user@{{ ansible_facts['user_uid'] }} (PID {{ docker_service_manager.status.MainPID }}) :
          groupes {{ docker_service_manager_groups }}, docker =
          {{ ansible_facts['getent_group']['docker'][1] }}
      vars:
        docker_service_manager_groups: >-
          {{ (docker_service_manager_proc.content | b64decode).splitlines()
             | select('match', '^Groups:') | first | regex_replace('^Groups:\s*', '') | split }}

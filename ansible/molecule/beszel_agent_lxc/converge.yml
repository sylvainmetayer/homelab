---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/newt-lxc/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets/ansible.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    # Comme lxc.yml.
    - role: beszel_agent
      vars:
        beszel_agent_name: newt-lxc
        beszel_agent_mode: binary
        beszel_agent_service_patterns: "newt*,blocky*"

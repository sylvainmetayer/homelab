---
- name: Shared prepare
  ansible.builtin.import_playbook: ../_shared/prepare.yml

# Une installation précédente, comme après une montée Renovate : le rôle doit
# supprimer son dossier de version et son archive (cf. verify.yml), quelle
# que soit son architecture.
- name: Prepare beszel_agent_lxc
  hosts: all
  gather_facts: false
  vars_files:
    - ../../roles/beszel_agent/defaults/main.yml
  tasks:
    - name: Create a previous Beszel agent version
      become: true
      ansible.builtin.file:
        path: "{{ beszel_agent_binary_dir }}/0.0.1"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Create its binary and its archive
      become: true
      loop:
        - "{{ beszel_agent_binary_dir }}/0.0.1/beszel-agent"
        - "{{ beszel_agent_binary_dir }}/beszel-agent_0.0.1_linux_amd64.tar.gz"
      ansible.builtin.copy:
        content: ""
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0600"

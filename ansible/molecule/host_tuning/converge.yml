---
# Comme dans flip.yml, docker.yml et pi.yml : rôle sans become, ses tâches le
# demandent. host_vars du Pi : seul hôte qui surcharge host_tuning (swap disque
# de débordement), les autres prennent les défauts.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pi/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

  roles:
    - role: host_tuning

---
- name: Verify
  hosts: all
  vars_files:
    - ../../roles/host_tuning/defaults/main.yml
    - ../../host_vars/pi/variables.yaml
  tasks:
    - name: Read the zramswap configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/default/zramswap
      register: host_tuning_zramswap_conf

    - name: Assert the zramswap configuration comes from the role
      ansible.builtin.assert:
        that:
          - ('\nSIZE=' ~ host_tuning_zram_size_mb ~ '\n') in (host_tuning_zramswap_conf.content | b64decode)
          - ('\nALGO=' ~ host_tuning_zram_algo ~ '\n') in (host_tuning_zramswap_conf.content | b64decode)
          - ('\nPRIORITY=' ~ host_tuning_zram_priority ~ '\n') in (host_tuning_zramswap_conf.content | b64decode)

    - name: Read the state of zramswap
      ansible.builtin.systemd:
        name: zramswap
      register: host_tuning_zramswap_unit

    - name: Assert zramswap is enabled and started
      ansible.builtin.assert:
        that:
          - host_tuning_zramswap_unit.status.UnitFileState == 'enabled'
          - host_tuning_zramswap_unit.status.ActiveState == 'active'
        fail_msg: "zramswap : {{ host_tuning_zramswap_unit.status.UnitFileState }} / {{ host_tuning_zramswap_unit.status.ActiveState }}"

    # Le postinst a démarré zramswap avec 50 % de la RAM : seule la retaille du
    # handler (déclenchée par la comparaison avec la taille live) donne la
    # taille configurée. Device factice, cf. prepare.yml.
    - name: Read the live zram device size
      ansible.builtin.slurp:
        src: /sys/block/zram0/disksize
      register: host_tuning_zram_disksize

    - name: Assert the zram device was resized to the configured size
      ansible.builtin.assert:
        that:
          - (host_tuning_zram_disksize.content | b64decode | trim | int) == (host_tuning_zram_size_mb | int) * 1048576
        fail_msg: "disksize = {{ host_tuning_zram_disksize.content | b64decode | trim }}, attendu {{ (host_tuning_zram_size_mb | int) * 1048576 }}"

    - name: Read the dphys-swapfile configuration
      ansible.builtin.slurp:
        src: /etc/dphys-swapfile
      register: host_tuning_dphys_conf

    - name: Assert the disk swap size comes from the role
      ansible.builtin.assert:
        that:
          - host_tuning_disk_swap_size_mb | int > 0
          - ('\nCONF_SWAPSIZE=' ~ host_tuning_disk_swap_size_mb ~ '\n') in (host_tuning_dphys_conf.content | b64decode)
          - ('\nCONF_MAXSWAP=' ~ host_tuning_disk_swap_size_mb ~ '\n') in (host_tuning_dphys_conf.content | b64decode)

    # Service neutralisé (cf. prepare.yml) : seul son état systemd compte ici.
    - name: Read the state of dphys-swapfile
      ansible.builtin.systemd:
        name: dphys-swapfile
      register: host_tuning_dphys_unit

    - name: Assert dphys-swapfile is enabled and started
      ansible.builtin.assert:
        that:
          - host_tuning_dphys_unit.status.UnitFileState == 'enabled'
          - host_tuning_dphys_unit.status.ActiveState == 'active'
        fail_msg: "dphys-swapfile : {{ host_tuning_dphys_unit.status.UnitFileState }} / {{ host_tuning_dphys_unit.status.ActiveState }}"

    - name: Read the journald size drop-in
      become: true
      ansible.builtin.slurp:
        src: /etc/systemd/journald.conf.d/50-size.conf
      register: host_tuning_journald_conf

    - name: Assert journald disk usage is capped
      ansible.builtin.assert:
        that:
          - "'[Journal]' in (host_tuning_journald_conf.content | b64decode)"
          - ('\nSystemMaxUse=' ~ host_tuning_journald_system_max_use ~ '\n') in (host_tuning_journald_conf.content | b64decode)
          - "'\nStorage=persistent\n' in (host_tuning_journald_conf.content | b64decode)"

    - name: Read the state of journald
      ansible.builtin.systemd:
        name: systemd-journald
      register: host_tuning_journald_unit

    - name: Assert journald survived its restart
      ansible.builtin.assert:
        that:
          - host_tuning_journald_unit.status.ActiveState == 'active'

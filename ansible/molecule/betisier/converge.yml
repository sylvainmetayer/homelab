---
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/docker/variables.yaml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # docker.yml lit ces URL dans les outputs du state pangolin_config :
    # des set_fact (absentes de secrets.sops.yaml, donc de fake_secrets.yml).
    - name: Load healthcheck URLs as docker.yml does from the Terraform state
      ansible.builtin.set_fact:
        betisier_backup_healthcheck_url: https://uptime.example.invalid/api/push/tofu-betisier-backup
        betisier_reset_healthcheck_url: https://uptime.example.invalid/api/push/tofu-betisier-reset
  roles:
    - role: docker_service
    - role: betisier

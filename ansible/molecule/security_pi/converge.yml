---
# Comme dans pi.yml : rôle appliqué avec become sur l'entrée.
- name: Converge
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
    - ../../host_vars/pi/variables.yaml
    # En dernier : le relais msmtp vise le récepteur du prepare.
    - ../security/vars/smtp_sink.yml
  pre_tasks:
    - name: Load the fake secrets as the playbooks load secrets.sops.yaml
      ansible.builtin.import_tasks: ../_shared/tasks/load_fake_secrets.yml

    # Ce qui distingue un hôte du LAN de Pangolin et flip.
    - name: Assert le Pi is configured as a LAN host
      ansible.builtin.assert:
        that:
          - security_ufw_allowed_ports | map(attribute='from', default='any') | list == ['192.168.1.0/24']
          - "'192.168.1.0/24' in security_fail2ban_ignoreip"
          - "'vfat' in security_filesystem_whitelist"
        fail_msg: host_vars/pi ne configure plus le Pi en hôte du LAN.
  roles:
    - role: security
      become: true

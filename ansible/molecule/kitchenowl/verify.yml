---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    - name: Verify the kitchenowl deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: kitchenowl
        verify_app_borgmatic_config: /etc/borgmatic.d/kitchenowl.yaml

    - name: Render the kitchenowl compose model
      ansible.builtin.command: docker compose config --format json
      args:
        chdir: /opt/apps/kitchenowl
      register: kitchenowl_compose_raw
      changed_when: false

    # Un seul conteneur, root sans capacité : rien à isoler sur un réseau
    # privé, newt suffit.
    - name: Assert kitchenowl only joins newt and drops every capability
      vars:
        kitchenowl_compose: "{{ kitchenowl_compose_raw.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - kitchenowl_compose.services.app.networks.keys() | list == ['newt']
          - kitchenowl_compose.networks.keys() | list == ['newt']
          - kitchenowl_compose.services.app.cap_drop == ['ALL']
          - kitchenowl_compose.services.app.cap_add is not defined
        fail_msg: "Service kitchenowl inattendu : {{ kitchenowl_compose.services.app }}"

    - name: Read the kitchenowl borgmatic configuration
      become: true
      ansible.builtin.slurp:
        src: /etc/borgmatic.d/kitchenowl.yaml
      register: kitchenowl_borgmatic_raw

    # prepare.yml a posé database.db : copiée par « .backup » dans le dossier
    # de staging archivé, sa copie vivante hors de l'archive. Jamais
    # sqlite_databases : son « .dump » en flux bloque les écritures tout le
    # temps de l'envoi.
    - name: Assert the kitchenowl SQLite database is copied by .backup, not dumped or copied live
      vars:
        kitchenowl_borgmatic: "{{ kitchenowl_borgmatic_raw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - kitchenowl_borgmatic.sqlite_databases is not defined
          - "'/var/lib/borgmatic-sqlite/kitchenowl' in kitchenowl_borgmatic.source_directories"
          - >-
            kitchenowl_borgmatic.commands[0].run
            | select('search', '^sqlite3 -bail .*/opt/apps/kitchenowl/data/database\\.db ')
            | select('search', '\\.backup /var/lib/borgmatic-sqlite/kitchenowl/opt_apps_kitchenowl_data_database\\.db')
            | list | length == 1
          - "'/opt/apps/kitchenowl/data/database.db' in kitchenowl_borgmatic.exclude_patterns"
          - "'/opt/apps/kitchenowl/data/database.db-wal' in kitchenowl_borgmatic.exclude_patterns"
          - "'/opt/apps/kitchenowl/data' in kitchenowl_borgmatic.source_directories"
        fail_msg: "Configuration borgmatic de kitchenowl inattendue : {{ kitchenowl_borgmatic }}"

    - name: Stat the kitchenowl data folder
      become: true
      ansible.builtin.stat:
        path: /opt/apps/kitchenowl/data
      register: kitchenowl_data

    # Root sans CAP_DAC_OVERRIDE dans le conteneur : le dossier doit être à root.
    - name: Assert the kitchenowl data folder belongs to root
      ansible.builtin.assert:
        that:
          - kitchenowl_data.stat.isdir
          - kitchenowl_data.stat.uid == 0
          - kitchenowl_data.stat.mode == '0700'

    - name: Stat the kitchenowl environment file
      ansible.builtin.stat:
        path: /opt/apps/kitchenowl/.env
      register: kitchenowl_env

    # Il porte la clé qui signe les jetons : jamais lisible par d'autres.
    - name: Assert the kitchenowl environment file is private
      ansible.builtin.assert:
        that:
          - kitchenowl_env.stat.exists
          - kitchenowl_env.stat.mode == '0600'

    - name: Read the kitchenowl environment file
      ansible.builtin.slurp:
        src: /opt/apps/kitchenowl/.env
      register: kitchenowl_env_content

    # /api/* est ouvert sans SSO pour l'appli mobile : ni inscription libre ni
    # onboarding, qui donnerait un compte administrateur au premier venu.
    - name: Assert kitchenowl registration and onboarding are closed
      vars:
        kitchenowl_env_lines: "{{ (kitchenowl_env_content.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - "'OPEN_REGISTRATION=false' in kitchenowl_env_lines"
          - "'DISABLE_ONBOARDING=true' in kitchenowl_env_lines"
          - kitchenowl_env_lines | select('match', '^JWT_SECRET_KEY=[0-9a-f]{64}$') | list | length == 1

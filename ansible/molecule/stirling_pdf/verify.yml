---
- name: Verify
  hosts: all
  vars_files:
    - ../../group_vars/all/variables.yml
  tasks:
    # Sans état à garder : aucune configuration borgmatic.
    - name: Verify the stirling_pdf deployment
      ansible.builtin.include_tasks: ../_shared/tasks/verify_app.yml
      vars:
        verify_app_service: stirling_pdf
        verify_app_borgmatic_config: ""

    - name: Stat the stirling_pdf borgmatic configuration
      become: true
      ansible.builtin.stat:
        path: "{{ borgmatic_config_dir }}/stirling_pdf.yaml"
      register: stirling_pdf_borgmatic

    - name: Assert stirling_pdf is not backed up
      ansible.builtin.assert:
        that:
          - not stirling_pdf_borgmatic.stat.exists

    - name: Stat the stirling_pdf environment file
      ansible.builtin.stat:
        path: "{{ docker_base_path }}/stirling_pdf/.env"
      register: stirling_pdf_env

    - name: Assert the stirling_pdf environment file is private
      ansible.builtin.assert:
        that:
          - stirling_pdf_env.stat.exists
          - stirling_pdf_env.stat.mode == '0600'

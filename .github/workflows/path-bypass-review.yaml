name: Relecture des chemins publics

# Les chemins que local.path_bypasses ouvre sans SSO au monde entier ont été
# relus dans les sources d'UNE version de chaque image, notée dans
# tofu/pangolin_config/path_bypass_images.json. Renovate y monte la version en
# même temps que le compose (customManagers de renovate.json) : la PR ne
# demande aucun commit, mais ce workflow la retient sur l'environnement
# relecture-chemins-publics (relecteur obligatoire, posé par
# tofu/github/environments.tf) tant que personne n'a lu les notes de version
# et les sources listées dans le résumé, puis cliqué « Review deployments »
# → « Approve and deploy » sur l'exécution. Rien n'est déployé : l'approbation
# ne fait que passer ce check au vert.
#
# Si la relecture montre qu'une route ouverte a bougé, la liste de chemins de
# l'app (website_<app>.tf) se corrige dans la même PR, avant d'approuver.

on:
  pull_request:
    paths:
      - tofu/pangolin_config/path_bypass_images.json

# Un nouveau push (rebase de Renovate) remplace l'attente en cours : seule la
# dernière version de la PR est à approuver.
concurrency:
  group: path-bypass-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Versions à relire
    runs-on: ubuntu-26.04

    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the reviewed versions with the base branch
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FILE: tofu/pangolin_config/path_bypass_images.json
        run: |
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          base="$RUNNER_TEMP/base.json"
          git show "$BASE_SHA:$FILE" > "$base" 2>/dev/null || echo '{}' > "$base"

          # Toute version qui CHANGE (montée ou retour arrière) est à relire.
          # Une entrée absente de la base est une app qu'on ajoute à la main :
          # son auteur vient de relever ses chemins dans cette version (voir
          # le skill pangolin-route), Renovate n'en crée jamais.
          changes=$(jq -c --slurpfile base "$base" '
            [to_entries[]
              | select($base[0][.key] != null and .value.version != $base[0][.key].version)
              | .value + {app: .key, from: $base[0][.key].version}]
          ' "$FILE")

          if [ "$changes" = "[]" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aucune version relue n'a changé : rien à approuver." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "## Chemins publics à relire avant d'approuver"
            echo
            echo "Pour chaque image, lire les notes de version et, dans les sources de la nouvelle version, les fichiers listés : une route non authentifiée apparue sous un préfixe ouvert, ou un partage déplacé, impose de corriger la liste de chemins dans cette PR. Sinon, approuver l'environnement **relecture-chemins-publics** sur cette exécution."
            echo
            jq -r '.[] | "### \(.app) : `\(.image)` \(.from) → \(.version)\n\n- Notes de version : \(.releases)\n- Sources à relire : \(.reread)\n- Chemins ouverts : `\(.paths)`\n"' <<< "$changes"
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Relecture approuvée
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    environment: relecture-chemins-publics

    steps:
      - name: Record the approval
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "Relecture des chemins publics approuvée pour $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"

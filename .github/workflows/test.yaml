name: Tests

# Sur une PR, seuls les scénarios Molecule et les modules Tofu qu'atteignent
# les fichiers modifiés tournent (.github/scripts/select_tests.py). La matrice
# complète tourne chaque semaine sur main (le lundi à 03:30 UTC, avant Trivy
# et CodeQL), à la main (workflow_dispatch), et sur
# une PR qui porte le label full-tests. Plus de run sur push : le run de la
# semaine rattrape ce qu'une sélection aurait manqué.
on:
  pull_request:
    # labeled : poser full-tests relance la PR en matrice complète.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

# Un nouveau push sur une PR annule le run qu'il rend caduc ; le run planifié et les
# lancements à la main vont jusqu'au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Chaque job déclare les siennes.
permissions: {}

jobs:
  discover:
    name: Discover test suites
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      # Lit le paquet GHCR de l'image Molecule (présence du tag).
      packages: read

    outputs:
      scenarios: ${{ steps.discover.outputs.scenarios }}
      shards: ${{ steps.discover.outputs.shards }}
      modules: ${{ steps.discover.outputs.modules }}
      image_present: ${{ steps.image.outputs.present }}

    steps:
      # Sur une PR, HEAD est le commit de fusion de test : son premier parent
      # est la pointe de la branche de base, d'où la profondeur 2.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # pyyaml (lu par select_tests.py) à la version d'uv.lock.
      - name: Install the selection dependencies
        run: |
          pip install --quiet --only-binary :all: uv==0.13.7
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Un scénario par dossier ansible/molecule/<rôle>/ (sauf _shared), un
      # module Tofu par dossier tofu/<module>/ qui a des tests : un nouveau
      # scénario ou module testé entre dans la matrice sans toucher ce fichier.
      # Sur une PR, select_tests.py n'en garde que ce que les fichiers modifiés
      # atteignent ; un fichier qu'il ne sait pas classer relance tout.
      - name: Select Molecule scenarios and tested Tofu modules
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_TESTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-tests') }}
        run: |
          # tests/.disabled écarte un module qui ne peut pas tourner, avec sa
          # raison, affichée en avertissement sur chaque exécution.
          for disabled in tofu/*/tests/.disabled; do
            [ -e "$disabled" ] || continue
            echo "::warning file=$disabled::${disabled%/tests/.disabled} non testé : $(head -n1 "$disabled")"
          done

          changed="$RUNNER_TEMP/changed-files.txt"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::notice::$EVENT_NAME : matrice complète"
            selection="$(python3 .github/scripts/select_tests.py --all)"
          elif [ "$FULL_TESTS_LABEL" = "true" ]; then
            echo "::notice::label full-tests : matrice complète"
            selection="$(python3 .github/scripts/select_tests.py --all)"
          # --no-renames : un renommage liste aussi l'ancien chemin, celui
          # que lisent les suites restées sur lui.
          elif ! git diff --no-renames --name-only HEAD^1 HEAD > "$changed"; then
            echo "::warning::fichiers modifiés illisibles (git diff HEAD^1 HEAD) : matrice complète"
            selection="$(python3 .github/scripts/select_tests.py --all)"
          else
            echo "Fichiers modifiés par la PR :"
            # Indentés : un nom de fichier en début de ligne serait lu comme
            # une commande de workflow (::error::, ::stop-commands::...).
            sed 's/^/  /' "$changed"
            selection="$(python3 .github/scripts/select_tests.py < "$changed")"
          fi

          scenarios="$(jq -c .scenarios <<< "$selection")"
          modules="$(jq -c .modules <<< "$selection")"
          # Au plus 8 jobs Molecule : les scénarios sont répartis en tourniquet,
          # chaque job installe son environnement une fois puis les enchaîne.
          shards="$(jq -c '. as $s | ([($s | length), 8] | min) as $k
            | [range(0; $k) as $i | {id: ($i + 1), scenarios: [$s | to_entries[] | select(.key % $k == $i) | .value]}]' <<< "$scenarios")"
          {
            echo "scenarios=$scenarios"
            echo "shards=$shards"
            echo "modules=$modules"
          } >> "$GITHUB_OUTPUT"
          echo "Molecule: $scenarios"
          echo "Tofu: $modules"
          {
            echo "### Suites sélectionnées"
            echo
            echo "- Molecule ($(jq length <<< "$scenarios")) : $(jq -r 'join(", ")' <<< "$scenarios")"
            echo "- Tofu ($(jq length <<< "$modules")) : $(jq -r 'join(", ")' <<< "$modules")"
          } >> "$GITHUB_STEP_SUMMARY"

      # L'image Molecule est publiée sur GHCR par molecule-image.yaml (tag =
      # empreinte du Dockerfile). Absente (Dockerfile modifié par cette PR, PR
      # de fork sans droit de lecture) : le job image la construit dans le cache.
      - name: Check that the Molecule image is published
        id: image
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ hashFiles('ansible/molecule/_shared/Dockerfile') }}
        run: |
          present=false
          if echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null 2>&1 \
            && docker manifest inspect "ghcr.io/sylvainmetayer/homelab-molecule:$IMAGE_TAG" >/dev/null 2>&1; then
            present=true
          fi
          echo "Image GHCR publiée : $present"
          echo "present=$present" >> "$GITHUB_OUTPUT"

  # Repli : sans image publiée sur GHCR pour ce Dockerfile (voir discover),
  # construit l'image une fois par run et la range dans le cache GitHub
  # Actions ; chaque job Molecule la recharge de ce cache au lieu de la
  # reconstruire. La portée suit le Dockerfile (il ne copie rien du contexte) :
  # une image changée repart d'un cache neuf. Les entrées écrites depuis main
  # (le run planifié) servent à toutes les PR, celles d'une PR à elle seule.
  image:
    name: Molecule image
    needs: discover
    if: needs.discover.outputs.scenarios != '[]' && needs.discover.outputs.image_present != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the Molecule image into the cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ansible/molecule/_shared
          tags: homelab-molecule:debian13
          outputs: type=cacheonly
          # Le run planifié repart de zéro (paquets apt non épinglés) et rafraîchit
          # le cache : sinon la CI testerait pour toujours la première image
          # construite pour ce Dockerfile.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=molecule-${{ hashFiles('ansible/molecule/_shared/Dockerfile') }}
          cache-to: type=gha,mode=max,scope=molecule-${{ hashFiles('ansible/molecule/_shared/Dockerfile') }}

  # Un job par tranche de scénarios (8 au plus, discover) : environnement
  # installé une fois, scénarios enchaînés. Un échec n'arrête pas la tranche :
  # tous les scénarios tournent, ceux qui ont échoué sont listés dans le
  # résumé et le job échoue à la fin.
  molecule:
    name: Molecule (tranche ${{ matrix.shard.id }})
    needs: [discover, image]
    # image est sautée quand l'image GHCR existe : !cancelled() lève le saut en
    # cascade, mais un échec de image bloque.
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.image.result != 'failure' && needs.discover.outputs.scenarios != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    permissions:
      contents: read
      packages: read

    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ansible + molecule
        run: |
          pip install --quiet --only-binary :all: uv==0.13.7
          uv sync --locked --no-build --group test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Rôles et collections Galaxy en cache sous l'empreinte de requirements.yml
      # (versions figées) : un pas de 30 à 75 s par job, et plus de dépendance à
      # Galaxy quand le cache est chaud. Les entrées écrites depuis main (le run
      # planifié) servent à toutes les PR.
      - name: Cache the Galaxy roles and collections
        id: galaxy
        # Le job ne publie rien : l'image du pas suivant est chargée (load: true), pas poussée.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            ansible/galaxy_roles
            ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

      # Toute la matrice interroge Galaxy en même temps : il lui arrive de
      # couper une connexion (ECONNRESET), on retente avant d'échouer.
      - name: Install ansible roles and collections
        if: steps.galaxy.outputs.cache-hit != 'true'
        working-directory: ansible
        run: |
          for attempt in 1 2 3; do
            ansible-galaxy role install -r requirements.yml \
              && ansible-galaxy collection install -r requirements.yml \
              && exit 0
            echo "Galaxy install failed (attempt $attempt), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      # Même tag que `mise run molecule-image` : .config/molecule/config.yml
      # le cherche dans le démon local (pull: false).
      - name: Pull the Molecule image from GHCR
        if: needs.discover.outputs.image_present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ hashFiles('ansible/molecule/_shared/Dockerfile') }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          docker pull --quiet "ghcr.io/sylvainmetayer/homelab-molecule:$IMAGE_TAG"
          docker tag "ghcr.io/sylvainmetayer/homelab-molecule:$IMAGE_TAG" homelab-molecule:debian13

      - name: Set up Docker Buildx
        if: needs.discover.outputs.image_present != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Load the Molecule image from the cache
        if: needs.discover.outputs.image_present != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ansible/molecule/_shared
          tags: homelab-molecule:debian13
          load: true
          cache-from: type=gha,scope=molecule-${{ hashFiles('ansible/molecule/_shared/Dockerfile') }}

      - name: Run molecule test
        working-directory: ansible
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SCENARIOS: ${{ join(matrix.shard.scenarios, ' ') }}
          SHARD: ${{ matrix.shard.id }}
        run: |
          failed=()
          for scenario in $SCENARIOS; do
            echo "::group::molecule test $scenario"
            if ! molecule test --scenario-name "$scenario"; then
              failed+=("$scenario")
              echo "::error::Scénario $scenario en échec"
            fi
            echo "::endgroup::"
          done
          {
            echo "### Tranche $SHARD"
            echo
            echo "- Scénarios : $SCENARIOS"
            echo "- En échec : ${failed[*]:-aucun}"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${#failed[@]}" -eq 0 ]

  tofu:
    name: OpenTofu test (${{ matrix.module }})
    needs: discover
    if: needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Même version qu'en local (mise.toml) : la sémantique des mocks et des
      # overrides de `tofu test` évolue d'une version à l'autre.
      - name: Read the OpenTofu version pinned in mise.toml
        id: tofu-version
        run: echo "version=$(sed -n "s/^opentofu = '\(.*\)'$/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}
          tofu_wrapper: false

      - name: Fetch the fork of the Pangolin provider
        if: matrix.module == 'tofu/pangolin_config'
        run: .github/scripts/fetch_pangolin_provider.sh

      # Providers mockés (mock_provider) et data sources surchargées
      # (override_data) : ni backend, ni credentials, ni secrets SOPS.
      # Même remède que Galaxy : la matrice interroge le registre OpenTofu en
      # même temps et une connexion coupée ne doit pas faire échouer le job.
      - name: Init without backend
        env:
          MODULE: ${{ matrix.module }}
        run: |
          for attempt in 1 2 3; do
            tofu -chdir="$MODULE" init -backend=false -input=false && exit 0
            echo "tofu init failed (attempt $attempt), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run tofu test
        env:
          MODULE: ${{ matrix.module }}
        run: tofu -chdir="$MODULE" test -no-color

  # Seul check requis par le ruleset de main (tofu/github/ruleset_homelab.tf) :
  # les jobs de la matrice changent de nom à chaque scénario ajouté ou retiré.
  # Vert si chaque suite a réussi, ou n'avait rien à tester (une PR de
  # documentation : matrices vides, jobs sautés).
  tests:
    name: Tests
    needs: [discover, image, molecule, tofu]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Check that every test suite passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null

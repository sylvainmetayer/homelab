name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yaml
      - .config/molecule/**
      - ansible/**
      - tofu/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

jobs:
  discover:
    name: Discover test suites
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    outputs:
      scenarios: ${{ steps.discover.outputs.scenarios }}
      modules: ${{ steps.discover.outputs.modules }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Un scénario par dossier ansible/molecule/<rôle>/ (sauf _shared), un
      # module Tofu par dossier tofu/<module>/ qui a des tests : un nouveau
      # scénario ou module testé entre dans la matrice sans toucher ce fichier.
      - name: List Molecule scenarios and tested Tofu modules
        id: discover
        run: |
          to_json='split("\n") | map(select(length > 0))'
          scenarios=$(find ansible/molecule -mindepth 2 -maxdepth 2 -name molecule.yml -printf '%h\n' \
            | xargs -r -n1 basename | sort | jq -Rsc "$to_json")
          # tests/.disabled écarte un module qui ne peut pas tourner, avec sa
          # raison, affichée en avertissement sur chaque exécution.
          for disabled in tofu/*/tests/.disabled; do
            [ -e "$disabled" ] || continue
            echo "::warning file=$disabled::${disabled%/tests/.disabled} non testé : $(head -n1 "$disabled")"
          done
          modules=$(find tofu -mindepth 2 -maxdepth 2 -type d -name tests ! -exec test -e '{}/.disabled' ';' -printf '%h\n' \
            | sort | jq -Rsc "$to_json")
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Molecule: $scenarios"
          echo "Tofu: $modules"

  molecule:
    name: Molecule (${{ matrix.scenario }})
    needs: discover
    if: needs.discover.outputs.scenarios != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.discover.outputs.scenarios) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ansible + molecule
        run: |
          pip install --quiet --only-binary :all: uv==0.12.23
          uv sync --locked --no-build --group test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Toute la matrice interroge Galaxy en même temps : il lui arrive de
      # couper une connexion (ECONNRESET), on retente avant d'échouer.
      - name: Install ansible roles and collections
        working-directory: ansible
        run: |
          for attempt in 1 2 3; do
            ansible-galaxy role install -r requirements.yml \
              && ansible-galaxy collection install -r requirements.yml \
              && exit 0
            echo "Galaxy install failed (attempt $attempt), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build the Molecule image
        run: docker build --tag homelab-molecule:debian13 ansible/molecule/_shared

      - name: Run molecule test
        working-directory: ansible
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
          SCENARIO: ${{ matrix.scenario }}
        run: molecule test --scenario-name "$SCENARIO"

  tofu:
    name: OpenTofu test (${{ matrix.module }})
    needs: discover
    if: needs.discover.outputs.modules != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Même version qu'en local (mise.toml) : la sémantique des mocks et des
      # overrides de `tofu test` évolue d'une version à l'autre.
      - name: Read the OpenTofu version pinned in mise.toml
        id: tofu-version
        run: echo "version=$(sed -n "s/^opentofu = '\(.*\)'$/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}
          tofu_wrapper: false

      # Providers mockés (mock_provider) et data sources surchargées
      # (override_data) : ni backend, ni credentials, ni secrets SOPS.
      # Même remède que Galaxy : la matrice interroge le registre OpenTofu en
      # même temps et une connexion coupée ne doit pas faire échouer le job.
      - name: Init without backend
        env:
          MODULE: ${{ matrix.module }}
        run: |
          for attempt in 1 2 3; do
            tofu -chdir="$MODULE" init -backend=false -input=false && exit 0
            echo "tofu init failed (attempt $attempt), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run tofu test
        env:
          MODULE: ${{ matrix.module }}
        run: tofu -chdir="$MODULE" test -no-color

  # Seul check requis par le ruleset de main (tofu/github/ruleset_homelab.tf) :
  # les jobs de la matrice changent de nom à chaque scénario ajouté ou retiré.
  # Vert si chaque suite a réussi, ou n'avait rien à tester.
  tests:
    name: Tests
    needs: [discover, molecule, tofu]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Check that every test suite passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null

name: Essai capdrop (temporaire)

# Essai rootful des capacités de rss et dawarich-app, images jetables et données
# fictives, sans secret ni déploiement. Retiré de la PR une fois l'essai lu.
on:
  pull_request:
    paths:
      - .github/capdrop-essai/**
      - .github/workflows/capdrop-essai.yaml

permissions: {}

jobs:
  essai:
    name: Essai ${{ matrix.app }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: rss
            sets: >-
              defaut aucune
              DAC_READ_SEARCH,FOWNER,KILL,SETGID,SETUID
              CHOWN,FOWNER,KILL,SETGID,SETUID
              CHOWN,DAC_READ_SEARCH,KILL,SETGID,SETUID
              CHOWN,DAC_READ_SEARCH,FOWNER,SETGID,SETUID
              CHOWN,DAC_READ_SEARCH,FOWNER,KILL,SETUID
              CHOWN,DAC_READ_SEARCH,FOWNER,KILL,SETGID
              CHOWN,DAC_READ_SEARCH,FOWNER,KILL,SETGID,SETUID
          - app: dawarich
            sets: >-
              defaut aucune
              CHOWN,SETUID,SETGID
              DAC_READ_SEARCH,SETUID,SETGID
              CHOWN,DAC_READ_SEARCH,SETGID
              CHOWN,DAC_READ_SEARCH,SETUID
              CHOWN,DAC_READ_SEARCH,SETUID,SETGID
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the capability matrix
        env:
          APP: ${{ matrix.app }}
          SETS: ${{ matrix.sets }}
        run: |
          docker version --format '{{.Server.Version}}'
          # shellcheck disable=SC2086 # SETS : un jeu par mot.
          WORK="$(mktemp -d -p "$RUNNER_TEMP")" ENGINE=docker bash .github/capdrop-essai/capdrop-essai.sh "$APP" $SETS

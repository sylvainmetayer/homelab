name: Lint

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/workflows/lint.yaml
      - ansible/**
      - tofu/**
      - pyproject.toml
      - mise.toml
  workflow_dispatch:

jobs:
  ansible:
    name: Ansible lint
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Versions d'uv.lock (ansible-core, ansible-lint), comme test.yaml :
      # Renovate ne bumpe que le lock, un pin écrit ici dériverait.
      - name: Install ansible + deps
        run: |
          pip install --quiet --only-binary :all: uv==0.12.23
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install ansible roles and collections
        working-directory: ansible
        run: |
          ansible-galaxy role install -r requirements.yml
          ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint

      # Une clé de secrets.sops.yaml (couche include_vars) l'emporte sur les
      # vars: de play, d'entrée roles:, de bloc, de tâche et sur vars/ d'un
      # rôle : une surcharge du même nom perdrait sans un mot (AGENTS.md).
      - name: Check that no SOPS key shadows a vars entry
        run: python -I .github/scripts/check_sops_shadowing.py

  tofu:
    name: OpenTofu lint
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2

      - name: Check formatting
        run: tofu fmt -check -recursive tofu

      - name: Validate modules
        run: |
          modules=(
            tofu/pangolin
            tofu/proxmox
            tofu/pangolin_config
            tofu/dns
            tofu/github
            tofu/ref
            tofu/s3_state
            tofu/site
            tofu/1y
          )

          for module in "${modules[@]}"; do
            echo "Validating $module"
            tofu -chdir="$module" init -backend=false -input=false
            tofu -chdir="$module" validate -no-color
          done

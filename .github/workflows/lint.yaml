name: Lint

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .github/**
      - .hadolint.yaml
      - ansible/molecule/_shared/Dockerfile
      - ansible/**
      - tofu/**
      - pyproject.toml
      - mise.toml
      # Sous-module du dépôt privé homelab-secrets (ADR 0018) : un bump du
      # commit épinglé relance les contrôles des fichiers SOPS.
      - secrets
      - .gitmodules
      - .sops.yaml
      # docs/runbooks/test-cle-secours.md (dernier_test) et le site de doc.
      - docs/**
      - mkdocs.yml
  workflow_dispatch:

# Pas de paths-ignore pour la documentation : Ansible lint, OpenTofu lint et
# CI lint sont requis par le ruleset de main, une PR où ils ne partiraient pas
# attendrait ces checks pour toujours.
# Un nouveau push sur une PR annule le run qu'il rend caduc. Hors PR, un
# groupe par run : GitHub ne garde qu'un run en attente par groupe, une
# rafale de merges annulerait sinon le lint des commits intermédiaires de main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ansible:
    name: Ansible lint
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Versions d'uv.lock (ansible-core, ansible-lint), comme test.yaml :
      # Renovate ne bumpe que le lock, un pin écrit ici dériverait.
      - name: Install ansible + deps
        run: |
          pip install --quiet --only-binary :all: uv==0.13.7
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Rôles et collections Galaxy en cache sous l'empreinte de requirements.yml
      # (versions figées) : un pas de 30 à 75 s par job, et plus de dépendance à
      # Galaxy quand le cache est chaud. Les entrées écrites depuis main (le run
      # planifié) servent à toutes les PR.
      - name: Cache the Galaxy roles and collections
        id: galaxy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ansible/galaxy_roles
            ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install ansible roles and collections
        if: steps.galaxy.outputs.cache-hit != 'true'
        working-directory: ansible
        run: |
          ansible-galaxy role install -r requirements.yml
          ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint

      # Fichiers SOPS et inventaire de rotation : sous-module secrets/, dépôt
      # privé homelab-secrets (ADR 0018). Les contrôles qui suivent les lisent ;
      # sans le secret (PR de fork), ce pas échoue et eux avec. Même après un
      # échec d'ansible-lint : les contrôles en !cancelled() en ont besoin.
      - name: Checkout the secrets submodule
        if: ${{ !cancelled() }}
        uses: ./.github/actions/secrets-checkout # zizmor: ignore[self-repository]
        with:
          ssh-key: ${{ secrets.HOMELAB_SECRETS_SSH_KEY }}

      # Une clé de secrets/ansible.sops.yaml (couche include_vars) l'emporte sur les
      # vars: de play, d'entrée roles:, de bloc, de tâche et sur vars/ d'un
      # rôle : une surcharge du même nom perdrait sans un mot (AGENTS.md).
      - name: Check that no SOPS key shadows a vars entry
        run: python -I .github/scripts/check_sops_shadowing.py

      # Chaque clé des deux fichiers SOPS a son entrée dans
      # secrets/secrets-rotation.yaml (nature, dernière rotation, procédure),
      # et chaque entrée sa clé. Les échéances : workflow secrets-rotation.yaml.
      - name: Check the secret rotation inventory
        if: ${{ !cancelled() }}
        run: python -I .github/scripts/check_secret_rotation.py

      # Chaque fichier SOPS chiffré pour les destinataires de sa règle de
      # .sops.yaml, la clé secours comprise : un fichier rechiffré sans elle ne
      # s'ouvrirait plus avec la clé hors ligne (docs/runbooks/test-cle-secours.md).
      - name: Check the age recipients of the SOPS files
        if: ${{ !cancelled() }}
        run: python -I .github/scripts/check_age_recipients.py

      # ADR 0018 : aucun fichier SOPS dans ce dépôt public (ils vivent dans le
      # sous-module secrets/). Le .sops.yaml de la racine est la configuration.
      - name: Check that no SOPS file is tracked outside the secrets submodule
        if: ${{ !cancelled() }}
        run: |
          found="$(git ls-files | grep -E '[^/]\.sops\.ya?ml$' || true)"
          if [ -n "$found" ]; then echo "::error::SOPS file tracked in the public repository (ADR 0018): $found"; exit 1; fi

      # Renovate monte immich-server et immich-machine-learning dans un même
      # groupe, mais une recherche de tags en échec le fait partir avec une
      # seule image (#753) : la PR échoue ici au lieu de décaler les versions.
      - name: Check that the Immich images share one version
        if: ${{ !cancelled() }}
        run: python -I .github/scripts/check_immich_versions.py

      # Molecule ne démarre aucune image : un service qui perd no-new-privileges,
      # ou qui naît sans, ne se verrait nulle part (docs/conventions/container-hardening.md).
      - name: Check no-new-privileges on the compose services
        if: ${{ !cancelled() }}
        run: python -I .github/scripts/check_container_hardening.py

      # Le tofu test de pangolin_config tient apps.json égal aux moniteurs de
      # sauvegarde : une sauvegarde sans moniteur ne serait testée nulle part
      # (.github/restore-test/README.md).
      - name: Check that every borg backup is restore-tested or excluded
        if: ${{ !cancelled() }}
        run: python -I .github/scripts/check_restore_coverage.py

      # mermaid.min.js de mkdocs_mermaid.py, en cache sous l'empreinte du
      # script (qui porte la version et le sha256 épinglés) : le build ne dépend
      # pas de jsDelivr à chaque run (le script revérifie le sha256 du fichier
      # restauré).
      - name: Cache Mermaid
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/homelab-mkdocs
          key: mermaid-${{ hashFiles('.github/scripts/mkdocs_mermaid.py') }}

      # Le site docs.sylvain.cloud (rôle docs_site) : un lien cassé ou une
      # page absente de nav: échoue ici, pas au déploiement après le merge.
      - name: Build the documentation site
        if: ${{ !cancelled() }}
        run: python .github/scripts/mkdocs_build.py --site-dir "$RUNNER_TEMP/site"

      # resolve_docker_tags.py choisit ce qu'un merge déploie sur les hôtes.
      - name: Test the CI scripts
        # Même si ansible-lint a échoué : deux régressions dans une seule passe.
        if: ${{ !cancelled() }}
        run: python -I -m unittest discover -s .github/scripts -p 'test_*.py'

  tofu:
    name: OpenTofu lint
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Même version qu'en local (mise.toml), comme test.yaml.
      - name: Read the OpenTofu version pinned in mise.toml
        id: tofu-version
        run: echo "version=$(sed -n "s/^opentofu = '\(.*\)'$/\1/p" mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}

      - name: Check formatting
        run: tofu fmt -check -recursive tofu

      - name: Fetch the fork of the Pangolin provider
        run: .github/scripts/fetch_pangolin_provider.sh

      - name: Validate modules
        run: |
          modules=(
            tofu/pangolin
            tofu/proxmox
            tofu/pangolin_config
            tofu/dns
            tofu/github
            tofu/ref
            tofu/s3_state
            tofu/keepass_backup
            tofu/site
            tofu/1y
            tofu/keycloak_demo_planning_kc
            tofu/planning
          )

          for module in "${modules[@]}"; do
            echo "Validating $module"
            tofu -chdir="$module" init -backend=false -input=false -lockfile=readonly
            tofu -chdir="$module" validate -no-color
          done

  # Les workflows déploient avec des secrets : zizmor (actions épinglées par
  # SHA, injections de gabarit, identifiants persistés), actionlint (syntaxe,
  # expressions), et hadolint pour le Dockerfile de Molecule. Binaires
  # épinglés et vérifiés, pas d'action tierce référencée par tag.
  ci:
    name: CI lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # renovate: datasource=github-releases depName=hadolint/hadolint
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      # Sans somme : uvx l'installe depuis PyPI (en épingler une demande un
      # fichier d'exigences avec hachages, plus qu'une ligne).
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: 1.30.1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install the linters
        run: |
          pip install --quiet --only-binary :all: uv==0.13.7
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint

      # .github et pas .github/workflows : les actions composites
      # (.github/actions, dont olm-tunnel et ses secrets) sont auditées aussi.
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-build "zizmor==${ZIZMOR_VERSION}" --format github .github

      - name: Run actionlint
        run: /tmp/actionlint -color

      - name: Run hadolint
        run: /tmp/hadolint ansible/molecule/_shared/Dockerfile


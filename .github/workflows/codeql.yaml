name: CodeQL

# Analyse CodeQL (configuration avancée) des workflows (langage actions) et du
# Python du dépôt. Elle remplace la configuration par défaut de GitHub, qui
# analysait chaque push et chaque PR : ici, une fois par semaine sur main,
# plus les PR et pushes qui touchent les scripts de la CI ou ce fichier. Les
# workflows sont déjà relus à chaque PR par zizmor et actionlint (job CI lint
# de lint.yaml) ; le reste du Python (rôles, inventaires) attend le run de la
# semaine.
#
# Configuration avancée et configuration par défaut s'excluent : celle par
# défaut doit être désactivée (Settings → Code security → CodeQL analysis),
# sinon GitHub refuse les résultats de ce workflow.
on:
  schedule:
    # Le lundi à 04:30 UTC, après les tests de la semaine (03:30).
    - cron: "30 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/codeql.yaml
  pull_request:
    paths:
      - .github/scripts/**
      - .github/workflows/codeql.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

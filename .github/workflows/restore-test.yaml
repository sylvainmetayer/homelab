name: Restore test

# Restaure la dernière archive de chaque dépôt borg sur un runner, loin des
# hôtes qui la produisent (issue #444) : voir .github/restore-test/README.md.
# Le 1er et le 15 : le moniteur « Restore test » attend un push tous les
# 20 jours au plus (le provider Uptime Kuma plafonne à 24).
on:
  schedule:
    - cron: "0 10 1,15 * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps à tester, séparées par des virgules (vide : toutes, et le moniteur reçoit le résultat)"
        required: false
        default: ""
  pull_request:
    paths:
      - .github/workflows/restore-test.yaml
      - .github/scripts/restore_test.py
      - .github/restore-test/**

permissions:
  contents: read

# Un run manuel pendant celui du cron attend : la Storage Box n'est lue
# qu'une fois à la fois. Les runs de PR (rien n'est restauré) ont leur propre
# groupe : un run en attente y est remplacé par le suivant, et ce ne doit
# jamais être celui du cron.
concurrency:
  group: restore-test-${{ github.event_name == 'pull_request' && github.ref || 'storage-box' }}
  cancel-in-progress: false

jobs:
  discover:
    name: List repositories
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select repositories
        id: apps
        env:
          SELECTED: ${{ inputs.apps }}
        run: |
          all=$(jq -c 'keys' .github/restore-test/apps.json)
          if [ -n "$SELECTED" ]; then
            apps=$(jq -nc --arg sel "$SELECTED" \
              '$sel | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))')
            # Une faute de frappe ne doit pas donner un run vert qui n'a rien testé.
            unknown=$(jq -nr --argjson all "$all" --argjson apps "$apps" '$apps - $all | join(",")')
            if [ -n "$unknown" ]; then
              echo "::error::apps inconnues de apps.json : $unknown"
              exit 1
            fi
            if [ "$apps" = "[]" ]; then
              echo "::error::aucune app dans « $SELECTED »"
              exit 1
            fi
          else
            apps=$all
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Repositories: $apps"

      # Sur une PR, rien n'est restauré (pas de secrets) : on vérifie
      # seulement que le script se charge et que le manifeste est cohérent
      # (l'accord avec les moniteurs de sauvegarde est un tofu test de
      # pangolin_config).
      - name: Check the script and the manifest
        run: |
          python3 -I -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' .github/scripts/restore_test.py
          jq -e 'to_entries | all(.value.host and .value.repo and .value.role)' .github/restore-test/apps.json
          jq -e 'all(.[]; (.allow_empty_databases // []) | type == "array" and all(type == "string"))' .github/restore-test/apps.json \
            || { echo "::error::allow_empty_databases doit être une liste de noms de bases"; exit 1; }
          for role in $(jq -r '.[].role' .github/restore-test/apps.json); do
            test -d "ansible/roles/$role" || { echo "::error::rôle $role absent"; exit 1; }
          done

  restore:
    name: Restore (${{ matrix.app }})
    needs: discover
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    # Secrets lisibles depuis main seulement (tofu/github/restore_test_secrets.tf).
    environment: restore-test
    timeout-minutes: 60

    strategy:
      fail-fast: false
      # Ménage la Storage Box (et la bande passante d'immich/nextcloud).
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La version et le sha256 des hôtes (rôle borgmatic, Renovate les fait
      # monter ensemble) : un dépôt écrit par borg 1.x se lit avec borg 1.x.
      - name: Install borg and sqlite3
        run: |
          defaults=ansible/roles/borgmatic/defaults/main.yml
          borg_version=$(sed -n 's/^borgmatic_borg_version: "\(.*\)"$/\1/p' "$defaults")
          borg_sha256=$(sed -n 's/^  x86_64: \([0-9a-f]\{64\}\)$/\1/p' "$defaults")
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/borg \
            "https://github.com/borgbackup/borg/releases/download/${borg_version}/borg-linux-glibc235-x86_64-gh"
          echo "${borg_sha256}  /tmp/borg" | sha256sum -c -
          sudo install -m 0755 /tmp/borg /usr/local/bin/borg
          borg --version
          # Déjà dans l'image du runner d'ordinaire : pas d'apt-get par job.
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends sqlite3
          fi

      # Sous-compte en lecture seule (tofu/pangolin/storage_box.tf), jamais
      # la clé du compte principal ni celle d'un hôte. Clé d'hôte épinglée,
      # la même que celle des hôtes (group_vars/all, backup_storage_box_host_key).
      - name: Configure the Storage Box access
        env:
          RESTORE_TEST_SSH_KEY: ${{ secrets.RESTORE_TEST_SSH_KEY }}
          RESTORE_TEST_STORAGE_BOX: ${{ secrets.RESTORE_TEST_STORAGE_BOX }}
        run: |
          host_key=$(sed -n 's/^backup_storage_box_host_key: "\(.*\)"$/\1/p' ansible/group_vars/all/variables.yml)
          test -n "$host_key"
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$RESTORE_TEST_SSH_KEY" > ~/.ssh/restore_test)
          printf '[%s]:23 %s\n' "${RESTORE_TEST_STORAGE_BOX#*@}" "$host_key" > ~/.ssh/restore_test_known_hosts
          echo "BORG_RSH=ssh -i $HOME/.ssh/restore_test -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/restore_test_known_hosts" >> "$GITHUB_ENV"
          echo "BORG_REPO_BASE=ssh://${RESTORE_TEST_STORAGE_BOX}:23/." >> "$GITHUB_ENV"

      # Sous le timeout du job : un dépassement d'étape est un échec (le job
      # passe en failure, le moniteur reçoit « down »), un dépassement de job
      # une annulation, que le job report prend pour un arrêt manuel.
      - name: Restore and check
        timeout-minutes: 50
        env:
          BORG_PASSPHRASE: ${{ secrets.RESTORE_TEST_BORG_PASSPHRASE }}
          APP: ${{ matrix.app }}
          BORG_RELOCATED_REPO_ACCESS_IS_OK: "yes"
        run: python3 -I .github/scripts/restore_test.py "$APP"

  # Un seul moniteur pour tous les dépôts, et seulement sur un run complet :
  # un run manuel sur quelques apps ne dit rien des autres.
  report:
    name: Report to Uptime Kuma
    needs: [discover, restore]
    if: always() && github.event_name != 'pull_request' && !inputs.apps
    runs-on: ubuntu-26.04
    environment: restore-test
    timeout-minutes: 5
    steps:
      - name: Push the result
        env:
          PUSH_URL: ${{ secrets.RESTORE_TEST_PUSH_URL }}
          DISCOVER: ${{ needs.discover.result }}
          RESTORE: ${{ needs.restore.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DISCOVER" = success ] && [ "$RESTORE" = success ]; then
            status=up msg="tous les dépôts restaurés"
          elif [ "$DISCOVER" = cancelled ] || [ "$RESTORE" = cancelled ]; then
            # Run annulé à la main : rien à dire, le moniteur attend le suivant.
            echo "Run annulé, rien n'est poussé."
            exit 0
          else
            status=down msg="échec ($RESTORE) : $RUN_URL"
          fi
          curl --proto '=https' --tlsv1.2 -fsS -o /dev/null -G "$PUSH_URL" \
            --data-urlencode "status=$status" --data-urlencode "msg=$msg" --data-urlencode "ping="
          echo "Restore test: $status"

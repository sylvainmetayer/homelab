name: Verify actions lock

# .github/workflows/actions.lock fige chaque action des workflows à un commit
# (ADR 0036, docs/conventions/ci.md). Ce workflow échoue si le verrou ne suit
# plus les `uses:` ou si un commit verrouillé n'est plus celui du dépôt amont.
# Pas de filtre de chemins : une PR qui ne touche aucun workflow doit aussi le
# passer, et le verrou peut vieillir sans que les workflows changent.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    name: Actions lock
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      contents: read

    env:
      # L'extension est un binaire : sa version est épinglée par son tag
      # (`gh extension install --pin` n'accepte pas de somme). Renovate la suit
      # avec `constraints.ghActionsLock` de renovate.json, un seul PR pour les deux.
      # renovate: datasource=github-releases depName=github/gh-actions-lock
      GH_ACTIONS_LOCK_VERSION: v0.4.1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"

      # --ignore-local-actions : les actions composites de .github/actions
      # restent en `./` (actionlint refuse `$/`), l'outil ne les suit pas.
      - name: Verify the lockfile
        run: gh actions-lock --verify --ignore-local-actions

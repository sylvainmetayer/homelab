name: Trivy

# Analyse hebdomadaire Trivy, en rapport seulement : les vulnérabilités HIGH
# et CRITICAL qui ont un correctif publié, dans les images épinglées des rôles
# (et compose/), et les mauvaises configurations de tofu/, ansible/ et du
# Dockerfile Molecule. Les résultats vont dans l'onglet Security (code
# scanning, SARIF), une catégorie par image : une trouvaille ne fait jamais
# échouer le run, une erreur de l'outil (image introuvable, base absente,
# SARIF refusé) si.
# --ignore-unfixed : sans lui, les CVE sans correctif, que Renovate ne peut
# pas régler, noyaient les autres. Il masque aussi le statut end_of_life :
# une image restée sur une distribution en fin de vie paraît propre, seul le
# log du job le dit. Code scanning ferme les alertes masquées comme « Fixed »
# sans qu'elles le soient ; une CVE qui reçoit un correctif revient comme une
# nouvelle alerte.
# Les CRITICAL corrigeables, et elles seules, partent aussi sur ntfy (job
# notify, topic scripts, .github/scripts/trivy_critical.py) : une ligne par
# CVE, par image, avec la version qui la corrige. Aucune : aucun message.
# Le lundi à 05:00 UTC, après les tests de la nuit (03:30) et avant la PR
# hebdomadaire de Renovate (lundi avant 9h, Paris) : l'onglet Security dit
# ce que corrigent ses montées de version.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
  # Sur une PR, l'analyse tourne (l'outil et la liste d'images sont
  # vérifiés) sans rien envoyer : une analyse de PR n'est pas celle de main.
  pull_request:
    paths:
      - .github/workflows/trivy.yaml
      - .github/actions/install-trivy/**
      - .github/scripts/trivy_images.py
      - .github/scripts/trivy_critical.py

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Chaque job déclare les siennes.
permissions: {}

jobs:
  prepare:
    name: List images and fetch the database
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read

    outputs:
      images: ${{ steps.images.outputs.images }}
      # Lue par les jobs d'image plutôt que recalculée : relancés seuls
      # (« Re-run failed jobs »), ils ont un run_attempt de plus que prepare,
      # qui ne tourne pas à nouveau, et ne trouveraient pas sa clé.
      db-key: ${{ steps.db-key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List the images
        id: images
        run: |
          images=$(python3 -I .github/scripts/trivy_images.py)
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "$images" | jq -r '.[] | "\(.name)  \(.ref)"'

      - name: Install Trivy
        # ./ et non $/ : actionlint ne connaît pas encore la syntaxe self-repository.
        uses: ./.github/actions/install-trivy # zizmor: ignore[self-repository]

      # Une fois par run, puis le cache GitHub Actions : chaque job d'image
      # la relit au lieu de la retélécharger (la base Java sert aux images
      # qui embarquent des jar).
      - name: Download the vulnerability databases
        run: |
          trivy image --skip-version-check --no-progress --download-db-only
          trivy image --skip-version-check --no-progress --download-java-db-only

      - name: Name the cache entry
        id: db-key
        run: echo "key=trivy-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Save the databases
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: ${{ steps.db-key.outputs.key }}

  config:
    name: Scan the configuration
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: ./.github/actions/install-trivy # zizmor: ignore[self-repository]

      # Terraform (tofu/), Ansible, Dockerfile. Les modules distants que
      # Trivy télécharge ne sont pas les nôtres : leurs trouvailles sont
      # écartées. Un module introuvable n'est qu'un ERROR dans le log.
      - name: Run trivy config
        run: |
          trivy config --skip-version-check --severity HIGH,CRITICAL \
            --tf-exclude-downloaded-modules \
            --format sarif --output trivy-config.sarif .
          echo "Findings: $(jq '[.runs[].results[]] | length' trivy-config.sarif)"

      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  image:
    name: Scan ${{ matrix.image.name }}
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      # Ménage Docker Hub (pulls anonymes limités par IP de runner).
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}

    steps:
      # Upload-sarif lit le dépôt (chemins, commit) : checkout requis.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: ./.github/actions/install-trivy # zizmor: ignore[self-repository]

      - name: Restore the databases
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: ${{ needs.prepare.outputs.db-key }}
          fail-on-cache-miss: true

      # Lue directement dans le registre (pas de docker pull) ; vulnérabilités
      # seulement, et seulement celles qui ont un correctif (--ignore-unfixed,
      # voir l'en-tête ; trivy config n'a pas de notion de correctif). Le
      # timeout par défaut (5 min) ne suffit pas aux grosses images
      # (immich-machine-learning). Trois essais espacés : lscr.io répond
      # TOOMANYREQUESTS quand plusieurs jobs lisent ses images en même temps
      # (vu sur bookstack, mariadb et nextcloud au premier run). Rapport en
      # JSON, converti en SARIF ensuite : le job notify lit le JSON (version
      # corrigée de chaque CVE), code scanning le SARIF, d'une seule analyse.
      - name: Run trivy image
        env:
          IMAGE: ${{ matrix.image.ref }}
          NAME: ${{ matrix.image.name }}
        run: |
          for attempt in 1 2 3; do
            if trivy image --skip-version-check --no-progress \
              --skip-db-update --skip-java-db-update \
              --image-src remote --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --timeout 20m \
              --format json --output trivy-image.json "$IMAGE"; then
              break
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 60))
          done
          trivy convert --skip-version-check --format sarif --output trivy-image.sarif trivy-image.json
          echo "Findings: $(jq '[.runs[].results[]] | length' trivy-image.sarif)"
          mkdir reports
          cp trivy-image.json "reports/$NAME.json"
          python3 -I .github/scripts/trivy_critical.py --dry-run reports

      # Lu par le job notify, puis jeté : un jour suffit.
      - name: Keep the report for the notification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ matrix.image.name }}
          path: reports/
          retention-days: 1
          if-no-files-found: error

      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.image.name }}

  # Les CRITICAL corrigeables de toutes les images, en un message ntfy (rien
  # s'il n'y en a pas). Aussi quand une image a échoué : les autres sont
  # signalées, le run reste rouge. Depuis main seulement : l'environnement
  # trivy-ntfy (tofu/github/trivy_ntfy_secrets.tf) ne porte que le jeton du
  # producteur scripts de ntfy, et refuse toute autre branche.
  notify:
    name: Publish critical vulnerabilities to ntfy
    needs: image
    if: ${{ !cancelled() && needs.image.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    environment: trivy-ntfy
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trivy-report-*
          merge-multiple: true
          path: reports

      - name: Publish to ntfy
        env:
          NTFY_TOKEN: ${{ secrets.TRIVY_NTFY_TOKEN }}
        run: python3 -I .github/scripts/trivy_critical.py reports

  # Les bases pèsent lourd dans le cache Actions (10 Go par dépôt, partagés
  # avec l'image Molecule) : l'entrée du run est supprimée dès que toutes les
  # images sont passées. Gardée sinon, pour un « Re-run failed jobs ».
  cleanup:
    name: Delete the database cache
    needs: [prepare, image]
    if: needs.image.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions:
      actions: write

    steps:
      - name: Delete the cache entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ needs.prepare.outputs.db-key }}
        run: gh cache delete "$KEY"

name: OLM Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-olm-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Start OLM
        run: |
          docker run -d --rm \
            --name olm \
            --network host \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -e PANGOLIN_ENDPOINT="${{ secrets.PANGOLIN_ENDPOINT }}" \
            -e OLM_ID="${{ secrets.OLM_ID }}" \
            -e OLM_SECRET="${{ secrets.OLM_SECRET }}" \
            fosrl/olm

      - name: Wait for tunnel
        run: |
          echo "Waiting for tunnel..."

          for i in {1..60}; do
            if ping -c1 -W1 100.96.128.1 >/dev/null 2>&1; then
              echo "Tunnel is up."
              exit 0
            fi

            docker logs --tail 20 olm || true
            sleep 2
          done

          echo "Tunnel never came up."
          docker logs olm
          exit 1

      - name: Switch runner DNS
        run: |
          sudo cp /etc/resolv.conf /tmp/resolv.conf.bak || true

          cat <<EOF | sudo tee /etc/resolv.conf
          nameserver 100.96.128.1
          nameserver 1.1.1.1
          options timeout:1 attempts:2
          EOF

          echo "Current resolv.conf:"
          cat /etc/resolv.conf

      - name: Verify DNS
        run: |
          dig @100.96.128.1 docker-apps.internal
          dig docker-apps.internal
          getent hosts docker-apps.internal

      - name: Test connectivity
        run: |
          ping -c3 docker-apps.internal
          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -v \
            sylvain@docker-apps.internal \
            true

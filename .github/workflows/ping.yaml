name: Test OLM Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-olm-connection:
    name: test-olm-connection
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install network tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            dnsutils \
            netcat-openbsd \
            curl

      - name: Start OLM container
        env:
          PANGOLIN_ENDPOINT: ${{ secrets.PANGOLIN_ENDPOINT }}
          OLM_ID: ${{ secrets.OLM_ID }}
          OLM_SECRET: ${{ secrets.OLM_SECRET }}
        run: |
          docker run -d --rm \
            --name olm \
            --network host \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -e PANGOLIN_ENDPOINT="$PANGOLIN_ENDPOINT" \
            -e OLM_ID="$OLM_ID" \
            -e OLM_SECRET="$OLM_SECRET" \
            -e OVERRIDE_DNS=true \
            fosrl/olm

      - name: Wait for OLM tunnel and DNS
        shell: bash
        run: |
          echo "Waiting for OLM..."

          for i in {1..15}; do
            echo ""
            echo "Attempt $i/15"

            if ip addr show olm >/dev/null 2>&1; then
              echo "✓ OLM interface exists"
            else
              echo "Waiting for OLM interface..."
              docker logs --tail 20 olm || true
              sleep 2
              continue
            fi

            if ip route | grep -q "100.96.128.0/24"; then
              echo "✓ OLM route installed"
            else
              echo "Waiting for OLM route..."
              sleep 2
              continue
            fi

            if dig @100.96.128.1 example.com +time=2 +tries=1; then
              echo "✓ OLM DNS proxy works"
              exit 0
            fi

            echo "DNS not ready yet"
            sleep 2
          done

          echo "✗ OLM failed readiness check"

          echo "===== ROUTES ====="
          ip route

          echo "===== INTERFACES ====="
          ip addr

          echo "===== RESOLV.CONF ====="
          cat /etc/resolv.conf || true

          echo "===== OLM LOGS ====="
          docker logs olm || true

          exit 1

      - name: Test DNS resolution through OLM
        run: |
          echo "Testing DNS resolution"

          dig @100.96.128.1 github.com

          dig @100.96.128.1 google.com

      - name: Test HTTPS connectivity
        run: |
          echo "Testing external connectivity"

          curl -v \
            --connect-timeout 10 \
            https://github.com \
            -o /dev/null

      - name: OLM diagnostics
        if: always()
        run: |
          echo "===== Docker status ====="
          docker ps -a

          echo "===== OLM logs ====="
          docker logs olm || true

          echo "===== Routes ====="
          ip route

          echo "===== Interfaces ====="
          ip addr

      - name: Stop OLM
        if: always()
        run: |
          docker stop olm || true

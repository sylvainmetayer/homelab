name: OLM Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-olm-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Start OLM container
        run: |
          docker run -d --rm \
            --name olm \
            --network host \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -e PANGOLIN_ENDPOINT="${{ secrets.PANGOLIN_ENDPOINT }}" \
            -e OLM_ID="${{ secrets.OLM_ID }}" \
            -e OLM_SECRET="${{ secrets.OLM_SECRET }}" \
            -e OVERRIDE_DNS=true \
            fosrl/olm

      - name: Wait for OLM tunnel and DNS
        run: |
          echo "Waiting for OLM DNS proxy..."

          for i in {1..10}; do
            echo "Attempt $i/10"

            if nc -z -w1 100.96.128.1 53; then
              echo "✓ OLM DNS proxy reachable"
              exit 0
            fi

            docker logs --tail 20 olm || true
            sleep 2
          done

          echo "✗ OLM DNS proxy not reachable"

          echo "=== Routes ==="
          ip route

          echo "=== Interfaces ==="
          ip addr

          echo "=== OLM logs ==="
          docker logs olm

          exit 1

      - name: Check OLM network state
        run: |
          echo "=== Routes ==="
          ip route

          echo
          echo "=== Resolver configuration ==="
          cat /etc/resolv.conf

          echo
          echo "=== DNS port test ==="
          nc -vz 100.96.128.1 53

      - name: Test internal DNS resolution
        run: |
          echo "Testing OLM DNS resolver"

          echo "--- Direct query ---"
          dig @100.96.128.1 docker-apps.internal

          echo "--- System resolver ---"
          dig docker-apps.internal

          echo "--- libc resolver ---"
          getent hosts docker-apps.internal

      - name: Test SSH connectivity
        run: |
          echo "Testing SSH through OLM tunnel"

          ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -v \
            sylvain@docker-apps.internal \
            true

      - name: Test ICMP connectivity
        run: |
          echo "Testing ping"

          ping -c 3 docker-apps.internal || true

      - name: Dump OLM logs on exit
        if: always()
        run: |
          docker logs olm || true

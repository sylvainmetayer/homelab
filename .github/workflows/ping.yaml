name: Test OLM Connection

on:
  workflow_dispatch:

jobs:
  test-olm-connection:
    name: test-olm-connection
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            dnsutils \
            curl \
            iproute2

      - name: Start OLM
        env:
          PANGOLIN_ENDPOINT: ${{ secrets.PANGOLIN_ENDPOINT }}
          OLM_ID: ${{ secrets.OLM_ID }}
          OLM_SECRET: ${{ secrets.OLM_SECRET }}
        run: |
          docker run -d --rm \
            --name olm \
            --network host \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -e PANGOLIN_ENDPOINT="$PANGOLIN_ENDPOINT" \
            -e OLM_ID="$OLM_ID" \
            -e OLM_SECRET="$OLM_SECRET" \
            -e OVERRIDE_DNS=true \
            fosrl/olm

      - name: Wait OLM startup
        shell: bash
        run: |
          for i in {1..20}; do
            echo "Check $i/20"

            if docker logs olm 2>&1 | grep -q "DNS proxy started"; then
              echo "✓ DNS proxy started"
              break
            fi

            docker logs --tail 5 olm || true
            sleep 2
          done

          if ! docker logs olm 2>&1 | grep -q "DNS proxy started"; then
            echo "OLM startup failed"
            docker logs olm
            exit 1
          fi


      - name: Validate tunnel
        run: |
          echo "=== Interfaces ==="
          ip addr

          echo "=== Routes ==="
          ip route

          ip addr show olm
          ip route | grep 100.96.128.0/24


      - name: Validate DNS proxy
        run: |
          echo "Testing OLM DNS"

          dig \
            @100.96.128.1 \
            github.com \
            +time=5 \
            +tries=2

          dig \
            @100.96.128.1 \
            example.com \
            +time=5 \
            +tries=2


      - name: Validate network access
        run: |
          echo "Testing HTTPS"

          curl \
            --fail \
            --connect-timeout 10 \
            https://github.com \
            -o /dev/null


      - name: Collect diagnostics
        if: always()
        run: |
          echo "===== OLM LOGS ====="
          docker logs olm || true

          echo "===== ROUTES ====="
          ip route

          echo "===== DNS ====="
          cat /etc/resolv.conf || true

          echo "===== PROCESSES ====="
          ps aux | grep olm || true


      - name: Cleanup
        if: always()
        run: |
          docker stop olm || true

name: Deploy changed docker app

on:
  push:
    branches:
      - main
    paths:
      - ansible/docker.yml
      - ansible/pi.yml
      - ansible/pangolin.yaml
      - ansible/flip.yml
      - ansible/roles/**
  workflow_dispatch:
    inputs:
      playbook:
        description: "Which playbook 'tags' applies to (ignored if 'tags' is empty)"
        required: false
        type: choice
        options:
          - all
          - docker
          - pi
          - pangolin
          - flip
        default: all
      tags:
        description: "Comma-separated ansible tags/roles to force (skips auto-detection)"
        required: false
        default: ""

# Pangolin's OLM VPN rejects a second concurrent connection with the same
# credentials, so runs must be serialized rather than run in parallel.
# cancel-in-progress: false never cancels the RUNNING run, but GitHub keeps at
# most one PENDING run per group: a third push cancels the pending one. That
# run's commit is caught up by the next one, which deploys everything since
# the last successful push run (see "Determine changed files"), not just its
# own push.
concurrency:
  group: deploy-docker-app
  cancel-in-progress: false

# Every permission is granted per job.
permissions: {}

jobs:
  deploy:
    name: deploy-docker-app
    runs-on: ubuntu-26.04
    # Secrets de déploiement (clé age, clé SSH, OLM) : environnement lisible
    # depuis main seulement (tofu/github/environments.tf).
    environment: production

    permissions:
      contents: read
      actions: read # last successful run of this workflow (Determine changed files)

    steps:
      # Audit seulement : journalise les connexions sortantes, les processus
      # et les fichiers touchés de chaque étape (insights StepSecurity, publics
      # pour un dépôt public), ne bloque rien hors de la liste noire globale de
      # StepSecurity. Premier pas, il doit voir tout le job. Il fait passer le
      # DNS de l'hôte par son proxy (systemd-resolved sur 127.0.0.1, `dns`
      # 172.17.0.1 dans /etc/docker/daemon.json, Docker redémarré) avant OLM :
      # le conteneur OLM, même en --network host, reçoit ce `dns` dans son
      # resolv.conf et résout PANGOLIN_ENDPOINT par ce proxy, qui doit donc
      # tenir jusqu'à « Cleanup ». « Point host DNS at OLM tunnel » sort
      # ensuite l'hôte de systemd-resolved (connexions vers 100.96.128.1 vues
      # par IP), et « Cleanup » rend le stub de systemd-resolved avant que son
      # post n'envoie le rapport.
      # continue-on-error : un audit ne doit pas bloquer un déploiement. Sans
      # lui, un échec de son pre (téléchargement de l'agent, API StepSecurity)
      # fait échouer le job avant le moindre déploiement.
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        continue-on-error: true
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff from the head of the last successful PUSH run, not from this
          # push's own `before`: a run cancelled while pending (one pending run
          # per concurrency group), or a failed one, is then caught up here.
          # A failed run never becomes the base, so its changes are retried
          # (a run failing halfway redeploys what already passed: idempotent).
          # Dispatch runs never count: forced tags deploy only part of main.
          # An API error fails the run: deploying only this push and turning
          # green would make it the base and lose the missed commits for good.
          last_ok="$(gh api "repos/$REPO/actions/workflows/deploy-docker-app.yaml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          base=""
          if [[ "$last_ok" =~ ^[0-9a-f]{40}$ ]] && [ "$last_ok" != "$AFTER_SHA" ] && git cat-file -e "$last_ok^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$AFTER_SHA" "$last_ok"; then
              # Re-run of an old run: a later successful run already deployed
              # newer code, redeploying this commit would roll it back.
              echo "::notice::$AFTER_SHA is older than $last_ok, already deployed by a later successful run: nothing to deploy"
              echo "files=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git merge-base --is-ancestor "$last_ok" "$AFTER_SHA"; then
              base="$last_ok"
            fi
          fi

          if [ -z "$base" ] && [ "$last_ok" != "$AFTER_SHA" ]; then
            # Not the re-run of the last successful run: first run, no
            # successful run left in the API, or rewritten history.
            echo "::warning::no usable last successful push run: deploying this push only, earlier cancelled or failed runs are not caught up"
          fi

          if [ -n "$base" ]; then
            echo "Changes since the last successful deployment ($base):"
            git log --oneline "$base..$AFTER_SHA"
            # The files of every commit of the range, not only the net diff: a
            # revert of a commit whose run failed halfway nets to nothing, yet
            # the host still holds what that run applied before failing. The
            # net diff adds what merge commits changed themselves.
            files="$({ git diff --name-only "$base" "$AFTER_SHA"; git log --name-only --pretty=format: "$base..$AFTER_SHA"; } | sed '/^$/d' | sort -u)"
          # No usable base (first run, re-run of the last successful run,
          # rewritten history): this push only, as before.
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            # New branch or force-push with an unknown base: fall back to the last commit only.
            files="$(git show --name-only --pretty=format: "$AFTER_SHA")"
          else
            files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          echo "$files"
          delimiter="EOF_$(date +%s%N)"
          {
            echo "files<<$delimiter"
            echo "$files"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # ansible-core, boto3, passlib et pyyaml (lu par resolve_docker_tags.py)
      # aux versions d'uv.lock, comme test.yaml et lint.yaml : Renovate ne
      # bumpe que le lock. 2.21+ est requis par community.sops.load_vars
      # `return_method: vars-only`. Le vieux crash "argument -o: expected one
      # argument" ne tenait pas à la version : arguments ssh tronqués par le
      # parseur -e key=value, corrigé par les extra vars JSON des Deploy (787fb18).
      # Avant la résolution des tags, qui a besoin de pyyaml : quelques
      # secondes même quand rien n'est à déployer.
      - name: Install ansible + deps
        run: |
          pip install --quiet --only-binary :all: uv==0.12.23
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve ansible tags
        id: resolve-tags
        env:
          INPUT_PLAYBOOK: ${{ inputs.playbook }}
          INPUT_TAGS: ${{ inputs.tags }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          if [ -n "$INPUT_TAGS" ]; then
            # A manually forced tag list defaults to all playbooks; pick
            # "docker", "pi", "pangolin" or "flip" in the dispatch form to
            # target just one. ansible-playbook --tags with no matching task
            # is a no-op, so forcing e.g. "immich" on all just runs nothing on
            # docker.yml/pangolin.yaml/flip.yml.
            docker_tags=""
            pi_tags=""
            pangolin_tags=""
            flip_tags=""
            case "$INPUT_PLAYBOOK" in
              docker) docker_tags="$INPUT_TAGS" ;;
              pi) pi_tags="$INPUT_TAGS" ;;
              pangolin) pangolin_tags="$INPUT_TAGS" ;;
              flip) flip_tags="$INPUT_TAGS" ;;
              *) docker_tags="$INPUT_TAGS"; pi_tags="$INPUT_TAGS"; pangolin_tags="$INPUT_TAGS"; flip_tags="$INPUT_TAGS" ;;
            esac
            {
              echo "docker_tags=$docker_tags"
              echo "pi_tags=$pi_tags"
              echo "pangolin_tags=$pangolin_tags"
              echo "flip_tags=$flip_tags"
            } >> "$GITHUB_OUTPUT"
            # One flag for the setup steps (OLM, SSH key, inventory...), so that
            # adding a playbook does not mean editing each of their `if:`.
            if [ -n "$docker_tags$pi_tags$pangolin_tags$flip_tags" ]; then any_tags=true; else any_tags=false; fi
            echo "any_tags=$any_tags" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result="$(printf '%s\n' "$CHANGED_FILES" | python3 .github/scripts/resolve_docker_tags.py ansible/docker.yml ansible/pi.yml ansible/pangolin.yaml ansible/flip.yml)"
          echo "Resolved: $result"

          docker_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/docker.yml"])' "$result")"
          pi_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/pi.yml"])' "$result")"
          pangolin_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/pangolin.yaml"])' "$result")"
          flip_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/flip.yml"])' "$result")"

          {
            echo "docker_tags=$docker_tags"
            echo "pi_tags=$pi_tags"
            echo "pangolin_tags=$pangolin_tags"
            echo "flip_tags=$flip_tags"
          } >> "$GITHUB_OUTPUT"
          # One flag for the setup steps (OLM, SSH key, inventory...), so that
          # adding a playbook does not mean editing each of their `if:`.
          if [ -n "$docker_tags$pi_tags$pangolin_tags$flip_tags" ]; then any_tags=true; else any_tags=false; fi
          echo "any_tags=$any_tags" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install sops
        if: steps.resolve-tags.outputs.any_tags == 'true'
        # Épinglé et vérifié : ce binaire déchiffre avec la clé Age de prod.
        # Version et sha256 se changent ensemble, à la main (Renovate ne sait
        # pas recalculer le sha256, et ce workflow ne tourne qu'après le merge) :
        # sha256 de sops-<version>.linux.amd64 dans sops-<version>.checksums.txt.
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Cache ansible-galaxy roles and collections
        if: steps.resolve-tags.outputs.any_tags == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ansible/galaxy_roles
            ansible/collections
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install ansible roles and collections
        if: steps.resolve-tags.outputs.any_tags == 'true'
        working-directory: ansible
        # No --force: with the cache above restored, an already-satisfied
        # requirement is skipped instead of being re-downloaded every run.
        run: |
          ansible-galaxy role install -r requirements.yml
          ansible-galaxy collection install -r requirements.yml

      - name: Install network tools
        if: steps.resolve-tags.outputs.any_tags == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dnsutils

      - name: Start OLM
        if: steps.resolve-tags.outputs.any_tags == 'true'
        env:
          PANGOLIN_ENDPOINT: ${{ secrets.PANGOLIN_ENDPOINT }}
          OLM_ID: ${{ secrets.OLM_ID }}
          OLM_SECRET: ${{ secrets.OLM_SECRET }}
        # `-e NAME` sans valeur : docker reprend la variable de son propre
        # environnement, le secret n'apparaît pas dans la ligne de commande
        # (/proc/<pid>/cmdline, que l'agent de harden-runner relève).
        run: |
          docker run -d --rm \
            --name olm \
            --network host \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -e PANGOLIN_ENDPOINT \
            -e OLM_ID \
            -e OLM_SECRET \
            -e OVERRIDE_DNS=true \
            docker.io/fosrl/olm:1.10.1@sha256:19943d7087262a0786f347bbefc0e9b4f01e857c198cd07de164fe83bc5e4d55

      - name: Wait OLM startup
        if: steps.resolve-tags.outputs.any_tags == 'true'
        shell: bash
        run: |
          for i in {1..20}; do
            echo "Check $i/20"

            if docker logs olm 2>&1 | grep -q "DNS proxy started"; then
              echo "DNS proxy started"
              break
            fi

            docker logs --tail 5 olm || true
            sleep 2
          done

          if ! docker logs olm 2>&1 | grep -q "DNS proxy started"; then
            echo "OLM startup failed"
            docker logs olm
            exit 1
          fi

      # See .github/workflows/ping.yaml for why the runner's own resolver
      # needs to be pointed at the OLM DNS proxy directly.
      - name: Point host DNS at OLM tunnel
        if: steps.resolve-tags.outputs.any_tags == 'true'
        run: |
          sudo rm -f /etc/resolv.conf
          echo "nameserver 100.96.128.1" | sudo tee /etc/resolv.conf > /dev/null

      - name: Set up deploy SSH key
        if: steps.resolve-tags.outputs.any_tags == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ci_deploy_key"
          chmod 600 "$HOME/.ssh/ci_deploy_key"

          # flip is reached through a ProxyJump via Pangolin (see "Deploy
          # flip"). The jump runs its own ssh, which sees neither
          # ansible_ssh_private_key_file nor the -o options Ansible passes:
          # the bastion's key and host-key policy have to be in ssh_config.
          # Host keys come from ansible/known_hosts (versioned), for the
          # bastion as for the targets (ansible.cfg ssh_args).
          cat > "$HOME/.ssh/config" << EOF
          Host pangolin.sylvain.cloud
            User sylvain
            IdentityFile $HOME/.ssh/ci_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $GITHUB_WORKSPACE/ansible/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Write CI inventory
        id: ci-inventory
        if: steps.resolve-tags.outputs.any_tags == 'true'
        working-directory: ansible
        run: |
          # inventory_hostname must stay "docker"/"pi"/"pangolin"/"flip" so
          # host_vars/docker/*, host_vars/pi/*, host_vars/pangolin/*,
          # host_vars/flip/* still apply; only the connection address is
          # overridden. docker/pi are only reachable through the OLM tunnel's
          # private mesh; pangolin is the mesh's own server, so it's reached
          # directly over its public DNS name instead. flip has no public IP:
          # it is reached on its private address (flip_server.private_ip in
          # tofu/pangolin/terraform.tfvars) through a ProxyJump via pangolin,
          # NOT through its flip.internal resource - that one is served by
          # flip's own newt, which a deployment may restart mid-play.
          cat > ci-inventory.ini << 'EOF'
          [docker]
          docker ansible_host=docker-apps.internal

          [pi]
          pi ansible_host=pi.internal

          [pangolin]
          pangolin ansible_host=pangolin.sylvain.cloud

          [flip]
          flip ansible_host=10.0.1.10
          EOF

      # Each host is deployed even when an earlier one failed (!cancelled()),
      # once the setup steps all passed (the inventory is the last of them).
      # A failed run never becomes the base of the next one, so the changes of
      # a host that stays down come back in every run: stopping at the first
      # failure would block the other hosts' deployments until it is back.
      - name: Deploy docker
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.docker_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.docker_tags }}
        run: |
          # Extra vars are passed as a JSON object, not the flat "key=value"
          # shorthand: ansible's own key=value CLI parser re-splits on
          # whitespace, which silently truncated ansible_ssh_common_args to
          # just "-o" (everything after the first space, including the second
          # -o flag, was dropped and misparsed as unrelated top-level vars).
          ansible-playbook docker.yml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"\"}"

      - name: Deploy pi
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.pi_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.pi_tags }}
        run: |
          ansible-playbook pi.yml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"\"}"

      - name: Deploy pangolin
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.pangolin_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.pangolin_tags }}
        run: |
          ansible-playbook pangolin.yaml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"\"}"

      - name: Deploy flip
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.flip_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.flip_tags }}
        run: |
          ansible-playbook flip.yml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"-o ProxyJump=pangolin.sylvain.cloud\"}"

      - name: No matching role changed
        if: steps.resolve-tags.outputs.any_tags != 'true'
        run: echo "No ansible/roles/** change mapped to a docker.yml, pi.yml, pangolin.yaml, or flip.yml tag, nothing to deploy."

      - name: Cleanup
        if: always()
        run: |
          # Restore the runner's own resolver before tearing down OLM: the
          # "Point host DNS at OLM tunnel" step overwrote /etc/resolv.conf to
          # point solely at OLM's DNS proxy, replacing the symlink to
          # systemd-resolved's stub. Left in place after OLM is killed, the
          # runner is stuck with a dead resolver, which can hang the runner
          # agent's own post-job network calls (log upload, job completion)
          # indefinitely even though every step above reported success.
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

          docker stop -t 0 olm || true
          rm -f "$HOME/.ssh/ci_deploy_key" "$HOME/.ssh/config"

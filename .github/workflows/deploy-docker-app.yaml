name: Deploy changed docker app

on:
  push:
    branches:
      - main
    paths:
      - ansible/docker.yml
      - ansible/pi.yml
      - ansible/pangolin.yaml
      - ansible/flip.yml
      - ansible/roles/**
      # Une variable d'hôte redéploie le playbook entier de cet hôte
      # (resolve_docker_tags.py) ; nas, pve et newt-lxc restent à la main.
      - ansible/host_vars/docker/**
      - ansible/host_vars/pi/**
      - ansible/host_vars/pangolin/**
      - ansible/host_vars/flip/**
      # Lus par tous les playbooks : chacun des quatre est redéployé entier.
      # Le sous-module secrets/ n'y est pas : une rotation s'applique à la main.
      - ansible/group_vars/all/**
      - ansible/tasks/**
      - ansible/requirements.yml
      # Construits par le rôle docs_site (docs.sylvain.cloud) : son tag sur
      # docker (resolve_docker_tags.py, ROLE_SOURCES).
      - docs/**
      - mkdocs.yml
      - .github/scripts/mkdocs_*.py
  # Fenêtre de calme (ADR 0029) : un push entre 19:00 et 08:00 (Paris) est
  # annulé par le job `window`, et ces crons déploient le lendemain ce qu'il a
  # retenu. 06:00 et 07:00 UTC : 08:00 Paris l'été, puis l'hiver ; l'autre
  # tombe à 09:00 et ne trouve rien à faire. 09:00 UTC est le filet si GitHub
  # retarde ou saute un schedule (non garanti).
  schedule:
    - cron: "0 6,7,9 * * *"
  workflow_dispatch:
    inputs:
      playbook:
        description: "Which playbook 'tags' applies to; without 'tags', which playbooks the catch-up of main deploys"
        required: false
        type: choice
        options:
          - all
          - docker
          - pi
          - pangolin
          - flip
        default: all
      tags:
        description: "Comma-separated ansible tags/roles to force (skips auto-detection)"
        required: false
        default: ""

# Pangolin's OLM VPN rejects a second concurrent connection with the same
# credentials, so runs must be serialized rather than run in parallel.
# cancel-in-progress: false never cancels the RUNNING run, but GitHub keeps at
# most one PENDING run per group: a third push cancels the pending one. That
# run's commit is caught up by the next one, which deploys everything since
# the last successful push run (see "Determine changed files"), not just its
# own push.
concurrency:
  group: deploy-docker-app
  cancel-in-progress: false

# Every permission is granted per job.
permissions: {}

jobs:
  # Fenêtre de calme : fermée, le run s'annule lui-même. Un run annulé n'est
  # jamais « le dernier run réussi » (Determine changed files) : le suivant
  # rattrape tous ses commits. Un job `deploy` simplement sauté laisserait le
  # run vert, donc base du suivant, et perdrait ces commits. Le `exit 1` final
  # ne sert que si l'annulation tardait : rouge plutôt que vert.
  window:
    name: window
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # gh run cancel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Quiet window
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          rc=0
          python3 -I .github/scripts/deploy_window.py || rc=$?
          [ "$rc" -eq 0 ] && exit 0
          # Only the script's own "closed" (1) cancels: a crash (any other code)
          # must fail the job, not pass for a quiet window every night.
          [ "$rc" -eq 1 ] || { echo "::error::deploy_window.py crashed (exit $rc)"; exit "$rc"; }
          echo "::notice::quiet window (19:00-08:00 Paris): run cancelled, the next one in the window deploys these commits"
          gh run cancel "$RUN_ID"
          sleep 120
          exit 1

  deploy:
    name: deploy-docker-app
    needs: window
    runs-on: ubuntu-26.04
    # 58 min mesurées avec les quatre hôtes à la suite (09/11) : sans borne, un
    # ansible-playbook figé garderait le groupe de concurrence, le tunnel OLM
    # et les secrets de production jusqu'aux 6 h de GitHub.
    timeout-minutes: 120
    # Secrets de déploiement (clé age, clé SSH, OLM) : environnement lisible
    # depuis main seulement (tofu/github/environments.tf).
    environment: production

    permissions:
      contents: read
      actions: read # last successful run of this workflow (Determine changed files)

    steps:
      # Audit seulement : journalise les connexions sortantes, les processus
      # et les fichiers touchés de chaque étape (insights StepSecurity, publics
      # pour un dépôt public), ne bloque rien hors de la liste noire globale de
      # StepSecurity. Premier pas, il doit voir tout le job. Il fait passer le
      # DNS de l'hôte par son proxy (systemd-resolved sur 127.0.0.1, `dns`
      # 172.17.0.1 dans /etc/docker/daemon.json, Docker redémarré) avant OLM :
      # le conteneur OLM, même en --network host, reçoit ce `dns` dans son
      # resolv.conf et résout PANGOLIN_ENDPOINT par ce proxy, qui doit donc
      # tenir jusqu'à « Cleanup ». « Point host DNS at OLM tunnel » sort
      # ensuite l'hôte de systemd-resolved (connexions vers 100.96.128.1 vues
      # par IP), et « Cleanup » rend le stub de systemd-resolved avant que son
      # post n'envoie le rapport.
      # continue-on-error : un audit ne doit pas bloquer un déploiement. Sans
      # lui, un échec de son pre (téléchargement de l'agent, API StepSecurity)
      # fait échouer le job avant le moindre déploiement.
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        continue-on-error: true
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAGS: ${{ inputs.tags }}
          BEFORE_SHA: ${{ github.event.before }}
          # github.sha, not event.after: a schedule event has no `after`, and an
          # empty AFTER_SHA would make every catch-up "nothing to deploy".
          AFTER_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Dispatch with forced tags: they replace the detection (Resolve ansible
          # tags). Dispatch without tags catches main up like a schedule run.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAGS" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff from the head of the last successful push or schedule run, not from this
          # push's own `before`: a run cancelled while pending (one pending run
          # per concurrency group), or a failed one, is then caught up here.
          # A failed run never becomes the base, so its changes are retried
          # (a run failing halfway redeploys what already passed: idempotent).
          # Dispatch runs never count: forced tags deploy only part of main.
          # An API error fails the run: deploying only this push and turning
          # green would make it the base and lose the missed commits for good.
          # Push and schedule runs count, dispatch runs never.
          last_ok="$(gh api "repos/$REPO/actions/workflows/deploy-docker-app.yaml/runs?branch=main&status=success&per_page=30" --jq '[.workflow_runs[] | select(.event != "workflow_dispatch")][0].head_sha // ""')"
          base=""
          if [[ "$last_ok" =~ ^[0-9a-f]{40}$ ]] && [ "$last_ok" != "$AFTER_SHA" ] && git cat-file -e "$last_ok^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$AFTER_SHA" "$last_ok"; then
              # Re-run of an old run: a later successful run already deployed
              # newer code, redeploying this commit would roll it back.
              echo "::notice::$AFTER_SHA is older than $last_ok, already deployed by a later successful run: nothing to deploy"
              echo "files=" >> "$GITHUB_OUTPUT"
              echo "base=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git merge-base --is-ancestor "$last_ok" "$AFTER_SHA"; then
              base="$last_ok"
            fi
          fi

          if [ "$EVENT_NAME" != "push" ]; then
            # The morning catch-up of the quiet window (schedule), or a dispatch
            # without tags: main since the last success, or nothing. Never "this
            # push only" (there is no push).
            if [ -z "$base" ]; then
              echo "::notice::$EVENT_NAME: nothing to catch up (main is already deployed, or no usable last successful run)"
              echo "files=" >> "$GITHUB_OUTPUT"
              echo "base=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -z "$base" ] && [ "$last_ok" != "$AFTER_SHA" ]; then
            # Not the re-run of the last successful run: first run, no
            # successful run left in the API, or rewritten history.
            echo "::warning::no usable last successful push run: deploying this push only, earlier cancelled or failed runs are not caught up"
          fi

          if [ -n "$base" ]; then
            echo "Changes since the last successful deployment ($base):"
            git log --oneline "$base..$AFTER_SHA"
            # The files of every commit of the range, not only the net diff: a
            # revert of a commit whose run failed halfway nets to nothing, yet
            # the host still holds what that run applied before failing. The
            # net diff adds what merge commits changed themselves.
            files="$({ git diff --name-only "$base" "$AFTER_SHA"; git log --name-only --pretty=format: "$base..$AFTER_SHA"; } | sed '/^$/d' | sort -u)"
          # No usable base (first run, re-run of the last successful run,
          # rewritten history): this push only, as before.
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            # New branch or force-push with an unknown base: fall back to the last commit only.
            files="$(git show --name-only --pretty=format: "$AFTER_SHA")"
            # Empty for a root commit: a changed playbook is then deployed whole.
            base="$(git rev-parse --verify --quiet "$AFTER_SHA^" || true)"
          else
            files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            base="$BEFORE_SHA"
          fi

          # The commit a changed playbook is compared with, to deploy only the
          # role entries it touched (resolve_docker_tags.py --base).
          echo "base=$base" >> "$GITHUB_OUTPUT"

          echo "$files"
          delimiter="EOF_$(date +%s%N)"
          {
            echo "files<<$delimiter"
            echo "$files"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # ansible-core, boto3, passlib, pyyaml (lu par resolve_docker_tags.py) et
      # Zensical (le rôle docs_site construit le site sur le runner)
      # aux versions d'uv.lock, comme test.yaml et lint.yaml : Renovate ne
      # bumpe que le lock. 2.21+ est requis par community.sops.load_vars
      # `return_method: vars-only`. Le vieux crash "argument -o: expected one
      # argument" ne tenait pas à la version : arguments ssh tronqués par le
      # parseur -e key=value, corrigé par les extra vars JSON des Deploy (787fb18).
      # Avant la résolution des tags, qui a besoin de pyyaml : quelques
      # secondes même quand rien n'est à déployer.
      - name: Install ansible + deps
        run: |
          pip install --quiet --only-binary :all: uv==0.13.7
          uv sync --locked --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve ansible tags
        id: resolve-tags
        env:
          INPUT_PLAYBOOK: ${{ inputs.playbook }}
          INPUT_TAGS: ${{ inputs.tags }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
          DIFF_BASE: ${{ steps.changed-files.outputs.base }}
        run: |
          if [ -n "$INPUT_TAGS" ]; then
            # A manually forced tag list defaults to all playbooks; pick
            # "docker", "pi", "pangolin" or "flip" in the dispatch form to
            # target just one. ansible-playbook --tags with no matching task
            # is a no-op, so forcing e.g. "immich" on all just runs nothing on
            # docker.yml/pangolin.yaml/flip.yml.
            docker_tags=""
            pi_tags=""
            pangolin_tags=""
            flip_tags=""
            case "$INPUT_PLAYBOOK" in
              docker) docker_tags="$INPUT_TAGS" ;;
              pi) pi_tags="$INPUT_TAGS" ;;
              pangolin) pangolin_tags="$INPUT_TAGS" ;;
              flip) flip_tags="$INPUT_TAGS" ;;
              *) docker_tags="$INPUT_TAGS"; pi_tags="$INPUT_TAGS"; pangolin_tags="$INPUT_TAGS"; flip_tags="$INPUT_TAGS" ;;
            esac
            {
              echo "docker_tags=$docker_tags"
              echo "pi_tags=$pi_tags"
              echo "pangolin_tags=$pangolin_tags"
              echo "flip_tags=$flip_tags"
            } >> "$GITHUB_OUTPUT"
            # One flag for the setup steps (OLM, SSH key, inventory...), so that
            # adding a playbook does not mean editing each of their `if:`.
            if [ -n "$docker_tags$pi_tags$pangolin_tags$flip_tags" ]; then any_tags=true; else any_tags=false; fi
            echo "any_tags=$any_tags" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result="$(printf '%s\n' "$CHANGED_FILES" | python3 .github/scripts/resolve_docker_tags.py --base "$DIFF_BASE" ansible/docker.yml ansible/pi.yml ansible/pangolin.yaml ansible/flip.yml)"
          echo "Resolved: $result"

          docker_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/docker.yml"])' "$result")"
          pi_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/pi.yml"])' "$result")"
          pangolin_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/pangolin.yaml"])' "$result")"
          flip_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/flip.yml"])' "$result")"
          # A dispatch without tags still honours the playbook choice.
          case "$INPUT_PLAYBOOK" in
            docker) pi_tags=""; pangolin_tags=""; flip_tags="" ;;
            pi) docker_tags=""; pangolin_tags=""; flip_tags="" ;;
            pangolin) docker_tags=""; pi_tags=""; flip_tags="" ;;
            flip) docker_tags=""; pi_tags=""; pangolin_tags="" ;;
          esac

          {
            echo "docker_tags=$docker_tags"
            echo "pi_tags=$pi_tags"
            echo "pangolin_tags=$pangolin_tags"
            echo "flip_tags=$flip_tags"
          } >> "$GITHUB_OUTPUT"
          # One flag for the setup steps (OLM, SSH key, inventory...), so that
          # adding a playbook does not mean editing each of their `if:`.
          if [ -n "$docker_tags$pi_tags$pangolin_tags$flip_tags" ]; then any_tags=true; else any_tags=false; fi
          echo "any_tags=$any_tags" >> "$GITHUB_OUTPUT"
        shell: bash

      # ansible/tasks/pangolin_config_outputs.yml charge
      # secrets/ansible.sops.yaml : sous-module du dépôt privé homelab-secrets
      # (ADR 0018), cloné au commit qu'épingle ce push.
      - name: Checkout the secrets submodule
        if: steps.resolve-tags.outputs.any_tags == 'true'
        uses: ./.github/actions/secrets-checkout # zizmor: ignore[self-repository]
        with:
          ssh-key: ${{ secrets.HOMELAB_SECRETS_SSH_KEY }}

      - name: Install sops
        if: steps.resolve-tags.outputs.any_tags == 'true'
        # Épinglé et vérifié : ce binaire déchiffre avec la clé Age de prod.
        # Version et sha256 se changent ensemble, à la main (Renovate ne sait
        # pas recalculer le sha256, et ce workflow ne tourne qu'après le merge) :
        # sha256 de sops-<version>.linux.amd64 dans sops-<version>.checksums.txt.
        env:
          # renovate: datasource=github-releases depName=getsops/sops
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Cache ansible-galaxy roles and collections
        if: steps.resolve-tags.outputs.any_tags == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ansible/galaxy_roles
            ansible/collections
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      # mermaid.min.js de mkdocs_mermaid.py, que le rôle docs_site
      # construit sur ce runner : en cache sous l'empreinte du hook, comme dans
      # lint.yaml (le hook revérifie le sha256). docs_site n'est que dans
      # docker.yml : un déploiement sans docker ne crée pas le dossier, et
      # l'enregistrement du cache avertirait d'un chemin absent.
      - name: Cache Mermaid
        if: steps.resolve-tags.outputs.docker_tags != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/homelab-mkdocs
          key: mermaid-${{ hashFiles('.github/scripts/mkdocs_mermaid.py') }}

      - name: Install ansible roles and collections
        if: steps.resolve-tags.outputs.any_tags == 'true'
        working-directory: ansible
        # No --force: with the cache above restored, an already-satisfied
        # requirement is skipped instead of being re-downloaded every run.
        run: |
          ansible-galaxy role install -r requirements.yml
          ansible-galaxy collection install -r requirements.yml

      # Les playbooks lisent les sorties de tofu/pangolin_config par
      # `tofu output -json` (ansible/tasks/pangolin_config_outputs.yml) : le
      # module doit être initialisé sur le runner, avec la version d'OpenTofu
      # de mise.toml, le provider du fork (absent du registre) et les
      # identifiants S3 en lecture seule du state (clés de ansible.sops.yaml).
      # Avant le tunnel OLM : init joint le registre et GitHub par le DNS normal.
      # tofu_wrapper: false : le wrapper de l'action ajouterait ses lignes à la
      # sortie JSON que lit Ansible.
      - name: Read the OpenTofu version pinned in mise.toml
        id: tofu-version
        if: steps.resolve-tags.outputs.any_tags == 'true'
        run: |
          version="$(sed -n "s/^opentofu = '\(.*\)'$/\1/p" mise.toml)"
          # Empty would make setup-opentofu install the latest, silently.
          [ -n "$version" ] || { echo "::error::opentofu version not found in mise.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up OpenTofu
        if: steps.resolve-tags.outputs.any_tags == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}
          tofu_wrapper: false

      - name: Fetch the fork of the Pangolin provider
        if: steps.resolve-tags.outputs.any_tags == 'true'
        run: .github/scripts/fetch_pangolin_provider.sh

      - name: Init tofu/pangolin_config to read its outputs
        if: steps.resolve-tags.outputs.any_tags == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          AWS_ACCESS_KEY_ID="$(sops -d --extract '["state_s3_access_key"]' secrets/ansible.sops.yaml)"
          AWS_SECRET_ACCESS_KEY="$(sops -d --extract '["state_s3_secret_key"]' secrets/ansible.sops.yaml)"
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          # init validates the state encryption block, whose key is a variable.
          TF_VAR_pangolin_config_state_passphrase="$(sops -d --extract '["tofu_state_passphrase"]' secrets/ansible.sops.yaml)"
          echo "::add-mask::$TF_VAR_pangolin_config_state_passphrase"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_pangolin_config_state_passphrase
          # The registry may drop a connection: same retry as test.yaml.
          for attempt in 1 2 3; do
            tofu -chdir=tofu/pangolin_config init -input=false -lockfile=readonly -no-color && exit 0
            echo "tofu init failed (attempt $attempt), retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Install network tools
        if: steps.resolve-tags.outputs.any_tags == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dnsutils

      # Conteneur, attente du proxy DNS et image épinglée :
      # .github/actions/olm-tunnel.
      - name: Start the OLM tunnel
        if: steps.resolve-tags.outputs.any_tags == 'true'
        uses: ./.github/actions/olm-tunnel # zizmor: ignore[self-repository]
        with:
          pangolin-endpoint: ${{ secrets.PANGOLIN_ENDPOINT }}
          olm-id: ${{ secrets.OLM_ID }}
          olm-secret: ${{ secrets.OLM_SECRET }}

      # OLM runs in a container (--network host): it shares the runner's
      # network namespace but NOT its mount namespace, so its
      # OVERRIDE_DNS=true only rewrites /etc/resolv.conf *inside the
      # container*, which the runner's own resolver never sees (`dig
      # @100.96.128.1` works from the runner, plain `dig` does not). Point the
      # runner's resolver at the OLM DNS proxy directly, as a local OLM client
      # reconfigures the host's DNS; the Cleanup step restores it.
      - name: Point host DNS at OLM tunnel
        if: steps.resolve-tags.outputs.any_tags == 'true'
        run: |
          sudo rm -f /etc/resolv.conf
          echo "nameserver 100.96.128.1" | sudo tee /etc/resolv.conf > /dev/null

      - name: Set up deploy SSH key
        if: steps.resolve-tags.outputs.any_tags == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ci_deploy_key"
          chmod 600 "$HOME/.ssh/ci_deploy_key"

          # flip is reached through a ProxyJump via Pangolin (see "Deploy
          # flip"). The jump runs its own ssh, which sees neither
          # ansible_ssh_private_key_file nor the -o options Ansible passes:
          # the bastion's key and host-key policy have to be in ssh_config.
          # Host keys come from ansible/known_hosts (versioned), for the
          # bastion as for the targets (ansible.cfg ssh_args).
          cat > "$HOME/.ssh/config" << EOF
          Host pangolin.sylvain.cloud
            User sylvain
            IdentityFile $HOME/.ssh/ci_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $GITHUB_WORKSPACE/ansible/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Write CI inventory
        id: ci-inventory
        if: steps.resolve-tags.outputs.any_tags == 'true'
        working-directory: ansible
        run: |
          # inventory_hostname must stay "docker"/"pi"/"pangolin"/"flip" so
          # host_vars/docker/*, host_vars/pi/*, host_vars/pangolin/*,
          # host_vars/flip/* still apply; only the connection address is
          # overridden. docker/pi are only reachable through the OLM tunnel's
          # private mesh; pangolin is the mesh's own server, so it's reached
          # directly over its public DNS name instead. flip has no public IP:
          # it is reached on its private address (flip_server.private_ip in
          # tofu/pangolin/terraform.tfvars) through a ProxyJump via pangolin,
          # NOT through its flip.internal resource - that one is served by
          # flip's own newt, which a deployment may restart mid-play.
          cat > ci-inventory.ini << 'EOF'
          [docker]
          docker ansible_host=docker-apps.internal

          [pi]
          pi ansible_host=pi.internal

          [pangolin]
          pangolin ansible_host=pangolin.sylvain.cloud

          [flip]
          flip ansible_host=10.0.1.10
          EOF

      # Each host is deployed even when an earlier one failed (!cancelled()),
      # once the setup steps all passed (the inventory is the last of them).
      # A failed run never becomes the base of the next one, so the changes of
      # a host that stays down come back in every run: stopping at the first
      # failure would block the other hosts' deployments until it is back.
      #
      # Order (58 min with the four one after the other, 2026-11-09): pi is
      # started in the background just before docker, so the two run at once
      # ("Deploy pi" below waits for it and prints its buffered log), then
      # pangolin, then flip, in sequence and alone. docker and pi are
      # different hosts reached through the OLM tunnel, sharing nothing (facts
      # cache: one file per host; ControlPath sockets: per host; run.log:
      # appended line by line, lines may interleave; docs_site builds in a
      # fresh tempfile; no play reads another host's hostvars). pangolin is
      # the OLM server and flip's ProxyJump: its handlers restart sshd, ufw,
      # fail2ban, nat-gateway (flip's egress), docker and the Pangolin stack,
      # which would cut the tunnel or the jump under a play still running (it
      # was third before, with only flip after it); flip follows it for the
      # same reason. The step names stay "Deploy <host>", which ci_key_audit
      # reads in the jobs API to know which hosts saw the CI key.
      - name: Start the pi deploy in the background
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.pi_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.pi_tags }}
        run: |
          # The exit code goes to a file: "Deploy pi" is another step, so the
          # subshell is not its child and `wait` cannot give it.
          (
            rc=0
            ansible-playbook pi.yml \
              -i ci-inventory.ini \
              --tags "$TAGS" \
              -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"\"}" \
              > "$RUNNER_TEMP/deploy-pi.log" 2>&1 || rc=$?
            echo "$rc" > "$RUNNER_TEMP/deploy-pi.rc"
          ) > /dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/deploy-pi.pid"

      - name: Deploy docker
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.docker_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.docker_tags }}
        run: |
          # Extra vars are passed as a JSON object, not the flat "key=value"
          # shorthand: ansible's own key=value CLI parser re-splits on
          # whitespace, which silently truncated ansible_ssh_common_args to
          # just "-o" (everything after the first space, including the second
          # -o flag, was dropped and misparsed as unrelated top-level vars).
          ansible-playbook docker.yml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"\"}"

      - name: Deploy pi
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.pi_tags != '' }}
        working-directory: ansible
        run: |
          # Started by "Start the pi deploy in the background": wait for its
          # exit code file, print the buffered log, fail with its code.
          # Bounded: a subshell killed before writing its code would otherwise
          # leave this loop waiting for the job timeout.
          while [ ! -s "$RUNNER_TEMP/deploy-pi.rc" ]; do
            if ! kill -0 "$(cat "$RUNNER_TEMP/deploy-pi.pid")" 2>/dev/null; then
              [ -s "$RUNNER_TEMP/deploy-pi.rc" ] && break
              echo "::error::the pi deploy process is gone without an exit code"
              cat "$RUNNER_TEMP/deploy-pi.log" || true
              exit 1
            fi
            sleep 5
          done
          rc="$(cat "$RUNNER_TEMP/deploy-pi.rc")"
          cat "$RUNNER_TEMP/deploy-pi.log"
          exit "$rc"

      - name: Deploy pangolin
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.pangolin_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.pangolin_tags }}
        run: |
          ansible-playbook pangolin.yaml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"\"}"

      - name: Deploy flip
        if: ${{ !cancelled() && steps.ci-inventory.outcome == 'success' && steps.resolve-tags.outputs.flip_tags != '' }}
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.flip_tags }}
        run: |
          ansible-playbook flip.yml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"-o ProxyJump=pangolin.sylvain.cloud\"}"

      - name: No matching role changed
        if: steps.resolve-tags.outputs.any_tags != 'true'
        run: echo "No change to a role, playbook, host_vars, shared file or docs mapped to a docker.yml, pi.yml, pangolin.yaml, or flip.yml tag, nothing to deploy."

      - name: Cleanup
        if: always()
        run: |
          # Restore the runner's own resolver before tearing down OLM: the
          # "Point host DNS at OLM tunnel" step overwrote /etc/resolv.conf to
          # point solely at OLM's DNS proxy, replacing the symlink to
          # systemd-resolved's stub. Left in place after OLM is killed, the
          # runner is stuck with a dead resolver, which can hang the runner
          # agent's own post-job network calls (log upload, job completion)
          # indefinitely even though every step above reported success.
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

          docker stop -t 0 olm || true
          rm -f "$HOME/.ssh/ci_deploy_key" "$HOME/.ssh/config"

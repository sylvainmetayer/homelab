name: Deploy changed docker app

on:
  push:
    branches:
      - main
    paths:
      - ansible/docker.yml
      - ansible/pi.yml
      - ansible/roles/**
  workflow_dispatch:
    inputs:
      playbook:
        description: "Which playbook 'tags' applies to (ignored if 'tags' is empty)"
        required: false
        type: choice
        options:
          - both
          - docker
          - pi
        default: both
      tags:
        description: "Comma-separated ansible tags/roles to force (skips auto-detection)"
        required: false
        default: ""

# Pangolin's OLM VPN rejects a second concurrent connection with the same
# credentials, so runs must be serialized rather than run in parallel.
# cancel-in-progress: false queues later runs instead of cancelling earlier
# ones, so every push still gets deployed.
concurrency:
  group: deploy-docker-app
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-docker-app
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            # New branch or force-push with an unknown base: fall back to the last commit only.
            files="$(git show --name-only --pretty=format: "$AFTER_SHA")"
          else
            files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          fi

          echo "$files"
          delimiter="EOF_$(date +%s%N)"
          {
            echo "files<<$delimiter"
            echo "$files"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/deploy-docker-app.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Resolve ansible tags
        id: resolve-tags
        env:
          INPUT_PLAYBOOK: ${{ inputs.playbook }}
          INPUT_TAGS: ${{ inputs.tags }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: |
          pip install --quiet pyyaml

          if [ -n "$INPUT_TAGS" ]; then
            # A manually forced tag list defaults to both playbooks; pick
            # "docker" or "pi" in the dispatch form to target just one.
            # ansible-playbook --tags with no matching task is a no-op, so
            # forcing e.g. "immich" on both just runs nothing on docker.yml.
            docker_tags=""
            pi_tags=""
            case "$INPUT_PLAYBOOK" in
              docker) docker_tags="$INPUT_TAGS" ;;
              pi) pi_tags="$INPUT_TAGS" ;;
              *) docker_tags="$INPUT_TAGS"; pi_tags="$INPUT_TAGS" ;;
            esac
            echo "docker_tags=$docker_tags" >> "$GITHUB_OUTPUT"
            echo "pi_tags=$pi_tags" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          result="$(printf '%s\n' "$CHANGED_FILES" | python3 .github/scripts/resolve_docker_tags.py ansible/docker.yml ansible/pi.yml)"
          echo "Resolved: $result"

          docker_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/docker.yml"])' "$result")"
          pi_tags="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ansible/pi.yml"])' "$result")"

          echo "docker_tags=$docker_tags" >> "$GITHUB_OUTPUT"
          echo "pi_tags=$pi_tags" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install ansible + deps
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        # ansible-core is pinned: unpinned installs have hit a Python 3.12.13
        # argparse regression that crashes the ssh connection plugin's TTY
        # detection during "Gathering Facts" (argparse.ArgumentError: argument
        # -o: expected one argument). 2.20.1 matches the version already
        # verified to work in this repo's local .venv.
        run: pip install --quiet ansible-core==2.20.1 boto3 botocore passlib

      - name: Install sops
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        run: |
          version="$(curl -fsSL https://api.github.com/repos/getsops/sops/releases/latest | grep -oP '"tag_name": "\K[^"]+')"
          curl -fsSLo /usr/local/bin/sops "https://github.com/getsops/sops/releases/download/${version}/sops-${version}.linux.amd64"
          chmod +x /usr/local/bin/sops

      - name: Cache ansible-galaxy roles and collections
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        uses: actions/cache@v6
        with:
          path: |
            ansible/galaxy_roles
            ansible/collections
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install ansible roles and collections
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        working-directory: ansible
        # No --force: with the cache above restored, an already-satisfied
        # requirement is skipped instead of being re-downloaded every run.
        run: |
          ansible-galaxy role install -r requirements.yml
          ansible-galaxy collection install -r requirements.yml

      - name: Install network tools
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dnsutils

      - name: Start OLM
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        env:
          PANGOLIN_ENDPOINT: ${{ secrets.PANGOLIN_ENDPOINT }}
          OLM_ID: ${{ secrets.OLM_ID }}
          OLM_SECRET: ${{ secrets.OLM_SECRET }}
        run: |
          docker run -d --rm \
            --name olm \
            --network host \
            --cap-add=NET_ADMIN \
            --device /dev/net/tun:/dev/net/tun \
            -e PANGOLIN_ENDPOINT="$PANGOLIN_ENDPOINT" \
            -e OLM_ID="$OLM_ID" \
            -e OLM_SECRET="$OLM_SECRET" \
            -e OVERRIDE_DNS=true \
            fosrl/olm

      - name: Wait OLM startup
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        shell: bash
        run: |
          for i in {1..20}; do
            echo "Check $i/20"

            if docker logs olm 2>&1 | grep -q "DNS proxy started"; then
              echo "DNS proxy started"
              break
            fi

            docker logs --tail 5 olm || true
            sleep 2
          done

          if ! docker logs olm 2>&1 | grep -q "DNS proxy started"; then
            echo "OLM startup failed"
            docker logs olm
            exit 1
          fi

      # See .github/workflows/ping.yaml for why the runner's own resolver
      # needs to be pointed at the OLM DNS proxy directly.
      - name: Point host DNS at OLM tunnel
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        run: |
          sudo rm -f /etc/resolv.conf
          echo "nameserver 100.96.128.1" | sudo tee /etc/resolv.conf > /dev/null

      - name: Set up deploy SSH key
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ci_deploy_key"
          chmod 600 "$HOME/.ssh/ci_deploy_key"

      - name: Write CI inventory
        if: steps.resolve-tags.outputs.docker_tags != '' || steps.resolve-tags.outputs.pi_tags != ''
        working-directory: ansible
        run: |
          # inventory_hostname must stay "docker"/"pi" so host_vars/docker/*
          # and host_vars/pi/* still apply; only the connection address is
          # overridden to reach each host through the OLM tunnel.
          cat > ci-inventory.ini << 'EOF'
          [docker]
          docker ansible_host=docker-apps.internal

          [pi]
          pi ansible_host=pi.internal
          EOF

      - name: Deploy docker
        if: steps.resolve-tags.outputs.docker_tags != ''
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.docker_tags }}
        run: |
          # Extra vars are passed as a JSON object, not the flat "key=value"
          # shorthand: ansible's own key=value CLI parser re-splits on
          # whitespace, which silently truncated ansible_ssh_common_args to
          # just "-o" (everything after the first space, including the second
          # -o flag, was dropped and misparsed as unrelated top-level vars).
          ansible-playbook docker.yml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\"}"

      - name: Deploy pi
        if: steps.resolve-tags.outputs.pi_tags != ''
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TAGS: ${{ steps.resolve-tags.outputs.pi_tags }}
        run: |
          ansible-playbook pi.yml \
            -i ci-inventory.ini \
            --tags "$TAGS" \
            -e "{\"ansible_ssh_private_key_file\": \"$HOME/.ssh/ci_deploy_key\", \"ansible_ssh_common_args\": \"-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null\"}"

      - name: No matching role changed
        if: steps.resolve-tags.outputs.docker_tags == '' && steps.resolve-tags.outputs.pi_tags == ''
        run: echo "No ansible/roles/** change mapped to a docker.yml or pi.yml tag, nothing to deploy."

      - name: Cleanup
        if: always()
        run: |
          # Restore the runner's own resolver before tearing down OLM: the
          # "Point host DNS at OLM tunnel" step overwrote /etc/resolv.conf to
          # point solely at OLM's DNS proxy, replacing the symlink to
          # systemd-resolved's stub. Left in place after OLM is killed, the
          # runner is stuck with a dead resolver, which can hang the runner
          # agent's own post-job network calls (log upload, job completion)
          # indefinitely even though every step above reported success.
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf

          docker stop -t 0 olm || true
          rm -f "$HOME/.ssh/ci_deploy_key"

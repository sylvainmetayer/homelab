name: Secrets rotation

# Échéances de rotation des secrets SOPS (secrets-rotation.yaml, périodes par
# nature dans .github/scripts/check_secret_rotation.py), chaque lundi : un
# secret dû dans les 30 jours ou en retard fait échouer le run et passer le
# moniteur Uptime Kuma « Rotation des secrets » à « down » avec les noms des
# clés ; le détail est dans le résumé du run. Sans push pendant 8 jours
# (workflow désactivé, URL révoquée), il passe « down » aussi. Procédure :
# docs/runbooks/rotation-des-secrets.md. Il passe aussi « down » quand le
# dernier test de la clé age secours (dernier_test, en tête de
# docs/runbooks/test-cle-secours.md) a plus de 100 jours.
#
# Lundi 06:30 UTC, après le contrôle de la Storage Box (06:00). Aucune clé age :
# les noms des clés SOPS sont en clair, aucune valeur n'est déchiffrée.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-rotation
  cancel-in-progress: false

jobs:
  rotation:
    name: Check due dates
    runs-on: ubuntu-26.04
    # L'URL push seule, lisible depuis main seulement
    # (tofu/github/secrets_rotation_secrets.tf).
    environment: secrets-rotation
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: List due secrets
        env:
          PUSH_URL: ${{ secrets.SECRETS_ROTATION_PUSH_URL }}
        run: python3 -I .github/scripts/check_secret_rotation.py --due --window 30

name: Maintenance calendar

# Calendrier de la maintenance (échéances de rotation des secrets, restore
# tests, check data trimestriel, renouvellement des domaines), rendu par
# .github/scripts/maintenance_ics.py et déposé par maintenance_caldav.py dans
# le calendrier Nextcloud privé `maintenance-homelab` de sylvain, que DAVx5
# synchronise sur le téléphone (docs/architecture.md, « Le calendrier de
# maintenance »). Rien de publié : le calendrier liste des noms de secrets et
# leurs dates de rotation.
#
# CalDAV par /remote.php/* (ACCEPT de chemin sans SSO, de tout pays,
# website_nextcloud.tf), avec un mot de passe d'application Nextcloud
# (token_auth_enforced). Chaque lundi à 07:00 UTC, à chaque push de main qui
# touche une source du calendrier, et à la main.
on:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches:
      - main
    paths:
      - secrets-rotation.yaml
      - tofu/dns/**
      - .github/scripts/maintenance_ics.py
      - .github/scripts/maintenance_caldav.py
      - .github/scripts/check_secret_rotation.py
      - .github/workflows/maintenance-calendar.yaml
      - .github/workflows/restore-test.yaml
      - .github/workflows/borg-check.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintenance-calendar
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the Nextcloud calendar
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # Le mot de passe d'application seul, lisible depuis main seulement
    # (tofu/github/maintenance_calendar_secrets.tf).
    environment: maintenance-calendar
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upsert the events
        env:
          CALDAV_URL: https://sylvain.cloud/remote.php/dav/calendars/sylvain/maintenance-homelab/
          CALDAV_USER: sylvain
          CALDAV_PASSWORD: ${{ secrets.MAINTENANCE_CALDAV_APP_PASSWORD }}
        run: python3 -I .github/scripts/maintenance_caldav.py

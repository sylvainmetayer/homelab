name: Storage Box read-only access
description: >-
  Installe borg (version et sha256 des hôtes) et configure l'accès SSH au
  sous-compte Storage Box en lecture seule `restore-test` (BORG_RSH,
  BORG_REPO_BASE). Partagé par restore-test.yaml et borg-check.yaml.

inputs:
  ssh-key:
    description: Clé privée du sous-compte (secret RESTORE_TEST_SSH_KEY)
    required: true
  storage-box:
    description: <utilisateur>@<hôte> du sous-compte (secret RESTORE_TEST_STORAGE_BOX)
    required: true

runs:
  using: composite
  steps:
    # La version et le sha256 des hôtes (rôle borgmatic, Renovate les fait
    # monter ensemble) : un dépôt écrit par borg 1.x se lit avec borg 1.x.
    - name: Install borg
      shell: bash
      run: |
        defaults=ansible/roles/borgmatic/defaults/main.yml
        borg_version=$(sed -n 's/^borgmatic_borg_version: "\(.*\)"$/\1/p' "$defaults")
        borg_sha256=$(sed -n 's/^  x86_64: \([0-9a-f]\{64\}\)$/\1/p' "$defaults")
        curl --proto '=https' --tlsv1.2 -fsSLo /tmp/borg \
          "https://github.com/borgbackup/borg/releases/download/${borg_version}/borg-linux-glibc235-x86_64-gh"
        echo "${borg_sha256}  /tmp/borg" | sha256sum -c -
        sudo install -m 0755 /tmp/borg /usr/local/bin/borg
        borg --version

    # Sous-compte en lecture seule (tofu/pangolin/storage_box.tf), jamais
    # la clé du compte principal ni celle d'un hôte. Clé d'hôte épinglée,
    # la même que celle des hôtes (group_vars/all, backup_storage_box_host_key).
    # GITHUB_ENV : appelée seulement par des workflows schedule /
    # workflow_dispatch de main, jamais par un déclencheur de fork.
    - name: Configure the Storage Box access
      shell: bash
      env:
        RESTORE_TEST_SSH_KEY: ${{ inputs.ssh-key }}
        RESTORE_TEST_STORAGE_BOX: ${{ inputs.storage-box }}
      run: | # zizmor: ignore[github-env]
        host_key=$(sed -n 's/^backup_storage_box_host_key: "\(.*\)"$/\1/p' ansible/group_vars/all/variables.yml)
        test -n "$host_key"
        install -m 700 -d ~/.ssh
        (umask 077 && printf '%s\n' "$RESTORE_TEST_SSH_KEY" > ~/.ssh/restore_test)
        printf '[%s]:23 %s\n' "${RESTORE_TEST_STORAGE_BOX#*@}" "$host_key" > ~/.ssh/restore_test_known_hosts
        echo "BORG_RSH=ssh -i $HOME/.ssh/restore_test -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/restore_test_known_hosts" >> "$GITHUB_ENV"
        echo "BORG_REPO_BASE=ssh://${RESTORE_TEST_STORAGE_BOX}:23/." >> "$GITHUB_ENV"

  <path class="e e-tun" d="M250,345 H326" marker-end="url(#a-tun)"/>
  <text class="l-tun" x="290" y="335" text-anchor="middle">tofu/github</text>
  <path class="e e-tun" d="M550,345 H626" marker-end="url(#a-tun)"/>
  <text class="l-tun" x="590" y="335" text-anchor="middle">age, SSH</text>
  <path class="e e-tun" d="M850,345 H926" marker-end="url(#a-tun)"/>
  <text class="l-tun" x="890" y="335" text-anchor="middle">lance</text>
  <path class="e e-tun" d="M140,380 V412 H1050 V384" marker-end="url(#a-tun)"/>
  <text class="l-tun" x="595" y="432" text-anchor="middle">load_vars, depuis le poste de Sylvain</text>

  <path class="e e-req" d="M850,215 H1050 V307" marker-end="url(#a-req)"/>
  <text class="l-req" x="862" y="207">sorties de pangolin_config</text>
  <text class="l-req" x="862" y="232">lues par tofu output</text>
</svg>

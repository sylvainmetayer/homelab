  <rect class="node" x="30" y="180" width="220" height="70" rx="8"/>
  <text class="t" x="140" y="210" text-anchor="middle">Clés age</text>
  <text class="s" x="140" y="230" text-anchor="middle">perso, pro, secours, github-actions</text>
  <rect class="host" x="30" y="310" width="220" height="70" rx="8"/>
  <text class="t" x="140" y="340" text-anchor="middle">ansible.sops.yaml</text>
  <text class="s" x="140" y="360" text-anchor="middle">mots de passe des applis, Borg</text>

  <rect class="host" x="330" y="50" width="220" height="70" rx="8"/>
  <text class="t" x="440" y="80" text-anchor="middle">OpenTofu</text>
  <text class="s" x="440" y="100" text-anchor="middle">à la main, jamais par la CI</text>
  <rect class="host" x="630" y="50" width="220" height="70" rx="8"/>
  <text class="t" x="740" y="80" text-anchor="middle">Infra et routage</text>
  <text class="s" x="740" y="100" text-anchor="middle">Hetzner, Proxmox, DNS, Pangolin</text>
  <rect class="host" x="630" y="180" width="220" height="70" rx="8"/>
  <text class="t" x="740" y="210" text-anchor="middle">States chiffrés</text>
  <text class="s" x="740" y="230" text-anchor="middle">S3 OVH, un verrou par module</text>

  <rect class="host" x="330" y="310" width="220" height="70" rx="8"/>
  <text class="t" x="440" y="340" text-anchor="middle">Secrets GitHub</text>
  <text class="s" x="440" y="360" text-anchor="middle">environnement production</text>
  <rect class="host" x="630" y="310" width="220" height="70" rx="8"/>
  <text class="t" x="740" y="340" text-anchor="middle">CI de déploiement</text>
  <text class="s" x="740" y="360" text-anchor="middle">au merge sur main, tunnel OLM</text>
  <rect class="host" x="930" y="310" width="240" height="70" rx="8"/>
  <text class="t" x="1050" y="340" text-anchor="middle">Ansible</text>
  <text class="s" x="1050" y="360" text-anchor="middle">playbooks sur les vrais hôtes</text>

  <path class="e e-aux" d="M140,180 V123" marker-end="url(#a-aux)"/>
  <text class="s" x="150" y="156">déchiffre</text>
  <path class="e e-aux" d="M140,250 V307" marker-end="url(#a-aux)"/>
  <text class="s" x="150" y="284">déchiffre</text>

  <path class="e e-req" d="M250,85 H327" marker-end="url(#a-req)"/>
  <text class="l-req" x="290" y="77" text-anchor="middle">TF_VAR_*</text>
  <path class="e e-req" d="M550,85 H627" marker-end="url(#a-req)"/>
  <text class="l-req" x="590" y="77" text-anchor="middle">apply</text>
  <path class="e e-req" d="M440,120 V215 H627" marker-end="url(#a-req)"/>

<svg viewBox="0 0 1200 400" role="img" aria-label="À la maison, le nom public vise l'IP LAN du NAS ; dehors, le client Pangolin arrive par le Newt du NAS ; les deux chemins finissent au même Traefik, qui sert Jellyfin, UGOS et MediaManager." xmlns="http://www.w3.org/2000/svg">
<style>
/* Fichier autonome : ses couleurs suivent le thème du système, pas celui du site. */
:root{--surface:#ffffff;--node:#eef1f6;--zone-a:#e4e9f2;--zone-b:#e6efe9;--ink:#172033;--muted:#5b667a;--line:#c3cad6;--line-strong:#8e99ab;--req:#3b4fd8;--tun:#0b8068;--tun-soft:#d9f0ea;--bak:#a85d00;--display:system-ui,sans-serif;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--surface:#1a2130;--node:#232c3d;--zone-a:#151b27;--zone-b:#131d1b;--ink:#e6eaf2;--muted:#98a3b6;--line:#333e52;--line-strong:#55627a;--req:#8ea0ff;--tun:#4fd1b3;--tun-soft:#16352f;--bak:#f0b35a}}
.bg{fill:var(--surface)}
.zone-a { fill: var(--zone-a); stroke: var(--line); }
.zone-b { fill: var(--zone-b); stroke: var(--line); }
.host { fill: var(--surface); stroke: var(--line-strong); }
.node { fill: var(--node); stroke: var(--line); }
.chip { fill: var(--tun-soft); stroke: var(--tun); }
svg text { fill: var(--ink); font-size: 12px; }
svg .t { font-family: var(--display); font-weight: 600; font-size: 13.5px; }
svg .b { font-weight: 600; }
svg .s { fill: var(--muted); font-size: 11px; }
svg .h { fill: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
svg .z { fill: var(--muted); font-size: 12px; font-weight: 600; }
svg .c { font-size: 11px; font-weight: 600; fill: var(--tun); }
svg .l-req { fill: var(--req); font-size: 11.5px; font-weight: 500; }
svg .l-tun { fill: var(--tun); font-size: 11.5px; font-weight: 500; }
svg .l-bak { fill: var(--bak); font-size: 11.5px; font-weight: 500; }
.e { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.e-req { stroke: var(--req); stroke-width: 2; }
.e-tun { stroke: var(--tun); stroke-width: 3; }
.e-bak { stroke: var(--bak); stroke-width: 2; stroke-dasharray: 6 5; }
.e-aux { stroke: var(--line-strong); stroke-width: 1.5; }
.m-req { fill: var(--req); } .m-tun { fill: var(--tun); } .m-bak { fill: var(--bak); } .m-aux { fill: var(--line-strong); }
</style>
<defs>
          <marker id="a-req" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="m-req" d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="a-tun" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="m-tun" d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="a-bak" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="m-bak" d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="a-aux" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="m-aux" d="M0,0 L8,4 L0,8 z"/></marker>
        </defs>
<rect class="bg" width="100%" height="100%"/>
  <rect class="host" x="30" y="50" width="200" height="60" rx="8"/>
  <text class="t" x="130" y="76" text-anchor="middle">À la maison</text>
  <text class="s" x="130" y="94" text-anchor="middle">le A public vise l'IP LAN</text>
  <rect class="host" x="30" y="250" width="200" height="60" rx="8"/>
  <text class="t" x="130" y="276" text-anchor="middle">Dehors</text>
  <text class="s" x="130" y="294" text-anchor="middle">client Pangolin, rôle jellyfin</text>

  <rect class="zone-b" x="420" y="16" width="750" height="368" rx="12"/>
  <text class="t" x="436" y="40">NAS Ugreen · 192.168.1.137</text>
  <rect class="node" x="440" y="52" width="200" height="56" rx="6"/>
  <text class="b" x="540" y="76" text-anchor="middle">nas-proxy-443</text>
  <text class="s" x="540" y="93" text-anchor="middle">443 de l'hôte, réseau hôte</text>
  <rect class="chip" x="440" y="252" width="200" height="56" rx="6"/>
  <text class="b" x="540" y="276" text-anchor="middle">newt</text>
  <text class="s" x="540" y="293" text-anchor="middle">site nas</text>
  <rect class="host" x="700" y="140" width="200" height="80" rx="8"/>
  <text class="t" x="800" y="174" text-anchor="middle">nas-proxy (Traefik)</text>
  <text class="s" x="800" y="193" text-anchor="middle">TLS Let's Encrypt, DNS-01</text>

  <rect class="node" x="960" y="44" width="190" height="46" rx="6"/>
  <text class="b" x="1055" y="64" text-anchor="middle">Jellyfin</text>
  <text class="s" x="1055" y="80" text-anchor="middle">media.sylvain.cloud</text>
  <rect class="node" x="960" y="112" width="190" height="46" rx="6"/>
  <text class="b" x="1055" y="132" text-anchor="middle">Interface d'UGOS</text>
  <text class="s" x="1055" y="148" text-anchor="middle">nas.sylvain.cloud</text>
  <rect class="node" x="960" y="180" width="190" height="46" rx="6"/>
  <text class="b" x="1055" y="200" text-anchor="middle">MediaManager</text>
  <text class="s" x="1055" y="216" text-anchor="middle">à l'essai</text>
  <rect class="node" x="960" y="248" width="190" height="46" rx="6"/>
  <text class="b" x="1055" y="268" text-anchor="middle">qBittorrent, Prowlarr</text>
  <text class="s" x="1055" y="284" text-anchor="middle">Pocket ID, puis gluetun (VPN)</text>

  <path class="e e-req" d="M230,80 H437" marker-end="url(#a-req)"/>
  <text class="l-req" x="333" y="72" text-anchor="middle">port 443</text>
  <path class="e e-req" d="M130,110 V180 H697" marker-end="url(#a-req)"/>
  <text class="l-req" x="240" y="172">port 8443, publié par Docker</text>
  <path class="e e-tun" d="M230,280 H436" marker-end="url(#a-tun)"/>
  <text class="l-tun" x="333" y="270" text-anchor="middle">tunnel WireGuard</text>
  <text class="s" x="333" y="298" text-anchor="middle">par Gerbil, sur Pangolin</text>
  <path class="e e-req" d="M640,80 H800 V137" marker-end="url(#a-req)"/>
  <text class="l-req" x="652" y="72">TCP tel quel, PROXY v2</text>
  <path class="e e-tun" d="M640,280 H800 V224" marker-end="url(#a-tun)"/>
  <text class="l-tun" x="652" y="270">443 et 8443</text>

  <path class="e e-req" d="M900,165 L957,69" marker-end="url(#a-req)"/>
  <path class="e e-req" d="M900,175 L957,136" marker-end="url(#a-req)"/>
  <path class="e e-req" d="M900,185 L957,202" marker-end="url(#a-req)"/>
  <path class="e e-req" d="M900,195 L957,269" marker-end="url(#a-req)"/>

  <text class="s" x="436" y="364">Si UGOS reprend le 443 de l'hôte, seul le relais tombe : le 8443 répond toujours.</text>
</svg>

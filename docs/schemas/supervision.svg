<svg viewBox="0 0 1200 430" role="img" aria-label="Chaque hôte envoie ses mesures au hub Beszel, ses journaux à VictoriaLogs et ses push à Uptime Kuma, qui sonde aussi les applis ; les alertes partent par e-mail, ntfy et Telegram." xmlns="http://www.w3.org/2000/svg">
<style>
/* Fichier autonome : ses couleurs suivent le thème du système, pas celui du site. */
:root{--surface:#ffffff;--node:#eef1f6;--zone-a:#e4e9f2;--zone-b:#e6efe9;--ink:#172033;--muted:#5b667a;--line:#c3cad6;--line-strong:#8e99ab;--req:#3b4fd8;--tun:#0b8068;--tun-soft:#d9f0ea;--bak:#a85d00;--display:system-ui,sans-serif;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root{--surface:#1a2130;--node:#232c3d;--zone-a:#151b27;--zone-b:#131d1b;--ink:#e6eaf2;--muted:#98a3b6;--line:#333e52;--line-strong:#55627a;--req:#8ea0ff;--tun:#4fd1b3;--tun-soft:#16352f;--bak:#f0b35a}}
.bg{fill:var(--surface)}
.zone-a { fill: var(--zone-a); stroke: var(--line); }
.zone-b { fill: var(--zone-b); stroke: var(--line); }
.host { fill: var(--surface); stroke: var(--line-strong); }
.node { fill: var(--node); stroke: var(--line); }
.chip { fill: var(--tun-soft); stroke: var(--tun); }
svg text { fill: var(--ink); font-size: 12px; }
svg .t { font-family: var(--display); font-weight: 600; font-size: 13.5px; }
svg .b { font-weight: 600; }
svg .s { fill: var(--muted); font-size: 11px; }
svg .h { fill: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
svg .z { fill: var(--muted); font-size: 12px; font-weight: 600; }
svg .c { font-size: 11px; font-weight: 600; fill: var(--tun); }
svg .l-req { fill: var(--req); font-size: 11.5px; font-weight: 500; }
svg .l-tun { fill: var(--tun); font-size: 11.5px; font-weight: 500; }
svg .l-bak { fill: var(--bak); font-size: 11.5px; font-weight: 500; }
.e { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.e-req { stroke: var(--req); stroke-width: 2; }
.e-tun { stroke: var(--tun); stroke-width: 3; }
.e-bak { stroke: var(--bak); stroke-width: 2; stroke-dasharray: 6 5; }
.e-aux { stroke: var(--line-strong); stroke-width: 1.5; }
.m-req { fill: var(--req); } .m-tun { fill: var(--tun); } .m-bak { fill: var(--bak); } .m-aux { fill: var(--line-strong); }
</style>
<defs>
          <marker id="a-req" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="m-req" d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="a-tun" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path class="m-tun" d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="a-bak" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="m-bak" d="M0,0 L8,4 L0,8 z"/></marker>
          <marker id="a-aux" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path class="m-aux" d="M0,0 L8,4 L0,8 z"/></marker>
        </defs>
<rect class="bg" width="100%" height="100%"/>
  <rect class="host" x="30" y="50" width="300" height="355" rx="8"/>
  <text class="t" x="42" y="72">Chaque hôte</text>
  <text class="s" x="42" y="88">docker, pi, NAS, LXC, pve, pangolin, flip</text>
  <rect class="node" x="50" y="100" width="260" height="46" rx="6"/>
  <text class="b" x="180" y="120" text-anchor="middle">Agent Beszel</text>
  <text class="s" x="180" y="136" text-anchor="middle">CPU, mémoire, disques, S.M.A.R.T.</text>
  <rect class="node" x="50" y="188" width="260" height="46" rx="6"/>
  <text class="b" x="180" y="208" text-anchor="middle">Agent de journaux (Vector)</text>
  <text class="s" x="180" y="224" text-anchor="middle">journald et sortie des conteneurs</text>
  <rect class="node" x="50" y="282" width="260" height="46" rx="6"/>
  <text class="b" x="180" y="302" text-anchor="middle">Timers</text>
  <text class="s" x="180" y="318" text-anchor="middle">borgmatic, blocky-check, vzdump…</text>
  <rect class="node" x="50" y="347" width="260" height="46" rx="6"/>
  <text class="b" x="180" y="367" text-anchor="middle">Applis</text>
  <text class="s" x="180" y="383" text-anchor="middle">healthcheck derrière Pangolin</text>

  <rect class="host" x="470" y="50" width="300" height="210" rx="8"/>
  <text class="t" x="482" y="72">VM docker</text>
  <rect class="node" x="490" y="100" width="260" height="46" rx="6"/>
  <text class="b" x="620" y="120" text-anchor="middle">Hub Beszel</text>
  <text class="s" x="620" y="136" text-anchor="middle">monitoring.sylvain.cloud</text>
  <rect class="node" x="490" y="188" width="260" height="46" rx="6"/>
  <text class="b" x="620" y="208" text-anchor="middle">VictoriaLogs</text>
  <text class="s" x="620" y="224" text-anchor="middle">30 jours, derrière vmauth</text>

  <rect class="host" x="490" y="282" width="260" height="111" rx="8"/>
  <text class="t" x="620" y="322" text-anchor="middle">Uptime Kuma</text>
  <text class="s" x="620" y="342" text-anchor="middle">PikaPods, hors de la maison</text>
  <text class="s" x="620" y="358" text-anchor="middle">sondes HTTP et moniteurs push</text>

  <rect class="host" x="930" y="100" width="240" height="46" rx="8"/>
  <text class="b" x="1050" y="120" text-anchor="middle">E-mail</text>
  <text class="s" x="1050" y="136" text-anchor="middle">alertes de Beszel, avec Telegram</text>
  <rect class="host" x="930" y="188" width="240" height="46" rx="8"/>
  <text class="b" x="1050" y="208" text-anchor="middle">ntfy</text>
  <text class="s" x="1050" y="224" text-anchor="middle">relayé aux téléphones</text>
  <rect class="host" x="930" y="314" width="240" height="46" rx="8"/>
  <text class="b" x="1050" y="334" text-anchor="middle">Telegram</text>
  <text class="s" x="1050" y="350" text-anchor="middle">Kuma et Beszel, hors de Pangolin</text>

  <path class="e e-req" d="M310,123 H487" marker-end="url(#a-req)"/>
  <text class="l-req" x="400" y="115" text-anchor="middle">WebSocket sortante</text>
  <path class="e e-req" d="M310,211 H487" marker-end="url(#a-req)"/>
  <text class="l-req" x="400" y="203" text-anchor="middle">écriture seule</text>
  <path class="e e-req" d="M310,305 H487" marker-end="url(#a-req)"/>
  <text class="l-req" x="400" y="297" text-anchor="middle">push après succès</text>
  <path class="e e-req" d="M490,370 H313" marker-end="url(#a-req)"/>
  <text class="l-req" x="400" y="362" text-anchor="middle">sonde HTTP, 5 min</text>

  <path class="e e-bak" d="M750,123 H927" marker-end="url(#a-bak)"/>
  <text class="l-bak" x="840" y="115" text-anchor="middle">alertes d'hôte</text>
  <path class="e e-bak" d="M750,211 H927" marker-end="url(#a-bak)"/>
  <text class="l-bak" x="840" y="203" text-anchor="middle">log-alerts, 5 min</text>
  <path class="e e-bak" d="M750,337 H927" marker-end="url(#a-bak)"/>
  <text class="l-bak" x="840" y="354" text-anchor="middle">chaque moniteur</text>
  <path class="e e-bak" d="M840,337 V272 H1050 V237" marker-end="url(#a-bak)"/>
</svg>

---
# Le dossier docs/ publié en site statique privé sur docs.sylvain.cloud,
# derrière le SSO Pangolin : lire un runbook depuis un téléphone pendant une
# panne. Construit sur le contrôleur Ansible par le rôle docs_site (VM docker),
# vérifié par .github/scripts/mkdocs_build.py dans le workflow Lint. Zensical lit
# ce fichier directement (https://zensical.org/docs/compatibility/mkdocs/migration/).
#
# Construire : `uv run python .github/scripts/mkdocs_build.py --site-dir site`.
# Aperçu : `uv run zensical serve` (http://127.0.0.1:8000), sans les deux étapes
# de mkdocs_build.py : liens hors de docs/ morts, Mermaid depuis unpkg.com.
#
# Une nouvelle page s'ajoute à `nav:` ci-dessous : mkdocs_build.py échoue sinon.
site_name: Homelab
site_description: Documentation du homelab (architecture, runbooks, ADR)
site_url: https://docs.sylvain.cloud/
# Pas de repo_url : le thème interrogerait api.github.com depuis chaque
# navigateur (étoiles, forks), le site doit se suffire derrière le SSO.
# Un lien vers un fichier hors de docs/ (README d'un rôle, AGENTS.md...) est
# réécrit par mkdocs_build.py vers ce dépôt public.
extra:
  repo_blob_url: https://github.com/sylvainmetayer/homelab/blob/main
docs_dir: docs
strict: true

theme:
  # La variante qui garde l'apparence de Material for MkDocs.
  variant: classic
  name: material
  language: fr
  # Pas de Google Fonts : polices du système, rien de tiers au chargement
  # (le site est derrière le SSO, il doit marcher sans autre domaine).
  font: false
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Thème clair

plugins:
  - search:
      lang:
        - fr
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Un bloc ```mermaid devient un <pre class="mermaid"> que Zensical dessine ;
  # sans ce fence, il reste un bloc de code.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite


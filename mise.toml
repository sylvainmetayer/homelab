[tools]
opentofu = '1.13.1'
packer = 'latest'
sops = 'latest'
age = 'latest'
'github:github/copilot-cli' = 'latest'
uv = "latest"
python = "3.14.8"
"github:simulot/immich-go" = "latest"

[settings]
#python.uv_venv_auto = true

[tasks.info]
description = "Print project information"
run = '''
echo "Project: $PROJECT_NAME"
echo "Virtual Environment: $VIRTUAL_ENV"
'''

[env]
_.path = [".venv/bin"]

# Variable are available in the tasks
_.file = { path = "secrets.sops.yaml", redact = true}
# Use the project name derived from the current directory
PROJECT_NAME = "{{ config_root | basename }}"

[tasks.generate_password]
description = "Generate a password, to store it in the secrets file"
usage = '''
arg "<password>" help="plain password to hash"
'''
run = 'mkpasswd --method=SHA-512 --rounds=4096 ${usage_password}'

[tasks.init]
description = "Tofu Init (Pangolin)"
run = "tofu init"
dir = "tofu/pangolin"

[tasks.init-proxmox]
description = "Tofu Init (Proxmox)"
run = "tofu init"
dir = "tofu/proxmox"

[tasks.plan]
description = "Tofu Plan (Pangolin)"
run = "tofu plan"
dir = "tofu/pangolin"
depends = ["init"]

[tasks.plan-proxmox]
description = "Tofu Plan (Proxmox)"
run = "tofu plan"
dir = "tofu/proxmox"
depends = ["init-proxmox"]

[tasks.apply]
description = "Tofu Apply (Pangolin)"
run = "tofu apply"
raw = true
dir = "tofu/pangolin"
depends = ["init"]

[tasks.apply-proxmox]
description = "Tofu Apply (Proxmox)"
run = "tofu apply"
raw = true
dir = "tofu/proxmox"
depends = ["init-proxmox"]

# GITHUB_TOKEN à exporter avant (voir tofu/ref/README.md)
[tasks.init-ref]
description = "Tofu Init (ref.sylvain.dev)"
run = "tofu init"
dir = "tofu/ref"

[tasks.plan-ref]
description = "Tofu Plan (ref.sylvain.dev)"
run = "tofu plan"
dir = "tofu/ref"
depends = ["init-ref"]

[tasks.apply-ref]
description = "Tofu Apply (ref.sylvain.dev)"
run = "tofu apply"
raw = true
dir = "tofu/ref"
depends = ["init-ref"]

[tasks.lint]
description = "Tofu linting (all)"
run = "tofu fmt -check -recursive && cd pangolin && tofu validate && cd ../proxmox && tofu validate"
dir = "tofu"
depends = ["init", "init-proxmox"]

[tasks.fix-lint]
description = "Tofu linting fix (all)"
run = "tofu fmt -recursive"
dir = "tofu"

[tasks.get_state]
description = "Get the current state of the tofu deployment"
run = "tofu state pull > state.json"
dir = "tofu"

[tasks.packer-init]
description = "Initialize Packer plugins"
run = "packer init ."
dir = "packer/pangolin"

[tasks.packer-validate]
description = "Validate Packer configuration"
run = "packer validate ."
dir = "packer/pangolin"
depends = "packer-init"

[tasks.packer-build]
description = "Build Pangolin image with Packer"
run = "packer build ."
dir = "packer/pangolin"
depends = "packer-init"
raw = true

[tasks.ansible-lint]
description = "Lint Ansible playbooks"
run = "ansible-lint"
dir = "ansible"

[tasks.ansible-run]
description = "Run Ansible playbook"
run = "ansible-playbook -i inventory/hosts site.yml"
dir = "ansible"
raw = true

[tasks.ansible-check]
description = "Run Ansible playbook in check mode"
run = "ansible-playbook -i inventory/hosts site.yml --check"
dir = "ansible"
raw = true

[tasks.molecule-image]
description = "Build the Molecule test image (Debian 13 + systemd)"
run = "docker build --tag homelab-molecule:debian13 ansible/molecule/_shared"

[tasks.molecule]
description = "Molecule tests of the Ansible roles (all scenarios, or the one given)"
usage = '''
arg "[scenario]" help="scenario to run (= role name); every scenario when omitted"
'''
run = '''
if [ -n "${usage_scenario:-}" ]; then
  molecule test --scenario-name "${usage_scenario}"
else
  molecule test --all
fi
'''
dir = "ansible"
depends = ["molecule-image"]
raw = true

[tasks.tofu-test]
description = "tofu test of every module that has tests (mocked providers, no backend)"
run = '''
failed=""
for tests in */tests; do
  module=${tests%/tests}
  if [ -e "$tests/.disabled" ]; then
    echo "== $module: skipped, $(head -n1 "$tests/.disabled")"
    continue
  fi
  echo "== $module"
  if ! tofu -chdir="$module" init -backend=false -input=false > /dev/null; then
    failed="$failed $module(init)"
    continue
  fi
  tofu -chdir="$module" test || failed="$failed $module"
done
if [ -n "$failed" ]; then
  echo "Failed:$failed"
  exit 1
fi
'''
dir = "tofu"

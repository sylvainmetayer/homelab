[tools]
opentofu = '1.13.2'
sops = '3.13.3'
age = '1.3.2'
'github:github/copilot-cli' = '1.0.103'
uv = "0.13.5"
python = "3.14.8"
"github:simulot/immich-go" = "1.21.3"
'aqua:rhysd/actionlint' = '1.7.12'
'aqua:hadolint/hadolint' = '2.15.1'
'aqua:gitleaks/gitleaks' = '8.30.1'
# Lu par actionlint pour les scripts run: des workflows, comme sur le runner.
'aqua:koalaman/shellcheck' = '0.11.0'
# `mise run ssh-audit` ; même version que l'image Molecule (_shared/Dockerfile).
'pipx:ssh-audit' = '3.9.0'

[settings]
#python.uv_venv_auto = true

[env]
_.path = [".venv/bin"]

# Variable are available in the tasks
_.file = { path = "secrets.sops.yaml", redact = true}
# Use the project name derived from the current directory
PROJECT_NAME = "{{ config_root | basename }}"

[tasks.generate_password]
description = "Hash a host password (prompted, kept out of the shell history) for host_user_password_hash"
# raw : stdin relié au terminal, sinon mkpasswd attend une invite jamais affichée.
raw = true
run = 'mkpasswd --method=SHA-512 --rounds=4096'

[tasks.init]
description = "Tofu Init (Pangolin)"
run = "tofu init"
dir = "tofu/pangolin"

[tasks.init-proxmox]
description = "Tofu Init (Proxmox)"
run = "tofu init"
dir = "tofu/proxmox"

[tasks.plan]
description = "Tofu Plan (Pangolin)"
run = "tofu plan"
dir = "tofu/pangolin"
depends = ["init"]

[tasks.plan-proxmox]
description = "Tofu Plan (Proxmox)"
run = "tofu plan"
dir = "tofu/proxmox"
depends = ["init-proxmox"]

[tasks.apply]
description = "Tofu Apply (Pangolin)"
run = "tofu apply"
raw = true
dir = "tofu/pangolin"
depends = ["init"]

[tasks.apply-proxmox]
description = "Tofu Apply (Proxmox)"
run = "tofu apply"
raw = true
dir = "tofu/proxmox"
depends = ["init-proxmox"]

# GITHUB_TOKEN à exporter avant (voir tofu/ref/README.md)
[tasks.init-ref]
description = "Tofu Init (ref.sylvain.dev)"
run = "tofu init"
dir = "tofu/ref"

[tasks.plan-ref]
description = "Tofu Plan (ref.sylvain.dev)"
run = "tofu plan"
dir = "tofu/ref"
depends = ["init-ref"]

[tasks.apply-ref]
description = "Tofu Apply (ref.sylvain.dev)"
run = "tofu apply"
raw = true
dir = "tofu/ref"
depends = ["init-ref"]

# Mêmes modules que le job « OpenTofu lint » (lint.yaml), sans accès au
# state (-backend=false). TF_DATA_DIR jetable : un init -backend=false dans le
# .terraform du module le désinitialiserait, et tofu show (inventaire
# hetzner.py) échouerait ensuite sur « Backend configuration changed ».
[tasks.lint]
description = "Tofu linting: fmt and validate of every module the Lint workflow checks"
run = '''
set -e
tofu fmt -check -recursive
data_dir=$(mktemp -d)
trap 'rm -rf "$data_dir"' EXIT
for module in pangolin proxmox pangolin_config dns github ref s3_state site 1y; do
  echo "== $module"
  TF_DATA_DIR="$data_dir/$module" tofu -chdir="$module" init -backend=false -input=false -lockfile=readonly > /dev/null
  TF_DATA_DIR="$data_dir/$module" tofu -chdir="$module" validate
  rm -rf "${data_dir:?}/$module"
done
'''
dir = "tofu"

[tasks.fix-lint]
description = "Tofu linting fix (all)"
run = "tofu fmt -recursive"
dir = "tofu"

[tasks.ansible-lint]
description = "Lint Ansible playbooks"
run = "ansible-lint"
dir = "ansible"

[tasks.molecule-image]
description = "Build the Molecule test image (Debian 13 + systemd)"
run = "docker build --tag homelab-molecule:debian13 ansible/molecule/_shared"

[tasks.molecule]
description = "Molecule tests of the Ansible roles (all scenarios, or the one given)"
usage = '''
arg "[scenario]" help="scenario to run (= role name); every scenario when omitted"
'''
run = '''
if [ -n "${usage_scenario:-}" ]; then
  molecule test --scenario-name "${usage_scenario}"
else
  molecule test --all
fi
'''
dir = "ansible"
depends = ["molecule-image"]
raw = true

[tasks.tofu-test]
description = "tofu test of every module that has tests (mocked providers, no backend)"
run = '''
failed=""
for tests in */tests; do
  module=${tests%/tests}
  if [ -e "$tests/.disabled" ]; then
    echo "== $module: skipped, $(head -n1 "$tests/.disabled")"
    continue
  fi
  echo "== $module"
  if ! tofu -chdir="$module" init -backend=false -input=false > /dev/null; then
    failed="$failed $module(init)"
    continue
  fi
  tofu -chdir="$module" test || failed="$failed $module"
done
if [ -n "$failed" ]; then
  echo "Failed:$failed"
  exit 1
fi
'''
dir = "tofu"

[tasks.lint-ci]
description = "Lint the GitHub workflows and the Molecule Dockerfile, as the CI lint job does"
run = '''
uvx --no-build zizmor==1.30.1 --offline .github/workflows
actionlint
hadolint ansible/molecule/_shared/Dockerfile
'''

[tasks.ssh-audit]
description = "Check the sshd of docker, pi, newt-lxc and Pangolin against the security role's ssh-audit policy (from the LAN; no login)"
# Une passe par hôte, sans authentification ; --skip-rate-test évite la rafale
# du test DHEat. docker, pi et newt-lxc n'ouvrent le 22 qu'au LAN. flip, sans
# IP publique, n'y est pas : le scénario security_flip couvre son sshd.
run = '''
rc=0
for host in 192.168.1.216 192.168.1.96 192.168.1.200 pangolin.sylvain.cloud; do
  ssh-audit --no-colors --skip-rate-test --policy ansible/molecule/security/files/ssh-audit-policy.txt "$host" || rc=1
done
exit "$rc"
'''

[tasks.secrets-scan]
description = "Scan the whole git history for secrets (gitleaks, .gitleaks.toml); the pre-commit hook covers staged changes"
run = "gitleaks git . --no-banner --redact"

[tasks.install-hooks]
description = "Install a pre-commit hook that runs gitleaks on the staged changes"
run = '''
hook=.git/hooks/pre-commit
printf '%s\n' '#!/bin/sh' 'exec mise exec -- gitleaks git --pre-commit --staged --no-banner --redact .' > "$hook"
chmod 0755 "$hook"
echo "pre-commit hook installed: $hook"
'''


#cloud-config
# Serveur de la démo publique (demo_planning.tf) : de quoi laisser Ansible se
# connecter, comme flip (sans NAT configuré, il n'a pas encore Internet : le
# rôle nat_client le pose en premier, ansible/demo-planning.yml), plus sa clé
# d'hôte, tirée du state.
users:
  - name: sylvain
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - ${public_ssh_key}

ssh_pwauth: false
disable_root: true
ssh_deletekeys: true
ssh_genkeytypes: [ed25519]
ssh_keys:
  ed25519_private: |
    ${indent(4, host_private_key)}
  ed25519_public: ${host_public_key}

[project]
name = "homelab"
version = "0.1.0"
description = "Ansible playbooks to setup and configure various hosts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible>=14.5.0",
    "ansible-lint>=26.10.1",
    "boto3>=1.43.24",
    "botocore>=1.43.24",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
    "passlib>=1.7.4",
]

[dependency-groups]
# Tests Molecule des rôles Ansible (ansible/molecule/, workflow test.yaml).
test = [
    "docker>=7.1.0",
    "molecule>=26.9.0",
    "molecule-plugins[docker]>=26.9.28",
]

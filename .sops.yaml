# Une règle par fichier, la plus précise en premier (sops prend la première
# qui correspond). Les fichiers vivent dans le sous-module secrets/ (dépôt
# privé homelab-secrets, ADR 0018) : lancer sops depuis la racine de ce dépôt,
# qui porte cette configuration. La clé github-actions (SOPS_AGE_KEY de la CI
# de déploiement) ne déchiffre que les secrets d'Ansible : les jetons cloud
# de secrets/secrets.sops.yaml (Hetzner, OVH, Cloudflare, Proxmox, S3) lui
# restent fermés.
# Après un changement ici : sops updatekeys <fichier>, puis sops rotate -i.
# Destinataires age post-quantiques uniquement (age1pq1…, ML-KEM-768 +
# X25519, age >= 1.3, sops >= 3.12) depuis le 30/10/2026 : un seul destinataire
# X25519 suffirait à exposer la clé de données à un futur calculateur
# quantique.
creation_rules:
  - path_regex: (^|/)secrets/ansible\.sops\.yaml$
    key_groups:
      - age:
          -  # perso
          -  # pro
          -  # github-actions
          -  # secours
  - path_regex: (^|/)secrets/secrets\.sops\.yaml$
    key_groups:
      - age:
          -  # perso
          -  # pro
          -  # secours

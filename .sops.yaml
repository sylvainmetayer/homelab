# Une règle par fichier, la plus précise en premier (sops prend la première
# qui correspond). La clé github-actions (SOPS_AGE_KEY de la CI de
# déploiement) ne déchiffre que les secrets d'Ansible : les jetons cloud du
# fichier racine (Hetzner, OVH, Cloudflare, Proxmox, S3) lui restent fermés.
# Après un changement ici : sops updatekeys <fichier>, puis sops rotate -i.
creation_rules:
  - path_regex: (^|/)ansible/secrets\.sops\.yaml$
    key_groups:
      - age:
          - age1pvr43f8dnpsq7swgc0r3cy799yvyk2y4wj8z3n57sckq3z6dx5yq4rntuu # perso
          - age16rspnzt6j2qxa2587t6umh9qykrqu2amrr0hx9xt2z7elyky3a3q4p5s7l # pro
          - age140shtqa48n26q833upzj0yuentupxy8wcz0w0l3w3jhc7975t5as4umhx9 # github-actions
  - path_regex: (^|/)secrets\.sops\.yaml$
    key_groups:
      - age:
          - age1pvr43f8dnpsq7swgc0r3cy799yvyk2y4wj8z3n57sckq3z6dx5yq4rntuu # perso
          - age16rspnzt6j2qxa2587t6umh9qykrqu2amrr0hx9xt2z7elyky3a3q4p5s7l # pro

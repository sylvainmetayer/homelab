# Inventaire de rotation des secrets SOPS : une entrée par clé de
# secrets.sops.yaml (Tofu, mise) et d'ansible/secrets.sops.yaml (playbooks).
# La date vit ici, en clair : ni dans la valeur chiffrée, ni dans un
# commentaire du fichier SOPS (chiffré lui aussi).
#
# kind et période (.github/scripts/check_secret_rotation.py, KINDS) :
#   provider     jeton d'API cloud/fournisseur           chaque année
#   application  clé, jeton, mot de passe d'application  tous les deux ans
#   database     mot de passe de base                    sur incident
#   encryption   clé de chiffrement de données           sur incident
#   identifier   identifiant, adresse, IP : pas un secret, ni date ni lien
#
# last_rotated : dernière rotation (AAAA-MM-JJ). estimated: true = lue dans
# l'historique git (dernier commit qui a changé la valeur chiffrée de la clé,
# re-chiffrements complets du fichier exclus), pas une rotation connue.
# Après une rotation : la date du jour et estimated: false.
# how : la procédure (docs/runbooks/rotation-des-secrets.md).
#
# Le Lint échoue sur une clé SOPS absente d'ici ou une entrée sans clé ; le
# workflow Secrets rotation pousse « down » au moniteur « Rotation des
# secrets » 30 jours avant chaque échéance. Format : ce sous-ensemble de YAML
# seulement (le script le lit sans bibliothèque).
secrets:
  # --- secrets.sops.yaml ---
  - key: AWS_ACCESS_KEY_ID
    file: secrets.sops.yaml
    kind: provider
    last_rotated: 2026-10-23
    estimated: false

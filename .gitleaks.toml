# gitleaks (mise run secrets-scan, hook pre-commit) : règles par défaut, plus
# les faux positifs connus de ce dépôt, chacun avec sa raison.
[extend]
useDefault = true

# La règle par défaut age-secret-key ne connaît que AGE-SECRET-KEY-1… :
# une clé post-quantique (age-keygen -pq, AGE-SECRET-KEY-PQ-1…) passerait.
[[rules]]
id = "age-secret-key-pq"
description = "Clé secrète age post-quantique (ML-KEM-768 + X25519)"
regex = '''AGE-SECRET-KEY-PQ-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'''
keywords = ["age-secret-key-pq-1"]

[[allowlists]]
description = "Fichiers chiffrés par SOPS et valeurs factices des tests"
paths = [
  '''(^|/)[^/]*\.sops\.yaml$''',
  '''^ansible/molecule/_shared/vars/fake_secrets\.yml$''',
  '''^tofu/[^/]+/tests/[^/]+\.tftest\.hcl$''',
]

[[allowlists]]
description = "Code tiers installé localement (collections Ansible, providers Tofu)"
paths = [
  '''^ansible/(\.ansible/)?collections/''',
  '''(^|/)\.terraform/''',
]

[[allowlists]]
description = "Clé publique PostHog de Flip Planning (phc_…), publique par conception (navigateur)"
regexes = ['''phc_[A-Za-z0-9]+''']

[[allowlists]]
description = "Ancienne clé de la Storage Box (SHA256:EBo5Vy…), commitée puis retirée en avril 2026 ; autorisée nulle part (vérifié le 23/10/2026)"
commits = ["1f3c0a15879d979a10133ea10bce97f7eafa61a2"]

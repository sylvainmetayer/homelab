---
name: immich_remote_ml
services:
  immich-server-remote:
    security_opt:
      - no-new-privileges:true
    container_name: immich_server
    # Poste de travail, usage ponctuel : plafonds larges, jamais mesurés.
    mem_limit: 4g
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    volumes:
      - ./library:/data # Mount SSHFS first !!
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    restart: unless-stopped
  immich-machine-learning:
    security_opt:
      - no-new-privileges:true
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    mem_limit: 6g
    volumes:
      - model-cache:/cache
    restart: always
    # Sur le poste seulement : ce port n'a pas d'authentification.
    ports:
      - 127.0.0.1:3003:3003

volumes:
  model-cache:
